title: "RDP from Unmanaged Endpoint in Managed Subnet \u2014 RDP from Unmanaged Endpoint"
id: ttp-2026-0353-bioc-01
status: experimental
description: |
  Detection of RDP activity originating from an endpoint not recognized as managed within the subnet.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK_CONNECTION and event_sub_type = ENUM.NETWORK_CONNECT
    | filter action_remote_ip != null and dst_port = 3389
    | filter actor_process_image_name contains 'rdpclient.exe'
    | comp count() as events by action_remote_ip, agent_hostname
    | sort desc events
  ----
references:
  - https://attack.mitre.org/techniques/T1021/
author: CortexSim detection_scanner
tags:
    - attack.t1021.001
    - attack.t1071.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
