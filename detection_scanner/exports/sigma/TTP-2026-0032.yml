title: "Linux Credential Dumping \u2014 /etc/shadow and Mimipenguin (T1003.008) \u2014 EDR-001 Shadow File Read by Non-Root Service Account"
id: ttp-2026-0032-bioc-01
status: experimental
description: |
  Credential file access — /etc/shadow read attempt from non-root service account (www-data). A process not owned by root opens /etc/shadow, the Linux hashed-credential store.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    preset = xdr_data
    | filter event_type = ENUM.FILE
    | filter action_file_path = "/etc/shadow"
    | filter actor_effective_username not in ("root")
    | filter actor_process_image_name in ("cat", "unshadow", "head", "less", "more", "dd", "cp", "awk", "python3", "perl")
  ----
references:
  - https://attack.mitre.org/techniques/T1003/
author: CortexSim detection_scanner
tags:
    - attack.t1003.008
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
