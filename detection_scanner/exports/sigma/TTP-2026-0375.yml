title: "Signed Process DLL Injection via Rundll32 \u2014 Unpopular DLL Injection by Signed Process"
id: ttp-2026-0375-abioc-02
status: experimental
description: |
  Detection of a signed process performing a DLL injection that is not typical for that process
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name IN ('rundll32.exe', 'msiexec.exe')
    | filter action_file_path CONTAINS '.dll'
    | filter action_file_path NOT IN ('C:\\Windows\\System32\\', 'C:\\Windows\\SysWOW64\\')
    | filter action_file_path NOT IN (SELECT DISTINCT action_file_path FROM xdr_data WHERE actor_process_image_name = 'rundll32.exe' AND event_type = ENUM.PROCESS)
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
