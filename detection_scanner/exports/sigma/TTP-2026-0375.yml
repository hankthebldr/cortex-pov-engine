title: "Signed Process DLL Injection via Rundll32 \u2014 Signed Process DLL Injection"
id: ttp-2026-0375-bioc-01
status: experimental
description: |
  A signed process such as rundll32.exe performs an uncommon DLL injection into a target process
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name IN ('rundll32.exe', 'msiexec.exe')
    | filter action_file_path CONTAINS '.dll'
    | filter action_file_path NOT IN ('C:\\Windows\\System32\\', 'C:\\Windows\\SysWOW64\\')
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1055.001
    - attack.t1073.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
