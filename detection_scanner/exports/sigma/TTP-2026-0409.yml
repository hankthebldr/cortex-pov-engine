title: "RDP Connection to Localhost with Credential Harvesting \u2014 Suspicious RDP Connection to Localhost"
id: ttp-2026-0409-bioc-01
status: experimental
description: |
  Detection of RDP connection initiated to localhost (127.0.0.1) with non-local IP address
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK_CONNECTION and event_sub_type = ENUM.NETWORK_CONNECT
    | filter action_remote_ip = '127.0.0.1' and dst_port = 3389
    | filter causality_actor_process_image_name != 'svchost.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1076/
author: CortexSim detection_scanner
tags:
    - attack.t1076
    - attack.t1046
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
