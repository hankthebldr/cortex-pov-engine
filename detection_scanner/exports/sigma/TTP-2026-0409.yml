title: "RDP Connection to Localhost with Credential Harvesting \u2014 RDP Session with Non-Standard Process"
id: ttp-2026-0409-abioc-02
status: experimental
description: |
  RDP connection followed by process execution not typically associated with RDP sessions
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK_CONNECTION and event_sub_type = ENUM.NETWORK_CONNECT
    | filter action_remote_ip = '127.0.0.1' and dst_port = 3389
    | join with process_start on session_id
    | filter action_process_image_name != 'mstsc.exe' and action_process_image_name != 'svchost.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1076/
author: CortexSim detection_scanner
tags:
    - attack.t1076
    - attack.t1046
    - attack.t1003
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
