title: "Remote Command Execution via WMIC.exe \u2014 WMIC Remote Command Execution"
id: ttp-2026-0360-bioc-01
status: experimental
description: |
  Detection of wmic.exe being invoked with command-line arguments that indicate remote command execution or process creation
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'wmic.exe'
    | filter action_process_command_line contains 'win32_process call create'
    | filter action_process_command_line contains 'powershell.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1047/
author: CortexSim detection_scanner
tags:
    - attack.t1047
    - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
