title: "Kerberos Traffic from Non-Standard Process \u2014 Kerberos Traffic from Non-Standard Process"
id: ttp-2026-0288-bioc-01
status: experimental
description: |
  Detection of Kerberos traffic initiated from a process not typically used for authentication
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK and event_sub_type = ENUM.NETWORK_CONNECTION
    | filter dst_port = 88
    | filter actor_process_image_name != 'lsass.exe' and actor_process_image_name != 'klist.exe'
    | filter action_remote_ip in (192.0.2.0/24)
  ----
references:
  - https://attack.mitre.org/techniques/T1558/
author: CortexSim detection_scanner
tags:
    - attack.t1558.003
    - attack.t1078.002
    - attack.t1566.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
