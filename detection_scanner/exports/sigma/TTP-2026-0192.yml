title: "CL-STA-0969 Telecom Intrusion \u2014 AuthDoor PAM Backdoor, GTPDoor / EchoBackdoor Covert C2 and Reverse SSH Tunnels (T1556.003 / T1205 / T1572) \u2014 MP-033 SSH Client Fan-Out Across Default Accounts to One Host"
id: ttp-2026-0192-bioc-01
status: experimental
description: |
  One causality starts the ssh client against one destination with four or more distinct account names in a short window — dictionary attempts with built-in account names.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter lowercase(action_process_image_name) = "ssh"
    | alter target = arrayindex(regextract(action_process_image_command_line, "([A-Za-z0-9._-]+)@([A-Za-z0-9._:-]+)"), 0)
    | alter acct = arrayindex(split(target, "@"), 0), dest = arrayindex(split(target, "@"), 1)
    | filter acct != null
    | comp count_distinct(acct) as accounts, count() as attempts by agent_hostname, causality_actor_process_instance_id, dest
    | filter accounts >= 4
  ----
references:
  - https://attack.mitre.org/techniques/T1110/
author: CortexSim detection_scanner
tags:
    - attack.t1110.001
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: medium
