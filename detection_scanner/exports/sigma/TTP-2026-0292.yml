title: "LOLBAS executable injects into another process \u2014 LOLBAS Process Injection"
id: ttp-2026-0292-bioc-01
status: experimental
description: |
  Detection of suspicious process injection via legitimate Windows binaries
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'rundll32.exe' or actor_process_image_name = 'wmic.exe' or actor_process_image_name = 'regsvr32.exe'
    | filter action_process_image_name = 'inject.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1055/
author: CortexSim detection_scanner
tags:
    - attack.t1055
    - attack.t1055.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
