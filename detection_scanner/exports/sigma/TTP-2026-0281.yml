title: "Suspicious HTTP Request with Encoded Command Execution \u2014 HTTP Request to Suspicious IP with Encoded Command"
id: ttp-2026-0281-bioc-01
status: experimental
description: |
  Detects HTTP request to a known suspicious IP with encoded command in user-agent or URL
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK
    | filter action_remote_ip = '192.0.2.50'
    | filter action_protocol = ENUM.HTTP
    | filter action_user_agent contains 'encoded'
    | filter action_url contains 'cmd'
  ----
references:
  - https://attack.mitre.org/techniques/T1071/
author: CortexSim detection_scanner
tags:
    - attack.t1071.001
    - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
