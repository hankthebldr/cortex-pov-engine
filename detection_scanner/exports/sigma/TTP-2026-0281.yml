title: "Suspicious HTTP Request with Encoded Command Execution \u2014 Suspicious Process Execution After HTTP Download"
id: ttp-2026-0281-abioc-02
status: experimental
description: |
  Detects execution of a process downloaded via HTTP from a suspicious IP
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name contains '.tmpfile'
    | filter action_remote_ip = '192.0.2.50'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1071.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
