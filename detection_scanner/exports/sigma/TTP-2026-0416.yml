title: "AppleScript Credential Access via Command Line \u2014 Uncommon AppleScript Execution"
id: ttp-2026-0416-bioc-01
status: experimental
description: |
  Execution of osascript with unusual parameters or from unexpected locations
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'osascript'
    | filter causality_actor_process_image_name != 'bash'
    | filter causality_actor_process_image_name != 'zsh'
    | filter causality_actor_process_image_name != 'sh'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1552.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
