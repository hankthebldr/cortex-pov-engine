title: "Uncommon WPAD Query Execution via PowerShell \u2014 Uncommon WPAD Query Behavior"
id: ttp-2026-0462-abioc-02
status: experimental
description: |
  Behavioral deviation of PowerShell querying WPAD settings in an uncommon context
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK_CONNECTION
    | filter dst_port = 80
    | filter dst_ip = '192.0.2.50'
    | filter action_process_image_name = 'powershell.exe'
    | filter action_file_path contains 'wpad'
  ----
references:
