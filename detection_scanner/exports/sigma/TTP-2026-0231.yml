title: "DLL Hijacking via Uncommon Vendor Signed DLL in Microsoft Process \u2014 Uncommon Vendor Signed DLL Loaded into Microsoft Process"
id: ttp-2026-0231-bioc-01
status: experimental
description: |
  Detection of a DLL signed by an uncommon vendor loaded into a Microsoft process such as regsvr32.exe
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'C:\\Windows\\System32\\regsvr32.exe'
    | filter action_file_path contains 'hijack.dll'
    | filter action_file_path contains 'Temp'
    | filter causality_actor_process_image_name = 'C:\\Windows\\System32\\regsvr32.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1574/
author: CortexSim detection_scanner
tags:
    - attack.t1574.002
    - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
