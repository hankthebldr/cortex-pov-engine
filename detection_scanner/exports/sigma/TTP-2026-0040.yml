title: "ITDR \u2014 Session Token Replay Across Geo / User-Agent \u2014 ITDR-004 Replay Marker Boolean Explicit Match"
id: ttp-2026-0040-bioc-02
status: experimental
description: |
  ITDR — replay_marker boolean fires explicit detection rule. Keys on the explicit replay_marker the emulator stamps on the reused-session event so the replay is unambiguously attributable to the token-replay pattern.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = okta_sso
    | filter eventType = "user.session.start"
    | filter replay_marker = true or _raw_log contains "\"replay_marker\": true"
    | fields _time, actor_effective_username, session_token_id, src_ip, src_geo_country, user_agent
  ----
references:
  - https://attack.mitre.org/techniques/T1550/
author: CortexSim detection_scanner
tags:
    - attack.t1550.004
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
