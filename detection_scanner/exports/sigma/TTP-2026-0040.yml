title: "ITDR \u2014 Session Token Replay Across Geo / User-Agent \u2014 ITDR-004 Pre-Flight idp_signin_emulator Metadata Visible"
id: ttp-2026-0040-bioc-01
status: experimental
description: |
  Pre-flight: idp_signin_emulator metadata visible to operator. Confirms the EAL plugin is registered and exposes token_replay targets before the token is issued, so a null downstream result is a harness fault rather than a detection miss.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = okta_sso
    | filter eventType = "user.session.start" or _raw_log contains "token_replay"
    | comp count() as preflight_events by actor_effective_username
    | filter preflight_events >= 0
  ----
references:
  - https://attack.mitre.org/techniques/T1539/
author: CortexSim detection_scanner
tags:
    - attack.t1539
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: medium
