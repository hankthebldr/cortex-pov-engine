title: "WinRM Remote Management Activity with PowerShell \u2014 Rare Windows Remote Management (WinRM) HTTP Activity"
id: ttp-2026-0350-bioc-01
status: experimental
description: |
  Detection of unusual WinRM HTTP activity originating from a host
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK_CONNECTION and event_sub_type = ENUM.NETWORK_CONNECTION_ESTABLISHED
    | filter dst_port = 5985 and action_remote_ip in ('192.0.2.10')
    | filter causality_actor_process_image_name != 'winrm.exe'
    | filter actor_process_image_name != 'powershell.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1021.006
    - attack.t1046
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
