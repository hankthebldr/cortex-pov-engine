title: "Jumpy Pisces to Play Ransomware Hand-off \u2014 SMB Tool Transfer, Sliver C2, EDR Removal, Impact (T1021.002 / T1071.001 / T1562.001 / T1486) \u2014 MP-030 Discovery Burst Staged into Public Music Folder"
id: ttp-2026-0189-bioc-01
status: experimental
description: |
  Account and host discovery binaries (whoami /all, net localgroup, quser, nltest) whose output is redirected into C:\Users\Public\Music — the staging folder the report and Adlumin tie to Play-affiliated intrusions (TokenPlayer and PsExec were found there).
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    preset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name in ("whoami.exe", "net.exe", "net1.exe", "quser.exe", "nltest.exe")
    | filter actor_process_command_line contains "Public\\Music" or action_process_image_command_line contains "Public\\Music"
    | comp count_distinct(action_process_image_name) as discovery_tools by agent_hostname, causality_actor_process_image_name, causality_id
    | filter discovery_tools >= 2
    | fields agent_hostname, causality_actor_process_image_name, causality_id, discovery_tools
  ----
references:
  - https://attack.mitre.org/techniques/T1033/
author: CortexSim detection_scanner
tags:
    - attack.t1033
    - attack.t1069.001
    - attack.t1074.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: medium
