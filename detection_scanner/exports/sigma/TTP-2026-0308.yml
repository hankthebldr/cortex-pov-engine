title: "Multiple Rare LOLBIN Process Executions by User \u2014 Multiple Rare LOLBIN Process Executions"
id: ttp-2026-0308-bioc-01
status: experimental
description: |
  Detection of multiple rare LOLBINs executed by a single user within a short time window
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name in ['mshta.exe', 'wmic.exe', 'rundll32.exe']
    | comp count() as cnt by actor_user_name, action_process_image_name
    | comp count() as cnt by
    | filter count > 1
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1047
    - attack.t1086
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
