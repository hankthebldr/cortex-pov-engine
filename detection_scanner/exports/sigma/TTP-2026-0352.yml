title: "RDP Connection to Localhost with Remote Command Execution \u2014 RDP Connection to Localhost"
id: ttp-2026-0352-bioc-01
status: experimental
description: |
  Detection of RDP connection to localhost (127.0.0.1)
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK
    | filter action_remote_ip = '127.0.0.1' and dst_port = 3389
    | filter causality_actor_process_image_name = 'mstsc.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1021/
author: CortexSim detection_scanner
tags:
    - attack.t1021.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
