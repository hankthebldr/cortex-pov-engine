title: "RDP Connection to Localhost with Remote Command Execution \u2014 RDP to Localhost followed by PowerShell Execution"
id: ttp-2026-0352-abioc-02
status: experimental
description: |
  Behavioral deviation where an RDP connection to localhost is followed by PowerShell execution
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK and action_remote_ip = '127.0.0.1' and dst_port = 3389
    | filter event_type = ENUM.PROCESS and action_process_image_name = 'powershell.exe'
    | join by causality_actor_process_image_name
  ----
references:
  - https://attack.mitre.org/techniques/T1021/
author: CortexSim detection_scanner
tags:
