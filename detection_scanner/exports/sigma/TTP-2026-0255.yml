title: "Cached Credentials Discovery via cmdkey \u2014 Cached Credentials Discovery with cmdkey"
id: ttp-2026-0255-bioc-01
status: experimental
description: |
  Detection of cmdkey.exe being executed with /list flag to enumerate cached credentials
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'cmdkey.exe'
    | filter action_process_command_line contains '/list'
  ----
references:
  - https://attack.mitre.org/techniques/T1003/
author: CortexSim detection_scanner
tags:
    - attack.t1003.005
    - attack.t1059.001
    - attack.t1547.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
