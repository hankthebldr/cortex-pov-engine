title: "Cached Credentials Discovery via cmdkey \u2014 Suspicious cmdkey usage for credential enumeration"
id: ttp-2026-0255-abioc-02
status: experimental
description: |
  Behavioral deviation where cmdkey is used to list cached credentials without typical user context
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'cmdkey.exe'
    | filter action_process_command_line contains '/list'
    | filter actor_process_image_name != 'explorer.exe'
    | filter actor_process_image_name != 'cmd.exe'
  ----
