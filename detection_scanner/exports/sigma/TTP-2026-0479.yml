title: "Unusual DB Process Spawning a Shell \u2014 Unusual DB process spawning a shell"
id: ttp-2026-0479-bioc-01
status: experimental
description: |
  Detects when a database process such as mysqld spawns a shell process
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'mysqld' and action_process_image_name = '/tmp/scratch/db_shell'
    | filter causality_actor_process_image_name = 'mysqld'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1071.004
    - attack.t1105
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
