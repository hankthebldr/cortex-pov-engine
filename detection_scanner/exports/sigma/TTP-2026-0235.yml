title: "Abnormal Login with Remote Command Execution \u2014 Anomalous Login with PowerShell Execution"
id: ttp-2026-0235-abioc-02
status: experimental
description: |
  Detection of login from abnormal ASN followed by PowerShell process start
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'powershell.exe'
    | filter causality_actor_process_image_name = 'svchost.exe'
    | filter action_remote_ip in ('192.0.2.10')
  ----
references:
  - https://attack.mitre.org/techniques/T1078/
