title: "Kerberos Ticket Request with Weak Encryption \u2014 Weakly Encrypted Kerberos Ticket Requested"
id: ttp-2026-0488-bioc-01
status: experimental
description: |
  Detection of a Kerberos ticket request with weak encryption settings
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'klist.exe'
    | filter action_file_path contains 'klist.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1558/
author: CortexSim detection_scanner
tags:
    - attack.t1558.003
    - attack.t1078.002
    - attack.t1550.003
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
