title: "High Entropy Module Load via PowerShell with C2 Communication \u2014 Globally uncommon high entropy module was loaded"
id: ttp-2026-0272-bioc-01
status: experimental
description: |
  Detection of a DLL module with high entropy loaded into memory, indicating potential obfuscation or encryption
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'powershell.exe'
    | filter action_process_command_line contains 'Add-Type'
    | filter action_process_command_line contains 'malware.dll'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
