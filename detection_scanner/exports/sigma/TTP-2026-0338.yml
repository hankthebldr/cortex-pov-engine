title: "Rare Process Execution by User - Suspicious PowerShell Usage \u2014 Rare PowerShell Execution by User"
id: ttp-2026-0338-bioc-01
status: experimental
description: |
  Detection of PowerShell being executed by a user not typically using it
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'powershell.exe'
    | filter actor_process_image_name != 'explorer.exe'
    | filter actor_process_image_name != 'cmd.exe'
    | filter actor_process_image_name != 'svchost.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1105
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
