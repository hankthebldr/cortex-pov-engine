title: "DNS-Tunnel Behavioral Anomaly \u2014 Query-Volume + Subdomain-Entropy Deviation from Learned Host DNS Baseline (T1048.003 / T1071.004 / T1572) \u2014 NDR-009 DNS Query-Volume Flood Deviating from Learned Host Baseline"
id: ttp-2026-0102-abioc-01
status: experimental
description: |
  A host whose learned Cortex DNS profile is a small, low-rate set of resolutions suddenly emits dozens of lookups under a single base domain within a minute. The ABIOC anchors the volume deviation to the causality chain (one host -> one base domain -> high-rate label burst) rather than to any known-bad domain, catching a DNS tunnel over an unseen base domain that a static domain-block would miss.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = pan_dns
    | filter _time > to_timestamp(current_time() - 900)
    | filter dns_query_name contains ".exfil.testmynids.org"
    | comp count() as query_count, count_distinct(dns_query_name) as distinct_labels by source_ip, bin(_time, 1m) as minute
    | filter query_count >= 10
    | sort desc query_count
    | fields minute, source_ip, query_count, distinct_labels
  ----
references:
  - https://attack.mitre.org/techniques/T1048/
author: CortexSim detection_scanner
tags:
    - attack.t1048.003
    - attack.t1572
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
