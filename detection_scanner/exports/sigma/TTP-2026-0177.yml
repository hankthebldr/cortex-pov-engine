title: "USB Removable Media Exfiltration of Sensitive Customer Records \u2014 PCI and PII Data Staging"
id: ttp-2026-0177-bioc-01
status: experimental
description: |
  PCI and PII Data Staging
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    preset = xdr_data | filter event_type = 'FILE_WRITE' and (action_file_name contains 'pci' or action_file_name contains 'pii') and (action_file_path contains '/tmp/' or action_file_path contains 'AppData')
  ----
references:
  - https://attack.mitre.org/techniques/T1052/
author: CortexSim detection_scanner
tags:
    - attack.t1052
    - attack.t1074
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
