title: "Kali External-to-Internal Kill-Chain \u2014 Recon to Web Exploit to Credential Access to Lateral Movement (Chained Causality) \u2014 MP-019 External Port-and-Service Scan Burst Against Exposed Host"
id: ttp-2026-0140-bioc-01
status: experimental
description: |
  The recon root. nmap + masscan + dnsrecon fan out from one operator source against the exposed lab host, producing a burst of connections to many distinct destination ports from a single source IP — the classic NDR port-scan signature that opens the kill-chain before any web or endpoint signal exists.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK and event_sub_type = ENUM.NETWORK_CONNECTION
    | filter action_remote_ip = "${CORTEXSIM_WEB_TARGET}"
    | comp count() as conns, count_distinct(action_remote_port) as distinct_ports by action_local_ip, action_remote_ip
    | filter distinct_ports >= 20
    | fields action_local_ip, action_remote_ip, distinct_ports, conns
  ----
references:
  - https://attack.mitre.org/techniques/T1595/
author: CortexSim detection_scanner
tags:
    - attack.t1595
    - attack.t1046
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: medium
