title: "Anomalous Privileged Role / Consent Grant Deviating from Admin Learned Baseline \u2014 Cortex Identity ABIOC (T1098 / T1484) \u2014 Privileged Role Assignment by Non-Governance Identity"
id: ttp-2026-0100-bioc-01
status: experimental
description: |
  Detection of a process starting that performs a privileged directory-role assignment (Global Administrator or Privileged Role Administrator) by an identity not in the learned governance baseline.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_effective_username not in ("governance-user-1", "governance-user-2", "admin-user-1")
    | filter action_process_image_name in ("powershell.exe", "cmd.exe", "sh.exe")
    | filter action_file_path contains "directory-role-assignment"
    | filter causality_actor_process_image_name contains "sync-automation.exe"
  ----
references:
  - https://attack.mitre.org/techniques/T1098/
author: CortexSim detection_scanner
tags:
    - attack.t1098
    - attack.t1484
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
