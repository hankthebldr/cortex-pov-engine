title: "ASPX Web Shell Reflectively Loads a Fileless .NET IIS Backdoor into w3wp.exe (Phantom Taurus NET-STAR) (T1505.003 / T1620 / T1071.001) \u2014 IIS Worker Process w3wp.exe Spawns a Command Interpreter"
id: ttp-2026-0119-bioc-01
status: experimental
description: |
  The IIS worker process w3wp.exe should never parent an interactive command interpreter under normal operation. When it does, it is the durable, non-fileless seam of a web shell running operator commands. Fires on w3wp.exe as the causality actor spawning cmd/powershell/net/whoami/sqlcmd/csc — the command lineage NET-STAR's run_code / executeSQLQuery / bypassPrecompiledApp commands produce even though the backdoor assembly itself is in memory.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter causality_actor_process_image_name = "w3wp.exe" or actor_process_image_name = "w3wp.exe"
    | filter action_process_image_name in ("cmd.exe", "powershell.exe", "pwsh.exe", "net.exe", "net1.exe", "whoami.exe", "sqlcmd.exe", "csc.exe")
    | fields agent_hostname, causality_actor_process_image_name, causality_actor_process_instance_id, actor_process_image_name, actor_process_instance_id, action_process_image_name, action_process_image_command_line
  ----
references:
  - https://attack.mitre.org/techniques/T1505/
author: CortexSim detection_scanner
tags:
    - attack.t1505.003
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
