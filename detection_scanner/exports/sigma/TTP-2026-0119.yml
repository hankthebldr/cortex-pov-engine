title: "ASPX Web Shell Reflectively Loads a Fileless .NET IIS Backdoor into w3wp.exe (Phantom Taurus NET-STAR) (T1505.003 / T1620 / T1071.001) \u2014 Reflective Fileless .NET Assembly Load in IIS Worker Process"
id: ttp-2026-0119-bioc-03
status: experimental
description: |
  IIServerCore and the AssemblyExecuter helpers are reflectively loaded into w3wp.exe from memory, so the loaded module has no backing file on disk (unsigned / no module path) or carries the NET-STAR build names. Fires on module-load events in w3wp.exe whose module is unbacked or named ServerCore/ExecuteAssembly/AssemblyExecuter — the reflective code-loading seam.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.MODULE and event_sub_type = ENUM.MODULE_LOAD
    | filter actor_process_image_name = "w3wp.exe"
    | filter action_module_path = "" or action_module_signature_status = "UNSIGNED" or action_module_name contains "ServerCore" or action_module_name contains "ExecuteAssembly" or action_module_name contains "AssemblyExecuter"
    | fields agent_hostname, actor_process_image_name, actor_process_instance_id, action_module_name, action_module_path, action_module_signature_status
  ----
references:
  - https://attack.mitre.org/techniques/T1620/
author: CortexSim detection_scanner
tags:
    - attack.t1620
    - attack.t1027
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
