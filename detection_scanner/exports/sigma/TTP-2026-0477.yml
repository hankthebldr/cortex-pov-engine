title: "Unusual IMDS Access via PowerShell \u2014 Unusual IMDS Access"
id: ttp-2026-0477-bioc-01
status: experimental
description: |
  Detection of process accessing Instance Metadata Service (IMDS) endpoint
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK_CONNECTION
    | filter action_remote_ip = '169.254.169.254'
    | filter action_process_image_name = 'powershell.exe'
    | filter dst_port = 80
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1046
    - attack.t1566.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
