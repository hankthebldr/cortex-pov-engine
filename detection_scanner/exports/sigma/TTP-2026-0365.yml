title: "Kubelet Credential Retrieval via Windows PowerShell \u2014 PowerShell Execution with Bypass Policy"
id: ttp-2026-0365-bioc-01
status: experimental
description: |
  Detection of PowerShell execution with -ExecutionPolicy Bypass flag
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'powershell.exe'
    | filter action_process_command_line contains '-ExecutionPolicy Bypass'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1078
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
