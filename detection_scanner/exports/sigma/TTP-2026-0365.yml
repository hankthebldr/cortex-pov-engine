title: "Kubelet Credential Retrieval via Windows PowerShell \u2014 Suspicious File Access After PowerShell Execution"
id: ttp-2026-0365-abioc-02
status: experimental
description: |
  Detection of file access after PowerShell execution with bypass policy
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.FILE_ACCESS
    | filter action_file_path = 'C:\temp\kubeletcreds.txt'
    | filter causality_actor_process_image_name = 'powershell.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
