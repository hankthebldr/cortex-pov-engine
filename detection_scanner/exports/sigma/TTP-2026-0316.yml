title: "DLL Search Order Hijacking via Malicious DLL Placement \u2014 Suspicious DLL Load from Non-Standard Directory"
id: ttp-2026-0316-bioc-01
status: experimental
description: |
  Process starts and loads a DLL from a non-standard directory that is searched before system directories
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'C:\\Windows\\System32\\cmd.exe'
    | filter action_file_path contains 'temp_dll'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1574.002
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
