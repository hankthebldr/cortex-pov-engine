title: "Setuid Privilege Escalation via chmod u+s on Shell Binary \u2014 Setuid and Setgid file bit manipulation"
id: ttp-2026-0213-abioc-02
status: experimental
description: |
  Behavioral deviation detected when setuid/setgid bits are manipulated on files in writable paths
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.FILE and event_sub_type = ENUM.FILE_MODIFY
    | filter action_file_path contains '/tmp/scratch/shell' and action_command_line contains 'u+s'
  ----
references:
  - https://attack.mitre.org/techniques/T1548/
author: CortexSim detection_scanner
