title: "Office Process Injection via PowerShell \u2014 Office Injects Code into Process"
id: ttp-2026-0298-bioc-01
status: experimental
description: |
  Microsoft Office launches a process that injects code into another process
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'winword.exe' or actor_process_image_name = 'excel.exe'
    | filter action_process_image_name != 'winword.exe' and action_process_image_name != 'excel.exe'
    | filter causality_actor_process_image_name = 'winword.exe' or causality_actor_process_image_name = 'excel.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1073.001
    - attack.t1055.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
