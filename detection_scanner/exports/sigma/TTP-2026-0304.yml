title: "Mshta.exe Spawned From Browser Process \u2014 Mshta Spawned From Browser"
id: ttp-2026-0304-bioc-01
status: experimental
description: |
  Detection of mshta.exe being spawned directly from a browser process
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name in ('chrome.exe', 'firefox.exe', 'iexplore.exe')
    | filter action_process_image_name = 'mshta.exe'
    | filter causality_actor_process_image_name != 'mshta.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1218/
author: CortexSim detection_scanner
tags:
    - attack.t1218.005
    - attack.t1059.007
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
