title: "Uncommon User Management via net command \u2014 Uncommon user management via net command"
id: ttp-2026-0460-bioc-01
status: experimental
description: |
  Detection of net user command execution with administrative privileges
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'net.exe'
    | filter action_command_line contains 'user'
    | filter action_command_line contains '/add'
    | filter action_command_line contains 'administrators'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1133
    - attack.t1078
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
