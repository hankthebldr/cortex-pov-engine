title: "Windows regsvr32 Squiblydoo Proxy Execution via COM Scriptlet \u2014 Regsvr32 with Remote Scriptlet"
id: ttp-2026-0194-bioc-01
status: experimental
description: |
  Detection of regsvr32 being invoked with /i: parameter pointing to an HTTP URL
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'regsvr32.exe'
    | filter action_process_command_line contains '/i:http://'
    | filter action_process_command_line contains 'scrobj.dll'
  ----
references:
  - https://attack.mitre.org/techniques/T1218/
author: CortexSim detection_scanner
tags:
    - attack.t1218.010
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
