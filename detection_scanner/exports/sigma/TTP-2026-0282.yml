title: "Process Injection via rundll32.exe \u2014 Suspicious rundll32.exe Injection"
id: ttp-2026-0282-bioc-01
status: experimental
description: |
  Detection of rundll32.exe being invoked with suspicious parameters indicating injection behavior
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'rundll32.exe'
    | filter action_command_line contains 'C:\Windows\Temp\malware.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1073
    - attack.t1055
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
