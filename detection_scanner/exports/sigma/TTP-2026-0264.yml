title: "Persistence via WMI Event Consumer with mshta at Startup \u2014 Uncommon Process Execution by System Binary"
id: ttp-2026-0264-bioc-01
status: experimental
description: |
  Detection of mshta.exe execution initiated by a Windows system binary like svchost.exe
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'svchost.exe' and action_process_image_name = 'mshta.exe'
    | filter action_process_image_name not in ('explorer.exe', 'svchost.exe', 'wmiprvse.exe')
  ----
references:
  - https://attack.mitre.org/techniques/T1047/
author: CortexSim detection_scanner
tags:
    - attack.t1047
    - attack.t1059.007
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
