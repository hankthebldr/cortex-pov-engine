title: "Linux Identity Persistence \u2014 Sudo Backdoor Account, SSH Key and a Self-Expiring Systemd Timer \u2014 EDR-024 Local Account Created In Sudo Group By Root Shell"
id: ttp-2026-0199-bioc-01
status: experimental
description: |
  A shell runs useradd/adduser/usermod with a group list that includes sudo, wheel or admin. Matched read-only in the lab tenant 2026-11-11 against a real useradd -G sudo event on pov-target-01. Operator-installed: create this as a BIOC rule in the tenant with EXACTLY this name (the matcher's strongest key is alert name == card name), severity Medium, from the XQL below. CortexSim never writes it to the tenant. Category: persistence.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name in ("useradd", "adduser", "usermod")
    | filter action_process_image_command_line ~= "(-G|--groups|-aG)[ =]?[^ ]*(sudo|wheel|admin)"
    | filter actor_process_image_name in ("sh", "bash", "dash", "zsh", "python3", "perl")
  ----
references:
  - https://attack.mitre.org/techniques/T1136/
author: CortexSim detection_scanner
tags:
    - attack.t1136.001
    - attack.t1098
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: medium
