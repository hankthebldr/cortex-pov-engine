title: "Kerberos Relay Attack via SMB and LSASS Dumping \u2014 LSASS Memory Dumping Behavior"
id: ttp-2026-0318-abioc-02
status: experimental
description: |
  Detection of LSASS process being executed with unusual flags or in an abnormal context
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'lsass.exe'
    | filter actor_process_image_name != 'services.exe'
    | filter actor_process_image_name != 'svchost.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1003/
author: CortexSim detection_scanner
tags:
    - attack.t1003
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
