title: "Kerberos Relay Attack via SMB and LSASS Dumping \u2014 Unusual SMB Connection to IPC$ Share"
id: ttp-2026-0318-bioc-01
status: experimental
description: |
  Detection of SMB connection to IPC$ share with no user context
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK_CONNECTION
    | filter action_remote_ip = '192.0.2.100'
    | filter dst_port = 445
    | filter action_process_image_name != 'svchost.exe'
    | filter causality_actor_process_image_name = 'net.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1078/
author: CortexSim detection_scanner
tags:
    - attack.t1078
    - attack.t1550
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
