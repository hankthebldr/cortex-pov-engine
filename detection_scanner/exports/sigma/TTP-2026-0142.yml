title: "Ransomware Precursor Auto-Containment \u2014 BlackSuit DCSync-to-ESXi Kill Chain Fires XSOAR Auto-Containment (T1003.006 / T1053.005 / T1486) \u2014 BlackSuit VPN Valid-Account Anomalous GlobalProtect Sign-In"
id: ttp-2026-0142-bioc-01
status: experimental
description: |
  The vished VPN credential surfaces as an anomalous but authenticated GlobalProtect gateway sign-in — a legitimate account from an unfamiliar source region or a first-seen device. No known-bad indicator; the anomaly against the account's learned sign-in geography/device is the signal (T1078 initial access).
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = panw_ngfw_globalprotect_raw
    | filter event_type = "gateway-auth" and auth_result = "success"
    | filter source_region_is_approved = false or device_is_first_seen = true
    | comp count() as logins by source_user, source_ip, source_region
    | filter logins >= 1
    | fields source_user, source_ip, source_region, logins
  ----
references:
  - https://attack.mitre.org/techniques/T1078/
author: CortexSim detection_scanner
tags:
    - attack.t1078
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: medium
