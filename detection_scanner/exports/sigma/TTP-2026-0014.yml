title: "AIRS \u2014 System Prompt Leakage (LLM07) \u2014 AIRS LLM07 Model Response Contains Literal System Prompt Role String"
id: ttp-2026-0014-bioc-01
status: experimental
description: |
  AIRS — model response contains literal system prompt text 'CortexSimAdmin'. The reply echoes the seeded system-prompt role string back to the caller after a prompt-stealer probe.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = panw_ngfw_traffic_raw
    | filter dst_port = 8089 and uri_path contains "/owasp/llm07/chat"
    | filter response_body contains "CortexSimAdmin" or response_body contains "You are CortexSimAdmin"
    | fields _time, source_user, src_ip, dst_host, uri_path, response_body
  ----
references:
  - https://attack.mitre.org/techniques/T1082/
author: CortexSim detection_scanner
tags:
    - attack.t1082
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
