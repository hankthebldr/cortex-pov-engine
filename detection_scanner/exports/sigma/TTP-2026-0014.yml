title: "AIRS \u2014 System Prompt Leakage (LLM07) \u2014 AIRS LLM07 System Prompt Embedded AKIA Canary Key Leaks Into Response"
id: ttp-2026-0014-bioc-02
status: experimental
description: |
  AIRS — AKIA-prefixed canary key from system prompt leaks into response. The secret embedded in the seeded system prompt surfaces in the model's reply — a live credential disclosure.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = panw_ngfw_traffic_raw
    | filter dst_port = 8089 and uri_path contains "/owasp/llm07/chat"
    | filter response_body contains "AKIA0000CORTEXSIMCANARY"
    | fields _time, source_user, src_ip, dst_host, uri_path, response_body
  ----
references:
  - https://attack.mitre.org/techniques/T1082/
author: CortexSim detection_scanner
tags:
    - attack.t1082
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: critical
