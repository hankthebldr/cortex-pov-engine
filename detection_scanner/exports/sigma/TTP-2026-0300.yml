title: "Office Process Spawning Abused Child Process \u2014 Office process spawns commonly abused process"
id: ttp-2026-0300-abioc-02
status: experimental
description: |
  Detection of Microsoft Office applications spawning PowerShell, WMI, or other commonly abused processes
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name in ('winword.exe', 'excel.exe') and action_process_image_name in ('powershell.exe', 'wmi.exe', 'wmic.exe')
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1105
    - attack.t1047
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
