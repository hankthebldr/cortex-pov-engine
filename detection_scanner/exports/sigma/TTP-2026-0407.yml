title: "Suspicious setspn.exe Execution via PowerShell \u2014 Suspicious setspn.exe execution"
id: ttp-2026-0407-bioc-01
status: experimental
description: |
  Detection of setspn.exe being executed with suspicious parameters to enumerate service accounts
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'setspn.exe'
    | filter causality_actor_process_image_name = 'powershell.exe'
    | filter action_file_path contains 'setspn.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1550.003
    - attack.t1078.002
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
