title: "AzureHound Cloud-Identity Enumeration Stitch: Token Theft -> Non-Interactive Entra Sign-In -> Bulk Microsoft Graph Discovery (SIM-MP-014) \u2014 MP-014 Browser Session-Token and Cookie Theft by Non-Browser Process"
id: ttp-2026-0124-bioc-01
status: experimental
description: |
  A non-browser process reads multiple browser credential stores (saved-login and cookie/session-token databases). Infostealers such as Raccoon Stealer or Redline sweep these stores to lift session tokens later replayed against Entra ID; the browser reading its own store is normal, a non-browser process sweeping several stores in one burst is the endpoint anchor of the AzureHound chain.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.FILE and event_sub_type = ENUM.FILE_OPEN
    | filter action_file_path contains "Login Data" or action_file_path contains "cookies.sqlite" or action_file_path contains "logins.json" or action_file_path contains "key4.db"
    | filter actor_process_image_name not in ("chrome", "chromium", "google-chrome", "msedge", "firefox", "firefox-bin", "cortex-agent")
    | comp count_distinct(action_file_path) as stores_read by agent_hostname, actor_effective_username, actor_process_image_name
    | filter stores_read >= 2
    | fields agent_hostname, actor_effective_username, actor_process_image_name, stores_read
  ----
references:
  - https://attack.mitre.org/techniques/T1528/
author: CortexSim detection_scanner
tags:
    - attack.t1528
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
