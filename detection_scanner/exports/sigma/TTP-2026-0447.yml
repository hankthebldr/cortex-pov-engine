title: "Uncommon Network Connection via Newly Created Actor \u2014 Uncommon Network Connection Under Untrusted Actor"
id: ttp-2026-0447-bioc-01
status: experimental
description: |
  Detects network activity originating from a newly created process under an untrusted causality actor
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter causality_actor_process_image_name = '/tmp/.system/evil'
    | filter action_remote_ip != '127.0.0.1'
    | filter action_remote_ip != '0.0.0.0'
    | filter action_remote_ip != '::'
    | filter action_remote_ip != '192.0.2.0/24'
    | filter action_remote_ip != '10.0.0.0/8'
    | filter action_remote_ip != '172.16.0.0/12'
    | filter action_remote_ip != '192.168.0.0/16'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1071.004
    - attack.t1566.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
