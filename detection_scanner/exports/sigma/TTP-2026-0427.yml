title: "Windows Endpoint - Uncommon Communication to Instant Messaging Server \u2014 Behavioral Abnormal Communication to IM Server"
id: ttp-2026-0427-abioc-02
status: experimental
description: |
  Process behavior that deviates from normal communication patterns to instant messaging server
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK_CONNECTION and event_sub_type = ENUM.NETWORK_CONNECTION_ESTABLISHED
    | filter action_remote_ip = '192.0.2.10' and dst_port = 443
    | filter actor_process_image_name contains 'powershell.exe'
    | filter actor_process_image_name != 'C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1071.004
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
