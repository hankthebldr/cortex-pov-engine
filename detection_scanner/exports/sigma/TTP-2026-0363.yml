title: "Uncommon Remote Service Start via WMI \u2014 Remote Service Start from Uncommon Source"
id: ttp-2026-0363-bioc-01
status: experimental
description: |
  Detection of a service start initiated from an unexpected source process (e.g., wmic.exe)
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'wmic.exe'
    | filter action_process_image_name = 'sc.exe'
    | filter causality_actor_process_image_name != 'services.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1047/
author: CortexSim detection_scanner
tags:
    - attack.t1047
    - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
