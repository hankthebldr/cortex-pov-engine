title: "Uncommon DotNet Module Load via PowerShell with C2 Communication \u2014 Uncommon DotNet module load relationship"
id: ttp-2026-0429-bioc-01
status: experimental
description: |
  Detection of PowerShell loading a .NET assembly from an uncommon or non-standard path
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'powershell.exe'
    | filter action_process_image_name contains '.NET'
    | filter action_file_path not in ('C:\Windows\Microsoft.NET\', 'C:\Program Files\')
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1105
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
