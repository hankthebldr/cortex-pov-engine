title: "Uncommon DotNet Module Load via PowerShell with C2 Communication \u2014 PowerShell load of .NET module with C2"
id: ttp-2026-0429-abioc-02
status: experimental
description: |
  Behavioral deviation where PowerShell loads a .NET module and initiates C2 communication
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'powershell.exe'
    | filter action_file_path contains '.NET'
    | filter action_remote_ip = '192.0.2.10'
    | filter dst_port = 8080
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
