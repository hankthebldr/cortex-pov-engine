title: "SSH Exfiltration of Compressed Data \u2014 A compressed file was exfiltrated over SSH"
id: ttp-2026-0216-abioc-02
status: experimental
description: |
  Detection of a tar.gz file being sent over SSH to a remote IP
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK
    | filter dst_port = 22 and action_remote_ip = '192.0.2.5'
    | filter action_file_path contains '.tar.gz'
    | filter action_process_image_name = 'scp'
  ----
references:
  - https://attack.mitre.org/techniques/T1048/
author: CortexSim detection_scanner
tags:
    - attack.t1048
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
