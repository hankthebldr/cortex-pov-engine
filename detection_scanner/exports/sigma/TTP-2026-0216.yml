title: "SSH Exfiltration of Compressed Data \u2014 SSH Exfiltration Process"
id: ttp-2026-0216-bioc-01
status: experimental
description: |
  Process starts SCP with a file path to a remote IP
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'scp' and action_file_path = '/tmp/stage/data.tar.gz'
    | filter action_remote_ip = '192.0.2.5'
  ----
references:
  - https://attack.mitre.org/techniques/T1048/
author: CortexSim detection_scanner
tags:
    - attack.t1048
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
