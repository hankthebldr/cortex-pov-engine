title: "Azure AD Sync Module Load via Suspicious Process Injection \u2014 Unusual Azure AD Sync Module Load"
id: ttp-2026-0476-bioc-01
status: experimental
description: |
  Detection of unexpected module loading into a process during Azure AD sync behavior
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'rundll32.exe'
    | filter action_file_path contains 'syncmodule.dll'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1070.006
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
