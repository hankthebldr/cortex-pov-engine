title: "AWS Credential & Secret Harvesting Behavioral Chain \u2014 CloudTrail (SIM-CDR-020) \u2014 AWS CLI Process with Secret Retrieval Commands"
id: ttp-2026-0155-bioc-01
status: experimental
description: |
  Detection of aws cli process execution with arguments related to SecretsManager and SSM parameter retrieval
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'aws'
    | filter action_process_image_name = 'aws'
    | filter action_file_path contains 'secretsmanager' or action_file_path contains 'ssm'
    | filter action_file_path contains 'get-secret-value' or action_file_path contains 'get-parameter' or action_file_path contains 'get-parameters-by-path'
  ----
references:
  - https://attack.mitre.org/techniques/T1555/
author: CortexSim detection_scanner
tags:
    - attack.t1555
    - attack.t1528
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
