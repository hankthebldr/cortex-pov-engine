status: experimental
description: |
  Detection of aws cli process accessing RFC 5737 / .invalid canary domains used in CloudTrail simulation
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK and event_sub_type = ENUM.NETWORK_CONNECTION
    | filter actor_process_image_name = 'aws'
    | filter action_remote_ip in ('192.0.2.1', '198.51.100.1', '203.0.113.1')
