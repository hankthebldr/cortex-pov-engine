title: "Uncommon Routing Table Listing via route.exe \u2014 Uncommon routing table listing via route.exe"
id: ttp-2026-0455-bioc-01
status: experimental
description: |
  Detection of route.exe being executed with print argument in an unusual context
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'route.exe'
    | filter action_file_path = 'C:\\Windows\\System32\\route.exe'
    | filter actor_process_image_name != 'cmd.exe' and actor_process_image_name != 'powershell.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1046
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
