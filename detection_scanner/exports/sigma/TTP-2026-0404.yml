title: "RunOnce Parent Process Attack \u2014 Suspicious RunOnce Parent Process"
id: ttp-2026-0404-bioc-01
status: experimental
description: |
  Detects execution of a process from a RunOnce registry key with an unexpected parent process
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter causality_actor_process_image_name = 'explorer.exe' and action_process_image_name = 'cmd.exe'
    | filter action_file_path contains 'RunOnce'
  ----
references:
  - https://attack.mitre.org/techniques/T1060/
author: CortexSim detection_scanner
tags:
    - attack.t1060
    - attack.t1059.001
    - attack.t1547.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
