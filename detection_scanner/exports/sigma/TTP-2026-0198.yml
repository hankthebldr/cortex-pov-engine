title: "Masquerading Malware Dropping svchost.exe/lsass.exe in Non-System Path \u2014 Process Masquerading as svchost.exe"
id: ttp-2026-0198-bioc-01
status: experimental
description: |
  A process named svchost.exe is started from a non-system directory
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'svchost.exe'
    | filter action_file_path != 'C:\\Windows\\System32\\svchost.exe'
    | filter causality_actor_process_image_name != 'svchost.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1036/
author: CortexSim detection_scanner
tags:
    - attack.t1036.005
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
