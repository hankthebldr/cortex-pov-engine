title: "Masquerading Malware Dropping svchost.exe/lsass.exe in Non-System Path \u2014 A process is masquerading as a common Microsoft product"
id: ttp-2026-0198-abioc-02
status: experimental
description: |
  Detection of a process masquerading as a common Microsoft product such as svchost.exe or lsass.exe
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name in ('svchost.exe', 'lsass.exe')
    | filter action_file_path not in ('C:\\Windows\\System32\\svchost.exe', 'C:\\Windows\\System32\\lsass.exe')
  ----
references:
  - https://attack.mitre.org/techniques/T1036/
author: CortexSim detection_scanner
tags:
    - attack.t1036.005
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
