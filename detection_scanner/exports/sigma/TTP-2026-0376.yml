title: "Signed Process Performing Unpopular Injection \u2014 Signed Process Injection Anomaly"
id: ttp-2026-0376-bioc-01
status: experimental
description: |
  Detection of injection behavior by a signed process that is not typically used for such activity
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'cmd.exe' and action_process_image_name = 'svchost.exe'
    | filter causality_actor_process_image_name = 'svchost.exe' and action_file_path = '/tmp/evil.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1055/
author: CortexSim detection_scanner
tags:
    - attack.t1055.001
    - attack.t1055
    - attack.t1070
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
