title: "Malicious HTML Application Execution via CMD/PowerShell \u2014 Unusual mshta execution from shell context"
id: ttp-2026-0297-abioc-02
status: experimental
description: |
  Behavioral deviation where mshta.exe is executed directly from shell without typical user interaction patterns
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'mshta.exe'
    | filter causality_actor_process_image_name in ('cmd.exe', 'powershell.exe')
    | filter not (action_process_image_name contains 'explorer.exe' or action_process_image_name contains 'svchost.exe')
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
