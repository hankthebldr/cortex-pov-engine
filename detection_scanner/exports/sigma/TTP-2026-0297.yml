title: "Malicious HTML Application Execution via CMD/PowerShell \u2014 Microsoft HTML Application Host spawns from CMD or PowerShell"
id: ttp-2026-0297-bioc-01
status: experimental
description: |
  Detection of mshta.exe being launched directly from cmd.exe or powershell.exe without intermediate parent processes
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'mshta.exe'
    | filter causality_actor_process_image_name in ('cmd.exe', 'powershell.exe')
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1204.002
    - attack.t1086
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
