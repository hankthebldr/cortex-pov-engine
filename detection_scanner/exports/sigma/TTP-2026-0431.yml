title: "Uncommon ODBCConf Execution for Lateral Movement \u2014 Uncommon ODBCConf Execution"
id: ttp-2026-0431-bioc-01
status: experimental
description: |
  Detection of odbcconf.exe execution with custom DllPath parameter
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'odbcconf.exe'
    | filter action_process_command_line contains 'DllPath'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1566.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
