title: "Web-Application Attack-Surface Enumeration & Injection Probing \u2014 Cortex ASM + NGFW (T1595.002 / T1595.003 / T1190) \u2014 ASM-004 Web Content-Discovery Path Brute-Force Burst From Single Source"
id: ttp-2026-0077-bioc-01
status: experimental
description: |
  A single source IP issues a high-volume burst of distinct URI paths against the exposed nginx web surface within a short window — the signature of directory/content brute-forcing (Gobuster/Feroxbuster). The world-exposed nginx host is the static ASM finding; this BIOC fires when that surface is actively enumerated, bridging ASM discovery into NGFW/NDR runtime detection.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = panw_ngfw_traffic_raw
    | filter app = "web-browsing" or dst_port in (80, 443, 9001)
    | filter flow_direction = "inbound"
    | comp count_distinct(uri_path) as distinct_paths, count() as total_reqs by src_ip, dst_ip
    | filter distinct_paths >= 50
  ----
references:
  - https://attack.mitre.org/techniques/T1595/
author: CortexSim detection_scanner
tags:
    - attack.t1595.003
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: medium
