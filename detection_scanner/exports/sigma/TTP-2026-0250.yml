title: "Unsigned Process Creates Scheduled Task and Performs Injection \u2014 Unsigned Process Created Scheduled Task"
id: ttp-2026-0250-bioc-01
status: experimental
description: |
  Detection of unsigned process creating a scheduled task
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'powershell.exe'
    | filter action_file_path contains 'schtasks.exe'
    | filter actor_process_signing_status = ENUM.UNSIGNED
  ----
references:
  - https://attack.mitre.org/techniques/T1053/
author: CortexSim detection_scanner
tags:
    - attack.t1053.005
    - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
