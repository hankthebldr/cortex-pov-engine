title: "Exploitation of Internal Firewall Vulnerability via PowerShell Command Execution \u2014 WMI Remote Execution via PowerShell"
id: ttp-2026-0251-bioc-02
status: experimental
description: |
  PowerShell execution using WMI methods to perform remote command execution
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'powershell.exe'
    | filter action_process_command_line contains 'Get-WmiObject' and action_process_command_line contains 'Win32_OperatingSystem'
    | filter action_remote_ip in ['192.0.2.20']
  ----
references:
  - https://attack.mitre.org/techniques/T1047/
author: CortexSim detection_scanner
tags:
    - attack.t1047
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
