title: "Kubernetes Pod Exfiltrates Data via wget to C2 \u2014 Unusual Pod Network Communication"
id: ttp-2026-0481-bioc-01
status: experimental
description: |
  A pod makes an outbound network connection to a remote IP not typically seen in normal operations
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK
    | filter action_remote_ip = '192.0.2.50'
    | filter actor_process_image_name like '%pod%'
  ----
references:
  - https://attack.mitre.org/techniques/T1071/
author: CortexSim detection_scanner
tags:
    - attack.t1071.004
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
