title: "Kubernetes Pod Exfiltrates Data via wget to C2 \u2014 Pod Executes Suspicious Script"
id: ttp-2026-0481-abioc-02
status: experimental
description: |
  A pod executes a script downloaded from a remote C2 server
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = '/tmp/malware.sh'
    | filter causality_actor_process_image_name like '%pod%'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
