title: "LSASS Memory Dump Extraction via Process Copy \u2014 Copy a process memory file"
id: ttp-2026-0203-bioc-01
status: experimental
description: |
  Detection of a process memory dump file being copied to a non-system directory
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.FILE and event_sub_type = ENUM.FILE_COPY
    | filter action_file_path contains 'lsass.dmp'
    | filter actor_process_image_name = 'lsass.exe'
    | filter action_file_path matches 'C:\\temp\\.*'
  ----
references:
  - https://attack.mitre.org/techniques/T1003/
author: CortexSim detection_scanner
tags:
    - attack.t1003.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
