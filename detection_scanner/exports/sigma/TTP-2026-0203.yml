title: "Axios npm Supply Chain \u2014 plain-crypto-js Postinstall Dropper to a Linux Python RAT (rundir, runscript, peinject, kill) \u2014 KOI-012 Interpreter Started On Tmp Script With HTTP URL Argument"
id: ttp-2026-0203-bioc-01
status: experimental
description: |
  A script interpreter starts with a script under /tmp (or /var/tmp) as its first argument and an http or https URL as the next. This is the shape of Figure 1's Linux launch line, python3 /tmp/ld.py followed by the C2 URL, and of the mirrored launch in SIM-KOI-012 step-03. Operator-installed and NOT declared by SIM-KOI-012 (the lab tenant lists 0 custom BIOC rules, so the scenario expects nothing from it). To use it, create a BIOC rule in the tenant from the XQL below at severity Medium; CortexSim never writes it. Untested in any tenant.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter agent_os_type = ENUM.AGENT_OS_LINUX
    | filter action_process_image_command_line ~= "(python[0-9.]*|perl|ruby|node) +(/var)?/tmp/[^ ]+ +https?://"
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.006
    - attack.t1219
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: medium
