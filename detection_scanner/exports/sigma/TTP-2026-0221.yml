title: "Abused Process Connecting to Rare Cloud Resource \u2014 Abused Process Connecting to Rare Cloud Resource"
id: ttp-2026-0221-bioc-01
status: experimental
description: |
  Detects when a commonly abused process like PowerShell connects to a rare or uncommon IP address
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'powershell.exe'
    | filter action_remote_ip = '192.0.2.100'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1071.004
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
