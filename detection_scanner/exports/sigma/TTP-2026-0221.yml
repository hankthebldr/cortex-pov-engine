title: "Abused Process Connecting to Rare Cloud Resource \u2014 Rare Cloud Resource Connection by Abused Process"
id: ttp-2026-0221-abioc-02
status: experimental
description: |
  Detects abnormal behavior when a commonly abused process makes a network connection to a rare cloud resource
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK_CONNECTION
    | filter action_process_image_name = 'powershell.exe'
    | filter action_remote_ip = '192.0.2.100'
    | filter action_remote_port = 80
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1071.004
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
