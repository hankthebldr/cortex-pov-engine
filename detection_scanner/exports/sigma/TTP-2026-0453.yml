title: "Uncommon Remote Scheduled Task Creation via Schtasks \u2014 Uncommon Remote Scheduled Task Creation"
id: ttp-2026-0453-bioc-01
status: experimental
description: |
  Detection of scheduled task creation on remote host using schtasks.exe with unusual parameters
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'schtasks.exe'
    | filter action_file_path contains 'schtasks'
    | filter causality_actor_process_image_name != 'services.exe'
    | filter dst_ip = '192.0.2.10'
  ----
references:
  - https://attack.mitre.org/techniques/T1053/
author: CortexSim detection_scanner
tags:
    - attack.t1053.005
    - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
