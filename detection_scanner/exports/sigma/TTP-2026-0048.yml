title: "Staged Data Exfiltration via DNS Tunnel \u2014 XDR Staging + NGFW Stitch (T1048.003) \u2014 MP-003 Passwd Read Then Write To Tmp Staging Dir"
id: ttp-2026-0048-bioc-01
status: experimental
description: |
  XDR - /etc/passwd read followed by write to /tmp staging directory. The collection leg: a sensitive system file is read and concatenated into a staging file under /tmp.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    preset = xdr_data
    | filter event_type = ENUM.FILE
    | filter event_sub_type in (ENUM.FILE_OPEN, ENUM.FILE_READ)
    | filter action_file_path in ("/etc/passwd", "/etc/shadow")
    | filter actor_effective_username in ("www-data", "nobody", "apache", "nginx")
    | filter actor_process_image_name in ("cat", "head", "cp", "dd", "bash", "sh")
    | filter causality_actor_process_image_name in ("apache2", "nginx", "php-fpm", "node", "httpd")
  ----
references:
  - https://attack.mitre.org/techniques/T1005/
author: CortexSim detection_scanner
tags:
    - attack.t1005
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: medium
