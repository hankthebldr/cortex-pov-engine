title: "Linux Host File Mass-Encryption for Impact \u2014 SAFE-MODE (T1486 / T1490) \u2014 EDR-008 Local Recovery Inhibition \u2014 Snapshot Or Backup Deletion"
id: ttp-2026-0073-bioc-03
status: experimental
description: |
  Deletion of local snapshots/backups/shadow copies on a Linux host — recovery inhibition (T1490) co-occurring with mass file rewriting.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    preset = xdr_data
    | filter agent_os_type = ENUM.AGENT_OS_LINUX
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name in ("rm", "lvremove", "btrfs", "zfs", "rsnapshot", "shred")
    | filter action_process_image_command_line contains_any ("snapshot", "backup", ".img", ".tar", "--delete", "destroy")
    | fields _time, agent_hostname, container_id, causality_actor_process_image_name, causality_id, actor_process_image_name, action_process_image_command_line
