title: "Linux Host File Mass-Encryption for Impact \u2014 SAFE-MODE (T1486 / T1490) \u2014 EDR-008 Ransom Note Written Across Multiple Directories"
id: ttp-2026-0073-bioc-02
status: experimental
description: |
  A recurring ransom-note filename is written into multiple directories by one process — the note-drop stage of a ransomware encryptor (T1486).
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    preset = xdr_data
    | filter agent_os_type = ENUM.AGENT_OS_LINUX
    | filter event_type = ENUM.FILE and event_sub_type in (ENUM.FILE_CREATE, ENUM.FILE_WRITE)
    | filter action_file_name contains_any ("READ_ME", "RANSOM", "_DECRYPT_", "HOW_TO_RESTORE", "akira_readme")
    | comp count_distinct(action_file_directory) as note_dirs by actor_process_instance_id, causality_actor_process_image_name, container_id, agent_hostname
    | filter note_dirs >= 1
    | fields agent_hostname, container_id, causality_actor_process_image_name, actor_process_instance_id, note_dirs
  ----
references:
  - https://attack.mitre.org/techniques/T1486/
