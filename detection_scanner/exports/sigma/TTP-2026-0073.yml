title: "Linux Host File Mass-Encryption for Impact \u2014 SAFE-MODE (T1486 / T1490) \u2014 EDR-008 Rapid Mass File Rewrite With Uniform New Extension"
id: ttp-2026-0073-bioc-01
status: experimental
description: |
  A single process modifies/creates an abnormally large number of files carrying one new uniform extension in a short window — the host-level file-encryption fingerprint (T1486). Distinct from the ESXi VMDK-adjacent mass-write BIOC on TTP-2026-0006.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    preset = xdr_data
    | filter agent_os_type = ENUM.AGENT_OS_LINUX
    | filter event_type = ENUM.FILE and event_sub_type in (ENUM.FILE_CREATE, ENUM.FILE_WRITE, ENUM.FILE_RENAME)
    | filter action_file_extension in ("cortexlock", "akira", "locked", "crypt", "encrypted")
    | bin _time span=1m
    | comp count() as files_rewritten by actor_process_instance_id, causality_actor_process_image_name, actor_process_image_name, container_id, agent_hostname, _time
    | filter files_rewritten >= 20
    | fields _time, agent_hostname, container_id, causality_actor_process_image_name, actor_process_image_name, actor_process_instance_id, files_rewritten
  ----
references:
  - https://attack.mitre.org/techniques/T1486/
author: CortexSim detection_scanner
tags:
    - attack.t1486
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: critical
