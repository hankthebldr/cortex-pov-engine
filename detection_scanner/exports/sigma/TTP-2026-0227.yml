title: "Windows Process Connecting to Rare Cloud Resource \u2014 Process connecting to rare cloud resource"
id: ttp-2026-0227-bioc-01
status: experimental
description: |
  Detects a process connecting to an IP address that is not commonly seen in the environment
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK_CONNECTION
    | filter action_process_image_name != 'System'
    | filter causality_actor_process_image_name != 'System'
    | comp count() as events by actor_process_image_name, agent_hostname
    | sort desc events
  ----
references:
  - https://attack.mitre.org/techniques/T1071/
author: CortexSim detection_scanner
tags:
    - attack.t1071.004
    - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
