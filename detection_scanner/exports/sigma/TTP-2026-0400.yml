title: "PowerShell Module Loading via Suspicious Process \u2014 Suspicious PowerShell Module Load"
id: ttp-2026-0400-bioc-01
status: experimental
description: |
  A process loads a known PowerShell module in an unusual context
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'powershell.exe'
    | filter action_file_path contains '.psd1'
    | filter actor_process_image_name != 'explorer.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1086
    - attack.t1559.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
