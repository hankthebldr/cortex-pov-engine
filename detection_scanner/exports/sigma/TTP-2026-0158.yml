title: "Cloud Instance-Credential (IMDS) Theft and Off-Instance Reuse \u2014 Cloud Storage & Compute (SIM-CDR-023) \u2014 Python Process Execution with EAL Simulator Script"
id: ttp-2026-0158-bioc-01
status: experimental
description: |
  Detection of python3 process execution invoking the EAL simulator CLI with run command and a specific YAML configuration file for IMDS theft simulation.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'python3'
    | filter action_process_command_line contains 'scripts.eal_simulator.cli run'
    | filter action_process_command_line contains '/tmp/cdr-023-imds.yml'
    | filter action_process_command_line contains '--live'
  ----
references:
  - https://attack.mitre.org/techniques/T1552/
author: CortexSim detection_scanner
tags:
    - attack.t1552
    - attack.t1078
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
