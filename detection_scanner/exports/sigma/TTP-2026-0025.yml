title: "Kubernetes Lateral Movement via Stolen Service-Account Token (T1021) \u2014 CDR-004 Pod API Server Enumeration With Service Account Token"
id: ttp-2026-0025-bioc-01
status: experimental
description: |
  Kubernetes API server enumeration from within pod using mounted service account token. A container process curls the in-cluster API server with a Bearer token to list namespaces.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    preset = xdr_data
    | filter event_type = ENUM.PROCESS
    | filter event_sub_type = ENUM.PROCESS_START
    | filter container_id != null
    | filter actor_process_image_name in ("curl", "wget")
    | filter action_process_image_command_line contains "kubernetes.default.svc"
    | filter action_process_image_command_line contains_any ("Authorization: Bearer", "serviceaccount/token", "/api/v1/namespaces")
  ----
references:
  - https://attack.mitre.org/techniques/T1613/
author: CortexSim detection_scanner
tags:
    - attack.t1613
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
