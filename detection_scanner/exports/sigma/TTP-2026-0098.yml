title: "Collection and Data-Staging Behavioral Anomaly \u2014 Cortex ABIOC (T1074.001 / T1560.001 / T1005) \u2014 EDR-012 Archive/Compression Staging Burst Deviating from Process Baseline"
id: ttp-2026-0098-abioc-02
status: experimental
description: |
  A service process whose learned baseline never produces archives spawns tar/gzip/zip to compress swept files into a single staging artifact. Every utility is legitimate; the ABIOC fires on the archive-creation deviation from the process's learned behavior, anchored to the bulk-read sweep that fed it — the pre-exfil staging moment.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_effective_username in ("www-data", "node", "nobody")
    | filter action_process_image_name in ("tar", "gzip", "zip", "7z", "xz", "bzip2")
    | filter action_process_command_line contains "-c" or action_process_command_line contains "tmp"
    | comp count() as archive_ops by agent_hostname, actor_effective_username, action_process_image_name
    | filter archive_ops >= 1
    | fields agent_hostname, actor_effective_username, action_process_image_name, archive_ops
  ----
references:
  - https://attack.mitre.org/techniques/T1560/
author: CortexSim detection_scanner
tags:
    - attack.t1560.001
    - attack.t1074.001
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
