title: "Linux Shell Command Execution via Uncommon Interpreter \u2014 Uncommon Shell Command Execution"
id: ttp-2026-0438-bioc-01
status: experimental
description: |
  Detection of shell commands executed via uncommon interpreters like perl or awk
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name in ('perl', 'awk', 'python') and actor_process_image_name = 'bash'
    | filter action_command_line contains 'system' or action_command_line contains 'exec'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.007
    - attack.t1059.006
    - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
