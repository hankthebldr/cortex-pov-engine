title: "ChainDrop npm Worm \u2014 CI-Runner Preinstall to Runner.Worker Scrape, IMDS Harvest, C2 Exfil and STS Reuse (T1195.002 / T1003.007 / T1552.005) \u2014 MP-028 npm preinstall node setup.mjs spawns detached runtime with NODE_RUNTIME_INIT"
id: ttp-2026-0187-bioc-01
status: experimental
description: |
  npm runs a preinstall script whose node child executes setup.mjs and spawns a second JavaScript runtime (node or bun) on math_init.js with _NODE_RUNTIME_INIT=1 in its environment.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter causality_actor_process_image_name in ("npm", "npm-cli.js", "node")
    | filter action_process_image_name in ("node", "bun")
    | filter action_process_image_command_line contains "math_init.js" or action_process_image_command_line contains "Math_Symbol.js" or action_process_image_command_line contains "setup.mjs"
    | fields agent_hostname, causality_actor_process_image_name, actor_process_image_command_line, action_process_image_command_line
  ----
references:
  - https://attack.mitre.org/techniques/T1195/
author: CortexSim detection_scanner
tags:
    - attack.t1195.002
    - attack.t1059.007
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
