title: "Suspicious Access to Advertising Domains via PowerShell \u2014 Rare PowerShell to Advertising Domain Access"
id: ttp-2026-0327-abioc-02
status: experimental
description: |
  PowerShell process accessing advertising domains outside of normal behavior
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK_CONNECTION
    | filter action_process_image_name = 'powershell.exe'
    | filter action_remote_ip in ('192.0.2.10', '192.0.2.11')
    | filter agent_hostname not in ('normal-host-01', 'normal-host-02')
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1071.004
