title: "Remote PsExec-like command execution via SMB \u2014 Remote SMB-based execution"
id: ttp-2026-0361-abioc-02
status: experimental
description: |
  Behavioral deviation from normal SMB usage to execute remote processes
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK_CONNECTION
    | filter dst_ip = '192.0.2.10' and dst_port = 445
    | filter action_remote_ip = '192.0.2.10'
    | filter causality_actor_process_image_name = 'psexec.exe' or causality_actor_process_image_name = 'wbemexec.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1047
logsource:
