title: "Suspicious Docker Image Download from Unusual Repository \u2014 Unusual Docker Pull from Non-Standard Registry"
id: ttp-2026-0386-bioc-01
status: experimental
description: |
  Detection of docker pull command targeting an IP address instead of a standard registry domain
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'docker' and action_file_path = '/usr/bin/docker'
    | filter causality_actor_process_image_name != 'dockerd'
    | filter action_file_path contains 'pull'
    | filter action_remote_ip matches '192.0.2.0/24'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1071.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
