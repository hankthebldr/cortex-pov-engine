title: "SSH Tunneling to Cloud Resource via Rare Process \u2014 Rare Process SSH to Cloud Resource"
id: ttp-2026-0496-bioc-01
status: experimental
description: |
  Detection of a rare or unknown process initiating an SSH session to a cloud IP address
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name not in ('/usr/bin/ssh', '/usr/bin/sftp', '/usr/bin/scp')
    | filter action_remote_ip in ('192.0.2.100', '192.0.2.1')
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.004
    - attack.t1021.004
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
