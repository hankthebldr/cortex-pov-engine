title: "SSH Tunneling to Cloud Resource via Rare Process \u2014 Unusual SSH Process to Cloud IP"
id: ttp-2026-0496-abioc-02
status: experimental
description: |
  Behavioral deviation where a process not typically used for SSH connects to a cloud IP address
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK_CONNECTION
    | filter action_process_image_name not in ('/usr/bin/ssh', '/usr/bin/sftp', '/usr/bin/scp')
    | filter action_remote_ip in ('192.0.2.100', '192.0.2.1')
    | filter network_protocol = 'TCP' and dst_port = 22
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.004
    - attack.t1021.004
    - attack.t1566.001
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
