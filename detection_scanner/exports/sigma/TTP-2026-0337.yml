title: "AppleScript Execution of Suspicious Process \u2014 Rare Process Executed by AppleScript"
id: ttp-2026-0337-bioc-01
status: experimental
description: |
  Detection of a process being executed by osascript, which is uncommon and potentially malicious
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'osascript'
    | filter action_process_image_name != 'osascript'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.007
    - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
