title: "Blinder Tunnel (CL-STA-1178) \u2014 Developer-Lure MSBuild Execution, GitHub-as-C2 and Chisel Tunnel (T1127 / T1574.014 / T1102.002 / T1572) \u2014 MP-025 Build Engine Drops and Executes RuntimeBroker from User App-Data"
id: ttp-2026-0184-bioc-01
status: experimental
description: |
  A build engine (MSBuild.exe or dotnet msbuild) running under the IDE creates Microsoft\RuntimeBrokers in the user's local app-data, copies binaries into it and launches RuntimeBroker.exe from there. A design-time target (GetFrameworkPaths) has no business installing and running a binary; this is the Blinder Tunnel T1127 execution primitive.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name in ("MSBuild.exe", "msbuild", "dotnet", "dotnet.exe", "sh")
    | filter action_process_image_path contains "Microsoft\\RuntimeBrokers" or action_process_image_path contains "Microsoft/RuntimeBrokers"
    | filter action_process_image_name = "RuntimeBroker.exe"
    | comp count() as launches by agent_hostname, actor_process_image_name, action_process_image_path
    | fields agent_hostname, actor_process_image_name, action_process_image_path, launches
  ----
references:
  - https://attack.mitre.org/techniques/T1127/
author: CortexSim detection_scanner
tags:
    - attack.t1127
    - attack.t1204.002
logsource:
  product: cross-platform
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
