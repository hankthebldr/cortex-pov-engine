title: "SysGoRAT Implant with systemd Persistence and In-Memory Shell \u2014 Systemd Service Creation"
id: ttp-2026-0184-bioc-01
status: experimental
description: |
  Detection of new systemd service file creation
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.FILE and event_sub_type = ENUM.FILE_CREATE
    | filter action_file_path = '/etc/systemd/system/sys-update.service'
    | filter actor_process_image_name = 'systemd'
  ----
references:
  - https://attack.mitre.org/techniques/T1543/
author: CortexSim detection_scanner
tags:
    - attack.t1543.002
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
