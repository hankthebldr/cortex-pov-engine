title: "Office Process Spawning Suspicious Command-Line Arguments \u2014 Office Process Spawned Suspicious CommandLine"
id: ttp-2026-0312-bioc-01
status: experimental
description: |
  Detection of Office process (e.g., winword.exe) launching a process with suspicious command-line arguments such as encoded PowerShell commands
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'winword.exe'
    | filter action_process_image_name = 'powershell.exe' and action_command_line contains '-e'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1204.002
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
