title: "Office Process Spawning Suspicious Command-Line Arguments \u2014 Suspicious Office Process Command-Line Behavior"
id: ttp-2026-0312-abioc-02
status: experimental
description: |
  Detects a pattern where an Office application (e.g., Word) launches a process with encoded command-line arguments indicative of PowerShell execution
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'winword.exe'
    | filter action_command_line contains '-e' and action_command_line contains 'powershell'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1204.002
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
