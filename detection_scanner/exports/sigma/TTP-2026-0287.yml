title: "Kerberos Pre-Auth Failures via Password Spraying \u2014 Kerberos Pre-Auth Failures by User and Host"
id: ttp-2026-0287-bioc-01
status: experimental
description: |
  Detects multiple Kerberos pre-authentication failures from a single host for different users, indicating credential spraying behavior
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK and event_sub_type = ENUM.NETWORK_CONNECTION
    | filter action_remote_ip = '192.0.2.100' and dst_port = 88
    | filter action_process_image_name = 'lsass.exe'
    | comp count() as cnt by actor_process_image_name, action_remote_ip, dst_port
    | comp count() as cnt by > 5
    | comp 5m
  ----
references:
  - https://attack.mitre.org/techniques/T1110/
author: CortexSim detection_scanner
tags:
    - attack.t1110.003
    - attack.t1078.002
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
