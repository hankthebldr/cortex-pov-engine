title: "Windows CGO with Anomalous Actor Process Behavior \u2014 Suspicious PowerShell Execution"
id: ttp-2026-0490-bioc-01
status: experimental
description: |
  PowerShell process starts with hidden window and downloads file from external IP
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'powershell.exe'
    | filter process_command_line contains 'Hidden' and process_command_line contains 'DownloadFile'
    | filter action_remote_ip = '192.0.2.50'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1070.004
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
