title: "Windows EDR Simulation of Uncommon Linux Remote Shell Command Execution \u2014 Uncommon Linux Remote Shell Command Execution"
id: ttp-2026-0437-bioc-01
status: experimental
description: |
  Detection of unusual shell command execution patterns that are commonly seen in lateral movement or remote access scenarios
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = '/tmp/shell.sh'
    | filter action_remote_ip = '192.0.2.10'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.004
    - attack.t1071.004
    - attack.t1105
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
