title: "Svchost.exe loads rare unsigned module via DllLoad \u2014 Unusual svchost DLL load behavior"
id: ttp-2026-0413-abioc-02
status: experimental
description: |
  Behavioral deviation where svchost.exe loads an unsigned DLL not commonly seen in baseline
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'svchost.exe'
    | filter action_file_path contains '.dll'
    | filter action_file_signature_status = 'unsigned'
    | filter action_file_path not in (SELECT file_path FROM trusted_dlls)
    | comp count() as cnt by action_file_path
    | filter count() > 1
  ----
