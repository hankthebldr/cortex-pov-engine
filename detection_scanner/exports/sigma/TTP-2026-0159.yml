title: "Compute Activity in a Dormant Cloud Region (Cryptomining) \u2014 CDR (SIM-CDR-024) \u2014 Process Execution of Python with EAL Simulator Module"
id: ttp-2026-0159-bioc-01
status: experimental
description: |
  Detection of python3 process executing the EAL simulator CLI module with run command and a specific YAML configuration file path.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'python3'
    | filter action_process_command_line contains 'scripts.eal_simulator.cli run'
    | filter action_process_command_line contains '/tmp/sim-cdr-024.yml'
  ----
references:
  - https://attack.mitre.org/techniques/T1535/
author: CortexSim detection_scanner
tags:
    - attack.t1535
    - attack.t1496
logsource:
  product: aws
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
