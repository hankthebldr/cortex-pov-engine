title: "Unsigned Process Communicating Over Email Ports to External Server \u2014 Rare communication over email ports to external email server by unsigned process"
id: ttp-2026-0331-bioc-01
status: experimental
description: |
  Detection of unsigned process making outbound connection to email port 25
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name != 'signed.exe'
    | filter action_remote_ip in ('192.0.2.1') and dst_port = 25
    | filter causality_actor_process_image_name != 'signed.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1071.004
    - attack.t1566.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
