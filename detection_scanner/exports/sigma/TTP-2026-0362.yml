title: "Remote service command execution from uncommon source \u2014 Unusual PsExec execution"
id: ttp-2026-0362-bioc-01
status: experimental
description: |
  Execution of psexec.exe from an IP address not typically seen in the environment
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'psexec.exe'
    | filter action_remote_ip != '192.0.2.10'
    | filter action_remote_ip != '192.0.2.11'
    | filter action_remote_ip != '192.0.2.12'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1021.002
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
