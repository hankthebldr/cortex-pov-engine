title: "Sensitive Data Local Staging and Password-Protected Archive Compression \u2014 Sensitive Data Staging Tmp"
id: ttp-2026-0178-bioc-01
status: experimental
description: |
  Sensitive Data Staging Tmp
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    preset = xdr_data | filter event_type = 'FILE_WRITE' and action_file_name contains 'customer_pii' and (action_file_path contains '/tmp/' or action_file_path contains 'AppData')
  ----
references:
  - https://attack.mitre.org/techniques/T1560/
author: CortexSim detection_scanner
tags:
    - attack.t1560
    - attack.t1074
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
