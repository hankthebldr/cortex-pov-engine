title: "Password-Protected Archive with Unusual Compression Pattern \u2014 Unusual Archive Password Usage"
id: ttp-2026-0478-bioc-01
status: experimental
description: |
  Detection of zip extraction with a non-standard password length or pattern
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'unzip' and action_process_command_line contains '-P'
    | filter action_process_command_line matches '123456789'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1027.002
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
