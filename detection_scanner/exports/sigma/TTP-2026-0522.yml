title: "Offensive Tooling: credking (adapter-deployed) \u2014 Credking Executed by a Service Account on the Endpoint"
id: ttp-2026-0522-bioc-01
status: experimental
description: |
  A non-interactive service account runs credking — an offensive TOOL-CREDKING-wired tool not part of normal operations on this host.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_path contains "credking" or action_process_command_line contains "credking"
    | comp count() as runs by agent_hostname, actor_effective_username
    | filter runs >= 1
  ----
references:
  - https://attack.mitre.org/techniques/T1110/
author: CortexSim detection_scanner
tags:
    - attack.t1110.001
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
