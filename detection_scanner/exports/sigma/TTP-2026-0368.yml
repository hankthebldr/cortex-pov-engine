title: "Rundll32.exe spawns conhost.exe via malicious DLL \u2014 Rundll32 spawns conhost"
id: ttp-2026-0368-bioc-01
status: experimental
description: |
  Detection of rundll32.exe spawning conhost.exe process
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'rundll32.exe' and action_process_image_name = 'conhost.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1085
    - attack.t1218.011
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
