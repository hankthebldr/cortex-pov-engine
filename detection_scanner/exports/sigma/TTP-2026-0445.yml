title: "Uncommon Net Group Command Execution via Windows Endpoint \u2014 Behavioral Net Group Command Deviation"
id: ttp-2026-0445-abioc-02
status: experimental
description: |
  ML-based anomaly detection of net.exe usage with group enumeration that deviates from baseline behavior
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'net.exe'
    | filter action_command_line contains 'group' and action_command_line contains '/domain'
    | filter not in (action_command_line, ["net group 'Domain Admins' /domain"])
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1069.002
    - attack.t1087.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
