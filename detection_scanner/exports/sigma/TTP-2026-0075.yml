title: "Active Directory Offline-Roasting Credential Harvest \u2014 AS-REP Roast + Kerberoast (T1558.004 / T1558.003) \u2014 ITDR-006 AS-REQ For Pre-Auth-Disabled Account (AS-REP Roast)"
id: ttp-2026-0075-bioc-01
status: experimental
description: |
  ITDR - a Kerberos AS-REQ / 4768 is observed for a domain account whose userAccountControl has DoesNotRequirePreAuth set. Requesting an AS-REP for such an account returns a crackable hash with no prior authentication — the AS-REP Roasting fingerprint (T1558.004).
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.ACTIVE_DIRECTORY
    | filter event_id = 4768
    | filter pre_authentication_type = 0
    | filter src_host not in ("DC01", "DC02")
    | fields _time, account_name, src_host, pre_authentication_type
  ----
references:
  - https://attack.mitre.org/techniques/T1558/
author: CortexSim detection_scanner
tags:
    - attack.t1558.004
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
