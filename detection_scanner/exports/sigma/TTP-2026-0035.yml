title: "Linux Defense Evasion \u2014 Log Tampering, Timestomping, Masquerading (T1070.002) \u2014 EDR-004 Bash History Clearing And HISTFILE Manipulation"
id: ttp-2026-0035-bioc-01
status: experimental
description: |
  Bash history clearing — HISTFILE manipulation and history -c execution detected. A shell unsets/redirects HISTFILE or truncates .bash_history.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    preset = xdr_data
    | filter event_type = ENUM.PROCESS
    | filter event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_command_line contains_any ("history -c", "HISTFILE=/dev/null", "unset HISTFILE", "> ~/.bash_history", "rm -f ~/.bash_history", "HISTSIZE=0")
  ----
references:
  - https://attack.mitre.org/techniques/T1070/
author: CortexSim detection_scanner
tags:
    - attack.t1070.003
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
