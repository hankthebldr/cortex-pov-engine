title: "Rundll32 Executes Rare Unsigned Module \u2014 Suspicious Rundll32 Execution with Unsigned DLL"
id: ttp-2026-0366-abioc-02
status: experimental
description: |
  Behavioral ABIOC detecting rundll32.exe executing an unsigned DLL, which is a common technique used in malicious payload delivery.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'rundll32.exe'
    | filter action_file_path contains '.dll'
    | filter action_file_signature_status = 'unsigned'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1218.011
