title: "Unsigned Process Creates Scheduled Task via File Access \u2014 Unsigned Process Creates Scheduled Task"
id: ttp-2026-0469-bioc-01
status: experimental
description: |
  Detects when an unsigned process creates a scheduled task via file access to the Windows Tasks directory
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'powershell.exe'
    | filter action_file_path = 'C:\\Windows\\Tasks\\malicious_task.xml'
    | filter actor_process_image_name != 'signed_process.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1053.005
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
