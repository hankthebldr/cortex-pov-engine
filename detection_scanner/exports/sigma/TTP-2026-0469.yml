title: "Unsigned Process Creates Scheduled Task via File Access \u2014 Unsigned Process Accesses Windows Tasks Directory"
id: ttp-2026-0469-abioc-02
status: experimental
description: |
  Behavioral deviation where an unsigned process accesses the Windows Tasks directory to create a scheduled task
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.FILE_ACCESS
    | filter action_file_path = 'C:\\Windows\\Tasks\\'
    | filter actor_process_image_name != 'signed_process.exe'
    | filter causality_actor_process_image_name = 'powershell.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1053.005
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
