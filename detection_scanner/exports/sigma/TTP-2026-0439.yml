title: "Uncommon Local Scheduled Task Creation via schtasks.exe \u2014 Uncommon Local Scheduled Task Creation"
id: ttp-2026-0439-bioc-01
status: experimental
description: |
  Detection of a scheduled task created locally with schtasks.exe that is not commonly seen in the environment
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'schtasks.exe'
    | filter action_command_line contains '/create'
    | filter action_command_line contains '/tn'
    | filter action_command_line contains '/tr'
    | filter action_command_line contains 'powershell.exe'
    | filter action_command_line contains 'Invoke-WebRequest'
    | filter action_command_line contains '192.0.2.50'
  ----
references:
  - https://attack.mitre.org/techniques/T1053/
author: CortexSim detection_scanner
tags:
    - attack.t1053.005
    - attack.t1059.001
    - attack.t1547.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
