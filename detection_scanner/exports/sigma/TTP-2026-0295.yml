title: "Massive Upload to Rare Storage Domain \u2014 Unusual File Upload to Rare Storage Domain"
id: ttp-2026-0295-bioc-01
status: experimental
description: |
  Detects when a process uploads files to a rarely used storage domain
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK_CONNECTION and event_sub_type = ENUM.NETWORK_OUTBOUND
    | filter action_remote_ip = '192.0.2.100'
    | filter action_file_path contains 'data.zip'
  ----
references:
  - https://attack.mitre.org/techniques/T1566/
author: CortexSim detection_scanner
tags:
    - attack.t1566
    - attack.t1071
    - attack.t1537
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
