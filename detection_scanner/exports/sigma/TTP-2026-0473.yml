title: "Unusual ADFS Remote Synchronization from Non-ADFS Server \u2014 Unusual ADFS Sync Process"
id: ttp-2026-0473-bioc-01
status: experimental
description: |
  Detection of PowerShell process starting from non-ADFS server attempting ADFS sync
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'powershell.exe'
    | filter causality_actor_process_image_name != 'lsass.exe'
    | filter action_file_path contains 'adfs'
  ----
references:
  - https://attack.mitre.org/techniques/T1078/
author: CortexSim detection_scanner
tags:
    - attack.t1078
    - attack.t1566
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
