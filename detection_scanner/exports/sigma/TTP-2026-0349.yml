title: "Unsigned Process Spawned by Office Under Suspicious Directory \u2014 Rare Unsigned Process Spawned by Office Process Under Suspicious Directory"
id: ttp-2026-0349-bioc-01
status: experimental
description: |
  Detection of unsigned processes launched by Office applications from non-standard directories.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'winword.exe'
    | filter action_process_image_name != null
    | filter action_process_image_name !~ '.*\.exe'
    | filter action_file_path contains 'C:\\Users\\Public\\'
    | filter action_file_path !~ '.*\\AppData\\.*'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1047
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
