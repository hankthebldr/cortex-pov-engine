title: "Windows Update Traffic Over HTTP \u2014 Suspicious PowerShell Usage with Update Mechanism"
id: ttp-2026-0334-abioc-02
status: experimental
description: |
  PowerShell executing download commands within a Windows Update context
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'powershell.exe'
    | filter causality_actor_process_image_name = 'svchost.exe' or causality_actor_process_image_name = 'wuauclt.exe'
    | filter action_file_path contains 'update.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1071/
author: CortexSim detection_scanner
tags:
    - attack.t1071.004
    - attack.t1566.001
    - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
