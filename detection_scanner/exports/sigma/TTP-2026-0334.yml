title: "Windows Update Traffic Over HTTP \u2014 Rare MS-Update traffic over HTTP"
id: ttp-2026-0334-bioc-01
status: experimental
description: |
  Detection of unusual HTTP traffic originating from Windows Update components
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK_CONNECTION and action_remote_ip = '192.0.2.10' and dst_port = 80
    | filter causality_actor_process_image_name = 'svchost.exe' or causality_actor_process_image_name = 'wuauclt.exe'
    | filter action_process_image_name = 'powershell.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1071/
author: CortexSim detection_scanner
tags:
    - attack.t1071.004
    - attack.t1566.001
    - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
