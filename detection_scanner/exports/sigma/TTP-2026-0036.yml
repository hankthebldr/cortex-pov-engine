title: "Linux Lateral Movement \u2014 SSH Abuse, Tunneling and Internal Recon (T1021.004) \u2014 EDR-005 Port Scan Via Bash devtcp"
id: ttp-2026-0036-bioc-01
status: experimental
description: |
  Port scanning via bash /dev/tcp — network service discovery from web service account. A bash loop probes multiple ports through /dev/tcp.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    preset = xdr_data
    | filter event_type = ENUM.PROCESS
    | filter event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name in ("bash", "sh")
    | filter action_process_image_command_line contains "/dev/tcp/"
    | filter actor_effective_username in ("www-data", "nobody", "node", "postgres", "apache", "nginx")
  ----
references:
  - https://attack.mitre.org/techniques/T1046/
author: CortexSim detection_scanner
tags:
    - attack.t1046
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
