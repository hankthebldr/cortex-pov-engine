title: "Unusual Ping Execution from Unsigned Parent Process \u2014 Ping to localhost from an uncommon, unsigned parent process"
id: ttp-2026-0314-bioc-01
status: experimental
description: |
  Detection of ping.exe execution initiated by an unsigned process
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'ping.exe'
    | filter causality_actor_process_image_name not in ('explorer.exe', 'cmd.exe', 'powershell.exe')
    | filter actor_process_image_name not in ('signed.exe', 'authenticode.exe')
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1070.006
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
