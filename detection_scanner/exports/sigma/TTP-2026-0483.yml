title: "PowerShell History File Access via Unusual Process \u2014 Unusual Process Accessed PowerShell History"
id: ttp-2026-0483-bioc-01
status: experimental
description: |
  A process not typically associated with PowerShell history access attempts to read the history file.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.FILE_ACCESS and action_file_path = 'C:\\Users\\user\\AppData\\Roaming\\Microsoft\\Windows\\PowerShell\\PSReadLine\\ConsoleHost_history.txt'
    | filter actor_process_image_name != 'powershell.exe' and actor_process_image_name != 'cmd.exe'
    | filter causality_actor_process_image_name != 'powershell.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1078
    - attack.t1566
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
