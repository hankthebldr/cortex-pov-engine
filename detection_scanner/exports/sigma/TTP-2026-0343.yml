title: "Execution of Signed Malware via Trusted Security Product \u2014 Rare security product signed executable executed in the network"
id: ttp-2026-0343-bioc-01
status: experimental
description: |
  Detection of a process that is signed by a known security vendor but is running in an unexpected network context
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name contains 'security'
    | filter action_process_image_name contains 'signed'
    | filter action_remote_ip != '192.0.2.0/24'
    | filter action_remote_ip != '10.0.0.0/8'
    | filter action_remote_ip != '172.16.0.0/12'
    | filter action_remote_ip != '127.0.0.0/8'
  ----
references:
  - https://attack.mitre.org/techniques/T1218/
author: CortexSim detection_scanner
tags:
    - attack.t1218
    - attack.t1059
    - attack.t1105
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
