title: "UUID-String Shellcode Staging with Enum-Callback Fileless Execution \u2014 Cortex ABIOC (Bookworm / ToneShell) \u2014 EDR-013 Unbacked Private-Heap Execution Reached via Locale or Window Enumeration Callback"
id: ttp-2026-0109-abioc-02
status: experimental
description: |
  The fileless core: a signed host process loads an unsigned module that has no backing image on disk (action_module_path is empty — an in-memory / unbacked region rather than a file-backed DLL) into its own address space. This is the observable xdr_data footprint of the UUID-string reflective-load idiom (bytes reassembled with UuidFromStringA onto a private heap and run without a file), which produces no VirtualAlloc(RWX), no CreateThread, and no cross-process injection to key on. In the public form of the technique control is handed to that region by passing it as the callback argument to a Win32 enumeration API such as EnumSystemLocalesA / EnumChildWindows / EnumSystemLanguageGroupsA — that callback idiom is tradecraft context, not a queryable xdr_data column, so the ABIOC anchors the deviation to the in-process causality (signed host process -> unsigned unbacked module load) that Cortex's behavioral-ML has never observed for that application. Sibling card TTP-2026-0119 keys the same unbacked-execution shape on action_module_path = "" + action_module_signature_status = "UNSIGNED".
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.MODULE and event_sub_type = ENUM.MODULE_LOAD
    | filter causality_actor_process_signature_status = "SIGNED"
    | filter action_module_path = "" and action_module_signature_status = "UNSIGNED"
    | comp count() as unbacked_module_loads by agent_hostname, causality_actor_process_image_name, causality_actor_process_instance_id, action_module_signature_status
    | filter unbacked_module_loads >= 1
    | sort desc unbacked_module_loads
    | fields agent_hostname, causality_actor_process_image_name, causality_actor_process_instance_id, unbacked_module_loads
  ----
references:
  - https://attack.mitre.org/techniques/T1620/
author: CortexSim detection_scanner
tags:
    - attack.t1620
    - attack.t1106
