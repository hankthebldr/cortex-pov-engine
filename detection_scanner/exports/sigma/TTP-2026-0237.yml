title: "Windows PowerShell with Rare TLS/HTTP User Agent Combination \u2014 PowerShell Process with Custom User-Agent"
id: ttp-2026-0237-bioc-01
status: experimental
description: |
  Detection of PowerShell process starting with a rare combination of TLS and HTTP User-Agent headers
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'powershell.exe'
    | filter action_process_image_name = 'powershell.exe'
    | filter action_remote_ip = '192.0.2.10'
    | filter dst_port = 80
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1071.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
---
title: "Windows PowerShell with Rare TLS/HTTP User Agent Combination \u2014 Abnormal TLS/HTTP User-Agent Communication"
id: ttp-2026-0237-abioc-02
status: experimental
description: |
  Detects a rare combination of TLS and HTTP User-Agent headers used in communication
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK
    | filter action_remote_ip = '192.0.2.10'
    | filter dst_port = 80
    | filter action_process_image_name = 'powershell.exe'
    | filter action_remote_ip in (SELECT remote_ip FROM network WHERE user_agent like '%Mozilla/5.0%')
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1071.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
