title: "Unusual AWS User Added to Group via CLI \u2014 Unusual AWS User Group Membership"
id: ttp-2026-0475-abioc-02
status: experimental
description: |
  Behavioral deviation in AWS user being added to administrative group outside normal patterns
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = '/tmp/aws/aws'
    | filter action_process_command_line contains 'add-user-to-group'
    | filter action_process_command_line contains 'admins'
    | filter actor_process_image_name != 'sudo'
    | filter actor_process_image_name != '/bin/bash'
  ----
references:
  - https://attack.mitre.org/techniques/T1531/
author: CortexSim detection_scanner
tags:
    - attack.t1531
    - attack.t1078
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
