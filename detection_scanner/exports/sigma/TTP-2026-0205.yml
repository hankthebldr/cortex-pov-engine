title: "Windows Service Creation with Rare Binary Path for Persistence \u2014 Uncommon Service Binary Path"
id: ttp-2026-0205-bioc-01
status: experimental
description: |
  Detection of a service being started with a binary path that is not commonly seen in enterprise environments
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'sc.exe'
    | filter action_file_path contains 'C:\\temp\\malware\\malware.exe'
    | filter action_file_path not in (known_service_paths)
  ----
references:
  - https://attack.mitre.org/techniques/T1543/
author: CortexSim detection_scanner
tags:
    - attack.t1543.003
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
