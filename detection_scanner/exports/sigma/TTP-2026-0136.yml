title: "React2Shell Pod-RCE to Cloud Control-Plane Pivot (CVE-2025-55182) \u2014 Cortex ABIOC \u2014 RSC Deserialization RCE App Container CGO Spawns an Interactive Shell"
id: ttp-2026-0136-abioc-01
status: experimental
description: |
  The internet-facing application process (node, next-server, java, python3, php-fpm, ruby) that owns the pod's causality chain spawns an interactive shell (sh, bash, dash, ash) — behaviour absent from its learned baseline. A web app that serves RSC responses never forks a shell in normal operation; the novelty gate (prior_shell_spawns = 0 from the baseline join) is the discriminator so a legitimate entrypoint/exec that routinely shells out does not fire. This is the endpoint root of the React2Shell chain: deserialization RCE turns the CGO app process into a shell parent. Anchored on causality_actor_process_image_name + causality_actor_process_instance_id so every downstream stage in the same pod lineage stitches back to this node.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter _time > to_timestamp(current_time() - 3600)
    | filter causality_actor_process_image_name in ("node", "next-server", "java", "python3", "php-fpm", "ruby")
    | filter actor_process_image_name in ("sh", "bash", "dash", "ash")
    | comp count() as shell_spawns_now, min(_time) as first_seen by agent_hostname, container_id, causality_id, causality_actor_process_image_name, causality_actor_process_instance_id, actor_process_image_name
    | join type=left (dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter _time < to_timestamp(current_time() - 3600)
    | filter causality_actor_process_image_name in ("node", "next-server", "java", "python3", "php-fpm", "ruby")
    | filter actor_process_image_name in ("sh", "bash", "dash", "ash")
    | comp count() as prior_shell_spawns by container_id) as baseline baseline.container_id = container_id
    | alter prior_shell_spawns = coalesce(prior_shell_spawns, 0)
    | filter shell_spawns_now >= 1 and prior_shell_spawns = 0
    | fields agent_hostname, container_id, causality_id, causality_actor_process_image_name, causality_actor_process_instance_id, actor_process_image_name, shell_spawns_now, prior_shell_spawns, first_seen
  ----
references:
  - https://attack.mitre.org/techniques/T1190/
author: CortexSim detection_scanner
tags:
    - attack.t1190
    - attack.t1059.004
