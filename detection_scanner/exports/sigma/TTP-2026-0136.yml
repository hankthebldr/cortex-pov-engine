title: "React2Shell Pod-RCE to Cloud Control-Plane Pivot (CVE-2025-55182) \u2014 Cortex ABIOC \u2014 SSRF-Driven Instance Metadata Node IAM Role Theft from a Container Process"
id: ttp-2026-0136-abioc-04
status: experimental
description: |
  A container process descended from the exposed app CGO reaches the instance metadata service IP (169.254.169.254) for the FIRST time to pull the node's attached IAM role credentials — the container-to-cloud bridge in the React2Shell chain. The host/pod's learned baseline shows no prior IMDS contact; the novelty gate (prior_imds_requests = 0) means a workload that routinely mints instance-role credentials does NOT fire. Anchored on the pod causality chain AND the node identity so the endpoint IMDS reach can be stitched to the cloud-plane stage where the stolen role is used.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK
    | filter _time > to_timestamp(current_time() - 3600)
    | filter action_remote_ip = "169.254.169.254"
    | filter causality_actor_process_image_name in ("node", "next-server", "java", "python3", "php-fpm", "ruby")
    | filter actor_process_image_name in ("sh", "bash", "dash", "curl", "wget")
    | comp count() as imds_requests_now, min(_time) as first_seen by agent_hostname, container_id, causality_id, causality_actor_process_instance_id, actor_process_image_name
    | join type=left (dataset = xdr_data
    | filter event_type = ENUM.NETWORK
    | filter action_remote_ip = "169.254.169.254"
    | filter _time < to_timestamp(current_time() - 3600)
    | comp count() as prior_imds_requests by agent_hostname) as baseline baseline.agent_hostname = agent_hostname
    | alter prior_imds_requests = coalesce(prior_imds_requests, 0)
    | filter imds_requests_now >= 1 and prior_imds_requests = 0
    | fields agent_hostname, container_id, causality_id, causality_actor_process_instance_id, actor_process_image_name, imds_requests_now, prior_imds_requests, first_seen
  ----
references:
  - https://attack.mitre.org/techniques/T1552/
