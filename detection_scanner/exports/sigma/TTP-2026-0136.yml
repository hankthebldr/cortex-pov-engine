title: "React2Shell Pod-RCE to Cloud Control-Plane Pivot (CVE-2025-55182) \u2014 Cortex ABIOC \u2014 In-Pod Kubernetes API Secret Enumeration from an App-Rooted Process Lineage"
id: ttp-2026-0136-abioc-03
status: experimental
description: |
  A process descended from the exposed app CGO opens an outbound TLS session to the in-cluster Kubernetes API server (kubernetes.default.svc / the 10.x cluster-IP on 443) and pulls the secrets/RBAC surface with the stolen bearer token — the T1613 stage of the React2Shell chain. Application pods do talk to the API server via their SDK, so the discriminator is that the API reach originates from a shell/curl process (not the app runtime) whose CGO is the web app, and the container has no prior baseline of API calls from that process family. Anchored on the pod causality_id so the discovery node stitches to the token-read and IMDS nodes.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK
    | filter _time > to_timestamp(current_time() - 3600)
    | filter action_remote_port = 443
    | filter dst_action_external_hostname contains "kubernetes.default" or action_remote_ip in ("10.96.0.1", "10.43.0.1")
    | filter causality_actor_process_image_name in ("node", "next-server", "java", "python3", "php-fpm", "ruby")
    | filter actor_process_image_name in ("sh", "bash", "dash", "curl", "wget", "kubectl")
    | comp count() as api_calls, min(_time) as first_seen by agent_hostname, container_id, causality_id, causality_actor_process_instance_id, actor_process_image_name, action_remote_ip
    | filter api_calls >= 1
    | fields agent_hostname, container_id, causality_id, causality_actor_process_instance_id, actor_process_image_name, action_remote_ip, api_calls, first_seen
  ----
references:
  - https://attack.mitre.org/techniques/T1613/
author: CortexSim detection_scanner
tags:
    - attack.t1613
