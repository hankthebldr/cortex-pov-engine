title: "React2Shell Pod-RCE to Cloud Control-Plane Pivot (CVE-2025-55182) \u2014 Cortex ABIOC \u2014 Kubernetes Service Account Token Read by an Anomalous Descendant of the App Container CGO"
id: ttp-2026-0136-abioc-02
status: experimental
description: |
  A process whose causality group owner is the exposed app container reads the auto-mounted service-account token at /var/run/secrets/kubernetes.io/serviceaccount/token. A workload that legitimately uses its service account reads that file from its own runtime, not from a shell/curl/cat forked out of the web process after an RCE. The discriminator is the pairing of the sensitive SAT path with a CGO that is the web app AND a reader process in the shell family — the ABIOC keys on causality_actor_process_instance_id so it fuses to the same lineage as the RCE shell rather than alerting on every SAT access cluster-wide.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.FILE and event_sub_type in (ENUM.FILE_OPEN, ENUM.FILE_READ)
    | filter _time > to_timestamp(current_time() - 3600)
    | filter action_file_path contains "/var/run/secrets/kubernetes.io/serviceaccount/token"
    | filter causality_actor_process_image_name in ("node", "next-server", "java", "python3", "php-fpm", "ruby")
    | filter actor_process_image_name in ("sh", "bash", "dash", "cat", "curl", "wget", "head")
    | comp count() as token_reads, min(_time) as first_seen by agent_hostname, container_id, causality_id, causality_actor_process_image_name, causality_actor_process_instance_id, actor_process_image_name, action_file_path
    | filter token_reads >= 1
    | fields agent_hostname, container_id, causality_id, causality_actor_process_image_name, causality_actor_process_instance_id, actor_process_image_name, action_file_path, token_reads, first_seen
  ----
references:
  - https://attack.mitre.org/techniques/T1552/
author: CortexSim detection_scanner
