title: "React2Shell Pod-RCE to Cloud Control-Plane Pivot (CVE-2025-55182) \u2014 Cortex ABIOC \u2014 Stolen Node IAM Role Used in the Cloud Control Plane After Pod Compromise"
id: ttp-2026-0136-abioc-05
status: experimental
description: |
  The node's attached IAM role (an AssumedRole tied to the compromised instance) suddenly issues control-plane calls — sts:GetCallerIdentity followed by a broad set of distinct read/list operations against backend infrastructure (S3, Secrets Manager, RDS, DynamoDB) — from a session context that first appears right after the pod's IMDS reach. This is the cloud side of the React2Shell pivot and the shared entity that stitches the container plane to the cloud plane: the same node role that the pod stole. The discriminator is the burst of distinct backend operations by a node/instance role that normally only performs a narrow, stable set of workload calls, correlated in time with the endpoint IMDS theft.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = cloud_audit_logs
    | filter cloud_provider = "aws"
    | filter _time > to_timestamp(current_time() - 3600)
    | filter user_identity_type = "AssumedRole"
    | filter user_identity_arn contains ":assumed-role/" and user_identity_arn contains "node"
    | filter event_name in ("GetCallerIdentity", "ListBuckets", "GetObject", "GetSecretValue", "ListSecrets", "DescribeDBInstances", "Scan")
    | comp count_distinct(event_name) as distinct_ops, count() as api_calls, min(_time) as first_call, max(_time) as last_call by user_identity_arn, source_ip_address
    | alter burst_span_seconds = timestamp_diff(last_call, first_call, "SECOND")
    | filter distinct_ops >= 3 and burst_span_seconds <= 300
    | fields user_identity_arn, source_ip_address, distinct_ops, api_calls, burst_span_seconds
  ----
references:
  - https://attack.mitre.org/techniques/T1078/
author: CortexSim detection_scanner
tags:
    - attack.t1078.004
