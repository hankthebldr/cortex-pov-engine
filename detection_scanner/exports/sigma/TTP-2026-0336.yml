title: "Rare NTLM Usage by User - Lateral Movement via SMB \u2014 Unusual SMB Authentication Pattern"
id: ttp-2026-0336-abioc-02
status: experimental
description: |
  Detection of NTLM authentication attempts from user account to multiple targets in short time window
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK_CONNECTION
    | filter action_remote_ip in ('192.0.2.100', '192.0.2.101', '192.0.2.102')
    | filter dst_port = 445
    | filter actor_process_image_name = 'ntlm_smb.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1046/
author: CortexSim detection_scanner
tags:
    - attack.t1046
