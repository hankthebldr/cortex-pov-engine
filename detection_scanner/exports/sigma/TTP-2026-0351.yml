title: "WinRM Session via PowerShell with C2 Communication \u2014 Rare WinRM Session"
id: ttp-2026-0351-bioc-01
status: experimental
description: |
  Unusual PowerShell process initiating WinRM session to non-standard host
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'powershell.exe'
    | filter action_process_image_name = 'powershell.exe'
    | filter causality_actor_process_image_name = 'powershell.exe'
    | filter action_file_path contains 'WinRM'
    | filter dst_ip = '192.0.2.10'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1021.006
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
