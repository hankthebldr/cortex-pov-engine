title: "Windows Service Installation via sc.exe \u2014 New Windows Service Creation"
id: ttp-2026-0283-bioc-01
status: experimental
description: |
  Detection of new service creation via sc.exe
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'sc.exe'
    | filter action_process_image_name = 'sc.exe'
    | filter action_file_path contains 'create'
  ----
references:
  - https://attack.mitre.org/techniques/T1543/
author: CortexSim detection_scanner
tags:
    - attack.t1543.003
    - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
