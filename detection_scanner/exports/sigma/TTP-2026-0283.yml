title: "Windows Service Installation via sc.exe \u2014 Suspicious Service Creation with Non-Standard Binary Path"
id: ttp-2026-0283-abioc-02
status: experimental
description: |
  Detection of service creation using a binary path not typical for system services
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'sc.exe'
    | filter action_file_path contains 'temp'
    | filter action_file_path contains 'malware.exe'
  ----
references:
