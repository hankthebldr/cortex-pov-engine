title: "RDP Session Hijacking via tscon.exe \u2014 Suspicious tscon.exe Usage"
id: ttp-2026-0321-bioc-01
status: experimental
description: |
  Detection of tscon.exe being executed with parameters that redirect to console
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'tscon.exe'
    | filter action_process_command_line contains '/dest:console'
  ----
references:
  - https://attack.mitre.org/techniques/T1076/
author: CortexSim detection_scanner
tags:
    - attack.t1076
    - attack.t1563
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
