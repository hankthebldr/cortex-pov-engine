title: "Credential Extraction from Unix Files via Linux Shell \u2014 Extracting Credentials from Unix Files"
id: ttp-2026-0270-bioc-01
status: experimental
description: |
  Process accessing password and shadow files for credential extraction
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = '/usr/bin/wget' and action_file_path IN ('/etc/passwd', '/etc/shadow')
  ----
references:
  - https://attack.mitre.org/techniques/T1003/
author: CortexSim detection_scanner
tags:
    - attack.t1003
    - attack.t1059
    - attack.t1552
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
