title: "Prisma Browser \u2014 Credential Paste into Untrusted Origin (T1552) \u2014 Prisma Browser \u2014 credential-shape paste into non-sanctioned origin (DLP rule)"
id: ttp-2026-0017-bioc-01
status: experimental
description: |
  Prisma Browser — credential-shape paste into non-sanctioned origin (DLP rule). A paste action carrying a credential-classified payload lands in a password/secret field on an origin that is not on the sanctioned SaaS allowlist.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = prisma_browser_events
    | filter action = "paste"
    | filter data_classification in ("credential", "secret", "password")
    | filter origin not in ("login.corp.example.com", "okta.corp.example.com", "login.microsoftonline.com")
    | filter target_selector contains "password" or url contains "signin" or url contains "login"
  ----
references:
  - https://attack.mitre.org/techniques/T1552/
author: CortexSim detection_scanner
tags:
    - attack.t1552
    - attack.t1056.003
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
