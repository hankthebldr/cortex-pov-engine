title: "PowerShell Scripting Engine Connecting to Rare External Host \u2014 Scripting Engine Connected to Rare External Host"
id: ttp-2026-0372-bioc-01
status: experimental
description: |
  Detection of PowerShell or WSH process connecting to an IP address that is not commonly seen in the environment
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK_CONNECTION
    | filter action_remote_ip != null
    | filter action_remote_ip not in (SELECT DISTINCT action_remote_ip FROM xdr_data WHERE event_type = ENUM.NETWORK_CONNECTION AND agent_hostname = 'host1' AND timestamp > now() - 1d)
    | filter actor_process_image_name in ('powershell.exe', 'wscript.exe', 'cscript.exe')
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1071.004
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
