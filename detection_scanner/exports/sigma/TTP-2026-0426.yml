title: "Uncommon Cloud CLI Tool Usage via AWS CLI \u2014 Uncommon Cloud CLI Process Start"
id: ttp-2026-0426-bioc-01
status: experimental
description: |
  Detection of AWS CLI being executed from non-standard location
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = '/tmp/awscli'
    | filter actor_process_image_name != 'bash'
    | filter actor_process_image_name != 'sh'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059
    - attack.t1566
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
