title: "Uncommon Cloud CLI Tool Usage via AWS CLI \u2014 Uncommon Cloud CLI Usage Behavior"
id: ttp-2026-0426-abioc-02
status: experimental
description: |
  ML-based detection of AWS CLI being used in unexpected way for file upload
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = '/tmp/awscli'
    | filter action_file_path = '/etc/passwd'
    | filter action_remote_ip = 's3.amazonaws.com'
  ----
references:
  - https://attack.mitre.org/techniques/T1566/
author: CortexSim detection_scanner
tags:
    - attack.t1566
    - attack.t1059
    - attack.t1531
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
