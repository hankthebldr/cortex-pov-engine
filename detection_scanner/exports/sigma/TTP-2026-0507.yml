title: "Unusual SSH Activity via Automated Login and Command Execution \u2014 SSH Client Process Start"
id: ttp-2026-0507-bioc-01
status: experimental
description: |
  Detection of SSH client process execution from non-standard location
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name contains '/tmp/.ssh/' and actor_process_image_name = 'sshd'
  ----
references:
  - https://attack.mitre.org/techniques/T1021/
author: CortexSim detection_scanner
tags:
    - attack.t1021.004
    - attack.t1059.004
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
