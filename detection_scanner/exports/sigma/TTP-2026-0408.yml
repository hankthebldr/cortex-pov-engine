title: "Domain Controller SMB Connection via DCSync \u2014 Suspicious SMB Connection from Domain Controller"
id: ttp-2026-0408-bioc-01
status: experimental
description: |
  Detects an SMB connection initiated from a domain controller to a remote IP address
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK_CONNECTION
    | filter action_remote_ip != '192.0.2.0/24'
    | filter dst_port = 445
    | filter actor_process_image_name = 'lsass.exe' or actor_process_image_name = 'net.exe'
    | filter causality_actor_process_image_name = 'dcdomaincontroller.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1003/
author: CortexSim detection_scanner
tags:
    - attack.t1003.006
    - attack.t1077
    - attack.t1558.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
