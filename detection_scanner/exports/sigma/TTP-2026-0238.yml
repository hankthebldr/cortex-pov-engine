title: "Dormant Host Reconnaissance via Newly Seen Endpoint \u2014 Abnormal Dormant Host Connection"
id: ttp-2026-0238-bioc-01
status: experimental
description: |
  A newly seen endpoint makes an outbound connection to a dormant host that has not previously been contacted.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK_CONNECTION
    | filter action_remote_ip = '192.0.2.50'
    | filter actor_process_image_name != null
    | filter not exists (select * from xdr_data where event_type = ENUM.NETWORK_CONNECTION and action_remote_ip = '192.0.2.50' and agent_hostname = agent_hostname)
    | filter agent_hostname != null
  ----
references:
  - https://attack.mitre.org/techniques/T1046/
author: CortexSim detection_scanner
tags:
    - attack.t1046
    - attack.t1071
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
