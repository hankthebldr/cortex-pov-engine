title: "Kerberos Pre-Auth Failures via AS-REP Roasting \u2014 Kerberos AS-REP Failure by Host"
id: ttp-2026-0286-bioc-01
status: experimental
description: |
  Detects multiple failed Kerberos AS-REP requests from a single host
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK and event_sub_type = ENUM.NETWORK_CONNECTION
    | filter action_remote_ip = '192.0.2.100' and dst_port = 88 and action_process_image_name = 'python3'
    | comp count() as cnt by agent_hostname
    | comp count() as cnt by > 5
  ----
references:
  - https://attack.mitre.org/techniques/T1586/
author: CortexSim detection_scanner
tags:
    - attack.t1586
    - attack.t1078
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
