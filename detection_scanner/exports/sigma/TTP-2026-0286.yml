title: "Kerberos Pre-Auth Failures via AS-REP Roasting \u2014 Kerberos Pre-Auth Failure Pattern"
id: ttp-2026-0286-abioc-02
status: experimental
description: |
  Detects unusual Kerberos pre-authentication failures from a single host in a short time window
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK and event_sub_type = ENUM.NETWORK_CONNECTION
    | filter action_remote_ip = '192.0.2.100' and dst_port = 88
    | comp count() as cnt by agent_hostname
    | comp count() as cnt by > 3
    | comp 1m
  ----
references:
  - https://attack.mitre.org/techniques/T1586/
