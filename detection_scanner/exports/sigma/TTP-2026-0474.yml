title: "Unusual AWS Credentials Creation via PowerShell \u2014 AWS Credential Creation Process"
id: ttp-2026-0474-bioc-01
status: experimental
description: |
  Detection of PowerShell process creating AWS credentials
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'powershell.exe'
    | filter action_process_command_line contains 'New-AWSCredential'
    | filter action_file_path contains '.aws/credentials'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1531
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
