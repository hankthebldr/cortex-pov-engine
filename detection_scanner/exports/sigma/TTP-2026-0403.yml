title: "Proxy Environment Variable Manipulation for Lateral Movement \u2014 Suspicious Proxy Environment Variable Setting"
id: ttp-2026-0403-bioc-01
status: experimental
description: |
  Detection of environment variables being set to redirect traffic through a non-standard proxy
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'bash'
    | filter action_file_path contains 'export'
    | filter action_file_path contains 'http_proxy'
    | filter action_file_path contains '192.0.2.5'
  ----
references:
  - https://attack.mitre.org/techniques/T1071/
author: CortexSim detection_scanner
tags:
    - attack.t1071.001
    - attack.t1059.001
    - attack.t1566.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
