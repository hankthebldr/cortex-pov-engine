title: "Netsh Helper DLL Registry Key Manipulation \u2014 Suspicious Netsh Process Execution"
id: ttp-2026-0294-abioc-02
status: experimental
description: |
  Detection of netsh.exe executing a non-standard DLL via registry manipulation
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = "netsh.exe"
    | filter causality_actor_process_image_name contains "reg.exe"
  ----
references:
  - https://attack.mitre.org/techniques/T1546/
author: CortexSim detection_scanner
