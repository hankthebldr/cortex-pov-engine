title: "Netsh Helper DLL Registry Key Manipulation \u2014 Netsh Helper DLL Registry Modification"
id: ttp-2026-0294-bioc-01
status: experimental
description: |
  Detection of registry key changes to netsh helper DLL paths
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.REGISTRY and event_sub_type = ENUM.REGISTRY_SET_VALUE
    | filter action_file_path contains "HKLM\\SYSTEM\\CurrentControlSet\\Services\\netsh"
    | filter action_process_image_name = "reg.exe"
  ----
references:
  - https://attack.mitre.org/techniques/T1546/
author: CortexSim detection_scanner
tags:
    - attack.t1546.007
    - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
