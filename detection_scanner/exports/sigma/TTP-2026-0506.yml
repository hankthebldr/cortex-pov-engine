title: "Uncommon SSH Session with Malware Delivery \u2014 Uncommon SSH Session"
id: ttp-2026-0506-bioc-01
status: experimental
description: |
  SSH session initiated from an IP address not typically seen for SSH connections
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK_CONNECTION and event_sub_type = ENUM.NETWORK_CONNECTION_START
    | filter action_remote_ip != '192.0.2.50'
    | filter dst_port = 22
    | filter actor_process_image_name = 'sshd'
  ----
references:
  - https://attack.mitre.org/techniques/T1021/
author: CortexSim detection_scanner
tags:
    - attack.t1021.004
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
