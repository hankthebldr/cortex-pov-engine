title: "Uncommon SSH Session with Malware Delivery \u2014 Uncommon SSH Session with File Execution"
id: ttp-2026-0506-abioc-02
status: experimental
description: |
  SSH session followed by execution of a file from a temporary directory
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK_CONNECTION and event_sub_type = ENUM.NETWORK_CONNECTION_START
    | filter action_remote_ip != '192.0.2.50'
    | filter dst_port = 22
    | join with process_start on actor_process_image_name
    | filter action_process_image_name contains '/tmp/'
  ----
references:
  - https://attack.mitre.org/techniques/T1021/
author: CortexSim detection_scanner
tags:
    - attack.t1021.004
    - attack.t1059.004
