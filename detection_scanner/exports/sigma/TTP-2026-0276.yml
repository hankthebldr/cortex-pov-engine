title: "Suspicious Network Activity from Common Process Using Uncommon IP \u2014 Unusual Network Behavior from Common Process"
id: ttp-2026-0276-abioc-02
status: experimental
description: |
  Behavioral deviation where a common Windows process initiates a connection to an IP address not previously seen in the environment.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK_CONNECTION
    | filter action_process_image_name = 'powershell.exe'
    | filter action_remote_ip not in (select distinct action_remote_ip from xdr_data where event_type = ENUM.NETWORK_CONNECTION and actor_process_image_name = 'powershell.exe' and timestamp > now() - 30d)
    | filter action_remote_ip in (select ip from uncommon_ips)
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1071.004
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
