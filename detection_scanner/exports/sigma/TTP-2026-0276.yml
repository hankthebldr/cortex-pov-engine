title: "Suspicious Network Activity from Common Process Using Uncommon IP \u2014 Globally Uncommon IP Address by Common Process"
id: ttp-2026-0276-bioc-01
status: experimental
description: |
  Detection of a common Windows process (e.g., powershell.exe) connecting to a globally uncommon IP address.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK_CONNECTION
    | filter action_process_image_name = 'powershell.exe'
    | filter action_remote_ip in (select ip from uncommon_ips)
    | filter not action_remote_ip in (select ip from known_good_ips)
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1071.004
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
