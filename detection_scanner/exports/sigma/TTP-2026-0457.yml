title: "Uncommon Service Stop Operation via sc.exe \u2014 Uncommon Service Stop Operation"
id: ttp-2026-0457-bioc-01
status: experimental
description: |
  Detection of sc.exe stopping a service that is not typically stopped by normal user activity
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'sc.exe' and action_file_path contains 'stop'
    | filter causality_actor_process_image_name != 'services.exe'
    | filter causality_actor_process_image_name != 'svchost.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1562/
author: CortexSim detection_scanner
tags:
    - attack.t1562.001
    - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
