title: "Microsoft 365 Storage Exfiltration + Mailbox Enumeration by an Azure Application (SIM-CLOUD-008) \u2014 Microsoft 365 Storage Services Exfiltration Activity"
id: ttp-2026-0164-abioc-02
status: experimental
description: |
  A user or application drives a bulk FileDownloaded / FileSyncDownloadedFull burst out of OneDrive/SharePoint in the unified audit log — the mass download-to-external shape the 'Microsoft 365 storage services exfiltration activity' XSIAM analytics alert keys on. This is an auto-tuned behavioral-ML (ABIOC) detection: it anchors the volume / distinct-file deviation to the identity's learned storage-access baseline (UserId + ClientIP), not to a static threshold or a known-bad file, so a sudden high-volume pull of many distinct sensitive documents is the exfiltration signal.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = msft_o365_audit
    | filter Workload in ("OneDrive", "SharePoint") and Operation in ("FileDownloaded", "FileSyncDownloadedFull")
    | comp count() as download_ops, count_distinct(ObjectId) as files_pulled by UserId, ClientIP, Workload
    | filter download_ops >= 15 and files_pulled >= 5
    | sort desc download_ops
    | fields UserId, ClientIP, Workload, download_ops, files_pulled
  ----
references:
  - https://attack.mitre.org/techniques/T1567/
author: CortexSim detection_scanner
tags:
    - attack.t1567.002
    - attack.t1530
logsource:
  product: saas-m365
  category: process_creation
detection:
  selection:
