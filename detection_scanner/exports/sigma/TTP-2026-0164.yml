title: "Microsoft 365 Storage Exfiltration + Mailbox Enumeration by an Azure Application (SIM-CLOUD-008) \u2014 Mailbox Enumeration Activity by an Azure Application"
id: ttp-2026-0164-abioc-01
status: experimental
description: |
  An Azure AD (Entra) OAuth application service principal performs a high-fan-out MailItemsAccessed Bind burst against Exchange Online mailboxes in the unified audit log. This is the 'Mailbox enumeration activity by Azure application' XSIAM analytics alert: an auto-tuned behavioral-ML detection that anchors the deviation to the application identity (AppId / ClientAppId) rather than a known-bad string — a low-baseline app suddenly binding many mailbox items in a short window is the app-driven mailbox-harvest signal, with no interactive login or consent event to alert on.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = msft_o365_audit
    | filter Workload = "Exchange" and Operation = "MailItemsAccessed"
    | filter MailAccessType = "Bind" and AppId != null
    | comp count() as bind_ops, count_distinct(ObjectId) as mailboxes_touched by AppId, ClientAppId, UserId, ClientIP
    | filter bind_ops >= 20
    | sort desc bind_ops
    | fields AppId, ClientAppId, UserId, ClientIP, bind_ops, mailboxes_touched
  ----
references:
  - https://attack.mitre.org/techniques/T1114/
author: CortexSim detection_scanner
tags:
    - attack.t1114
logsource:
  product: saas-m365
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
