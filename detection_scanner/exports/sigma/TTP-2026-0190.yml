title: "UAC Bypass via fodhelper.exe Registry Hijack \u2014 fodhelper UAC Bypass"
id: ttp-2026-0190-bioc-01
status: experimental
description: |
  Detection of fodhelper.exe starting a PowerShell process with DelegateExecute registry key
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'fodhelper.exe'
    | filter action_process_image_name = 'powershell.exe'
    | filter causality_actor_process_image_name = 'fodhelper.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1548/
author: CortexSim detection_scanner
tags:
    - attack.t1548.002
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
