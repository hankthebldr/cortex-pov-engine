title: "Repellent Scorpius Cicada3301 \u2014 Share Enum, PsExec Spread, Rclone Exfil, Encryption (T1570 / T1567.002 / T1486) \u2014 MP-031 Share Enumeration Output Written to found_shares.txt"
id: ttp-2026-0190-bioc-01
status: experimental
description: |
  A process chain that enumerates mounts, filesystems or shares writes a file named found_shares.txt — the share-enumeration output file named in the report.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    preset = xdr_data
    | filter event_type = ENUM.FILE and event_sub_type in (ENUM.FILE_CREATE_NEW, ENUM.FILE_WRITE)
    | filter action_file_name = "found_shares.txt"
    | fields agent_hostname, actor_process_image_name, actor_process_command_line, action_file_path, causality_id
  ----
references:
  - https://attack.mitre.org/techniques/T1135/
author: CortexSim detection_scanner
tags:
    - attack.t1135
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
