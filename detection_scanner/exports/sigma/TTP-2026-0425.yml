title: "Clearing Shell History via Windows Command Prompt \u2014 Uncommon Shell History Clearing"
id: ttp-2026-0425-bioc-01
status: experimental
description: |
  Detection of process attempting to delete or clear shell history files in Windows
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'cmd.exe'
    | filter action_command_line contains 'del' and action_command_line contains 'ConsoleHost_history.txt'
  ----
references:
  - https://attack.mitre.org/techniques/T1070/
author: CortexSim detection_scanner
tags:
    - attack.t1070.003
    - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
