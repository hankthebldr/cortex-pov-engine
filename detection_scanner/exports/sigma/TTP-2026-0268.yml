title: "DLLHost Execution with Empty Command Line \u2014 Execution of dllhost.exe with empty command line"
id: ttp-2026-0268-bioc-01
status: experimental
description: |
  Detection of dllhost.exe being executed with no arguments, which is highly suspicious and often used in malicious contexts.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'dllhost.exe' and action_process_command_line = ''
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1086
    - attack.t1546.008
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
