title: "Masquerading as Common Software with Suspicious Process Creation \u2014 Suspicious Process Start from Temp Directory"
id: ttp-2026-0257-abioc-02
status: experimental
description: |
  Detection of process execution from a temporary directory with a name mimicking a legitimate system utility
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name contains '/tmp/'
    | filter action_process_image_name contains 'explorer.exe'
    | filter actor_process_image_name not contains 'Windows\System32'
  ----
references:
  - https://attack.mitre.org/techniques/T1036/
author: CortexSim detection_scanner
