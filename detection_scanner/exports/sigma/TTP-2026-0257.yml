title: "Masquerading as Common Software with Suspicious Process Creation \u2014 Process Masquerading as Common Utility"
id: ttp-2026-0257-bioc-01
status: experimental
description: |
  Detection of process creation where the executable name mimics a legitimate system utility like 'explorer.exe' but originates from an unusual path
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name contains 'explorer.exe'
    | filter actor_process_image_name not contains 'Windows\System32\explorer.exe'
    | filter actor_process_image_name not contains 'Program Files\Windows\explorer.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1036/
author: CortexSim detection_scanner
tags:
    - attack.t1036.005
    - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
