title: "AWS SSM Agent Network Connection via PowerShell \u2014 Suspicious Network Connection from SSM Agent"
id: ttp-2026-0393-bioc-01
status: experimental
description: |
  Detects outbound network connections initiated by the SSM agent process
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK
    | filter causality_actor_process_image_name = 'ssmagent.exe'
    | filter action_remote_ip = '192.0.2.100'
    | filter dst_port = 80
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1071.004
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
