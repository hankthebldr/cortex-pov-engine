title: "AWS SSM Agent Network Connection via PowerShell \u2014 SSM Agent PowerShell Execution"
id: ttp-2026-0393-abioc-02
status: experimental
description: |
  Behavioral deviation where SSM agent spawns PowerShell with suspicious command line arguments
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter causality_actor_process_image_name = 'ssmagent.exe'
    | filter action_process_image_name = 'powershell.exe'
    | filter action_process_command_line contains '-NoP -W Hidden -Exec Bypass'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1071.004
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
