title: "Akira (Howling Scorpius) vCenter-to-ESXi Kill Chain \u2014 VMDK-Copy Offline Credential Theft to Akira_v2 Encryption (SIM-EDR-019) \u2014 Akira ESXi Offline VMDK Credential-Theft Pivot"
id: ttp-2026-0132-abioc-05
status: experimental
description: |
  The novel differentiator: after the DC VMDK is cloned, an offline extractor (mimikatz/secretsdump/esentutl/reg) reads NTDS.dit + SYSTEM/SAM from the mounted clone on the attacker VM. Because the dump happens off-host, no endpoint detection fires on the real DC — the ABIOC anchors on the cloned-VMDK shared entity crossing into the attacker VM's process lineage.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name in ("mimikatz.exe", "secretsdump.py", "impacket-secretsdump", "esentutl.exe", "reg.exe")
    | filter action_process_image_command_line contains "ntds" or action_process_image_command_line contains "NTDS" or action_process_image_command_line contains "SYSTEM" or action_process_image_command_line contains "SAM"
    | comp count() as offline_extractions by agent_hostname, causality_actor_process_image_name, causality_actor_process_instance_id, actor_process_instance_id
    | filter offline_extractions >= 1
    | fields agent_hostname, causality_actor_process_image_name, causality_actor_process_instance_id, actor_process_instance_id, offline_extractions
  ----
references:
  - https://attack.mitre.org/techniques/T1003/
author: CortexSim detection_scanner
tags:
