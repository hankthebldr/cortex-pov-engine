status: experimental
description: |
  vmkfstools/cp/dd copying a .vmdk within /vmfs/volumes/ after the DC VM is powered off — the offline-disk clone that carries credentials off the DC. Anchored to the ESXi-shell CGO via causality_actor_process_instance_id.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    preset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter agent_os_type = ENUM.AGENT_OS_LINUX
    | filter action_process_image_name in ("vmkfstools", "cp", "dd")
    | filter action_process_image_command_line contains ".vmdk" and action_process_image_command_line contains "/vmfs/volumes/"
    | filter causality_actor_process_image_name in ("esxcli", "vim-cmd", "localcli", "sshd")
    | comp count() as clone_ops by agent_hostname, causality_actor_process_instance_id, action_process_image_command_line
    | filter clone_ops >= 1
    | fields agent_hostname, causality_actor_process_instance_id, action_process_image_command_line, clone_ops
