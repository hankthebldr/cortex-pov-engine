title: "Akira (Howling Scorpius) vCenter-to-ESXi Kill Chain \u2014 VMDK-Copy Offline Credential Theft to Akira_v2 Encryption (SIM-EDR-019) \u2014 Akira ESXi Interactive Shell From vCenter-Initiated Session"
id: ttp-2026-0132-bioc-01
status: experimental
description: |
  The Causality Group Owner: an esxcli/vim-cmd shell whose causality actor is a vCenter-initiated sshd/hostd/dcui session. Keys on causality_actor_process_* + instance_id so every downstream hypervisor action is owned by this CGO rather than the beacon.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    preset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter agent_os_type = ENUM.AGENT_OS_LINUX
    | filter action_process_image_name in ("esxcli", "vim-cmd", "localcli")
    | filter causality_actor_process_image_name in ("sshd", "hostd", "dcui")
    | comp count() as shell_execs by agent_hostname, causality_actor_process_image_name, causality_actor_process_instance_id
    | filter shell_execs >= 1
    | fields agent_hostname, causality_actor_process_image_name, causality_actor_process_instance_id, shell_execs
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059
    - attack.t1078
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
