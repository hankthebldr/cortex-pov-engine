title: "FSRVP Protocol Usage for Lateral Movement \u2014 Suspicious FSRVP Usage"
id: ttp-2026-0412-bioc-01
status: experimental
description: |
  Detection of vssadmin.exe being invoked with shadow creation commands on Windows systems
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'vssadmin.exe'
    | filter action_process_command_line contains 'create shadow'
  ----
references:
  - https://attack.mitre.org/techniques/T1077/
author: CortexSim detection_scanner
tags:
    - attack.t1077
    - attack.t1003
    - attack.t1021.002
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
