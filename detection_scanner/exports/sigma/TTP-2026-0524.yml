description: |
  A host that has never run mimikatz executes it shortly after it is staged/installed — the deploy-then-run chain of an offensive tool.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_command_line contains "mimikatz"
    | comp count() as first_runs by agent_hostname
  ----
