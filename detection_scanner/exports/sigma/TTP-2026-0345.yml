title: "SMB Session to Remote Host via PsExec \u2014 Rare SMB Session to Remote Host"
id: ttp-2026-0345-bioc-01
status: experimental
description: |
  Detection of an SMB session initiated to a remote host that is not typical for the host
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK_CONNECTION
    | filter action_remote_ip != '192.0.2.0/24'
    | filter dst_port = 445
    | filter actor_process_image_name = 'psexec.exe'
    | filter causality_actor_process_image_name != 'svchost.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1021/
author: CortexSim detection_scanner
tags:
    - attack.t1021.002
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
