title: "Disabling Windows Security Services via Command Line \u2014 Service Disabled via Sc Command"
id: ttp-2026-0232-bioc-01
status: experimental
description: |
  Detection of service disablement using the sc.exe utility
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'sc.exe' and action_file_path contains 'config' and action_file_path contains 'start= disabled'
  ----
references:
  - https://attack.mitre.org/techniques/T1089/
author: CortexSim detection_scanner
tags:
    - attack.t1089
    - attack.t1562.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
