title: "Uncommon RDP Session via mstsc and PowerShell \u2014 RDP Session with PowerShell Execution"
id: ttp-2026-0249-abioc-02
status: experimental
description: |
  RDP session followed by PowerShell execution that downloads and runs a script
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'mstsc.exe'
    | filter causality_actor_process_image_name = 'explorer.exe'
    | filter action_remote_ip = '192.0.2.10'
    | join with process_start_events on actor_process_image_name = action_process_image_name
    | filter action_process_image_name = 'powershell.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1021/
author: CortexSim detection_scanner
tags:
    - attack.t1021.001
    - attack.t1059.001
    - attack.t1105
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
