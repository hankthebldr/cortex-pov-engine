title: "Meterpreter Reverse Shell via PowerShell \u2014 Abnormal Process Connection to Meterpreter Port"
id: ttp-2026-0241-bioc-01
status: experimental
description: |
  A process makes an outbound connection to port 4444, which is the default Meterpreter C2 port
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK and event_sub_type = ENUM.NETWORK_CONNECTION
    | filter dst_port = 4444
    | filter action_remote_ip = '192.0.2.50'
    | filter causality_actor_process_image_name != 'svchost.exe'
    | filter causality_actor_process_image_name != 'explorer.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1071.004
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
