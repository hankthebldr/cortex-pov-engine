title: "Rare AppID usage to rare destination with PowerShell and C2 \u2014 Rare AppID usage to rare destination"
id: ttp-2026-0328-bioc-01
status: experimental
description: |
  Detection of rare application ID usage to a rare destination IP
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK_CONNECTION
    | comp count() as events by agent_hostname, agent_hostname
    | sort desc events
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1105
    - attack.t1071.004
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
