title: "Rare AppID usage to rare destination with PowerShell and C2 \u2014 PowerShell download to rare IP"
id: ttp-2026-0328-abioc-02
status: experimental
description: |
  Behavioral deviation of PowerShell downloading from rare IP
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'powershell.exe'
    | filter action_process_image_name = 'powershell.exe'
    | filter action_file_path like '%DownloadFile%'
    | comp count() as events by actor_process_image_name, agent_hostname
    | sort desc events
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
