title: "Rare AppID usage to rare destination with PowerShell and C2 \u2014 Rare AppID usage to rare destination"
id: ttp-2026-0328-bioc-01
status: experimental
description: |
  Detection of rare application ID usage to a rare destination IP
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK_CONNECTION
    | filter action_remote_ip in (SELECT DISTINCT dst_ip FROM xdr_data WHERE event_type = ENUM.NETWORK_CONNECTION AND dst_port = 80 AND action_remote_ip NOT IN (SELECT DISTINCT action_remote_ip FROM xdr_data WHERE event_type = ENUM.NETWORK_CONNECTION AND dst_port = 80 AND agent_hostname = 'target-host'))
    | filter causality_actor_process_image_name in (SELECT DISTINCT actor_process_image_name FROM xdr_data WHERE event_type = ENUM.PROCESS AND actor_process_image_name = 'powershell.exe')
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1105
    - attack.t1071.004
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
