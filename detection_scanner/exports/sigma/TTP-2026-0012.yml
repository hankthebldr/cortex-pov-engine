title: "AIRS \u2014 Direct Prompt Injection (LLM01) \u2014 AIRS LLM01 System Prompt Or Hidden Context Echoed In Model Response"
id: ttp-2026-0012-bioc-01
status: experimental
description: |
  AIRS — system prompt or hidden context appears verbatim in model response. The model echoes its seeded system prompt or the AKIA-prefixed canary back to the caller after a direct injection.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = panw_ngfw_traffic_raw
    | filter dst_port = 8089 and uri_path contains "/owasp/llm01/chat"
    | filter response_body contains "AKIA0000CORTEXSIMCANARY" or response_body contains "CortexSimAdmin" or response_body contains "system prompt"
    | fields _time, source_user, src_ip, dst_host, uri_path, response_body
  ----
references:
  - https://attack.mitre.org/techniques/T1656/
author: CortexSim detection_scanner
tags:
    - attack.t1656
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
