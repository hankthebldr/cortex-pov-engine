title: "Node systemd Service + Cron Reload Persistence (T1543.002 / T1053.003) \u2014 CDR-006 Systemd Daemon-Reload Then Enable New Unit Sequence"
id: ttp-2026-0074-bioc-02
status: experimental
description: |
  systemctl daemon-reload immediately followed by systemctl enable/start of a freshly-written unit — the high-signal systemd-persistence process sequence that distinguishes malicious unit install from a benign package edit (T1543.002).
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    preset = xdr_data
    | filter agent_os_type = ENUM.AGENT_OS_LINUX
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = "systemctl"
    | filter action_process_image_command_line contains_any ("daemon-reload", "enable", "--now", "start")
    | comp count() as systemctl_calls, values(action_process_image_command_line) as cmds, values(causality_actor_process_image_name) as cgo_image by agent_hostname, causality_actor_process_instance_id, causality_id
    | filter systemctl_calls >= 2
    | fields agent_hostname, causality_actor_process_instance_id, causality_id, cgo_image, systemctl_calls, cmds
  ----
references:
  - https://attack.mitre.org/techniques/T1543/
author: CortexSim detection_scanner
tags:
    - attack.t1543.002
logsource:
  product: linux
  category: process_creation
