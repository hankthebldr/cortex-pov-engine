title: "Node systemd Service + Cron Reload Persistence (T1543.002 / T1053.003) \u2014 CDR-006 Systemd Unit Written With Restart Always And Tmp ExecStart"
id: ttp-2026-0074-bioc-01
status: experimental
description: |
  A .service unit is written into a systemd unit directory with an ExecStart in /tmp or /dev/shm — the systemd-persistence file-write fingerprint (T1543.002). Narrower and deeper than the EDR-003 generic systemd BIOC.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    preset = xdr_data
    | filter agent_os_type = ENUM.AGENT_OS_LINUX
    | filter event_type = ENUM.FILE and event_sub_type in (ENUM.FILE_CREATE, ENUM.FILE_WRITE)
    | filter action_file_path contains ".service"
    | filter action_file_path contains_any ("/etc/systemd/system", "/usr/lib/systemd/system", "/run/systemd/system", "/.config/systemd")
    | fields _time, agent_hostname, container_id, actor_process_image_name, actor_effective_username, causality_actor_process_image_name, causality_actor_process_instance_id, causality_id, action_file_path
  ----
references:
  - https://attack.mitre.org/techniques/T1543/
author: CortexSim detection_scanner
tags:
    - attack.t1543.002
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
