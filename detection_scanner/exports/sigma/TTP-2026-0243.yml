title: "RDP Session from Rare Host with Credential Theft \u2014 Abnormal RDP Session"
id: ttp-2026-0243-bioc-01
status: experimental
description: |
  RDP session initiated from a rarely seen host to a target
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK_CONNECTION and event_sub_type = ENUM.NETWORK_CONNECTION_ESTABLISHED
    | filter dst_port = 3389
    | comp count() as events by agent_hostname, agent_hostname
    | sort desc events
  ----
references:
  - https://attack.mitre.org/techniques/T1021/
author: CortexSim detection_scanner
tags:
    - attack.t1021.001
    - attack.t1566
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
