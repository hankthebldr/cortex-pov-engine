title: "RDP Session from Rare Host with Credential Theft \u2014 RDP Session with Remote Execution"
id: ttp-2026-0243-abioc-02
status: experimental
description: |
  Detection of RDP session followed by execution of remote command
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK_CONNECTION and event_sub_type = ENUM.NETWORK_CONNECTION_ESTABLISHED
    | filter dst_port = 3389
    | join with (dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'psexec.exe') on causality_actor_process_image_name = action_process_image_name
    | filter event_time_diff < 300
  ----
references:
  - https://attack.mitre.org/techniques/T1021/
author: CortexSim detection_scanner
tags:
    - attack.t1021.001
    - attack.t1078
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
