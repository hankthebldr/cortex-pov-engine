title: "RDP Session to Remote Host with Credential Theft \u2014 Rare RDP Session to Remote Host"
id: ttp-2026-0342-bioc-01
status: experimental
description: |
  Detection of an RDP session to a remote host that is not typical for the user or host
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK_CONNECTION and event_sub_type = ENUM.NETWORK_CONNECTION_ESTABLISHED
    | filter action_process_image_name = 'mstsc.exe'
    | filter dst_port = 3389
    | filter action_remote_ip = '192.0.2.10'
    | filter agent_hostname != 'RDP-TEST-HOST'
    | filter not (agent_hostname in ('RDP-TEST-HOST', 'RDP-DEV-HOST'))
  ----
references:
  - https://attack.mitre.org/techniques/T1021/
author: CortexSim detection_scanner
tags:
    - attack.t1021.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
