title: "RDP Session to Remote Host with Credential Theft \u2014 Unusual RDP Session with Credential Extraction"
id: ttp-2026-0342-abioc-02
status: experimental
description: |
  RDP session followed by credential extraction commands
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK_CONNECTION and event_sub_type = ENUM.NETWORK_CONNECTION_ESTABLISHED
    | filter action_process_image_name = 'mstsc.exe'
    | filter dst_port = 3389
    | filter action_remote_ip = '192.0.2.10'
    | filter agent_hostname != 'RDP-TEST-HOST'
    | filter not (agent_hostname in ('RDP-TEST-HOST', 'RDP-DEV-HOST'))
    | join (dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'cmd.exe'
    | filter action_file_path contains 'user.txt') on causality_actor_process_image_name = action_process_image_name
  ----
references:
  - https://attack.mitre.org/techniques/T1021/
author: CortexSim detection_scanner
tags:
    - attack.t1021.001
    - attack.t1003.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
