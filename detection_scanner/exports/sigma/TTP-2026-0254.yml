title: "Remote Command Execution via PsExec \u2014 PsExec Remote Command Execution"
id: ttp-2026-0254-abioc-02
status: experimental
description: |
  Behavioral deviation detected when PsExec is used to execute commands on a remote host
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'psexec.exe'
    | filter action_command_line contains 'targethost'
    | filter action_remote_ip = '192.0.2.10'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1021.002
    - attack.t1566.001
