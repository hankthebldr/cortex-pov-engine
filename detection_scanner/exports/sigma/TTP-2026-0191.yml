title: "BeyondTrust RS CVE-2026-1731 Post-Exploitation to SparkRAT / VShell \u2014 Appliance EDR + NGFW Stitch (T1190 / T1505.003) \u2014 MP-032 BeyondTrust bomgar-scc Spawns a Shell Running Host Discovery"
id: ttp-2026-0191-bioc-01
status: experimental
description: |
  A process image named bomgar-scc (the BeyondTrust Remote Support service) starts id, whoami, uname, hostname or os-release reads: injected commands running as the appliance site user (CVE-2026-1731).
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter causality_actor_process_image_name = "bomgar-scc" or actor_process_image_name = "bomgar-scc"
    | filter action_process_image_name in ("id", "whoami", "uname", "hostname", "cat", "ps")
    | fields _time, agent_hostname, actor_effective_username, actor_process_image_name, action_process_image_name, action_process_image_command_line, causality_actor_process_image_name
  ----
references:
  - https://attack.mitre.org/techniques/T1190/
author: CortexSim detection_scanner
tags:
    - attack.t1190
    - attack.t1082
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
