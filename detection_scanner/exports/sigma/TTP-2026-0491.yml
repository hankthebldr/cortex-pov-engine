title: "Windows LOLBIN connected to rare external host \u2014 LOLBIN Process with Rare Network Connection"
id: ttp-2026-0491-bioc-01
status: experimental
description: |
  Detection of a LOLBIN process initiating a network connection to an IP address not commonly seen in the environment.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name in ('powershell.exe', 'wmic.exe', 'rundll32.exe')
    | filter action_remote_ip not in (known_ips)
    | filter action_remote_ip != '127.0.0.1'
    | filter action_remote_ip != '::1'
    | filter dst_port = 80 or dst_port = 443
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1071.004
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
