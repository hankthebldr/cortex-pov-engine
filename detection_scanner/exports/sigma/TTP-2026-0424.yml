title: "Uncommon ARP Cache Listing via arp.exe \u2014 Uncommon ARP Cache Listing"
id: ttp-2026-0424-bioc-01
status: experimental
description: |
  Detection of arp.exe being invoked with flags that indicate network reconnaissance or enumeration
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'C:\\Windows\\System32\\arp.exe'
    | filter action_process_command_line contains '-a' or action_process_command_line contains '-g' or action_process_command_line contains '-d'
  ----
references:
  - https://attack.mitre.org/techniques/T1016/
author: CortexSim detection_scanner
tags:
    - attack.t1016
    - attack.t1046
    - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
