title: "SSH Server Cloning with Shared Host Key \u2014 SSH Server Cloning Pattern"
id: ttp-2026-0495-abioc-02
status: experimental
description: |
  Behavioral deviation of multiple SSH servers using same host key across different ports
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK_CONNECTION
    | filter dst_port IN (2222, 2223, 2224)
    | filter action_file_path = '/tmp/ssh_clone/host_key'
    | comp count() as cnt by action_file_path
    | filter count() > 2
  ----
references:
  - https://attack.mitre.org/techniques/T1021/
author: CortexSim detection_scanner
tags:
