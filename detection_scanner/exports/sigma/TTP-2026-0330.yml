title: "Rare Binary Connecting to Rare External Host \u2014 Rare Binary Connected to Rare External Host"
id: ttp-2026-0330-bioc-01
status: experimental
description: |
  Detection of a rare binary connecting to a rare external host
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = '/tmp/scratch/malware.exe'
    | filter action_remote_ip in (select remote_ip from rare_hosts)
    | filter action_file_path in (select file_path from rare_binaries)
  ----
references:
  - https://attack.mitre.org/techniques/T1105/
author: CortexSim detection_scanner
tags:
    - attack.t1105
    - attack.t1059.001
    - attack.t1071.004
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
