title: "Unusual exec Into a Kubernetes Pod + Unusual Service-Account API Call (SIM-CDR-025) \u2014 Unusual Pod Exec Process Start"
id: ttp-2026-0162-bioc-01
status: experimental
description: |
  Detection of process execution involving kubectl or similar tooling performing a pod exec command, indicative of T1609 (Deploy Software via Kubernetes API).
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name in ("kubectl", "kubectl.exe", "oc")
    | filter action_process_image_name = "kubectl"
    | filter action_file_path contains "exec"
    | filter causality_actor_process_image_name contains "pod"
    | filter actor_effective_username != "root"
    | filter agent_hostname != ""
    | fields agent_hostname, actor_process_image_name, action_process_image_name, action_file_path, causality_actor_process_image_name
  ----
references:
  - https://attack.mitre.org/techniques/T1609/
author: CortexSim detection_scanner
tags:
    - attack.t1609
    - attack.t1078
logsource:
  product: kubernetes
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
