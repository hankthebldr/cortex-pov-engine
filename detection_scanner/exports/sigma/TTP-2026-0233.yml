title: "Certificate Enrollment via CertUtil for Persistence \u2014 Unusual Certificate Enrollment via CertUtil"
id: ttp-2026-0233-abioc-02
status: experimental
description: |
  Behavioral deviation where certutil is used to enroll a certificate after downloading from a remote URL
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'certutil.exe'
    | filter action_process_command_line contains '-urlcache'
    | filter action_process_command_line contains '-addstore'
    | filter action_process_command_line contains '-f'
    | filter action_remote_ip = '192.0.2.10'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1556.001
    - attack.t1071.004
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
