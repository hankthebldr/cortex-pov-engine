title: "Unsigned DLL Hijack into Microsoft Process \u2014 Unsigned DLL Load into Trusted Process"
id: ttp-2026-0467-bioc-01
status: experimental
description: |
  Detection of unsigned DLL being loaded into a Microsoft process such as spoolsv.exe
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'spoolsv.exe'
    | filter action_file_path contains 'winspool.dll'
    | filter action_file_path not contains 'C:\\Windows\\System32\\spool\\drivers\\x64\\1.0.0.0\\winspool.dll'
    | filter action_file_path not contains 'C:\\Windows\\System32\\spool\\drivers\\x64\\1.0.0.0\\winspool.dll'
  ----
references:
  - https://attack.mitre.org/techniques/T1574/
author: CortexSim detection_scanner
tags:
    - attack.t1574.002
    - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
