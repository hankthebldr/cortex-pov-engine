title: "Kerberoast \u2192 Pass-the-Hash \u2192 DCSync Multi-Plane Stitch (T1558.003 / T1550.002 / T1003.006) \u2014 MP-002 LDAP SPN Sweep From Non-Typical Host"
id: ttp-2026-0063-bioc-01
status: experimental
description: |
  ITDR - LDAP search filter (servicePrincipalName=*) from non-typical host. An LDAP query enumerating servicePrincipalName attributes (Kerberoasting recon) originates from a host that is not a domain controller and not an established admin workstation.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = okta_sso
    | filter event_type = ENUM.ACTIVE_DIRECTORY
    | filter operation_name in ("LDAP_SEARCH", "DirectorySearch")
    | filter lower(search_filter) contains "serviceprincipalname"
    | filter src_host not in ("DC01", "DC02")
    | filter actor_effective_username not in ("Administrator", "svc-bloodhound")
  ----
references:
  - https://attack.mitre.org/techniques/T1558/
author: CortexSim detection_scanner
tags:
    - attack.t1558.003
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
