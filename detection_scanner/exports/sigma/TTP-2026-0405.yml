title: "Suspicious RunOnce.exe Parent Process Behavior \u2014 Suspicious runonce.exe parent process"
id: ttp-2026-0405-bioc-01
status: experimental
description: |
  Detection of a process launched by runonce.exe, which is often used for malicious persistence or execution
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'runonce.exe'
    | filter action_process_image_name != 'runonce.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1547.001
    - attack.t1085
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
