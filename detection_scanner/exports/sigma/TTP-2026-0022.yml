title: "Container Enumeration via DEEPCE and LinPEAS (T1613) \u2014 CDR-001 Package Manager Execution Inside Running Container"
id: ttp-2026-0022-bioc-01
status: experimental
description: |
  Package manager execution inside running container — unusual install pattern indicates post-exploitation activity. apt-get/apk/yum runs interactively in a container where image content should already be baked.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    preset = xdr_data
    | filter event_type = ENUM.PROCESS
    | filter event_sub_type = ENUM.PROCESS_START
    | filter container_id != null
    | filter actor_process_image_name in ("apt-get", "apt", "apk", "yum", "dnf")
    | filter action_process_image_command_line contains_any ("install", "add", "update")
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.004
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: medium
