title: "Unsigned Process Injection via PowerShell \u2014 Unsigned and Unpopular Process Injection"
id: ttp-2026-0466-bioc-01
status: experimental
description: |
  Detection of unsigned and unpopular process performing injection
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'powershell.exe'
    | filter action_process_image_name = 'evil.exe'
    | filter causality_actor_process_image_name != 'explorer.exe'
    | filter action_file_path contains '/tmp/evil.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1055.001
    - attack.t1070.006
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
