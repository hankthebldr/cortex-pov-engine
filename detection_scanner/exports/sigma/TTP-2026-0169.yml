title: "AI SOC at Volume \u2014 Labelled 800-Alert Corpus Measures Grouping Collapse, Triage Precision/Recall and Disposition Latency \u2014 Credential-Harvest Phishing Link Delivered and Clicked by a Corporate Recipient"
id: ttp-2026-0169-bioc-01
status: experimental
description: |
  The malicious arc's initial access: a spearphishing message carrying a credential-harvest link is delivered and the recipient clicks it. Anchored to the recipient so the whole downstream chain shares one normalized principal — that shared key is what grouping is being measured on.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = proofpoint_tap_raw
    | filter cortexsim_run_tag = "MP021" and cortexsim_label = "malicious"
    | filter threat_type = "url" and click_permitted = true
    | comp count() as clicks by recipient, sender, url_host, campaign_id
    | filter clicks >= 1
    | sort desc clicks
    | fields recipient, sender, url_host, campaign_id, clicks
  ----
references:
  - https://attack.mitre.org/techniques/T1566/
author: CortexSim detection_scanner
tags:
    - attack.t1566.002
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
