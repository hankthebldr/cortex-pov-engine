title: "Iranian APT Screening Serpens: AppDomainManager Hijacking & Living-Off-The-Land Defense Evasion \u2014 SIM-EDR-023 Anomalous .NET Host Process Spawning Shell Interpreter"
id: ttp-2026-0182-abioc-02
status: experimental
description: |
  Behavioral analytics detects a trusted Microsoft .NET runtime host binary spawning an interactive command shell under a service or non-interactive account.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    preset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name in ("caspol.exe", "powershell.exe", "dotnet", "mono") and action_process_image_name in ("cmd.exe", "powershell.exe", "sh", "bash")
    | filter actor_effective_username in ("svc-account", "www-data", "administrator", "root")
    | comp count() as spawn_count by agent_hostname, actor_process_image_name, action_process_image_name, actor_effective_username
    | filter spawn_count >= 1
    | fields agent_hostname, actor_process_image_name, action_process_image_name, actor_effective_username, spawn_count
  ----
references:
  - https://attack.mitre.org/techniques/T1574/
author: CortexSim detection_scanner
tags:
    - attack.t1574
    - attack.t1059
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
