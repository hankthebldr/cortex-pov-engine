title: "Squidoor (CL-STA-0049) Web Shell to Renamed-Debugger Backdoor with Multi-Protocol C2 \u2014 EDR + NGFW Stitch (T1505.003 / T1127 / T1071) \u2014 MP-023 Web Service Account Decodes ASPX Web Shell Into Webroot"
id: ttp-2026-0182-bioc-01
status: experimental
description: |
  A web-service account (www-data, or an IIS app-pool identity) writes .aspx files named like the CL-STA-0049 web shells after a base64 decode (base64 -d on Linux, certutil -decode on Windows).
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.FILE and event_sub_type in (ENUM.FILE_CREATE_NEW, ENUM.FILE_WRITE)
    | filter action_file_name in ("OutlookDC.aspx", "Error.aspx", "TimeoutAPI.aspx")
    | filter actor_effective_username in ("www-data", "apache", "nginx") or actor_effective_username contains "IIS APPPOOL" or actor_process_image_name in ("base64", "certutil.exe", "cp", "powershell.exe")
    | fields agent_hostname, actor_effective_username, actor_process_image_name, action_file_path, _time
  ----
references:
  - https://attack.mitre.org/techniques/T1505/
author: CortexSim detection_scanner
tags:
    - attack.t1505.003
    - attack.t1140
logsource:
  product: cross-platform
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
