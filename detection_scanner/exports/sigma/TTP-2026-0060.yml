title: "Cross-Plane Correlation MOAT \u2014 EDR + NDR + ITDR Stitch Into One Incident (T1078 / T1071.001 / T1110.003) \u2014 MP-005 Interactive Bash From www-data Service Context"
id: ttp-2026-0060-bioc-01
status: experimental
description: |
  XDR BIOC — interactive bash from www-data service context (process lineage anchor). The endpoint leg of the cross-plane stitch: an interactive shell under a non-login web service identity anchors the process lineage that the correlation rule joins to the network and identity signals.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    preset = xdr_data
    | filter event_type = ENUM.PROCESS
    | filter event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name in ("bash", "sh")
    | filter actor_effective_username in ("www-data", "nobody", "apache", "nginx")
    | comp count() as proc_count by agent_hostname, action_local_ip, actor_effective_username
    | filter proc_count >= 1
    | fields agent_hostname, action_local_ip, actor_effective_username, proc_count
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.004
    - attack.t1078
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
