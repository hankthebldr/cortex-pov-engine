title: "NAA Account Credential Extraction via SCCM \u2014 PowerShell Hidden Execution"
id: ttp-2026-0322-bioc-01
status: experimental
description: |
  Detection of PowerShell process started with -w hidden flag
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'powershell.exe' and action_process_image_name = 'powershell.exe'
    | filter action_process_command_line contains '-w hidden'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
