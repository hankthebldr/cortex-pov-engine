title: "NAA Account Credential Extraction via SCCM \u2014 SCCM Credential Extraction via PowerShell"
id: ttp-2026-0322-abioc-02
status: experimental
description: |
  Behavioral deviation detecting PowerShell script executing SCCM credential retrieval commands
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'powershell.exe'
    | filter action_process_command_line contains 'Get-SCCMCredentials' or action_process_command_line contains 'Invoke-SCCMQuery'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1046
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
