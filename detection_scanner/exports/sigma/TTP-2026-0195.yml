title: "PAN-OS CVE-2026-0257 Foothold \u2014 GlobalProtect Bypass to RMM, RDP/SMB, ESXi and VMDK Credential Theft (T1556 / T1003.003) \u2014 MP-036 GlobalProtect Gateway Session Without Preceding Authentication"
id: ttp-2026-0195-bioc-01
status: experimental
description: |
  A GlobalProtect gateway-connected success authenticated by cookie with no preceding portal/gateway authentication for the same user and public_ip — the CVE-2026-0257 bypass core. Returns private_ip (the tunnel address the attacker's machine received), which is the stitch entity for everything the foothold does next.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = panw_ngfw_globalprotect_raw
    | filter eventid = "gateway-connected" and status = "success"
    | filter preceding_auth_event = "NONE"
    | fields _time, public_ip, private_ip, srcuser, machine_name, endpoint_mac, auth_method, preceding_auth_event
  ----
references:
  - https://attack.mitre.org/techniques/T1556/
author: CortexSim detection_scanner
tags:
    - attack.t1556
    - attack.t1190
    - attack.t1133
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
