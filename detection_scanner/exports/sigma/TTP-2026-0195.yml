title: "BITS Job Abuse via bitsadmin for Persistent Payload Delivery \u2014 BITS Job Creation"
id: ttp-2026-0195-bioc-01
status: experimental
description: |
  Detection of bitsadmin.exe creating a job with notify command line
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'bitsadmin.exe'
    | filter action_file_path contains '/create'
    | filter action_file_path contains '/SetNotifyCmdLine'
  ----
references:
  - https://attack.mitre.org/techniques/T1197/
author: CortexSim detection_scanner
tags:
    - attack.t1197
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
