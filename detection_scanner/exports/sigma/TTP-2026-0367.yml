title: "Rundll32.exe with No Command-Line Arguments \u2014 Suspicious Rundll32 Execution"
id: ttp-2026-0367-bioc-01
status: experimental
description: |
  Detection of rundll32.exe process start with no command-line arguments
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'rundll32.exe' and action_process_command_line = ''
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1218.011
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
