title: "Windows Command Execution via PowerShell with C2 Communication \u2014 Suspicious PowerShell Network Activity"
id: ttp-2026-0442-abioc-02
status: experimental
description: |
  PowerShell process performing network communication with C2 after downloading payload
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'powershell.exe'
    | filter action_process_command_line contains 'TCPClient' or action_process_command_line contains 'WebClient'
    | filter action_process_command_line contains '192.0.2.50'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1071.004
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
