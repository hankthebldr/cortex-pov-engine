title: "Windows Command Execution via PowerShell with C2 Communication \u2014 Unusual PowerShell Command Execution"
id: ttp-2026-0442-bioc-01
status: experimental
description: |
  PowerShell process executing commands with hidden window and network activity
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'powershell.exe'
    | filter actor_process_image_name = 'explorer.exe'
    | filter action_process_command_line contains 'WindowStyle Hidden'
    | filter action_process_command_line contains 'Invoke-WebRequest' or action_process_command_line contains 'Start-Process'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1105
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
