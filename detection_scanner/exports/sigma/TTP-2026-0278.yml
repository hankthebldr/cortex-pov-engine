title: "Signed Process Using Uncommon Root Domain for C2 \u2014 Globally Uncommon Root Domain from Signed Process"
id: ttp-2026-0278-bioc-01
status: experimental
description: |
  Detection of network traffic to a root domain not commonly seen in the organization, originating from a signed process
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK_CONNECTION and event_sub_type = ENUM.NETWORK_OUTBOUND
    | filter causality_actor_process_image_name = 'powershell.exe' and action_remote_ip = '192.0.2.1'
    | filter not in(action_remote_ip, (select distinct action_remote_ip from xdr_data where causality_actor_process_image_name = 'powershell.exe' and event_type = ENUM.NETWORK_CONNECTION))
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1071.004
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
