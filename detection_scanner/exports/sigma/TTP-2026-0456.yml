title: "Uncommon Service Creation via sc.exe for Persistence \u2014 Uncommon Service Create/Config"
id: ttp-2026-0456-bioc-01
status: experimental
description: |
  Detection of a process creating or configuring a Windows service not typically seen in normal operations
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'services.exe' and action_process_image_name = 'sc.exe'
    | filter action_command_line contains 'create' or action_command_line contains 'config'
    | filter action_command_line contains 'MyService'
  ----
references:
  - https://attack.mitre.org/techniques/T1543/
author: CortexSim detection_scanner
tags:
    - attack.t1543.003
    - attack.t1059.001
    - attack.t1566.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
