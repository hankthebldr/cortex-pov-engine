title: "Inbound Vulnerability-Scanning Reconnaissance Against Perimeter (T1595.002 / T1595.001) \u2014 ASM EAL \u2014 Known Vulnerability-Scanner User-Agent On Perimeter Asset"
id: ttp-2026-0071-bioc-02
status: experimental
description: |
  Inbound web request to a perimeter asset carrying a recognised vulnerability-scanner user-agent (Nikto / nuclei / masscan-derived) — direct evidence of automated vulnerability-scanning reconnaissance.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = panw_ngfw_traffic_raw
    | filter dst_port in (80, 443, 9001)
    | filter http_user_agent contains_any ("Nikto", "nuclei", "masscan", "sqlmap", "WPScan")
    | fields _time, src_ip, dst_ip, http_user_agent, uri_path
  ----
references:
  - https://attack.mitre.org/techniques/T1595/
author: CortexSim detection_scanner
tags:
    - attack.t1595.002
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: medium
