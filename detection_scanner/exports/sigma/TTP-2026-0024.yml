title: "Container Escape via Privileged Mode and nsenter (T1611) \u2014 CDR-003 Container Capability Read With Block Device Access"
id: ttp-2026-0024-bioc-01
status: experimental
description: |
  Container privilege enumeration — /proc/self/status capability read combined with /dev device access. A container process reads its own capability mask and probes a host block device, the precondition check for a privileged-mode escape.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    preset = xdr_data
    | filter event_type = ENUM.PROCESS
    | filter event_sub_type = ENUM.PROCESS_START
    | filter container_id != null
    | filter action_process_image_command_line contains_any ("/proc/self/status", "CapEff", "CapBnd")
    | filter action_process_image_command_line contains_any ("/dev/sda", "/dev/sd", "/dev/nvme", "/dev/xvda")
  ----
references:
  - https://attack.mitre.org/techniques/T1613/
author: CortexSim detection_scanner
tags:
    - attack.t1613
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
