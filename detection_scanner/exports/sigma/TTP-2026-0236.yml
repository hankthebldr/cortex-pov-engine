title: "Windows Endpoint - Rare Domain Communication via PowerShell \u2014 Abnormal Communication to Rare Domain"
id: ttp-2026-0236-abioc-02
status: experimental
description: |
  Behavioral deviation indicating communication to a rare domain not seen in historical data
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK_CONNECTION
    | filter action_remote_ip = '192.0.2.100'
    | filter action_remote_hostname = '192.0.2.100'
    | filter not action_remote_hostname in (SELECT DISTINCT action_remote_hostname FROM xdr_data WHERE event_type = ENUM.NETWORK_CONNECTION AND timestamp > now() - 30d)
  ----
references:
  - https://attack.mitre.org/techniques/T1071/
author: CortexSim detection_scanner
tags:
    - attack.t1071.004
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
