title: "Windows Endpoint - Rare Domain Communication via PowerShell \u2014 PowerShell Download and Execute Rare Domain"
id: ttp-2026-0236-bioc-01
status: experimental
description: |
  Detection of PowerShell downloading and executing a file from a rare domain
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'powershell.exe'
    | filter action_file_path contains 'malware.exe'
    | filter action_remote_ip = '192.0.2.100'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1105
    - attack.t1071.004
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
