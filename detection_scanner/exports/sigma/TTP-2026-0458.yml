title: "Uncommon Signed Process Execution via Scheduled Task \u2014 Uncommon Signed Process Execution by Scheduled Task"
id: ttp-2026-0458-bioc-01
status: experimental
description: |
  Detection of signed binary execution triggered by a scheduled task
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'C:\\Windows\\System32\\schtasks.exe'
    | filter action_process_image_name contains 'cmd.exe'
    | filter action_process_image_name contains 'powershell.exe'
    | filter action_process_image_name contains 'C:\\Windows\\System32\\'
  ----
references:
  - https://attack.mitre.org/techniques/T1053/
author: CortexSim detection_scanner
tags:
    - attack.t1053.005
    - attack.t1059.001
    - attack.t1546.008
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
