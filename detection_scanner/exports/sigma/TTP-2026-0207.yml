title: "Windows Defender Exclusion Added for Payload Staging \u2014 New Defender Exclusion Added"
id: ttp-2026-0207-bioc-01
status: experimental
description: |
  Detection of new Windows Defender exclusions added via Add-MpPreference
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'powershell.exe' and action_command_line contains 'Add-MpPreference'
    | filter action_file_path contains 'payload.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1562/
author: CortexSim detection_scanner
tags:
    - attack.t1562.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
