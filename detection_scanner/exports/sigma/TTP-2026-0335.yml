title: "NTLM Relay Attack via SMB Client \u2014 Rare NTLM Access By User To Host"
id: ttp-2026-0335-bioc-01
status: experimental
description: |
  Detects when a user performs an NTLM authentication to a remote host that is not typically accessed by that user.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'smbclient'
    | filter action_remote_ip = '192.0.2.100'
    | filter actor_process_image_name != 'lsass.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1046/
author: CortexSim detection_scanner
tags:
    - attack.t1046
    - attack.t1071
    - attack.t1566
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
