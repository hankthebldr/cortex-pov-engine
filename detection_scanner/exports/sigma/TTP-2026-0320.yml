title: "Network Service Discovery via Command-Line Tools \u2014 Unusual Network Service Discovery Process Execution"
id: ttp-2026-0320-bioc-01
status: experimental
description: |
  Detection of net.exe, nbtstat.exe, or netstat.exe execution from unexpected locations or with unusual arguments
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name in ('net.exe', 'nbtstat.exe', 'netstat.exe')
    | filter actor_process_image_name not in ('explorer.exe', 'cmd.exe', 'powershell.exe')
  ----
references:
  - https://attack.mitre.org/techniques/T1046/
author: CortexSim detection_scanner
tags:
    - attack.t1046
    - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
