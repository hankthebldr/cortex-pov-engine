title: "DLL Hijack into Microsoft Process via Malicious DLL Loading \u2014 Suspicious DLL Load from System32"
id: ttp-2026-0315-bioc-01
status: experimental
description: |
  Detects a process loading a DLL from the Windows System32 directory that is not part of the expected Microsoft process behavior
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'C:\\Windows\\System32\\svchost.exe'
    | filter action_file_path contains 'System32\\temp\\legit.dll'
  ----
references:
  - https://attack.mitre.org/techniques/T1574/
author: CortexSim detection_scanner
tags:
    - attack.t1574.002
    - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
