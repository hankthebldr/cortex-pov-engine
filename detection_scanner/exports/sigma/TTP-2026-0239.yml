title: "TOR Network Communication via Uncommon Port \u2014 Abnormal TOR Network Communication"
id: ttp-2026-0239-abioc-02
status: experimental
description: |
  Detection of TOR process communicating through an uncommon port
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK_CONNECTION
    | filter action_remote_ip = '192.0.2.1'
    | filter dst_port = 9050
    | filter action_process_image_name = '/tmp/scratch/tor_binary'
  ----
references:
  - https://attack.mitre.org/techniques/T1071/
author: CortexSim detection_scanner
tags:
    - attack.t1071.004
    - attack.t1566.001
    - attack.t1059.001
