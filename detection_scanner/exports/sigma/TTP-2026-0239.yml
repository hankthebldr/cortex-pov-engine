title: "TOR Network Communication via Uncommon Port \u2014 TOR Process Start with Uncommon Port"
id: ttp-2026-0239-bioc-01
status: experimental
description: |
  Detection of TOR process starting with communication on non-standard port
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = '/tmp/scratch/tor_binary'
    | filter dst_port = 9050
  ----
references:
  - https://attack.mitre.org/techniques/T1071/
author: CortexSim detection_scanner
tags:
    - attack.t1071.004
    - attack.t1566.001
    - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
