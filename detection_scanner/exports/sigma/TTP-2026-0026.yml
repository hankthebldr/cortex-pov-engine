title: "WildFire Malware Trigger \u2014 Dropped Backdoor, C2 Beacon, Ransomware Sim (T1105) \u2014 CDR-005 WildFire Known Bad ELF Download In Container"
id: ttp-2026-0026-bioc-01
status: experimental
description: |
  WildFire test file download in container — known-bad file signature matched by WildFire cloud intelligence. A container process downloads an ELF that WildFire verdicts as malicious.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    preset = xdr_data
    | filter event_type = ENUM.PROCESS
    | filter event_sub_type = ENUM.PROCESS_START
    | filter container_id != null
    | filter actor_process_image_name in ("curl", "wget")
    | filter action_process_image_command_line contains_any (".elf", "wildfire.paloaltonetworks.com", "publicapi/test")
  ----
references:
  - https://attack.mitre.org/techniques/T1105/
author: CortexSim detection_scanner
tags:
    - attack.t1105
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
