title: "DLL Sideloading from ISO via PowerShell \u2014 Uncommon DLL Sideloading from ISO"
id: ttp-2026-0428-bioc-01
status: experimental
description: |
  Detects when a process loads a DLL from a logical CD-ROM or ISO device not typically used for such operations
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter causality_actor_process_image_name contains '\malicious.exe'
    | filter action_file_path contains 'malicious.dll'
    | filter action_remote_ip in [192.0.2.0/24]
    | filter actor_process_image_name contains 'powershell.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1574.002
    - attack.t1071.004
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
