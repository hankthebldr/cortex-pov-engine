title: "C2 Beacon Callback \u2014 NGFW + XDR Causality Stitch (T1071.001) \u2014 MP-001 Curl Wrote Second-Stage File To Tmp From Service Account"
id: ttp-2026-0047-bioc-03
status: experimental
description: |
  XDR — file written to /tmp/ by curl from service account. Ingress tool transfer: curl downloads a second stage into a world-writable path under a service identity.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    preset = xdr_data
    | filter event_type = ENUM.FILE
    | filter event_sub_type in (ENUM.FILE_CREATE_NEW, ENUM.FILE_WRITE)
    | filter actor_process_image_name in ("curl", "wget")
    | filter action_file_path contains "/tmp/"
    | filter actor_effective_username in ("www-data", "nobody", "apache", "nginx")
  ----
