title: "C2 Beacon Callback \u2014 NGFW + XDR Causality Stitch (T1071.001) \u2014 MP-001 Interactive Shell Spawned From www-data Service Context"
id: ttp-2026-0047-bioc-01
status: experimental
description: |
  XDR — interactive bash spawned from www-data service context. A non-login web service identity spawns an interactive shell, the endpoint leg of the C2 chain.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    preset = xdr_data
    | filter event_type = ENUM.PROCESS
    | filter event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name in ("bash", "sh")
    | filter actor_effective_username in ("www-data", "nobody", "apache", "nginx")
    | filter causality_actor_process_image_name in ("apache2", "nginx", "php-fpm", "node", "httpd")
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.004
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
