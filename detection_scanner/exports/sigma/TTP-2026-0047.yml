title: "C2 Beacon Callback \u2014 NGFW + XDR Causality Stitch (T1071.001) \u2014 MP-001 Curl Beacon With Suspicious User-Agent From www-data"
id: ttp-2026-0047-bioc-02
status: experimental
description: |
  XDR — curl executed from www-data with suspicious user-agent. The endpoint process that opens the outbound HTTP beacon socket, providing the lineage leg the NGFW session lacks.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    preset = xdr_data
    | filter event_type = ENUM.PROCESS
    | filter event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name in ("curl", "wget")
    | filter action_process_image_command_line contains_any ("CortexSimBeacon", "-A ", "--user-agent")
    | filter actor_effective_username in ("www-data", "nobody", "apache", "nginx")
  ----
