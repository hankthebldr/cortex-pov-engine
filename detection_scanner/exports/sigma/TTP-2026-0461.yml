title: "Uncommon VNC Server Communication via Windows Endpoint \u2014 Uncommon VNC Server Network Communication"
id: ttp-2026-0461-abioc-02
status: experimental
description: |
  Detection of outbound network connection from VNC server process to external IP
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK and event_sub_type = ENUM.NETWORK_CONNECT
    | filter action_remote_ip = '192.0.2.1' and dst_port = 5900
  ----
references:
  - https://attack.mitre.org/techniques/T1071/
author: CortexSim detection_scanner
tags:
    - attack.t1071.001
    - attack.t1021.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
