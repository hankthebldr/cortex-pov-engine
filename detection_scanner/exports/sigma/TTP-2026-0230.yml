title: "Unicode Obfuscation via PowerShell for Lateral Movement \u2014 PowerShell Process with Unicode Obfuscation"
id: ttp-2026-0230-bioc-01
status: experimental
description: |
  Detection of PowerShell processes that use Unicode character substitution in command line arguments
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'powershell.exe'
    | filter action_command_line contains '0x50006f007700650072005300680065006c006c002e006500780065'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1071.004
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
