title: "Unicode Obfuscation via PowerShell for Lateral Movement \u2014 Unicode Substitution in PowerShell Command Line"
id: ttp-2026-0230-abioc-02
status: experimental
description: |
  Behavioral deviation where PowerShell command line arguments contain Unicode-encoded strings indicating obfuscation
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'powershell.exe'
    | filter action_command_line matches '0x[0-9a-fA-F]{2,}'
  ----
