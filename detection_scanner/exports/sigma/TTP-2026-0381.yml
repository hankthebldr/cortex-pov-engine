title: "Suspicious Certutil AD CS Contact \u2014 Suspicious Certutil AD CS Contact"
id: ttp-2026-0381-bioc-01
status: experimental
description: |
  Detection of certutil downloading a file from an AD CS server
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'certutil.exe'
    | filter action_file_path contains 'payload.bin'
    | filter action_remote_ip = '192.0.2.100'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1105
    - attack.t1556.002
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
