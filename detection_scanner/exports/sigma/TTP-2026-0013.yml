title: "AIRS \u2014 Indirect Prompt Injection via RAG Document (LLM01 + LLM08) \u2014 AIRS LLM08 RAG Response Contains AKIA Canary From Poisoned Document"
id: ttp-2026-0013-bioc-01
status: experimental
description: |
  AIRS — model response contains AKIA-prefixed canary leaked from poisoned RAG doc. A benign retrieval query returns an answer carrying the AKIA0000CORTEXSIMCANARY seeded inside the poisoned document.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = panw_ngfw_traffic_raw
    | filter dst_port = 8089 and uri_path contains "/owasp/llm08/rag/query"
    | filter response_body contains "AKIA0000CORTEXSIMCANARY" or response_body contains "CORTEXSIM/CANARY/SECRET/KEY"
    | fields _time, source_user, src_ip, dst_host, uri_path, response_body
  ----
references:
  - https://attack.mitre.org/techniques/T1656/
author: CortexSim detection_scanner
tags:
    - attack.t1656
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
