title: "APT29 Hybrid Cloud Credential Theft \u2192 Cloud Pivot \u2192 S3 Exfil Stitch (T1552.001) \u2014 MP-004 Recursive AWS Key Pattern Grep From Service Account"
id: ttp-2026-0049-bioc-01
status: experimental
description: |
  XDR — recursive credential-pattern grep from non-interactive service account. The endpoint credential-access leg: www-data greps the filesystem for AWS key material.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    preset = xdr_data
    | filter event_type = ENUM.PROCESS
    | filter event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name in ("grep", "egrep", "rg", "find")
    | filter action_process_image_command_line contains_any ("AKIA", "aws_secret_access_key", ".aws/credentials")
    | filter actor_effective_username in ("www-data", "nobody", "apache", "nginx")
  ----
references:
  - https://attack.mitre.org/techniques/T1552/
author: CortexSim detection_scanner
tags:
    - attack.t1552.001
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
