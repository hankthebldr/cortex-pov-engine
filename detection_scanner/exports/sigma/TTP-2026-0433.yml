title: "Uncommon Kernel Module Load via insmod \u2014 Uncommon Kernel Module Load"
id: ttp-2026-0433-bioc-01
status: experimental
description: |
  Detection of insmod being used with a non-standard or uncommon kernel module path
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'insmod'
    | filter action_file_path != '/lib/modules/*'
    | filter action_file_path != '/usr/lib/modules/*'
  ----
references:
  - https://attack.mitre.org/techniques/T1014/
author: CortexSim detection_scanner
tags:
    - attack.t1014
    - attack.t1059.001
    - attack.t1543.003
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
