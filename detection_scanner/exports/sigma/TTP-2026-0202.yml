title: "WMIEXEC-style Command Execution via WMI \u2014 Command Execution via WMI"
id: ttp-2026-0202-abioc-02
status: experimental
description: |
  Behavioral deviation of cmd.exe process spawning under WmiPrvSE with ADMIN$ redirection
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'WmiPrvSE.exe' and action_process_image_name = 'cmd.exe'
    | filter action_file_path contains 'ADMIN$'
  ----
