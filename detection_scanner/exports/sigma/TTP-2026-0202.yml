title: "WMIEXEC-style Command Execution via WMI \u2014 WMI Command Execution"
id: ttp-2026-0202-bioc-01
status: experimental
description: |
  Detection of cmd.exe execution under WmiPrvSE process
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'WmiPrvSE.exe' and action_process_image_name = 'cmd.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1047/
author: CortexSim detection_scanner
tags:
    - attack.t1047
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
