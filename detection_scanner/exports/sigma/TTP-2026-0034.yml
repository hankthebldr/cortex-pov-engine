title: "Linux Persistence \u2014 Cron, Systemd, Backdoor User and SSH Keys (T1053.003) \u2014 EDR-003 Cron Job Creation With Suspicious Command Path"
id: ttp-2026-0034-bioc-01
status: experimental
description: |
  Cron job creation with suspicious command path — persistence mechanism via scheduled task. crontab installs an entry, or a cron file is written referencing a hidden/temp binary.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    preset = xdr_data
    | filter (event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START and actor_process_image_name = "crontab") or (event_type = ENUM.FILE and action_file_path contains_any ("/etc/cron", "/var/spool/cron"))
    | filter action_process_image_command_line contains_any ("/tmp/", "/dev/shm/", "/.", "curl", "wget") or action_file_path contains "cron"
  ----
references:
  - https://attack.mitre.org/techniques/T1053/
author: CortexSim detection_scanner
tags:
    - attack.t1053.003
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
