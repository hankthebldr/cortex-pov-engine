title: "Persistence via AppleScript Command Execution \u2014 Uncommon AppleScript with Persistence Command"
id: ttp-2026-0415-bioc-01
status: experimental
description: |
  Detection of AppleScript execution containing a command that writes a launch agent for persistence
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'osascript'
    | filter action_process_image_name = '/bin/sh'
    | filter action_file_path = '/Library/LaunchAgents/com.apple.systemsetup.plist'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.007
    - attack.t1136.001
    - attack.t1547.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
