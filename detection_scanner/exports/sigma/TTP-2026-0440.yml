title: "Persistence via Registry Run Key Modification \u2014 Uncommon login item persistency behavior"
id: ttp-2026-0440-abioc-02
status: experimental
description: |
  Detection of non-standard process modifying Run key with uncommon persistence pattern
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'reg.exe'
    | filter action_file_path contains 'Run'
    | filter action_file_path contains 'CurrentVersion'
    | filter not actor_process_image_name in ('explorer.exe', 'svchost.exe', 'cmd.exe')
  ----
references:
