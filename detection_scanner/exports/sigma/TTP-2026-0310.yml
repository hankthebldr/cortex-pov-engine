title: "Kerberoasting with Rubeus to Request Weakly-Encrypted Tickets \u2014 Rubeus Kerberoast Execution"
id: ttp-2026-0310-bioc-01
status: experimental
description: |
  Detection of Rubeus.exe being executed with kerberoast command
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'rubeus.exe'
    | filter action_process_command_line contains 'kerberoast'
  ----
references:
  - https://attack.mitre.org/techniques/T1548/
author: CortexSim detection_scanner
tags:
    - attack.t1548.002
    - attack.t1078.002
    - attack.t1558.003
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
