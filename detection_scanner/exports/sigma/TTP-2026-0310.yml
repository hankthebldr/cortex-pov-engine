title: "Kerberoasting with Rubeus to Request Weakly-Encrypted Tickets \u2014 Multiple Weakly-Encrypted Tickets Requested"
id: ttp-2026-0310-abioc-02
status: experimental
description: |
  Detection of multiple weakly-encrypted Kerberos tickets requested in short time window
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK
    | filter action_remote_ip = '192.0.2.1'
    | filter dst_port = 88
    | filter action_protocol = 'kerberos'
    | comp count() by actor_process_image_name
    | filter count() > 1
  ----
references:
  - https://attack.mitre.org/techniques/T1548/
author: CortexSim detection_scanner
tags:
    - attack.t1548.002
    - attack.t1078.002
    - attack.t1558.003
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
