title: "GitHub-based Command and Control with Rare URL Containment \u2014 Contained Process Execution with Rare GitHub URL"
id: ttp-2026-0260-bioc-01
status: experimental
description: |
  Process execution initiated from a contained environment with a rare GitHub URL
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = '/bin/bash'
    | filter action_file_path = '/tmp/evil/payload.exe'
    | filter causality_actor_process_image_name = '/bin/bash'
    | filter action_remote_ip = '192.0.2.1'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1105
    - attack.t1071.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
