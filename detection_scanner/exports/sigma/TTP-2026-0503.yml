title: "Kubernetes Pod Container Runtime Connection via Local Socket \u2014 Suspicious container runtime connection from within a Kubernetes Pod"
id: ttp-2026-0503-bioc-01
status: experimental
description: |
  Detects a process connecting to a container runtime socket from within a Kubernetes Pod environment
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK
    | filter action_remote_ip = '192.0.2.1'
    | filter dst_port = 10250
    | filter actor_process_image_name contains 'kubelet'
    | filter causality_actor_process_image_name contains 'pod'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.004
    - attack.t1078.004
    - attack.t1566.001
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
