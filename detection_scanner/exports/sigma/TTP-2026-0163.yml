title: "First-Time Kubernetes Secret Enumeration & Access (SIM-CDR-026) \u2014 Kubernetes Secret Enumeration via Python Script"
id: ttp-2026-0163-bioc-01
status: experimental
description: |
  Detection of python process executing k8s audit emitter simulator with list/get verbs on secrets resource
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'python3'
    | filter action_process_image_name = 'scripts.eal_simulator.cli'
    | filter action_file_path contains 'cdr-026-enum.yml'
    | filter action_remote_ip = 'kubernetes_api_server_ip'
  ----
references:
  - https://attack.mitre.org/techniques/T1552/
author: CortexSim detection_scanner
tags:
    - attack.t1552
logsource:
  product: kubernetes
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
