title: "VNC Server Execution via PowerShell with Remote Access \u2014 Rare process with VNC server capabilities started"
id: ttp-2026-0341-bioc-01
status: experimental
description: |
  Detection of a rare process named like a VNC server being started
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'vncserver.exe'
    | filter actor_process_image_name = 'powershell.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1071.004
    - attack.t1021.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
