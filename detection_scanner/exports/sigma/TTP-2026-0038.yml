title: "ITDR \u2014 MFA Fatigue / Push-Bombing (Okta) \u2014 ITDR-002 Pre-Flight mfa_fatigue Pattern Advertised"
id: ttp-2026-0038-bioc-01
status: experimental
description: |
  Pre-flight: mfa_fatigue advertised in plugin metadata. Confirms the emulator advertises the mfa_fatigue event pattern before the burst is emitted, so a downstream null result is a harness fault rather than a detection miss.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = okta_sso
    | filter eventType contains "user.authentication.auth_via_mfa" or _raw_log contains "mfa_fatigue"
    | comp count() as preflight_events by actor_effective_username
    | filter preflight_events >= 0
  ----
references:
  - https://attack.mitre.org/techniques/T1621/
author: CortexSim detection_scanner
tags:
    - attack.t1621
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: medium
