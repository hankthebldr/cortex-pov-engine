title: "PsExec with Suspicious Command Line Execution \u2014 PsExec Suspicious CommandLine"
id: ttp-2026-0326-bioc-01
status: experimental
description: |
  Detection of PsExec being executed with suspicious command line arguments
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'psexec.exe'
    | filter actor_process_image_name = 'powershell.exe'
    | filter action_command_line contains '-s -d -c'
  ----
references:
  - https://attack.mitre.org/techniques/T1077/
author: CortexSim detection_scanner
tags:
    - attack.t1077
    - attack.t1059
    - attack.t1021.002
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
