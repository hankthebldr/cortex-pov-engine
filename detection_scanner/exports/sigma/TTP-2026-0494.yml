title: "Wsmprovhost.exe Rare Child Process Attack Chain \u2014 Wsmprovhost.exe Rare Child Process"
id: ttp-2026-0494-bioc-01
status: experimental
description: |
  Detection of wsmprovhost.exe spawning a rare or unexpected child process
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'wsmprovhost.exe'
    | filter action_process_image_name not in ('explorer.exe', 'svchost.exe', 'wmiprvse.exe', 'wsmprovhost.exe')
    | filter action_process_image_name not in ('powershell.exe', 'cmd.exe', 'regsvr32.exe')
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1105
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
