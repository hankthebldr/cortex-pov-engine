title: "Uncommon Root-Domain Port Combination by Common Process \u2014 Globally Uncommon Root-Domain Port Combination by Common Process"
id: ttp-2026-0279-bioc-01
status: experimental
description: |
  Detection of a common process initiating network connections to uncommon root domain and port combinations
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'cmd.exe'
    | filter action_remote_ip = '192.0.2.100'
    | filter dst_port = 80
    | filter action_file_path contains 'malware.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1071.004
    - attack.t1105
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
