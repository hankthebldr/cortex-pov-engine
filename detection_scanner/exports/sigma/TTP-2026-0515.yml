title: "Automated Linux Privilege Escalation via Staged Traitor Binary \u2014 First-Seen Execution of a Privesc/Escape Tool From /tmp on This Host"
id: ttp-2026-0515-abioc-02
status: experimental
description: |
  A host that has never run traitor-amd64 suddenly executes it from a writable path moments after the file is staged — the stage→chmod→exec chain of a deployed offensive tool.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter causality_actor_process_image_name in ("sh","bash") and action_process_image_path contains "traitor-amd64"
    | comp count() as first_runs by agent_hostname, action_process_image_path
  ----
references:
  - https://attack.mitre.org/techniques/T1548/
author: CortexSim detection_scanner
tags:
