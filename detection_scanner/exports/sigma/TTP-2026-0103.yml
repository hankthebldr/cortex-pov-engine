title: "Cloud Workload IAM Usage Anomaly \u2014 Cortex Analytics Behavioral IOC (ABIOC) (T1078.004 / T1580) \u2014 New IAM Discovery Actions from Assumed Role"
id: ttp-2026-0103-bioc-02
status: experimental
description: |
  Detection of new IAM discovery API actions (ListUsers, ListRoles, DescribeInstances, ListBuckets) initiated by an assumed role not in its baseline action set.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.CLOUD_TRAIL
    | filter event_name in ("ListUsers", "ListRoles", "DescribeInstances", "ListBuckets")
    | filter user_identity_type = "AssumedRole"
    | filter action_remote_ip != ""
    | comp count() as cnt by agent_hostname, event_name
    | comp count() as action_count by agent_hostname, event_name
    | filter action_count > 1
    | filter agent_hostname in (dataset = xdr_data
    | filter event_type = ENUM.PROCESS
    | filter actor_process_image_name = "aws"
    | filter action_process_image_name = "aws"
    | filter actor_effective_username contains "AssumedRole"
    | comp count() as cnt by agent_hostname
    | comp count() as process_count by agent_hostname
    | filter process_count > 1)
  ----
references:
  - https://attack.mitre.org/techniques/T1078/
author: CortexSim detection_scanner
tags:
    - attack.t1078
    - attack.t1580
