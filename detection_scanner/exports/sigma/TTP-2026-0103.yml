title: "Cloud Workload IAM Usage Anomaly \u2014 Cortex Analytics Behavioral IOC (ABIOC) (T1078.004 / T1580) \u2014 AWS CLI Process Start with High API Call Rate"
id: ttp-2026-0103-bioc-01
status: experimental
description: |
  Detection of aws CLI process execution that triggers a burst of API calls exceeding the learned baseline rate for the assumed role.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = "aws"
    | filter action_process_image_name = "aws"
    | filter action_file_path contains "aws"
    | filter actor_effective_username contains "AssumedRole"
    | comp count() as call_count by actor_effective_username, agent_hostname
    | filter call_count > 10
    | filter agent_hostname in (dataset = xdr_data
    | filter event_type = ENUM.CLOUD_TRAIL
    | filter event_name in ("GetCallerIdentity", "ListUsers", "ListRoles", "DescribeInstances", "ListBuckets")
    | filter user_identity_type = "AssumedRole"
    | comp count() as cnt by agent_hostname
    | comp count() as api_calls by agent_hostname
    | filter api_calls > 5)
  ----
references:
  - https://attack.mitre.org/techniques/T1078/
author: CortexSim detection_scanner
tags:
    - attack.t1078
    - attack.t1580
logsource:
  product: aws
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
