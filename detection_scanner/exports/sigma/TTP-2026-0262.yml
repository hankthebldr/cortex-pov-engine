title: "Use of certutil to Decode and Execute Encoded Payload \u2014 Encoded Information Using Certificate Management Tool"
id: ttp-2026-0262-bioc-01
status: experimental
description: |
  Detection of certutil being used to decode base64 encoded data
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'certutil.exe'
    | filter action_file_path contains '-decode'
  ----
references:
  - https://attack.mitre.org/techniques/T1130/
author: CortexSim detection_scanner
tags:
    - attack.t1130
    - attack.t1059.001
    - attack.t1027
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
