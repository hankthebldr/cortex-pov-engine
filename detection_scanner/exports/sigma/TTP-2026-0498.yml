title: "Rare SSH Session with C2 Communication \u2014 SSH Session with Unusual C2 Communication"
id: ttp-2026-0498-bioc-01
status: experimental
description: |
  Detection of SSH session followed by outbound C2 communication
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'sshd'
    | filter action_process_image_name = 'wget'
    | filter action_remote_ip = '192.0.2.10'
  ----
references:
  - https://attack.mitre.org/techniques/T1021/
author: CortexSim detection_scanner
tags:
    - attack.t1021.004
    - attack.t1059.004
    - attack.t1071.004
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
