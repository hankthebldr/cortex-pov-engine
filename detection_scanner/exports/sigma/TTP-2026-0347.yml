title: "Windows Attack Using Rare Process Behavior to Divide Files by Size \u2014 Rare Windows Process Divided Files by Size"
id: ttp-2026-0347-bioc-01
status: experimental
description: |
  Detection of Windows process splitting files by size, an uncommon behavior in Windows environments.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'powershell.exe'
    | filter action_process_image_name = 'powershell.exe'
    | filter action_file_path contains 'split'
    | filter action_file_path contains 'size'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1070.004
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
