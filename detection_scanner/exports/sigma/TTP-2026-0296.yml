title: "Memory Dumping via comsvcs.dll \u2014 Memory Dumping via comsvcs.dll"
id: ttp-2026-0296-bioc-01
status: experimental
description: |
  Detection of rundll32.exe loading comsvcs.dll to perform memory dumping
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'rundll32.exe'
    | filter causality_actor_process_image_name = 'msiexec.exe'
    | filter action_file_path contains 'comsvcs.dll'
  ----
references:
  - https://attack.mitre.org/techniques/T1003/
author: CortexSim detection_scanner
tags:
    - attack.t1003.001
    - attack.t1059.001
    - attack.t1070.006
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
