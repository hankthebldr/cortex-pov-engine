title: "Sudoedit Brute Force Attack via Automated Script \u2014 Sudoedit Brute Force Attempt"
id: ttp-2026-0500-bioc-01
status: experimental
description: |
  Detects repeated sudoedit process starts with invalid passwords
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'sudoedit'
    | filter actor_process_image_name = 'bash'
    | filter causality_actor_process_image_name = 'www-data'
    | comp count() as cnt by by action_process_image_name
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.003
    - attack.t1110.001
    - attack.t1078.004
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
