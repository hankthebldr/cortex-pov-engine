title: "Uncommon RDP Connection via mstsc.exe \u2014 Uncommon RDP Connection"
id: ttp-2026-0450-bioc-01
status: experimental
description: |
  Detection of RDP connection to an IP not typically seen in the environment
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK_CONNECTION
    | filter action_process_image_name = 'mstsc.exe'
    | filter dst_port = 3389
    | filter action_remote_ip != '192.0.2.0/24'
    | filter action_remote_ip != '10.0.0.0/8'
    | filter action_remote_ip != '172.16.0.0/12'
    | filter action_remote_ip != '127.0.0.0/8'
    | filter action_remote_ip != '169.254.0.0/16'
  ----
references:
  - https://attack.mitre.org/techniques/T1021/
author: CortexSim detection_scanner
tags:
    - attack.t1021.001
    - attack.t1059.003
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
