title: "Uncommon Remote Monitoring Tool Execution via PowerShell \u2014 Uncommon Remote Monitoring Tool Execution"
id: ttp-2026-0452-bioc-01
status: experimental
description: |
  Detection of execution of PsExec or similar tools from non-standard locations
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'psexec.exe' and actor_process_image_name = 'powershell.exe'
    | filter action_file_path contains 'Temp' or action_file_path contains 'Windows\\System32'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1047
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
