title: "AWS IAM & S3 Enumeration Sequence \u2014 Cloud Discovery Recon (SIM-CDR-021) \u2014 Process Execution of Python with EAL Simulator Module"
id: ttp-2026-0156-bioc-01
status: experimental
description: |
  Detection of python3 process executing the EAL simulator module with CLI run command, indicative of cloud enumeration sequence.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = "python3"
    | filter action_process_command_line contains "scripts.eal_simulator.cli run"
  ----
references:
  - https://attack.mitre.org/techniques/T1087/
author: CortexSim detection_scanner
tags:
    - attack.t1087
    - attack.t1580
