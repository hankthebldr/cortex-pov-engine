title: "InstallUtil.exe Spawning Unusual Lolbins for Execution \u2014 Unusual Lolbins Process Spawned by InstallUtil.exe"
id: ttp-2026-0482-bioc-01
status: experimental
description: |
  Detects when InstallUtil.exe spawns uncommon lolbins like regsvr32 or mshta
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'InstallUtil.exe'
    | filter action_process_image_name in ('regsvr32.exe', 'mshta.exe')
    | filter action_file_path not contains 'Windows\\System32'
  ----
references:
  - https://attack.mitre.org/techniques/T1218/
author: CortexSim detection_scanner
tags:
    - attack.t1218
    - attack.t1059
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
