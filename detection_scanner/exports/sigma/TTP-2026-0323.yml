title: "PowerShell Download and Execute via Command Line \u2014 PowerShell Download Command Line"
id: ttp-2026-0323-bioc-01
status: experimental
description: |
  PowerShell process with command line containing DownloadFile or Invoke-WebRequest
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'powershell.exe'
    | filter action_process_command_line contains 'DownloadFile' or action_process_command_line contains 'Invoke-WebRequest'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1105
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
