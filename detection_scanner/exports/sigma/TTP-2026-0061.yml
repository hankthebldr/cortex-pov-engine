title: "FTP Cleartext Egress + Credential Exposure \u2014 Outbound STOR Exfiltration (T1071 / T1048.003) \u2014 NGFW EAL outbound FTP STOR file transfer with data payload"
id: ttp-2026-0061-bioc-01
status: experimental
description: |
  NGFW EAL — outbound file transfer via FTP STOR command + 4 KB data payload
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = panw_ngfw_traffic_raw
    | filter app = "ftp" or dst_port = 21
    | filter ftp_command = "STOR" or action_total_upload > 0
    | filter dst_ip != null and not incidr(dst_ip, "10.0.0.0/8")
    | comp count() as stor_sessions, sum(action_total_upload) as bytes_out by src_ip, dst_ip, dst_port
    | filter bytes_out > 0
    | fields src_ip, dst_ip, dst_port, stor_sessions, bytes_out
  ----
references:
