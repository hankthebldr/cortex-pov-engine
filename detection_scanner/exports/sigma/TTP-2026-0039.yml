title: "ITDR \u2014 Credential Stuffing (failed-login burst across many users) \u2014 ITDR-003 Pre-Flight idp_signin_emulator Metadata Visible"
id: ttp-2026-0039-bioc-01
status: experimental
description: |
  Pre-flight: idp_signin_emulator metadata visible to operator. Confirms the EAL plugin is registered and exposes the credential_stuffing pattern before the burst is emitted, so a null downstream result is a harness fault rather than a detection miss.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = okta_sso
    | filter eventType = "user.session.start" or _raw_log contains "credential_stuffing"
    | comp count() as preflight_events by src_ip
    | filter preflight_events >= 0
  ----
references:
  - https://attack.mitre.org/techniques/T1110/
author: CortexSim detection_scanner
tags:
    - attack.t1110.004
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: medium
