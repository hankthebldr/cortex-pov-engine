title: "Offensive Tooling: evil-winrm (adapter-deployed) \u2014 Evil-winrm Executed by a Service Account on the Endpoint"
id: ttp-2026-0527-bioc-01
status: experimental
description: |
  A non-interactive service account runs evil-winrm — an offensive TOOL-EVIL-WINRM-wired tool not part of normal operations on this host.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name contains "evil-winrm.exe" or action_process_command_line contains "evil-winrm"
    | comp count() as runs by agent_hostname, actor_effective_username
    | filter runs >= 1
  ----
references:
  - https://attack.mitre.org/techniques/T1021/
author: CortexSim detection_scanner
tags:
    - attack.t1021.006
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
