title: "Uncommon AppleScript with Discovery Command via Command Line \u2014 Uncommon AppleScript Discovery Execution"
id: ttp-2026-0423-bioc-01
status: experimental
description: |
  Detection of AppleScript execution with discovery-related commands
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'osascript'
    | filter action_file_path contains 'script.scpt'
    | filter causality_actor_process_image_name = 'bash' or causality_actor_process_image_name = 'sh'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1082
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
