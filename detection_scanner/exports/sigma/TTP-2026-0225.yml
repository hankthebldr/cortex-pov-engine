title: "Execution of Contained Malware from Mounted Share initiating Outbound Connection \u2014 Suspicious Process Start from Mounted Share"
id: ttp-2026-0225-bioc-01
status: experimental
description: |
  Detects a process started from a mounted network share path
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name like '/tmp/mounted_share/%'
    | filter causality_actor_process_image_name like 'sh' or causality_actor_process_image_name like 'bash'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1566.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
