title: "Execution of Contained Malware from Mounted Share initiating Outbound Connection \u2014 Suspicious Outbound Network Connection from Mounted Share Process"
id: ttp-2026-0225-abioc-02
status: experimental
description: |
  Detects outbound network connection initiated by a process started from a mounted share
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK
    | filter action_remote_ip = '192.0.2.5'
    | filter causality_actor_process_image_name like '/tmp/mounted_share/%'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1071.004
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
