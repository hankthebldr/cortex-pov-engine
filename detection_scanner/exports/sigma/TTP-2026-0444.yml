title: "Remote MSI Execution via msiexec \u2014 Uncommon msiexec remote execution"
id: ttp-2026-0444-bioc-01
status: experimental
description: |
  Detection of msiexec process starting with a remote file path
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'msiexec.exe'
    | filter action_file_path contains 'http://'
    | filter causality_actor_process_image_name != 'explorer.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1204/
author: CortexSim detection_scanner
tags:
    - attack.t1204.002
    - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
