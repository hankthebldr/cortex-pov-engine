title: "SSH Brute Force Attack via Hydra \u2014 SSH Brute Force Process Execution"
id: ttp-2026-0499-bioc-01
status: experimental
description: |
  Detection of hydra process execution attempting SSH login
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = '/tmp/ssh_brute/hydra'
  ----
references:
  - https://attack.mitre.org/techniques/T1110/
author: CortexSim detection_scanner
tags:
    - attack.t1110.003
    - attack.t1021.004
    - attack.t1059.004
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
