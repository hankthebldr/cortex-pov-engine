title: "Suspicious Authentication Package Registration via Regsvr32 \u2014 Suspicious Authentication Package Registration"
id: ttp-2026-0380-bioc-01
status: experimental
description: |
  Detection of a process registering an authentication package via regsvr32
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'regsvr32.exe'
    | filter action_command_line contains 'C:\\temp\\malicious.dll'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1547.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
