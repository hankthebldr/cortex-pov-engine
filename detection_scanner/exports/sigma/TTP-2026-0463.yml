title: "Unpopular rsync Process Execution via Scheduled Task \u2014 Unusual rsync execution from non-system process"
id: ttp-2026-0463-abioc-02
status: experimental
description: |
  Detection of rsync being started by a non-system process like cron or systemd, which is unusual for legitimate use
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'rsync'
    | filter causality_actor_process_image_name != 'systemd'
    | filter causality_actor_process_image_name != 'cron'
    | filter causality_actor_process_image_name != 'bash'
    | filter causality_actor_process_image_name != 'sh'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.004
    - attack.t1074
    - attack.t1053.005
