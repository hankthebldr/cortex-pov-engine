title: "Unpopular rsync Process Execution via Scheduled Task \u2014 Unpopular rsync process execution"
id: ttp-2026-0463-bioc-01
status: experimental
description: |
  Detection of rsync being executed from an uncommon location or with unusual arguments
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'rsync'
    | filter actor_process_image_name != 'cron'
    | filter actor_process_image_name != 'systemd'
    | filter not action_file_path startswith '/usr/bin/'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.004
    - attack.t1074
    - attack.t1053.005
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
