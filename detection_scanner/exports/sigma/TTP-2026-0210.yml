title: "Scheduled Task Executes mshta with Remote Payload \u2014 Uncommon LOLBin Execution by Scheduled Task"
id: ttp-2026-0210-bioc-01
status: experimental
description: |
  Detection of mshta.exe being executed by a scheduled task with a remote URL argument
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'mshta.exe'
    | filter actor_process_image_name = 'schtasks.exe'
    | filter action_file_path contains 'http://'
    | filter causality_actor_process_image_name = 'svchost.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1053/
author: CortexSim detection_scanner
tags:
    - attack.t1053.005
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
