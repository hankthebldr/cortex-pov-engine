title: "Unprivileged Process Opens Registry Hive for Persistence \u2014 Unprivileged Process Opened Registry Hive"
id: ttp-2026-0464-bioc-01
status: experimental
description: |
  Detection of an unprivileged process opening a registry hive file directly, bypassing normal registry access mechanisms.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'reg.exe'
    | filter action_file_path contains 'SOFTWARE' and action_file_path contains 'System32' and action_file_path contains 'config'
  ----
references:
  - https://attack.mitre.org/techniques/T1012/
author: CortexSim detection_scanner
tags:
    - attack.t1012
    - attack.t1059.001
    - attack.t1547.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
