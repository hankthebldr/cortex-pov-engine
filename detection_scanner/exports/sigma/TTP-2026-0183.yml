title: "CL-UNK-1211 AI-Driven Linux Government Espionage - Web Shell to Mailbox Theft, Endpoint plus NGFW Stitch (T1505.003 / T1546.004 / T1114.001) \u2014 MP-024 PHP auto_prepend_file Hijack Across PHP and Plesk Configurations"
id: ttp-2026-0183-bioc-01
status: experimental
description: |
  A web-server-lineage process (php-fpm / www-data causality) rewrites the auto_prepend_file directive in php.ini files under /etc/php/ and /opt/plesk/php/ so a dropped PHP file (plesk_sys_driver.php) executes before every PHP script - the CL-UNK-1211 global PHP-configuration persistence.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.FILE and event_sub_type in (ENUM.FILE_WRITE, ENUM.FILE_RENAME)
    | filter action_file_name = "php.ini" and (action_file_path contains "/etc/php/" or action_file_path contains "/opt/plesk/php/")
    | filter actor_effective_username = "www-data" or causality_actor_process_image_name in ("php-fpm", "php-fpm8.1", "apache2", "nginx")
    | comp count() as ini_writes, values(action_file_path) as ini_paths by agent_hostname, causality_actor_process_image_name, causality_id
    | filter ini_writes >= 2
  ----
references:
  - https://attack.mitre.org/techniques/T1505/
author: CortexSim detection_scanner
tags:
    - attack.t1505.003
    - attack.t1546
