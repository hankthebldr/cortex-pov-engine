title: "Screening Serpens: Edge Exploit to EDR AppDomain Hijack and AD Kerberoast Stitch \u2014 SIM-MP-023 Edge VPN Gateway Exploit Probe"
id: ttp-2026-0183-bioc-01
status: experimental
description: |
  Detects anomalous exploit probing targeting edge VPN interfaces in NGFW threat logs.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    preset = panw_ngfw_threat_raw
    | filter threat_category = "vulnerability" or threat_name contains "VPN" or threat_name contains "GlobalProtect"
    | filter action in ("alert", "block", "reset-both")
    | fields _time, src_ip, dst_ip, threat_name, threat_category, app_id
  ----
references:
  - https://attack.mitre.org/techniques/T1190/
author: CortexSim detection_scanner
tags:
    - attack.t1190
    - attack.t1574.014
    - attack.t1558.003
    - attack.t1041
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: medium
