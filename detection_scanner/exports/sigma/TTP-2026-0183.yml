  The run host (src / endpoint_device_name) makes a recurring burst of small ssl/443 sessions to 104.194.158.65 - the SysGoRAT default WebSocket C2 - a destination rare across the fleet. Fires on the recurring-cadence plus rarity deviation; Unit 42 enrichment of the destination IP names the actor.
