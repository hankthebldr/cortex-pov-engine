title: "Active Directory Privilege Escalation & Token Manipulation Chain \u2014 LSASS to SYSTEM (T1068 / T1134 / T1003.001) \u2014 ITDR-007 LSASS Process Handle Open By Non-System Process"
id: ttp-2026-0078-bioc-01
status: experimental
description: |
  XDR - a non-system process opens a process handle to lsass.exe with credential-read access rights. Reading LSASS memory is the canonical credential-dumping primitive (T1003.001); pypykatz parses the resulting dump offline.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS
    | filter action_type = ENUM.PROCESS_HANDLE
    | filter lower(target_process_image_name) = "lsass.exe"
    | filter actor_effective_username not in ("NT AUTHORITY\\SYSTEM", "NT AUTHORITY\\LOCAL SERVICE")
    | filter requested_access_mask contains "0x10"
    | fields _time, src_host, actor_process_image_name, actor_effective_username, requested_access_mask
  ----
references:
  - https://attack.mitre.org/techniques/T1003/
author: CortexSim detection_scanner
tags:
    - attack.t1003.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
