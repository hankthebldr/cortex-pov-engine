title: "Unusual Process Executes Contained Executable \u2014 Unusual Process Executes Contained Binary"
id: ttp-2026-0226-bioc-01
status: experimental
description: |
  Detects when an unexpected parent process executes a contained binary from a temporary directory
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = '/tmp/evil'
    | filter actor_process_image_name != 'bash' and actor_process_image_name != 'sh'
    | filter causality_actor_process_image_name != 'bash'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1105
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
