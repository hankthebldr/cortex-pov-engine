title: "Strategically Aged Sleeper-Domain Activation \u2014 Dormancy-Break DNS Burst with DGA Subdomain Fan-Out (T1568.002 / T1071.004) \u2014 Dormancy-Break Traffic Burst on a Strategically Aged Domain"
id: ttp-2026-0108-abioc-01
status: experimental
description: |
  An apex domain whose learned DNS query-volume baseline — a per-apex average daily query count computed over a 90-day baseline window while the apex held below its 75th-percentile activity — is suddenly exceeded by the activation-day volume by more than 10.3x, jumping into the top-5% band. The activation multiple is measured against that learned multi-day average (over the explicit 90-day window, excluding the activation day) rather than against an adjacent in-window bucket, so a prior baseline window must exist (a hard precondition) and the detector fires on aged, reputation-clean C2 apexes (SUNBURST/Pegasus lineage) that a newly-registered-domain block cannot see. Statistical baseline-deviation detector.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = pan_dns
    | filter dns_query_name != null and _time > to_timestamp(current_time() - 7776000)
    | alter apex_domain = arrayindex(regextract(lowercase(dns_query_name), "([a-z0-9_-]+\.[a-z]+)$"), 0)
    | alter day_bucket = format_timestamp("%Y-%m-%d", _time)
    | alter is_activation_day = if(_time >= to_timestamp(current_time() - 86400), 1, 0)
    | comp count() as day_query_count by apex_domain, day_bucket, is_activation_day
    | comp sum(if(is_activation_day = 1, day_query_count, 0)) as activation_day_queries, avg(if(is_activation_day = 0, day_query_count, null)) as baseline_daily_avg, count_distinct(if(is_activation_day = 0, day_bucket, null)) as baseline_days by apex_domain
    | filter baseline_days >= 1 and baseline_daily_avg > 0
    | alter activation_multiple = divide(activation_day_queries, baseline_daily_avg)
    | filter activation_multiple >= 10.3
    | sort desc activation_multiple
    | fields apex_domain, baseline_days, baseline_daily_avg, activation_day_queries, activation_multiple
  ----
references:
  - https://attack.mitre.org/techniques/T1071/
author: CortexSim detection_scanner
tags:
    - attack.t1071.004
    - attack.t1568.002
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
