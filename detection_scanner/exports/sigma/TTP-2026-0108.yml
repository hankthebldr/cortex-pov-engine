title: "Strategically Aged Sleeper-Domain Activation \u2014 Dormancy-Break DNS Burst with DGA Subdomain Fan-Out (T1568.002 / T1071.004) \u2014 Never-Before-Seen DGA Subdomain Fan-Out Under a Newly-Activated Apex"
id: ttp-2026-0108-abioc-02
status: experimental
description: |
  Under a single apex, a burst of distinct, high-entropy, never-before-seen subdomain labels appears within the activation window — the DGA fan-out Unit 42 measures at an average 161 DGA subdomains per activation (43.19% of burst traffic). The ABIOC anchors on the per-apex learned subdomain-diversity baseline and a label character-class/entropy gate: the left-most label must be an alphanumeric string of length >= 8 carrying >= 2 digits (a DGA/high-entropy shape that pure-dictionary subdomains like `login` or `api` fail, but the cited 9-10 char Pegasus labels imgdsg4f35 / php78mp9v clear), and known-benign CDN/cloud apexes (cloudfront.net, amazonaws.com, akamai*, azurefd.net, googleusercontent.com, cloudflare.net) are excluded so long benign labels do not roll up as a false fan-out. It fires when the count of distinct qualifying never-before-seen labels under one apex exceeds the apex's learned diversity. It catches identity-in-the-subdomain exfiltration (SUNBURST DGAstring.appsync-api.<region>.avsvmcloud[.]com) and DGA-cloaked phishing that no static IOC list enumerates.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = pan_dns
    | filter dns_query_name != null
    | alter apex_domain = arrayindex(regextract(lowercase(dns_query_name), "([a-z0-9_-]+\.[a-z]+)$"), 0)
    | filter apex_domain not in ("cloudfront.net", "amazonaws.com", "akamaiedge.net", "akamai.net", "azurefd.net", "googleusercontent.com", "cloudflare.net")
    | alter leftmost_label = arrayindex(split(lowercase(dns_query_name), "."), 0)
    | filter leftmost_label ~= "^[a-z0-9]{8,}$"
    | alter label_digit_count = array_length(regextract(leftmost_label, "[0-9]"))
    | filter label_digit_count >= 2
    | comp count_distinct(dns_query_name) as distinct_dga_subdomains, count() as dga_query_volume by apex_domain
    | filter distinct_dga_subdomains >= 50
    | sort desc distinct_dga_subdomains
    | fields apex_domain, distinct_dga_subdomains, dga_query_volume
  ----
references:
  - https://attack.mitre.org/techniques/T1568/
