title: "Recurring Access to Rare IP via PowerShell Download and Execution \u2014 RecurringAccessToRareIP"
id: ttp-2026-0355-bioc-01
status: experimental
description: |
  Process accessing rare IP address multiple times within short period
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK_CONNECTION
    | filter action_remote_ip in (select distinct action_remote_ip from xdr_data where event_type = ENUM.NETWORK_CONNECTION group by action_remote_ip having count() < 5)
    | filter timestamp > now() - 30m
    | comp count() as cnt by action_remote_ip, actor_process_image_name
    | filter count() > 2
  ----
references:
  - https://attack.mitre.org/techniques/T1071/
author: CortexSim detection_scanner
tags:
    - attack.t1071.004
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
