title: "EDR-Blinding Race \u2014 BYOVD Sensor-Tamper t0 Stitched to Cobalt Strike C2 and rclone SFTP Exfil, Time-to-Contain Measured \u2014 MP-012 BYOVD Vulnerable Driver Load \u2014 wnbios.sys / WN_64.sys"
id: ttp-2026-0122-bioc-01
status: experimental
description: |
  The sensor-tamper t0. A signed-but-vulnerable driver (wnbios.sys / WN_64.sys) is loaded, giving a kernel read/write primitive used to blind EDR (Bring Your Own Vulnerable Driver). The BIOC anchors on the module path or the known driver SHA256 rather than on a signature-status alone, because the driver is legitimately signed. This driver-load timestamp is the t0 the F6 correlation opens its window on.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.LOAD_IMAGE and event_sub_type = ENUM.DRIVER_LOAD
    | filter action_module_path contains "wnbios" or action_module_path contains "wn_64" or action_module_sha256 = "6106d1ce671b92d522144fcd3bc01276a975fe5d5b0fde09ca1cca16d09b7143"
    | comp min(_time) as tamper_t0, count() as driver_loads by agent_hostname, causality_actor_process_image_name, action_module_sha256
    | filter driver_loads >= 1
    | fields agent_hostname, causality_actor_process_image_name, action_module_sha256, tamper_t0, driver_loads
  ----
references:
  - https://attack.mitre.org/techniques/T1068/
author: CortexSim detection_scanner
tags:
    - attack.t1068
    - attack.t1562.001
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
