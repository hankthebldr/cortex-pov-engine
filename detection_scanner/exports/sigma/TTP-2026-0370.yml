title: "Screensaver Execution from Temporary Directory \u2014 Screensaver Process Executed from Users or Temp Folder"
id: ttp-2026-0370-bioc-01
status: experimental
description: |
  Detection of .scr file execution from a temporary or user directory
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'scrcons.exe'
    | filter action_file_path contains 'Temp'
    | filter action_file_path contains '.scr'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1546.008
    - attack.t1070.006
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
