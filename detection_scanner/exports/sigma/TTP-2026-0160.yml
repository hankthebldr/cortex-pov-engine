title: "Azure Service-Principal Token Abuse from an Unknown Tenant (Identity-Owned ITDR Causality Chain) \u2014 Azure Service Principal Token Abuse via Off-Baseline IP"
id: ttp-2026-0160-bioc-01
status: experimental
description: |
  Detection of a service principal token replayed from an RFC 5737 documentation-range IP address (203.0.113.201) indicating potential token abuse from unknown tenant.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = "python3" and action_process_image_name = "python3"
    | filter action_file_path contains "eal_simulator"
    | filter action_remote_ip = "203.0.113.201"
    | filter actor_effective_username = "system"
    | filter causality_actor_process_image_name = "bash"
  ----
references:
  - https://attack.mitre.org/techniques/T1528/
author: CortexSim detection_scanner
tags:
    - attack.t1528
    - attack.t1078
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
