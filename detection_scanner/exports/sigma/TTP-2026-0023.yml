title: "Cryptominer Deployment \u2014 XMRig Resource Hijacking in Containers (T1496) \u2014 CDR-002 Container Resource Limit Tuning Pre-Mining"
id: ttp-2026-0023-bioc-01
status: experimental
description: |
  System limit modification in container — ulimit/sysctl tuning consistent with cryptominer pre-deployment. A container process raises resource limits or enables huge pages to maximize hashing throughput.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    preset = xdr_data
    | filter event_type = ENUM.PROCESS
    | filter event_sub_type = ENUM.PROCESS_START
    | filter container_id != null
    | filter actor_process_image_name in ("sysctl", "ulimit", "bash", "sh")
    | filter action_process_image_command_line contains_any ("transparent_hugepage", "vm.nr_hugepages", "ulimit -n", "ulimit -u")
  ----
references:
  - https://attack.mitre.org/techniques/T1562/
author: CortexSim detection_scanner
tags:
    - attack.t1562.001
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: medium
