title: "Office Process Spawning Conhost via Macro Execution \u2014 Microsoft Office spawns conhost"
id: ttp-2026-0301-bioc-01
status: experimental
description: |
  Detection of WINWORD.exe or EXCEL.exe spawning conhost.exe
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'WINWORD.EXE' or actor_process_image_name = 'EXCEL.EXE'
    | filter action_process_image_name = 'conhost.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1204.002
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
