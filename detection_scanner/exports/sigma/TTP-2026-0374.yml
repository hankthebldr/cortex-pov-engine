title: "Signed Process Creates Scheduled Task via File Access \u2014 Signed Process Creates Scheduled Task"
id: ttp-2026-0374-bioc-01
status: experimental
description: |
  Detects when a signed process creates a scheduled task via file access
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'schtasks.exe'
    | filter action_file_path contains 'Temp'
    | filter action_file_path contains '.xml'
    | filter causality_actor_process_image_name = 'signed_process'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1053.005
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
