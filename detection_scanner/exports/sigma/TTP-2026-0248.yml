title: "Uncommon RDP Session from Managed Host \u2014 Uncommon RDP Session from Managed Host"
id: ttp-2026-0248-bioc-01
status: experimental
description: |
  Detection of an RDP session initiated from a managed host to a remote target, which is not typical behavior for managed systems.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = '/tmp/rdp_client'
    | filter action_remote_ip = '192.0.2.10'
    | filter dst_port = 3389
  ----
references:
  - https://attack.mitre.org/techniques/T1021/
author: CortexSim detection_scanner
tags:
    - attack.t1021.001
    - attack.t1071.001
    - attack.t1566.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
