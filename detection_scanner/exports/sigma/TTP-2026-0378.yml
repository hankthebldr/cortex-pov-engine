title: "CredWiz.exe Usage for Credential Export \u2014 Stored Credentials Exported via CredWiz"
id: ttp-2026-0378-bioc-01
status: experimental
description: |
  Detection of credwiz.exe process execution with export flag
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'credwiz.exe'
    | filter action_process_command_line contains '/export'
  ----
references:
  - https://attack.mitre.org/techniques/T1003/
author: CortexSim detection_scanner
tags:
    - attack.t1003.005
    - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
