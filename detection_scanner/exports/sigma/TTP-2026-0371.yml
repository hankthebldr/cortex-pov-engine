title: "Persistence via Startup Registry Key Modification \u2014 Script file added to startup-related Registry keys"
id: ttp-2026-0371-bioc-01
status: experimental
description: |
  Detection of script file added to a startup-related registry key
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.REGISTRY
    | filter action_file_path = "HKCU\Software\Microsoft\Windows\CurrentVersion\Run"
    | filter action_process_image_name = "C:\\Windows\\System32\\reg.exe"
    | filter action_file_path contains "script.bat"
  ----
references:
  - https://attack.mitre.org/techniques/T1060/
author: CortexSim detection_scanner
tags:
    - attack.t1060
    - attack.t1059.001
    - attack.t1547.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
