title: "Persistence via Startup Registry Key Modification \u2014 Unusual registry modification followed by script execution"
id: ttp-2026-0371-abioc-02
status: experimental
description: |
  Detection of registry modification to startup folder followed by execution of script file
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.REGISTRY and action_file_path = "HKCU\Software\Microsoft\Windows\CurrentVersion\Run"
    | join (dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = "C:\\Windows\\System32\\cmd.exe") on causality_actor_process_image_name = actor_process_image_name
    | filter action_file_path contains "script.bat"
  ----
references:
  - https://attack.mitre.org/techniques/T1060/
author: CortexSim detection_scanner
tags:
    - attack.t1060
    - attack.t1059.001
    - attack.t1547.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
