title: "Uncommon Driver Loaded via PowerShell and Sysinternals \u2014 Uncommon Driver Load"
id: ttp-2026-0430-bioc-01
status: experimental
description: |
  Detection of an unusual driver being loaded by a non-system process
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name != 'services.exe' and actor_process_image_name != 'lsass.exe'
    | filter action_process_image_name = 'cmd.exe' and action_file_path contains 'driver.sys'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1070.006
    - attack.t1547.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
