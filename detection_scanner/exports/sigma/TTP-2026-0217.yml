title: "Linux Endpoint: Adding Execution Privileges via chmod +x \u2014 Adding execution privileges"
id: ttp-2026-0217-bioc-01
status: experimental
description: |
  Detection of chmod +x being executed on a file in /tmp
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = '/bin/chmod' and action_file_path like '/tmp/%'
    | filter action_process_command_line like '%+x%'
  ----
references:
  - https://attack.mitre.org/techniques/T1222/
author: CortexSim detection_scanner
tags:
    - attack.t1222.002
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
