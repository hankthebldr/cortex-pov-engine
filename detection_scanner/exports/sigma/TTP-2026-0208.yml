title: "Windows Endpoint: Hidden File Attribute Set via attrib Command \u2014 Process Start with attrib Command"
id: ttp-2026-0208-bioc-01
status: experimental
description: |
  Detection of the 'attrib' process execution with arguments that set hidden and system flags
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name contains 'attrib.exe'
    | filter action_process_command_line contains '+h' and action_process_command_line contains '+s'
  ----
references:
  - https://attack.mitre.org/techniques/T1564/
author: CortexSim detection_scanner
tags:
    - attack.t1564.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
