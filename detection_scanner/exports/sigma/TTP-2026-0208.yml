title: "Windows Endpoint: Hidden File Attribute Set via attrib Command \u2014 Hidden Attribute Set Using attrib"
id: ttp-2026-0208-abioc-02
status: experimental
description: |
  Detection of file attribute changes using attrib command that sets hidden and system flags
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.FILE and event_sub_type = ENUM.FILE_ATTRIBUTE_CHANGED
    | filter action_file_attributes contains 'HIDDEN'
    | filter action_process_image_name contains 'attrib.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1564/
author: CortexSim detection_scanner
tags:
