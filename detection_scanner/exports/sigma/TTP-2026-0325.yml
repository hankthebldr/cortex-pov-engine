title: "PowerShell Suspicious Flags Execution \u2014 PowerShell Suspicious Flags"
id: ttp-2026-0325-bioc-01
status: experimental
description: |
  PowerShell process started with -WindowStyle Hidden and -EncodedCommand flags
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'powershell.exe'
    | filter action_process_image_name = 'powershell.exe'
    | filter action_process_command_line contains '-WindowStyle Hidden' and action_process_command_line contains '-EncodedCommand'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1059.005
    - attack.t1218.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
