title: "Suspicious Container Orchestration Job Execution \u2014 Suspicious Temp Directory Job Execution"
id: ttp-2026-0501-abioc-02
status: experimental
description: |
  Detection of process execution from a temporary directory with download and execution behavior
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name contains '/tmp/' and actor_process_image_name = 'wget'
    | filter causality_actor_process_image_name = 'bash'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
