title: "Suspicious sshpass Usage for Credential Theft \u2014 Suspicious sshpass command execution"
id: ttp-2026-0504-bioc-01
status: experimental
description: |
  Detection of sshpass being executed with hardcoded credentials
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = '/tmp/sshpass'
    | filter actor_process_image_name contains 'bash'
    | filter action_process_command_line contains '-p'
  ----
references:
  - https://attack.mitre.org/techniques/T1021/
author: CortexSim detection_scanner
tags:
    - attack.t1021.004
    - attack.t1059.004
    - attack.t1566.001
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
