title: "Suspicious curl beacon with empty User-Agent to rare C2 host \u2014 Suspicious curl user agent"
id: ttp-2026-0220-bioc-01
status: experimental
description: |
  Detection of curl process making outbound connections with empty or suspicious User-Agent header
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = '/tmp/scratch/curl_sample'
    | filter action_process_image_name = '/usr/bin/curl'
    | filter action_remote_ip = '192.0.2.10'
    | filter action_file_path = '/tmp/scratch/curl_sample'
  ----
references:
  - https://attack.mitre.org/techniques/T1071/
author: CortexSim detection_scanner
tags:
    - attack.t1071.001
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
