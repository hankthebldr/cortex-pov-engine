title: "Time Provider Registration via Registry Modification \u2014 Suspicious Time Provider Registered"
id: ttp-2026-0411-bioc-01
status: experimental
description: |
  A registry key under W32Time\TimeProviders is modified with a custom name and DLL path
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'reg.exe'
    | filter action_file_path contains 'W32Time\\TimeProviders'
    | filter action_file_path contains 'DllName'
    | filter action_file_path contains 'Name'
    | filter action_file_path contains 'CustomTimeProvider'
  ----
references:
  - https://attack.mitre.org/techniques/T1547/
author: CortexSim detection_scanner
tags:
    - attack.t1547.001
    - attack.t1059.001
    - attack.t1070.006
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
