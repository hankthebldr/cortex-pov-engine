title: "Windows EDR Mimicking Linux Discovery Commands via PowerShell \u2014 Windows PowerShell Executing Linux Discovery Commands"
id: ttp-2026-0306-abioc-02
status: experimental
description: |
  Behavioral deviation where a Windows PowerShell process initiates multiple Linux discovery commands
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'powershell.exe'
    | filter action_process_image_name = 'powershell.exe'
    | filter action_file_path contains 'malware.sh'
    | filter action_process_command_line contains 'whoami;hostname;ls -la'
    | filter action_process_command_line contains 'ps aux;netstat -an;df -h'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
