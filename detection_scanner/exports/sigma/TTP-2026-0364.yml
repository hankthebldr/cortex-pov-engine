title: "Remote WMI Process Execution via PowerShell \u2014 WMI Remote Process Execution"
id: ttp-2026-0364-bioc-01
status: experimental
description: |
  Detection of WMI process execution via remote connection
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'powershell.exe'
    | filter action_file_path contains 'wmic.exe' or action_file_path contains 'Get-WmiObject'
  ----
references:
  - https://attack.mitre.org/techniques/T1047/
author: CortexSim detection_scanner
tags:
    - attack.t1047
    - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
