title: "Remote WMI Process Execution via PowerShell \u2014 Suspicious PowerShell WMI Execution"
id: ttp-2026-0364-abioc-02
status: experimental
description: |
  Behavioral deviation from normal PowerShell usage involving WMI calls
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'powershell.exe'
    | filter action_file_path contains 'Get-WmiObject' or action_file_path contains 'Invoke-WmiMethod'
    | filter action_remote_ip = '192.0.2.100'
