title: "Direct Syscall Module Load via Reflective Injection \u2014 Suspicious Module Load using Direct Syscall"
id: ttp-2026-0392-bioc-01
status: experimental
description: |
  Detection of a process loading a module using direct syscall techniques, bypassing EDR hooks.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'powershell.exe'
    | filter action_file_path contains 'malicious.dll'
    | filter causality_actor_process_image_name = 'powershell.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1070.006
    - attack.t1055.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
