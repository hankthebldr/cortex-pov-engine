title: "Weak Authentication via PowerShell with Credential Dumping \u2014 Unusual PowerShell Authentication"
id: ttp-2026-0486-bioc-01
status: experimental
description: |
  PowerShell execution with credential dumping modules
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'powershell.exe'
    | filter causality_actor_process_image_name = 'cmd.exe'
    | filter action_file_path contains 'Invoke-Mimikatz.ps1'
  ----
references:
  - https://attack.mitre.org/techniques/T1078/
author: CortexSim detection_scanner
tags:
    - attack.t1078
    - attack.t1003
    - attack.t1059
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
