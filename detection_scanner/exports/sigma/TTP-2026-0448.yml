title: "Uncommon Network Connection from Untrusted Causality Actor \u2014 Uncommon Network Connection Under Untrusted Causality Actor"
id: ttp-2026-0448-bioc-01
status: experimental
description: |
  Detects a process that initiates a network connection under an untrusted causality actor.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter causality_actor_process_image_name not in ('/usr/bin/bash', '/bin/sh', '/usr/sbin/sshd')
    | filter action_remote_ip in ('192.0.2.1', '192.0.2.2', '192.0.2.3')
    | filter action_process_image_name like '/tmp/%'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1071.004
    - attack.t1566.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
