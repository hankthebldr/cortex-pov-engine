title: "Malicious .NET Compilation via Commonly Abused Process \u2014 Possible malicious .NET compilation started by a commonly abused process"
id: ttp-2026-0319-bioc-01
status: experimental
description: |
  Detection of csc.exe execution initiated by a commonly abused process like PowerShell or cmd.exe
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name in ('powershell.exe', 'cmd.exe') and action_process_image_name = 'csc.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1027
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
