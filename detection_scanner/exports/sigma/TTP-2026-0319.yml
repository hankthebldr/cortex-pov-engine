title: "Malicious .NET Compilation via Commonly Abused Process \u2014 Unusual .NET compilation by PowerShell"
id: ttp-2026-0319-abioc-02
status: experimental
description: |
  Detection of csc.exe being invoked from PowerShell with suspicious parameters
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'powershell.exe' and action_process_image_name = 'csc.exe'
    | filter action_process_command_line contains 'csc.exe' and action_process_command_line contains '/target:exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1027
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
