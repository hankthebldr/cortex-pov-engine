title: "Suspicious DNS Query for C2 Communication \u2014 Suspicious DNS Query"
id: ttp-2026-0385-bioc-01
status: experimental
description: |
  Detects DNS queries to IP addresses in the TEST-NET-1 range
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK
    | filter action_remote_ip in ('192.0.2.1')
    | filter dst_port = 53
    | filter action_process_image_name = 'nslookup.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1071/
author: CortexSim detection_scanner
tags:
    - attack.t1071.004
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
