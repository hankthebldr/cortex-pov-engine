title: "Repeated Failed Sudo Authentications Followed by Success \u2014 Sudo Brute Force Attempt"
id: ttp-2026-0211-bioc-01
status: experimental
description: |
  Multiple failed sudo authentication attempts followed by a successful one within a short time window
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'sudo'
    | filter actor_process_image_name = 'bash'
    | filter action_file_path contains 'sudo'
    | filter action_remote_ip = '192.0.2.1'
  ----
references:
  - https://attack.mitre.org/techniques/T1110/
author: CortexSim detection_scanner
tags:
    - attack.t1110.001
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
