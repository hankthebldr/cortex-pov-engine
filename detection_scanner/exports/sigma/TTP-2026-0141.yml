title: "Internal AD Kill-Chain: Poisoning \u2192 Offline Crack \u2192 Credential Validation \u2192 WinRM Lateral (SIM-ITDR-015) \u2014 ITDR-015 Null-Session Directory Enumeration Against Domain Controller"
id: ttp-2026-0141-bioc-01
status: experimental
description: |
  A single source host issues a burst of SAMR/LSARPC directory-object reads against a Domain Controller (users, groups, domain policy) consistent with enum4linux-ng AD enumeration. The CGO here is the operator recon shell on the attacker foothold; this is the opening move of the kill chain.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = msft_windows_security
    | filter event_id in (4661, 4662) and object_type in ("SAM_USER", "SAM_GROUP", "SAM_DOMAIN")
    | comp count() as dir_reads, count_distinct(object_name) as objects by ip_address, account_name
    | filter objects >= 10
    | fields ip_address, account_name, dir_reads, objects
  ----
references:
  - https://attack.mitre.org/techniques/T1087/
author: CortexSim detection_scanner
tags:
    - attack.t1087.002
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: medium
