title: "Uncommon Remote Service Start via sc.exe \u2014 Uncommon Remote Service Start via sc.exe"
id: ttp-2026-0454-bioc-01
status: experimental
description: |
  Detection of sc.exe being used to start a remote service on a non-standard endpoint
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'sc.exe'
    | filter action_remote_ip = '192.0.2.10'
    | filter action_file_path contains 'malware.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1021.002
    - attack.t1566.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
