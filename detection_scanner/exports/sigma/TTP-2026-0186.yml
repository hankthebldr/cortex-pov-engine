title: "Slow Pisces Coding-Challenge Lure to RN Loader / RN Stealer \u2014 Developer Workstation EDR + NGFW Stitch (T1204.002 / T1555.001) \u2014 MP-027 Python Writes init py Into the Home Public Folder"
id: ttp-2026-0186-bioc-01
status: experimental
description: |
  A Python interpreter creates __init__.py inside the user's home Public folder: the drop path of the Slow Pisces YAML deserialisation payload that stages RN Loader.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.FILE and event_sub_type in (ENUM.FILE_CREATE_NEW, ENUM.FILE_WRITE)
    | filter actor_process_image_name contains "python"
    | filter action_file_path ~= "/(home|Users)/[^/]+/Public/__init__\.py$"
    | fields _time, agent_hostname, actor_effective_username, actor_process_image_name, actor_process_command_line, action_file_path, causality_actor_process_image_name
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.006
    - attack.t1140
logsource:
  product: cross-platform
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
