title: "TinyRCT Backdoor Establishes VPN Tunnel and Dumps Credentials \u2014 VPN Tunnel Process Creation"
id: ttp-2026-0186-bioc-01
status: experimental
description: |
  Detection of SoftEther process start for VPN tunneling
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = '/tmp/softether'
  ----
references:
  - https://attack.mitre.org/techniques/T1572/
author: CortexSim detection_scanner
tags:
    - attack.t1572
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
