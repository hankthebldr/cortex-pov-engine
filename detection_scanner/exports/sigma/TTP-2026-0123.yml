title: "Muddled Libra Rogue-VM Alert Storm \u2014 AI SOC Analyst Seven-Signal Incident-Grouping Validation (T1003.003 / T1550.003 / T1537) \u2014 MP-013 Rogue vSphere VM Creation with Local Administrator Login"
id: ttp-2026-0123-abioc-01
status: experimental
description: |
  A 'New Virtual Machine' is created in vSphere and immediately logged into with a local Administrator account — the rogue-VM tradecraft Muddled Libra uses to work from a host outside EDR visibility. Individually a medium behavioral signal; the ABIOC anchors it to the vCenter identity + source-host chain.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = esxi_syslog
    | filter event_message contains "VmCreatedEvent" or event_message contains "New Virtual Machine"
    | filter user_name = "Administrator" or user_name contains "administrator"
    | alter agent_hostname = source_address
    | comp count() as vm_creates by agent_hostname, esxi_host, user_name
    | filter vm_creates >= 1
    | fields agent_hostname, esxi_host, user_name, vm_creates
  ----
references:
  - https://attack.mitre.org/techniques/T1078/
author: CortexSim detection_scanner
tags:
    - attack.t1078
    - attack.t1564.006
logsource:
  product: cross-platform
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: medium
