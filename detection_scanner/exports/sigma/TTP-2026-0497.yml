title: "Unusual SSH Tunneling to External Host \u2014 Rare Process Created SSH Session to Uncommon Host"
id: ttp-2026-0497-bioc-01
status: experimental
description: |
  Detection of a rare process initiating an SSH session to an external IP not typically seen in the environment
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name contains 'ssh'
    | filter action_remote_ip not in (SELECT DISTINCT dst_ip FROM xdr_data WHERE event_type = ENUM.NETWORK)
    | filter actor_process_image_name not in ('sshd', 'systemd', 'cron')
  ----
references:
  - https://attack.mitre.org/techniques/T1021/
author: CortexSim detection_scanner
tags:
    - attack.t1021.004
    - attack.t1059.001
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
