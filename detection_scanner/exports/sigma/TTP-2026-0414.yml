title: "AppleScript Obfuscation via Script Editor \u2014 Uncommon AppleScript with Obfuscation"
id: ttp-2026-0414-bioc-01
status: experimental
description: |
  Detection of AppleScript execution containing base64 encoded strings and dynamic execution patterns
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'osascript.exe'
    | filter actor_process_image_name != 'Script Editor.exe'
    | filter action_process_command_line contains 'base64'
    | filter action_process_command_line contains 'eval'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.007
    - attack.t1027
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
