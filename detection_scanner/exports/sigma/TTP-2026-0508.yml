title: "SSH Proxy Tunneling for Lateral Movement \u2014 SSH Proxy Command Execution"
id: ttp-2026-0508-bioc-01
status: experimental
description: |
  Detection of SSH process starting with ProxyCommand argument
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'ssh' and action_process_image_name = 'nc'
    | filter action_file_path contains 'ProxyCommand'
  ----
references:
  - https://attack.mitre.org/techniques/T1021/
author: CortexSim detection_scanner
tags:
    - attack.t1021.004
    - attack.t1059.004
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
