title: "Suspicious Process Spawned by wininit.exe \u2014 Suspicious Process Spawned by wininit.exe"
id: ttp-2026-0402-bioc-01
status: experimental
description: |
  Detection of a process spawned by wininit.exe, which is typically not a legitimate parent for arbitrary processes.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'wininit.exe'
    | filter action_process_image_name != 'svchost.exe' and action_process_image_name != 'lsass.exe'
    | filter action_process_image_name != 'explorer.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1036.005
    - attack.t1068
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
