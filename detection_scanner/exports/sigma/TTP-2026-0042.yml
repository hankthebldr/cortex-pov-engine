title: "Typosquat MCP Server Installed by Claude Desktop (T1195) \u2014 KOI-001 MCP Tool Description Embeds Instruction Injection and AKIA Canary"
id: ttp-2026-0042-bioc-01
status: experimental
description: |
  Code scan — tool description embeds 'Ignore previous instructions' / AKIA canary. A read of an MCP mcp.json manifest surfaces a tool description field carrying an instruction-injection directive and an AKIA-prefixed access-key canary.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    preset = xdr_data
    | filter event_type = ENUM.FILE
    | filter event_sub_type in (ENUM.FILE_OPEN, ENUM.FILE_READ)
    | filter action_file_name = "mcp.json"
    | filter action_file_path contains "anthroopic-calculator"
    | filter causality_actor_process_image_name in ("node", "claude", "code", "python3")
    | fields _time, agent_hostname, causality_actor_process_image_name, causality_id, actor_process_image_name, actor_process_instance_id, action_file_path
  ----
references:
  - https://attack.mitre.org/techniques/T1195/
author: CortexSim detection_scanner
tags:
    - attack.t1195
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
