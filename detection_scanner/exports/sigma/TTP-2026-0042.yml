title: "Typosquat MCP Server Installed by Claude Desktop (T1195) \u2014 KOI-001 Cortex Cloud Code Instruction Injection In Tool Description"
id: ttp-2026-0042-bioc-02
status: experimental
description: |
  Cortex Cloud Code — instruction-injection in tool description detected. The CI/IDE static scanner matches an instruction-injection phrase ('Ignore previous instructions', 'exfiltrate', '~/.aws/credentials') inside an MCP tool description value.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    preset = xdr_data
    | filter event_type = ENUM.PROCESS
    | filter event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name in ("grep", "jq", "checkov", "cortexcloud", "twistcli", "node")
    | filter action_process_image_command_line contains "mcp.json"
    | filter action_process_image_command_line contains_any ("Ignore previous", "exfil", "AKIA", ".aws/credentials")
  ----
references:
  - https://attack.mitre.org/techniques/T1195/
author: CortexSim detection_scanner
tags:
    - attack.t1195
    - attack.t1059
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
