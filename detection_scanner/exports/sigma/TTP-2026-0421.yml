title: "Uncommon AppleScript Execution via Command Line to External Server \u2014 Uncommon AppleScript Execution via Command Line"
id: ttp-2026-0421-bioc-01
status: experimental
description: |
  Detection of osascript executed from command-line interface with no visible terminal context
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'osascript'
    | filter causality_actor_process_image_name != 'bash' and causality_actor_process_image_name != 'zsh'
    | filter action_file_path = '/tmp/script.scpt'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1071.004
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
