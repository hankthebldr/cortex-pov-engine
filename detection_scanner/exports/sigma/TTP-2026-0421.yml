title: "Uncommon AppleScript Execution via Command Line to External Server \u2014 Suspicious AppleScript Process Start from CLI"
id: ttp-2026-0421-abioc-02
status: experimental
description: |
  Behavioral deviation where osascript is invoked directly from CLI without terminal context
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'osascript'
    | filter causality_actor_process_image_name not in ('bash', 'zsh', 'sh')
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
