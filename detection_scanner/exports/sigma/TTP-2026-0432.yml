title: "Uncommon IP Configuration via ipconfig.exe \u2014 Uncommon IP Configuration Listing"
id: ttp-2026-0432-bioc-01
status: experimental
description: |
  Detection of ipconfig.exe being executed with flags that list network configuration details outside of normal usage patterns
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'C:\\Windows\\System32\\ipconfig.exe'
    | filter action_process_command_line contains '/all' or action_process_command_line contains '/showclassid'
    | filter causality_actor_process_image_name != 'C:\\Windows\\System32\\cmd.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1016.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
