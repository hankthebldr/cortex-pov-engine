title: "Linux Reverse Shell \u2014 Multi-Method C2 Callback (T1059.004) \u2014 EDR-002 Bash devtcp Reverse Shell Redirection"
id: ttp-2026-0033-bioc-01
status: experimental
description: |
  Bash reverse shell pattern — /dev/tcp redirection detected by XDR Agent behavioral rule. bash -i is launched with its stdio redirected to a /dev/tcp socket.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    preset = xdr_data
    | filter event_type = ENUM.PROCESS
    | filter event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name in ("bash", "sh")
    | filter action_process_image_command_line contains "/dev/tcp/"
    | filter action_process_image_command_line contains_any (">&", "0>&1", "0<&")
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.004
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: critical
