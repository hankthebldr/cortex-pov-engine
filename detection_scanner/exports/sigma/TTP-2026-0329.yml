title: "Rare Binary Connecting to Rare Cloud Resource \u2014 Rare Binary Connected to Rare Cloud Resource"
id: ttp-2026-0329-bioc-01
status: experimental
description: |
  Detection of a rare binary (based on file hash) connecting to a rare cloud resource (based on IP reputation)
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = "/tmp/scratch/malware"
    | filter action_remote_ip = "192.0.2.10"
    | filter action_remote_ip in (select ip from cloud_ip_reputation where is_rare = true)
    | filter action_process_image_name in (select file_hash from rare_binary_list where is_rare = true)
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1071.004
    - attack.t1105
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
