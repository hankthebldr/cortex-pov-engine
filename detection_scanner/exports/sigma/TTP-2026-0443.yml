title: "MOF Compiler Usage for Persistence \u2014 Uncommon MOF Compiler Usage"
id: ttp-2026-0443-bioc-01
status: experimental
description: |
  Detection of mofcomp.exe being invoked with a .mof file that is not part of standard Windows components
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'mofcomp.exe'
    | filter action_file_path contains '.mof'
    | filter not action_file_path contains 'Windows\System32\wbem'
  ----
references:
  - https://attack.mitre.org/techniques/T1047/
author: CortexSim detection_scanner
tags:
    - attack.t1047
    - attack.t1059.001
    - attack.t1546.003
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
