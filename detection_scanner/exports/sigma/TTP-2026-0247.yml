title: "Abnormal User Login to Domain Controller via Kerberoasting \u2014 Unusual Process Execution from Temp Directory"
id: ttp-2026-0247-bioc-01
status: experimental
description: |
  Detection of process execution from temporary directory with Kerberoasting behavior
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name contains '/tmp/' and action_process_image_name contains 'kerberoast'
    | filter actor_process_image_name = 'lsass.exe' or actor_process_image_name = 'cmd.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1078.002
    - attack.t1558.003
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
