title: "Abnormal User Login to Domain Controller via Kerberoasting \u2014 Abnormal User Login to Domain Controller"
id: ttp-2026-0247-abioc-02
status: experimental
description: |
  Detection of user login to domain controller with unusual timing or context
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK_CONNECTION
    | filter action_remote_ip = '192.0.2.50' and dst_port = 88
    | filter actor_process_image_name = 'lsass.exe'
    | filter causality_actor_process_image_name = 'svchost.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1548/
author: CortexSim detection_scanner
tags:
    - attack.t1548.002
    - attack.t1078.002
    - attack.t1558.003
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
