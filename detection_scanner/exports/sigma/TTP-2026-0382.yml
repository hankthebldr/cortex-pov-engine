title: "Suspicious certutil usage for C2 communication \u2014 Suspicious certutil usage for C2"
id: ttp-2026-0382-abioc-02
status: experimental
description: |
  Behavioral deviation where certutil is used to download and decode files from remote C2 servers
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'certutil.exe'
    | filter action_process_command_line contains '-urlcache' and action_process_command_line contains '-split' and action_process_command_line contains '-f'
    | filter action_remote_ip = '192.0.2.100'
  ----
references:
  - https://attack.mitre.org/techniques/T1105/
author: CortexSim detection_scanner
