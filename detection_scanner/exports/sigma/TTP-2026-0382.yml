title: "Suspicious certutil usage for C2 communication \u2014 Suspicious certutil command line"
id: ttp-2026-0382-bioc-01
status: experimental
description: |
  Detection of certutil being invoked with -urlcache, -split, and -f flags to download and decode files
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'certutil.exe'
    | filter action_process_command_line contains '-urlcache' and action_process_command_line contains '-split' and action_process_command_line contains '-f'
  ----
references:
  - https://attack.mitre.org/techniques/T1105/
author: CortexSim detection_scanner
tags:
    - attack.t1105
    - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
