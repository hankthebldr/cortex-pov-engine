title: "Suspicious PowerShell Execution Connecting to Rare External IP \u2014 Commonly Abused Process Connected to Rare External Host"
id: ttp-2026-0222-abioc-02
status: experimental
description: |
  Detects a commonly abused process (powershell.exe) making a connection to a rare external IP address
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK_CONNECTION
    | filter actor_process_image_name = 'powershell.exe'
    | filter action_remote_ip in (select ip from rare_ips where count < 5)
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1071.004
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
