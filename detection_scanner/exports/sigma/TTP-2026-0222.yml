title: "Suspicious PowerShell Execution Connecting to Rare External IP \u2014 PowerShell with Hidden Window"
id: ttp-2026-0222-bioc-01
status: experimental
description: |
  Detects PowerShell process started with hidden window, a common technique for avoiding detection
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'powershell.exe' and action_process_command_line contains '-WindowStyle Hidden'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
