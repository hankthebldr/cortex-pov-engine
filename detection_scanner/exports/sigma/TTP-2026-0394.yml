title: "NTLM Authentication with Machine Account \u2014 Suspicious NTLM authentication with machine account"
id: ttp-2026-0394-bioc-01
status: experimental
description: |
  Detects NTLM authentication attempts using a machine account
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'cmd.exe'
    | filter action_remote_ip = '192.0.2.10'
    | filter action_file_path = 'C:\\Windows\\System32\\net.exe'
    | filter causality_actor_process_image_name = 'net.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1078/
author: CortexSim detection_scanner
tags:
    - attack.t1078
    - attack.t1550
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
