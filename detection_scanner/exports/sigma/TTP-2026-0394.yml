title: "NTLM Authentication with Machine Account \u2014 Suspicious NTLM authentication with machine account"
id: ttp-2026-0394-abioc-02
status: experimental
description: |
  Behavioral deviation detected when a process attempts to authenticate with a machine account over network
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.NETWORK_CONNECTION
    | filter action_remote_ip = '192.0.2.10'
    | filter dst_port = 445
    | filter causality_actor_process_image_name = 'cmd.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1078/
author: CortexSim detection_scanner
tags:
    - attack.t1078
    - attack.t1550
