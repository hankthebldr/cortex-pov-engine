title: "CL-STA-1020 HazyBeacon \u2014 mscorsvw.exe DLL Side-Load, AWS Lambda-URL C2 and Cloud-Storage Exfil (T1574.002 / T1102 / T1567.002) \u2014 MP-026 mscorsvc.dll Written Beside a Relocated mscorsvw.exe"
id: ttp-2026-0185-bioc-01
status: experimental
description: |
  A signed mscorsvw.exe is written outside %WINDIR%\Microsoft.NET and a DLL named mscorsvc.dll is written into the same directory by the same causality — the HazyBeacon side-load staging pair.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.FILE and event_sub_type in (ENUM.FILE_CREATE_NEW, ENUM.FILE_WRITE, ENUM.FILE_RENAME)
    | filter lowercase(action_file_name) in ("mscorsvw.exe", "mscorsvc.dll", "libmscorsvc.so", "mscorsvw")
    | filter lowercase(action_file_path) not contains "\\microsoft.net\\framework"
    | alter dir = arrayindex(regextract(lowercase(action_file_path), "^(.*)[\\\\/][^\\\\/]+$"), 0)
    | comp count_distinct(action_file_name) as pair, values(action_file_path) as paths by agent_hostname, causality_actor_process_instance_id, dir
    | filter pair >= 2
  ----
references:
  - https://attack.mitre.org/techniques/T1574/
author: CortexSim detection_scanner
tags:
    - attack.t1574.002
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
