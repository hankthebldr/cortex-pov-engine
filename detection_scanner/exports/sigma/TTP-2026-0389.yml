title: "Suspicious HTTP Parameters via PowerShell \u2014 PowerShell with Suspicious HTTP Parameters"
id: ttp-2026-0389-bioc-01
status: experimental
description: |
  PowerShell process started with command-line parameters indicating suspicious HTTP request
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'powershell.exe'
    | filter action_command_line contains '192.0.2.10'
    | filter action_command_line contains 'param=123'
    | filter action_command_line contains 'cmd=run'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1071.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
