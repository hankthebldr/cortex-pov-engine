title: "Mshta.exe with Suspicious Arguments Launch \u2014 Mshta Suspicious Arguments"
id: ttp-2026-0303-bioc-01
status: experimental
description: |
  Detection of mshta.exe launched with suspicious arguments such as remote scriptlet execution
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'mshta.exe'
    | filter action_file_path contains '.hta'
    | filter action_file_path contains 'http://'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.005
    - attack.t1105
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
