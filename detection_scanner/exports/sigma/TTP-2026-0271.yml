title: "Fodhelper.exe UAC Bypass via Registry Modification \u2014 Fodhelper UAC Bypass Registry Modification"
id: ttp-2026-0271-bioc-01
status: experimental
description: |
  Detection of registry modifications targeting CLSID keys used by fodhelper.exe for UAC bypass
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.REGISTRY
    | filter action_file_path contains 'HKCU\Software\Classes\CLSID'
    | filter action_file_path contains 'InprocServer32'
    | filter actor_process_image_name = 'reg.exe'
    | filter action_process_image_name = 'reg.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1546/
author: CortexSim detection_scanner
tags:
    - attack.t1546.001
    - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
