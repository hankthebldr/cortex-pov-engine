title: "Execution of Uncommon Process at Early Startup Stage \u2014 Uncommon Startup Process Execution"
id: ttp-2026-0263-bioc-01
status: experimental
description: |
  Detection of a process starting from a non-standard location during early boot phase
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'svchost.exe' and action_process_image_name contains 'temp' and action_process_image_name contains '.exe'
    | filter action_process_image_name != 'C:\\Windows\\System32\\svchost.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1547.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
