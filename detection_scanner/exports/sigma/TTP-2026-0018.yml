title: "Prisma Browser \u2014 Drive-by Download from Phishing Page (T1189) \u2014 Prisma Browser \u2014 auto-download initiated by JS without user gesture"
id: ttp-2026-0018-bioc-01
status: experimental
description: |
  Prisma Browser — auto-download initiated by JS without user gesture. A file download begins programmatically (no click / no user gesture) from a page the managed browser rendered.
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = prisma_browser_events
    | filter action = "download"
    | filter user_gesture = false
    | filter file_name != null
    | filter origin not in ("drive.google.com", "onedrive.live.com", "box.com")
  ----
references:
  - https://attack.mitre.org/techniques/T1189/
author: CortexSim detection_scanner
tags:
    - attack.t1189
    - attack.t1566.002
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
