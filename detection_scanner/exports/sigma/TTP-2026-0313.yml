title: "Phantom DLL Loading via Process Hollowing \u2014 Phantom DLL Loading Behavior"
id: ttp-2026-0313-bioc-01
status: experimental
description: |
  Detection of a legitimate process accessing a suspicious DLL file path
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter actor_process_image_name = 'svchost.exe'
    | filter action_file_path contains 'inject.dll'
    | filter causality_actor_process_image_name = 'svchost.exe'
  ----
references:
  - https://attack.mitre.org/techniques/T1059/
author: CortexSim detection_scanner
tags:
    - attack.t1059.001
    - attack.t1070.006
    - attack.t1055.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
