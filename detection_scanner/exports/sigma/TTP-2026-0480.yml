title: "Unusual Internal Access to Network Device Management Interface \u2014 Unusual Internal Access to Management Interface"
id: ttp-2026-0480-bioc-01
status: experimental
description: |
  Detection of a process accessing a network device management interface from an internal host
  Canonical Cortex XQL body follows (preserve verbatim for XSIAM):
  ----
    dataset = xdr_data
    | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
    | filter action_process_image_name = 'powershell.exe'
    | filter action_remote_ip = '192.0.2.50'
    | filter dst_port = 23
  ----
references:
  - https://attack.mitre.org/techniques/T1021/
author: CortexSim detection_scanner
tags:
    - attack.t1021.001
    - attack.t1059.003
    - attack.t1110.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    placeholder: replace_with_target_dialect_translation_of_xql
  condition: selection
falsepositives:
  - Legitimate administrative tooling that mirrors the same telemetry shape.
level: high
