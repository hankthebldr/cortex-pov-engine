name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject repo metadata into site
        run: |
          mkdir -p _site
          cp -R docs/site/. _site/
          # Replace placeholders so the page knows which repo to query at runtime.
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          REPO="${GITHUB_REPOSITORY#*/}"
          # Substitute across every text asset that ships, rather than a
          # hard-coded file list. The list previously named _site/app.js;
          # when the landing page became a self-contained single file that
          # path stopped existing and sed would have failed the deploy.
          find _site -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" \) \
            -exec sed -i "s|__GH_OWNER__|${OWNER}|g; s|__GH_REPO__|${REPO}|g" {} +
          if grep -rq "__GH_OWNER__\|__GH_REPO__" _site; then
            echo "::error::unsubstituted placeholder left in _site"; exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
