name: Wiki sync

on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
      - "scenarios/**"
      - "scripts/gen_wiki.py"
      - "core/engine/scenario_loader.py"
      - ".github/workflows/wiki-sync.yml"
  workflow_dispatch:

# Only one wiki-sync at a time; later pushes supersede earlier ones.
concurrency:
  group: wiki-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-22.04
    # contents: write is REQUIRED to push to <repo>.wiki.git. This job carried
    # `contents: read` from its first commit, so every run since 2026-05-11
    # failed at the push step and the live wiki has been frozen since
    # 2026-05-15. Do not narrow this back to read.
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          path: repo

      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }

      - name: Install loader deps
        # gen_wiki.py reads the corpus through the REAL scenario loader, so it
        # needs whatever that module imports — not just pyyaml.
        working-directory: repo
        run: |
          python -m pip install --upgrade pip
          pip install -r core/requirements.txt

      - name: Build the wiki tree
        working-directory: repo
        env:
          CORTEXSIM_BASE_DIR: ${{ github.workspace }}/repo
        run: |
          python3 scripts/gen_wiki.py --out "${GITHUB_WORKSPACE}/wiki-build"
          echo "--- pages built ---"
          ls "${GITHUB_WORKSPACE}/wiki-build" | wc -l

      - name: Guard — never publish an empty or truncated tree
        # wiki-sync force-replaces the whole wiki. If the generator silently
        # produced nothing (bad path, loader import failure), an unguarded sync
        # would delete every page and report success. Fail closed instead.
        run: |
          COUNT=$(find "${GITHUB_WORKSPACE}/wiki-build" -name '*.md' | wc -l)
          echo "generated ${COUNT} pages"
          if [ "$COUNT" -lt 50 ]; then
            echo "::error::only ${COUNT} pages generated (expected 150+) — refusing to publish a truncated wiki"
            exit 1
          fi
          for required in Home.md _Sidebar.md Scenario-Index.md ATT-CK-Coverage.md; do
            if [ ! -f "${GITHUB_WORKSPACE}/wiki-build/${required}" ]; then
              echo "::error::required page ${required} missing — refusing to publish"
              exit 1
            fi
          done

      - name: Checkout wiki
        # The wiki is a separate git repo at <repo>.wiki.git, and its default
        # branch is `master`, not `main`.
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" wiki || {
            echo "::error::Wiki repo not found — create it at"
            echo "https://github.com/${{ github.repository }}/wiki"
            echo "by clicking 'Create the first page', then re-run this workflow."
            exit 1
          }

      - name: Publish
        run: |
          set -euo pipefail
          cd wiki
          git config user.name "cortexsim-wiki-bot"
          git config user.email "wiki-bot@users.noreply.github.com"

          # Full replace: drop everything tracked except .git, copy the freshly
          # built tree over. Safe because the build guard above proved the tree
          # is complete.
          git rm -rfq . 2>/dev/null || true
          cp -r "${GITHUB_WORKSPACE}/wiki-build/." .

          if git status --porcelain | grep -q .; then
            git add -A
            SHA="${{ github.sha }}"
            git commit -m "wiki: sync from main@${SHA:0:8}

          Narrative pages from docs/wiki/; scenario catalog regenerated from the
          corpus by scripts/gen_wiki.py. Edit the source — direct wiki edits are
          overwritten."
            git push origin master
            echo "wiki updated: $(find . -name '*.md' | wc -l) pages"
          else
            echo "no wiki changes to publish."
          fi
