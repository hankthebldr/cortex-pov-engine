name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0). Required for manual runs.'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  resolve-tag:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      version: ${{ steps.t.outputs.version }}
    steps:
      - id: t
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' does not match v*.*.*"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  lint-shell:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Shellcheck installer + bootstrap scripts
        run: |
          shopt -s globstar nullglob
          FILES=()
          for p in installer/bootstrap/*.sh installer/stage2/common/*.sh installer/stage2/linux/*.sh install.sh; do
            [ -f "$p" ] && FILES+=("$p")
          done
          if [ ${#FILES[@]} -gt 0 ]; then
            shellcheck "${FILES[@]}"
          else
            echo "No shell scripts to lint"
          fi

  build-image:
    runs-on: ubuntu-22.04
    needs: [resolve-tag, lint-shell]
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image refs
        id: meta
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMG="ghcr.io/${OWNER}/cortexsim"
          TAG="${{ needs.resolve-tag.outputs.tag }}"
          {
            echo "image=${IMG}"
            echo "tags=${IMG}:${TAG},${IMG}:latest"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: core/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  build-stage2:
    runs-on: ubuntu-22.04
    needs: resolve-tag
    steps:
      - uses: actions/checkout@v4

      - name: Prepare release dir
        run: mkdir -p dist

      - name: Package stage2-linux.tar.gz
        run: |
          if [ -d installer/stage2/linux ] || [ -d installer/stage2/common ]; then
            tar -C installer/stage2 \
                --exclude='*.zip' --exclude='*.tar.gz' \
                -czf dist/stage2-linux.tar.gz \
                $([ -d installer/stage2/common ] && echo common) \
                $([ -d installer/stage2/linux ] && echo linux)
          else
            echo "no stage2 linux assets — skipping" && touch dist/.no-stage2-linux
          fi

      - name: Package stage2-windows.zip
        run: |
          if [ -d installer/stage2/windows ] || [ -d installer/stage2/common ]; then
            sudo apt-get update && sudo apt-get install -y zip
            ( cd installer/stage2 && \
              zip -r "${GITHUB_WORKSPACE}/dist/stage2-windows.zip" \
                $([ -d common ] && echo common) \
                $([ -d windows ] && echo windows) \
                -x '*.tar.gz' '*.zip' )
          else
            echo "no stage2 windows assets — skipping" && touch dist/.no-stage2-windows
          fi

      - name: Stage bootstrap scripts (or fall back to legacy install.sh)
        run: |
          if [ -f installer/bootstrap/install.sh ]; then
            cp installer/bootstrap/install.sh dist/install.sh
          elif [ -f install.sh ]; then
            cp install.sh dist/install.sh
          fi
          if [ -f installer/bootstrap/install.ps1 ]; then
            cp installer/bootstrap/install.ps1 dist/install.ps1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: stage2-bundles
          path: dist/
          if-no-files-found: warn
          retention-days: 7

  manifest:
    runs-on: ubuntu-22.04
    needs: [resolve-tag, build-image, build-stage2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: stage2-bundles
          path: dist/

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          rm -f .no-stage2-linux .no-stage2-windows
          if compgen -G "*" > /dev/null; then
            sha256sum * > SHA256SUMS
            cat SHA256SUMS
          else
            echo "no artifacts to checksum"
            : > SHA256SUMS
          fi

      - name: Generate manifest.json
        working-directory: dist
        env:
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          IMAGE: ${{ needs.build-image.outputs.image }}
          DIGEST: ${{ needs.build-image.outputs.digest }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, datetime
          d = pathlib.Path(".")
          tag = os.environ["TAG"]
          artifacts = []
          for p in sorted(d.iterdir()):
              if p.name in ("SHA256SUMS", "manifest.json") or p.is_dir():
                  continue
              h = hashlib.sha256(p.read_bytes()).hexdigest()
              artifacts.append({
                  "name": p.name,
                  "size": p.stat().st_size,
                  "sha256": h,
                  "url": f"https://github.com/{os.environ['REPO']}/releases/download/{tag}/{p.name}",
              })
          manifest = {
              "schema_version": 1,
              "release": tag,
              "generated_at": datetime.datetime.utcnow().isoformat(timespec="seconds") + "Z",
              "image": {
                  "ref": f"{os.environ['IMAGE']}:{tag}",
                  "latest": f"{os.environ['IMAGE']}:latest",
                  "digest": os.environ.get("DIGEST", ""),
                  "platforms": ["linux/amd64", "linux/arm64"],
              },
              "artifacts": artifacts,
          }
          pathlib.Path("manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(pathlib.Path("manifest.json").read_text())
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: dist/
          retention-days: 30

  release:
    runs-on: ubuntu-22.04
    needs: [resolve-tag, manifest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: dist/

      - name: Probe anonymous GHCR pull
        id: ghcr
        env:
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          # The notes may call the image pullable only if an anonymous client
          # can actually pull it, so measure that here instead of asserting it.
          # GHCR answers an anonymous pull-token request with 200 for a public
          # package, 401 for a private one and 403 for a missing one. A token
          # is not a pull, so "public" also needs the tag's manifest to answer.
          REPO="${GITHUB_REPOSITORY_OWNER,,}/cortexsim"
          BODY="$(mktemp)"
          CODE="$(curl -s -o "$BODY" -w '%{http_code}' \
            "https://ghcr.io/token?scope=repository:${REPO}:pull&service=ghcr.io" || true)"
          STATE=unverified
          if [ "$CODE" = "200" ]; then
            TOKEN="$(jq -r '.token // empty' "$BODY" 2>/dev/null || true)"
            MCODE="$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${TOKEN}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${REPO}/manifests/${TAG}" || true)"
            if [ "$MCODE" = "200" ]; then
              STATE=public
            fi
            CODE="${CODE} token, ${MCODE} manifest"
          elif [ "$CODE" = "401" ] || [ "$CODE" = "403" ]; then
            STATE=not_public
          fi
          {
            echo "state=${STATE}"
            echo "code=${CODE}"
            echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          echo "GHCR anonymous pull of ${REPO}:${TAG}: ${STATE} (HTTP ${CODE})"

      - name: Generate release notes
        id: notes
        env:
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          GHCR_STATE: ${{ steps.ghcr.outputs.state }}
          GHCR_CODE: ${{ steps.ghcr.outputs.code }}
          GHCR_AT: ${{ steps.ghcr.outputs.at }}
        run: |
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          IMG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cortexsim:${TAG}"
          # The install.sh paragraph below describes the ROOT ./install.sh, the
          # full source bootstrap. If build-stage2 staged anything else (e.g. an
          # installer/bootstrap/install.sh), those words no longer describe the
          # asset, so stop rather than publish them over a different script.
          if [ -f dist/install.sh ] && ! cmp -s dist/install.sh install.sh; then
            echo "::error::dist/install.sh is not the root install.sh, but the notes describe the root source bootstrap. Rewrite the install.sh paragraph in this step before releasing."
            exit 1
          fi
          {
            echo "## CortexSim ${TAG}"
            echo
            echo "**Container image** — \`${IMG}\` (linux/amd64, linux/arm64) was pushed by this release run."
            case "$GHCR_STATE" in
              public)
                echo "An anonymous pull was verified at ${GHCR_AT} (HTTP ${GHCR_CODE})." ;;
              not_public)
                echo "It is **not publicly pullable**: an anonymous pull-token request returned HTTP ${GHCR_CODE} at ${GHCR_AT}. Pulling it needs credentials with access to the package; without them, build the same image from a clone (below)." ;;
              *)
                echo "Anonymous pullability was **not verified** (the probe returned HTTP ${GHCR_CODE} at ${GHCR_AT}). Do not assume \`docker pull\` works; build the image from a clone (below)." ;;
            esac
            echo
            echo "**Install from a clone.** No asset attached here fetches the source for you. Use a plain clone; do not pass \`--recurse-submodules\`, because two of the submodules may be private."
            echo
            echo '```bash'
            echo "git clone --branch ${TAG} https://github.com/${GITHUB_REPOSITORY}.git"
            echo "cd ${GITHUB_REPOSITORY#*/}"
            echo "./scripts/dev-up.sh"
            echo '```'
            echo
            echo "\`scripts/dev-up.sh\` needs only Docker. It builds the image locally (\`docker compose up -d --build\`) and waits for \`/api/health\`."
            echo
            if [ -f dist/install.sh ]; then
              echo "**\`install.sh\` is the source bootstrap, not a one-line installer.** It installs a Go/Rust/Node/Python toolchain, initialises the submodules, builds every component and runs \`docker compose up -d --build\`, all relative to the directory it runs in. Run it from the root of the clone above as your normal user (\`./install.sh\`); it calls \`sudo\` itself. Do not pipe it (\`curl … | bash\`). Outside a checkout it installs the toolchain, skips every build step with a warning, starts nothing, and still prints \"Installation complete\". The attached copy is the same file as \`install.sh\` at the root of the tree this release was built from."
              echo
            fi
            echo "Verify artifact integrity with \`SHA256SUMS\` or \`manifest.json\`."
            echo
            if [ -n "$PREV" ]; then
              echo "### Changes since ${PREV}"
              git log --pretty='- %s (%h)' "${PREV}..${TAG}" | head -100
            else
              echo "### Initial release"
            fi
          } > NOTES.md
          echo "path=NOTES.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          ASSETS=()
          for f in dist/*; do
            [ -f "$f" ] && ASSETS+=("$f")
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --notes-file NOTES.md
          else
            gh release create "$TAG" \
              --title "CortexSim $TAG" \
              --notes-file NOTES.md \
              "${ASSETS[@]}"
          fi
