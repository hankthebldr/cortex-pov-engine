name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0). Required for manual runs.'
        required: true
        type: string

# Least privilege: nothing at workflow scope, each job asks for exactly what it
# uses. Only build-image may write packages (the GHCR push) and only release
# may write contents (the GitHub Release). lint-shell runs apt-get, and before
# this split it ran holding a token that could rewrite the release and the
# image (CI-12).
permissions: {}

jobs:
  resolve-tag:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      version: ${{ steps.t.outputs.version }}
    steps:
      - id: t
        env:
          # Through env, never ${{ }} inside run: — a dispatch input
          # interpolated into the script is executed as shell.
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' does not match v*.*.*"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  lint-shell:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Shellcheck installer + bootstrap scripts
        run: |
          shopt -s globstar nullglob
          FILES=()
          for p in installer/bootstrap/*.sh installer/stage2/common/*.sh installer/stage2/linux/*.sh install.sh; do
            [ -f "$p" ] && FILES+=("$p")
          done
          if [ ${#FILES[@]} -gt 0 ]; then
            shellcheck "${FILES[@]}"
          else
            echo "No shell scripts to lint"
          fi

  build-image:
    runs-on: ubuntu-22.04
    needs: [resolve-tag, lint-shell]
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image refs
        id: meta
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMG="ghcr.io/${OWNER}/cortexsim"
          TAG="${{ needs.resolve-tag.outputs.tag }}"
          {
            echo "image=${IMG}"
            echo "tags=${IMG}:${TAG},${IMG}:latest"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: core/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  build-stage2:
    runs-on: ubuntu-22.04
    needs: resolve-tag
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare release dir
        run: mkdir -p dist

      # A stage2-<os> asset ships only when installer/stage2/<os>/ exists.
      # Shared files under stage2/common/ never produce an asset on their own:
      # with only common/ present, the old `|| -d common` clause attached a
      # stage2-windows.zip whose entire content was one bash file
      # (common/annotate.sh) — a "Windows installer" asset with nothing for
      # Windows in it (CI-13).
      - name: Package stage2-linux.tar.gz
        run: |
          if [ -d installer/stage2/linux ]; then
            # common/ is bash (annotate.sh) and rides along with Linux only.
            PARTS=(linux)
            [ -d installer/stage2/common ] && PARTS=(common linux)
            tar -C installer/stage2 \
                --exclude='*.zip' --exclude='*.tar.gz' \
                -czf dist/stage2-linux.tar.gz "${PARTS[@]}"
          else
            echo "no installer/stage2/linux/ — stage2-linux.tar.gz not emitted"
          fi

      - name: Package stage2-windows.zip
        run: |
          if [ -d installer/stage2/windows ]; then
            command -v zip >/dev/null || { sudo apt-get update && sudo apt-get install -y zip; }
            # windows/ only: common/ holds bash, which a Windows host cannot run.
            ( cd installer/stage2 && \
              zip -r "${GITHUB_WORKSPACE}/dist/stage2-windows.zip" windows \
                -x '*.tar.gz' '*.zip' )
          else
            echo "no installer/stage2/windows/ — stage2-windows.zip not emitted"
          fi

      - name: Stage bootstrap scripts (or fall back to legacy install.sh)
        run: |
          if [ -f installer/bootstrap/install.sh ]; then
            cp installer/bootstrap/install.sh dist/install.sh
          elif [ -f install.sh ]; then
            cp install.sh dist/install.sh
          fi
          if [ -f installer/bootstrap/install.ps1 ]; then
            cp installer/bootstrap/install.ps1 dist/install.ps1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage2-bundles
          path: dist/
          if-no-files-found: warn
          retention-days: 7

  # The beacon matrix, built from the tag with the same script `make agent-dist`
  # runs, so a DC can stage it through change control or onto an air-gapped
  # shelf without building Go. SimCore still serves its own baked copy from
  # /api/agents/binary, which is the supported install path (CI-06).
  build-agent:
    runs-on: ubuntu-22.04
    needs: resolve-tag
    permissions:
      contents: read
    outputs:
      go_version: ${{ steps.go.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Same version string as ci.yml's agent job.
          go-version: '1.21'
          # No build cache in a release job: release bytes must not depend on
          # a cache another workflow run could have written. (agent/go.sum
          # does not exist either; the beacon is stdlib-only.)
          cache: false

      - id: go
        run: echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"

      - name: Cross-compile the beacon matrix
        env:
          OUT_DIR: ${{ github.workspace }}/dist/agent
        run: bash scripts/build-agent-dist.sh

      - name: Assert the five-target matrix shipped
        working-directory: dist/agent
        run: |
          # Fail closed: a release missing a target must not publish, and in
          # particular must not publish without the Windows beacon.
          EXPECT="cortexsim-agent-darwin-amd64 cortexsim-agent-darwin-arm64 cortexsim-agent-linux-amd64 cortexsim-agent-linux-arm64 cortexsim-agent-windows-amd64.exe"
          GOT="$(printf '%s\n' cortexsim-agent-* | LC_ALL=C sort | tr '\n' ' ' | sed 's/ $//')"
          if [ "$GOT" != "$EXPECT" ]; then
            echo "::error::beacon matrix mismatch. expected: $EXPECT  got: $GOT"
            exit 1
          fi
          # Structural check only: the .exe is a PE image (MZ header). This
          # proves the right file format, not that it runs on Windows.
          if [ "$(head -c 2 cortexsim-agent-windows-amd64.exe)" != "MZ" ]; then
            echo "::error::cortexsim-agent-windows-amd64.exe is not a PE image"
            exit 1
          fi
          sha256sum -c SHA256SUMS

      - name: Record build provenance (go version -m)
        working-directory: dist/agent
        run: |
          # The module path, Go toolchain, GOOS/GOARCH, CGO_ENABLED, -trimpath
          # and vcs.revision embedded in each binary, read back from the bytes
          # rather than asserted. (-ldflags is not recorded: Go omits it when
          # -trimpath is set.)
          : > BUILDINFO.txt
          for f in cortexsim-agent-*; do
            go version -m "$f" >> BUILDINFO.txt
            echo >> BUILDINFO.txt
          done
          cat BUILDINFO.txt
          # Each binary must carry the GOOS its filename claims.
          for f in cortexsim-agent-*; do
            want="${f#cortexsim-agent-}"; want="${want%%-*}"
            if ! go version -m "$f" | grep -qE "^[[:space:]]+build[[:space:]]+GOOS=${want}$"; then
              echo "::error::$f does not record GOOS=${want}"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-dist
          path: dist/agent/
          if-no-files-found: error
          retention-days: 7

  manifest:
    runs-on: ubuntu-22.04
    needs: [resolve-tag, build-image, build-stage2, build-agent]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stage2-bundles
          path: dist/

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-dist
          path: dist/agent/

      - name: Stage beacon assets at the release root
        working-directory: dist
        run: |
          # Verify the bytes survived the artifact hop against the sums the
          # build job wrote, then flatten: a GitHub Release has no
          # directories, and the beacon's SHA256SUMS would collide with the
          # release-wide one, so it ships renamed.
          ( cd agent && sha256sum -c SHA256SUMS )
          mv agent/cortexsim-agent-* .
          mv agent/SHA256SUMS cortexsim-agent-SHA256SUMS
          mv agent/BUILDINFO.txt cortexsim-agent-buildinfo.txt
          rmdir agent

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          if compgen -G "*" > /dev/null; then
            sha256sum * > SHA256SUMS
            cat SHA256SUMS
          else
            echo "no artifacts to checksum"
            : > SHA256SUMS
          fi

      - name: Generate manifest.json
        working-directory: dist
        env:
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          IMAGE: ${{ needs.build-image.outputs.image }}
          DIGEST: ${{ needs.build-image.outputs.digest }}
          REPO: ${{ github.repository }}
          AGENT_GO_VERSION: ${{ needs.build-agent.outputs.go_version }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, datetime
          d = pathlib.Path(".")
          tag = os.environ["TAG"]
          artifacts = []
          for p in sorted(d.iterdir()):
              if p.name in ("SHA256SUMS", "manifest.json") or p.is_dir():
                  continue
              h = hashlib.sha256(p.read_bytes()).hexdigest()
              artifacts.append({
                  "name": p.name,
                  "size": p.stat().st_size,
                  "sha256": h,
                  "url": f"https://github.com/{os.environ['REPO']}/releases/download/{tag}/{p.name}",
              })
          manifest = {
              "schema_version": 1,
              "release": tag,
              "generated_at": datetime.datetime.utcnow().isoformat(timespec="seconds") + "Z",
              "image": {
                  "ref": f"{os.environ['IMAGE']}:{tag}",
                  "latest": f"{os.environ['IMAGE']}:latest",
                  "digest": os.environ.get("DIGEST", ""),
                  "platforms": ["linux/amd64", "linux/arm64"],
              },
              "artifacts": artifacts,
          }
          # The beacon matrix, described rather than just listed, so a reader
          # of the manifest alone learns what the binaries are NOT.
          extras = {"cortexsim-agent-SHA256SUMS", "cortexsim-agent-buildinfo.txt"}
          beacons = []
          for p in sorted(d.glob("cortexsim-agent-*")):
              if p.name in extras:
                  continue
              goos, goarch = p.name[len("cortexsim-agent-"):].removesuffix(".exe").split("-", 1)
              beacons.append({
                  "name": p.name,
                  "os": goos,
                  "arch": goarch,
                  "sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
              })
          if len(beacons) != 5 or not all((d / x).is_file() for x in extras):
              raise SystemExit(f"beacon assets incomplete: {[b['name'] for b in beacons]}")
          manifest["agent"] = {
              "go_version": os.environ["AGENT_GO_VERSION"],
              "build": "scripts/build-agent-dist.sh: CGO_ENABLED=0 go build -trimpath -ldflags='-s -w'",
              "signed": False,
              "executed_on_target_os_by_release": False,
              "sha256sums": "cortexsim-agent-SHA256SUMS",
              "buildinfo": "cortexsim-agent-buildinfo.txt",
              "binaries": beacons,
              "notes": [
                  "Not code-signed: no Authenticode signature on the Windows .exe, no Apple notarization on the darwin builds.",
                  "Built and structurally checked (file set, PE header, embedded GOOS) on Linux by this run; not executed on Windows or macOS by this run.",
                  "Not expected to be byte-identical to the beacon baked into the container image, which core/Dockerfile builds with its own Go toolchain. Verify each copy against its own checksums, never across the two.",
              ],
          }
          pathlib.Path("manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(pathlib.Path("manifest.json").read_text())
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle
          path: dist/
          retention-days: 30

  release:
    runs-on: ubuntu-22.04
    needs: [resolve-tag, manifest, build-agent]
    permissions:
      # gh release create/upload/edit. The only job that writes the repo.
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-bundle
          path: dist/

      - name: Probe anonymous GHCR pull
        id: ghcr
        env:
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          # The notes may call the image pullable only if an anonymous client
          # can actually pull it, so measure that here instead of asserting it.
          # GHCR answers an anonymous pull-token request with 200 for a public
          # package, 401 for a private one and 403 for a missing one. A token
          # is not a pull, so "public" also needs the tag's manifest to answer.
          REPO="${GITHUB_REPOSITORY_OWNER,,}/cortexsim"
          BODY="$(mktemp)"
          CODE="$(curl -s -o "$BODY" -w '%{http_code}' \
            "https://ghcr.io/token?scope=repository:${REPO}:pull&service=ghcr.io" || true)"
          STATE=unverified
          if [ "$CODE" = "200" ]; then
            TOKEN="$(jq -r '.token // empty' "$BODY" 2>/dev/null || true)"
            MCODE="$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${TOKEN}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${REPO}/manifests/${TAG}" || true)"
            if [ "$MCODE" = "200" ]; then
              STATE=public
            fi
            CODE="${CODE} token, ${MCODE} manifest"
          elif [ "$CODE" = "401" ] || [ "$CODE" = "403" ]; then
            STATE=not_public
          fi
          {
            echo "state=${STATE}"
            echo "code=${CODE}"
            echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          echo "GHCR anonymous pull of ${REPO}:${TAG}: ${STATE} (HTTP ${CODE})"

      - name: Generate release notes
        id: notes
        env:
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          GHCR_STATE: ${{ steps.ghcr.outputs.state }}
          GHCR_CODE: ${{ steps.ghcr.outputs.code }}
          GHCR_AT: ${{ steps.ghcr.outputs.at }}
          AGENT_GO_VERSION: ${{ needs.build-agent.outputs.go_version }}
        run: |
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          IMG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cortexsim:${TAG}"
          # The install.sh paragraph below describes the ROOT ./install.sh, the
          # full source bootstrap. If build-stage2 staged anything else (e.g. an
          # installer/bootstrap/install.sh), those words no longer describe the
          # asset, so stop rather than publish them over a different script.
          if [ -f dist/install.sh ] && ! cmp -s dist/install.sh install.sh; then
            echo "::error::dist/install.sh is not the root install.sh, but the notes describe the root source bootstrap. Rewrite the install.sh paragraph in this step before releasing."
            exit 1
          fi
          {
            echo "## CortexSim ${TAG}"
            echo
            echo "**Container image** — \`${IMG}\` (linux/amd64, linux/arm64) was pushed by this release run."
            case "$GHCR_STATE" in
              public)
                echo "An anonymous pull was verified at ${GHCR_AT} (HTTP ${GHCR_CODE})." ;;
              not_public)
                echo "It is **not publicly pullable**: an anonymous pull-token request returned HTTP ${GHCR_CODE} at ${GHCR_AT}. Pulling it needs credentials with access to the package; without them, build the same image from a clone (below)." ;;
              *)
                echo "Anonymous pullability was **not verified** (the probe returned HTTP ${GHCR_CODE} at ${GHCR_AT}). Do not assume \`docker pull\` works; build the image from a clone (below)." ;;
            esac
            echo
            echo "**Install from a clone.** No asset attached here fetches the source for you. Use a plain clone; do not pass \`--recurse-submodules\`, because two of the submodules may be private."
            echo
            echo '```bash'
            echo "git clone --branch ${TAG} https://github.com/${GITHUB_REPOSITORY}.git"
            echo "cd ${GITHUB_REPOSITORY#*/}"
            echo "./scripts/dev-up.sh"
            echo '```'
            echo
            echo "\`scripts/dev-up.sh\` needs only Docker. It builds the image locally (\`docker compose up -d --build\`) and waits for \`/api/health\`."
            echo
            if [ -f dist/install.sh ]; then
              echo "**\`install.sh\` is the source bootstrap, not a one-line installer.** It installs a Go/Rust/Node/Python toolchain, initialises the submodules, builds every component and runs \`docker compose up -d --build\`, all relative to the directory it runs in. Run it from the root of the clone above as your normal user (\`./install.sh\`); it calls \`sudo\` itself. Do not pipe it (\`curl … | bash\`). Outside a checkout it installs the toolchain, skips every build step with a warning, starts nothing, and still prints \"Installation complete\". The attached copy is the same file as \`install.sh\` at the root of the tree this release was built from."
              echo
            fi
            # Every claim below is about what this run did. Signing is not
            # done here; whether to sign is an open decision, not a TODO.
            echo "**Beacon binaries — unsigned.** \`cortexsim-agent-linux-{amd64,arm64}\`, \`cortexsim-agent-darwin-{amd64,arm64}\` and \`cortexsim-agent-windows-amd64.exe\` were cross-compiled from this tag by \`scripts/build-agent-dist.sh\` with ${AGENT_GO_VERSION} (\`CGO_ENABLED=0 -trimpath -ldflags='-s -w'\`). They are **not code-signed**: the Windows \`.exe\` carries no Authenticode signature and the darwin builds are not notarized, so SmartScreen, Defender or Gatekeeper may warn or block them. This run built them on Linux and checked their structure (file set, PE header, embedded GOOS); it did not execute them on Windows or macOS. Per-binary checksums are in \`cortexsim-agent-SHA256SUMS\` and the \`go version -m\` build record in \`cortexsim-agent-buildinfo.txt\`."
            echo
            echo "The supported install path is unchanged: SimCore serves the beacon baked into its own image from \`/api/agents/binary\`, and the installer verifies it against that SimCore. That baked copy is built separately, by \`core/Dockerfile\` with its own Go toolchain, so it is **not expected to be byte-identical** to the assets here; compare each copy only against its own checksums."
            echo
            echo "Verify artifact integrity with \`SHA256SUMS\` or \`manifest.json\`."
            echo
            if [ -n "$PREV" ]; then
              echo "### Changes since ${PREV}"
              git log --pretty='- %s (%h)' "${PREV}..${TAG}" | head -100
            else
              echo "### Initial release"
            fi
          } > NOTES.md
          echo "path=NOTES.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          ASSETS=()
          for f in dist/*; do
            [ -f "$f" ] && ASSETS+=("$f")
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --notes-file NOTES.md
          else
            gh release create "$TAG" \
              --title "CortexSim $TAG" \
              --notes-file NOTES.md \
              "${ASSETS[@]}"
          fi
