name: CI

# Real verified gate matrix for CortexSim.
#
# Each job mirrors exactly how this repo is tested in practice (see
# docs/quick-start.md, docs/operator-runbook.md, CLAUDE.md and the root
# Makefile, which runs the SAME commands locally):
#
#   backend   — build the production simcore image, then run the FULL pytest
#               suite INSIDE it. The suite resolves content (scenarios/,
#               detection_scanner/, tools/) from the bundled /app copy with
#               CORTEXSIM_BASE_DIR=/app, so running in-image is the only way
#               to reproduce the ~1551-test green run faithfully.
#   agent     — Go 1.21+: build, vet, and `go test -race` the beacon agent,
#               PLUS a cross-compile gate for every host family the engine
#               claims to support (linux, darwin, windows). The Windows arm is
#               load-bearing: the beacon silently could not compile for Windows
#               while 71 scenarios declared platforms: [windows].
#   ui        — Node 20: npm ci + vite build + vitest run (>=305 tests).
#   detection — detection_scanner/scripts/validate.py (0 fail) AND the
#               export-determinism gate: regenerate every artifact and assert
#               `git diff --exit-code detection_scanner/exports/` is clean,
#               proving the committed exports match the live TTP cards.
#   adapters  — scripts/check-adapter-sources.sh: tier-2 submodule sources
#               must exist on disk (tier-4 runtime-fetched misses are WARN),
#               PLUS build-rust-dist.sh --check-recipe (~50 ms, no compiler):
#               the three tier-2 Rust tools have no adapter pack, so this gate
#               was blind to all three and signalbench's build_cmd was broken
#               for every DC who ever ran it without anything noticing.
#               ALSO check-adapter-wiring.py: the de-hand-rolling gate, FAIL if a
#               scenario names a tool with a non-reference-only adapter pack but
#               never wires it via external_tools[].adapter_ref.
#   rust-dist — static-musl build of signalbench/ackbarx/xdrtop, then EXECUTE
#               each on clean ubuntu:22.04 AND alpine:3 with --network none.
#               Change-filtered (gitlink / recipe / registry only) and NOT a
#               required check; the always-on half lives in `adapters`.
#   e2e-isolated — Tier-C observed-signal assertion suite (no docker) as a hard
#               gate; the docker detonation e2e is opt-in behind a `tier-c-e2e`
#               PR label.
#
# All jobs run independently and in parallel — a failure in one surfaces a
# precise gate without masking the others.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # backend — pytest inside the built production image.
  # ---------------------------------------------------------------------------
  backend:
    name: backend (pytest in prod image)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        # The image COPYs scenarios/, detection_scanner/ and tools/ in; the
        # tier-2 adapter sources are git submodules consumed by some suites,
        # so pull them too.
        with:
          submodules: recursive

      - name: Build simcore image
        run: docker build -f core/Dockerfile -t cortexsim:ci .

      - name: Run pytest inside the image
        # The repo is mounted at /repo so the tests/ tree (which is NOT baked
        # into the runtime image) is available, while the bundled content under
        # /app is what the catalogs load. PYTHONPATH=/app/core matches the
        # Dockerfile so the flat `config`/`database`/`engine.*` imports resolve.
        # A per-run high-entropy CORTEXSIM_SECRET satisfies validate_master_key
        # even though CORTEXSIM_ENV=development downgrades the guard to a warn.
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            -e CORTEXSIM_BASE_DIR=/repo \
            -e CORTEXSIM_ENV=development \
            -e CORTEXSIM_SECRET="$(openssl rand -hex 32)" \
            -e PYTHONPATH=/repo/core \
            cortexsim:ci \
            sh -c "pip install --no-cache-dir pytest pytest-asyncio httpx && \
                   pytest tests/ -v --tb=short --ignore=tests/smoke"

  # ---------------------------------------------------------------------------
  # agent — Go beacon: build + vet + race-tested.
  # ---------------------------------------------------------------------------
  agent:
    name: agent (go build/vet/test -race)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: agent/go.sum
      - name: Build
        working-directory: agent
        run: go build ./...
      - name: Vet
        working-directory: agent
        run: go vet ./...

      # Cross-compile gate. 71 of the 162 scenarios declare platforms: [windows],
      # yet the beacon could not compile for GOOS=windows at all (POSIX-only
      # Setpgid / syscall.Kill in agent/executor) — so pull mode was impossible
      # on Windows and nothing in CI ever said so. Building for every host family
      # the engine claims to support is what keeps that honest. CGO_ENABLED=0
      # matches scripts/build-agent-dist.sh, which is what actually ships.
      - name: Cross-compile (windows/amd64)
        working-directory: agent
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build ./... && go vet ./...

      - name: Cross-compile (darwin/arm64)
        working-directory: agent
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: go build ./... && go vet ./...

      - name: Test (race)
        working-directory: agent
        run: go test ./... -race -count=1 -v

  # ---------------------------------------------------------------------------
  # ui — React/Vite: install + production build + vitest unit/component suite.
  # ---------------------------------------------------------------------------
  ui:
    name: ui (build + vitest)
    runs-on: ubuntu-22.04
    env:
      # vitest runs under jsdom and never launches a real browser; skip the
      # heavy Playwright/Puppeteer browser downloads so `npm ci` doesn't fail
      # on runners without outbound access to those CDNs. The dedicated e2e
      # job in test.yml fetches chromium when it actually needs it.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PUPPETEER_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install (npm ci)
        working-directory: ui
        run: npm ci
      - name: Build
        working-directory: ui
        run: npm run build
      - name: Unit + component tests (vitest)
        working-directory: ui
        run: npx vitest run

  # ---------------------------------------------------------------------------
  # detection — TTP corpus validity + export determinism.
  # ---------------------------------------------------------------------------
  detection:
    name: detection (validate + export determinism)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install validator deps
        # validate.py needs jsonschema (Draft 2020-12); pyyaml is harmless and
        # keeps the env aligned with the loader. core/requirements pins
        # jsonschema==4.23.0 — install that exact pin so CI matches the image.
        run: |
          python -m pip install --upgrade pip
          pip install 'jsonschema>=4.18' pyyaml
      - name: Validate TTP corpus (0 fail)
        run: python3 detection_scanner/scripts/validate.py --quiet
      - name: Regenerate detection exports
        run: python3 detection_scanner/scripts/export_artifacts.py
      - name: Export-determinism gate (committed exports must match cards)
        # If this fails the committed exports drifted from the TTP cards: run
        # `python3 detection_scanner/scripts/export_artifacts.py` locally and
        # commit the result.
        run: git diff --exit-code detection_scanner/exports/

  # ---------------------------------------------------------------------------
  # refs — the UC/TC enforcement path, run against the REAL corpus.
  #
  # Every other UC/TC test exercises the machinery on synthetic refs. Without
  # this job a scenario re-keyed to a dangling test case ships green: the loader
  # would reject it at boot, but nothing in CI would ever watch that happen.
  # ---------------------------------------------------------------------------
  refs:
    name: refs (UC/TC strict validation over the corpus)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install loader deps
        run: |
          python -m pip install --upgrade pip
          pip install -r core/requirements.txt pytest pytest-asyncio
      - name: Every scenario resolves under CORTEXSIM_STRICT_REFS
        # A failure here names the scenario that would refuse to load in
        # production. Fix the ref (or the crosswalk), never the gate.
        env:
          CORTEXSIM_BASE_DIR: ${{ github.workspace }}
          CORTEXSIM_ENV: development
          PYTHONPATH: ${{ github.workspace }}/core
        run: pytest tests/engine/test_corpus_refs_strict.py -q

  # ---------------------------------------------------------------------------
  # adapters — tool-adapter source preflight + Rust build-recipe preflight.
  #
  # The Rust half is folded in HERE, not into the paths:-filtered rust-dist job
  # below, deliberately: it costs ~50 ms, needs no compiler and no Docker, and
  # this job is unconditional. A job that can be skipped reads exactly like a
  # passing one, so the cheap assertions live in the job that always runs.
  # ---------------------------------------------------------------------------
  adapters:
    name: adapters (tier-2 source + rust recipe preflight)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        # Tier-2 adapter sources are git submodules; the check FAILs if any
        # declared source_path is missing on disk, so pull them. The Rust gate
        # additionally needs sources/signalbench/helpers/pacemaker.
        with:
          submodules: recursive
      - name: Adapter source existence + rust recipe check
        env:
          CORTEXSIM_BASE_DIR: ${{ github.workspace }}
        run: scripts/check-adapter-sources.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install lint deps
        run: pip install pyyaml
      - name: Adapter-wiring lint (de-hand-rolling gate)
        # FAILs if a scenario names a tool that HAS an adapter pack but never
        # wires it via external_tools[].adapter_ref — the case that silently
        # bypasses the safety/consent + self-install machinery. Green at 0
        # candidates; this gate keeps it there.
        env:
          CORTEXSIM_BASE_DIR: ${{ github.workspace }}
        run: python3 scripts/check-adapter-wiring.py --list

  # ---------------------------------------------------------------------------
  # rust-dist — static musl build of the three tier-2 Rust tools, then EXECUTE
  # each one on a clean glibc host and a clean musl host with no network.
  #
  # paths:-filtered because a full Rust build is ~4 min cold and only a gitlink
  # bump, a recipe change or a registry change can break it. NOT a required
  # check — the always-on assertions are in `adapters` above.
  #
  # The exec step is the entire point. A build-only job would have gone green on
  # a binary that dies with `error while loading shared libraries` on a customer
  # jumpbox — and the DC would find out in front of the customer. Had this job
  # existed, signalbench's broken `cargo build --release` (it embeds
  # helpers/pacemaker's output via include_bytes! and that helper must be built
  # FIRST) would have been caught at the commit that pinned v1.8.1.
  # ---------------------------------------------------------------------------
  rust-dist:
    name: rust-dist (static musl build + exec proof)
    runs-on: ubuntu-22.04
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Detect whether anything that can break the Rust build changed
        id: changed
        run: |
          # On workflow_dispatch, or when we cannot diff (first commit), run it.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          [ -n "$base" ] || base="${{ github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -qE \
              '^(sources/|scripts/build-rust-dist\.sh|core/tools/registry\.py|core/Dockerfile|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No gitlink / recipe / registry change — Rust matrix unchanged."
          fi
      - name: Build the static musl matrix
        if: steps.changed.outputs.run == 'true'
        run: scripts/build-rust-dist.sh
      - name: Verify SHA256SUMS
        if: steps.changed.outputs.run == 'true'
        run: cd rust-dist && sha256sum -c SHA256SUMS
      # --network none is load-bearing: it proves the binary needs nothing
      # fetched at run time, which is the whole claim being made about it.
      - name: EXECUTE each binary on clean ubuntu:22.04 (glibc) and alpine:3 (musl)
        if: steps.changed.outputs.run == 'true'
        run: |
          set -e
          for img in ubuntu:22.04 alpine:3; do
            for t in signalbench ackbarx xdrtop; do
              printf '  %-14s %-12s ' "$img" "$t"
              docker run --rm --network none --platform linux/amd64 \
                -v "$PWD/rust-dist:/d:ro" "$img" \
                "/d/cortexsim-tool-$t-linux-amd64" --version
            done
          done
          echo "6/6 started on clean glibc + musl hosts with no network"
      - name: Upload the matrix
        if: steps.changed.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rust-dist-linux-amd64
          path: |
            rust-dist/cortexsim-tool-*
            rust-dist/SHA256SUMS
            rust-dist/MANIFEST.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # e2e-isolated — Tier-C isolated-execution gate.
  #
  # The pure observed-signal assertion suite (deploy/tier-c/tier_c_assert.py
  # driven by reference expectation specs) proves that when a scenario dispatches
  # step N the observed-signal contract still holds, WITHOUT needing docker. It
  # is stdlib + pyyaml only and runs in ~2s, so it runs on every push as a
  # focused Tier-C signal separate from the monolithic `backend` image build.
  #
  # The docker-gated end-to-end (build the runner + sinkhole, detonate a real
  # SIM-EDR-001 push bundle, assert the observed signals) is opt-in behind the
  # `tier-c-e2e` PR label until it is validated against live CI.
  # ---------------------------------------------------------------------------
  e2e-isolated:
    name: e2e (Tier-C isolated execution)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test deps
        run: pip install pytest pyyaml
      - name: Tier-C assertion suite (hard gate — no docker)
        env:
          CORTEXSIM_BASE_DIR: ${{ github.workspace }}
        run: |
          python3 -m pytest \
            tests/e2e_isolated/test_tier_c_assets.py \
            tests/e2e_isolated/test_tier_c_isolated_exec.py \
            -v --tb=short
      - name: Tier-C docker end-to-end (opt-in — label 'tier-c-e2e')
        if: contains(toJson(github.event.pull_request.labels.*.name), 'tier-c-e2e')
        env:
          CORTEXSIM_ENV: development
        run: |
          docker build -f core/Dockerfile -t cortexsim:tierc .
          docker run -d --name simcore -p 8888:8888 \
            -e CORTEXSIM_ENV=development \
            -e CORTEXSIM_SECRET="$(openssl rand -hex 32)" \
            cortexsim:tierc
          for i in $(seq 1 30); do
            curl -sf http://localhost:8888/api/health && break || sleep 2
          done
          deploy/tier-c/run-tier-c.sh --scenario SIM-EDR-001 \
            --simcore http://localhost:8888 --results "$RUNNER_TEMP/tierc-out"
