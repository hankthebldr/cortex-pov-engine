name: CI

# Real verified gate matrix for CortexSim.
#
# Each job mirrors exactly how this repo is tested in practice (see
# docs/quick-start.md, docs/operator-runbook.md, CLAUDE.md and the root
# Makefile, which runs the SAME commands locally):
#
#   backend   — build the production simcore image, then run the FULL pytest
#               suite INSIDE it. The suite resolves content (scenarios/,
#               detection_scanner/, tools/) from the bundled /app copy with
#               CORTEXSIM_BASE_DIR=/app, so running in-image is the only way
#               to reproduce the ~1551-test green run faithfully.
#   agent     — Go 1.21+: build, vet, and `go test -race` the beacon agent.
#   ui        — Node 20: npm ci + vite build + vitest run (>=305 tests).
#   detection — detection_scanner/scripts/validate.py (0 fail) AND the
#               export-determinism gate: regenerate every artifact and assert
#               `git diff --exit-code detection_scanner/exports/` is clean,
#               proving the committed exports match the live TTP cards.
#   adapters  — scripts/check-adapter-sources.sh: tier-2 submodule sources
#               must exist on disk (tier-4 runtime-fetched misses are WARN).
#
# All jobs run independently and in parallel — a failure in one surfaces a
# precise gate without masking the others.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # backend — pytest inside the built production image.
  # ---------------------------------------------------------------------------
  backend:
    name: backend (pytest in prod image)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        # The image COPYs scenarios/, detection_scanner/ and tools/ in; the
        # tier-2 adapter sources are git submodules consumed by some suites,
        # so pull them too.
        with:
          submodules: recursive

      - name: Build simcore image
        run: docker build -f core/Dockerfile -t cortexsim:ci .

      - name: Run pytest inside the image
        # The repo is mounted at /repo so the tests/ tree (which is NOT baked
        # into the runtime image) is available, while the bundled content under
        # /app is what the catalogs load. PYTHONPATH=/app/core matches the
        # Dockerfile so the flat `config`/`database`/`engine.*` imports resolve.
        # A per-run high-entropy CORTEXSIM_SECRET satisfies validate_master_key
        # even though CORTEXSIM_ENV=development downgrades the guard to a warn.
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            -e CORTEXSIM_BASE_DIR=/repo \
            -e CORTEXSIM_ENV=development \
            -e CORTEXSIM_SECRET="$(openssl rand -hex 32)" \
            -e PYTHONPATH=/repo/core \
            cortexsim:ci \
            sh -c "pip install --no-cache-dir pytest pytest-asyncio httpx && \
                   pytest tests/ -v --tb=short --ignore=tests/smoke"

  # ---------------------------------------------------------------------------
  # agent — Go beacon: build + vet + race-tested.
  # ---------------------------------------------------------------------------
  agent:
    name: agent (go build/vet/test -race)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: agent/go.sum
      - name: Build
        working-directory: agent
        run: go build ./...
      - name: Vet
        working-directory: agent
        run: go vet ./...
      - name: Test (race)
        working-directory: agent
        run: go test ./... -race -count=1 -v

  # ---------------------------------------------------------------------------
  # ui — React/Vite: install + production build + vitest unit/component suite.
  # ---------------------------------------------------------------------------
  ui:
    name: ui (build + vitest)
    runs-on: ubuntu-22.04
    env:
      # vitest runs under jsdom and never launches a real browser; skip the
      # heavy Playwright/Puppeteer browser downloads so `npm ci` doesn't fail
      # on runners without outbound access to those CDNs. The dedicated e2e
      # job in test.yml fetches chromium when it actually needs it.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PUPPETEER_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install (npm ci)
        working-directory: ui
        run: npm ci
      - name: Build
        working-directory: ui
        run: npm run build
      - name: Unit + component tests (vitest)
        working-directory: ui
        run: npx vitest run

  # ---------------------------------------------------------------------------
  # detection — TTP corpus validity + export determinism.
  # ---------------------------------------------------------------------------
  detection:
    name: detection (validate + export determinism)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install validator deps
        # validate.py needs jsonschema (Draft 2020-12); pyyaml is harmless and
        # keeps the env aligned with the loader. core/requirements pins
        # jsonschema==4.23.0 — install that exact pin so CI matches the image.
        run: |
          python -m pip install --upgrade pip
          pip install 'jsonschema>=4.18' pyyaml
      - name: Validate TTP corpus (0 fail)
        run: python3 detection_scanner/scripts/validate.py --quiet
      - name: Regenerate detection exports
        run: python3 detection_scanner/scripts/export_artifacts.py
      - name: Export-determinism gate (committed exports must match cards)
        # If this fails the committed exports drifted from the TTP cards: run
        # `python3 detection_scanner/scripts/export_artifacts.py` locally and
        # commit the result.
        run: git diff --exit-code detection_scanner/exports/

  # ---------------------------------------------------------------------------
  # adapters — tool-adapter source preflight + de-hand-rolling wiring gate.
  # ---------------------------------------------------------------------------
  adapters:
    name: adapters (source preflight + wiring)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        # Tier-2 adapter sources are git submodules; the check FAILs if any
        # declared source_path is missing on disk, so pull them.
        with:
          submodules: recursive
      - name: Adapter source existence check
        env:
          CORTEXSIM_BASE_DIR: ${{ github.workspace }}
        run: scripts/check-adapter-sources.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install lint deps
        run: pip install pyyaml
      - name: Adapter-wiring lint (de-hand-rolling gate)
        # FAILs if a scenario names a tool that HAS an adapter pack but never
        # wires it via external_tools[].adapter_ref — the case that silently
        # bypasses the safety/consent + self-install machinery. Currently green
        # at 0 candidates; this gate keeps it there.
        env:
          CORTEXSIM_BASE_DIR: ${{ github.workspace }}
        run: python3 scripts/check-adapter-wiring.py --list

  # ---------------------------------------------------------------------------
  # e2e-isolated — Tier-C isolated-execution gate.
  #
  # The pure assertion suite (deploy/tier-c/tier_c_assert.py driven by reference
  # expectation specs) is a HARD gate: it proves that when a scenario dispatches
  # step N the observed-signal contract still holds, WITHOUT needing docker.
  # It is stdlib + pyyaml only and runs in ~2s, so it runs on every push as a
  # focused Tier-C signal separate from the monolithic `backend` image build.
  #
  # The docker-gated end-to-end (build the runner + sinkhole, detonate a real
  # SIM-EDR-001 push bundle, assert the observed signals) is opt-in behind the
  # `tier-c-e2e` PR label until it is validated against live CI — see the
  # sprint-plan task "Promote Tier-C docker e2e to a default hard gate".
  # ---------------------------------------------------------------------------
  e2e-isolated:
    name: e2e (Tier-C isolated execution)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test deps
        run: pip install pytest pyyaml
      - name: Tier-C assertion suite (hard gate — no docker)
        env:
          CORTEXSIM_BASE_DIR: ${{ github.workspace }}
        run: |
          python3 -m pytest \
            tests/e2e_isolated/test_tier_c_assets.py \
            tests/e2e_isolated/test_tier_c_isolated_exec.py \
            -v --tb=short
      - name: Tier-C docker end-to-end (opt-in — label 'tier-c-e2e')
        # Only runs when the PR carries the `tier-c-e2e` label. Boots SimCore,
        # pulls a SIM-EDR-001 bundle, and detonates it through the Tier-C stack;
        # run-tier-c.sh curls the bundle from the running SimCore (--scenario).
        if: contains(toJson(github.event.pull_request.labels.*.name), 'tier-c-e2e')
        env:
          CORTEXSIM_ENV: development
        run: |
          docker build -f core/Dockerfile -t cortexsim:tierc .
          docker run -d --name simcore -p 8888:8888 \
            -e CORTEXSIM_ENV=development \
            -e CORTEXSIM_SECRET="$(openssl rand -hex 32)" \
            cortexsim:tierc
          for i in $(seq 1 30); do
            curl -sf http://localhost:8888/api/health && break || sleep 2
          done
          deploy/tier-c/run-tier-c.sh --scenario SIM-EDR-001 \
            --simcore http://localhost:8888 --results "$RUNNER_TEMP/tierc-out"
