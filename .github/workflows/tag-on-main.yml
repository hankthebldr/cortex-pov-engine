name: Tag on main

# Cut a release from a merge to main. CHANGELOG.md is the single source of
# truth: promote [Unreleased] -> [X.Y.Z] on the release PR, merge dev -> main,
# and this workflow tags vX.Y.Z and fires release.yml (image + GH Release).
#
# Idempotent: if the top CHANGELOG version already has a tag, this is a no-op,
# so ordinary main pushes (docs, pages, wiki) never re-release.

on:
  push:
    branches: [main]
    paths:
      - 'CHANGELOG.md'
      - '.github/workflows/tag-on-main.yml'
  workflow_dispatch:

permissions:
  contents: write   # create and push the tag
  actions: write    # dispatch release.yml

concurrency:
  group: tag-on-main
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the full tag list

      - name: Resolve version from CHANGELOG
        id: v
        run: |
          # First "## [X.Y.Z]" heading (the [Unreleased] heading has no digits
          # and is skipped). That is the version this main state releases as.
          VERSION=$(grep -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md \
                     | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ -z "$VERSION" ]; then
            echo "::error::No released version heading (## [X.Y.Z]) found in CHANGELOG.md"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"    >> "$GITHUB_OUTPUT"
          echo "Top CHANGELOG version: v$VERSION"

      - name: Determine whether the tag already exists
        id: exists
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null \
             || git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$TAG already exists — nothing to release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "$TAG is new — will tag and release."
          fi

      - name: Create and push the tag
        if: steps.exists.outputs.exists == 'false'
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          git config user.name  "cortexsim-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git tag -a "$TAG" -m "CortexSim $TAG"
          git push origin "$TAG"

      - name: Dispatch release.yml against the new tag
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          # A tag pushed with GITHUB_TOKEN does not itself trigger release.yml
          # (GitHub's recursion guard on push/create). workflow_dispatch is the
          # documented exception, so kick release.yml explicitly at the new tag.
          gh workflow run release.yml --ref "$TAG" -f tag="$TAG"
          echo "Dispatched release.yml for $TAG"
