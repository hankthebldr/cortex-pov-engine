# Dependabot — GitHub Actions only, for now.
#
# Purpose: the workflows reference actions by moving tags (actions/checkout@v4,
# docker/build-push-action@v5, ...). Tracking them here is the first step to
# pinning each to a full commit SHA, which needs network access to resolve and
# so was deferred from the least-privilege pass on release.yml (CI-12).
# Dependabot keeps SHA pins current once they exist.
#
# PRs target dev, not main: main only advances by a merge from dev
# (CONTRIBUTING.md), and a dependency bump is topic work like any other.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"
