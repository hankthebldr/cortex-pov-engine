{{- /* Run the production fail-fast guard before deciding whether to render. */}}
{{- include "eal-simulator.validateMasterSecret" . -}}
{{- if and (not .Values.masterSecret.existingSecret) .Values.masterSecret.value }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eal-simulator.masterSecretName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "eal-simulator.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.masterSecret.key }}: {{ .Values.masterSecret.value | quote }}
{{- end }}
