# ===========================================================================
# CortexSim Tier-C sinkhole  —  dnsmasq config
# ---------------------------------------------------------------------------
# Resolve EVERY name to this sinkhole container so no DNS query escapes the
# isolated network. The runner's /etc/resolv.conf points at this container; a
# C2 beacon or exfil step that looks up testmynids.org / *.amazonaws.com /
# any-c2-domain.example gets the sinkhole's address and connects to the local
# HTTP/HTTPS catch-all instead of egressing.
# ===========================================================================

# Do not read /etc/resolv.conf — we are authoritative for everything.
no-resolv
# Do not forward ANY query upstream. Unmatched -> handled by address= below.
no-hosts

# Wildcard A record: every name -> 0.0.0.0 placeholder is replaced at runtime
# by sinkhole-entrypoint.sh with this container's actual IP on the internal
# bridge, so the runner connects back to *this* sidecar. (entrypoint rewrites
# the SINKHOLE_IP token.)
address=/#/SINKHOLE_IP

# Listen on all interfaces of the internal bridge.
listen-address=0.0.0.0
bind-interfaces

# Log every query so DNS-tunnel / DGA-shaped steps are observable.
log-queries
log-facility=-

# Small TTL so nothing is cached across runs.
local-ttl=1
