<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="POVengine — Cortex detection POV console for Palo Alto Networks Domain Consulting" />
    <title>POVengine Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Console typography is the PANW Executive DS pair: Montserrat for display
      (the family embedded in the corporate template) plus Helvetica Neue for
      body, which is NOT freely webfont-distributable and therefore comes off
      the OS stack rather than from here — see the substitution note in
      src/styles/cortex-console.css. JetBrains Mono is this console's own
      addition for IDs, digests and CLI.

      Funnel Display / Archivo / Fraunces are gone: they were the previous
      shell's faces and are not brand families. Inter stays for the legacy
      ?theme=legacy shell only.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Legacy light shell (?theme=legacy) only. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
