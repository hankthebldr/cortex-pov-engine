    name: "Get risky hosts"
    method: POST
    path: "/public_api/v1/get_risky_hosts"
    access_class: read
    tags: [cortex-bot-observed, licence-itdr]
  - op_id: OP-GET-RISKY-USERS
    name: "Get risky users"
    method: POST
    path: "/public_api/v1/get_risky_users"
    access_class: read
    tags: [cortex-bot-observed, licence-itdr]
