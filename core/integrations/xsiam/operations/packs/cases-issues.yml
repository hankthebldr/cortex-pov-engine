# Cases and Issues — Cortex XSIAM Platform API operations
# Harvested 2026-11-02 from the field-built cortex-bot MCP server. Paths are kept
# exactly as that tool sends them (trailing slash included): the sent form is the one
# with live-tenant evidence. `cortex-bot-observed` marks that provenance; it is the
# author's observation, NOT a CortexSim tenant verification (tenant-verified is 0).
# `prefix-inferred` = cortex-bot sent a bare path and the official server's fetcher
# prepended /public_api/v1; the full path here is composed, not a literal.
# Review: docs/brainstorm/2026-11-02-cortex-bot-review-and-pov-integration.md
# Envelope: reply.DATA. Issue search filtered by id returns SPARSE records (null
# name/severity); cortex-bot refetches by issue_domain from DOM: tags.
category: "Cases and Issues"
operations:
  - op_id: OP-CASE-SEARCH
    name: "Search cases"
    method: POST
    path: "/public_api/v1/case/search/"
    access_class: read
    tags: [cortex-bot-observed, envelope-reply-DATA]
  - op_id: OP-ISSUE-SEARCH
    name: "Search issues"
    method: POST
    path: "/public_api/v1/issue/search/"
    access_class: read
    tags: [cortex-bot-observed, envelope-reply-DATA, sparse-by-id]
  - op_id: OP-ISSUE-CREATE
    name: "Create an issue"
    method: POST
    path: "/public_api/v1/issue"
    access_class: write
    tags: [cortex-bot-observed]
