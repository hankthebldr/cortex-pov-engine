adapter_id: TOOL-CHAIN-REACTOR
name: "chain-reactor"
version: "main"

tier: 4
category: adversary-simulation

upstream:
  repo: https://github.com/redcanaryco/chain-reactor
  license: "MIT"
  attribution: "Red Canary"

cortex_signal:
  planes:
    - EDR
  expected_techniques:
    - T1059
    - T1106

safety_class: dual-use-lab-only

install:
  # Tier 4 (runtime-fetched): shallow git-clone + make-build the upstream
  # release at dispatch into /tmp. Produces the chain_reactor binary in-tree.
  runtime_install_command: "test -x /tmp/chain-reactor/chain_reactor || (test -d /tmp/chain-reactor || git clone --depth 1 https://github.com/redcanaryco/chain-reactor /tmp/chain-reactor && make -C /tmp/chain-reactor)"
  binary: "/tmp/chain-reactor/chain_reactor"
  # ── Payload-shelf exemption (TA-13) ──────────────────────────────────────
  artifact_exempt:
    reason_code: SOURCE_TREE_REQUIRED
    reason: >-
      Chain Reactor publishes no prebuilt binaries at all — it is compiled
      from source with make at run time. There is nothing to stage. This tool
      needs internet access and a C toolchain on the target host.

invoke:
  target_platform: linux
  run_template: "{binary} {recipe}"
  default_args:
    recipe: "recipe.json"
  identity_required: root

cleanup:
  commands:
    - "rm -rf /tmp/cortexsim-chain-reactor-* 2>/dev/null || true"

ttp_refs: []
equivalents: []

author: Henry Reed
created: "2026-06-02"
last_updated: "2026-06-02"
tags:
  - phase-c
  - adversary-simulation
  - runtime-fetched
