adapter_id: TOOL-YARA
name: "YARA"
version: "4.5.0"

tier: 4
category: reverse-engineering

upstream:
  repo: https://github.com/VirusTotal/yara
  license: "BSD-3-Clause"
  attribution: "VirusTotal"

cortex_signal:
  planes:
    - KOI
  expected_techniques:
    - T1027

safety_class: safe

install:
  # Tier 4 (runtime-fetched): prefer the distro package; fall back to building
  # the pinned upstream release from a shallow git-clone if apt has no yara.
  runtime_install_command: "command -v yara >/dev/null 2>&1 || apt-get install -y yara || (test -d /tmp/yara || git clone --depth 1 --branch v4.5.0 https://github.com/VirusTotal/yara /tmp/yara && cd /tmp/yara && ./bootstrap.sh && ./configure && make && make install)"
  binary: "yara"

invoke:
  target_platform: linux
  run_template: "{binary} {rules} {target}"
  default_args:
    rules: "rules.yar"
    target: "/tmp/sample"
  identity_required: root

ttp_refs: []
equivalents: []

author: Henry Reed
created: "2026-06-02"
last_updated: "2026-06-02"
tags:
  - phase-c
  - reverse-engineering
  - runtime-fetched
