adapter_id: TOOL-GOBUSTER
name: gobuster
version: "3.6.0"

tier: 4
category: web-app

upstream:
  repo: https://github.com/OJ/gobuster
  license: Apache-2.0
  attribution: OJ Reeves

cortex_signal:
  planes:
    - NDR
  expected_techniques:
    - T1595.003  # Active Scanning: Wordlist Scanning
    - T1083      # File and Directory Discovery (dir mode)
    - T1087.001  # Account Discovery: Local Account (vhost / fuzz modes)
    - T1590.002  # Gather Victim Network Information: DNS (dns mode)

safety_class: dual-use-lab-only

install:
  # `go install` is the recommended path; falls back to the release
  # binary for jumpboxes that lack a Go toolchain.
  runtime_install_command: "command -v gobuster >/dev/null 2>&1 || (command -v go >/dev/null 2>&1 && go install github.com/OJ/gobuster/v3@v3.6.0) || (curl -sSL https://github.com/OJ/gobuster/releases/download/v3.6.0/gobuster_Linux_x86_64.tar.gz | tar xz -C /usr/local/bin gobuster && chmod +x /usr/local/bin/gobuster)"
  binary: gobuster
  # ── Payload-shelf exemption (TA-13) ──────────────────────────────────────
  artifact_exempt:
    reason_code: ARCHIVE_ONLY_NO_EXTRACTOR
    reason: >-
      Gobuster's maintainers publish it only as a compressed archive, and
      CortexSim can currently stage single files only — so it cannot be served
      from the shelf yet. This tool needs internet access on the target host
      until that changes.
    revisit: >-
      Blocked on CortexSim, not on upstream. Requires a single-member
      extractor (download the pinned archive on the DC's SimCore, verify the
      ARCHIVE digest, extract one named member, verify the MEMBER digest, put
      that one file on the shelf) so compose() still emits kind: file and
      neither the Go beacon nor the K8s init container learns a new word.
      Measured 2026-08-06: gobuster_Linux_x86_64.tar.gz at release tag v3.6.0
      is 3,258,506 bytes, sha256
      871be404ce5f80c96b864586b3caa90f894598d1a8222ae316c19e5f70e04cfc, and
      holds exactly 3 entries (LICENSE, README.md, gobuster); the member
      'gobuster' is a self-contained 8,081,408-byte static binary. PIN v3.6.0,
      NOT the newer v3.8.2: runtime_install_command already hard-codes the
      v3.6.0 release URL and is emitted verbatim into the byte-frozen push
      bundles, so a different artifact version would make an egress-capable
      and an air-gapped target run different binaries for the same scenario —
      and scenarios/asm/asm-004 binds detection_id
      ioc-user-agent-gobuster-3-6. Also required before this is worth wiring:
      the beacon does not prepend the stage directory to PATH, and every
      corpus step invokes 'gobuster' by bare name, so staging alone yields
      'command not found'.

invoke:
  target_platform: linux
  # gobuster is mode-driven (`dir`, `dns`, `vhost`, `fuzz`, `s3`, `gcs`).
  # The adapter exposes {mode} as the first positional so a scenario can
  # pivot the same adapter across surfaces. Default is web-dir against
  # a lab target with the SecLists "common.txt" wordlist (provided by
  # the content-library IaC module).
  run_template: "{binary} {mode} -u {target_url} -w {wordlist} -o {output_path} -q"
  default_args:
    mode: "dir"
    target_url: "http://127.0.0.1:8080"
    wordlist: "/opt/seclists/Discovery/Web-Content/common.txt"
    output_path: "/tmp/gobuster-cortexsim.txt"
  identity_required: nobody

cleanup:
  commands:
    - "rm -f /tmp/gobuster-cortexsim.txt"

ttp_refs: []

equivalents:
  - TOOL-FEROXBUSTER

author: Henry Reed
created: "2026-05-21"
last_updated: "2026-05-21"
tags:
  - web-recon
  - dir-bruteforce
  - dns-bruteforce
  - vhost
  - seclists
