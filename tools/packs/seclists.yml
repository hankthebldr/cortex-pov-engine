adapter_id: TOOL-SECLISTS
name: "SecLists"
version: "master"

tier: 4
category: web-app

upstream:
  repo: https://github.com/danielmiessler/SecLists
  license: "MIT"
  attribution: "Daniel Miessler"

cortex_signal:
  planes:
    - NDR
  expected_techniques:
    - T1110

safety_class: safe

install:
  # Tier 4 (runtime-fetched): shallow git-clone the data corpus at dispatch
  # into /tmp. SecLists is wordlist data only — no build step.
  runtime_install_command: "test -d /tmp/SecLists || git clone --depth 1 https://github.com/danielmiessler/SecLists /tmp/SecLists"
  binary: "ls"
  # ── Payload-shelf exemption (TA-13) ──────────────────────────────────────
  artifact_exempt:
    reason_code: SOURCE_TREE_REQUIRED
    reason: >-
      SecLists is a 3.3 GB collection of wordlists, not a program — the shelf
      stages one file at a time, and no single file is 'SecLists'. It is
      cloned onto the target host, or supplied by the content-library IaC
      module, so the target needs internet access unless that module is
      deployed.

invoke:
  target_platform: linux
  run_template: "{binary} {wordlist_dir}"
  default_args:
    wordlist_dir: "/tmp/SecLists/Passwords"
  identity_required: root

ttp_refs: []
equivalents: []

author: Henry Reed
created: "2026-06-02"
last_updated: "2026-06-02"
tags:
  - phase-c
  - web-app
  - runtime-fetched
