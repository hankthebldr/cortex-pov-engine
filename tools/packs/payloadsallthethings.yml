adapter_id: TOOL-PAYLOADSALLTHETHINGS
name: "PayloadsAllTheThings"
version: "master"

tier: 4
category: web-app

upstream:
  repo: https://github.com/swisskyrepo/PayloadsAllTheThings
  license: "MIT"
  attribution: "Swissky"

cortex_signal:
  planes:
    - BROWSER
  expected_techniques:
    - T1059

safety_class: safe

install:
  # Tier 4 (runtime-fetched): shallow git-clone the payload corpus at dispatch
  # into /tmp. Payload data only — no build step.
  runtime_install_command: "test -d /tmp/PayloadsAllTheThings || git clone --depth 1 https://github.com/swisskyrepo/PayloadsAllTheThings /tmp/PayloadsAllTheThings"
  binary: "ls"
  # ── Payload-shelf exemption (TA-13) ──────────────────────────────────────
  artifact_exempt:
    reason_code: SOURCE_TREE_REQUIRED
    reason: >-
      PayloadsAllTheThings is a directory of payload and wordlist files, not a
      program. There is no single file to stage. It is cloned onto the target
      host, so the target needs internet access.

invoke:
  target_platform: linux
  run_template: "{binary} {payload_dir}"
  default_args:
    payload_dir: "/tmp/PayloadsAllTheThings"
  identity_required: root

ttp_refs: []
equivalents: []

author: Henry Reed
created: "2026-06-02"
last_updated: "2026-06-02"
tags:
  - phase-c
  - web-app
  - runtime-fetched
