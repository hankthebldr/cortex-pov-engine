adapter_id: TOOL-SCYTHE-COMPOUND-ACTIONS
name: "SCYTHE compound-actions"
version: "main"

tier: 4
category: adversary-simulation

upstream:
  repo: https://github.com/scythe-io/community-threats
  license: "LicenseRef-Community"
  attribution: "SCYTHE"

cortex_signal:
  planes:
    - EDR
  expected_techniques:
    - T1059

safety_class: dual-use-lab-only

install:
  # Tier 4 (runtime-fetched): shallow git-clone the community-threats corpus
  # at dispatch into /tmp. Plan data + python runner; no build step.
  runtime_install_command: "test -d /tmp/scythe-community-threats || git clone --depth 1 https://github.com/scythe-io/community-threats /tmp/scythe-community-threats"
  binary: "python3"
  # ── Payload-shelf exemption (TA-13) ──────────────────────────────────────
  artifact_exempt:
    reason_code: SOURCE_TREE_REQUIRED
    reason: >-
      This is a directory of adversary-emulation plan files, not a program, so
      there is no single file to stage and it is cloned onto the target host.
      Note also that its upstream repository no longer resolves (verified
      2026-08-06), so the clone fails on the target host whether or not you
      have egress — treat this adapter as unavailable until it is repointed,
      and do not plan a POV step around it.

invoke:
  target_platform: linux
  run_template: "{binary} {runner} {plan}"
  default_args:
    runner: "/tmp/scythe-community-threats/run.py"
    plan: "plan.json"
  identity_required: root

cleanup:
  commands:
    - "rm -rf /tmp/cortexsim-scythe-compound-actions-* 2>/dev/null || true"

ttp_refs: []
equivalents: []

author: Henry Reed
created: "2026-06-02"
last_updated: "2026-06-02"
tags:
  - phase-c
  - adversary-simulation
  - runtime-fetched
