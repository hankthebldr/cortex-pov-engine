adapter_id: TOOL-SCOUTSUITE
name: "Scout Suite"
version: "5.13"

tier: 4
category: cloud-container

upstream:
  repo: https://github.com/nccgroup/ScoutSuite
  license: "GPL-2.0"
  attribution: "NCC Group"

cortex_signal:
  planes:
    - CDR
  expected_techniques:
    - T1526

safety_class: safe

install:
  runtime_install_command: "command -v scout >/dev/null 2>&1 || pip install scoutsuite"
  binary: "scout"
  # ── Payload-shelf exemption (TA-13) ──────────────────────────────────────
  artifact_exempt:
    reason_code: LANGUAGE_PACKAGE_MANAGER
    reason: >-
      ScoutSuite installs from the Python (pip) package index along with its
      dependency tree. The shelf stages one file, and there is no single file
      that runs. Staging it would mean hosting a package mirror, so this tool
      needs internet access on the target host.

invoke:
  target_platform: linux
  run_template: "{binary} {provider}"
  default_args:
    provider: "aws"
  identity_required: root

ttp_refs: []
equivalents: []

author: Henry Reed
created: "2026-06-02"
last_updated: "2026-06-02"
tags:
  - phase-c
  - cloud-container
