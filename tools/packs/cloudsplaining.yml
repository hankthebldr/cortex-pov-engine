adapter_id: TOOL-CLOUDSPLAINING
name: "Cloudsplaining"
version: "0.7"

tier: 4
category: cloud-container

upstream:
  repo: https://github.com/salesforce/cloudsplaining
  license: "Apache-2.0"
  attribution: "Salesforce"

cortex_signal:
  planes:
    - CDR
  expected_techniques:
    - T1078

safety_class: safe

install:
  runtime_install_command: "command -v cloudsplaining >/dev/null 2>&1 || pip install cloudsplaining"
  binary: "cloudsplaining"
  # ── Payload-shelf exemption (TA-13) ──────────────────────────────────────
  artifact_exempt:
    reason_code: LANGUAGE_PACKAGE_MANAGER
    reason: >-
      Cloudsplaining installs from the Python (pip) package index along with
      its dependency tree. The shelf stages one file, and there is no single
      file that runs. Staging it would mean hosting a package mirror, so this
      tool needs internet access on the target host.

invoke:
  target_platform: linux
  run_template: "{binary} scan --input-file {file}"
  default_args:
    file: "account.json"
  identity_required: root

ttp_refs: []
equivalents: []

author: Henry Reed
created: "2026-06-02"
last_updated: "2026-06-02"
tags:
  - phase-c
  - cloud-container
