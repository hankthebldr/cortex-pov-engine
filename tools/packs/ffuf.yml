adapter_id: TOOL-FFUF
name: "ffuf"
version: "2.1.0"

tier: 4
category: web-app

upstream:
  repo: https://github.com/ffuf/ffuf
  license: "MIT"
  attribution: "Joona Hoikkala (@joohoi)"

cortex_signal:
  planes:
    - NDR
  expected_techniques:
    - T1595  # Active Scanning
    - T1190  # Exploit Public-Facing Application

safety_class: dual-use-lab-only

install:
  runtime_install_command: "command -v ffuf >/dev/null 2>&1 || (apt-get install -y ffuf 2>/dev/null || go install github.com/ffuf/ffuf/v2@latest)"
  binary: "ffuf"
  # ── Payload-shelf exemption (TA-13) ──────────────────────────────────────
  artifact_exempt:
    reason_code: ARCHIVE_ONLY_NO_EXTRACTOR
    reason: >-
      ffuf's maintainers publish it only as a compressed archive, and
      CortexSim can currently stage single files only — so it cannot be served
      from the shelf yet. This tool needs internet access on the target host
      until that changes.
    revisit: >-
      Blocked on CortexSim, not on upstream. Requires a single-member
      extractor (download the pinned archive on the DC's SimCore, verify the
      ARCHIVE digest, extract one named member, verify the MEMBER digest, put
      that one file on the shelf) so compose() still emits kind: file and
      neither the Go beacon nor the K8s init container learns a new word.
      Measured 2026-08-06: ffuf_2.1.0_linux_amd64.tar.gz at release tag v2.1.0
      (the version this pack declares) is 3,478,614 bytes, sha256
      fc2c82736c14dcbea4daf3d3cf3878c1c4773008ba45c2bc0fceba7d17b40bb5, and
      holds 4 entries (CHANGELOG.md, LICENSE, README.md, ffuf); the member
      'ffuf' is a self-contained 8,151,040-byte static binary. Upstream is on
      v2.2.1 — bumping the pack version is a separate deliberate change, not a
      side effect of shelving. Also blocked on the beacon PATH gap: every
      corpus step invokes 'ffuf' by bare name.

invoke:
  target_platform: linux
  run_template: "{binary} -u {url} -w {wordlist} -mc {match_codes}"
  default_args:
    url: "http://127.0.0.1/FUZZ"
    wordlist: "/usr/share/seclists/Discovery/Web-Content/common.txt"
    match_codes: "200,204,301,302,307,401,403"
  identity_required: root

cleanup:
  commands:
    - "rm -f /tmp/cortexsim-ffuf-*.json 2>/dev/null || true"

ttp_refs: []
equivalents:
  - TOOL-FEROXBUSTER
  - TOOL-GOBUSTER

author: Henry Reed
created: "2026-07-24"
last_updated: "2026-07-24"
tags:
  - web-app
  - fuzzer
  - content-discovery
