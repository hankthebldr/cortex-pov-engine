adapter_id: TOOL-CREDKING
name: "CredKing"
version: "1.0"

tier: 4
category: identity-credential

upstream:
  repo: https://github.com/ustayready/CredKing
  # Verified 2026-08-06: this project publishes NO licence — there is no LICENSE
  # file in the repository root and the GitHub API reports none. The previous
  # value here, "LicenseRef-ustayready", named a grant that does not exist, and
  # this string travels into MANIFEST.json and a POV report a customer's legal
  # team may read. LicenseRef-NONE says the true thing: no permission has been
  # granted. That is also why install.artifact_exempt below is
  # LICENCE_NO_REDISTRIBUTION and not one of the mechanical reasons — the shelf
  # REDISTRIBUTES bytes onto a host the DC does not own.
  license: "LicenseRef-NONE"
  attribution: "ustayready"

cortex_signal:
  planes:
    - ITDR
  expected_techniques:
    - T1110.003

safety_class: dual-use-lab-only

install:
  runtime_install_command: "test -d /tmp/CredKing || git clone --depth 1 https://github.com/ustayready/CredKing /tmp/CredKing"
  binary: "python3 /tmp/CredKing/credking.py"
  # ── Payload-shelf exemption (TA-13) ──────────────────────────────────────
  artifact_exempt:
    reason_code: LICENCE_NO_REDISTRIBUTION
    reason: >-
      CredKing publishes no licence at all (verified 2026-08-06: no LICENSE
      file, and GitHub reports none), so CortexSim has no right to
      redistribute its code onto a host you do not own. The shelf does not
      cache a tool, it serves the bytes onto a customer endpoint and records
      them in a manifest a customer's legal team may read. This tool is
      fetched on the target host from its own repository, which needs internet
      access.

invoke:
  target_platform: linux
  run_template: "{binary} --target {target} --userfile {users} --password {password}"
  default_args:
    target: "https://login.lab.local"
    users: "users.txt"
    password: "Spring2026!"
  identity_required: root

cleanup:
  commands:
    - "rm -rf /tmp/cortexsim-credking-* 2>/dev/null || true"

ttp_refs: []
equivalents: []

author: Henry Reed
created: "2026-06-02"
last_updated: "2026-06-02"
tags:
  - phase-c
  - identity-credential
