adapter_id: TOOL-AMASS
name: "OWASP Amass"
version: "4.2.0"

tier: 4
category: network-scan

upstream:
  repo: https://github.com/owasp-amass/amass
  license: "Apache-2.0"
  attribution: "OWASP Amass Project (Jeff Foley)"

cortex_signal:
  # ASM (attack-surface management) is not a distinct signal plane in the
  # loader enum; subdomain/attack-surface mapping telemetry lands on NDR,
  # matching the other ASM-family enumerators (gobuster, feroxbuster).
  planes:
    - NDR
  expected_techniques:
    - T1590      # Gather Victim Network Information
    - T1590.005  # Gather Victim Network Information: IP Addresses

safety_class: safe

install:
  # Tier 4 (runtime-fetched): apt on Kali, `go install` fallback.
  runtime_install_command: "command -v amass >/dev/null 2>&1 || (apt-get install -y amass 2>/dev/null || go install -v github.com/owasp-amass/amass/v4/...@master)"
  binary: amass

invoke:
  target_platform: linux
  run_template: "{binary} enum -d {domain} {flags}"
  default_args:
    domain: "lab.local"
    flags: "-passive -timeout 5"
  identity_required: nobody

cleanup:
  commands:
    - "rm -rf /tmp/cortexsim-amass-* 2>/dev/null || true"
    - "rm -rf ${HOME}/.config/amass/cortexsim-* 2>/dev/null || true"

ttp_refs: []
equivalents:
  - TOOL-DNSRECON  # DNS/subdomain reconnaissance equivalent

author: Henry Reed
created: "2026-07-24"
last_updated: "2026-07-24"
tags:
  - network-scan
  - attack-surface-mapping
  - subdomain-enumeration
  - runtime-fetched
