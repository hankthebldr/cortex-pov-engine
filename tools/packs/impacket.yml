adapter_id: TOOL-IMPACKET
name: "Impacket"
version: "0.12.0"

tier: 4
category: identity-credential

upstream:
  repo: https://github.com/fortra/impacket
  license: "Apache-1.1"
  attribution: "Fortra (SecureAuth)"

cortex_signal:
  planes:
    - ITDR
  expected_techniques:
    - T1021
    - T1003.006

safety_class: dual-use-lab-only

install:
  # Tier 4 (runtime-fetched): pip-install the upstream release at dispatch.
  # impacket ships console scripts (secretsdump.py, GetUserSPNs.py, …) on PATH.
  runtime_install_command: "command -v secretsdump.py >/dev/null 2>&1 || pip3 install --no-input impacket==0.12.0"
  binary: secretsdump.py
  # ── Payload-shelf exemption (TA-13) ──────────────────────────────────────
  artifact_exempt:
    reason_code: LANGUAGE_PACKAGE_MANAGER
    reason: >-
      Impacket installs from the Python (pip) package index along with its
      dependency tree. The shelf stages one file, and there is no single file
      that runs. Staging it would mean hosting a package mirror, so this tool
      needs internet access on the target host.

invoke:
  target_platform: linux
  run_template: "{tool} {args}"
  default_args:
    tool: "secretsdump.py"
    args: "-just-dc DOMAIN/USER@DC"
  identity_required: root

cleanup:
  commands:
    - "rm -rf /tmp/cortexsim-impacket-* 2>/dev/null || true"

ttp_refs: []
equivalents: []

author: Henry Reed
created: "2026-06-02"
last_updated: "2026-06-02"
tags:
  - phase-c
  - identity-credential
  - runtime-fetched
