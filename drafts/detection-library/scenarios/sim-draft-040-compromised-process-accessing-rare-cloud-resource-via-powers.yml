- id: step-02
  name: Execute Malware File
  command: '$proc = Start-Process -FilePath ''C:\\temp\\malware.exe'' -PassThru;

    $proc | Get-Process;'
  identity: direct
  mitre_technique: T1059.001
  platforms:
  - windows
  expected_detections:
