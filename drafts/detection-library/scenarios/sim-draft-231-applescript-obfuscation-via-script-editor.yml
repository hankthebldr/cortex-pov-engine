    detection_id: bioc-uncommon-applescript-with-obfuscation
- id: step-02
  name: Execute AppleScript
  command: $process = New-Object System.Diagnostics.ProcessStartInfo; $process.FileName = 'C:\\Program
    Files\\Common Files\\Apple\\AppleScript\\osascript.exe'; $process.Arguments = 'C:\\temp\\script.scpt';
