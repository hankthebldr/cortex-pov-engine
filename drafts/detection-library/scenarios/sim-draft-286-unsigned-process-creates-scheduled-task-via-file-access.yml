steps:
- id: step-01
  name: Create Tasks Directory
  command: powershell -Command "New-Item -ItemType Directory -Path C:\Windows\Tasks\ -Force"
  identity: direct
  mitre_technique: T1059.001
  platforms:
  - windows
  expected_detections:
  - plane: EDR
    type: BIOC
    description: Unsigned Process Creates Scheduled Task
    ttp_ref: TTP-0000-0286
    detection_id: bioc-unsigned-process-creates-scheduled-task
- id: step-02
  name: Write Malicious Task XML
  command: '$taskContent = ''<Task><Settings><DisallowStartIfOnBatteries>false</DisallowStartIfOnBatteries></Settings></Task>''

    Set-Content -Path C:\Windows\Tasks\malicious_task.xml -Value $taskContent'
  identity: direct
  mitre_technique: T1059.001
  platforms:
  - windows
  expected_detections:
  - plane: EDR
    type: BIOC
    description: Unsigned Process Creates Scheduled Task
    ttp_ref: TTP-0000-0286
    detection_id: bioc-unsigned-process-creates-scheduled-task
  causality:
    parent_step: step-01
    pivot: process_lineage
- id: step-03
  name: Register Scheduled Task
  command: '$command = ''C:\Windows\System32\schtasks.exe /create /xml C:\Windows\Tasks\malicious_task.xml
    /tn "MaliciousTask"''

    Invoke-Expression $command'
  identity: direct
  mitre_technique: T1053.005
  platforms:
  - windows
  expected_detections:
  - plane: EDR
    type: BIOC
    description: Unsigned Process Creates Scheduled Task
    ttp_ref: TTP-0000-0286
    detection_id: bioc-unsigned-process-creates-scheduled-task
  causality:
    parent_step: step-02
    pivot: process_lineage
- id: step-04
  name: Verify Task Creation
  command: schtasks.exe /query /tn "MaliciousTask"
  identity: direct
  mitre_technique: T1053.005
  platforms:
  - windows
  expected_detections:
  - plane: EDR
    type: BIOC
    description: Unsigned Process Creates Scheduled Task
    ttp_ref: TTP-0000-0286
    detection_id: bioc-unsigned-process-creates-scheduled-task
