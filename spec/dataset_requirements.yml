# Dataset requirement registry (loaded by core/engine/dataset_requirements.py).
#
# One entry per dataset a TTP card reads: detections.xql_queries[].dataset, or a
# `dataset =` / `preset =` anchor in a biocs[] / abiocs[] / correlation_rules[] logic.
# For each: the product that emits the records, what must exist on the Cortex
# side, what the source product must be configured to emit, and which EAL
# plugins can stand in for the source in a lab.
#
# Every cortex_side name is null until someone reads the exact name in a
# tenant. Do not write a marketplace pack or data-source name from memory.
# Every verified block is empty: nothing here has been confirmed in a tenant.
# A verified row needs all three of by/on/how. Quote the "on" key: bare, YAML
# reads it as the boolean true. Quote the date too ("on": "2026-11-12"), or
# YAML reads it as a date; the loader rejects both.
# doors: names the ingestion door(s) (core/engine/ingestion_doors.py) the dataset arrives through;
# doors_unknown: a reason, when no real tenant counterpart is known. Exactly one per row.
# emulated_by lists a plugin only when its code or Meta names that dataset as
# the one it posts to.

