scenario_id: SIM-ITDR-004
name: "ITDR — Session Token Replay Across Geo / User-Agent"
version: "1.0"
status: active

plane: ITDR
detection_types:
  - BIOC
  - XQL

uc_ref: UCS-ITDR-04
tc_ref: TC-ITDR-04
uc_name: "Stolen Session-Token Detection"
tc_name: "Same Session Token Used From Two Distinct Geos / Browsers Within 5 min"

mitre_tactic: "TA0006"
mitre_tactic_name: "Credential Access"
mitre_technique: "T1539"
mitre_technique_name: "Steal Web Session Cookie"
additional_techniques:
  - technique: "T1550.004"
    name: "Use Alternate Authentication Material: Web Session Cookie"
  - technique: "T1078.004"
    name: "Valid Accounts: Cloud Accounts"

threat_report: "Mandiant - APT29 OAuth Token Theft via AiTM"
threat_report_url: "https://cloud.google.com/blog/topics/threat-intelligence/"

execution_identity:
  default: container-runtime
  options:
    - container-runtime
    - root

push_supported: true
pull_supported: true

infra_modules_needed:
  - base
  - itdr

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
# Rolled out per the S-07 per-plane convention
# (docs/uc_tc_mapping/scenario-methodology-defaults.md). Defaults are not
# fabricated KPIs — they map this plane to the methodology family its
# detection shape already belongs to in the v2.0 master methodology.
validation_methodology: "Identity Signal Injection & Detection Accuracy"
methodology_family: "F1"
primary_kpi: "Detection Accuracy"
threshold:
  kpi: "Detection Accuracy"
  op: "≥"
  value: 90
  unit: "%"
success_criteria: |
  The synthetic IdP audit-log signals emitted by this scenario produce the
  expected Cortex ITDR detection. Detection Accuracy is the share of
  injected identity events that raise the expected alert (target ≥ 90%).
moat_tier: "LEAD"

# ── Causality contract: connected CGO→process spine + identity-entity reuse ──
# The idp_signin_emulator runs as the container entrypoint (python3) that OWNS
# the emission chain — the CGO root, NOT the synthetic beacon. Step-01 (the
# capability probe) links from the CGO; step-02 (issue+replay one token)
# descends from it as the emulator process spine; step-03 (3x replay, grouped
# by identity) re-uses the SAME target identity/session, so it stitches to
# step-02 via a shared_entity pivot — the same key the XSIAM grouping stitches.
cgo_anchor:
  image_name: "python3"
  primary_username: "container-runtime"

external_tools:
  - name: cortexsim-eal-cli
    source: "https://github.com/hankthebldr/cortex-pov-engine"
    type: script
    install_inline: false

steps:
  - id: step-01
    name: "Pre-flight: confirm token_replay pattern is supported"
    command: |
      python3 -m scripts.eal_simulator.cli describe idp_signin_emulator \
        | jq -e '.eal_targets'
    identity: container-runtime
    mitre_technique: "T1539"
    expected_detections:
      - plane: ITDR
        type: BIOC
        description: "Pre-flight: idp_signin_emulator metadata visible to operator"
        ttp_ref: "TTP-2026-0040"
        detection_id: bioc-itdr-004-pre-flight-idp-signin-emulator-metadata-visible
    platforms: ["linux", "container"]

  - id: step-02
    name: "Issue token from US-West Chrome, replay from EU-Central curl"
    command: |
      : "${COLLECTOR_URL:=https://collector.cortexsim-canary.invalid/idp/events}"
      : "${COLLECTOR_HOST:=collector.cortexsim-canary.invalid}"
      cat > /tmp/itdr-004.yml <<YML
      campaign_id: CMP-ITDR-004
      name: "ITDR — Okta token replay"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - "$COLLECTOR_HOST"
      dry_run: false
      tags: [itdr, okta, token-replay]
      steps:
        - step_id: step-01
          plugin: idp_signin_emulator
          params:
            collector_url: "$COLLECTOR_URL"
            provider: okta
            event_pattern: token_replay
            target_user: "ada.lovelace@cortexsim-canary.invalid"
            iterations: 1
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/itdr-004.yml --live
    identity: container-runtime
    mitre_technique: "T1539"
    expected_detections:
      - plane: ITDR
        type: XQL
        description: "ITDR — same session_token_id observed from two geos and two user-agents within 5 min"
        ttp_ref: "TTP-2026-0040"
        detection_id: xql-itdr-004-session-token-reused-across-geo-and-user-agent
      - plane: ITDR
        type: BIOC
        description: "ITDR — replay_marker boolean fires explicit detection rule"
        ttp_ref: "TTP-2026-0040"
        detection_id: bioc-itdr-004-replay-marker-boolean-explicit-match
    causality:
      parent_step: step-01
      pivot: process_lineage
    platforms: ["linux", "container", "windows"]
    platform_variants:
      windows: |
        $env:COLLECTOR_URL = 'https://collector.cortexsim-canary.invalid/idp/events'
        @'
        campaign_id: CMP-ITDR-004
        name: "ITDR — Okta token replay"
        authorized_by: "domain-consultant@paloaltonetworks.com"
        simulation_authorized: true
        target_allowlist:
          - "collector.cortexsim-canary.invalid"
        dry_run: false
        steps:
          - step_id: step-01
            plugin: idp_signin_emulator
            params:
              collector_url: "https://collector.cortexsim-canary.invalid/idp/events"
              provider: okta
              event_pattern: token_replay
              target_user: "ada.lovelace@cortexsim-canary.invalid"
              iterations: 1
        '@ | Set-Content -Encoding utf8 $env:TEMP\itdr-004.yml
        python -m scripts.eal_simulator.cli run $env:TEMP\itdr-004.yml --live

  - id: step-03
    name: "Replay 3 iterations to confirm rule deterministically fires"
    command: |
      : "${COLLECTOR_URL:=https://collector.cortexsim-canary.invalid/idp/events}"
      : "${COLLECTOR_HOST:=collector.cortexsim-canary.invalid}"
      cat > /tmp/itdr-004-rep.yml <<YML
      campaign_id: CMP-ITDR-004
      name: "ITDR — Okta token replay repeat"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - "$COLLECTOR_HOST"
      dry_run: false
      steps:
        - step_id: step-01
          plugin: idp_signin_emulator
          params:
            collector_url: "$COLLECTOR_URL"
            provider: okta
            event_pattern: token_replay
            target_user: "ada.lovelace@cortexsim-canary.invalid"
            iterations: 3
            sleep_seconds: 10
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/itdr-004-rep.yml --live
    identity: container-runtime
    mitre_technique: "T1550.004"
    expected_detections:
      - plane: ITDR
        type: XQL
        description: "ITDR — three independent token-replay alerts within 5 min stitch into one incident"
        ttp_ref: "TTP-2026-0040"
        detection_id: xql-itdr-004-three-token-replay-alerts-stitch-into-one-incident
      - plane: ANALYTICS
        type: XQL
        description: "XSIAM stitching — token-replay incidents grouped under same identity"
        ttp_ref: "TTP-2026-0040"
        detection_id: xql-itdr-004-xsiam-token-replay-incidents-grouped-by-identity
    causality:
      parent_step: step-02
      pivot: shared_entity
    platforms: ["linux", "container"]

cleanup:
  commands:
    - "rm -f /tmp/itdr-004.yml /tmp/itdr-004-rep.yml"

author: "Henry Reed"
created: "2026-05-15"
last_updated: "2026-05-15"
tags:
  - itdr
  - okta
  - token-replay
  - aitm
  - eal-plugin
