scenario_id: SIM-ITDR-002
name: "ITDR — MFA Fatigue / Push-Bombing (Okta)"
version: "1.0"
status: active

plane: ITDR
detection_types:
  - BIOC
  - XQL

uc_ref: UCS-ITDR-01
tc_ref: TC-ITDR-01
tc_refs:
  - TC-ITDR-01
  - TC-ITDR-05
pov_scenario_id: POV-SC-011
uc_name: "Identity Threat Detection & Response"
tc_name: "Validate identity analytics detect living-off-the-land credential abuse alerts"

mitre_tactic: "TA0006"
mitre_tactic_name: "Credential Access"
mitre_technique: "T1621"
mitre_technique_name: "Multi-Factor Authentication Request Generation"
additional_techniques:
  - technique: "T1556.006"
    name: "Modify Authentication Process: Multi-Factor Authentication"

threat_report: "CISA AA22-074A - Russian SVR Targeting MFA"
threat_report_url: "https://www.cisa.gov/news-events/cybersecurity-advisories/"

execution_identity:
  default: container-runtime
  options:
    - container-runtime
    - root

push_supported: true
pull_supported: true

infra_modules_needed:
  - base
  - itdr

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
# Rolled out per the S-07 per-plane convention
# (docs/uc_tc_mapping/scenario-methodology-defaults.md). Defaults are not
# fabricated KPIs — they map this plane to the methodology family its
# detection shape already belongs to in the v2.0 master methodology.
validation_methodology: "Identity Signal Injection & Detection Accuracy"
methodology_family: "F1"
primary_kpi: "Detection Accuracy"
threshold:
  kpi: "Detection Accuracy"
  op: "≥"
  value: 90
  unit: "%"
success_criteria: |
  The synthetic IdP audit-log signals emitted by this scenario produce the
  expected Cortex ITDR detection. Detection Accuracy is the share of
  injected identity events that raise the expected alert (target ≥ 90%).
moat_tier: "LEAD"

# ── Causality contract: connected CGO→process spine + identity-entity reuse ──
# The idp_signin_emulator runs as the container entrypoint (python3) that OWNS
# the emission chain — the CGO root, NOT the synthetic beacon. Step-01 (the
# capability probe) links from the CGO; step-02 (first burst) descends from it
# as the emulator process spine; step-03 (escalation burst) re-attacks the SAME
# target identity, so it stitches to step-02 via a shared_entity pivot.
cgo_anchor:
  image_name: "python3"
  primary_username: "container-runtime"

external_tools:
  - name: cortexsim-eal-cli
    source: "https://github.com/hankthebldr/cortex-pov-engine"
    type: script
    install_inline: false

steps:
  - id: step-01
    name: "Pre-flight: confirm mfa_fatigue pattern is supported"
    command: |
      python3 -m scripts.eal_simulator.cli describe idp_signin_emulator \
        | jq -e '.params_schema.properties.event_pattern.description | test("mfa_fatigue")'
    identity: container-runtime
    mitre_technique: "T1621"
    expected_detections:
      - plane: ITDR
        type: BIOC
        description: "Pre-flight: mfa_fatigue advertised in plugin metadata"
        ttp_ref: "TTP-2026-0038"
        detection_id: bioc-itdr-002-pre-flight-mfa-fatigue-pattern-advertised
    platforms: ["linux", "container"]

  - id: step-02
    name: "Burst of 8 push attempts ending in approval — Okta shape"
    command: |
      C=$(mktemp -d /tmp/cortexsim.XXXXXX) || exit 1; trap 'rm -rf "$C"' EXIT
      : "${COLLECTOR_URL:=https://collector.cortexsim-canary.invalid/idp/events}"
      : "${COLLECTOR_HOST:=collector.cortexsim-canary.invalid}"
      cat > "$C/itdr-002.yml" <<YML
      campaign_id: CMP-ITDR-002
      name: "ITDR — Okta MFA fatigue"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - "$COLLECTOR_HOST"
      dry_run: false
      tags: [itdr, okta, mfa-fatigue]
      steps:
        - step_id: step-01
          plugin: idp_signin_emulator
          params:
            collector_url: "$COLLECTOR_URL"
            provider: okta
            event_pattern: mfa_fatigue
            target_user: "alice.singh@cortexsim-canary.invalid"
            iterations: 1
            burst_count: 8
      YML
      python3 -m scripts.eal_simulator.cli run "$C/itdr-002.yml" --live
    identity: container-runtime
    mitre_technique: "T1621"
    expected_detections:
      - plane: ITDR
        type: XQL
        description: "ITDR — MFA-fatigue alert: 7 push denials followed by 1 approval within burst window"
        ttp_ref: "TTP-2026-0038"
        detection_id: xql-itdr-002-mfa-fatigue-push-burst-then-approval
      - plane: ITDR
        type: BIOC
        description: "ITDR — fatigue_marker boolean fires explicit pattern detection"
        ttp_ref: "TTP-2026-0038"
        detection_id: bioc-itdr-002-mfa-fatigue-marker-boolean-explicit-match
    causality:
      parent_step: step-01
      pivot: process_lineage
    platforms: ["linux", "container", "windows"]
    platform_variants:
      windows: |
        $sandbox = Join-Path $env:TEMP 'cortexsim-itdr-002'
        # Windows form of the R2a rule. Whatever is at the path goes (rmdir removes a junction,
        # not its target), then the folder is made WITH its ACL in one call, so no other account
        # can open it in between: SYSTEM, Administrators, this account and a marker ACE no other
        # folder carries. The Get-Acl below refuses anything that was there first; a later step
        # tells this folder from a planted one with the same Get-Acl.
        if (Test-Path -LiteralPath $sandbox) { cmd.exe /c rmdir /s /q "$sandbox" }
        $me = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
        $sd = New-Object System.Security.AccessControl.DirectorySecurity
        $sd.SetSecurityDescriptorSddlForm("D:P(A;OICI;FA;;;SY)(A;OICI;FA;;;BA)(A;OICI;FA;;;$me)(A;;0x1;;;S-1-9-4243-2002)", [System.Security.AccessControl.AccessControlSections]::Access)
        $null = [System.IO.Directory]::CreateDirectory($sandbox, $sd)
        $acl = Get-Acl -LiteralPath $sandbox -ErrorAction SilentlyContinue
        $ids = if ($acl) { @($acl.GetAccessRules($true, $true, [System.Security.Principal.SecurityIdentifier]) | ForEach-Object { $_.IdentityReference.Value }) } else { @() }
        if (-not ($acl -and $acl.AreAccessRulesProtected -and (@('S-1-5-18', 'S-1-5-32-544', $me) -contains $acl.GetOwner([System.Security.Principal.SecurityIdentifier]).Value) -and ($ids -contains 'S-1-9-4243-2002') -and -not ($ids | Where-Object { $_ -notin 'S-1-5-18', 'S-1-5-32-544', $me, 'S-1-9-4243-2002' }))) { Write-Error "sandbox $sandbox could not be created fresh: something else is at that path"; exit 1 }
        if (Get-ChildItem -LiteralPath $sandbox -Force) { Write-Error "sandbox $sandbox is not empty: something else is at that path"; exit 1 }
        $env:COLLECTOR_URL = 'https://collector.cortexsim-canary.invalid/idp/events'
        @'
        campaign_id: CMP-ITDR-002
        name: "ITDR — Okta MFA fatigue"
        authorized_by: "domain-consultant@paloaltonetworks.com"
        simulation_authorized: true
        target_allowlist:
          - "collector.cortexsim-canary.invalid"
        dry_run: false
        steps:
          - step_id: step-01
            plugin: idp_signin_emulator
            params:
              collector_url: "https://collector.cortexsim-canary.invalid/idp/events"
              provider: okta
              event_pattern: mfa_fatigue
              target_user: "alice.singh@cortexsim-canary.invalid"
              iterations: 1
              burst_count: 8
        '@ | Set-Content -Encoding utf8 $sandbox\itdr-002.yml
        python -m scripts.eal_simulator.cli run $sandbox\itdr-002.yml --live

  - id: step-03
    name: "Heavier burst (16 attempts) to confirm threshold sensitivity"
    command: |
      C=$(mktemp -d /tmp/cortexsim.XXXXXX) || exit 1; trap 'rm -rf "$C"' EXIT
      : "${COLLECTOR_URL:=https://collector.cortexsim-canary.invalid/idp/events}"
      : "${COLLECTOR_HOST:=collector.cortexsim-canary.invalid}"
      cat > "$C/itdr-002-heavy.yml" <<YML
      campaign_id: CMP-ITDR-002
      name: "ITDR — Okta MFA fatigue heavy"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - "$COLLECTOR_HOST"
      dry_run: false
      steps:
        - step_id: step-01
          plugin: idp_signin_emulator
          params:
            collector_url: "$COLLECTOR_URL"
            provider: okta
            event_pattern: mfa_fatigue
            target_user: "alice.singh@cortexsim-canary.invalid"
            iterations: 1
            burst_count: 16
      YML
      python3 -m scripts.eal_simulator.cli run "$C/itdr-002-heavy.yml" --live
    identity: container-runtime
    mitre_technique: "T1621"
    expected_detections:
      - plane: ITDR
        type: XQL
        description: "ITDR — MFA-fatigue alert severity escalates above 16-event threshold"
        ttp_ref: "TTP-2026-0038"
        detection_id: xql-itdr-002-mfa-fatigue-severity-escalates-above-16-events
    causality:
      parent_step: step-02
      pivot: shared_entity
    platforms: ["linux", "container"]

cleanup:
  commands: []

