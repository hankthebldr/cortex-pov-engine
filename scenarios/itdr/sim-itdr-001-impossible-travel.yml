scenario_id: SIM-ITDR-001
name: "ITDR — Impossible Travel (Okta sign-ins from US-West and APAC-East)"
version: "1.0"
status: active

plane: ITDR
detection_types:
  - BIOC
  - XQL
# GAP-10 (IOC coverage) — the ITDR plane carries zero IOCs because none of the
# ITDR cards (TTP-2026-0037..0041) declare a `detections.iocs[]` entry yet.
# A resolvable IOC detection here requires Lane CARDS to first add an IOC to
# the linked card (e.g. an IdP attack source IP / ASN, or a known credential-
# stuffing botnet IP) — only then can a `type: IOC` expected_detection
# reference a `detection_id` that resolves in the catalog. Adding a dangling
# IOC ref would violate the "only reference detection_ids that RESOLVE" rule,
# so this gap is intentionally left tracked-but-open until the card IOC lands.

uc_ref: UCS-ITDR-01
tc_ref: TC-ITDR-01
uc_name: "Geo-Anomaly Sign-In Detection"
tc_name: "Two Successful Sign-Ins From Geographically Impossible Locations Within 5 min"

mitre_tactic: "TA0001"
mitre_tactic_name: "Initial Access"
mitre_technique: "T1078.004"
mitre_technique_name: "Valid Accounts: Cloud Accounts"
additional_techniques:
  - technique: "T1539"
    name: "Steal Web Session Cookie"

threat_report: "Okta - Identity Threat Trends 2025"
threat_report_url: "https://www.okta.com/identity-101/"

# ── Causality contract ──────────────────────────────────────────────────────
# This is an identity-plane scenario: the emulator runs inside the container
# runtime, so the Causality Group Owner is the containerd-shim/container-runtime
# that owns the emitter session (not the synthetic beacon). The detection is
# pure IdP-log analytics — the meaningful pivot is not a process fork but the
# SAME principal (ada.lovelace) appearing across two providers. step-02 follows
# step-01 in the same runtime session (process_lineage); step-03 stitches to
# step-02 on the shared identity (shared_entity), mirroring how correlation
# CR-ITDR-0001 fuses the Okta and Microsoft anomalies for one identity.
cgo_anchor:
  image_name: "containerd-shim"
  primary_username: "container-runtime"

execution_identity:
  default: container-runtime
  options:
    - container-runtime
    - root

push_supported: true
pull_supported: true

infra_modules_needed:
  - base
  - itdr

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
# Rolled out per the S-07 per-plane convention
# (docs/uc_tc_mapping/scenario-methodology-defaults.md). Defaults are not
# fabricated KPIs — they map this plane to the methodology family its
# detection shape already belongs to in the v2.0 master methodology.
validation_methodology: "Identity Signal Injection & Detection Accuracy"
methodology_family: "F1"
primary_kpi: "Detection Accuracy"
threshold:
  kpi: "Detection Accuracy"
  op: "≥"
  value: 90
  unit: "%"
success_criteria: |
  The synthetic IdP audit-log signals emitted by this scenario produce the
  expected Cortex ITDR detection. Detection Accuracy is the share of
  injected identity events that raise the expected alert (target ≥ 90%).
moat_tier: "LEAD"

external_tools:
  - name: cortexsim-eal-cli
    source: "https://github.com/hankthebldr/cortex-pov-engine"
    type: script
    install_inline: false

steps:
  - id: step-01
    name: "Pre-flight: confirm idp_signin_emulator plugin is registered"
    command: |
      python3 -m scripts.eal_simulator.cli describe idp_signin_emulator \
        | jq -e '.eal_targets | length > 0'
    identity: container-runtime
    mitre_technique: "T1078.004"
    # Root step: the emulator pre-flight inside the container-runtime CGO session.
    platforms: ["linux", "container"]
    expected_detections:
      - plane: ITDR
        type: BIOC
        description: "Pre-flight: idp_signin_emulator metadata visible to operator"
        ttp_ref: "TTP-2026-0037"
        detection_id: bioc-itdr-001-pre-flight-idp-signin-emulator-metadata-visible

  - id: step-02
    name: "Emit two successful Okta sign-in events from US-West then APAC-East"
    command: |
      : "${COLLECTOR_URL:=https://collector.cortexsim-canary.invalid/idp/events}"
      : "${COLLECTOR_HOST:=collector.cortexsim-canary.invalid}"
      cat > /tmp/itdr-001.yml <<YML
      campaign_id: CMP-ITDR-001
      name: "ITDR — Okta impossible travel"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - "$COLLECTOR_HOST"
      dry_run: false
      tags: [itdr, okta, impossible-travel]
      steps:
        - step_id: step-01
          plugin: idp_signin_emulator
          params:
            collector_url: "$COLLECTOR_URL"
            provider: okta
            event_pattern: impossible_travel
            target_user: "ada.lovelace@cortexsim-canary.invalid"
            iterations: 1
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/itdr-001.yml --live
    identity: container-runtime
    mitre_technique: "T1078.004"
    causality:
      parent_step: "step-01"
      pivot: "process_lineage"
    platforms: ["linux", "container"]
    expected_detections:
      - plane: ITDR
        type: XQL
        description: "ITDR — impossible-travel alert: same user signed in from two distant geos within travel-impossibility window"
        ttp_ref: "TTP-2026-0037"
        detection_id: xql-itdr-001-impossible-travel-two-distant-geos-within-window
      - plane: NDR
        type: XQL
        description: "NGFW EAL — outbound POST burst to identity log-collector App-ID match"
        ttp_ref: "TTP-2026-0037"
        detection_id: xql-itdr-001-ngfw-outbound-post-burst-to-identity-collector

  - id: step-03
    name: "Repeat the pattern with Microsoft event shape — confirm parser works for both"
    command: |
      : "${COLLECTOR_URL:=https://collector.cortexsim-canary.invalid/idp/events}"
      : "${COLLECTOR_HOST:=collector.cortexsim-canary.invalid}"
      cat > /tmp/itdr-001-ms.yml <<YML
      campaign_id: CMP-ITDR-001
      name: "ITDR — Microsoft impossible travel"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - "$COLLECTOR_HOST"
      dry_run: false
      steps:
        - step_id: step-01
          plugin: idp_signin_emulator
          params:
            collector_url: "$COLLECTOR_URL"
            provider: microsoft
            event_pattern: impossible_travel
            target_user: "ada.lovelace@cortexsim-canary.invalid"
            iterations: 1
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/itdr-001-ms.yml --live
    identity: container-runtime
    mitre_technique: "T1078.004"
    # The Microsoft leg stitches to the Okta leg on the SHARED identity
    # (ada.lovelace), not a process fork — the cross-provider impossible-travel
    # join CR-ITDR-0001 keys on.
    causality:
      parent_step: "step-02"
      pivot: "shared_entity"
    platforms: ["linux", "container"]
    expected_detections:
      - plane: ITDR
        type: XQL
        description: "ITDR — impossible-travel alert fires identically for Microsoft signInLogs shape"
        ttp_ref: "TTP-2026-0037"
        detection_id: xql-itdr-001-impossible-travel-microsoft-signinlogs-shape

cleanup:
  commands:
    - "rm -f /tmp/itdr-001.yml /tmp/itdr-001-ms.yml"

author: "Henry Reed"
created: "2026-05-15"
last_updated: "2026-05-15"
tags:
  - itdr
  - okta
  - microsoft
  - impossible-travel
  - eal-plugin
