scenario_id: SIM-ITDR-003
name: "ITDR — Credential Stuffing (failed-login burst across many users)"
version: "1.0"
status: active

plane: ITDR
detection_types:
  - BIOC
  - XQL

uc_ref: UCS-ITDR-03
tc_ref: TC-ITDR-03
uc_name: "Credential-Stuffing Detection"
tc_name: "Single Source IP Tries N Distinct Identifiers In Short Window"

mitre_tactic: "TA0006"
mitre_tactic_name: "Credential Access"
mitre_technique: "T1110.004"
mitre_technique_name: "Brute Force: Credential Stuffing"

threat_report: "Verizon DBIR 2024 - Stolen Credential Reuse"
threat_report_url: "https://www.verizon.com/business/resources/reports/dbir/"

execution_identity:
  default: container-runtime
  options:
    - container-runtime
    - root

push_supported: true
pull_supported: true

infra_modules_needed:
  - base
  - itdr

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
# Rolled out per the S-07 per-plane convention
# (docs/uc_tc_mapping/scenario-methodology-defaults.md). Defaults are not
# fabricated KPIs — they map this plane to the methodology family its
# detection shape already belongs to in the v2.0 master methodology.
validation_methodology: "Identity Signal Injection & Detection Accuracy"
methodology_family: "F1"
primary_kpi: "Detection Accuracy"
threshold:
  kpi: "Detection Accuracy"
  op: "≥"
  value: 90
  unit: "%"
success_criteria: |
  The synthetic IdP audit-log signals emitted by this scenario produce the
  expected Cortex ITDR detection. Detection Accuracy is the share of
  injected identity events that raise the expected alert (target ≥ 90%).
moat_tier: "LEAD"

# ── Causality contract: connected CGO→process spine + shared-origin reuse ────
# The idp_signin_emulator runs as the container entrypoint (python3) that OWNS
# the emission chain — the CGO root, NOT the synthetic beacon. Step-01 (the
# capability probe) links from the CGO; step-02 (Okta 20-user spray) descends
# from it as the emulator process spine; step-03 (Entra 50-user spray) reuses
# the SAME single spray-origin / collector, so it stitches via shared_entity.
cgo_anchor:
  image_name: "python3"
  primary_username: "container-runtime"

external_tools:
  - name: cortexsim-eal-cli
    source: "https://github.com/hankthebldr/cortex-pov-engine"
    type: script
    install_inline: false

steps:
  - id: step-01
    name: "Pre-flight: confirm credential_stuffing pattern is supported"
    command: |
      python3 -m scripts.eal_simulator.cli describe idp_signin_emulator \
        | jq -e '.params_schema.properties.event_pattern'
    identity: container-runtime
    mitre_technique: "T1110.004"
    expected_detections:
      - plane: ITDR
        type: BIOC
        description: "Pre-flight: idp_signin_emulator metadata visible to operator"
        ttp_ref: "TTP-2026-0039"
        detection_id: bioc-itdr-003-pre-flight-idp-signin-emulator-metadata-visible
    platforms: ["linux", "container"]

  - id: step-02
    name: "20 failed sign-ins from one source IP across 20 distinct identifiers"
    command: |
      : "${COLLECTOR_URL:=https://collector.cortexsim-canary.invalid/idp/events}"
      : "${COLLECTOR_HOST:=collector.cortexsim-canary.invalid}"
      cat > /tmp/itdr-003.yml <<YML
      campaign_id: CMP-ITDR-003
      name: "ITDR — credential stuffing 20-user burst"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - "$COLLECTOR_HOST"
      dry_run: false
      tags: [itdr, credential-stuffing]
      steps:
        - step_id: step-01
          plugin: idp_signin_emulator
          params:
            collector_url: "$COLLECTOR_URL"
            provider: okta
            event_pattern: credential_stuffing
            target_user: "user000@cortexsim-canary.invalid"
            iterations: 1
            burst_count: 20
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/itdr-003.yml --live
    identity: container-runtime
    mitre_technique: "T1110.004"
    expected_detections:
      - plane: ITDR
        type: XQL
        description: "ITDR — credential-stuffing alert: 20 failed sign-ins from same IP across distinct identifiers"
        ttp_ref: "TTP-2026-0039"
        detection_id: xql-itdr-003-credential-stuffing-many-users-one-source-ip
      - plane: NDR
        type: XQL
        description: "NGFW EAL — sustained POST burst to identity log-collector"
        ttp_ref: "TTP-2026-0039"
        detection_id: xql-itdr-003-ngfw-sustained-post-burst-to-identity-collector
    causality:
      parent_step: step-01
      pivot: process_lineage
    platforms: ["linux", "container", "windows"]
    platform_variants:
      windows: |
        $env:COLLECTOR_URL = 'https://collector.cortexsim-canary.invalid/idp/events'
        @'
        campaign_id: CMP-ITDR-003
        name: "ITDR — credential stuffing 20-user burst"
        authorized_by: "domain-consultant@paloaltonetworks.com"
        simulation_authorized: true
        target_allowlist:
          - "collector.cortexsim-canary.invalid"
        dry_run: false
        steps:
          - step_id: step-01
            plugin: idp_signin_emulator
            params:
              collector_url: "https://collector.cortexsim-canary.invalid/idp/events"
              provider: okta
              event_pattern: credential_stuffing
              target_user: "user000@cortexsim-canary.invalid"
              iterations: 1
              burst_count: 20
        '@ | Set-Content -Encoding utf8 $env:TEMP\itdr-003.yml
        python -m scripts.eal_simulator.cli run $env:TEMP\itdr-003.yml --live

  - id: step-03
    name: "Repeat with Microsoft event shape — 50-user burst"
    command: |
      : "${COLLECTOR_URL:=https://collector.cortexsim-canary.invalid/idp/events}"
      : "${COLLECTOR_HOST:=collector.cortexsim-canary.invalid}"
      cat > /tmp/itdr-003-ms.yml <<YML
      campaign_id: CMP-ITDR-003
      name: "ITDR — credential stuffing 50-user burst (Microsoft)"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - "$COLLECTOR_HOST"
      dry_run: false
      steps:
        - step_id: step-01
          plugin: idp_signin_emulator
          params:
            collector_url: "$COLLECTOR_URL"
            provider: microsoft
            event_pattern: credential_stuffing
            target_user: "user000@cortexsim-canary.invalid"
            iterations: 1
            burst_count: 50
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/itdr-003-ms.yml --live
    identity: container-runtime
    mitre_technique: "T1110.004"
    expected_detections:
      - plane: ITDR
        type: XQL
        description: "ITDR — credential-stuffing alert severity escalates with 50-event burst"
        ttp_ref: "TTP-2026-0039"
        detection_id: xql-itdr-003-credential-stuffing-severity-escalates-50-event-burst
    causality:
      parent_step: step-02
      pivot: shared_entity
    platforms: ["linux", "container"]

cleanup:
  commands:
    - "rm -f /tmp/itdr-003.yml /tmp/itdr-003-ms.yml"

author: "Henry Reed"
created: "2026-05-15"
last_updated: "2026-05-15"
tags:
  - itdr
  - credential-stuffing
  - brute-force
  - eal-plugin
