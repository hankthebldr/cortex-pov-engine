scenario_id: SIM-ASM-003
name: "ASM — Passive OSINT Victim-Info Gathering Reconnaissance"
version: "1.0"
status: active

plane: ASM
detection_types:
  - XQL
  - BIOC
  - IOC
  - Correlation

uc_ref: UCS-ASM-03
tc_ref: TC-ASM-03
uc_name: "Pre-Intrusion Reconnaissance Detection via Cortex ASM"
tc_name: "Open-Source Subdomain / Cert / Identity Harvesting"

mitre_tactic: "TA0043"
mitre_tactic_name: "Reconnaissance"
mitre_technique: "T1592"
mitre_technique_name: "Gather Victim Host Information"
additional_techniques:
  - technique: "T1589"
    name: "Gather Victim Identity Information"
  - technique: "T1590.002"
    name: "Gather Victim Network Information: DNS"
  - technique: "T1596.003"
    name: "Search Open Technical Databases: Digital Certificates"

threat_report: "Unit42 - Attack Surface Threat Report (Internet-Exposed Assets)"
threat_report_url: "https://unit42.paloaltonetworks.com/"

execution_identity:
  default: root
  options:
    - root
    - container-runtime

push_supported: true
pull_supported: true

infra_modules_needed:
  - base
  - asm

external_tools:
  - name: theHarvester
    source: "https://github.com/laramies/theHarvester"
    type: script
    install_inline: true

steps:
  - id: step-01
    name: "Subdomain enumeration via DNS brute-force (T1590.002)"
    command: |
      # Resolve many distinct subdomain labels under one parent domain — the
      # subdomain brute-force / DNS reconnaissance burst that precedes targeting.
      for sub in www mail vpn dev staging api admin portal test git jenkins gitlab autodiscover; do
        host ${sub}.${TARGET_DOMAIN} 2>/dev/null | head -1
      done
    identity: root
    mitre_technique: "T1590.002"
    expected_detections:
      - plane: NDR
        type: BIOC
        description: "NGFW EAL — outbound subdomain-enumeration DNS burst (1 src → many labels, one parent)"
        ttp_ref: TTP-2026-0072
        detection_id: bioc-asm-eal-outbound-subdomain-enumeration-dns-burst
      - plane: NDR
        type: XQL
        description: "NGFW EAL — subdomain-enumeration DNS burst confirmed in traffic logs"
        ttp_ref: TTP-2026-0072
        detection_id: xql-asm-003-subdomain-enumeration-dns-burst-1-src-many-labels-one-parent

  - id: step-02
    name: "Certificate-transparency + email/identity harvest (T1592 / T1589 / T1596.003)"
    command: |
      # Passive cert-transparency harvest (crt.sh) plus theHarvester-style email/
      # identity harvesting against public sources only — no victim service is
      # touched. Emits the OSINT-aggregator egress shape with a tooling user-agent.
      curl -sk -A "cortexsim-osint/1.0 (amass-like)" \
        "https://crt.sh/?q=%25.${TARGET_DOMAIN}&output=json" | head -c 4000
      theHarvester -d ${TARGET_DOMAIN} -b crtsh,bing,duckduckgo -l 100 2>/dev/null | head -40 \
        || echo '[CortexSim] theHarvester not installed — DNS+CT recon footprint already emitted'
    identity: root
    mitre_technique: "T1592"
    expected_detections:
      - plane: NDR
        type: BIOC
        description: "NGFW EAL — outbound OSINT-aggregator egress (crt.sh) with recon-tooling user-agent"
        ttp_ref: TTP-2026-0072
        detection_id: bioc-asm-eal-outbound-osint-aggregator-egress-with-tooling-user-agent
      - plane: NDR
        type: XQL
        description: "NGFW EAL — OSINT aggregator / cert-transparency egress confirmed"
        ttp_ref: TTP-2026-0072
        detection_id: xql-asm-003-osint-aggregator-cert-transparency-egress
      - plane: ASM
        type: IOC
        description: "Recon signature — certificate-transparency aggregator (crt.sh) queried during harvesting"
        ttp_ref: TTP-2026-0072
        detection_id: ioc-domain-crt-sh
      - plane: ASM
        type: IOC
        description: "Recon signature — OSINT subdomain/cert harvesting tooling user-agent (amass-class)"
        ttp_ref: TTP-2026-0072
        detection_id: ioc-user-agent-cortexsim-osint-1-0-amass-like

  - id: step-03
    name: "Reconcile harvest against Cortex ASM/Xpanse external-footprint discovery"
    command: |
      # The DC reconciles what the harvest found against the external footprint
      # Cortex ASM/Xpanse independently discovered (subdomains, certs, identity
      # exposures) — the exposure-management early-warning narrative.
      aws resourcegroupstaggingapi get-resources \
        --tag-filters Key=CortexSimASMFinding \
        --query 'ResourceTagMappingList[].ResourceARN' --output text || true
    identity: root
    mitre_technique: "T1592"
    expected_detections:
      - plane: ASM
        type: XQL
        description: "Cortex ASM/Xpanse subdomain / certificate / identity discovery delta for the org"
        ttp_ref: TTP-2026-0072
        detection_id: xql-asm-003-xpanse-subdomain-certificate-identity-discovery-delta
      - plane: ASM
        type: XQL
        description: "Identity-exposure roll-up — harvested email / breached-credential surface"
        ttp_ref: TTP-2026-0072
        detection_id: xql-asm-003-identity-exposure-roll-up-harvested-email-breached-credential-surface
      - plane: ANALYTICS
        type: Correlation
        description: "Exposure Management — organisation under open-source reconnaissance, stitched into one incident"
        ttp_ref: TTP-2026-0072
        detection_id: CR-ASM-0003

cleanup:
  commands:
    - "rm -f /tmp/theharvester-*.html /tmp/theharvester-*.xml"
    - "echo '[CortexSim] SIM-ASM-003 cleanup complete (passive recon — no state changed)'"

author: "Henry Reed"
created: "2026-06-08"
last_updated: "2026-06-08"
tags:
  - asm
  - reconnaissance
  - osint
  - subdomain-enumeration
  - identity-harvesting
  - exposure-management

validation_methodology: "Asset Discovery & Inventory Coverage"
methodology_family: "F3"
primary_kpi: "Asset Discovery Coverage"
threshold:
  kpi: "Asset Discovery Coverage"
  op: "≥"
  value: 90
  unit: "%"
success_criteria: |
  Cortex surfaces the passive OSINT reconnaissance (subdomain DNS burst + OSINT
  aggregator egress) against the organisation and correlates it with the
  external footprint Cortex ASM/Xpanse independently discovers (subdomains,
  certificates, identity exposures) into a single 'organisation under
  reconnaissance' exposure-management incident.
moat_tier: "MOAT"
