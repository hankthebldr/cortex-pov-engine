scenario_id: SIM-ASM-004
name: "ASM — Web-Application Attack-Surface Enumeration & Exploitation"
version: "1.0"
status: active

plane: ASM
detection_types:
  - XQL
  - BIOC
  - IOC
  - Correlation

uc_ref: UCS-ASM-04
tc_ref: TC-ASM-04
uc_name: "Web-Application Attack-Surface Enumeration & Exploitation via Cortex ASM"
tc_name: "External Web Enumeration + Injection Probing Against the Exposed Surface"

mitre_tactic: "TA0043"
mitre_tactic_name: "Reconnaissance"
mitre_technique: "T1595.002"
mitre_technique_name: "Active Scanning: Vulnerability Scanning"
additional_techniques:
  - technique: "T1595.003"
    name: "Active Scanning: Wordlist Scanning"
  - technique: "T1190"
    name: "Exploit Public-Facing Application"
  - technique: "T1592"
    name: "Gather Victim Host Information"

threat_report: "Unit42 - Attack Surface Threat Report (Internet-Exposed Web Applications)"
threat_report_url: "https://unit42.paloaltonetworks.com/"

execution_identity:
  default: root
  options:
    - root
    - container-runtime

push_supported: true
pull_supported: true

infra_modules_needed:
  - base
  - asm

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
# Rolled out per the S-07 per-plane convention (docs/uc_tc_mapping/
# scenario-methodology-defaults.md). ASM is the asset-discovery family.
validation_methodology: "Asset Discovery & Inventory Coverage"
methodology_family: "F3"
primary_kpi: "Asset Discovery Coverage"
threshold:
  kpi: "Asset Discovery Coverage"
  op: "≥"
  value: 90
  unit: "%"
success_criteria: |
  Cortex ASM/Xpanse discovers and fingerprints the exposed web service (nginx
  surface + gocortexbrokenbank on :9001), and the NGFW/NDR detects the active
  content-discovery brute force, web-vulnerability scan, and SQL/command-
  injection probing from a single source — all stitched with the ASM discovery
  findings into one exposure-management incident via CR-ASM-0004.
moat_tier: "MOAT"

# ── Consent / safety ────────────────────────────────────────────────────────
# This scenario actively enumerates and injection-probes the web surface the
# `asm` IaC module provisions, so it references the dual-use-lab-only adapters
# TOOL-GOBUSTER, TOOL-FEROXBUSTER, TOOL-SQLMAP, and TOOL-COMMIX. The
# orchestrator's adapter consent gate
# (core/engine/orchestrator.py::_check_adapter_consent) REFUSES to launch
# without consent.simulation_authorized=true. TOOL-WHATWEB, TOOL-NIKTO, and
# TOOL-CMSEEK are safe-class fingerprint/scan tools and do not require consent.

external_tools:
  - name: WhatWeb
    source: "https://github.com/urbanadventurer/WhatWeb"
    type: binary
    install_inline: false
    adapter_ref: TOOL-WHATWEB
  - name: CMSeeK
    source: "https://github.com/Tuhinshubhra/CMSeeK"
    type: script
    install_inline: false
    adapter_ref: TOOL-CMSEEK
  - name: gobuster
    source: "https://github.com/OJ/gobuster"
    type: binary
    install_inline: false
    adapter_ref: TOOL-GOBUSTER
  - name: feroxbuster
    source: "https://github.com/epi052/feroxbuster"
    type: binary
    install_inline: false
    adapter_ref: TOOL-FEROXBUSTER
  - name: Nikto
    source: "https://github.com/sullo/nikto"
    type: script
    install_inline: false
    adapter_ref: TOOL-NIKTO
  - name: sqlmap
    source: "https://github.com/sqlmapproject/sqlmap"
    type: script
    install_inline: false
    adapter_ref: TOOL-SQLMAP
  - name: commix
    source: "https://github.com/commixproject/commix"
    type: script
    install_inline: false
    adapter_ref: TOOL-COMMIX

steps:
  - id: step-01
    name: "Ground-truth manifest capture — confirm planted exposed web surface exists"
    command: |
      # Confirm the infra/modules/aws/asm planted resources are inventoried
      # (CortexSimASMFinding-tagged) before scanning, so the POV report can
      # reconcile discovered web assets against ground truth.
      aws resourcegroupstaggingapi get-resources \
        --tag-filters Key=CortexSimASMFinding \
        --query 'ResourceTagMappingList[].ResourceARN' --output text || true
    identity: root
    mitre_technique: "T1595"
    expected_detections:
      - plane: ASM
        type: XQL
        description: "Ground-truth manifest confirms the planted CortexSimASMFinding-tagged web surface exists in the cloud inventory"
        ttp_ref: TTP-2026-0077
        detection_id: xql-asm-004-ground-truth-manifest-capture-bookkeeping

  - id: step-02
    name: "WhatWeb + CMSeeK technology fingerprint and CMS detection (T1592)"
    command: |
      # Fingerprint the exposed nginx web surface technology stack and detect any
      # CMS, so Cortex ASM/Xpanse can enumerate the web technology of the asset.
      whatweb -a 3 --log-json=/tmp/whatweb-asm-004.json "http://${ASM_TARGET_HOST}/"
      cmseek -u "http://${ASM_TARGET_HOST}/" --batch 2>&1 | tee /tmp/cmseek-asm-004.txt || true
    identity: root
    mitre_technique: "T1592"
    expected_detections:
      - plane: ASM
        type: XQL
        description: "Cortex ASM web technology-fingerprint and CMS-enumeration findings for the exposed asset"
        ttp_ref: TTP-2026-0077
        detection_id: xql-asm-004-web-technology-fingerprint-and-cms-enumeration-findings
      - plane: ASM
        type: IOC
        description: "Recon signature — WhatWeb technology-fingerprinting user-agent on inbound requests"
        ttp_ref: TTP-2026-0077
        detection_id: ioc-user-agent-whatweb-0-5-5

  - id: step-03
    name: "Gobuster directory + vhost content brute-force (T1595.003)"
    command: |
      # Brute-force directories and virtual hosts against the exposed nginx
      # surface — a single source fans out across many URIs (content-discovery
      # egress shape). Dual-use-lab-only adapter: requires launch consent.
      gobuster dir -u "http://${ASM_TARGET_HOST}/" \
        -w /usr/share/wordlists/dirb/common.txt -t 30 -q \
        -o /tmp/gobuster-asm-004.txt || true
    identity: root
    mitre_technique: "T1595.003"
    expected_detections:
      - plane: NDR
        type: BIOC
        description: "NGFW EAL — content-discovery path brute-force burst from a single source against the exposed web surface"
        ttp_ref: TTP-2026-0077
        detection_id: bioc-asm-004-web-content-discovery-path-brute-force-burst-from-single-source
      - plane: NDR
        type: XQL
        description: "NGFW EAL — content-discovery path fan-out (1 src → many URIs on exposed host)"
        ttp_ref: TTP-2026-0077
        detection_id: xql-asm-004-content-discovery-path-fan-out-1-src-to-many-uris
      - plane: ASM
        type: IOC
        description: "Recon signature — gobuster content brute-force tool user-agent on the discovery burst"
        ttp_ref: TTP-2026-0077
        detection_id: ioc-user-agent-gobuster-3-6

  - id: step-04
    name: "Feroxbuster recursive content discovery (T1595.003)"
    command: |
      # Recursive content discovery against the exposed nginx surface — deepens
      # the content-discovery fan-out the NGFW sees. Dual-use-lab-only adapter:
      # requires launch consent.
      feroxbuster -u "http://${ASM_TARGET_HOST}/" -d 2 -t 30 --silent \
        -o /tmp/feroxbuster-asm-004.txt || true
    identity: root
    mitre_technique: "T1595.003"
    expected_detections:
      - plane: NDR
        type: BIOC
        description: "NGFW EAL — recursive content-discovery path brute-force burst from a single source"
        ttp_ref: TTP-2026-0077
        detection_id: bioc-asm-004-web-content-discovery-path-brute-force-burst-from-single-source
      - plane: NDR
        type: XQL
        description: "NGFW EAL — recursive content-discovery path fan-out (1 src → many URIs)"
        ttp_ref: TTP-2026-0077
        detection_id: xql-asm-004-content-discovery-path-fan-out-1-src-to-many-uris

  - id: step-05
    name: "Nikto web-vulnerability scan against gocortexbrokenbank (T1595.002)"
    command: |
      # Web-vulnerability scan against the gocortexbrokenbank app on :9001 — a
      # burst of vulnerability/info-leak threat signatures inbound to the
      # exposed banking app.
      nikto -h "http://${ASM_TARGET_HOST}:9001" -Tuning 1234567890 \
        -o /tmp/nikto-asm-004.txt -Format txt || true
    identity: root
    mitre_technique: "T1595.002"
    expected_detections:
      - plane: NDR
        type: XQL
        description: "NGFW EAL — web vulnerability-scan threat-signature burst against the exposed banking app"
        ttp_ref: TTP-2026-0077
        detection_id: xql-asm-004-web-vulnerability-scan-threat-signature-burst
      - plane: ASM
        type: XQL
        description: "Cortex ASM high-risk exposure finding — vulnerable banking application surfaced on :9001"
        ttp_ref: TTP-2026-0077
        detection_id: xql-asm-004-web-technology-fingerprint-and-cms-enumeration-findings

  - id: step-06
    name: "SQLmap SQL-injection probe against the banking app (T1190)"
    command: |
      # Probe the gocortexbrokenbank login parameter for SQL injection. The NGFW
      # sees SQLi threat signatures inbound to :9001. Dual-use-lab-only adapter:
      # requires launch consent.
      sqlmap -u "http://${ASM_TARGET_HOST}:9001/login.php?id=1" \
        --batch --random-agent --level=2 --risk=1 \
        --output-dir=/tmp/sqlmap-cortexsim || true
    identity: root
    mitre_technique: "T1190"
    expected_detections:
      - plane: NDR
        type: BIOC
        description: "NGFW — SQL-injection probe pattern in inbound web request to the banking app"
        ttp_ref: TTP-2026-0077
        detection_id: bioc-asm-004-sql-injection-probe-pattern-in-web-request
      - plane: NDR
        type: XQL
        description: "NGFW — injection-probe threat signatures against the banking app on :9001"
        ttp_ref: TTP-2026-0077
        detection_id: xql-asm-004-injection-probe-threat-signatures-against-banking-app
      - plane: ASM
        type: IOC
        description: "Exploitation signature — SQL-injection probe endpoint on the banking app (/login.php?id=1)"
        ttp_ref: TTP-2026-0077
        detection_id: ioc-url-login-php-id-1

  - id: step-07
    name: "Commix OS-command-injection probe + correlate exposure incident (T1190)"
    command: |
      # Probe the banking app for OS-command injection. Completes the injection
      # coverage and triggers the exposure-management correlation that stitches
      # ASM discovery with the live scan + injection traffic. Dual-use-lab-only
      # adapter: requires launch consent.
      commix -u "http://${ASM_TARGET_HOST}:9001/ping.php?host=127.0.0.1" \
        --batch --output-dir=/tmp/commix-asm-004 || true
    identity: root
    mitre_technique: "T1190"
    expected_detections:
      - plane: NDR
        type: BIOC
        description: "NGFW — OS-command-injection probe pattern in inbound web request to the banking app"
        ttp_ref: TTP-2026-0077
        detection_id: bioc-asm-004-os-command-injection-probe-pattern-in-web-request
      - plane: NDR
        type: XQL
        description: "NGFW — injection-probe threat signatures against the banking app on :9001"
        ttp_ref: TTP-2026-0077
        detection_id: xql-asm-004-injection-probe-threat-signatures-against-banking-app
      - plane: ANALYTICS
        type: Correlation
        description: "Exposure Management — exposed web surface discovered AND actively enumerated AND injection-probed, stitched into one incident"
        ttp_ref: TTP-2026-0077
        detection_id: CR-ASM-0004

cleanup:
  commands:
    - "rm -rf /tmp/sqlmap-cortexsim /tmp/commix-asm-004 /tmp/cmseek-asm-004"
    - "rm -f /tmp/whatweb-asm-004.json /tmp/gobuster-asm-004.txt /tmp/feroxbuster-asm-004.txt /tmp/nikto-asm-004.txt"
    - "echo '[CortexSim] SIM-ASM-004 cleanup complete'"

