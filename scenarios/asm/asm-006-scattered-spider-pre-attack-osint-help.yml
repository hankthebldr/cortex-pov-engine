scenario_id: SIM-ASM-006
name: "ASM — Scattered Spider Pre-Attack OSINT + Help-Desk Profiling as a Vishing-Precursor Recon Correlation"
version: "1.0"
status: active

plane: ASM
detection_types:
  - XQL
  - BIOC
  - ABIOC
  - Correlation

uc_ref: UCS-ASM-02
tc_ref: TC-ASM-03
tc_refs:
  - TC-ASM-03
  - TC-ASM-01
pov_scenario_id: POV-SC-001
uc_name: "Attack Surface & Exposure Management"
tc_name: "Validate Unit 42 TI integrated into retroactive search protocols against ASM findings"

mitre_tactic: "TA0043"
mitre_tactic_name: "Reconnaissance"
mitre_technique: "T1589"
mitre_technique_name: "Gather Victim Identity Information"
additional_techniques:
  - technique: "T1593.001"
    name: "Search Open Websites/Domains: Social Media"
  - technique: "T1598"
    name: "Phishing for Information"

threat_report: "2025 Unit 42 Global Incident Response Report: Social Engineering Edition"
threat_report_url: "https://unit42.paloaltonetworks.com/2025-unit-42-global-incident-response-report-social-engineering-edition/"

execution_identity:
  default: root
  options:
    - root
    - www-data

push_supported: true
pull_supported: true

# ── Causality contract ──────────────────────────────────────────────────────
# The pre-attack recon of Scattered Spider / Muddled Libra: OSINT profiling of
# key personnel, enumeration of the federated-identity surface, and repeated
# help-desk account-recovery reconnaissance are sequential execs off ONE operator
# shell (the CGO), not the beacon. The detection telemetry is Cortex ASM/Xpanse
# exposure findings (asm_findings) + IdP audit events (okta_sso) + TIM attribution
# (threat_intel) — no endpoint process-causality tree on a victim host — so the
# chain is stitched on the SHARED TARGET ORG/IDENTITY, which is what CR-ASM-0006
# keys on. step-01 is the single root; steps 02..04 continue the same recon
# storyline against the same org (shared_entity), giving one connected
# profile -> enumerate -> help-desk-recon -> attribute+correlate spine.
cgo_anchor:
  image_name: "bash"
  primary_username: "root"

infra_modules_needed:
  - base
  - asm

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
# ASM is the asset-discovery family (F3); this scenario's terminal assertion is a
# cross-source correlation, so the primary KPI is the correlation rate that
# proves the recon storyline stitched into one early-warning incident.
validation_methodology: "Asset Discovery & Cross-Source Recon Correlation"
methodology_family: "F3"
primary_kpi: "Cross-Source Correlation Rate"
threshold:
  kpi: "Cross-Source Correlation Rate"
  op: "≥"
  value: 80
  unit: "%"
success_criteria: |
  Cortex ASM/Xpanse surfaces the external-footprint exposure of key personnel
  (identity data, social-media personas, the federated-IdP login portal) and
  Cortex ASM's discovery of the org's externally-exposed apps/CSPs/IdP surface;
  the IdP audit stream shows an anomalous burst of repeated help-desk
  account-recovery reconnaissance against those same exposed identities; TIM attributes the pattern to Muddled Libra / Scattered
  Spider tradecraft. No single event is a known-bad IOC — the value is entirely in
  the stitch. The terminal correlation CR-ASM-0006 fuses ASM footprint exposure ×
  help-desk profiling burst × TIM attribution on one target org within a 7-day
  window into a single identity-takeover-precursor incident that fires on the
  reconnaissance phase, BEFORE the downstream MFA-reset takeover — the early
  warning is the whole point.
moat_tier: "MOAT"

# ── Consent / safety ────────────────────────────────────────────────────────
# SAFE-MODE, non-destructive: every step only EMITS the reconnaissance footprint
# shape against an authorised target org. No real victim identity data is
# collected and no help desk is actually contacted — the steps stage the
# asm_findings / okta_sso / threat_intel telemetry Cortex stitches. destructive=false.

external_tools: []

steps:
  - id: step-01
    name: "OSINT profiling of key personnel + external-footprint surfacing (T1589 / T1593.001)"
    command: |
      # SAFE-MODE: emit the OSINT key-personnel profiling footprint against the
      # authorised target org only. No real victim identity data is collected.
      echo "[CortexSim][SAFE-MODE] SIM-ASM-006 OSINT profiling key personnel of ${TARGET_ORG:-acme-corp} (LinkedIn-sourced personas)"
    identity: root
    mitre_technique: "T1589"
    platforms: ["linux"]
    expected_detections:
      - plane: ASM
        type: XQL
        description: "Cortex ASM/Xpanse surfaces exposed key-personnel identity data, social-media personas, and the federated-IdP login portal for the target org."
        ttp_ref: "TTP-2026-0151"
        detection_id: "xql-asm-key-personnel-external-footprint-exposure"

  - id: step-02
    name: "Cortex ASM surfaces the org's externally-exposed apps, CSP tenants, and federated IdP platform (T1589 / T1593.001)"
    command: |
      # SAFE-MODE: emit the ASM exposure-discovery footprint — Cortex ASM/Xpanse
      # surfaces which SaaS apps, CSP tenants, and IdP login portal the org
      # exposes publicly (a defensive exposure-management finding, not attacker
      # enumeration). This public footprint is the pretext material.
      echo "[CortexSim][SAFE-MODE] Cortex ASM surfaces ${TARGET_ORG:-acme-corp} externally-exposed SaaS apps, CSP tenants, and federated IdP login portal"
    identity: root
    mitre_technique: "T1589"
    platforms: ["linux"]
    # Sibling exec off the same operator shell (CGO) surfacing the same org
    # footprint — shared_entity (host + operator + target org), not a fork.
    causality:
      parent_step: step-01
      pivot: shared_entity
    expected_detections:
      - plane: ASM
        type: BIOC
        description: "Cortex ASM/Xpanse discovery of the org's OWN externally-exposed SaaS apps, CSP tenants, and federated-IdP login portal — a defensive exposure finding surfacing >=3 distinct externally-exposed federated-identity/app services."
        ttp_ref: "TTP-2026-0151"
        detection_id: "bioc-cortex-asm-discovery-of-externally-exposed-federated-identity-and-app-csp-surface"

  - id: step-03
    name: "Repeated low-pressure help-desk account-recovery reconnaissance (T1598 / T1589)"
    command: |
      # SAFE-MODE: simulate the help-desk account-recovery recon burst — repeated
      # low-pressure contacts impersonating a locked-out employee, targeting the
      # ASM-exposed personnel. No help desk is actually contacted.
      echo "[CortexSim][SAFE-MODE] simulating repeated low-pressure help-desk account-recovery recon calls (impersonating a locked-out employee among exposed personnel)"
    identity: root
    mitre_technique: "T1598"
    platforms: ["linux"]
    # The help-desk-recon burst continues the same recon storyline against the
    # same target org/identities as steps 01/02 — shared_entity keeps the spine
    # connected (the IdP recovery events land on the ASM-exposed identities).
    causality:
      parent_step: step-02
      pivot: shared_entity
    expected_detections:
      - plane: ASM
        type: XQL
        description: "IdP audit stream shows a burst of repeated help-desk account-recovery / MFA-reset contacts (>=4 low-pressure contacts against a locked-out employee in a window)."
        ttp_ref: "TTP-2026-0151"
        detection_id: "xql-help-desk-account-recovery-reconnaissance-burst"
      - plane: ASM
        type: ABIOC
        description: "Auto-tuned behavioural deviation — help-desk account-recovery events cluster against ASM-exposed identities at a cadence exceeding the learned per-identity recovery baseline. No single reset is known-bad; the ABIOC anchors on the cadence deviation plus the exposure flag."
        ttp_ref: "TTP-2026-0151"
        detection_id: "abioc-anomalous-inbound-account-recovery-cadence-on-externally-exposed-personnel"

  - id: step-04
    name: "TIM attribution + terminal correlation stitches the recon storyline into one early-warning incident"
    command: |
      # SAFE-MODE: TIM attributes the stitched recon pattern to Muddled Libra /
      # Scattered Spider tradecraft; CR-ASM-0006 fuses the ASM footprint exposure,
      # help-desk profiling burst, and TIM attribution into ONE identity-takeover-
      # precursor incident that fires BEFORE the MFA-reset takeover.
      echo "[CortexSim][SAFE-MODE] SIM-ASM-006 CR-ASM-0006 recon storyline stitched — identity-takeover-precursor early warning"
    identity: root
    mitre_technique: "T1598"
    platforms: ["linux"]
    # The attribution + correlation fuse on the SAME target org/identity as the
    # upstream recon legs — shared_entity is the join key CR-ASM-0006 stitches on.
    causality:
      parent_step: step-03
      pivot: shared_entity
    expected_detections:
      - plane: ASM
        type: XQL
        description: "TIM matches the stitched recon pattern (LinkedIn-persona verification bypass + repeated help-desk profiling) to Muddled Libra / Scattered Spider tradecraft in threat_intel."
        ttp_ref: "TTP-2026-0151"
        detection_id: "xql-tim-attribution-muddled-libra-recon-tradecraft-match"
      - plane: ANALYTICS
        type: Correlation
        description: "Terminal — CR-ASM-0006 fuses ASM footprint exposure × help-desk account-recovery profiling burst × TIM Muddled Libra attribution on one target org within a 7-day window into a single identity-takeover-precursor incident that fires on the recon phase, before the downstream MFA-reset takeover."
        ttp_ref: "TTP-2026-0151"
        detection_id: "CR-ASM-0006"

cleanup:
  commands:
    - "echo '[CortexSim] SIM-ASM-006 cleanup complete (recon footprint only — no state changed)'"

