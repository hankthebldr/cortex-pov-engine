scenario_id: SIM-ASM-002
name: "ASM — Inbound Vulnerability-Scanning Reconnaissance"
version: "1.0"
status: active

plane: ASM
detection_types:
  - XQL
  - BIOC
  - IOC
  - Correlation

uc_ref: UCS-ASM-02
tc_ref: TC-ASM-02
uc_name: "Perimeter Reconnaissance Detection via Cortex ASM"
tc_name: "Active Vulnerability Scanning Against an Exposed Asset"

mitre_tactic: "TA0043"
mitre_tactic_name: "Reconnaissance"
mitre_technique: "T1595.002"
mitre_technique_name: "Active Scanning: Vulnerability Scanning"
additional_techniques:
  - technique: "T1595.001"
    name: "Active Scanning: Scanning IP Blocks"
  - technique: "T1190"
    name: "Exploit Public-Facing Application"

threat_report: "Unit42 - Attack Surface Threat Report (Internet-Exposed Assets)"
threat_report_url: "https://unit42.paloaltonetworks.com/"

execution_identity:
  default: root
  options:
    - root
    - container-runtime

push_supported: true
pull_supported: true

# ── Causality Group Owner anchor ────────────────────────────────────────────
# Outbound operator recon: the reachability probe, the nuclei vuln scan, and the
# Nikto-style sensitive-path burst are sequential execs off ONE jumpbox shell,
# not the beacon. Anchoring the CGO on that shell (bash) collapses the star into
# a connected operator-tooling spine. Detections here are NGFW traffic
# signatures (no process-actor fields), so no per-step lineage retuning applies.
cgo_anchor:
  image_name: "bash"
  primary_username: "root"

infra_modules_needed:
  - base
  - asm

external_tools:
  - name: Nuclei
    source: "https://github.com/projectdiscovery/nuclei"
    type: binary
    install_inline: false
    adapter_ref: TOOL-NUCLEI

steps:
  - id: step-01
    name: "Ground-truth — confirm the exposed perimeter web asset is reachable"
    command: |
      # Confirm the infra/modules/aws/asm exposed host is serving HTTP/HTTPS
      # before the vulnerability scan, so the POV report can attribute the
      # inbound scan to a known asset.
      curl -s -o /dev/null -w "%{http_code}\n" http://${ASM_TARGET_HOST}/ || true
    identity: root
    mitre_technique: "T1595.001"
    platforms: ["linux"]
    expected_detections:
      - plane: ASM
        type: XQL
        description: "Cortex ASM/Xpanse raised an active-scan observation tied to the exposed asset"
        ttp_ref: TTP-2026-0071
        detection_id: xql-asm-002-xpanse-active-scan-observation-tied-to-exposed-asset

  - id: step-02
    name: "nuclei CVE / exposure / default-login vulnerability scan (T1595.002)"
    command: |
      # Template-driven vulnerability scan — high-volume URI/path probing for
      # known CVEs, exposed panels, and default credentials. One source fans out
      # across many URIs against the perimeter web asset (vuln-scanner egress).
      nuclei -target http://${ASM_TARGET_HOST} -severity low,medium,high,critical \
        -t cves,exposures,default-logins,exposed-panels \
        -o /tmp/nuclei-asm-002.json -j -rate-limit 200
    identity: root
    mitre_technique: "T1595.002"
    platforms: ["linux", "windows", "macos"]
    # nuclei is a cross-platform binary; the inbound URI-fan-out the NGFW sees is
    # OS-agnostic, so the same vuln-scan detection fires whichever OS the scanner
    # runs on. The invocation is identical on Windows/macOS.
    platform_variants:
      windows: "nuclei -target http://%ASM_TARGET_HOST% -severity low,medium,high,critical -t cves,exposures,default-logins,exposed-panels -o nuclei-asm-002.json -j -rate-limit 200"
    # The nuclei scan and the step-01 reachability probe are sibling execs off the
    # same operator shell (CGO) against the same perimeter asset — shared_entity
    # (host + operator + target), not a fork — keeping the spine connected.
    causality:
      parent_step: step-01
      pivot: shared_entity
    expected_detections:
      - plane: NDR
        type: BIOC
        description: "NGFW EAL — inbound vulnerability-scan URI fan-out from one source against the perimeter asset"
        ttp_ref: TTP-2026-0071
        detection_id: bioc-asm-eal-inbound-vulnerability-scan-uri-fan-out-against-perimeter-asset
      - plane: NDR
        type: XQL
        description: "NGFW EAL — vulnerability-scan URI fan-out (1 src → many URIs on exposed host)"
        ttp_ref: TTP-2026-0071
        detection_id: xql-asm-002-vulnerability-scan-uri-fan-out-1-src-many-uris-on-exposed-host

  - id: step-03
    name: "Nikto-style sensitive-path probe burst + scanner user-agent (T1595.002)"
    command: |
      # Burst of probes for sensitive paths (/.git/config, /.env, /admin, backups)
      # carrying a recognised vulnerability-scanner user-agent — the recon
      # fingerprint the SOC must match against known mass-scanning infrastructure.
      for p in /.git/config /.env /admin /wp-login.php /server-status /phpinfo.php /.aws/credentials /backup.zip /config.php.bak; do
        curl -s -o /dev/null -w "%{http_code} ${p}\n" \
          -A "Mozilla/5.0 (Nikto/2.5.0)" http://${ASM_TARGET_HOST}${p}
      done
    identity: root
    mitre_technique: "T1595.002"
    platforms: ["linux", "windows", "macos"]
    # The sensitive-path probe burst + scanner user-agent is a shell loop on
    # Linux/macOS; PowerShell's Invoke-WebRequest with the same UA and path list
    # emits the identical inbound 4xx-burst signature the NGFW BIOC keys on.
    platform_variants:
      windows: "'/.git/config','/.env','/admin','/wp-login.php','/server-status','/phpinfo.php','/.aws/credentials','/backup.zip','/config.php.bak' | ForEach-Object { try { Invoke-WebRequest -UseBasicParsing -UserAgent 'Mozilla/5.0 (Nikto/2.5.0)' -Uri (\"http://%ASM_TARGET_HOST%\" + $_) } catch { $_.Exception.Response.StatusCode.value__ } }"
    # Another sibling exec off the operator shell (CGO) against the same asset as
    # the nuclei scan — shared_entity keeps the spine step-01 → step-02 → step-03.
    causality:
      parent_step: step-02
      pivot: shared_entity
    expected_detections:
      - plane: NDR
        type: BIOC
        description: "NGFW EAL — known vulnerability-scanner user-agent (Nikto) on the perimeter asset"
        ttp_ref: TTP-2026-0071
        detection_id: bioc-asm-eal-known-vulnerability-scanner-user-agent-on-perimeter-asset
      - plane: NDR
        type: XQL
        description: "NGFW EAL — scanner user-agent and 4xx response burst from one source"
        ttp_ref: TTP-2026-0071
        detection_id: xql-asm-002-scanner-user-agent-and-4xx-response-burst
      - plane: ASM
        type: IOC
        description: "Recon signature — Nikto web-vulnerability-scanner user-agent on inbound requests"
        ttp_ref: TTP-2026-0071
        detection_id: ioc-user-agent-nikto-2-5-0
      - plane: ASM
        type: IOC
        description: "Recon signature — probe for an exposed Git repository config (/.git/config)"
        ttp_ref: TTP-2026-0071
        detection_id: ioc-url-git-config
      - plane: ASM
        type: IOC
        description: "Recon signature — probe for an exposed dotenv secrets file (/.env)"
        ttp_ref: TTP-2026-0071
        detection_id: ioc-url-env
      - plane: ANALYTICS
        type: Correlation
        description: "Exposure Management — perimeter asset under active vulnerability scanning, stitched into one incident"
        ttp_ref: TTP-2026-0071
        detection_id: CR-ASM-0002

cleanup:
  commands:
    - "rm -f /tmp/nuclei-asm-002.json"
    - "echo '[CortexSim] SIM-ASM-002 cleanup complete'"

