scenario_id: SIM-BROWSER-004
name: "Browser — Cross-Origin SaaS Copy-Paste DLP"
version: "1.1"
status: active

plane: BROWSER
detection_types:
  - Analytics
  - BIOC

uc_ref: UCS-BROWSER-04
tc_ref: TC-BROWSER-04
uc_name: "Cross-SaaS Data Movement Detection"
tc_name: "User Copies from Sanctioned CRM, Pastes Into Personal Webmail"

mitre_tactic: "TA0010"
mitre_tactic_name: "Exfiltration"
mitre_technique: "T1567"
mitre_technique_name: "Exfiltration Over Web Service"

threat_report: "Unit42 - Insider Risk via Browser Exfil 2026"
threat_report_url: "https://unit42.paloaltonetworks.com/"

execution_identity:
  default: container-runtime
  options:
    - container-runtime

push_supported: true
pull_supported: true

required_content:
  - repo: "hankthebldr/cortex-browser-attacker"

infra_modules_needed:
  - base

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
# Rolled out per the S-07 per-plane convention
# (docs/uc_tc_mapping/scenario-methodology-defaults.md). Defaults are not
# fabricated KPIs — they map this plane to the methodology family its
# detection shape already belongs to in the v2.0 master methodology.
validation_methodology: "Prisma Browser Signal Injection & Detection Accuracy"
methodology_family: "F1"
primary_kpi: "Detection Accuracy"
threshold:
  kpi: "Detection Accuracy"
  op: "≥"
  value: 90
  unit: "%"
success_criteria: |
  The Playwright-driven browser actions produce the expected Prisma Browser
  DLP / extension / phishing detection. Detection Accuracy is the share of
  injected browser events that raise the expected alert (target ≥ 90%).
moat_tier: "LEAD"

# ── Causality contract ──────────────────────────────────────────────────────
# The managed Prisma Browser (Chromium-based) is the Causality Group Owner — the
# process that OWNS the cross-origin copy/paste chain in XSIAM's causality view,
# NOT the synthetic beacon. The pre-flight roots the chain; the browser drive
# (copy from sanctioned CRM, paste into personal webmail) is its process child;
# the stitched-incident confirmation joins back to the drive by the clipboard
# payload hash (shared_entity) — the same entity XSIAM correlates copy↔paste on.
cgo_anchor:
  image_name: "chrome"
  primary_username: "corp-user"

external_tools:
  - name: Cortex Browser Attacker
    source: "https://github.com/hankthebldr/cortex-pov-engine"
    type: script
    install_inline: false
    adapter_ref: TOOL-CORTEX-BROWSER-ATTACKER
  - name: cortex-browser-attacker
    source: "https://github.com/hankthebldr/cortex-pov-engine"
    type: binary
    install_inline: false

steps:
  - id: step-01
    name: "Pre-flight: confirm browser_attack_runner plugin is registered"
    command: |
      python3 -m scripts.eal_simulator.cli describe browser_attack_runner \
        | jq -e '.eal_targets | length > 0'
    identity: container-runtime
    mitre_technique: "T1005"
    platforms: ["linux", "container"]
    expected_detections:
      - plane: BROWSER
        type: Analytics
        description: "Pre-flight: plugin metadata visible to operator"
        ttp_ref: "TTP-2026-0020"
        detection_id: xql-pre-flight-plugin-metadata-visible-to-operator

  - id: step-02
    name: "Drive Prisma Browser: copy from CRM, paste into webmail"
    command: |
      cat > /tmp/sim-browser-004-eal.yml <<'YML'
      campaign_id: CMP-BROWSER-004
      name: "Browser — cross-origin DLP"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - crm.cortexsim-test.invalid
        - mail.cortexsim-test.invalid
      dry_run: false
      tags: [browser, dlp, cross-origin]
      steps:
        - step_id: step-01
          plugin: browser_attack_runner
          params:
            campaign_path: scenarios/browser/campaigns/saas-cross-origin-dlp.yml
            allowlist_host: crm.cortexsim-test.invalid
            browser_channel: prisma
            headless: true
            timeout_seconds: 120.0
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/sim-browser-004-eal.yml --live
    identity: container-runtime
    mitre_technique: "T1567"
    causality:
      parent_step: step-01
      pivot: process_lineage
    platforms: ["linux", "container", "windows", "macos"]
    platform_variants:
      windows: "python -m scripts.eal_simulator.cli run %TEMP%\\sim-browser-004-eal.yml --live  # browser_channel: prisma -> clipboard DLP on Windows"
      macos: "python3 -m scripts.eal_simulator.cli run /tmp/sim-browser-004-eal.yml --live  # browser_channel: prisma -> clipboard DLP on macOS"
    expected_detections:
      - plane: BROWSER
        type: BIOC
        description: "Prisma Browser — cross-origin paste from sanctioned CRM into personal webmail (DLP rule)"
        ttp_ref: "TTP-2026-0020"
        detection_id: bioc-prisma-browser-cross-origin-paste-from-sanctioned-crm-into-personal-webmail-dlp-rule
      - plane: BROWSER
        type: Analytics
        description: "Prisma Browser — clipboard origin tag mismatch with paste destination origin"
        ttp_ref: "TTP-2026-0020"
        detection_id: xql-prisma-browser-clipboard-origin-tag-mismatch-with-paste-destination-origin
      - plane: ANALYTICS
        type: Analytics
        description: "XSIAM stitching — copy + paste correlated by clipboard payload hash"
        ttp_ref: "TTP-2026-0020"
        detection_id: xql-xsiam-stitching-copy-paste-correlated-by-clipboard-payload-hash

  - id: step-03
    name: "Confirm PB → XSIAM stitched alert"
    command: |
      echo "[CortexSim] Confirm XSIAM stitched incident: clipboard-origin mismatch."
    identity: container-runtime
    mitre_technique: "T1567"
    causality:
      parent_step: step-02
      pivot: shared_entity
    platforms: ["linux", "container"]
    expected_detections:
      - plane: ANALYTICS
        type: Analytics
        description: "XSIAM — stitched cross-origin DLP incident with both origins on the timeline"
        ttp_ref: "TTP-2026-0020"
        detection_id: xql-xsiam-stitched-cross-origin-dlp-incident-with-both-origins-on-the-timeline

cleanup:
  commands:
    - "rm -f /tmp/sim-browser-004-eal.yml"

author: "Henry Reed"
created: "2026-05-05"
last_updated: "2026-05-08"
tags:
  - browser
  - prisma-browser
  - dlp
  - cross-origin
  - exfiltration
  - eal-plugin
