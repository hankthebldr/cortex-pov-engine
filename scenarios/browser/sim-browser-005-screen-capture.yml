scenario_id: SIM-BROWSER-005
name: "Browser — Screen Capture of Sensitive SaaS Page"
version: "1.1"
status: active

plane: BROWSER
detection_types:
  - Analytics
  - BIOC

uc_ref: UCS-DLP-06
tc_ref: TC-DLP-11
tc_refs:
  - TC-DLP-11
  - TC-DLP-05
pov_scenario_id: POV-SC-001
uc_name: "Data Loss Prevention (DLP)"
tc_name: "Validate DLP monitors and controls sensitive data movement across sanctioned and unsanctioned SaaS applications"

mitre_tactic: "TA0009"
mitre_tactic_name: "Collection"
mitre_technique: "T1113"
mitre_technique_name: "Screen Capture"

threat_report: "Unit42 - Insider Screen-Capture Tradecraft 2026"
threat_report_url: "https://unit42.paloaltonetworks.com/"

execution_identity:
  default: container-runtime
  options:
    - container-runtime

push_supported: true
pull_supported: true

required_content:
  - repo: "hankthebldr/cortex-browser-attacker"

infra_modules_needed:
  - base

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
# Rolled out per the S-07 per-plane convention
# (docs/uc_tc_mapping/scenario-methodology-defaults.md). Defaults are not
# fabricated KPIs — they map this plane to the methodology family its
# detection shape already belongs to in the v2.0 master methodology.
validation_methodology: "Prisma Browser Signal Injection & Detection Accuracy"
methodology_family: "F1"
primary_kpi: "Detection Accuracy"
threshold:
  kpi: "Detection Accuracy"
  op: "≥"
  value: 90
  unit: "%"
success_criteria: |
  The Playwright-driven browser actions produce the expected Prisma Browser
  DLP / extension / phishing detection. Detection Accuracy is the share of
  injected browser events that raise the expected alert (target ≥ 90%).
moat_tier: "LEAD"

external_tools:
  - name: Cortex Browser Attacker
    source: "https://github.com/hankthebldr/cortex-pov-engine"
    type: script
    install_inline: false
    adapter_ref: TOOL-CORTEX-BROWSER-ATTACKER
  - name: cortex-browser-attacker
    source: "https://github.com/hankthebldr/cortex-pov-engine"
    type: binary
    install_inline: false

# ── Causality contract ──────────────────────────────────────────────────────
# The managed Chromium-based Prisma Browser driven by the corporate user is the
# Causality Group Owner — the process that OWNS this insider collection chain,
# NOT the cortexsim-agent beacon. Browser-plane detection is on
# prisma_browser_events (SaaS/DLP events keyed by user + origin), not a process
# tree, so the connective tissue between steps is the SAME user/browser session:
# the repeat screen-capture and the resulting user-risk elevation are stitched by
# shared_entity (user), matching the correlation rule that fuses repeat captures
# into one collection incident. platforms tag the managed-browser endpoint OS.
cgo_anchor:
  image_name: "chrome"
  primary_username: "corp-user"

steps:
  - id: step-01
    name: "Pre-flight: confirm browser_attack_runner plugin is registered"
    command: |
      python3 -m scripts.eal_simulator.cli describe browser_attack_runner \
        | jq -e '.eal_targets | length > 0'
    identity: container-runtime
    mitre_technique: "T1113"
    platforms: ["linux"]
    expected_detections:
      - plane: BROWSER
        type: Analytics
        description: "Pre-flight: plugin metadata visible to operator"
        ttp_ref: "TTP-2026-0021"
        detection_id: xql-pre-flight-plugin-metadata-visible-to-operator

  - id: step-02
    name: "Drive Prisma Browser to sensitive page and attempt screen captures"
    command: |
      cat > /tmp/sim-browser-005-eal.yml <<'YML'
      campaign_id: CMP-BROWSER-005
      name: "Browser — screen capture"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - crm.cortexsim-test.invalid
      dry_run: false
      tags: [browser, screen-capture]
      steps:
        - step_id: step-01
          plugin: browser_attack_runner
          params:
            campaign_path: scenarios/browser/campaigns/screen-capture.yml
            allowlist_host: crm.cortexsim-test.invalid
            browser_channel: prisma
            headless: true
            timeout_seconds: 90.0
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/sim-browser-005-eal.yml --live
    identity: container-runtime
    mitre_technique: "T1113"
    platforms: ["windows", "macos"]
    causality:
      parent_step: step-01
      pivot: shared_entity
    expected_detections:
      - plane: BROWSER
        type: BIOC
        description: "Prisma Browser — page.screenshot() called against origin tagged sensitive — block + alert"
        ttp_ref: "TTP-2026-0021"
        detection_id: bioc-prisma-browser-page-screenshot-called-against-origin-tagged-sensitive-block-alert
      - plane: BROWSER
        type: Analytics
        description: "Prisma Browser — screen-capture-attempt counter increments under sensitive-content policy"
        ttp_ref: "TTP-2026-0021"
        detection_id: xql-prisma-browser-screen-capture-attempt-counter-increments-under-sensitive-content-policy

  - id: step-03
    name: "Confirm repeat-capture risk-score elevation"
    command: |
      echo "[CortexSim] Confirm XSIAM: user risk score elevated after repeat screen-capture attempt."
    identity: container-runtime
    mitre_technique: "T1113"
    platforms: ["windows", "macos"]
    causality:
      parent_step: step-02
      pivot: shared_entity
    expected_detections:
      - plane: BROWSER
        type: Analytics
        description: "Prisma Browser — repeat screen-capture from same user counts toward elevated risk score"
        ttp_ref: "TTP-2026-0021"
        detection_id: xql-prisma-browser-repeat-screen-capture-from-same-user-counts-toward-elevated-risk-score
      - plane: ANALYTICS
        type: Analytics
        description: "XSIAM — user risk score elevated, conditional-access policy triggered downstream"
        ttp_ref: "TTP-2026-0021"
        detection_id: xql-xsiam-user-risk-score-elevated-conditional-access-policy-triggered-downstream

cleanup:
  commands:
    - "rm -f /tmp/sim-browser-005-eal.yml /tmp/browser-005-cap*.png"

author: "Henry Reed"
created: "2026-05-05"
last_updated: "2026-05-08"
tags:
  - browser
  - prisma-browser
  - screen-capture
  - collection
  - eal-plugin
