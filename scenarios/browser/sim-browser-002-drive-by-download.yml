scenario_id: SIM-BROWSER-002
name: "Browser — Drive-by Download from Phishing Page"
version: "1.1"
status: active

plane: BROWSER
detection_types:
  - Analytics
  - BIOC

uc_ref: UCS-AES-03
tc_ref: TC-AES-06
tc_refs:
  - TC-AES-06
  - TC-DLP-01
pov_scenario_id: POV-SC-064
uc_name: "Advanced Email Security"
tc_name: "Demonstrate link-based payload detection identifies malicious URLs, drive-by downloads, and delayed weaponization (links that become malicious post-delivery)"

mitre_tactic: "TA0001"
mitre_tactic_name: "Initial Access"
mitre_technique: "T1189"
mitre_technique_name: "Drive-by Compromise"
additional_techniques:
  - technique: "T1566"
    name: "Phishing"

threat_report: "Unit42 - Drive-by Compromise Tradecraft 2026"
threat_report_url: "https://unit42.paloaltonetworks.com/"

execution_identity:
  default: container-runtime
  options:
    - container-runtime

push_supported: true
pull_supported: true

required_content:
  - repo: "hankthebldr/cortex-browser-attacker"

infra_modules_needed:
  - base

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
# Rolled out per the S-07 per-plane convention
# (docs/uc_tc_mapping/scenario-methodology-defaults.md). Defaults are not
# fabricated KPIs — they map this plane to the methodology family its
# detection shape already belongs to in the v2.0 master methodology.
validation_methodology: "Prisma Browser Signal Injection & Detection Accuracy"
methodology_family: "F1"
primary_kpi: "Detection Accuracy"
threshold:
  kpi: "Detection Accuracy"
  op: "≥"
  value: 90
  unit: "%"
success_criteria: |
  The Playwright-driven browser actions produce the expected Prisma Browser
  DLP / extension / phishing detection. Detection Accuracy is the share of
  injected browser events that raise the expected alert (target ≥ 90%).
moat_tier: "LEAD"

# ── Causality contract ──────────────────────────────────────────────────────
# The managed Prisma Browser (Chromium-based) is the Causality Group Owner — the
# initial-access process that OWNS the drive-by chain in XSIAM's causality view,
# NOT the synthetic beacon. The pre-flight, the gesture-less auto-download, and
# the WildFire-submission confirmation descend as one connected process spine
# rooted at the browser. The browser download event and the NGFW file-type
# policy hit are the two ends of one egress; the engine stitches them across the
# BROWSER↔NDR alert nodes.
cgo_anchor:
  image_name: "chrome"
  primary_username: "corp-user"

external_tools:
  - name: Cortex Browser Attacker
    source: "https://github.com/hankthebldr/cortex-pov-engine"
    type: script
    install_inline: false
    adapter_ref: TOOL-CORTEX-BROWSER-ATTACKER
  - name: cortex-browser-attacker
    source: "https://github.com/hankthebldr/cortex-pov-engine"
    type: binary
    install_inline: false

steps:
  - id: step-01
    name: "Pre-flight: confirm browser_attack_runner plugin is registered"
    command: |
      python3 -m scripts.eal_simulator.cli describe browser_attack_runner \
        | jq -e '.params_schema.properties.campaign_path'
    identity: container-runtime
    mitre_technique: "T1566"
    platforms: ["linux", "container"]
    expected_detections:
      - plane: BROWSER
        type: Analytics
        description: "Pre-flight: plugin metadata visible to operator"
        ttp_ref: "TTP-2026-0018"
        detection_id: xql-pre-flight-plugin-metadata-visible-to-operator

  - id: step-02
    name: "Drive Prisma Browser to phishing page; expect auto-download"
    command: |
      cat > /tmp/sim-browser-002-eal.yml <<'YML'
      campaign_id: CMP-BROWSER-002
      name: "Browser — drive-by download"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - phish.cortexsim-test.invalid
      dry_run: false
      tags: [browser, drive-by, download]
      steps:
        - step_id: step-01
          plugin: browser_attack_runner
          params:
            campaign_path: scenarios/browser/campaigns/drive-by-download.yml
            allowlist_host: phish.cortexsim-test.invalid
            browser_channel: prisma
            headless: true
            timeout_seconds: 90.0
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/sim-browser-002-eal.yml --live
    identity: container-runtime
    mitre_technique: "T1189"
    causality:
      parent_step: step-01
      pivot: process_lineage
    platforms: ["linux", "container", "windows", "macos"]
    platform_variants:
      windows: "python -m scripts.eal_simulator.cli run %TEMP%\\sim-browser-002-eal.yml --live  # browser_channel: prisma -> managed Prisma Browser on Windows (application/x-msdownload)"
      macos: "python3 -m scripts.eal_simulator.cli run /tmp/sim-browser-002-eal.yml --live  # browser_channel: prisma -> managed Prisma Browser on macOS (application/x-mach-binary)"
    expected_detections:
      - plane: BROWSER
        type: BIOC
        description: "Prisma Browser — auto-download initiated by JS without user gesture"
        ttp_ref: "TTP-2026-0018"
        detection_id: bioc-prisma-browser-auto-download-initiated-by-js-without-user-gesture
      - plane: BROWSER
        type: Analytics
        description: "Prisma Browser — downloaded artifact MIME application/x-msdownload from non-SaaS origin"
        ttp_ref: "TTP-2026-0018"
        detection_id: xql-prisma-browser-downloaded-artifact-mime-application-x-msdownload-from-non-saas-origin
      - plane: NDR
        type: Analytics
        description: "NGFW EAL — file-type download policy matches downloaded artifact"
        ttp_ref: "TTP-2026-0018"
        detection_id: xql-ngfw-eal-file-type-download-policy-matches-downloaded-artifact

  - id: step-03
    name: "Confirm WildFire submission path on the downloaded artifact"
    command: |
      echo "[CortexSim] PB submits downloaded artifact to WildFire."
      echo "[CortexSim] Confirm in XSIAM (manual): WildFire verdict appears within MTTD target."
    identity: container-runtime
    mitre_technique: "T1189"
    causality:
      parent_step: step-02
      pivot: process_lineage
    platforms: ["linux", "container"]
    expected_detections:
      - plane: BROWSER
        type: Analytics
        description: "PB → WildFire submission within download-policy MTTD"
        ttp_ref: "TTP-2026-0018"
        detection_id: xql-pb-wildfire-submission-within-download-policy-mttd

cleanup:
  commands:
    - "rm -f /tmp/sim-browser-002-eal.yml"

author: "Henry Reed"
created: "2026-05-05"
last_updated: "2026-05-08"
tags:
  - browser
  - prisma-browser
  - drive-by
  - phishing
  - download
  - eal-plugin
