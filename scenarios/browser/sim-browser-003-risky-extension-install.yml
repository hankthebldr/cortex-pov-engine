scenario_id: SIM-BROWSER-003
name: "Browser — Sideloaded Risky Chrome Extension"
version: "1.1"
status: active

plane: BROWSER
detection_types:
  - Analytics
  - BIOC
  - IOC

uc_ref: UCS-SCA-01
tc_ref: TC-SCA-01
tc_refs:
  - TC-SCA-01
  - TC-DLP-11
pov_scenario_id: POV-SC-012
uc_name: "Software Composition Analysis"
tc_name: "Validate Dependency Vulnerability Detection — Known CVEs detected in direct and transitive dependencies across npm, pip, Maven, Go, NuGet"

mitre_tactic: "TA0003"
mitre_tactic_name: "Persistence"
mitre_technique: "T1176"
mitre_technique_name: "Browser Extensions"

threat_report: "Unit42 - Browser Extension Threats 2026"
threat_report_url: "https://unit42.paloaltonetworks.com/"

execution_identity:
  default: container-runtime
  options:
    - container-runtime

push_supported: true
pull_supported: true

required_content:
  - repo: "hankthebldr/cortex-browser-attacker"
  - repo: "hankthebldr/cortex-malicious-agentic-pack"

infra_modules_needed:
  - base

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
# Rolled out per the S-07 per-plane convention
# (docs/uc_tc_mapping/scenario-methodology-defaults.md). Defaults are not
# fabricated KPIs — they map this plane to the methodology family its
# detection shape already belongs to in the v2.0 master methodology.
validation_methodology: "Prisma Browser Signal Injection & Detection Accuracy"
methodology_family: "F1"
primary_kpi: "Detection Accuracy"
threshold:
  kpi: "Detection Accuracy"
  op: "≥"
  value: 90
  unit: "%"
success_criteria: |
  The Playwright-driven browser actions produce the expected Prisma Browser
  DLP / extension / phishing detection. Detection Accuracy is the share of
  injected browser events that raise the expected alert (target ≥ 90%).
moat_tier: "LEAD"

# ── Causality contract ──────────────────────────────────────────────────────
# The managed Prisma Browser (Chromium-based) is the Causality Group Owner — the
# process that OWNS the extension-sideload chain in XSIAM's causality view, NOT
# the synthetic beacon. The KOI code-scan (step-01) inspects the extension
# artifact at rest; the browser sideload attempt (step-02) targets that SAME
# artifact — so they join by shared_entity (the ai-page-summarizer extension),
# not by a process fork. The post-block verification descends from the sideload
# attempt. This mirrors the code-scan → runtime-abuse relationship the sensor
# stitches on the extension id.
cgo_anchor:
  image_name: "chrome"
  primary_username: "corp-user"

external_tools:
  - name: Cortex Browser Attacker
    source: "https://github.com/hankthebldr/cortex-pov-engine"
    type: script
    install_inline: false
    adapter_ref: TOOL-CORTEX-BROWSER-ATTACKER
  - name: cortex-browser-attacker
    source: "https://github.com/hankthebldr/cortex-pov-engine"
    type: binary
    install_inline: false

steps:
  - id: step-01
    name: "Inspect the malicious extension source tree (code-scan signal)"
    command: |
      ls -la sources/cortex-malicious-agentic-pack/chrome/ai-page-summarizer/
      jq '.permissions, .host_permissions' \
        sources/cortex-malicious-agentic-pack/chrome/ai-page-summarizer/manifest.json
    identity: container-runtime
    mitre_technique: "T1176"
    platforms: ["linux", "container"]
    expected_detections:
      - plane: KOI
        type: Analytics
        description: "Code scan — extension manifest declares <all_urls> + cookies + webRequest + webRequestBlocking"
        ttp_ref: "TTP-2026-0019"
        detection_id: xql-code-scan-extension-manifest-declares-all-urls-cookies-webrequest-webrequestblocking

  - id: step-02
    name: "Attempt sideload via browser_attack_runner; expect policy block"
    command: |
      cat > /tmp/sim-browser-003-eal.yml <<'YML'
      campaign_id: CMP-BROWSER-003
      name: "Browser — risky extension install"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - chrome.cortexsim-test.invalid
      dry_run: false
      tags: [browser, extension, sideload]
      steps:
        - step_id: step-01
          plugin: browser_attack_runner
          params:
            campaign_path: scenarios/browser/campaigns/risky-extension-install.yml
            allowlist_host: chrome.cortexsim-test.invalid
            browser_channel: prisma
            headless: true
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/sim-browser-003-eal.yml --live
    identity: container-runtime
    mitre_technique: "T1176"
    causality:
      parent_step: step-01
      pivot: shared_entity
    platforms: ["linux", "container", "windows", "macos"]
    platform_variants:
      windows: "python -m scripts.eal_simulator.cli run %TEMP%\\sim-browser-003-eal.yml --live  # browser_channel: prisma -> managed-extension policy on Windows"
      macos: "python3 -m scripts.eal_simulator.cli run /tmp/sim-browser-003-eal.yml --live  # browser_channel: prisma -> managed-extension policy on macOS"
    expected_detections:
      - plane: BROWSER
        type: BIOC
        description: "Prisma Browser — sideloaded extension blocked by managed-extension policy"
        ttp_ref: "TTP-2026-0019"
        detection_id: bioc-prisma-browser-sideloaded-extension-blocked-by-managed-extension-policy
      - plane: BROWSER
        type: Analytics
        description: "Prisma Browser — extension permission risk score exceeds threshold"
        ttp_ref: "TTP-2026-0019"
        detection_id: xql-prisma-browser-extension-permission-risk-score-exceeds-threshold
      - plane: KOI
        type: Analytics
        description: "KOI — extension manifest signature does not match approved publisher list"
        ttp_ref: "TTP-2026-0019"
        detection_id: xql-koi-extension-manifest-signature-does-not-match-approved-publisher-list
      # GAP-10 — first IOC win for the BROWSER plane. The risky extension's
      # post-install C2 beacon resolves to the malicious-agentic-pack canary
      # domain (cortexsim-canary.invalid), which is a real IOC carried by the
      # sibling VS Code extension card TTP-2026-0045. Atomic indicator match.
      - plane: KOI
        type: IOC
        description: "IOC — extension post-install beacon to cortexsim-canary.invalid (agentic-pack C2 domain on TIM watchlist)"
        ttp_ref: "TTP-2026-0045"
        detection_id: ioc-domain-cortexsim-canary-invalid

  - id: step-03
    name: "Confirm post-block telemetry"
    command: |
      echo "[CortexSim] Confirm in XSIAM: extension-install-attempt event with outcome=blocked."
    identity: container-runtime
    mitre_technique: "T1176"
    causality:
      parent_step: step-02
      pivot: process_lineage
    platforms: ["linux", "container"]
    expected_detections:
      - plane: BROWSER
        type: Analytics
        description: "Browser-attacker JSONL records install_extension outcome=blocked"
        ttp_ref: "TTP-2026-0019"
        detection_id: xql-browser-attacker-jsonl-records-install-extension-outcome-blocked

cleanup:
  commands:
    - "rm -f /tmp/sim-browser-003-eal.yml"

