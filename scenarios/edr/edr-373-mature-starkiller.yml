success_criteria: 'The endpoint TTP signals injected by this scenario produce the expected

  XDR BIOC / XQL detections, and the mean time from signal emit to alert

  creation is within the MTTD budget. Each step''s expected_detections row is

  validated against dataset=xdr_data.

  '
moat_tier: LEAD
cgo_anchor:
  image_name: apache2
  primary_username: www-data
external_tools:
- name: starkiller
  source: https://github.com
  type: binary
  install_inline: false
  adapter_ref: TOOL-STARKILLER
steps:
- id: step-01
  name: Deploy preflight for starkiller (adapter-installed)
  command: echo '[SIM-EDR-373] adapter TOOL-STARKILLER provides starkiller'; id
  identity: www-data
  platforms: &id001
  - windows
  mitre_technique: T1082
- id: step-02
  name: Execute starkiller
  command: starkiller.exe
  identity: www-data
  platforms: *id001
  mitre_technique: T1059.001
  causality:
    parent_step: step-01
    pivot: process_lineage
  expected_detections:
  - plane: EDR
    type: BIOC
    description: starkiller executed by a service account
    ttp_ref: TTP-2026-0535
    detection_id: bioc-starkiller-executed-by-a-service-account-on-the-endpoint
  - plane: EDR
    type: Analytics
    description: Analytics flags the uncommon starkiller execution
    ttp_ref: TTP-2026-0535
    detection_id: xql-starkiller-execution-hunt
cleanup:
  commands:
  - echo '[CortexSim] SIM-EDR-002 cleanup complete — no artifacts to remove (all simulated to localhost)'
