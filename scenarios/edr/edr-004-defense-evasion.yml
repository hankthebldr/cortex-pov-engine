scenario_id: SIM-EDR-004
name: "Defense Evasion — Log Tampering, Timestomping, and Process Hiding"
version: "1.0"
status: active

plane: EDR
detection_types:
  - BIOC
  - XQL

uc_ref: UCS-EDR-03
tc_ref: TC-EDR-05
pov_scenario_id: POV-SC-045
uc_name: "Endpoint Detection & Response"
tc_name: "Validate causality graph provides full process chain and causality owner attribution"

mitre_tactic: "TA0005"
mitre_tactic_name: "Defense Evasion"
mitre_technique: "T1070.002"
mitre_technique_name: "Indicator Removal: Clear Linux or Mac System Logs"
additional_techniques:
  - technique: "T1070.006"
    name: "Indicator Removal: Timestomp"
  - technique: "T1562.001"
    name: "Impair Defenses: Disable or Modify Tools"
  - technique: "T1036.005"
    name: "Masquerading: Match Legitimate Name or Location"

threat_report: "Unit42 - xHunt Campaign: Attacks on Kuwait Shipping and Transportation"
threat_report_url: "https://unit42.paloaltonetworks.com/xhunt-campaign-attacks-on-kuwait-shipping/"

# ── Causality contract ──────────────────────────────────────────────────────
# xHunt operates hands-on-keyboard through a web-shell foothold. The Causality
# Group Owner is the compromised web daemon (apache2 / www-data); the anti-
# forensics actions below are sequential execs from the same operator shell it
# owns. step-01 anchors the session; the remaining evasion actions are its
# process-lineage children, so the whole track collapses into one CGO-owned
# defense-evasion chain rather than five disconnected alerts on the beacon.
cgo_anchor:
  image_name: "apache2"
  primary_username: "www-data"

execution_identity:
  default: root
  options:
    - root
    - www-data
    - svc-backup

push_supported: true
pull_supported: true

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
# Rolled out per the S-07 per-plane convention
# (docs/uc_tc_mapping/scenario-methodology-defaults.md). Defaults are not
# fabricated KPIs — they map this plane to the methodology family its
# detection shape already belongs to in the v2.0 master methodology.
validation_methodology: "Endpoint Signal Injection & Detection Accuracy"
methodology_family: "F1"
primary_kpi: "MTTD"
threshold:
  kpi: "MTTD"
  op: "≤"
  value: 300
  unit: "seconds"
success_criteria: |
  The endpoint TTP signals injected by this scenario produce the expected
  XDR BIOC / XQL detections, and the mean time from signal emit to alert
  creation is within the MTTD budget. Each step's expected_detections row is
  validated against dataset=xdr_data.
moat_tier: "LEAD"

external_tools:
  - name: Atomic Red Team
    source: "https://github.com/redcanaryco/atomic-red-team"
    type: script
    install_inline: false
    adapter_ref: TOOL-ATOMIC-RED-TEAM

steps:
  - id: step-01
    name: "Clear bash history to hide command traces"
    command: |
      echo '[*] Simulating bash history evasion techniques';
      export HISTFILE=/dev/null;
      export HISTSIZE=0;
      unset HISTFILE;
      history -c 2>/dev/null;
      echo '' > ~/.bash_history 2>/dev/null || echo '[*] History clear simulated';
      echo '[*] History evasion techniques executed'
    identity: root
    mitre_technique: "T1070.003"
    # Root step: first track-covering action of the apache2-owned operator shell.
    platforms: ["linux", "windows", "macos"]
    platform_variants:
      # SAFE-MODE (CONT-03/PUSH-14): this variant used to clear the REAL
      # Security and System logs — unrecoverable, and it destroys the very
      # telemetry the POV measures. It now clears the session's PowerShell
      # history (its own line: `& Clear-History` is not cmd) and a
      # CortexSim-owned classic event log created, written and removed in this
      # step. `wevtutil cl` is the real command line; only the target changed.
      windows: |
        Clear-History
        Remove-EventLog -LogName CortexSim-EDR004 -ErrorAction SilentlyContinue
        New-EventLog -LogName CortexSim-EDR004 -Source CortexSim-EDR004
        Write-EventLog -LogName CortexSim-EDR004 -Source CortexSim-EDR004 -EventId 1000 -EntryType Information -Message 'CortexSim SIM-EDR-004 lab-owned event, cleared next'
        wevtutil.exe cl CortexSim-EDR004
        $rc = $LASTEXITCODE
        Remove-EventLog -LogName CortexSim-EDR004
        if ($rc -ne 0) { Write-Error "wevtutil cl exited $rc"; exit $rc }
        Write-Output 'cortexsim-edr004-history-and-lab-log-cleared'
      macos: 'rm -f ~/.zsh_history && unset HISTFILE && history -c'
    expected_detections:
      - plane: EDR
        type: BIOC
        description: "Bash history clearing — HISTFILE manipulation and history -c execution detected"
        ttp_ref: "TTP-2026-0035"
        detection_id: "bioc-edr-004-bash-history-clearing-and-histfile-manipulation"
      - plane: EDR
        type: XQL
        description: "Multiple history evasion commands in sequence — anti-forensics behavior pattern"
        ttp_ref: "TTP-2026-0035"
        detection_id: "xql-edr-004-analytics-history-evasion-sequence"

  - id: step-02
    name: "Tamper with system log files"
    command: |
      echo '[*] Simulating log tampering';
      cp /var/log/auth.log /tmp/cortexsim_auth_backup 2>/dev/null;
      echo '' > /tmp/cortexsim_fake_auth.log;
      wc -l /var/log/syslog /var/log/auth.log 2>/dev/null;
      echo '[*] Log tampering simulation complete — real logs NOT modified'
    identity: root
    mitre_technique: "T1070.002"
    causality:
      parent_step: "step-01"
      pivot: "process_lineage"
    platforms: ["linux", "windows"]
    platform_variants:
      # SAFE-MODE (CONT-03/PUSH-14): used to clear the REAL Security and
      # "Windows PowerShell" logs. Same CortexSim-owned log pattern as step-01.
      windows: |
        Remove-EventLog -LogName CortexSim-EDR004 -ErrorAction SilentlyContinue
        New-EventLog -LogName CortexSim-EDR004 -Source CortexSim-EDR004
        Write-EventLog -LogName CortexSim-EDR004 -Source CortexSim-EDR004 -EventId 1000 -EntryType Information -Message 'CortexSim SIM-EDR-004 lab-owned audit stand-in, cleared next'
        wevtutil.exe gli CortexSim-EDR004
        wevtutil.exe cl CortexSim-EDR004
        $rc = $LASTEXITCODE
        Remove-EventLog -LogName CortexSim-EDR004
        if ($rc -ne 0) { Write-Error "wevtutil cl exited $rc"; exit $rc }
        Write-Output 'cortexsim-edr004-lab-log-tampered'
    expected_detections:
      - plane: EDR
        type: BIOC
        description: "System log file access and truncation attempt — log tampering to hide intrusion evidence"
        ttp_ref: "TTP-2026-0035"
        detection_id: "bioc-edr-004-system-log-access-or-truncation"
      - plane: EDR
        type: XQL
        description: "Auth.log and syslog access from non-syslog process — unauthorized log manipulation"
        ttp_ref: "TTP-2026-0035"
        detection_id: "xql-edr-004-analytics-auth-log-access-non-syslog-process"

  - id: step-03
    name: "Timestomp files to evade forensic timeline analysis"
    command: |
      echo '[*] Simulating timestomping';
      touch -t 202301010000 /tmp/cortexsim_timestomp_test 2>/dev/null;
      touch -r /usr/bin/ls /tmp/cortexsim_timestomp_test 2>/dev/null;
      stat /tmp/cortexsim_timestomp_test 2>/dev/null;
      echo '[*] Timestomping simulation complete'
    identity: root
    mitre_technique: "T1070.006"
    causality:
      parent_step: "step-01"
      pivot: "process_lineage"
    platforms: ["linux", "windows", "macos"]
    platform_variants:
      # The timestomp target used to be assumed (Get-Item on a beacon.exe that
      # nothing created, so the step always threw). It is now created first,
      # stomped to a culture-invariant date, shown, and removed.
      windows: |
        $d = Join-Path $env:TEMP 'cortexsim-edr004'
        New-Item -ItemType Directory -Force -Path $d | Out-Null
        $f = Join-Path $d 'beacon.exe'
        Copy-Item -Force -Path (Join-Path $env:SystemRoot 'System32\whoami.exe') -Destination $f
        $t = [datetime]'2023-01-01T00:00:00'
        $i = Get-Item $f
        $i.CreationTime = $t
        $i.LastWriteTime = $t
        $i.LastAccessTime = $t
        Get-Item $f | Select-Object FullName, CreationTime, LastWriteTime
        Remove-Item -Recurse -Force $d
        Write-Output 'cortexsim-edr004-timestomp-complete'
      macos: 'touch -t 202301010000 /tmp/cortexsim_timestomp_test; touch -r /bin/ls /tmp/cortexsim_timestomp_test'
    expected_detections:
      - plane: EDR
        type: BIOC
        description: "File timestamp modification via touch -t — timestomping to evade forensic analysis"
        ttp_ref: "TTP-2026-0035"
        detection_id: "bioc-edr-004-file-timestomp-via-touch"
      - plane: EDR
        type: XQL
        description: "Timestamp manipulation using reference file (-r flag) — anti-forensics file metadata spoofing"
        ttp_ref: "TTP-2026-0035"
        detection_id: "xql-edr-004-analytics-timestomp-reference-file"

  - id: step-04
    name: "Masquerade malicious process as legitimate system binary"
    command: |
      echo '[*] Simulating process name masquerading';
      cp /bin/sh /tmp/cortexsim_masq_test;
      mv /tmp/cortexsim_masq_test /tmp/[kworker/0:1] 2>/dev/null || \
        mv /tmp/cortexsim_masq_test '/tmp/systemd-journald' 2>/dev/null || \
        echo '[*] Masquerade target created as /tmp/cortexsim_masq';
      ls -la /tmp/cortexsim_masq* /tmp/\[kworker* /tmp/systemd-journal* 2>/dev/null;
      echo '[*] Process masquerading simulation complete'
    identity: root
    mitre_technique: "T1036.005"
    causality:
      parent_step: "step-01"
      pivot: "process_lineage"
    platforms: ["linux", "windows"]
    platform_variants:
      # The cmd.exe copy masquerading as svchost.exe is now deleted in-step
      # (and again by cleanup) instead of being left in the system Temp dir.
      windows: |
        copy /Y "%SystemRoot%\System32\cmd.exe" "%SystemRoot%\Temp\svchost.exe"
        dir "%SystemRoot%\Temp\svchost.exe"
        del /F /Q "%SystemRoot%\Temp\svchost.exe"
    expected_detections:
      - plane: EDR
        type: BIOC
        description: "Binary copied and renamed to match kernel thread name — process masquerading as kworker"
        ttp_ref: "TTP-2026-0035"
        detection_id: "bioc-edr-004-binary-masquerade-as-kernel-thread"
      - plane: EDR
        type: XQL
        description: "Shell binary copied to /tmp with system process name — masquerading to evade process listing"
        ttp_ref: "TTP-2026-0035"
        detection_id: "xql-edr-004-analytics-shell-binary-copied-to-system-name"

  - id: step-05
    name: "Attempt to disable security tooling"
    command: |
      echo '[*] Simulating security tool interference';
      systemctl status cortex-xdr 2>/dev/null || echo '[*] Cortex XDR service not found (expected on non-managed host)';
      iptables -L INPUT 2>/dev/null | head -5;
      echo '[*] Checking for monitoring agents...';
      ps aux | grep -E 'falcon|crowd|cortex|sentinel|cylance|carbon' | grep -v grep | head -5 || echo '[*] No EDR agents detected';
      echo '[*] Security tooling reconnaissance complete'
    identity: root
    mitre_technique: "T1562.001"
    causality:
      parent_step: "step-01"
      pivot: "process_lineage"
    platforms: ["linux", "windows", "macos"]
    platform_variants:
      # findstr exits 1 on no match — the expected result on a host with none
      # of these products — which fail-fast read as a failed step. Discovery is
      # the TTP; its exit code is not, so it is reset (SIM-MP-029 precedent).
      windows: |
        tasklist.exe | findstr.exe /I "cortex traps falcon sentinel cylance carbon defender"
        $global:LASTEXITCODE = 0
        Write-Output 'cortexsim-edr004-security-tool-discovery-complete'
      macos: 'ps aux | grep -E "cortex|falcon|sentinel|carbon" | grep -v grep'
    expected_detections:
      - plane: EDR
        type: BIOC
        description: "Security product enumeration — process search for EDR/AV agent names indicates evasion preparation"
        ttp_ref: "TTP-2026-0035"
        detection_id: "bioc-edr-004-security-product-enumeration"
      - plane: EDR
        type: XQL
        description: "Systematic security tool discovery via process listing — pre-evasion reconnaissance behavior"
        ttp_ref: "TTP-2026-0035"
        detection_id: "xql-edr-004-analytics-security-tool-discovery-via-process-listing"

cleanup:
  commands:
    - "rm -f /tmp/cortexsim_auth_backup /tmp/cortexsim_fake_auth.log /tmp/cortexsim_timestomp_test"
    - "rm -f '/tmp/[kworker/0:1]' '/tmp/systemd-journald' /tmp/cortexsim_masq*"
    # Windows teardown for a step interrupted before its in-step delete. The
    # bash bundle runs these lines too (as command-not-found) under set -u, so
    # none carries a `$`: a double-quoted "$env:TEMP" raises `env: unbound
    # variable` there and ends cleanup() before the lines after it.
    - "Remove-EventLog -LogName CortexSim-EDR004 -ErrorAction SilentlyContinue"
    - "del /F /Q %SystemRoot%\\Temp\\svchost.exe"
    - 'cmd.exe /c if exist "%TEMP%\cortexsim-edr004" rd /s /q "%TEMP%\cortexsim-edr004"'
    - "echo '[CortexSim] SIM-EDR-004 cleanup complete'"

