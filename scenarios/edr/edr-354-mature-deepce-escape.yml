scenario_id: SIM-EDR-354
name: Container Breakout Enumeration via Staged DEEPCE
version: '1.0'
status: active
plane: EDR
detection_types:
- BIOC
- XQL
- Analytics
- ABIOC
- IOC
uc_ref: UCS-EDR-03
tc_ref: TC-EDR-05
tc_refs:
- TC-EDR-05
- TC-EDR-03
pov_scenario_id: POV-SC-045
uc_name: Endpoint Detection & Response
tc_name: Validate causality graph provides full process chain and causality owner attribution
mitre_tactic: TA0007
mitre_tactic_name: Discovery
mitre_technique: T1611
mitre_technique_name: System Information Discovery
additional_techniques:
- technique: T1083
  name: File and Directory Discovery
- technique: T1057
  name: Process Discovery
- technique: T1548.001
  name: 'Abuse Elevation Control Mechanism: Setuid and Setgid'
- technique: T1518.001
  name: 'Software Discovery: Security Software Discovery'
- technique: T1059.004
  name: 'Command and Scripting Interpreter: Unix Shell'
threat_report: 'Unit42 - Hildegard: New TeamTNT Cryptojacking Malware Targeting Kubernetes'
threat_report_url: https://unit42.paloaltonetworks.com/hildegard-malware-teamtnt/
execution_identity:
  default: www-data
  options:
  - www-data
  - nobody
push_supported: true
pull_supported: true
cgo_anchor:
  image_name: apache2
  primary_username: www-data
external_tools:
- name: deepce
  source: https://github.com/stealthcopter/deepce
  type: script
  install_inline: false
  adapter_ref: TOOL-DEEPCE
validation_methodology: Timeline Completeness
methodology_family: F1
primary_kpi: Causality Chain Completeness
threshold:
  kpi: Causality Chain Completeness
  op: ≥
  value: 95
  unit: '%'
success_criteria: 'Cortex XDR walks the causality chain from the enumeration burst back to the

  apache2 causality group owner, with the www-data effective username, the

  interpreter spawn, the staged-tool process, and the file-read fan-out all

  present and in correct temporal order. Behavioural detections

  (service-account interpreter spawn, discovery-binary breadth, SUID sweep,

  /proc + /etc read fan-out, process-table snoop) fire on the tool''s BEHAVIOUR.

  The two filename-keyed detections on TTP-2026-0176 are recorded separately:

  they fire on the canonical run and are EXPECTED NOT TO FIRE under a renamed

  run. If only the filename-keyed detections fire, the finding is that the

  customer''s endpoint coverage is name-keyed, not that the TTP did not run.

  '
moat_tier: MOAT
steps:
- id: step-01
  name: Shelf preflight — refuse to proceed without the staged deepce.sh (fail loudly)
  command: '[ -s /tmp/deepce.sh ] || { echo ''[SIM-EDR-354][FATAL] PAYLOAD_NOT_STAGED_ON_TARGET:/tmp/deepce.sh''
    >&2; echo ''[SIM-EDR-354] TTP did NOT run; absent detections are NOT a Cortex miss'' >&2; exit 1;
    }

    sha256sum /tmp/deepce.sh; id'
  identity: www-data
  platforms:
  - linux
  - container
  mitre_technique: T1082
- id: step-02
  name: Execute the staged deepce.sh to enumerate escape paths
  command: 'sh /tmp/deepce.sh --no-color   # enumerate container-escape paths (docker.sock, caps, mounts)'
  identity: www-data
  platforms:
  - linux
  - container
  mitre_technique: T1611
  causality:
    parent_step: step-01
    pivot: process_lineage
  expected_detections:
  - plane: EDR
    type: BIOC
    description: deepce.sh executed from /tmp/deepce.sh by a service account
    ttp_ref: TTP-2026-0516
    detection_id: bioc-payload-shelf-tool-deepce-sh-executed-from-a-writable-path-by-a-service-account
  - plane: EDR
    type: Analytics
    description: Analytics flags the uncommon tool execution
    ttp_ref: TTP-2026-0516
    detection_id: xql-staged-deepce-sh-execution-on-the-endpoint-feed
cleanup:
  commands:
  - rm -f /tmp/linpeas.sh /tmp/linpeas_output.txt /tmp/pspy64 /tmp/suid3num.py
  - echo '[CortexSim] SIM-EDR-022 cleanup complete — read-only enumeration only, nothing was exploited'
author: Henry Reed
created: '2026-08-05'
last_updated: '2026-08-05'
tags:
