# sshpass credential-stuffing burst against a host that cannot be reached.
#
# Subject: the built-in Cortex XDR Analytics BIOC "Suspicious sshpass command
# execution". Its reference page describes it in one sentence: "The sshpass
# command was executed, This could be an attempt to check for credential
# stuffing." The page publishes no trigger predicate, threshold, field name or
# indicator and names no actor, so this file has no indicators block and
# attributes nothing to anyone.
#
# What is real and what never happens:
#   REAL    the candidate list written to disk, six executions of the real
#           sshpass binary (three with -p, three with -f), the OpenSSH client
#           that each one starts, and the removal of the files afterwards.
#   NEVER   an SSH session, an authentication exchange or a connection of any
#           kind. The only destination is one name under .invalid, which cannot
#           resolve (RFC 6761). Every ssh must end 255 AND print its own
#           "Could not resolve hostname" line, or the step stops. ssh runs
#           with BatchMode=yes, so it never prompts and no pair can be offered
#           to anything. Step-01 and step-02 both check first that the name
#           has no address, and no sshpass is run if it has one.
#
# The six user and password pairs are lab strings written for this scenario.
# They are not credentials and were not published by anyone.
#
# The order of the steps and the removal step are our composition, not the
# page's. T1070.004 on step-03 is our mapping.
#
# Sandbox. Every artifact lives under /var/tmp/.cortexsim-sshpass. /var/tmp is
# world-writable and that name is predictable, so step-01 creates the
# directory with mkdir and no -p (it stops if anything is already there after
# the remove), and step-02, step-03 and the cleanup go on only when one lstat
# of the path says: a real directory, owned by the running user, mode 700.
# That guard is a check of the path, made once per step. It holds where
# /var/tmp is sticky (mode 1777, as read back on the lab endpoint), because
# there nobody else can rename or remove a directory that root owns. Under a
# parent that is world-writable and not sticky, the path can be swapped after
# the check, and no check of a path can prevent that. One run of this scenario
# per endpoint at a time. The ssh calls read no ssh configuration
# (-F /dev/null), write no known_hosts file (the user and global known_hosts
# files are /dev/null), use no agent and no identity file. Nothing under a
# home directory is read or written.
#
# Dependency. sshpass is ABSENT on the lab endpoint (read back 2026-11-13: the
# package is not installed; the OpenSSH 9.6p1 client is present). The operator
# installs the package sshpass before the run. No step installs anything and
# nothing stands in for the binary. On an endpoint without it a pull run
# executes nothing and all six rows read not_executed, never missed: see the
# comment on step-01's requires_interpreters. The burst has not been run
# anywhere yet.
#
# Timing. Steps are spaced 40 s apart because back-to-back steps lost telemetry
# in this lab (2026-11-11). Six attempts two seconds apart is far smaller and
# slower than a stuffing run: do not read this run's size or pace as an
# attacker's.
scenario_id: SIM-EDR-029
name: "sshpass Credential-Stuffing Burst Against an Unreachable Host — Six Real sshpass Runs Around the OpenSSH Client (-p and -f forms) at One .invalid Name"
version: "1.0"
status: active

plane: EDR
detection_types:
  - ABIOC
  - XQL
  - Correlation

# ── UC/TC Alignment ─────────────────────────────────────────────────────────
# The binding SIM-EDR-001, SIM-EDR-002 and SIM-EDR-010 use: TC-EDR-03 for the
# behavioral method (sshpass is a packaged binary, so only its behaviour can
# flag it) and TC-EDR-05 for the shell to sshpass to ssh process chain. Both
# rows are already evidenced: depth, not new index breadth.
uc_ref: UCS-EDR-02
tc_ref: TC-EDR-03
tc_refs:
  - TC-EDR-03
  - TC-EDR-05
pov_scenario_id: POV-SC-021
uc_name: "Endpoint Detection & Response"
tc_name: "Validate multi-method malware detection (local sandbox, behavioral, static analysis)"

mitre_tactic: "TA0006"
mitre_tactic_name: "Credential Access"
mitre_technique: "T1110.004"
mitre_technique_name: "Brute Force: Credential Stuffing"
additional_techniques:
  - technique: "T1070.004"
    name: "Indicator Removal: File Deletion"

threat_report: "Cortex XDR Analytics Alert Reference — Suspicious sshpass command execution"
threat_report_url: "https://cortex-docs.paloaltonetworks.com/analytics-alerts/alerts-by-name/suspicious-sshpass-command-execution"

# ── Causality contract ──────────────────────────────────────────────────────
# An intruder who holds a root shell on a Linux host (a stolen SSH session)
# uses it as the launch point for a stuffing run at another host. cgo_anchor
# labels SimCore's own causality graph and sets the anchor shell's argv[0]. It
# does NOT change the tenant's CGO: in the 2026-11-11 lab every beacon-run step
# carried causality_actor_process_image_name = cortexsim-agent, so no query
# here keys on the anchor name. step-01 is the single root.
cgo_anchor:
  image_name: "sshd"
  primary_username: "root"

# Every step runs as root/direct. The lab endpoint has no service accounts
# provisioned, so direct root is the identity the harness can honour there.
# Nothing in the chain needs root.
execution_identity:
  default: root
  options:
    - root

# Push works: the chain is synchronous, so the bundle's exit trap runs the
# cleanup only after every step has finished. A push bundle does not read
# requires_interpreters or timeout_seconds. Step-01 and step-02 check for
# sshpass and ssh themselves and exit 127 without them, the entries below make
# the bundle log a missing dependency before any step runs, and each attempt
# is stopped by its own watchdog.
push_supported: true
pull_supported: true

# Prerequisites the operator installs on the endpoint (packages sshpass and
# openssh-client). Neither is downloaded or installed by this scenario.
external_tools:
  - name: sshpass
    source: "https://manpages.ubuntu.com/manpages/noble/man1/sshpass.1.html"
    type: binary
    install_inline: false
  - name: ssh
    source: "https://manpages.ubuntu.com/manpages/noble/man1/ssh.1.html"
    type: binary
    install_inline: false

infra_modules_needed:
  - base
  - edr

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
validation_methodology: "Signal Injection & Detection Accuracy"
methodology_family: "F1"
primary_kpi: "Detection Accuracy"
threshold:
  kpi: "Detection Accuracy"
  op: "≥"
  value: 16
  unit: "%"
success_criteria: |
  Six step-detections are declared, of two kinds.
  Alert-backed (2 of 6), both on step-02:
  (1) The built-in XDR Analytics BIOC "Suspicious sshpass command execution"
  (Low). Declared from its reference page: test period N/A (single event),
  required data XDR Agent, and a description that names the behaviour step-02
  performs for real, "The sshpass command was executed". The page also states
  a 14-day activation period, a 30-day training period and a one-day
  deduplication period, and publishes no trigger predicate. The alert has not
  been observed in a lab run.
  (2) Correlation CR-EDR-0029 (Medium). It fires ONLY if the operator installs
  it before the run, from TTP-2026-0555: alert name exactly the rule name,
  severity Medium, scheduled every 10 minutes, query time frame 1 hour,
  agent_hostname mapped to Host Name and agent_id mapped to Agent ID, no MITRE
  tag. CortexSim never writes it to the tenant, and its XQL has not been run
  in any tenant.
  Tier-2-verify-only (4 of 6): the XQL rows on step-01, step-02 (two) and
  step-03. They are scored by POST /api/runs/{id}/verify, over the time
  window of the pull run itself. They never raise Detection Accuracy.
  PASS: Detection Accuracy of at least 16%, which is one alert-backed row of
  six (16.7%). Detection Accuracy counts only alert-backed observations, so
  the ceiling is 33.3% (2 of 6) and needs CR-EDR-0029 installed. The bar can
  be cleared by CR-EDR-0029 alone: whether the built-in alert fired is read
  from the ABIOC row of step-02, not from the verdict. With no alert-backed
  observation the value is withheld and the verdict stays pending. A built-in
  row that stays silent is held pending (ANALYTICS_ACTIVATION_PERIOD) and
  leaves the denominator, unless the run's tenant is attested soakless, in
  which case it reads missed. The bound index row carries a qualitative
  threshold, so a machine PASS is recorded as not_applicable (evidence, not a
  scored pass); a FAIL stands.
  A run whose step-02 ended 10, 11 or 12 ran no complete burst: its step-02
  rows are void whatever they read. Fix the endpoint and re-run. 10 is a
  resolver that answers for the .invalid name, or one too slow to trust; 11
  is an attempt that did not end as a failed name lookup; 12 is a burst that
  was cut short. The engine has no way to mark such rows void: once the
  window closes it writes the Correlation row and the two step-02 XQL rows
  as missed or failed, while the run verdict stays pending. Read them as
  void. The same lookup check runs at the end of step-01, so a resolver
  problem normally stops the chain there with exit 10. In a pull run step-02
  and step-03 are then never run and their rows leave the denominator. A
  push bundle still runs both: each waits out its dwell and exits 1 at its
  sandbox check.
  Operator prerequisites on the endpoint: sshpass (package sshpass; 1.09-1 on
  Ubuntu 24.04; apt-get install sshpass) and the OpenSSH client (package
  openssh-client). Read back from the lab endpoint on 2026-11-13: sshpass is
  ABSENT (the package is not installed), the OpenSSH 9.6p1 client is present,
  the resolver is 127.0.0.53 with search ".", `getent hosts` on a .invalid
  name returns 2 at once, and /var/tmp is mode 1777 without noexec. No step
  installs sshpass. Check it with `command -v sshpass`. Do not run it by hand
  before the scenario: an execution may raise the alert then and start its
  one-day deduplication period. The burst has not been run anywhere yet.
  One run of this scenario per endpoint at a time: every run uses the same
  sandbox path, and a step checks that the sandbox is its own only once,
  when it starts.
  Without sshpass or ssh, a pull run executes nothing: the beacon does not
  run step-01 (RUNTIME_DEPENDENCY_MISSING, exit 127) and all six rows read
  not_executed, not missed. A push bundle prints the same marker from
  step-01, exits it with 127 and writes nothing.
  Do not read the advisory preflight for this scenario. GET
  /api/agents/{id}/preflight and Run.runtime_dependency_gaps report
  ready: false with sshpass and ssh missing on EVERY endpoint, including one
  that has both, because the beacon advertises only python, perl, ruby and
  node. The launch is not refused; the beacon's own check at run time decides.
  Deduplication and spacing: the page's deduplication period is 1 Day and it
  does not say what the deduplication is keyed on, so run this at most once a
  day per endpoint when the built-in row is the point. Keep 75 minutes between
  runs for CR-EDR-0029: it looks back one hour on a 10-minute schedule and
  would raise an issue again for the earlier run.
  What the chain cannot show: a case from the built-in alert. It is Low, and
  only Medium-or-higher issues create a case or join one. CR-EDR-0029, when
  installed, is the chain's only Medium issue; nothing else here can join a
  case it opens.
  What never happens: an SSH session or a connection. The only destination is
  one name under .invalid. An attempt counts only when ssh itself reports
  that it could not resolve the hostname, and ssh runs with BatchMode=yes,
  so it never prompts and no pair can be offered to anything.
moat_tier: "PARITY"

# Sandbox layout (every step re-states the root; each step is its own shell):
#   /var/tmp/.cortexsim-sshpass/candidates.txt   six user:password pairs (lab strings)
#   /var/tmp/.cortexsim-sshpass/pw-<n>.txt       password file of an -f attempt (n = 2, 4, 6)
#   /var/tmp/.cortexsim-sshpass/attempt.err      stderr of the attempt in progress
#   /var/tmp/.cortexsim-sshpass/attempt.pid      pid of the attempt in progress, removed when it ends
#   /var/tmp/.cortexsim-sshpass/attempt.killed   flag left by the watchdog when it stops an attempt
#   /var/tmp/.cortexsim-sshpass/burst.log        one line per attempt: form, user, exit code, lookup
#   /var/tmp/.cortexsim-sshpass/burst.done       written when all six attempts ended as failed lookups
steps:
  - id: step-01
    name: "Stage six candidate user and password pairs in a hidden sandbox directory"
    # What the sensor records: FILE_CREATE_NEW / FILE_WRITE on
    # <sandbox>/candidates.txt by the step shell and cat (both sub-types were
    # recorded under /var/tmp in this lab on 2026-11-11), then a getent
    # process start and its failed lookup of the .invalid name (read back on
    # the lab endpoint on 2026-11-13: `getent hosts` on a .invalid name
    # returns 2 at once; this check uses ahosts, the lookup ssh itself makes).
    # Also started, and matched by no declared filter: rm, mkdir, chmod, wc,
    # ls, date and timeout. No built-in alert is expected on a file write in
    # a sandbox. This is the root step.
    # Exit code: 0 when the list is staged and the .invalid name has no
    # address. 127 when sshpass or ssh is absent (push only; a pull run is
    # stopped earlier, by the beacon). 1 when something else exists at the
    # sandbox path after the remove. 10 when the .invalid name resolved or its
    # lookup was slow: the sandbox is removed and the chain stops here. In a
    # pull run step-02 and step-03 are then never run. A push bundle still
    # runs both: each waits out its dwell and exits 1 at its sandbox check.
    # Bound: no dwell; the lookup check is stopped after 10 s and killed 2 s
    # later, so at most 13 s.
    command: |
      # REAL directory and file writes. The six pairs below are lab strings
      # written for this scenario: not credentials, not published by anyone.
      set -eu
      D=/var/tmp/.cortexsim-sshpass
      H=ssh-gw.cortexsim-canary.invalid
      # The chain needs sshpass and the OpenSSH client at step-02. A pull run
      # does not reach this line without them: the beacon checks
      # requires_interpreters first and does not run the step. A push bundle
      # does not read that field, so the step refuses here itself, before
      # anything is written.
      for tool in sshpass ssh; do
        if ! command -v "$tool" >/dev/null 2>&1; then
          echo "!! RUNTIME_DEPENDENCY_MISSING: $tool (checked by the step itself; nothing was executed). This is an ENVIRONMENT gap, not a detection result." >&2
          exit 127
        fi
      done
      # The sandbox root is created atomically: no -p, so the step stops if
      # anything exists at the path after the remove. /var/tmp is
      # world-writable and this name is predictable; a directory that someone
      # else made is never adopted.
      rm -rf "$D"
      mkdir -m 700 "$D" || { echo "[CortexSim] SIM-EDR-029 step-01: something else exists at $D after the remove; it is not adopted" >&2; exit 1; }
      cat > "$D/candidates.txt" <<'EOF'
      cs-lab-user-01:CortexSim-Lab-Not-A-Password-01
      cs-lab-user-02:CortexSim-Lab-Not-A-Password-02
      cs-lab-user-03:CortexSim-Lab-Not-A-Password-03
      cs-lab-user-04:CortexSim-Lab-Not-A-Password-04
      cs-lab-user-05:CortexSim-Lab-Not-A-Password-05
      cs-lab-user-06:CortexSim-Lab-Not-A-Password-06
      EOF
      chmod 600 "$D/candidates.txt"
      test "$(wc -l < "$D/candidates.txt")" -eq 6
      ls -la "$D"
      # Fail closed, here as well as in step-02, so that a resolver problem
      # stops the chain before the burst step is reached. A name under
      # .invalid must have no address (RFC 6761). getent exit 2 means none
      # came back: the name does not exist, or no resolver answered. Either
      # way ssh gets nothing to connect to. Any other answer, or one that
      # took more than 8 s, stops the chain.
      RES_OPTIONS="timeout:1 attempts:1"
      export RES_OPTIONS
      t0=$(date +%s)
      rc=0
      timeout -k 2 10 getent ahosts "$H" >/dev/null 2>&1 || rc=$?
      waited=$(( $(date +%s) - t0 ))
      if [ "$rc" -ne 2 ] || [ "$waited" -gt 8 ]; then
        echo "[CortexSim] refuse: the lookup of $H ended rc=$rc after ${waited}s. Only rc=2 (no address) within 8 s is safe. The sandbox is removed and the chain stops here." >&2
        rm -rf "$D"
        exit 10
      fi
      echo "[CortexSim] SIM-EDR-029 step-01: six candidate pairs staged in $D/candidates.txt (lab strings, not credentials); $H has no address"
    identity: root
    mitre_technique: "T1110.004"
    platforms: ["linux"]
    # Neither name is an interpreter, and this step runs neither. The field is
    # used because the beacon resolves a name it has no alias table for by
    # looking up that literal name on PATH (agent/executor/interpreter.go,
    # ResolveInterpreter), and declaring it on the first step means a host
    # that cannot run the burst executes nothing. When sshpass or ssh is
    # absent the beacon never runs this command: it reports
    # "!! RUNTIME_DEPENDENCY_MISSING: <name>" with exit 127, records this step
    # not_run / TOOL_ABSENT and the later steps UPSTREAM_NOT_EXECUTED, and all
    # six rows read not_executed and leave the denominator. It installs
    # nothing, even in a run authorised for runtime installs, because it maps
    # no package to either name.
    # Known limit: SimCore's advisory preflight (GET /api/agents/{id}/preflight
    # and Run.runtime_dependency_gaps) compares against a roster in which the
    # beacon advertises only python, perl, ruby and node, so it lists these
    # two names as missing on every endpoint, including one that has them. It
    # does not refuse the launch; the beacon's live check decides.
    requires_interpreters: ["sshpass", "ssh"]
    expected_detections:
      - plane: EDR
        type: XQL
        description: "Validation — the candidate pair list is written inside the sandbox directory. Tier-2 verify only"
        ttp_ref: "TTP-2026-0555"
        detection_id: xql-edr-029-candidate-pair-list-written-in-the-sandbox
        verification_xql: |
          dataset = xdr_data
          | filter event_type = ENUM.FILE and event_sub_type in (ENUM.FILE_CREATE_NEW, ENUM.FILE_WRITE)
          | filter action_file_path = "/var/tmp/.cortexsim-sshpass/candidates.txt"
          | fields _time, agent_hostname, actor_causality_id, actor_process_image_name, event_sub_type, action_file_path

  - id: step-02
    name: "Credential-stuffing burst: six real sshpass runs around the OpenSSH client against one .invalid name (three with -p, three with -f)"
    # What the sensor records: six PROCESS_START events for sshpass, three
    # whose command line carries -p and a lab password string and three that
    # carry -f and a password file path, and six for the ssh client that
    # sshpass starts, each with the option list and
    # <user>@ssh-gw.cortexsim-canary.invalid. sshpass is started in the
    # background by the step shell, so the shell is still its parent.
    # Expected and not yet observed in this lab: actor_process_image_name =
    # sshpass on the ssh starts. Each ssh ends at the name lookup, so there is
    # no connection, no network row and no SSH session; in this lab a failed
    # lookup of a .invalid name did not raise the rare-host Analytics BIOC.
    # Also started, and matched by no declared filter. Once: sleep (the
    # dwell), stat, id, timeout, getent and date. For each attempt: date, rm
    # twice (attempt.err and attempt.killed before, attempt.pid after; never
    # candidates.txt, which is what the step-03 row keys on), cat, grep, the
    # watchdog's sleep 10 and the pacing sleep 2, and chmod on the three -f
    # attempts. A stopped attempt adds grep and sleep from the watchdog.
    # The built-in alert is declared here because this is the one step that
    # executes sshpass, which is the behaviour its reference page names.
    # Exit code: 0 when all six runs ended 255 and each ssh printed its own
    # "Could not resolve hostname" line. 255 alone is not enough: ssh also
    # gives it for a refused or timed-out connection. 1 when one lstat of the
    # sandbox path does not say: a directory, owned by the running user, mode
    # 700. 127 when sshpass or ssh is absent. 129, 130 or 143 when the step
    # shell is told to stop (HUP, INT, TERM): it stops the attempt in flight,
    # kills it 2 s later if it is still there, and removes the sandbox.
    # 10 when the .invalid name resolved or its lookup was slow, so
    # no sshpass was run. 11 when an attempt ended in any other way below 126,
    # or ended 255 without that line: 0 would mean a session opened, 1 to 7
    # are sshpass's own failures. 12 when the burst was cut short: an attempt
    # was stopped by its watchdog, the list was not the six lab pairs, or the
    # start deadline passed. An attempt that ended 126 or above (and not 255)
    # keeps its code: 126 when sshpass was not allowed to run, 128 + N when a
    # signal ended it. None of these is masked, and on every one of them the
    # step removes the sandbox itself, because a pull run executes no cleanup.
    # Bound, worst case 115 s: 40 s dwell; the lookup check must answer
    # within 8 s or the step stops (by 53 s); no attempt starts later than
    # 60 s after the check began; an attempt still running after 10 s is
    # stopped, and killed 2 s later, by a watchdog that the step shell starts
    # beside it (no process sits between the shell and sshpass). So the last
    # attempt is over at most 40 + 60 + 12 = 112 s into the step, and the
    # step ends within 3 s of that. About 55 s where the lookup fails at
    # once. timeout_seconds below is the beacon's own stop in a pull run. A
    # push bundle has no step timeout, so there the watchdog and the lookup
    # cap are the bound. ConnectTimeout=3 bounds a connection, and none is
    # made; ssh has no timeout for a name lookup.
    command: |
      # REAL sshpass and OpenSSH client processes. No session opens and no
      # pair is offered to anything: the only destination is one name under
      # .invalid.
      set -eu
      sleep 40   # dwell: back-to-back steps lost telemetry in this lab (2026-11-11)
      D=/var/tmp/.cortexsim-sshpass
      [ "$(stat -c %F:%u:%a "$D" 2>/dev/null)" = "directory:$(id -u):700" ] || { echo "sandbox $D is missing or not ours: step-01 did not complete" >&2; exit 1; }
      H=ssh-gw.cortexsim-canary.invalid
      # The sandbox is ours from here on. Every exit, and HUP, INT or TERM,
      # goes through on_exit: an attempt still in flight is stopped, and
      # killed 2 s later if it is still there (both only while its command
      # line still names the .invalid host), its watchdog is stopped, and on
      # any exit other than 0 the sandbox is removed. So a refused, cut-short
      # or interrupted burst leaves nothing behind and nothing running.
      pid=
      dog=
      on_exit() {
        xrc=$?
        if [ -n "$pid" ] && grep -qF "$H" "/proc/$pid/cmdline" 2>/dev/null; then
          kill "$pid" 2>/dev/null || true
          sleep 2
          if grep -qF "$H" "/proc/$pid/cmdline" 2>/dev/null; then kill -9 "$pid" 2>/dev/null || true; fi
        fi
        [ -z "$dog" ] || kill "$dog" 2>/dev/null || true
        [ "$xrc" -eq 0 ] || rm -rf "$D"
      }
      trap on_exit EXIT
      trap 'exit 129' HUP
      trap 'exit 130' INT
      trap 'exit 143' TERM
      for tool in sshpass ssh; do
        if ! command -v "$tool" >/dev/null 2>&1; then
          echo "!! RUNTIME_DEPENDENCY_MISSING: $tool (checked by the step itself; nothing was executed). This is an ENVIRONMENT gap, not a detection result." >&2
          exit 127
        fi
      done
      if [ ! -s "$D/candidates.txt" ]; then
        echo "[CortexSim] SIM-EDR-029 step-02: no candidate list from step-01, so there is nothing to run" >&2
        exit 12
      fi
      # Fail closed, as at the end of step-01. A name under .invalid must have
      # no address (RFC 6761). On a resolver that rewrites NXDOMAIN it would
      # have one, and ssh would connect to whatever came back. getent exit 2
      # means no address came back: the name does not exist, or no resolver
      # answered. Either way ssh gets nothing to connect to. Any other
      # answer, or one that took more than 8 s, stops the step.
      RES_OPTIONS="timeout:1 attempts:1"
      export RES_OPTIONS
      t0=$(date +%s)
      rc=0
      timeout -k 2 10 getent ahosts "$H" >/dev/null 2>&1 || rc=$?
      waited=$(( $(date +%s) - t0 ))
      if [ "$rc" -ne 2 ] || [ "$waited" -gt 8 ]; then
        echo "[CortexSim] refuse: the lookup of $H ended rc=$rc after ${waited}s. Only rc=2 (no address) within 8 s is safe, so no sshpass was run." >&2
        exit 10
      fi
      # One option list for every attempt: no ssh configuration file, no
      # agent, no identity file, no known_hosts file. BatchMode=yes: ssh
      # never prompts, so sshpass is never asked for the string it holds and
      # no pair can be offered to a host even if one answered.
      set -- -F /dev/null -o BatchMode=yes -o ConnectTimeout=3 -o ConnectionAttempts=1 \
        -o PreferredAuthentications=password -o PubkeyAuthentication=no \
        -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no \
        -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null \
        -o IdentityAgent=none -o IdentityFile=/dev/null -o LogLevel=ERROR
      : > "$D/burst.log"
      n=0
      while IFS=: read -r user secret; do
        [ -n "$user" ] || continue
        n=$((n + 1))
        case "$user:$secret" in
          cs-lab-user-0[1-6]:CortexSim-Lab-Not-A-Password-0[1-6]) ;;
          *) echo "[CortexSim] line $n of the candidate list is not one of the six lab pairs: stopping" >&2; exit 12 ;;
        esac
        if [ $(( $(date +%s) - t0 )) -gt 60 ]; then
          echo "[CortexSim] attempt $n would start more than 60 s after the lookup check began: stopping, name lookups on this host are too slow" >&2
          exit 12
        fi
        rm -f "$D/attempt.err" "$D/attempt.killed"
        # Each run is started in the background so that it can be stopped.
        # The step shell is still its parent. "--" ends ssh's options, so the
        # destination can never be read as one.
        if [ $((n % 2)) -eq 1 ]; then
          form=-p
          sshpass -p "$secret" ssh "$@" -- "$user@$H" true < /dev/null 2> "$D/attempt.err" &
        else
          form=-f
          printf '%s\n' "$secret" > "$D/pw-$n.txt"
          chmod 600 "$D/pw-$n.txt"
          sshpass -f "$D/pw-$n.txt" ssh "$@" -- "$user@$H" true < /dev/null 2> "$D/attempt.err" &
        fi
        pid=$!
        # Watchdog. After 10 s it stops the run, and 2 s later kills it, but
        # only while that pid is still this run (its command line names the
        # .invalid host). It leaves a flag first, so a stopped run is never
        # counted. It is itself stopped as soon as the run has ended; at
        # worst a sleep of its own lingers for under 10 s. s is cleared once
        # that sleep has been reaped, so the trap never signals a pid that is
        # no longer the watchdog's own.
        (
          trap - EXIT HUP INT
          s=
          trap '[ -z "$s" ] || kill "$s" 2>/dev/null; exit 0' TERM
          sleep 10 &
          s=$!
          wait "$s" || true
          s=
          if grep -qF "$H" "/proc/$pid/cmdline" 2>/dev/null; then
            : > "$D/attempt.killed"
            kill "$pid" 2>/dev/null || true
            sleep 2
            if grep -qF "$H" "/proc/$pid/cmdline" 2>/dev/null; then kill -9 "$pid" 2>/dev/null || true; fi
          fi
        ) < /dev/null > /dev/null 2>&1 &
        dog=$!
        echo "$pid" > "$D/attempt.pid"
        # "wait ... || rc=$?" keeps the run's exit code where "|| true" would
        # discard it: the expected 255 does not fail the step, and nothing
        # else is hidden.
        rc=0
        wait "$pid" || rc=$?
        pid=
        kill "$dog" 2>/dev/null || true
        wait "$dog" 2>/dev/null || true
        dog=
        rm -f "$D/attempt.pid"
        if [ -e "$D/attempt.killed" ]; then
          echo "[CortexSim] attempt $n did not end within 10 s and was stopped. It is not counted: the burst is incomplete." >&2
          exit 12
        fi
        cat "$D/attempt.err" >&2
        if grep -qF "Could not resolve hostname $H" "$D/attempt.err"; then lookup=failed; else lookup=unconfirmed; fi
        echo "attempt=$n form=$form user=$user rc=$rc lookup=$lookup" >> "$D/burst.log"
        echo "[CortexSim] attempt $n ($form) $user@$H ended rc=$rc, name lookup $lookup"
        if [ "$rc" -ne 255 ] || [ "$lookup" != failed ]; then
          echo "[CortexSim] attempt $n is not the failed name lookup this chain expects: rc 255 together with ssh's own 'Could not resolve hostname' line. 255 alone also covers a refused or timed-out connection; 0, 5, 6 or 7 would mean a host answered. Stopping." >&2
          if [ "$rc" -lt 126 ] || [ "$rc" -eq 255 ]; then rc=11; fi
          exit "$rc"
        fi
        sleep 2
      done < "$D/candidates.txt"
      if [ "$n" -ne 6 ]; then
        echo "[CortexSim] expected six attempts, ran $n" >&2
        exit 12
      fi
      echo "$n" > "$D/burst.done"
      echo "[CortexSim] SIM-EDR-029 step-02: six sshpass runs (three -p, three -f). Each ssh reported that it could not resolve the hostname and ended 255: no connection was attempted, no session opened and no pair was offered to anything"
    identity: root
    mitre_technique: "T1110.004"
    platforms: ["linux"]
    # See step-01 for what the beacon does with these two names, and for the
    # advisory preflight's false "missing" on every endpoint.
    requires_interpreters: ["sshpass", "ssh"]
    # The beacon stops the step at 150 s in a pull run (its default is 180 s).
    # The command's own worst case is 115 s.
    timeout_seconds: 150
    causality:
      parent_step: step-01
      pivot: process_lineage
    expected_detections:
      - plane: EDR
        type: ABIOC
        # The alert's name is left out of this description on purpose. The
        # matcher credits a row when an alert of the same engine family
        # shares two words with the description, and this lab has raised
        # another built-in Analytics BIOC whose name ends in the same two
        # words as this one ("Uncommon Linux shell command execution"). The
        # name is on the card, where the exact-name key reads it.
        description: "Built-in XDR Analytics BIOC raised by running sshpass (Low, never in a case). Its name is on TTP-2026-0555. Declared from its reference page, not yet observed in a lab run"
        ttp_ref: "TTP-2026-0555"
        detection_id: abioc-suspicious-sshpass-command-execution
      - plane: EDR
        type: XQL
        description: "Validation — sshpass starts with the .invalid canary name on its line. Tier-2 verify only"
        ttp_ref: "TTP-2026-0555"
        detection_id: xql-edr-029-sshpass-starts-naming-the-canary
        verification_xql: |
          dataset = xdr_data
          | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
          | filter action_process_image_name = "sshpass" and action_process_image_command_line contains "cortexsim-canary.invalid"
          | fields _time, agent_hostname, actor_causality_id, actor_process_image_name, action_process_image_command_line
      - plane: EDR
        type: XQL
        description: "Validation — the OpenSSH client starts with sshpass as its parent and the .invalid canary name on its line. Tier-2 verify only"
        ttp_ref: "TTP-2026-0555"
        detection_id: xql-edr-029-openssh-client-started-by-sshpass
        verification_xql: |
          dataset = xdr_data
          | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
          | filter action_process_image_name = "ssh" and actor_process_image_name = "sshpass"
          | filter action_process_image_command_line contains "cortexsim-canary.invalid"
          | fields _time, agent_hostname, actor_causality_id, actor_process_image_name, action_process_image_name, action_process_image_command_line
      - plane: EDR
        type: Correlation
        description: "Correlation CR-EDR-0029 (operator-installed; alert name 'EDR-029 Repeated Sshpass Launches With Differing Arguments'; Medium; scheduled every 10 min, query time frame 1 h; agent_hostname mapped to Host Name and agent_id to Agent ID; no MITRE tag): on one agent, at least four sshpass starts carrying at least four different argument strings. Void when step-02 ended 10, 11 or 12: no complete burst ran, so neither an issue nor a miss on this row means anything; fix the endpoint and re-run"
        ttp_ref: "TTP-2026-0555"
        detection_id: CR-EDR-0029

  - id: step-03
    name: "Remove the candidate list, the password files and the working directory"
    # What the sensor records: PROCESS_START of rm, twice. The first command
    # line names <sandbox>/candidates.txt and the three pw-<n>.txt files, the
    # second the sandbox directory. FILE_REMOVE was recorded under /var/tmp in
    # this lab; the declared row keys on the rm process start. No built-in
    # alert is expected on removing sandbox files. After a complete pull run
    # nothing is left on the endpoint, which matters because the beacon does
    # not run cleanup.commands in pull mode. Step-01 and step-02 remove the
    # sandbox themselves when they stop with a non-zero code, and step-02
    # also when it is told to stop (HUP, INT, TERM) once its dwell is over.
    # A step that is killed outright, or stopped during its dwell, can leave
    # the sandbox until the next run's step-01 or the cleanup commands
    # remove it.
    # Also started, and matched by no declared filter: sleep, stat, id, cat.
    # Exit code: 0 when the files and the directory are gone. 1 when one
    # lstat of the sandbox path does not say: a directory, owned by the
    # running user, mode 700. 3 when step-02 did not finish its burst: what
    # it left is removed, and nothing is counted.
    command: |
      # REAL unlink of the files the burst used, then of the directory.
      set -eu
      sleep 40   # dwell
      D=/var/tmp/.cortexsim-sshpass
      [ "$(stat -c %F:%u:%a "$D" 2>/dev/null)" = "directory:$(id -u):700" ] || { echo "sandbox $D is missing or not ours: step-01 did not complete" >&2; exit 1; }
      if [ ! -f "$D/burst.done" ]; then
        echo "[CortexSim] SIM-EDR-029 step-03: step-02 did not finish its burst on this host. What it left is removed; nothing is counted." >&2
        rm -rf "$D"
        exit 3
      fi
      cat "$D/burst.log"
      rm -f "$D/candidates.txt" "$D"/pw-*.txt
      test ! -e "$D/candidates.txt"
      rm -rf "$D"
      test ! -e "$D"
      echo "[CortexSim] SIM-EDR-029 step-03: candidate list, password files and $D removed; nothing is left on the endpoint"
    identity: root
    mitre_technique: "T1070.004"
    platforms: ["linux"]
    causality:
      parent_step: step-02
      pivot: process_lineage
    expected_detections:
      - plane: EDR
        type: XQL
        description: "Validation — rm deletes the candidate list and the password files from the sandbox. Tier-2 verify only"
        ttp_ref: "TTP-2026-0555"
        detection_id: xql-edr-029-candidate-list-and-password-files-removed
        verification_xql: |
          dataset = xdr_data
          | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
          | filter action_process_image_name = "rm" and action_process_image_command_line contains "/var/tmp/.cortexsim-sshpass/candidates.txt"
          | fields _time, agent_hostname, actor_causality_id, action_process_image_command_line

# The chain's only background processes are one sshpass attempt and its
# watchdog, both started and ended inside step-02; the watchdog ends a hung
# attempt within 12 s. The first command stops an attempt that a killed step
# left in flight, and kills it 2 s later if it is still there. It reads the
# pidfile only when one lstat of the sandbox path says: a directory, owned by
# the running user, mode 700. It signals the pid only while its command line
# still names the .invalid host. rm -rf removes a symlink at the sandbox
# path, never its target.
cleanup:
  commands:
    - 'D=/var/tmp/.cortexsim-sshpass; if [ "$(stat -c %F:%u:%a "$D" 2>/dev/null)" = "directory:$(id -u):700" ] && [ -f "$D/attempt.pid" ]; then p="$(cat "$D/attempt.pid")"; if grep -qF cortexsim-canary.invalid "/proc/$p/cmdline" 2>/dev/null; then kill "$p" 2>/dev/null; sleep 2; if grep -qF cortexsim-canary.invalid "/proc/$p/cmdline" 2>/dev/null; then kill -9 "$p" 2>/dev/null; fi; fi; fi'
    - "rm -rf /var/tmp/.cortexsim-sshpass"
    - "echo 'cortexsim-edr-029-cleanup-complete'"

