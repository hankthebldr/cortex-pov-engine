  validated against dataset=xdr_data.

  '
moat_tier: LEAD
cgo_anchor:
  image_name: apache2
  primary_username: www-data
external_tools:
- name: Atomic Red Team
  source: https://github.com/redcanaryco/atomic-red-team
  type: script
  install_inline: false
  adapter_ref: TOOL-ATOMIC-RED-TEAM
steps:
- id: step-01
  name: Create Temp Directory
  command: mkdir C:\Windows\Temp\task
  identity: www-data
  mitre_technique: T1059.001
  expected_detections:
  - plane: EDR
    type: BIOC
    description: Signed Process Creates Scheduled Task
    ttp_ref: TTP-2026-0374
    detection_id: bioc-signed-process-creates-scheduled-task
- id: step-02
  name: Write Scheduled Task XML
  command: "echo \"<?xml version=\\\"1.0\\\" encoding=\\\"UTF-16\\\"?>\n<Task version=\\\"1.3\\\" xmlns=\\\
    \"http://schemas.microsoft.com/windows/2004/02/mit/task\\\">\n  <RegistrationInfo>\n    <Date>2023-01-01T00:00:00</Date>\n\
    \    <Author>System</Author>\n  </RegistrationInfo>\n  <Triggers>\n    <LogonTrigger>\n      <StartBoundary>2023-01-01T00:00:00</StartBoundary>\n\
    \    </LogonTrigger>\n  </Triggers>\n  <Actions Context=\\\"LocalSystem\\\">\n    <Exec>\n      <Command>cmd.exe</Command>\n\
    \      <Arguments>/c powershell.exe -EncodedCommand VwBhAHIAbwBuAGUAIAB0AGgAZQAgAHMAaABhAHIAZAAgAHQAcgBhAHAA</Arguments>\n\
    \    </Exec>\n  </Actions>\n</Task>\" > C:\\Windows\\Temp\\task\\malicious_task.xml"
  identity: www-data
  mitre_technique: T1074
  expected_detections:
  - plane: EDR
    type: BIOC
    description: Signed Process Creates Scheduled Task
    ttp_ref: TTP-2026-0374
    detection_id: bioc-signed-process-creates-scheduled-task
  causality:
    parent_step: step-01
    pivot: process_lineage
- id: step-03
  name: Create Scheduled Task
  command: schtasks /create /xml C:\Windows\Temp\task\malicious_task.xml /tn "MaliciousTask"
  identity: www-data
  mitre_technique: T1053.005
  expected_detections:
  - plane: EDR
    type: BIOC
    description: Signed Process Creates Scheduled Task
    ttp_ref: TTP-2026-0374
    detection_id: bioc-signed-process-creates-scheduled-task
  causality:
    parent_step: step-02
    pivot: process_lineage
cleanup:
  commands:
  - echo '[CortexSim] SIM-EDR-002 cleanup complete — no artifacts to remove (all simulated to localhost)'
