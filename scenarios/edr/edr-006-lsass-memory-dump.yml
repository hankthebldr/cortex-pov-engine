scenario_id: SIM-EDR-006
name: "LSASS Memory Credential Dump — comsvcs.dll LOLBin (Windows)"
version: "1.0"
status: active

# Detection-validation scenario (defensive QA). It drives the well-known,
# publicly documented Atomic Red Team T1003.001 tests against a LAB Windows
# endpoint to confirm Cortex XDR raises the LSASS-access BIOC, the comsvcs.dll
# MiniDump LOLBin analytic, and the stitched credential-theft correlation.
# All offensive detail lives in the anchor card TTP-2026-0002 (which is
# self-contained and ships its own cleanup). This file only orchestrates the
# detection check and references that card's detections.

plane: EDR
detection_types:
  - BIOC
  - XQL
  - Correlation
  - IOC

uc_ref: UCS-EDR-02
tc_ref: TC-EDR-03
tc_refs:
  - TC-EDR-03
  - TC-EDR-05
  - TC-ITDR-01
  - TC-CITH-03
pov_scenario_id: POV-SC-021
uc_name: "Endpoint Detection & Response"
tc_name: "Validate multi-method malware detection (local sandbox, behavioral, static analysis)"

mitre_tactic: "TA0006"
mitre_tactic_name: "Credential Access"
mitre_technique: "T1003.001"
mitre_technique_name: "OS Credential Dumping: LSASS Memory"
additional_techniques:
  - technique: "T1003"
    name: "OS Credential Dumping"
  - technique: "T1218.011"
    name: "System Binary Proxy Execution: Rundll32"

threat_report: "Unit42 - Ignoble Scorpius (BlackSuit) / Muddled Libra (Scattered Spider)"
threat_report_url: "https://unit42.paloaltonetworks.com/"

execution_identity:
  default: administrator
  options:
    - administrator

push_supported: true
pull_supported: true

# ── Causality contract ──────────────────────────────────────────────────────
# The Atomic Red Team tests are launched from an interactive administrator
# powershell.exe session, which is the Causality Group Owner (CGO): the first
# untrusted ancestor after the signed shell (explorer.exe terminates the chain).
# Both credential-dump tools (ProcDump handle-open, rundll32 comsvcs MiniDump)
# are direct children of that CGO, so the graph is CGO(powershell) → step-01
# (process_lineage), with the sibling tool runs threaded on shared host/account
# entity rather than a false parent→child fork between them.
cgo_anchor:
  image_name: "powershell.exe"
  primary_username: "Administrator"

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
# Rolled out per the S-07 per-plane convention
# (docs/uc_tc_mapping/scenario-methodology-defaults.md). Defaults are not
# fabricated KPIs — they map this plane to the methodology family its
# detection shape already belongs to in the v2.0 master methodology.
validation_methodology: "Endpoint Signal Injection & Detection Accuracy"
methodology_family: "F1"
primary_kpi: "MTTD"
threshold:
  kpi: "MTTD"
  op: "≤"
  value: 300
  unit: "seconds"
success_criteria: |
  The endpoint TTP signals injected by this scenario produce the expected
  XDR BIOC / XQL detections, and the mean time from signal emit to alert
  creation is within the MTTD budget. Each step's expected_detections row is
  validated against dataset=xdr_data.
moat_tier: "LEAD"

external_tools:
  - name: Atomic Red Team
    source: "https://github.com/redcanaryco/atomic-red-team"
    type: script
    install_inline: false
    adapter_ref: TOOL-ATOMIC-RED-TEAM

steps:
  - id: step-01
    name: "Open a handle to LSASS with sensitive access rights (ProcDump variant)"
    command: "Invoke-AtomicTest T1003.001 -TestNumbers 1 -GetPrereqs; Invoke-AtomicTest T1003.001 -TestNumbers 1"
    identity: administrator
    mitre_technique: "T1003.001"
    platforms: ["windows"]
    expected_detections:
      - plane: EDR
        type: BIOC
        description: "Non-allowlisted process opens a handle to lsass.exe requesting PROCESS_VM_READ / PROCESS_QUERY_INFORMATION"
        ttp_ref: "TTP-2026-0002"
        detection_id: "bioc-lsass-handle-open-with-sensitive-access-rights"
      - plane: EDR
        type: XQL
        description: "Confirm LSASS access originating from a process outside the AV/EDR allowlist"
        ttp_ref: "TTP-2026-0002"
        detection_id: "xql-confirm-lsass-access-from-non-allowlisted-process"

  - id: step-02
    name: "Dump LSASS via comsvcs.dll MiniDump LOLBin (lives-off-the-land)"
    command: "Invoke-AtomicTest T1003.001 -TestNumbers 3"
    identity: administrator
    mitre_technique: "T1218.011"
    platforms: ["windows"]
    # rundll32(comsvcs MiniDump) and the step-01 ProcDump handle-open are both
    # direct children of the same powershell CGO on the same host/account — not a
    # fork of each other — so they thread on shared_entity, not process_lineage.
    causality:
      parent_step: step-01
      pivot: shared_entity
    expected_detections:
      - plane: EDR
        type: BIOC
        description: "rundll32.exe spawned with comsvcs.dll MiniDump arguments — LOLBin credential dump"
        ttp_ref: "TTP-2026-0002"
        detection_id: "bioc-comsvcs-dll-minidump-lolbin-execution"
      - plane: EDR
        type: XQL
        description: "Confirm comsvcs.dll MiniDump invocation by rundll32 outside scheduled-task context"
        ttp_ref: "TTP-2026-0002"
        detection_id: "xql-confirm-comsvcs-dll-minidump-invocation"
      - plane: EDR
        type: IOC
        description: "LSASS memory dump artifact (lsass-*.dmp) written to disk"
        ttp_ref: "TTP-2026-0002"
        detection_id: "ioc-filename-lsass-dmp"

  - id: step-03
    name: "Confirm stitched credential-theft correlation"
    command: "Get-ChildItem \"$env:TEMP\\lsass-*.dmp\" -ErrorAction SilentlyContinue | Select-Object FullName, Length; Write-Host '[*] LSASS dump sequence complete — validating XSIAM correlation'"
    identity: administrator
    mitre_technique: "T1003.001"
    platforms: ["windows"]
    # Validation step reads the dump artifact step-02 wrote, on the same host and
    # under the same powershell CGO — shared_entity (host + dump file), not a fork.
    causality:
      parent_step: step-02
      pivot: shared_entity
    expected_detections:
      - plane: EDR
        type: Correlation
        description: "Credential Theft — LSASS Memory Dump: handle-open + comsvcs MiniDump + dump-file write stitched into one incident"
        ttp_ref: "TTP-2026-0002"
        detection_id: "CR-CRED-0001"

cleanup:
  commands:
    - "Remove-Item \"$env:TEMP\\lsass-*.dmp\" -Force -ErrorAction SilentlyContinue"
    - "Write-Host '[CortexSim] SIM-EDR-006 cleanup complete — dump artifacts removed'"

