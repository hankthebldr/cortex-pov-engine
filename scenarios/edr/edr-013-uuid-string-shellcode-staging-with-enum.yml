scenario_id: SIM-EDR-013
name: "UUID-String Shellcode Staging with Enum-Callback Fileless Execution (Bookworm / ToneShell)"
version: "1.0"
status: active

plane: EDR
detection_types:
  - ABIOC
  - XQL

uc_ref: UCS-EDR-02
tc_ref: TC-EDR-03
tc_refs:
  - TC-EDR-03
  - TC-EDR-05
pov_scenario_id: POV-SC-021
uc_name: "Endpoint Detection & Response"
tc_name: "Validate multi-method malware detection (local sandbox, behavioral, static analysis)"

mitre_tactic: "TA0005"
mitre_tactic_name: "Defense Evasion"
mitre_technique: "T1620"
mitre_technique_name: "Reflective Code Loading"
additional_techniques:
  - technique: "T1574.002"
    name: "Hijack Execution Flow: DLL Side-Loading"
  - technique: "T1140"
    name: "Deobfuscate/Decode Files or Information"
  - technique: "T1106"
    name: "Native API"
  - technique: "T1027"
    name: "Obfuscated Files or Information"

threat_report: "Unit 42 — Bookworm to Stately Taurus Using the Unit 42 Attribution Framework"
threat_report_url: "https://unit42.paloaltonetworks.com/bookworm-to-stately-taurus/"

# This scenario is NON-DESTRUCTIVE. It models the ToneShell / Bookworm
# UUID-string shellcode-staging chain (DLL side-load -> UuidFromStringA
# reassembly -> private executable heap -> EnumSystemLocalesA callback) with
# SAFE-MODE marker files. No shellcode is ever made executable or run; the
# offensive detail and detection logic live in the anchor card TTP-2026-0109.

execution_identity:
  default: user
  options:
    - user
    - administrator

push_supported: true
pull_supported: true

# ── Causality Group Owner anchor ────────────────────────────────────────────
# The chain OWNER is the user-launched signed host application (delivered via a
# phished archive extracted under explorer.exe), NOT the synthetic beacon. The
# DLL side-load and the in-process UUID-shellcode execution both descend from
# that signed host vehicle, so the graph roots on the phishing foothold instead
# of hanging every stage off cortexsim-agent.
cgo_anchor:
  image_name: "explorer.exe"
  primary_username: "user"

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
validation_methodology: "Endpoint Signal Injection & Detection Accuracy"
methodology_family: "F1"
primary_kpi: "MTTD"
threshold:
  kpi: "MTTD"
  op: "≤"
  value: 300
  unit: "seconds"
success_criteria: |
  Cortex has learned the signed host application's per-application baseline
  (loads only its signed modules; never transfers execution into an unbacked
  private heap). The injected side-load stage and the fileless enum-callback
  execution deviate from that baseline; both auto-tuned ABIOCs fire and the
  correlation rule stitches them into a single UUID-string-staging intrusion
  incident. This is the "behavioral-ML catches the fileless chain a static BIOC
  misses" proof: there is no VirtualAlloc(RWX), no CreateThread, and no
  injection to key on, so the catch comes from the causality chain. Mean time
  from deviation to alert is within the MTTD budget.
  In THIS lab only the side-load stage is executed (and scored); the fileless
  stage and the correlation are narrated, so they are not declared and cannot be
  claimed from a lab run.
moat_tier: "LEAD"

external_tools: []

steps:
  # CONT-04: the pre-beta chain was three steps that wrote marker files while
  # declaring a module-load ABIOC + query, an unbacked-execution ABIOC + query
  # and CR-EDR-0013 — none of which a marker produces. It is now one step that
  # performs a REAL, inert side-load. The UUID-string reassembly and the
  # enumeration-callback execution are narrated only, so the unbacked-execution
  # ABIOC, its hunt query and CR-EDR-0013 (a conjunction that needs it) are not
  # declared — a declared-but-unfirable detection scores a working tenant as a
  # miss (the SIM-KOI-009 precedent). They stay on TTP-2026-0109.
  - id: step-01
    name: "Stage a DLL side-load: unsigned module dropped in a user-writable path beside a signed host binary"
    # REAL but INERT: csc.exe compiles a one-method unsigned library into the
    # user-writable CortexSim stage directory, and a child powershell.exe
    # (signed, under \Windows\) loads it — an unsigned module loaded from
    # \AppData\...\Temp\ by a signed binary, the shape both detections key
    # on. The load runs in a child so the library is unlocked, and deleted in
    # this step, the moment the child exits. The library only returns a string.
    command: |
      $stage = Join-Path $env:TEMP 'cortexsim-edr-013'
      New-Item -ItemType Directory -Force -Path $stage | Out-Null
      $cs = Join-Path $stage 'cortexsim-sideload.cs'
      $dll = Join-Path $stage 'cortexsim-sideload.dll'
      Set-Content -Path $cs -Encoding ASCII -Value 'public static class CortexSimEdr013 { public static string Id() { return "cortexsim-edr-013-inert-module"; } }'
      $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
      if (-not (Test-Path -LiteralPath $csc)) { $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319\csc.exe' }
      & $csc /nologo /target:library "/out:$dll" $cs
      if (-not (Test-Path -LiteralPath $dll)) { Remove-Item -Recurse -Force $stage; Write-Error 'csc.exe produced no library: the .NET Framework 4 compiler is missing, so the side-load did not run'; exit 1 }
      powershell.exe -NoProfile -NonInteractive -Command "[Reflection.Assembly]::LoadFile('$dll').GetType('CortexSimEdr013').GetMethod('Id').Invoke(`$null, `$null)"
      $rc = $LASTEXITCODE
      Write-Output 'SAFE-MODE: the UUID-string shellcode reassembly and the enumeration-callback execution that follow the side-load are narrated only; nothing is placed on, or run from, an executable heap.'
      Remove-Item -Recurse -Force $stage
      if ($rc -ne 0) { Write-Error "side-load child exited $rc"; exit $rc }
      Write-Output 'cortexsim-edr-013-unsigned-module-loaded-from-user-writable-path'
    identity: user
    mitre_technique: "T1574.002"
    platforms: ["windows"]
    expected_detections:
      - plane: EDR
        type: ABIOC
        description: "A signed host binary whose learned per-application baseline loads only its signed modules from trusted paths side-loads an unsigned/unknown DLL from a user-writable directory — auto-tuned ABIOC fires on the deviation, anchored to the loading process. No known-bad DLL name is required."
        ttp_ref: "TTP-2026-0109"
        detection_id: "abioc-edr-013-dll-side-loaded-module-loads-from-a-user-writable-path-in-a-signed-host-process"
      - plane: EDR
        type: XQL
        description: "Validation query surfaces the unsigned module-load from a user-writable path by a signed host binary in xdr_data within the run window."
        ttp_ref: "TTP-2026-0109"
        detection_id: "xql-edr-013-unsigned-dll-side-loaded-from-a-user-writable-path-by-a-signed-host-binary"

cleanup:
  commands:
    - "Remove-Item -Recurse -Force (Join-Path $env:TEMP 'cortexsim-edr-013') -ErrorAction SilentlyContinue"
    - "Write-Host 'cortexsim-edr-013-cleanup-complete'"

