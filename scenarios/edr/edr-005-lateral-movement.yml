scenario_id: SIM-EDR-005
name: "Lateral Movement — SSH Abuse, Tunneling, and Internal Recon"
version: "1.0"
status: active

plane: EDR
detection_types:
  - BIOC
  - XQL

uc_ref: UCS-IR-02
tc_ref: TC-IR-04
tc_refs:
  - TC-IR-04
  - TC-EDR-05
pov_scenario_id: POV-SC-039
uc_name: "Incident Response"
tc_name: "Validate analytics detection rules trigger on simulated lateral movement patterns"

mitre_tactic: "TA0008"
mitre_tactic_name: "Lateral Movement"
mitre_technique: "T1021.004"
mitre_technique_name: "Remote Services: SSH"
additional_techniques:
  - technique: "T1046"
    name: "Network Service Discovery"
  - technique: "T1572"
    name: "Protocol Tunneling"
  - technique: "T1018"
    name: "Remote System Discovery"

threat_report: "Unit42 - Linux Threat Landscape Report 2024"
threat_report_url: "https://unit42.paloaltonetworks.com/2024-linux-threat-landscape/"

# ── Causality contract ──────────────────────────────────────────────────────
# The foothold is a compromised web service: apache2 (running as www-data)
# spawns the reverse shell that performs internal recon, scanning, SSH abuse
# and tunnelling. apache2 is the Causality Group Owner; every step runs under
# the dropped www-data identity and traces its lineage back to that daemon, so
# the sensor keys detections on causality_actor_process_image_name (the web
# daemon) + actor_effective_username (www-data) rather than the beacon. step-01
# anchors the www-data session; steps 2..n are its process-lineage children.
cgo_anchor:
  image_name: "apache2"
  primary_username: "www-data"

execution_identity:
  default: www-data
  options:
    - www-data
    - root
    - svc-backup
    - postgres

push_supported: true
pull_supported: true

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
# Rolled out per the S-07 per-plane convention
# (docs/uc_tc_mapping/scenario-methodology-defaults.md). Defaults are not
# fabricated KPIs — they map this plane to the methodology family its
# detection shape already belongs to in the v2.0 master methodology.
validation_methodology: "Endpoint Signal Injection & Detection Accuracy"
methodology_family: "F1"
primary_kpi: "MTTD"
threshold:
  kpi: "MTTD"
  op: "≤"
  value: 300
  unit: "seconds"
success_criteria: |
  The endpoint TTP signals injected by this scenario produce the expected
  XDR BIOC / XQL detections, and the mean time from signal emit to alert
  creation is within the MTTD budget. Each step's expected_detections row is
  validated against dataset=xdr_data.
moat_tier: "LEAD"

external_tools:
  - name: Atomic Red Team
    source: "https://github.com/redcanaryco/atomic-red-team"
    type: script
    install_inline: false
    adapter_ref: TOOL-ATOMIC-RED-TEAM
  - name: Nmap
    source: "https://github.com/nmap/nmap"
    type: binary
    install_inline: false
    adapter_ref: TOOL-NMAP

steps:
  - id: step-01
    name: "Internal network reconnaissance via ARP and subnet scan"
    command: |
      echo '[*] Performing internal network reconnaissance';
      ip addr show 2>/dev/null || ifconfig 2>/dev/null;
      ip route show 2>/dev/null || route -n 2>/dev/null;
      ip neigh show 2>/dev/null || arp -a 2>/dev/null;
      echo '[*] Network reconnaissance complete'
    identity: www-data
    mitre_technique: "T1016"
    # Root step: the www-data reverse shell's first action, owned by apache2.
    platforms: ["linux", "windows", "macos"]
    platform_variants:
      windows: 'ipconfig /all & route print & arp -a'
      macos: 'ifconfig; netstat -rn; arp -a'
    expected_detections:
      - plane: EDR
        type: XQL
        description: "Network interface and routing enumeration from service account — internal recon preceding lateral movement"
        ttp_ref: "TTP-2026-0036"
        detection_id: "xql-edr-005-analytics-network-interface-and-routing-enumeration"

  - id: step-02
    name: "Port scan local subnet for SSH and common services"
    command: |
      echo '[*] Scanning local subnet for SSH services';
      SUBNET=$(ip route | grep -v default | grep src | head -1 | awk '{print $1}');
      for port in 22 80 443 3306 5432 8080 8888; do
        timeout 1 bash -c "echo >/dev/tcp/127.0.0.1/$port" 2>/dev/null && echo "localhost:$port OPEN" || true;
      done;
      echo '[*] Service discovery scan complete'
    identity: www-data
    mitre_technique: "T1046"
    causality:
      parent_step: "step-01"
      pivot: "process_lineage"
    platforms: ["linux", "windows", "macos"]
    platform_variants:
      windows: 'foreach ($p in 22,80,443,3306,5432,8080,8888) { Test-NetConnection 127.0.0.1 -Port $p -WarningAction SilentlyContinue }'
      macos: 'for port in 22 80 443 3306 5432 8080 8888; do nc -z -G 1 127.0.0.1 $port && echo "localhost:$port OPEN"; done'
    expected_detections:
      - plane: EDR
        type: BIOC
        description: "Port scanning via bash /dev/tcp — network service discovery from web service account"
        ttp_ref: "TTP-2026-0036"
        detection_id: "bioc-edr-005-port-scan-via-bash-devtcp"
      - plane: EDR
        type: XQL
        description: "Sequential port connection attempts across multiple services — automated service enumeration"
        ttp_ref: "TTP-2026-0036"
        detection_id: "xql-edr-005-analytics-sequential-port-connection-attempts"

  - id: step-03
    name: "SSH lateral movement attempt to discovered hosts"
    command: |
      echo '[*] Simulating SSH lateral movement (all connections to localhost for safety)';
      timeout 5 ssh -o BatchMode=yes -o ConnectTimeout=3 -o StrictHostKeyChecking=no \
        www-data@127.0.0.1 'whoami' 2>&1 || echo '[*] SSH connection failed (expected)';
      timeout 5 ssh -o BatchMode=yes -o ConnectTimeout=3 -o StrictHostKeyChecking=no \
        root@127.0.0.1 'id' 2>&1 || echo '[*] SSH root attempt failed (expected)';
      echo '[*] SSH lateral movement simulation complete'
    identity: www-data
    mitre_technique: "T1021.004"
    causality:
      parent_step: "step-02"
      pivot: "process_lineage"
    platforms: ["linux", "windows", "macos"]
    platform_variants:
      windows: 'ssh -o BatchMode=yes -o StrictHostKeyChecking=no www-data@127.0.0.1 whoami'
      macos: 'ssh -o BatchMode=yes -o StrictHostKeyChecking=no www-data@127.0.0.1 whoami'
    expected_detections:
      - plane: EDR
        type: BIOC
        description: "SSH connection attempt from service account — lateral movement via remote service"
        ttp_ref: "TTP-2026-0036"
        detection_id: "bioc-edr-005-batch-mode-ssh-from-service-account"
      - plane: EDR
        type: XQL
        description: "Batch-mode SSH with StrictHostKeyChecking disabled — automated lateral movement tool behavior"
        ttp_ref: "TTP-2026-0036"
        detection_id: "xql-edr-005-analytics-batch-ssh-stricthostkey-disabled"

  - id: step-04
    name: "Establish SSH tunnel for data exfiltration channel"
    command: |
      echo '[*] Simulating SSH tunnel establishment';
      timeout 5 ssh -o ConnectTimeout=3 -N -L 8443:127.0.0.1:443 localhost 2>&1 &
      TUNNEL_PID=$!;
      sleep 2;
      kill $TUNNEL_PID 2>/dev/null;
      echo '[*] SSH local port forward tunnel simulation complete';
      timeout 5 ssh -o ConnectTimeout=3 -N -D 1080 localhost 2>&1 &
      SOCKS_PID=$!;
      sleep 2;
      kill $SOCKS_PID 2>/dev/null;
      echo '[*] SSH SOCKS proxy tunnel simulation complete'
    identity: www-data
    mitre_technique: "T1572"
    causality:
      parent_step: "step-03"
      pivot: "process_lineage"
    platforms: ["linux", "windows", "macos"]
    platform_variants:
      windows: 'ssh -N -L 8443:127.0.0.1:443 localhost'
      macos: 'ssh -N -D 1080 localhost'
    expected_detections:
      - plane: EDR
        type: BIOC
        description: "SSH tunnel creation (-L/-D flags) — protocol tunneling for covert channel establishment"
        ttp_ref: "TTP-2026-0036"
        detection_id: "bioc-edr-005-ssh-tunnel-creation-with-forward-flags"
      - plane: EDR
        type: XQL
        description: "SSH invoked with port forwarding from service account — data exfiltration channel pattern"
        ttp_ref: "TTP-2026-0036"
        detection_id: "xql-edr-005-analytics-ssh-port-forwarding-from-service-account"

  - id: step-05
    name: "Remote system discovery via DNS and host enumeration"
    command: |
      echo '[*] Performing remote system discovery';
      hostname -f 2>/dev/null;
      cat /etc/hosts | grep -v '^#' | grep -v '^$';
      cat /etc/resolv.conf 2>/dev/null;
      getent hosts $(hostname) 2>/dev/null;
      nslookup $(hostname -d) 2>/dev/null || dig $(hostname -d) 2>/dev/null || echo '[*] DNS lookup tools not available';
      echo '[*] Remote system discovery complete'
    identity: www-data
    mitre_technique: "T1018"
    causality:
      parent_step: "step-04"
      pivot: "process_lineage"
    platforms: ["linux", "windows", "macos"]
    platform_variants:
      windows: 'type C:\Windows\System32\drivers\etc\hosts & nslookup %USERDNSDOMAIN%'
      macos: 'cat /etc/hosts; cat /etc/resolv.conf; dscacheutil -q host'
    expected_detections:
      - plane: EDR
        type: XQL
        description: "DNS and host file enumeration from service account — remote system discovery for lateral movement planning"
        ttp_ref: "TTP-2026-0036"
        detection_id: "xql-edr-005-analytics-dns-and-host-file-enumeration"

cleanup:
  commands:
    - "pkill -f 'ssh.*tunnel.*cortexsim' 2>/dev/null"
    - "echo '[CortexSim] SIM-EDR-005 cleanup complete'"

