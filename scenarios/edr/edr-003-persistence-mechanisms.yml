scenario_id: SIM-EDR-003
name: "Linux Persistence — Cron, Systemd, and Backdoor Users"
version: "1.0"
status: active

plane: EDR
detection_types:
  - BIOC
  - XQL

uc_ref: UCS-EDR-03
tc_ref: TC-EDR-05
pov_scenario_id: POV-SC-045
uc_name: "Endpoint Detection & Response"
tc_name: "Validate causality graph provides full process chain and causality owner attribution"

mitre_tactic: "TA0003"
mitre_tactic_name: "Persistence"
mitre_technique: "T1053.003"
mitre_technique_name: "Scheduled Task/Job: Cron"
additional_techniques:
  - technique: "T1136.001"
    name: "Create Account: Local Account"
  - technique: "T1543.002"
    name: "Create or Modify System Process: Systemd Service"
  - technique: "T1098.004"
    name: "Account Manipulation: SSH Authorized Keys"

threat_report: "Unit42 - TeamTNT Targets Exposed Docker APIs"
threat_report_url: "https://unit42.paloaltonetworks.com/teamtnt-cryptojacking-watchdog-operations/"

# ── Causality contract ──────────────────────────────────────────────────────
# TeamTNT/Watchdog gain initial access through an exposed web/Docker service.
# The Causality Group Owner is that web daemon (apache2, running as www-data),
# whose descendant root shell then layers persistence. Every persistence exec
# below is a child of that same operator shell (step-01 stands in for the
# session anchor), so the CGO owns one connected process-lineage chain instead
# of five independent nodes hanging off the synthetic beacon.
cgo_anchor:
  image_name: "apache2"
  primary_username: "www-data"

execution_identity:
  default: root
  options:
    - root
    - www-data
    - svc-backup

push_supported: true
pull_supported: true

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
# Rolled out per the S-07 per-plane convention
# (docs/uc_tc_mapping/scenario-methodology-defaults.md). Defaults are not
# fabricated KPIs — they map this plane to the methodology family its
# detection shape already belongs to in the v2.0 master methodology.
validation_methodology: "Endpoint Signal Injection & Detection Accuracy"
methodology_family: "F1"
primary_kpi: "MTTD"
threshold:
  kpi: "MTTD"
  op: "≤"
  value: 300
  unit: "seconds"
success_criteria: |
  The endpoint TTP signals injected by this scenario produce the expected
  XDR BIOC / XQL detections, and the mean time from signal emit to alert
  creation is within the MTTD budget. Each step's expected_detections row is
  validated against dataset=xdr_data.
moat_tier: "LEAD"

external_tools:
  - name: Atomic Red Team
    source: "https://github.com/redcanaryco/atomic-red-team"
    type: script
    install_inline: false
    adapter_ref: TOOL-ATOMIC-RED-TEAM

steps:
  - id: step-01
    name: "Create malicious cron job for persistence"
    command: |
      echo '[*] Creating simulated persistence cron entry';
      echo '*/15 * * * * /tmp/.cortexsim_beacon 2>/dev/null' > /tmp/cortexsim_cron_test;
      crontab -l 2>/dev/null > /tmp/cortexsim_cron_backup;
      echo '# CortexSim EDR-003 test entry — will be removed in cleanup' >> /tmp/cortexsim_cron_test;
      cat /tmp/cortexsim_cron_test;
      echo '[*] Cron persistence payload staged (NOT installed — display only for safety)'
    identity: root
    mitre_technique: "T1053.003"
    # Root step: the operator's first persistence action in the shell that
    # descends from the apache2 CGO. No causality block → links from the CGO.
    platforms: ["linux", "windows"]
    platform_variants:
      # SAFE-MODE, matching the Linux primary: a REAL schtasks.exe /create (the
      # telemetry the BIOC needs) of a uniquely named task whose action is the
      # inert, non-writable %SystemRoot%\System32\whoami.exe, deleted in this
      # same step before its first 15-minute trigger can fire. No /ru SYSTEM.
      windows: |
        $tn = 'cortexsim-edr003-healthmonitor'
        $tr = Join-Path $env:SystemRoot 'System32\whoami.exe'
        schtasks.exe /create /tn $tn /tr $tr /sc minute /mo 15 /f
        $rc = $LASTEXITCODE
        schtasks.exe /query /tn $tn /fo LIST
        Unregister-ScheduledTask -TaskName $tn -Confirm:$false -ErrorAction SilentlyContinue
        if ($rc -ne 0) { Write-Error "schtasks /create exited $rc"; exit $rc }
        if (Get-ScheduledTask -TaskName $tn -ErrorAction SilentlyContinue) { Write-Error "task $tn survived teardown"; exit 1 }
        Write-Output 'cortexsim-edr003-scheduled-task-created-and-deleted'
    expected_detections:
      - plane: EDR
        type: BIOC
        description: "Cron job creation with suspicious command path — persistence mechanism via scheduled task"
        ttp_ref: "TTP-2026-0034"
        detection_id: "bioc-edr-003-cron-job-creation-with-suspicious-command-path"
      - plane: EDR
        type: XQL
        description: "Crontab modification from non-interactive session — automated persistence installation pattern"
        ttp_ref: "TTP-2026-0034"
        detection_id: "xql-edr-003-analytics-crontab-modification-non-interactive"

  - id: step-02
    name: "Create malicious systemd service unit (staging only)"
    command: |
      echo '[*] Staging simulated systemd persistence unit';
      cat > /tmp/cortexsim-backdoor.service << 'UNIT'
      [Unit]
      Description=System Health Monitor
      After=network.target

      [Service]
      Type=simple
      ExecStart=/tmp/.cortexsim_beacon
      Restart=always
      RestartSec=60

      [Install]
      WantedBy=multi-user.target
      UNIT
      echo '[*] Systemd unit staged at /tmp/ (NOT installed to /etc/systemd/)'
      cat /tmp/cortexsim-backdoor.service
    identity: root
    mitre_technique: "T1543.002"
    causality:
      parent_step: "step-01"
      pivot: "process_lineage"
    platforms: ["linux", "windows", "macos"]
    platform_variants:
      # SAFE-MODE: a REAL auto-start service registration pointing at the inert
      # whoami.exe (not a service binary, so SCM can never run it), deleted in
      # this same step.
      windows: |
        $svc = 'cortexsim-edr003-syshealthmon'
        $bin = Join-Path $env:SystemRoot 'System32\whoami.exe'
        sc.exe create $svc binPath= $bin start= auto DisplayName= 'CortexSim EDR-003 SysHealthMon (lab stand-in)'
        $rc = $LASTEXITCODE
        sc.exe qc $svc
        sc.exe delete $svc
        if ($rc -ne 0) { Write-Error "sc.exe create exited $rc"; exit $rc }
        if (Get-Service -Name $svc -ErrorAction SilentlyContinue) { Write-Error "service $svc survived teardown"; exit 1 }
        $global:LASTEXITCODE = 0
        Write-Output 'cortexsim-edr003-service-created-and-deleted'
      macos: 'sudo cp com.cortexsim.beacon.plist /Library/LaunchDaemons/ && sudo launchctl load /Library/LaunchDaemons/com.cortexsim.beacon.plist'
    expected_detections:
      - plane: EDR
        type: BIOC
        description: "Systemd service unit creation with suspicious ExecStart path — persistence via system service"
        ttp_ref: "TTP-2026-0034"
        detection_id: "bioc-edr-003-systemd-unit-with-suspicious-execstart"
      - plane: EDR
        type: XQL
        description: "Service unit file written with restart=always and hidden binary path — malware persistence pattern"
        ttp_ref: "TTP-2026-0034"
        detection_id: "xql-edr-003-analytics-service-unit-restart-always-hidden-path"

  - id: step-03
    name: "Attempt to create backdoor user account"
    command: |
      echo '[*] Simulating backdoor user creation';
      useradd -M -s /bin/bash -G sudo cortexsim_testuser 2>/dev/null && \
        echo 'cortexsim_testuser:TempP@ss123' | chpasswd 2>/dev/null && \
        echo '[!] Backdoor user created — will be removed in cleanup' || \
        echo '[*] useradd failed (expected in containers or without root)'
    identity: root
    mitre_technique: "T1136.001"
    causality:
      parent_step: "step-01"
      pivot: "process_lineage"
    platforms: ["linux", "windows", "macos"]
    platform_variants:
      # SAFE-MODE: a REAL local account + Administrators membership with a
      # password generated in-step (never a literal from this repo), deleted in
      # this same step. 14 characters on purpose: net.exe prompts (Y/N) for a
      # longer password, which would hang a non-interactive step. The group is
      # resolved by its well-known SID so a non-English OS works.
      windows: |
        $u = 'cortexsim-edr003'
        $pw = 'Cx!' + [guid]::NewGuid().ToString('N').Substring(0, 9) + 'Q7'
        $admins = (New-Object System.Security.Principal.SecurityIdentifier('S-1-5-32-544')).Translate([System.Security.Principal.NTAccount]).Value.Split('\')[-1]
        net.exe user $u $pw /add /comment:'CortexSim SIM-EDR-003 lab stand-in'
        $rc = $LASTEXITCODE
        if ($rc -eq 0) { net.exe localgroup $admins $u /add }
        net.exe user $u /delete
        if ($rc -ne 0) { Write-Error "net user /add exited $rc"; exit $rc }
        $global:LASTEXITCODE = 0
        Write-Output 'cortexsim-edr003-local-admin-created-and-deleted'
      macos: 'sudo sysadminctl -addUser cortexsim_testuser -password TempP@ss123 -admin'
    expected_detections:
      - plane: EDR
        type: BIOC
        description: "Local account creation with sudo group membership — backdoor account for persistent access"
        ttp_ref: "TTP-2026-0034"
        detection_id: "bioc-edr-003-local-account-created-with-sudo-group"
      - plane: EDR
        type: XQL
        description: "User account creation from non-login session — automated account provisioning pattern"
        ttp_ref: "TTP-2026-0034"
        detection_id: "xql-edr-003-analytics-user-account-creation-non-login-session"

  - id: step-04
    name: "Plant SSH authorized_keys for persistent access"
    command: |
      echo '[*] Simulating SSH key-based persistence';
      mkdir -p /tmp/.cortexsim_ssh_test;
      ssh-keygen -t ed25519 -f /tmp/.cortexsim_ssh_test/id_ed25519 -N '' -q 2>/dev/null;
      echo "# CortexSim test key — NOT installed to any real authorized_keys" > /tmp/.cortexsim_ssh_test/authorized_keys;
      cat /tmp/.cortexsim_ssh_test/id_ed25519.pub >> /tmp/.cortexsim_ssh_test/authorized_keys 2>/dev/null;
      echo '[*] SSH key generated and staged at /tmp/ (NOT injected into real user accounts)'
    identity: root
    mitre_technique: "T1098.004"
    causality:
      parent_step: "step-01"
      pivot: "process_lineage"
    platforms: ["linux", "windows"]
    platform_variants:
      # SAFE-MODE: a REAL ssh-keygen run and a REAL append to the user's
      # authorized_keys. The original file is backed up first (or its absence
      # recorded) and restored byte-for-byte — or the file removed, if this step
      # created it — before the step ends. `--%` passes `-N ""` verbatim:
      # Windows PowerShell 5.1 silently drops an empty native argument.
      windows: |
        $d = Join-Path $env:TEMP 'cortexsim-edr003'
        New-Item -ItemType Directory -Force -Path $d | Out-Null
        $k = Join-Path $d 'id_ed25519'
        $kg = Get-Command ssh-keygen.exe -ErrorAction SilentlyContinue
        if (-not $kg) { Remove-Item -Recurse -Force $d; Write-Error 'ssh-keygen.exe not found: install the Windows OpenSSH client; without it this step proves nothing'; exit 1 }
        & $kg.Source -q -t ed25519 -C cortexsim-edr003 -f $k --% -N ""
        $ssh = Join-Path $env:USERPROFILE '.ssh'
        $ak = Join-Path $ssh 'authorized_keys'
        $bak = Join-Path $d 'authorized_keys.bak'
        $hadDir = Test-Path $ssh
        $hadFile = Test-Path $ak
        # The backup, or an absence marker when there was no file, is what the
        # interrupted-run cleanup lines key on to restore or remove the file.
        if ($hadFile) { Copy-Item -Force -LiteralPath $ak -Destination $bak } else { Set-Content -Path (Join-Path $d 'authorized_keys.absent') -Value $ak }
        New-Item -ItemType Directory -Force -Path $ssh | Out-Null
        Add-Content -Path $ak -Value (Get-Content "$k.pub")
        Get-Item $ak | Select-Object FullName, Length
        if ($hadFile) { [IO.File]::WriteAllBytes($ak, [IO.File]::ReadAllBytes($bak)) } else { Remove-Item -Force $ak }
        if (-not $hadDir) { Remove-Item -Recurse -Force $ssh -ErrorAction SilentlyContinue }
        Remove-Item -Recurse -Force $d
        Write-Output 'cortexsim-edr003-authorized-keys-written-and-restored'
    expected_detections:
      - plane: EDR
        type: BIOC
        description: "SSH key generation followed by authorized_keys write — key-based persistence installation"
        ttp_ref: "TTP-2026-0034"
        detection_id: "bioc-edr-003-ssh-key-generation-then-authorized-keys-write"
      - plane: EDR
        type: XQL
        description: "ssh-keygen invocation from non-interactive session — automated SSH persistence setup"
        ttp_ref: "TTP-2026-0034"
        detection_id: "xql-edr-003-analytics-ssh-keygen-non-interactive-persistence"

  - id: step-05
    name: "Modify shell profile for login-triggered persistence"
    command: |
      echo '[*] Simulating shell profile persistence';
      echo '# CortexSim EDR-003 test — login trigger persistence' > /tmp/cortexsim_profile_test;
      echo 'nohup /tmp/.cortexsim_beacon &>/dev/null &' >> /tmp/cortexsim_profile_test;
      cat /tmp/cortexsim_profile_test;
      echo '[*] Profile persistence payload staged at /tmp/ (NOT written to real .bashrc/.profile)'
    identity: root
    mitre_technique: "T1546.004"
    causality:
      parent_step: "step-01"
      pivot: "process_lineage"
    platforms: ["linux", "windows", "macos"]
    platform_variants:
      # SAFE-MODE: a REAL HKCU Run value pointing at the inert whoami.exe,
      # deleted in this same step.
      windows: |
        $v = 'cortexsim-edr003-syshealth'
        $exe = Join-Path $env:SystemRoot 'System32\whoami.exe'
        reg.exe add 'HKCU\Software\Microsoft\Windows\CurrentVersion\Run' /v $v /t REG_SZ /d $exe /f
        $rc = $LASTEXITCODE
        reg.exe query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Run' /v $v
        reg.exe delete 'HKCU\Software\Microsoft\Windows\CurrentVersion\Run' /v $v /f
        if ($rc -ne 0) { Write-Error "reg add exited $rc"; exit $rc }
        $global:LASTEXITCODE = 0
        Write-Output 'cortexsim-edr003-run-key-written-and-deleted'
      macos: 'echo "nohup /tmp/.cortexsim_beacon &>/dev/null &" >> ~/.zshrc'
    expected_detections:
      - plane: EDR
        type: BIOC
        description: "Shell profile modification with nohup background execution — login-triggered persistence"
        ttp_ref: "TTP-2026-0034"
        detection_id: "bioc-edr-003-shell-profile-modified-with-background-execution"
      - plane: EDR
        type: XQL
        description: "Shell initialization file modification pattern — persistence via user profile"
        ttp_ref: "TTP-2026-0034"
        detection_id: "xql-edr-003-analytics-shell-init-file-modification"

cleanup:
  commands:
    - "userdel cortexsim_testuser 2>/dev/null"
    - "rm -f /tmp/cortexsim_cron_test /tmp/cortexsim_cron_backup /tmp/cortexsim-backdoor.service /tmp/cortexsim_profile_test"
    - "rm -rf /tmp/.cortexsim_ssh_test"
    # Windows teardown, for a step interrupted between create and its in-step
    # delete. The bash bundle also runs every cleanup line (on Linux each of
    # these is a harmless command-not-found) under `set -u`, so no Windows line
    # carries a `$`, not even inside double quotes: "$env:TEMP" raises `env:
    # unbound variable` there and ends cleanup() before the lines after it.
    # Hence cmd lines with %VAR%, which bash leaves alone; no parentheses,
    # redirects or a lone & either (bash -n + shellcheck).
    - "schtasks.exe /delete /tn cortexsim-edr003-healthmonitor /f"
    - "cmd.exe /c sc.exe delete cortexsim-edr003-syshealthmon"
    - "cmd.exe /c net.exe user cortexsim-edr003 /delete"
    - 'reg.exe delete "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v cortexsim-edr003-syshealth /f'
    # A step-04 interrupted mid-way leaves its backup (or the absence marker)
    # under %TEMP%\cortexsim-edr003; a completed step-04 already deleted it, so
    # these three lines are then no-ops. copy /b writes the backup's bytes back
    # into the existing file (as the in-step WriteAllBytes does) rather than
    # moving the backup, with its %TEMP% ACL, into the user's .ssh directory.
    - 'cmd.exe /c if exist "%TEMP%\cortexsim-edr003\authorized_keys.bak" copy /y /b "%TEMP%\cortexsim-edr003\authorized_keys.bak" "%USERPROFILE%\.ssh\authorized_keys"'
    - 'cmd.exe /c if exist "%TEMP%\cortexsim-edr003\authorized_keys.absent" del /f /q "%USERPROFILE%\.ssh\authorized_keys"'
    - 'cmd.exe /c if exist "%TEMP%\cortexsim-edr003" rd /s /q "%TEMP%\cortexsim-edr003"'
    - "echo '[CortexSim] SIM-EDR-003 cleanup complete'"

