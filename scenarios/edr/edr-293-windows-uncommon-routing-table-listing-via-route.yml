  install_inline: false
  adapter_ref: TOOL-ATOMIC-RED-TEAM
steps:
- id: step-01
  name: Initial route.exe execution
  command: C:\Windows\System32\route.exe print
  identity: www-data
  mitre_technique: T1059.001
  expected_detections:
  - plane: EDR
    type: BIOC
    description: Uncommon routing table listing via route.exe
    ttp_ref: TTP-2026-0455
    detection_id: bioc-uncommon-routing-table-listing-via-route-exe
- id: step-02
  name: Add route to test network
  command: C:\Windows\System32\route.exe add 192.0.2.0 mask 255.255.255.0 10.0.0.1
  identity: www-data
  mitre_technique: T1046
  expected_detections:
  - plane: EDR
    type: BIOC
    description: Uncommon routing table listing via route.exe
    ttp_ref: TTP-2026-0455
    detection_id: bioc-uncommon-routing-table-listing-via-route-exe
  causality:
    parent_step: step-01
    pivot: process_lineage
- id: step-03
  name: Delete route
  command: C:\Windows\System32\route.exe delete 192.0.2.0
  identity: www-data
  mitre_technique: T1016
  expected_detections:
  - plane: EDR
    type: BIOC
    description: Uncommon routing table listing via route.exe
    ttp_ref: TTP-2026-0455
    detection_id: bioc-uncommon-routing-table-listing-via-route-exe
  causality:
    parent_step: step-02
    pivot: process_lineage
- id: step-04
  name: Verify routing changes
  command: C:\Windows\System32\route.exe print
  identity: www-data
  mitre_technique: T1059.001
  expected_detections:
  - plane: EDR
    type: BIOC
    description: Uncommon routing table listing via route.exe
    ttp_ref: TTP-2026-0455
    detection_id: bioc-uncommon-routing-table-listing-via-route-exe
  causality:
    parent_step: step-03
    pivot: process_lineage
cleanup:
