scenario_id: SIM-EDR-021
name: "The Gentlemen GentleKiller — ThrottleStop.sys BYOVD EDR-Kill Behavioral Anomaly (Cortex EDR ABIOC)"
version: "1.0"
status: active

plane: EDR
detection_types:
  - BIOC
  - XQL

uc_ref: UCS-EDR-02
tc_ref: TC-EDR-03
tc_refs:
  - TC-EDR-03
  - TC-EDR-05
pov_scenario_id: POV-SC-021
uc_name: "Endpoint Detection & Response"
tc_name: "Validate multi-method malware detection (local sandbox, behavioral, static analysis)"

mitre_tactic: "TA0005"
mitre_tactic_name: "Defense Evasion"
mitre_technique: "T1562.001"
mitre_technique_name: "Impair Defenses: Disable or Modify Tools"
additional_techniques:
  - technique: "T1543.003"
    name: "Create or Modify System Process: Windows Service"
  - technique: "T1068"
    name: "Exploitation for Privilege Escalation"
  - technique: "T1053.005"
    name: "Scheduled Task/Job: Scheduled Task"
  - technique: "T1046"
    name: "Network Service Discovery"
  - technique: "T1571"
    name: "Non-Standard Port"
  - technique: "T1490"
    name: "Inhibit System Recovery"
  - technique: "T1485"
    name: "Data Destruction"

threat_report: "Unit 42 — The Gentlemen Ransomware (BYOVD EDR-Kill, SystemBC C2, Data Destruction)"
threat_report_url: "https://unit42.paloaltonetworks.com/the-gentlemen-ransomware/"

# This scenario is NON-DESTRUCTIVE. It models The Gentlemen crew's GentleKiller
# BYOVD EDR-kill chain with SAFE-MODE marker files: no kernel-driver service is
# registered, ThrottleStop.sys is never loaded, the Cortex agent is untouched,
# no C2 egress occurs, and no Volume Shadow Copies are deleted. Every stage emits
# an inert marker so Cortex observes the telemetry SHAPE. The offensive tradecraft
# and detection logic live in the anchor card TTP-2026-0144.

execution_identity:
  default: administrator
  options:
    - administrator
    - system

push_supported: true
pull_supported: true

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
validation_methodology: "Qualitative Forensic Evidence Capture"
methodology_family: "F10"
primary_kpi: "Causality Chain Completeness"
threshold:
  kpi: "Causality Chain Completeness"
  op: "≥"
  value: 90
  unit: "%"
success_criteria: |
  The Gentlemen defeat the signature layer by loading a signed but
  vulnerable driver (ThrottleStop.sys, CVE-2025-7771), so no known-bad-hash IOC
  fires. Cortex's auto-tuned ABIOCs catch the chain behaviorally: the terminal
  ABIOC fires on the anomalous vulnerable-driver load and anchors it to the
  sensor-telemetry gap, a second ABIOC fires on the post-tamper hands-on-keyboard
  burst (Advanced IP Scanner recon + SystemBC beacon), and CR-EDR-0021 stitches
  driver-service-create -> vulnerable-driver-load -> telemetry-gap -> scheduled
  task -> recon + C2 -> shadow-copy deletion into a single incident. The incident's
  ordered evidence graph — registry ImagePath write, signed-driver load, telemetry
  gap, _gentlemen task, scanner + beacon, vssadmin/wmic deletion — is exported
  verbatim as the POV's citable forensic packet.
  In THIS lab only the registry ImagePath write, the _gentlemen task and the
  vssadmin command line are executed (and scored); the driver load, telemetry
  gap and scanner + beacon burst are narrated, so their ABIOCs and CR-EDR-0021
  are not declared and cannot be claimed from a lab run.
moat_tier: "MOAT"

# ── Causality contract ──────────────────────────────────────────────────────
# The chain OWNER is the operator-run BYOVD loader (modeled as GentleKiller-class
# EDR-kill tooling — an analyst inference; Unit 42 does not state GentleKiller
# loads ThrottleStop.sys) that registers and loads the vulnerable driver; every
# downstream stage descends from it, so the
# graph roots on the loader instead of hanging off cortexsim-agent. step-01
# (driver-service create) is the single root; step-02 loads the driver
# (process_lineage), step-03 is the sensor-telemetry gap it causes (temporal),
# step-04 is _gentlemen scheduled-task persistence (process_lineage), step-05 is
# the recon + SystemBC C2 on the now-blinded host (endpoint_network_stitch),
# step-06 deletes shadow copies (process_lineage), and step-07 is the correlation
# stitch (shared_entity).
cgo_anchor:
  image_name: "GentleKiller.exe"
  primary_username: "administrator"

external_tools: []

steps:
  # CONT-04: the pre-beta chain was seven steps that wrote marker files while
  # declaring driver-service, driver-load, scheduled-task, recon/C2 and
  # shadow-delete detections nothing produced. It is now three steps, each
  # emitting the REAL, inert telemetry its detection keys on. The vulnerable
  # driver load, the sensor telemetry gap and the Advanced IP Scanner / SystemBC
  # burst are narrated, not executed — so their two ABIOCs and CR-EDR-0021
  # (which needs ALL FOUR upstreams) are not declared: a declared-but-unfirable
  # detection scores a working tenant as a miss (the SIM-KOI-009 precedent).
  # They stay on TTP-2026-0144 for a real intrusion.
  - id: step-01
    name: "Register a kernel-driver service / registry ImagePath for the signed-vulnerable ThrottleStop.sys"
    # REAL but INERT: a demand-start KERNEL service whose ImagePath names
    # ThrottleStop.sys — the registry write the BIOC keys on — deleted in this
    # same step. The .sys path does not exist and the service is never started,
    # so no driver can load and nothing is written to disk.
    command: |
      $svc = 'cortexsim-edr021'
      # A path no file is ever written to (the cortexsim-edr021 directory does
      # not exist): only the registry ImagePath carries it.
      $sys = Join-Path $env:SystemRoot 'System32\drivers\cortexsim-edr021\ThrottleStop.sys'
      sc.exe create $svc type= kernel start= demand binPath= $sys DisplayName= 'CortexSim EDR-021 BYOVD stand-in (never started)'
      $rc = $LASTEXITCODE
      sc.exe qc $svc
      sc.exe delete $svc
      if ($rc -ne 0) { Write-Error "sc.exe create exited $rc"; exit $rc }
      $global:LASTEXITCODE = 0
      Write-Output 'cortexsim-edr-021-driver-service-created-and-deleted'
      Write-Output 'SAFE-MODE: the ThrottleStop.sys (CVE-2025-7771) load and the sensor telemetry gap that follows are narrated only; no driver is loaded and the Cortex agent is untouched.'
    identity: administrator
    mitre_technique: "T1543.003"
    platforms: ["windows"]
    expected_detections:
      - plane: EDR
        type: BIOC
        description: "A kernel-driver service registry ImagePath is written pointing at ThrottleStop.sys — the earliest citable forensic artifact of the BYOVD chain, before the driver is loaded."
        ttp_ref: "TTP-2026-0144"
        detection_id: "bioc-gentlekiller-vulnerable-driver-service-created-throttlestop-sys-byovd"

  - id: step-02
    name: "Create a _gentlemen*-named scheduled task for persistence on the blinded host"
    # REAL but INERT: a real schtasks.exe /create of a _gentlemen-named task
    # (the command line the hunt query keys on) whose action is whoami.exe,
    # deleted before its first trigger.
    command: |
      $tn = '_gentlemen-cortexsim'
      $tr = Join-Path $env:SystemRoot 'System32\whoami.exe'
      schtasks.exe /create /tn $tn /tr $tr /sc minute /mo 60 /f
      $rc = $LASTEXITCODE
      schtasks.exe /delete /tn $tn /f
      if ($rc -ne 0) { Write-Error "schtasks /create exited $rc"; exit $rc }
      $global:LASTEXITCODE = 0
      Write-Output 'cortexsim-edr-021-gentlemen-scheduled-task-created-and-deleted'
    identity: administrator
    mitre_technique: "T1053.005"
    platforms: ["windows"]
    causality:
      parent_step: "step-01"
      pivot: process_lineage
    expected_detections:
      - plane: EDR
        type: XQL
        description: "Hunt query surfaces scheduled-task creation matching the actor's _gentlemen* naming convention in xdr_data."
        ttp_ref: "TTP-2026-0144"
        detection_id: "xql-gentlekiller-named-scheduled-task-creation-gentlemen-pattern"

  - id: step-03
    name: "Delete Volume Shadow Copies via vssadmin/wmic to inhibit recovery"
    # REAL but INERT: a real vssadmin.exe "delete shadows" command line (what
    # the BIOC keys on) aimed at the nil shadow id, which no shadow copy can
    # carry — nothing is deleted. Never /all. vssadmin exits non-zero for "no
    # items found", the expected result, so the exit code is reset.
    command: |
      Write-Output 'SAFE-MODE: the Advanced IP Scanner sweep and SystemBC beacon that precede impact are narrated only; no packet is sent.'
      vssadmin.exe delete shadows '/shadow={00000000-0000-0000-0000-000000000000}' /quiet
      $global:LASTEXITCODE = 0
      Write-Output 'cortexsim-edr-021-shadow-copy-delete-issued-against-nil-id'
    identity: administrator
    mitre_technique: "T1490"
    platforms: ["windows"]
    causality:
      parent_step: "step-02"
      pivot: process_lineage
    expected_detections:
      - plane: EDR
        type: BIOC
        description: "vssadmin/wmic delete or resize Volume Shadow Copies — the destructive impact stage that follows recon and C2 in The Gentlemen chain, a high-fidelity citable artifact for the POV report."
        ttp_ref: "TTP-2026-0144"
        detection_id: "bioc-volume-shadow-copy-deletion-via-vssadmin-wmic-pre-encryption"

cleanup:
  commands:
    - "cmd.exe /c sc.exe delete cortexsim-edr021"
    - "schtasks.exe /delete /tn _gentlemen-cortexsim /f"
    - "Write-Host 'cortexsim-edr-021-cleanup-complete'"

