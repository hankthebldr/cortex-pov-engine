  unit: seconds
success_criteria: 'The endpoint TTP signals injected by this scenario produce the expected

  XDR BIOC / XQL detections, and the mean time from signal emit to alert

  creation is within the MTTD budget. Each step''s expected_detections row is

  validated against dataset=xdr_data.

  '
moat_tier: LEAD
cgo_anchor:
  image_name: apache2
  primary_username: www-data
external_tools:
- name: Atomic Red Team
  source: https://github.com/redcanaryco/atomic-red-team
  type: script
  install_inline: false
  adapter_ref: TOOL-ATOMIC-RED-TEAM
steps:
- id: step-01
  name: Modify Registry Key for UAC Bypass
  command: reg add "HKCU\Software\Classes\CLSID\{12345678-1234-1234-1234-123456789012}\InprocServer32"
    /ve /d "C:\Windows\System32\cmd.exe" /f
  identity: www-data
  mitre_technique: T1546.001
  expected_detections:
  - plane: EDR
    type: BIOC
    description: Fodhelper UAC Bypass Registry Modification
    ttp_ref: TTP-2026-0271
    detection_id: bioc-fodhelper-uac-bypass-registry-modification
- id: step-02
  name: Set Threading Model for Registry Key
  command: reg add "HKCU\Software\Classes\CLSID\{12345678-1234-1234-1234-123456789012}\InprocServer32"
    /v "ThreadingModel" /d "Both" /f
  identity: www-data
  mitre_technique: T1546.001
  expected_detections:
  - plane: EDR
    type: BIOC
    description: Fodhelper UAC Bypass Registry Modification
    ttp_ref: TTP-2026-0271
    detection_id: bioc-fodhelper-uac-bypass-registry-modification
  causality:
    parent_step: step-01
    pivot: process_lineage
- id: step-03
  name: Execute fodhelper.exe for UAC Bypass
  command: fodhelper.exe
  identity: www-data
  mitre_technique: T1059.001
  expected_detections:
  - plane: EDR
    type: BIOC
    description: Fodhelper UAC Bypass Registry Modification
    ttp_ref: TTP-2026-0271
    detection_id: bioc-fodhelper-uac-bypass-registry-modification
  causality:
    parent_step: step-02
    pivot: process_lineage
- id: step-04
  name: Detect Behavioral Deviation
  command: fodhelper.exe
  identity: www-data
  mitre_technique: T1068
  expected_detections:
  - plane: EDR
    type: ABIOC
    description: Fodhelper.exe Unusual Execution with Registry Modification
    ttp_ref: TTP-2026-0271
    detection_id: abioc-fodhelper-exe-unusual-execution-with-registry-modification
  causality:
    parent_step: step-03
    pivot: process_lineage
cleanup:
