scenario_id: SIM-CDR-026
name: "CDR — First-Time Kubernetes Secret Enumeration & Access (Kubernetes audit)"
version: "1.0"
status: active

plane: CDR
detection_types:
  - Analytics
  - XQL
  - Correlation

uc_ref: UCS-CDR-01
tc_ref: TC-CDR-01
tc_refs:
  - TC-CDR-01
  - TC-CITH-04
pov_scenario_id: POV-SC-054
uc_name: "Cloud Detection & Response"
tc_name: "Validate runtime threat detection for containers and serverless workloads"

mitre_tactic: "TA0006"
mitre_tactic_name: "Credential Access"
mitre_technique: "T1552.007"
mitre_technique_name: "Unsecured Credentials: Container API"

threat_report: "Cortex XSIAM Analytics Alert Reference — Kubernetes audit (first-time secret enumeration & unusual secret access)"
threat_report_url: "https://docs-cortex.paloaltonetworks.com/r/Cortex-XSIAM/Cortex-XSIAM-Analytics-Alert-Reference-by-data-source"

# The two XSIAM Kubernetes-audit ML analytics alerts this scenario fires:
#   - "Kubernetes secrets enumeration for the first time"  (first-seen Analytics)
#   - "Unusual Kubernetes secret access"                   (behavioral Analytics)
# Signal is generated by the k8s_audit_emitter analytics log-streamer, which
# POSTs shape-true audit.k8s.io/v1 audit records into kubernetes_audit_logs.
# No real cluster is touched.

execution_identity:
  default: svc-account
  options:
    - svc-account
    - container-runtime
    - root

push_supported: true
pull_supported: true

external_tools:
  - name: cortexsim-eal-cli
    source: "https://github.com/hankthebldr/cortex-pov-engine"
    type: script
    install_inline: false

# ── Causality contract: the EAL CLI (python3) OWNS the emission chain ─────────
# The k8s_audit_emitter runs as the container entrypoint (python3) that owns the
# emission chain — the CGO root. step-01 (first-time enumeration burst) is the
# root; step-02 (the unusual read) re-uses the SAME compromised service-account
# identity, so it stitches to step-01 via a shared_entity pivot; step-03 is the
# correlation terminal over both.
cgo_anchor:
  image_name: "python3"
  primary_username: "svc-account"

steps:
  - id: step-01
    name: "First-time secret enumeration — list secrets then read each (Kubernetes audit shape)"
    command: |
      : "${COLLECTOR_URL:=https://collector.cortexsim-canary.invalid/k8s/audit}"
      : "${COLLECTOR_HOST:=collector.cortexsim-canary.invalid}"
      cat > /tmp/cdr-026-enum.yml <<YML
      campaign_id: CMP-CDR-026
      name: "CDR — first-time Kubernetes secret enumeration"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - "$COLLECTOR_HOST"
      dry_run: false
      tags: [cdr, kubernetes, secrets, enumeration]
      steps:
        - step_id: step-01
          plugin: k8s_audit_emitter
          params:
            collector_url: "$COLLECTOR_URL"
            provider: kubernetes
            event_pattern: secret_enumeration
            iterations: 1
            burst_count: 8
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/cdr-026-enum.yml --live
    identity: svc-account
    mitre_technique: "T1552.007"
    expected_detections:
      - plane: CDR
        type: Analytics
        description: "First-seen Analytics (ML) — a service account lists Kubernetes secrets for the first time (previously-unseen enumerator on the secrets resource). This is a first-seen anomaly over the API-server audit feed, not a causality-chain ABIOC."
        ttp_ref: "TTP-2026-0163"
        detection_id: abioc-kubernetes-secrets-enumeration-for-the-first-time
    platforms: ["linux", "container", "k8s"]

  - id: step-02
    name: "Unusual secret access — get the db-credentials secret by the same service account"
    command: |
      : "${COLLECTOR_URL:=https://collector.cortexsim-canary.invalid/k8s/audit}"
      : "${COLLECTOR_HOST:=collector.cortexsim-canary.invalid}"
      cat > /tmp/cdr-026-access.yml <<YML
      campaign_id: CMP-CDR-026
      name: "CDR — unusual Kubernetes secret access"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - "$COLLECTOR_HOST"
      dry_run: false
      tags: [cdr, kubernetes, secrets, access]
      steps:
        - step_id: step-01
          plugin: k8s_audit_emitter
          params:
            collector_url: "$COLLECTOR_URL"
            provider: kubernetes
            event_pattern: secret_access
            iterations: 1
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/cdr-026-access.yml --live
    identity: svc-account
    mitre_technique: "T1552.007"
    expected_detections:
      - plane: CDR
        type: Analytics
        description: "Behavioral Analytics (ML) — the same service account reads a secret in a way that deviates from its learned secret-access baseline."
        ttp_ref: "TTP-2026-0163"
        detection_id: abioc-unusual-kubernetes-secret-access
      - plane: CDR
        type: XQL
        description: "Validation query — confirms the emitted get/list secret audit records landed in kubernetes_audit_logs within the run window."
        ttp_ref: "TTP-2026-0163"
        detection_id: xql-kubernetes-secret-audit-records-observed-for-the-run-window
    causality:
      parent_step: step-01
      pivot: shared_entity
    platforms: ["linux", "container", "k8s"]

  - id: step-03
    name: "Correlation stitches first-time enumeration + unusual access into one secret-theft incident"
    command: "echo 'cortexsim-cdr-026-correlation-stitch' || true"
    identity: svc-account
    mitre_technique: "T1552.007"
    expected_detections:
      - plane: CDR
        type: Correlation
        description: "Correlation CR-CDR-0026 — same service account + source IP enumerates then reads secrets within a 10-minute window, raising one CDR credential-theft incident."
        ttp_ref: "TTP-2026-0163"
        detection_id: CR-CDR-0026
    causality:
      parent_step: step-02
      pivot: shared_entity
    platforms: ["linux", "container", "k8s"]

cleanup:
  commands:
    - "rm -f /tmp/cdr-026-enum.yml /tmp/cdr-026-access.yml"
    - "echo 'cortexsim-cdr-026-cleanup-complete'"

author: "Henry Reed"
created: "2026-07-25"
last_updated: "2026-07-25"
tags:
  - cdr
  - kubernetes
  - secrets
  - credential-access
  - analytics
  - eal-plugin
