scenario_id: SIM-CDR-012
name: "WildFire Test-Sample Retrieval in Container + Pod Misconfiguration"
version: "1.0"
status: active

plane: CDR
detection_types:
  - BIOC
  - XQL
  - IOC
  - Correlation

uc_ref: UCS-CITH-02
tc_ref: TC-CITH-02
tc_refs:
  - TC-CITH-02
  - TC-CDR-03
pov_scenario_id: POV-SC-002
uc_name: "Accelerated Investigations & Threat Hunting"
tc_name: "Validate Cloud Malware Detection & Response — Known and unknown malware detected on cloud workloads via static analysis, behavioral detection, and WildFire…"

mitre_tactic: "TA0005"
mitre_tactic_name: "Defense Evasion"
mitre_technique: "T1610"
mitre_technique_name: "Deploy Container"
additional_techniques:
  - technique: "T1204"
    name: "User Execution"

threat_report: "Palo Alto Networks - WildFire Test Sample Files for Verdict Validation"
threat_report_url: "https://docs.paloaltonetworks.com/wildfire/administration/submit-files-for-wildfire-analysis/test-a-sample-malware-file"

execution_identity:
  default: container-runtime
  options:
    - container-runtime
    - root

push_supported: true
pull_supported: true

# ── Causality Group Owner ────────────────────────────────────────────────────
# Realistic initial-access process that owns the chain (Cortex Causality View
# root), so the graph reads as a real intrusion, not the beacon.
cgo_anchor:
  image_name: "containerd-shim"
  primary_username: "root"

# ── Cluster posture — the insecure-pod misconfiguration IS this workload ─────
# RANK 5 of the first slice, and the cheapest correctness win. Before this block
# step-03 was `kubectl apply -f K8-container-misconfig.yaml` against a file that
# was NOT in the bundle, wrapped in `||` echo — it always "succeeded" and planted
# nothing. Moving the misconfiguration INTO the workload's own securityContext is
# the whole thesis of this pass in one edit: the pod IS the privileged /
# run-as-root / hostPath / no-limits misconfiguration step-03 used to fake, so
# the posture BIOC and the cortex_cloud_posture XQL now fire on a real object.
# Plants pod-privileged, pod-run-as-root, hostpath-mount, pod-allow-privilege-
# escalation, namespace-pod-security-privileged, pod-no-resource-limits
# (resources: null), pod-writable-root-filesystem. GATED: node_access. Joined by
# POS-CSPM-004 and refused by POS-KSPM-003 in enforce mode.
cluster_posture:
  workload: auto
  security_context:
    privileged: true
    run_as_user: 0
  resources: null                  # deliberately plants pod-no-resource-limits
  host_access:
    host_paths:
      - name: hostvarlog
        host_path: /var/log        # read-only, NOT a forbidden writable root
        mount_path: /host-var-log
        type: Directory
        read_only: true

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
# Pairs the WildFire verdict path (official benign PE/APK/macOS/ELF test
# samples, execution stubbed) with the lab's nine insecure-pod scenarios in one
# fixture. Demonstrates both runtime detection (in-container download+execute)
# and posture coverage (privileged/root/hostPath misconfig). Maps to the
# Posture & Compliance family (F4) — the misconfig state plus the WildFire
# verdict path drive coverage.
validation_methodology: "WildFire Verdict Path and Pod-Misconfiguration Coverage"
methodology_family: "F4"
primary_kpi: "Coverage %"
threshold:
  kpi: "Coverage %"
  op: "≥"
  value: 90
  unit: "%"
success_criteria: |
  The WildFire benign test-sample retrieval and in-container execution surface
  in network_story / xdr_data (exercising the WildFire verdict path), and the
  insecure-pod misconfiguration (privileged / run-as-root / hostPath) surfaces
  in cortex_cloud_posture, with the correlation rule stitching the
  misconfiguration and the sample execution into one posture-plus-runtime
  container-malware incident — proving Cortex Cloud CDR + XSIAM cover the
  WildFire verdict path and the posture misconfiguration that enables it,
  without handling real malware.
moat_tier: "LEAD"

steps:
  - id: step-01
    name: "Retrieve official benign WildFire test samples into a container"
    command: |
      DIR="/var/tmp/.hidden_wildfire_samples"; mkdir -p "$DIR"
      for kind in pe apk macos elf; do
        curl -fsSL "https://wildfire.paloaltonetworks.com/publicapi/test/${kind}" -o "$DIR/test_${kind}" || true
      done
      echo "[*] WildFire benign test samples staged in $DIR"
    identity: container-runtime
    mitre_technique: "T1204"
    expected_detections:
      - plane: CDR
        type: XQL
        description: "Container egress to wildfire.paloaltonetworks.com/publicapi/test/* retrieving the benign verdict-path test samples — exercises the WildFire submission/verdict path"
        ttp_ref: "TTP-2026-0084"
        detection_id: xql-cdr-012-wildfire-test-sample-retrieval-in-container
      - plane: CDR
        type: IOC
        description: "The official WildFire test-sample endpoint is tracked as the verdict-path egress destination (benign by design)"
        ttp_ref: "TTP-2026-0084"
        detection_id: ioc-domain-wildfire-paloaltonetworks-com

  - id: step-02
    name: "Stage executable and execute the downloaded sample (download-then-execute shape)"
    command: |
      DIR="/var/tmp/.hidden_wildfire_samples"
      for f in "$DIR"/test_*; do chmod +x "$f" 2>/dev/null || true; done
      echo "[*] samples marked executable in $DIR — execution stubbed [truncated]"
    identity: container-runtime
    mitre_technique: "T1204"
    causality:
      parent_step: step-01
      pivot: process_lineage
    expected_detections:
      - plane: CDR
        type: BIOC
        description: "A container chmod-s and executes a file it just downloaded into a hidden staging directory — the download-then-execute shape of container malware delivery"
        ttp_ref: "TTP-2026-0084"
        detection_id: bioc-cdr-012-container-executes-downloaded-sample

  - id: step-03
    name: "Surface the insecure-pod misconfiguration (this workload's own securityContext)"
    command: |
      echo "[*] This pod IS the insecure-pod misconfiguration — no phantom manifest to apply."
      echo "[*] Effective capabilities (privileged container widens the mask):"
      grep -E 'CapEff|CapBnd' /proc/self/status || true
      echo "[*] Running identity (run-as-root):"; id
      echo "[*] hostPath mount observable from inside the container:"
      mount | grep -E '/host-var-log' || echo '[-] hostPath mount not visible'
      echo "[*] privileged/run-as-root/hostPath/no-limits posture surfaces in cortex_cloud_posture"
    identity: container-runtime
    mitre_technique: "T1610"
    platforms: ["k8s", "container"]
    causality:
      parent_step: step-02
      pivot: process_lineage
    expected_detections:
      - plane: CDR
        type: BIOC
        description: "A pod runs privileged, as root, or with a hostPath mount — the runtime-observable insecure-pod misconfiguration that enables container escape and malware staging"
        ttp_ref: "TTP-2026-0084"
        detection_id: bioc-cdr-012-privileged-or-hostpath-pod-misconfiguration
      - plane: CDR
        type: XQL
        description: "The insecure-pod misconfiguration (privileged / run-as-root / hostPath / missing limits / missing securityContext) surfaces in cortex_cloud_posture"
        ttp_ref: "TTP-2026-0084"
        detection_id: xql-cdr-012-insecure-pod-misconfiguration-surfaced

  - id: step-04
    name: "Stitch misconfiguration + sample execution into one container-malware incident"
    command: |
      echo "[*] Cortex correlation CR-CDR-0012 fuses the posture misconfiguration and the in-container download-and-execute into one posture-plus-runtime container-malware incident"
    identity: container-runtime
    mitre_technique: "T1610"
    causality:
      parent_step: step-03
      pivot: process_lineage
    expected_detections:
      - plane: ANALYTICS
        type: Correlation
        description: "Correlation CR-CDR-0012 stitches the misconfiguration BIOC and the sample-execution BIOC into a single container-malware incident"
        ttp_ref: "TTP-2026-0084"
        detection_id: CR-CDR-0012

cleanup:
  commands:
    - "rm -rf /var/tmp/.hidden_wildfire_samples"
    - "echo '[CortexSim] SIM-CDR-012 cleanup complete — the misconfiguration is the workload; teardown is k8s_teardown'"
  k8s_teardown: "kubectl delete -f {manifest_path}"

