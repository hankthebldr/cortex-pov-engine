scenario_id: SIM-CDR-022
name: "GCP BigQuery Foreign-Project Exfil via Impersonated Service Account"
version: "1.0"
status: active

plane: CDR
detection_types:
  - Analytics
  - ABIOC
  - XQL
  - Correlation

uc_ref: UCS-DSPM-04
tc_ref: TC-DSPM-04
tc_refs:
  - TC-DSPM-04
  - TC-CITH-04
pov_scenario_id: POV-SC-002
uc_name: "Data Security Posture Management (DSPM)"
tc_name: "Validate Data Detection & Response (DDR) — Anomalous data access patterns detected in near-real-time"

mitre_tactic: "TA0010"
mitre_tactic_name: "Exfiltration"
mitre_technique: "T1537"
mitre_technique_name: "Transfer Data to Cloud Account"
additional_techniques:
  - technique: "T1078.004"
    name: "Valid Accounts: Cloud Accounts"

threat_report: "GCP BigQuery Foreign-Project Exfil + Service-Account Impersonation"
threat_report_url: "https://unit42.paloaltonetworks.com/iam-cloud-threat-research/"

# ── Causality contract ──────────────────────────────────────────────────────
# This is a GCP Cloud Audit Log analytics scenario, NOT an endpoint
# process-causality chain: detections key on the cloud_audit_logs record shape
# (iamcredentials + bigquery serviceName/methodName, protoPayload principalEmail,
# and the emitter's target_service_account / destination_project_id / foreign_project
# shape hints), not on a process tree. There is deliberately NO cgo_anchor — the
# only endpoint process is the cloud_audit_emitter EAL streamer (our tooling/beacon),
# which the causality contract forbids as a CGO, and the cloud-audit dataset carries
# no causality_actor_process_* fields to anchor. The connected graph is formed on
# the shared CALLER PRINCIPAL: cloud_audit_emitter emits every GCP record under the
# same protoPayload.authenticationInfo.principalEmail, so the impersonation mint in
# step-02 (iamcredentials GenerateAccessToken, exposing the impersonated
# target_service_account) and the foreign-project BigQuery job in step-03
# (destination_project_id + foreign_project=true) stitch via shared_entity on that
# shared caller principal into ONE foreign-project-exfil incident rather than hanging
# off the beacon. step-01 is a local readiness probe (the root). This mirrors the
# EMAIL-plane precedent (scenarios/email/sim-email-001.yml).

execution_identity:
  default: svc-account
  options:
    - svc-account
    - www-data
    - root

push_supported: true
pull_supported: true

infra_modules_needed:
  - base

external_tools:
  - name: cortexsim-eal-cli
    source: "https://github.com/hankthebldr/cortex-pov-engine"
    type: script
    install_inline: false

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
# methodology_family was absent, so this scenario was silently missing from the
# coverage analyzer's Section 4 family table — invisible rather than uncovered.
validation_methodology: "Cloud Audit-Log Signal Injection & Detection Accuracy"
methodology_family: "F1"

steps:
  - id: step-01
    name: "Pre-flight: confirm cloud_audit_emitter plugin is registered"
    command: |
      python3 -m scripts.eal_simulator.cli describe cloud_audit_emitter \
        | jq -e '.eal_targets | length > 0'
    identity: svc-account
    mitre_technique: "T1537"
    platforms: ["linux", "container"]
    expected_detections:
      - plane: CDR
        type: XQL
        description: "Pre-flight: cloud_audit_emitter metadata visible to the operator before emission."
        ttp_ref: "TTP-2026-0157"
        detection_id: xql-cdr-022-service-account-impersonation-events-landed-in-cloud-audit-log

  - id: step-02
    name: "Emit a GCP service-account impersonation burst (iamcredentials GenerateAccessToken)"
    command: |
      : "${COLLECTOR_URL:=https://collector.cortexsim-canary.invalid/cloud/events}"
      : "${COLLECTOR_HOST:=collector.cortexsim-canary.invalid}"
      cat > /tmp/cdr-022-gcp-impersonation.yml <<YML
      campaign_id: CMP-CDR-022
      name: "CDR-022 — GCP service-account impersonation"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - "$COLLECTOR_HOST"
      dry_run: false
      tags: [cdr, gcp, service-account-impersonation]
      steps:
        - step_id: step-01
          plugin: cloud_audit_emitter
          params:
            collector_url: "$COLLECTOR_URL"
            provider: gcp
            event_pattern: service_account_impersonation
            iterations: 1
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/cdr-022-gcp-impersonation.yml --live
    identity: svc-account
    mitre_technique: "T1078.004"
    platforms: ["linux", "container"]
    causality:
      parent_step: step-01
      pivot: shared_entity
    expected_detections:
      - plane: CDR
        type: Analytics
        description: "GCP service account impersonation attempt — caller mints tokens for a service account it has no learned history of impersonating."
        ttp_ref: "TTP-2026-0157"
        detection_id: abioc-gcp-service-account-impersonation-attempt
      - plane: CDR
        type: XQL
        description: "Validation — iamcredentials GenerateAccessToken impersonation events landed in cloud_audit_logs."
        ttp_ref: "TTP-2026-0157"
        detection_id: xql-cdr-022-service-account-impersonation-events-landed-in-cloud-audit-log

  - id: step-03
    name: "Emit a BigQuery job whose results export to a foreign project (borrowed identity)"
    command: |
      : "${COLLECTOR_URL:=https://collector.cortexsim-canary.invalid/cloud/events}"
      : "${COLLECTOR_HOST:=collector.cortexsim-canary.invalid}"
      cat > /tmp/cdr-022-gcp-bq-exfil.yml <<YML
      campaign_id: CMP-CDR-022
      name: "CDR-022 — GCP BigQuery foreign-project exfil"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - "$COLLECTOR_HOST"
      dry_run: false
      tags: [cdr, gcp, bigquery, data-exfil]
      steps:
        - step_id: step-01
          plugin: cloud_audit_emitter
          params:
            collector_url: "$COLLECTOR_URL"
            provider: gcp
            event_pattern: bigquery_exfiltration
            iterations: 1
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/cdr-022-gcp-bq-exfil.yml --live
    identity: svc-account
    mitre_technique: "T1537"
    platforms: ["linux", "container"]
    causality:
      parent_step: step-02
      pivot: shared_entity
    expected_detections:
      - plane: CDR
        type: ABIOC
        description: "BigQuery table or query results exfiltrated to a foreign project — destination project diverges from the SA's learned destination set."
        ttp_ref: "TTP-2026-0157"
        detection_id: abioc-bigquery-table-or-query-results-exfiltrated-to-a-foreign-project
      - plane: CDR
        type: XQL
        description: "Validation — BigQuery foreign-project export landed in cloud_audit_logs."
        ttp_ref: "TTP-2026-0157"
        detection_id: xql-cdr-022-bigquery-foreign-project-export-landed-in-cloud-audit-log
      - plane: CDR
        type: Correlation
        description: "Correlation stitches the impersonation and foreign-project-exfil ABIOCs on the shared impersonated service account into one incident."
        ttp_ref: "TTP-2026-0157"
        detection_id: CR-CDR-0022

cleanup:
  commands:
    - "rm -f /tmp/cdr-022-gcp-impersonation.yml /tmp/cdr-022-gcp-bq-exfil.yml"
    - "echo 'cortexsim-cdr-022-cleanup-complete'"

