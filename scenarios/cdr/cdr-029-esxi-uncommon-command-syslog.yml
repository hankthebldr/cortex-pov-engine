scenario_id: SIM-CDR-029
name: Uncommon Command on ESXi Virtualization Host — VMware Syslog Analytics
version: '1.0'
status: active
plane: CDR
detection_types:
- Analytics
- XQL
- IOC
uc_ref: UCS-CITH-04
tc_ref: TC-CITH-04
tc_refs:
- TC-CITH-04
- TC-CIEM-03
pov_scenario_id: POV-SC-002
uc_name: Accelerated Investigations & Threat Hunting
tc_name: Validate AI Runtime Security Analytics — AI-powered runtime analytics detect anomalous cloud
  workload behavior without signature dependency
mitre_tactic: TA0006
mitre_tactic_name: Credential Access
mitre_technique: T1059.012
mitre_technique_name: 'Command and Scripting Interpreter: Hypervisor CLI'
additional_techniques:
- technique: T1528
  name: Steal Application Access Token
threat_report: Cortex XSIAM Analytics Alert Reference by data source — AWS Audit Log (CloudTrail)
threat_report_url: https://docs-cortex.paloaltonetworks.com/r/Cortex-XSIAM/Cortex-XSIAM-Analytics-Alert-Reference-by-data-source
cgo_anchor:
  image_name: containerd-shim
  primary_username: container-runtime
execution_identity:
  default: container-runtime
  options:
  - container-runtime
  - root
push_supported: true
pull_supported: true
infra_modules_needed:
- base
- cdr
validation_methodology: Cloud-Audit Signal Injection & Detection Accuracy
methodology_family: F1
primary_kpi: Detection Accuracy
threshold:
  kpi: Detection Accuracy
  op: ≥
  value: 90
  unit: '%'
success_criteria: 'The synthetic AWS CloudTrail records emitted by this scenario produce the

  expected Cortex cloud-audit ABIOC alerts and the CR-CDR-0020 correlation.

  Detection Accuracy is the share of injected credential-store reads that raise

  the expected alert (target ≥ 90%).

  '
moat_tier: LEAD
external_tools:
- name: cortexsim-eal-cli
  source: https://github.com/hankthebldr/cortex-pov-engine
  type: script
  install_inline: false
steps:
- id: step-01
  name: Stream the learned-normal ESXi command baseline over syslog
  command: python3 core/eal_simulator/esxi_syslog_emitter.py --collector "${BROKER_VM:-192.0.2.9}" --phase
    baseline --baseline-count 40
  identity: root
  mitre_technique: T1059.012
- id: step-02
  name: Emit uncommon hypervisor-CLI commands (shell, account add, audit tamper, VM impact)
  command: python3 core/eal_simulator/esxi_syslog_emitter.py --collector "${BROKER_VM:-192.0.2.9}" --phase
    attack
  identity: root
  mitre_technique: T1059.012
  causality:
    parent_step: step-01
    pivot: temporal
  expected_detections:
  - plane: CDR
    type: Analytics
    description: Cortex Analytics raises 'Uncommon command executed on a virtualization host' on the ESXi
      syslog feed
    ttp_ref: TTP-2026-0188
    detection_id: xql-esxi-uncommon-hypervisor-cli-command-on-the-syslog-feed
  - plane: CDR
    type: XQL
    description: Hunt correlates the backdoor account add with the syslog-disable on dataset=esxi_syslog
    ttp_ref: TTP-2026-0188
    detection_id: xql-esxi-backdoor-account-add-followed-by-syslog-disable
cleanup:
  commands:
  - rm -f /tmp/cdr-020-secrets.yml /tmp/cdr-020-ssm.yml
author: Henry Reed
created: '2026-07-25'
last_updated: '2026-07-25'
tags:
