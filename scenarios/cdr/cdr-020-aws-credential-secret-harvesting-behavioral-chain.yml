scenario_id: SIM-CDR-020
name: "CDR — AWS Credential & Secret Harvesting Behavioral Chain (CloudTrail secrets dump + SSM retrieval)"
version: "1.0"
status: active

plane: CDR
detection_types:
  - ABIOC
  - Analytics
  - XQL
  - Correlation

uc_ref: UCS-CITH-04
tc_ref: TC-CITH-04
tc_refs:
  - TC-CITH-04
  - TC-CIEM-03
pov_scenario_id: POV-SC-002
uc_name: "Accelerated Investigations & Threat Hunting"
tc_name: "Validate AI Runtime Security Analytics — AI-powered runtime analytics detect anomalous cloud workload behavior without signature dependency"

mitre_tactic: "TA0006"
mitre_tactic_name: "Credential Access"
mitre_technique: "T1555"
mitre_technique_name: "Credentials from Password Stores"
additional_techniques:
  - technique: "T1528"
    name: "Steal Application Access Token"

threat_report: "Cortex XSIAM Analytics Alert Reference by data source — AWS Audit Log (CloudTrail)"
threat_report_url: "https://docs-cortex.paloaltonetworks.com/r/Cortex-XSIAM/Cortex-XSIAM-Analytics-Alert-Reference-by-data-source"

# ── Causality contract ──────────────────────────────────────────────────────
# This is a cloud-audit-plane scenario driven by the cloud_audit_emitter
# analytics streamer running inside the container runtime, so the Causality
# Group Owner is the containerd-shim/container-runtime that owns the emitter
# session (not a synthetic process). The detection is pure CloudTrail
# (cloud_audit_logs) analytics — the meaningful pivot is the SAME IAM identity
# (arn:aws:iam::123456789012:user/cortexsim-canary) reading Secrets Manager
# then SSM Parameter Store. step-02 follows step-01 in the same runtime session
# (process_lineage); step-03 stitches to step-02 on the shared identity
# (shared_entity), mirroring how correlation CR-CDR-0020 fuses the two ABIOC
# anomalies for one identity.
cgo_anchor:
  image_name: "containerd-shim"
  primary_username: "container-runtime"

execution_identity:
  default: container-runtime
  options:
    - container-runtime
    - root

push_supported: true
pull_supported: true

infra_modules_needed:
  - base
  - cdr

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
validation_methodology: "Cloud-Audit Signal Injection & Detection Accuracy"
methodology_family: "F1"
primary_kpi: "Detection Accuracy"
threshold:
  kpi: "Detection Accuracy"
  op: "≥"
  value: 90
  unit: "%"
success_criteria: |
  The synthetic AWS CloudTrail records emitted by this scenario produce the
  expected Cortex cloud-audit ABIOC alerts and the CR-CDR-0020 correlation.
  Detection Accuracy is the share of injected credential-store reads that raise
  the expected alert (target ≥ 90%).
moat_tier: "LEAD"

external_tools:
  - name: cortexsim-eal-cli
    source: "https://github.com/hankthebldr/cortex-pov-engine"
    type: script
    install_inline: false

steps:
  - id: step-01
    name: "Stream a SecretsManager GetSecretValue burst across many secrets (secrets dump)"
    command: |
      : "${COLLECTOR_URL:=https://collector.cortexsim-canary.invalid/cloudtrail/events}"
      : "${COLLECTOR_HOST:=collector.cortexsim-canary.invalid}"
      cat > /tmp/cdr-020-secrets.yml <<YML
      campaign_id: CMP-CDR-020
      name: "CDR — AWS Secrets Manager secrets dump"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - "$COLLECTOR_HOST"
      dry_run: false
      tags: [cdr, aws, cloudtrail, secrets-dump]
      steps:
        - step_id: step-01
          plugin: cloud_audit_emitter
          params:
            collector_url: "$COLLECTOR_URL"
            provider: aws
            event_pattern: secrets_dump
            burst_count: 24
            iterations: 1
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/cdr-020-secrets.yml --live
    identity: container-runtime
    mitre_technique: "T1555"
    # Root step of the causality spine: the emitter runs inside the
    # container-runtime CGO session.
    platforms: ["linux", "container"]
    expected_detections:
      - plane: CDR
        type: ABIOC
        description: "Cortex cloud-audit ABIOC — 'Suspicious secrets dump activity': one identity reads an unusually high volume of Secrets Manager secrets in a short window (cloud_audit_logs)."
        ttp_ref: "TTP-2026-0155"
        detection_id: abioc-suspicious-secrets-dump-activity

  - id: step-02
    name: "Stream an SSM GetParameters retrieval burst across many parameters (same identity)"
    command: |
      : "${COLLECTOR_URL:=https://collector.cortexsim-canary.invalid/cloudtrail/events}"
      : "${COLLECTOR_HOST:=collector.cortexsim-canary.invalid}"
      cat > /tmp/cdr-020-ssm.yml <<YML
      campaign_id: CMP-CDR-020
      name: "CDR — AWS SSM Parameter Store retrieval"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - "$COLLECTOR_HOST"
      dry_run: false
      tags: [cdr, aws, cloudtrail, ssm-retrieval]
      steps:
        - step_id: step-01
          plugin: cloud_audit_emitter
          params:
            collector_url: "$COLLECTOR_URL"
            provider: aws
            event_pattern: ssm_parameter_retrieval
            burst_count: 30
            iterations: 1
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/cdr-020-ssm.yml --live
    identity: container-runtime
    mitre_technique: "T1528"
    # Follows step-01 in the same container-runtime session; the SSM read
    # burst is the second leg of the harvesting chain by the same identity.
    causality:
      parent_step: "step-01"
      pivot: "process_lineage"
    platforms: ["linux", "container"]
    expected_detections:
      - plane: CDR
        type: ABIOC
        description: "Cortex cloud-audit ABIOC — 'AWS SSM parameters retrieval': one identity retrieves an unusually high volume of SSM parameters (with_decryption) in a short window (cloud_audit_logs)."
        ttp_ref: "TTP-2026-0155"
        detection_id: abioc-aws-ssm-parameters-retrieval
      - plane: CDR
        type: Analytics
        description: "Cortex cloud-audit analytics — combined credential-store harvesting chain: >= 30 credential reads spanning both SecretsManager and SSM by one identity/source IP (cloud_audit_logs)."
        ttp_ref: "TTP-2026-0155"
        detection_id: xql-cloud-credential-store-harvesting-chain-across-secretsmanager-and-ssm

  - id: step-03
    name: "Validate the CloudTrail records landed and confirm the correlation stitches one incident"
    command: |
      python3 -m scripts.eal_simulator.cli describe cloud_audit_emitter \
        | jq -e '.eal_targets | length > 0'
    identity: container-runtime
    mitre_technique: "T1555"
    # Stitches to step-02 on the SHARED IAM identity (not a process fork) — the
    # same join CR-CDR-0020 keys on to fuse the two ABIOC anomalies.
    causality:
      parent_step: "step-02"
      pivot: "shared_entity"
    platforms: ["linux", "container"]
    expected_detections:
      - plane: CDR
        type: XQL
        description: "Validation query — confirms the emitted SecretsManager + SSM CloudTrail records are observable in cloud_audit_logs within the run window."
        ttp_ref: "TTP-2026-0155"
        detection_id: xql-sim-cdr-020-validation-secretsmanager-and-ssm-reads-landed
      - plane: CDR
        type: Correlation
        description: "Cortex correlation CR-CDR-0020 — stitches the secrets-dump ABIOC and the SSM-retrieval ABIOC for the same identity/source IP into one credential-harvesting incident."
        ttp_ref: "TTP-2026-0155"
        detection_id: CR-CDR-0020

cleanup:
  commands:
    - "rm -f /tmp/cdr-020-secrets.yml /tmp/cdr-020-ssm.yml"

author: "Henry Reed"
created: "2026-07-25"
last_updated: "2026-07-25"
tags:
  - cdr
  - aws
  - cloudtrail
  - cloud-audit
  - secrets-manager
  - ssm-parameter-store
  - abioc
  - eal-plugin
