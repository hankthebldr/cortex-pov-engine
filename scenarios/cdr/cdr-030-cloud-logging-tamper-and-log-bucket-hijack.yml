        description: "Validation — UpdateTrail or UpdateBucket swaps the log encryption key for a key in another account or project. Tier-2 verify only"
        ttp_ref: "TTP-2026-0550"
        detection_id: xql-cdr-030-log-encryption-key-swapped-for-external-key
        verification_xql: |
          dataset = cortexsim_cloud_audit_raw
          | filter api_operation in ("UpdateTrail", "google.logging.v2.ConfigServiceV2.UpdateBucket") and kms_key_id contains "cortexsim-canary"
          | fields _time, audit_provider, api_operation, principal_id, log_resource_name, kms_key_id

  - id: step-06
    name: "Stop the trail and disable the sink"
    # Post [1], defence evasion 1 (stop logging): stop logging on the trail,
    # and set the sink's disabled field to true.
    # What the endpoint sensor records (not scored): as step-01, for
    # step-06.yml.
    # What the collector receives: 2 records. aws StopLogging on the trail, and
    # gcp google.logging.v2.ConfigServiceV2.UpdateSink with sink.disabled true.
    # The sink's destination is still the bucket step-03 deleted: this chain
