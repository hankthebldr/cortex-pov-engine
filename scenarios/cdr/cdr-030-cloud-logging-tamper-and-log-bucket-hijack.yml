        description: "Correlation CR-CDR-0030 (operator-installed, Medium, scheduled every 10 min over 1 h, no MITRE tag, principal_id mapped to User Name): in cortexsim_cloud_audit_raw one caller performs at least four distinct log-tampering operations and deletes the log store itself — the whole chain as one issue per provider identity"
