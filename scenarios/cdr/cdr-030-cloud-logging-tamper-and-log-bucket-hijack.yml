      name: "SIM-CDR-030 step-05 - log encryption key swapped for an external key"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - "$COLLECTOR_HOST"
      dry_run: false
      tags: [cdr, cloud-logging, defense-evasion]
      steps:
        - step_id: step-01
          plugin: cloud_audit_emitter
          params:
            collector_url: "$COLLECTOR_URL"
            provider: aws
            event_pattern: log_key_swap
            iterations: 1
            request_timeout: 3
            $AUTH_LINE
        - step_id: step-02
          plugin: cloud_audit_emitter
          params:
            collector_url: "$COLLECTOR_URL"
            provider: gcp
            event_pattern: log_key_swap
            iterations: 1
            request_timeout: 3
            $AUTH_LINE
      YML
      python3 -m scripts.eal_simulator.cli run "$ROOT/step-05.yml" --live
