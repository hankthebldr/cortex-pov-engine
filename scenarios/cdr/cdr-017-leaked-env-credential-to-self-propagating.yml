scenario_id: SIM-CDR-017
name: "Leaked .env Credential to Self-Propagating Lambda Extortion (Cortex CDR / ABIOC)"
version: "1.0"
status: active

# Detection-validation scenario (defensive QA) modeling the Unit 42 large-scale
# cloud-extortion campaign that harvested exposed .env-file IAM keys. A leaked
# access key validates itself, self-escalates to AdministratorAccess, is denied
# on EC2, then pivots to a cross-region self-propagating Lambda the victim pays
# for. Cortex Cloud / CDR learns the key's non-administrator CloudTrail baseline;
# two auto-tuned ABIOCs fire on the self-escalation and the denied-EC2-then-Lambda
# pivot; a correlation rule stitches the whole chain into one incident.
#
# NON-DESTRUCTIVE + LAB ONLY: every step writes SAFE-MODE marker files recording
# the CloudTrail operation each stage would emit. No IAM role, Lambda, EC2
# instance, or S3 object is created, read, or modified. Cleanup removes the
# markers. In a sanctioned lab the marker commands map 1:1 to the scoped aws-cli
# calls named in each step (run only against a rotate-after sandbox key).

plane: CDR
detection_types:
  - ABIOC
  - XQL
  - Correlation

uc_ref: UCS-CIEM-03
tc_ref: TC-CIEM-03
tc_refs:
  - TC-CIEM-03
  - TC-CDR-02
  - TC-SSCAN-01
pov_scenario_id: POV-SC-002
uc_name: "Cloud Infrastructure Entitlement Management (CIEM)"
tc_name: "Validate Privileged Permission Detection — Privilege escalation paths identified (iam:PassRole, sts:AssumeRole chains)"

mitre_tactic: "TA0004"
mitre_tactic_name: "Privilege Escalation"
mitre_technique: "T1098.003"
mitre_technique_name: "Account Manipulation: Additional Cloud Roles"
additional_techniques:
  - technique: "T1552.001"
    name: "Unsecured Credentials: Credentials In Files"
  - technique: "T1078.004"
    name: "Valid Accounts: Cloud Accounts"
  - technique: "T1136.003"
    name: "Create Account: Cloud Account"
  - technique: "T1651"
    name: "Cloud Administration Command"
  - technique: "T1526"
    name: "Cloud Service Discovery"
  - technique: "T1657"
    name: "Financial Theft"

threat_report: "Unit 42 — Leaked Environment Variables Allow Large-Scale Extortion Operation of Cloud Environments"
threat_report_url: "https://unit42.paloaltonetworks.com/large-scale-cloud-extortion-operation/"

execution_identity:
  default: www-data
  options:
    - www-data
    - container-runtime
    - root

push_supported: true
pull_supported: true

infra_modules_needed:
  - base
  - cdr
  - cspm

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
# Validates Cortex Analytics Behavioral IOCs (ABIOC) on the cloud/CDR plane:
# Cortex learns a leaked access key's non-administrator CloudTrail baseline, then
# a controlled self-escalation + compute-pivot deviation drives a behavioral
# detection no static rule was authored for. Signal Injection & Detection
# Accuracy family (F1).
validation_methodology: "Cloud Behavioral Anomaly Detection Accuracy"
methodology_family: "F1"
primary_kpi: "MTTD"
threshold:
  kpi: "MTTD"
  op: "≤"
  value: 600
  unit: "seconds"
success_criteria: |
  Cortex has learned the lab access key's non-administrator CloudTrail baseline
  (a narrow set of application API calls, no IAM writes, no compute creation).
  The injected self-escalation (CreateRole -> AttachRolePolicy AdministratorAccess)
  and the denied-EC2-then-cross-region-Lambda pivot deviate from that learned
  baseline; both auto-tuned ABIOCs fire and CR-CDR-0017 stitches them into a
  single leaked-credential self-propagating-Lambda extortion incident within the
  MTTD budget. This is the "behavioral-ML catches what a static BIOC misses"
  proof: every AWS API call is legitimate, so the catch comes from the deviation
  and its causality chain (leaked key -> self-escalation -> denied EC2 ->
  victim-funded multi-region Lambda), not a known-bad signature.
moat_tier: "LEAD"

external_tools:
  - name: aws-cli
    source: "https://aws.amazon.com/cli/"
    type: binary
    install_inline: false

# ── Causality contract ──────────────────────────────────────────────────────
# The leaked long-lived IAM access key was harvested from an exposed .env in a
# web-app root, so the CGO that OWNS the chain is the web-app service process
# (apache2 / www-data) the automation runs under — NOT our beacon. step-01 (key
# validation + SES/discovery) is the root that links from that CGO. The
# detections key on cloud_audit_logs (access_key_id + identity_name), which carry
# no causality_actor_process_* fields, so every downstream cloud stage stitches
# on the SHARED leaked-key identity (shared_entity): one access key threads key
# validation -> IAM self-escalation -> denied-EC2-then-Lambda pivot into ONE
# leaked-credential extortion incident, a connected spine instead of a star.
cgo_anchor:
  image_name: "apache2"
  primary_username: "www-data"

steps:
  - id: step-01
    name: "Key validation + account/SES discovery burst (SAFE-MODE markers)"
    command: |
      MARK="${MARKER_DIR:-/tmp/cortexsim-cdr-017}"; mkdir -p "$MARK"
      printf 'GetCallerIdentity\nListUsers\nListBuckets\nGetSendQuota\nListVerifiedEmailAddresses\nGetAccountSendingEnabled\nGetAccount\nListIdentities\n' > "$MARK/01-discovery.cloudtrail"
      echo '[CDR-017] leaked-key validation + IAM/SES discovery burst (T1526 / T1580) — maps to: aws sts get-caller-identity; aws iam list-users; aws s3api list-buckets; aws ses get-send-quota'
    identity: www-data
    mitre_technique: "T1526"
    platforms: ["linux", "container"]
    expected_detections:
      - plane: CDR
        type: XQL
        description: "SES sending-quota enumeration burst (GetSendQuota / GetAccountSendingEnabled / ListIdentities) from an identity whose baseline never touches SES — surfaces the spam/phishing-capacity recon that precedes the extortion payload."
        ttp_ref: "TTP-2026-0112"
        detection_id: "xql-ses-sending-quota-enumeration-burst-after-key-validation"

  - id: step-02
    name: "IAM self-escalation — CreateRole lambda-ex then AttachRolePolicy AdministratorAccess (SAFE-MODE markers)"
    command: |
      MARK="${MARKER_DIR:-/tmp/cortexsim-cdr-017}"; mkdir -p "$MARK"
      printf 'CreateRole role=lambda-ex\nAttachRolePolicy policy=arn:aws:iam::aws:policy/AdministratorAccess role=lambda-ex\n' > "$MARK/02-privesc.cloudtrail"
      echo '[CDR-017] leaked-key self-escalation to AdministratorAccess (T1098.003 / T1136.003) — maps to: aws iam create-role --role-name lambda-ex; aws iam attach-role-policy --policy-arn arn:aws:iam::aws:policy/AdministratorAccess'
    identity: www-data
    mitre_technique: "T1098.003"
    platforms: ["linux", "container"]
    causality:
      parent_step: step-01
      pivot: shared_entity
    expected_detections:
      - plane: CDR
        type: ABIOC
        description: "An access key with a learned non-administrator baseline issues CreateRole (lambda-ex) immediately followed by AttachRolePolicy attaching AdministratorAccess — auto-tuned ABIOC fires on the self-escalation deviation, anchored to the leaked key's causality chain. No single API call is a known-bad IOC."
        ttp_ref: "TTP-2026-0112"
        detection_id: "abioc-iam-self-escalation-to-administratoraccess-by-a-newly-observed-access-key"

  - id: step-03
    name: "Denied EC2 attempt then cross-region Lambda fan-out (SAFE-MODE markers)"
    command: |
      MARK="${MARKER_DIR:-/tmp/cortexsim-cdr-017}"; mkdir -p "$MARK"
      printf 'CreateSecurityGroup name=security\nAuthorizeSecurityGroupIngress\nCreateKeyPair\nRunInstances type=c6g ami=ami-08e8725a42775740f error=Client.UnauthorizedOperation\n' > "$MARK/03-ec2-denied.cloudtrail"
      for r in us-east-1 us-west-2 eu-west-1 ap-southeast-1; do printf 'CreateFunction20150331 name=ex region=%s\nCreateLogGroup name=/aws/lambda/ex region=%s\n' "$r" "$r" >> "$MARK/04-lambda-fanout.cloudtrail"; done
      echo '[CDR-017] denied ec2:RunInstances (Client.UnauthorizedOperation) then multi-region lambda:CreateFunction ex (T1651 / T1078.004) — maps to: aws ec2 run-instances ...(denied); aws lambda create-function --function-name ex (per region)'
    identity: www-data
    mitre_technique: "T1651"
    platforms: ["linux", "container"]
    causality:
      parent_step: step-02
      pivot: shared_entity
    expected_detections:
      - plane: CDR
        type: ABIOC
        description: "The same key is denied on ec2:RunInstances (Client.UnauthorizedOperation) then succeeds at lambda:CreateFunction across multiple regions — auto-tuned ABIOC fires on the denied-EC2-then-Lambda victim-funded compute pivot, anchored to the key's causality chain."
        ttp_ref: "TTP-2026-0112"
        detection_id: "abioc-denied-ec2-compute-attempt-immediately-followed-by-cross-region-lambda-deployment"
      - plane: CDR
        type: XQL
        description: "Validation query confirms a single principal created the 'ex' Lambda across >= 3 enabled regions within the run window (the cross-region fan-out is observable in cloud_audit_logs)."
        ttp_ref: "TTP-2026-0112"
        detection_id: "xql-cross-region-lambda-function-ex-fan-out-from-single-principal"

  - id: step-04
    name: "Correlation stitches the self-escalation and compute-pivot signals into one incident"
    command: "echo cortexsim-cdr-017-cr-cdr-0017-stitched-leaked-key-extortion-incident"
    identity: www-data
    mitre_technique: "T1657"
    platforms: ["linux", "container"]
    causality:
      parent_step: step-03
      pivot: shared_entity
    expected_detections:
      - plane: CDR
        type: Correlation
        description: "Correlation rule fuses the IAM self-escalation ABIOC and the denied-EC2-then-Lambda pivot ABIOC on the same access key into a single leaked-credential self-propagating-Lambda extortion incident anchored to the harvested key's causality chain."
        ttp_ref: "TTP-2026-0112"
        detection_id: "CR-CDR-0017"

cleanup:
  commands:
    - "rm -rf /tmp/cortexsim-cdr-017"
    - "echo cortexsim-cdr-017-cleanup-complete"
