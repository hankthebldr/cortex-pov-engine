scenario_id: SIM-CDR-015
name: "XDM Container Telemetry Normalization — Modeling-Rule Substrate Proof"
version: "1.0"
status: active

plane: CDR
detection_types:
  - BIOC
  - XQL

uc_ref: UCS-BYOML-01
tc_ref: TC-BYOML-02
tc_refs:
  - TC-BYOML-02
  - TC-TH-03
pov_scenario_id: POV-SC-027
uc_name: "Advanced Analytics & BYOML"
tc_name: "Demonstrate datamodel customization for industry-specific correlation rules"

mitre_tactic: "TA0005"
mitre_tactic_name: "Defense Evasion"
mitre_technique: "T1610"
mitre_technique_name: "Deploy Container"
additional_techniques:
  - technique: "T1613"
    name: "Container and Resource Discovery"

threat_report: "Unit42 - Cloud Threat Report: The State of Cloud-Native Security"
threat_report_url: "https://unit42.paloaltonetworks.com/cloud-threat-report-volume-7/"

execution_identity:
  default: container-runtime
  options:
    - container-runtime
    - root

push_supported: true
pull_supported: true

# ── Causality Group Owner ────────────────────────────────────────────────────
# Realistic initial-access process that owns the chain (Cortex Causality View
# root), so the graph reads as a real intrusion, not the beacon.
cgo_anchor:
  image_name: "containerd-shim"
  primary_username: "root"

# ── Cluster posture — a non-privileged DRIVER that spawns a privileged PROBE ──
# RANK 2 of the first slice. The driver Deployment itself is compliant
# (non-privileged); its step-02 `kubectl run … securityContext.privileged=true`
# is the privileged workload. Splitting the two arms honestly is the whole point
# of the conversion: on a cluster WITHOUT admission enforcement the probe is
# ADMITTED and the modeling-rule BIOC (step-03) fires on the normalized
# `privileged` field; on a cluster WITH enforcement the probe CREATE is REFUSED
# (403) and that refusal is POS-KSPM-003's passing evidence. The driver needs a
# namespace-scoped Role to `create` the probe pod — namespace-scoped, not a
# cluster grant, so the driver stays UNGATED. app_identity back-fills from
# cgo_anchor per S-17. NOTE: the driver image must carry `kubectl`; on the
# default debian:12-slim the require_bin preflight exits 78 LOUDLY (never a
# silent green) — supply a kubectl-bearing image or served payloads.
cluster_posture:
  workload: deployment
  service_account:
    automount_token: true
    namespace_role_rules:
      - api_groups: [""]
        resources: ["pods"]
        verbs: ["create", "get", "list", "watch", "delete"]

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
# This scenario proves the XDM normalization SUBSTRATE beneath detections: an
# XDM modeling rule (detections.modeling_rules[], NOT a detection_type) maps raw
# actor_container_info JSON into addressable XDM fields, then a BIOC fires on the
# normalized privileged field. It demonstrates the moment a raw, un-analytics-
# grade log source becomes analytics-grade. Maps to the Signal Injection &
# Detection Accuracy family (F1) — the BIOC fires only because the substrate
# made the field addressable.
validation_methodology: "XDM Normalization Substrate Proof"
methodology_family: "F1"
primary_kpi: "Coverage %"
threshold:
  kpi: "Coverage %"
  op: "≥"
  value: 100
  unit: "%"
success_criteria: |
  The XDM modeling rule normalizes the raw actor_container_info JSON blob into
  addressable XDM fields (pod_namespace, image_name, privileged), the validation
  XQL confirms the modeled fields are populated, and the privileged-container
  BIOC fires on the normalized privileged field — proving the full raw-source to
  XDM-normalized-field to detection chain that an un-modeled (searchable but not
  analytics-grade) log source could not support.
moat_tier: "LEAD"

steps:
  - id: step-01
    name: "Apply the XDM modeling rule that normalizes raw container telemetry"
    command: |
      echo "[*] Paste the [MODEL: dataset=cortexsim_container_raw] modeling rule into XSIAM"
      echo "[*] It maps raw actor_container_info JSON -> XDM fields (pod_namespace, image_name, privileged)"
      echo "[*] Un-modeled, this source is searchable but NOT analytics-grade"
    identity: container-runtime
    mitre_technique: "T1610"
    expected_detections:
      - plane: CDR
        type: XQL
        description: "The XDM modeling rule (normalization substrate) maps the raw actor_container_info blob into addressable XDM container fields — the gating step that makes the source analytics-grade. Resolves to the card's modeling_rules[] object."
        ttp_ref: "TTP-2026-0081"
        detection_id: modeling-container-telemetry-xdm-normalization
    platforms: ["k8s", "container"]

  - id: step-02
    name: "Start a privileged container so raw telemetry is emitted and modeled"
    command: |
      kubectl run cortexsim-priv-probe --image=public.ecr.aws/docker/library/busybox:1.36 --restart=Never \
        --overrides='{"spec":{"containers":[{"name":"p","image":"public.ecr.aws/docker/library/busybox:1.36","command":["sh","-c","id; sleep 60"],"securityContext":{"privileged":true}}]}}' || true
      kubectl wait --for=condition=Ready pod/cortexsim-priv-probe --timeout=120s || true
      echo "[*] Privileged container started — raw actor_container_info now flowing"
    identity: container-runtime
    mitre_technique: "T1610"
    causality:
      parent_step: step-01
      pivot: process_lineage
    expected_detections:
      - plane: CDR
        type: XQL
        description: "Validation that the modeled container fields (pod_namespace, privileged) are populated from the raw blob — confirms the modeling rule normalized the telemetry"
        ttp_ref: "TTP-2026-0081"
        detection_id: xql-cdr-xdm-modeled-container-fields-populated
    platforms: ["k8s", "container", "linux"]

  - id: step-03
    name: "BIOC fires on the normalized privileged field"
    command: |
      echo "[*] BIOC matches container starts where the MODELED privileged field = true"
      echo "[*] This detection only works because the modeling rule made privileged addressable"
    identity: container-runtime
    mitre_technique: "T1613"
    causality:
      parent_step: step-02
      pivot: process_lineage
    expected_detections:
      - plane: CDR
        type: BIOC
        description: "Privileged-container-start BIOC fires on the normalized privileged field — proving the raw-source to modeled-field to detection chain end-to-end"
        ttp_ref: "TTP-2026-0081"
        detection_id: bioc-cdr-xdm-privileged-container-start-on-modeled-field
    platforms: ["k8s", "container"]

cleanup:
  commands:
    - "kubectl delete pod cortexsim-priv-probe --ignore-not-found"
    - "echo '[CortexSim] SIM-CDR-015 cleanup complete'"

