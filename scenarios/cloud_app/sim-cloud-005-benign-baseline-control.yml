scenario_id: SIM-CLOUD-005
name: "Cloud App — Benign OAuth Baseline (control / FP-suppression validation)"
version: "1.0"
status: active

plane: CLOUD_APP
detection_types:
  - XQL

uc_ref: UCS-CITH-11
tc_ref: TC-CITH-11
tc_refs:
  - TC-CITH-11
  - TC-DLP-04
  - TC-TH-05
pov_scenario_id: POV-SC-002
uc_name: "Accelerated Investigations & Threat Hunting"
tc_name: "Validate Detection Rule Accuracy — false positive rate <5% on production-representative test data"

mitre_tactic: "TA0001"
mitre_tactic_name: "Initial Access"
mitre_technique: "T1078.004"
mitre_technique_name: "Valid Accounts: Cloud Accounts"

threat_report: "CortexSim - OAuth Detection Baseline Control"
threat_report_url: "https://github.com/hankthebldr/cortex-pov-engine"

execution_identity:
  default: container-runtime
  options:
    - container-runtime
    - root

push_supported: true
pull_supported: true

infra_modules_needed:
  - base

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
# Rolled out per the S-07 per-plane convention
# (docs/uc_tc_mapping/scenario-methodology-defaults.md). Defaults are not
# fabricated KPIs — they map this plane to the methodology family its
# detection shape already belongs to in the v2.0 master methodology.
validation_methodology: "Benign-Baseline False-Positive Suppression"
methodology_family: "F1"
primary_kpi: "False Positive Rate"
threshold:
  kpi: "False Positive Rate"
  op: "="
  value: 0
  unit: "%"
success_criteria: |
  This is the benign OAuth baseline control — it must NOT alert. The planted
  low-risk scope grant is well within policy. Success means zero false-
  positive detections fire (False Positive Rate = 0%), proving the detection
  logic suppresses legitimate OAuth activity.
moat_tier: "LEAD"

# ── Causality contract ──────────────────────────────────────────────────────
# The oauth_grant_emulator (python3, container-runtime) is the Causality Group
# Owner — the single identity emitting three BENIGN OIDC sign-ins across Okta →
# Microsoft → Google (a shared_entity pivot on `user`). The connected identity
# graph is real, but this is a control: the linked-identity chain must stay
# INFORMATIONAL and must NOT be promoted to an incident (CR-CLOUDAPP-0005
# suppression invariant). Graph connectivity is orthogonal to alerting — the
# detection bodies remain FP-suppression assertions, not threat detections.
cgo_anchor:
  image_name: "python3"
  primary_username: "container-runtime"

external_tools:
  - name: cortexsim-eal-cli
    source: "https://github.com/hankthebldr/cortex-pov-engine"
    type: script
    install_inline: false

steps:
  - id: step-01
    name: "Benign OIDC grant to Okta — must NOT alert"
    command: |
      cat > /tmp/cloud-005-okta.yml <<'YML'
      campaign_id: CMP-CLOUDAPP-005
      name: "Cloud App — benign baseline Okta"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - cortexsim-canary.okta.com
      dry_run: false
      tags: [cloud-app, baseline, fp-validation]
      steps:
        - step_id: step-01
          plugin: oauth_grant_emulator
          params:
            provider: okta
            scope_preset: benign
            iterations: 1
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/cloud-005-okta.yml --live
    identity: container-runtime
    mitre_technique: "T1078.004"
    platforms: ["linux"]
    expected_detections:
      - plane: CLOUD_APP
        type: XQL
        description: "Cloud App — benign OIDC grant to Okta logged informationally (NO risky-scope alert expected)"
        ttp_ref: "TTP-2026-0031"
        detection_id: xql-cloud-005-benign-okta-oidc-grant-informational-not-risky

  - id: step-02
    name: "Benign OIDC grant to Microsoft — must NOT alert"
    command: |
      cat > /tmp/cloud-005-ms.yml <<'YML'
      campaign_id: CMP-CLOUDAPP-005
      name: "Cloud App — benign baseline Microsoft"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - login.microsoftonline.com
      dry_run: false
      steps:
        - step_id: step-01
          plugin: oauth_grant_emulator
          params:
            provider: microsoft
            scope_preset: benign
            iterations: 1
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/cloud-005-ms.yml --live
    identity: container-runtime
    mitre_technique: "T1078.004"
    platforms: ["linux"]
    causality:
      parent_step: step-01
      pivot: shared_entity
    expected_detections:
      - plane: CLOUD_APP
        type: XQL
        description: "Cloud App — benign User.Read grant to Microsoft logged informationally (NO risky-scope alert expected)"
        ttp_ref: "TTP-2026-0031"
        detection_id: xql-cloud-005-benign-microsoft-user-read-grant-informational-not-risky

  - id: step-03
    name: "Benign OIDC grant to Google — must NOT alert"
    command: |
      cat > /tmp/cloud-005-google.yml <<'YML'
      campaign_id: CMP-CLOUDAPP-005
      name: "Cloud App — benign baseline Google"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - accounts.google.com
      dry_run: false
      steps:
        - step_id: step-01
          plugin: oauth_grant_emulator
          params:
            provider: google
            scope_preset: benign
            iterations: 1
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/cloud-005-google.yml --live
    identity: container-runtime
    mitre_technique: "T1078.004"
    platforms: ["linux"]
    causality:
      parent_step: step-02
      pivot: shared_entity
    expected_detections:
      - plane: CLOUD_APP
        type: XQL
        description: "Cloud App — benign OIDC grant to Google logged informationally (NO risky-scope alert expected)"
        ttp_ref: "TTP-2026-0031"
        detection_id: xql-cloud-005-benign-google-oidc-grant-informational-not-risky
      - plane: NDR
        type: XQL
        description: "NGFW EAL — three /authorize App-ID hits classified informational, NOT promoted to incident"
        ttp_ref: "TTP-2026-0031"
        detection_id: xql-cloud-005-ngfw-benign-authorize-hits-informational-not-promoted

cleanup:
  commands:
    - "rm -f /tmp/cloud-005-*.yml"

