scenario_id: SIM-CLOUD-001
name: "Cloud App — Okta Risky OAuth Drive-Scope Grant"
version: "1.0"
status: active

plane: CLOUD_APP
detection_types:
  - BIOC
  - XQL
# GAP-10 (IOC coverage) — the CLOUD_APP plane carries zero IOCs because none of
# the Cloud App cards (TTP-2026-0027..0031) declare a `detections.iocs[]` entry
# yet. A resolvable IOC detection here requires Lane CARDS to first add an IOC
# to the linked card (e.g. a known-malicious OAuth client_id / app-id, or a
# risky-grant redirect-URI domain) — only then can a `type: IOC`
# expected_detection reference a `detection_id` that resolves in the catalog.
# Adding a dangling IOC ref would violate the "only reference detection_ids
# that RESOLVE" rule, so this gap is left tracked-but-open until the card lands.

uc_ref: UCS-ITDR-02
tc_ref: TC-ITDR-03
tc_refs:
  - TC-ITDR-03
  - TC-DLP-11
pov_scenario_id: POV-SC-001
uc_name: "Identity Threat Detection & Response"
tc_name: "Validate CIE syncs and correlates AD, Azure AD, and cloud IdPs"

mitre_tactic: "TA0001"
mitre_tactic_name: "Initial Access"
mitre_technique: "T1550.001"
mitre_technique_name: "Use Alternate Authentication Material: Application Access Token"
additional_techniques:
  - technique: "T1528"
    name: "Steal Application Access Token"

threat_report: "Unit42 - OAuth Phishing Apps in the Enterprise"
threat_report_url: "https://unit42.paloaltonetworks.com/"

execution_identity:
  default: container-runtime
  options:
    - container-runtime
    - root

push_supported: true
pull_supported: true

infra_modules_needed:
  - base

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
# Rolled out per the S-07 per-plane convention
# (docs/uc_tc_mapping/scenario-methodology-defaults.md). Defaults are not
# fabricated KPIs — they map this plane to the methodology family its
# detection shape already belongs to in the v2.0 master methodology.
validation_methodology: "OAuth-Grant Signal Injection & Detection Accuracy"
methodology_family: "F1"
primary_kpi: "Detection Accuracy"
threshold:
  kpi: "Detection Accuracy"
  op: "≥"
  value: 90
  unit: "%"
success_criteria: |
  The outbound OAuth-authorize requests with planted risky scopes produce
  the expected Cortex Cloud App Security detection. Detection Accuracy is
  the share of injected grants that raise the expected alert (target ≥ 90%).
moat_tier: "LEAD"

external_tools:
  - name: cortexsim-eal-cli
    source: "https://github.com/hankthebldr/cortex-pov-engine"
    type: script
    install_inline: false

# ── Causality contract ──────────────────────────────────────────────────────
# This is a SaaS/CASB identity-correlation scenario, NOT an endpoint
# process-causality chain: the detections key on the okta_sso / saas_audit_logs
# grant-audit shape, not on a process tree. There is deliberately NO cgo_anchor
# — the only endpoint process is the EAL emulator (our tooling/beacon), which
# the contract forbids as a CGO, and the SaaS datasets carry no
# causality_actor_process_* fields to anchor. Instead the connected graph is
# formed on the shared SOURCE IDENTITY: every risky grant leaves the same
# jumpbox source_ip against the same canary tenant, so the repeated grants
# stitch via shared_entity into ONE consent-phishing / enumeration-burst
# incident rather than hanging off the beacon as independent events. step-01 is
# a local readiness probe (the root); the grant requests chain from it.

steps:
  - id: step-01
    name: "Pre-flight: confirm oauth_grant_emulator plugin is registered"
    command: |
      python3 -m scripts.eal_simulator.cli describe oauth_grant_emulator \
        | jq -e '.eal_targets | length > 0'
    identity: container-runtime
    mitre_technique: "T1550.001"
    platforms: ["linux", "container"]
    expected_detections:
      - plane: CLOUD_APP
        type: BIOC
        description: "Pre-flight: oauth_grant_emulator metadata visible to operator"
        ttp_ref: "TTP-2026-0027"
        detection_id: bioc-cloud-001-pre-flight-oauth-grant-emulator-plugin-registered

  - id: step-02
    name: "Single risky-drive grant request to Okta authorize endpoint"
    command: |
      cat > /tmp/cloud-001.yml <<'YML'
      campaign_id: CMP-CLOUDAPP-001
      name: "Cloud App — Okta risky drive grant"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - cortexsim-canary.okta.com
      dry_run: false
      tags: [cloud-app, okta, oauth, risky-scope]
      steps:
        - step_id: step-01
          plugin: oauth_grant_emulator
          params:
            provider: okta
            scope_preset: risky_drive
            iterations: 1
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/cloud-001.yml --live
    identity: container-runtime
    mitre_technique: "T1550.001"
    platforms: ["linux", "container"]
    causality:
      parent_step: step-01
      pivot: shared_entity
    expected_detections:
      - plane: CLOUD_APP
        type: XQL
        description: "Cloud App — outbound OAuth authorize to Okta carrying drive-wide scope"
        ttp_ref: "TTP-2026-0027"
        detection_id: xql-cloud-001-okta-risky-drive-wide-oauth-scope-grant
      - plane: NDR
        type: XQL
        description: "NGFW EAL — outbound /oauth2/v1/authorize App-ID match to *.okta.com"
        ttp_ref: "TTP-2026-0027"
        detection_id: xql-cloud-001-ngfw-okta-oauth-authorize-risky-scope-egress

  - id: step-03
    name: "Repeated grant attempts (x3) to confirm rate-pattern detection"
    command: |
      cat > /tmp/cloud-001-burst.yml <<'YML'
      campaign_id: CMP-CLOUDAPP-001
      name: "Cloud App — Okta risky grant burst"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - cortexsim-canary.okta.com
      dry_run: false
      steps:
        - step_id: step-01
          plugin: oauth_grant_emulator
          params:
            provider: okta
            scope_preset: risky_drive
            iterations: 3
            sleep_seconds: 5
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/cloud-001-burst.yml --live
    identity: container-runtime
    mitre_technique: "T1550.001"
    platforms: ["linux", "container"]
    causality:
      parent_step: step-02
      pivot: shared_entity
    expected_detections:
      - plane: CLOUD_APP
        type: XQL
        description: "Cloud App — repeated risky grant attempts (3 in <60s) flagged as enumeration pattern"
        ttp_ref: "TTP-2026-0027"
        detection_id: xql-cloud-001-okta-repeated-risky-grant-enumeration-burst

cleanup:
  commands:
    - "rm -f /tmp/cloud-001.yml /tmp/cloud-001-burst.yml"

