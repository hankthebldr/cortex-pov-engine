scenario_id: SIM-EMAIL-002
name: "EMAIL — Malicious Attachment (macro / ISO / HTML-smuggling) via Proofpoint TAP + Microsoft 365"
version: "1.0"
status: active

plane: EMAIL
detection_types:
  - BIOC
  - XQL

uc_ref: UCS-AES-03
tc_ref: TC-AES-05
pov_scenario_id: POV-SC-063
uc_name: "Advanced Email Security"
tc_name: "Validate detection of malicious attachments including macro-laden documents, encrypted archives with malware, and embedded exploit payloads"

mitre_tactic: "TA0001"
mitre_tactic_name: "Initial Access"
mitre_technique: "T1566.001"
mitre_technique_name: "Phishing: Spearphishing Attachment"

threat_report: "Cortex XSIAM — Proofpoint TAP Ingestion & Modeling (proofpoint_tap_raw)"
threat_report_url: "https://docs-cortex.paloaltonetworks.com/"

execution_identity:
  default: container-runtime
  options:
    - container-runtime
    - root

push_supported: true
pull_supported: true

infra_modules_needed:
  - base

validation_methodology: "Email Signal Injection & Detection Accuracy"
methodology_family: "F1"
primary_kpi: "Detection Accuracy"
threshold:
  kpi: "Detection Accuracy"
  op: "≥"
  value: 90
  unit: "%"
success_criteria: |
  The synthetic Proofpoint TAP / Microsoft 365 malware-attachment signals
  emitted by this scenario produce the expected Cortex XSIAM malware-attachment
  detection. Detection Accuracy is the share of injected email events that raise
  the expected alert (target ≥ 90%).
moat_tier: "LEAD"

# ── Causality contract ──────────────────────────────────────────────────────
# Email-log analytics scenario, NOT an endpoint process-causality chain:
# detections key on the proofpoint_tap_raw / msft_o365 message shape, not a
# process tree. There is deliberately NO cgo_anchor — the only endpoint process
# is the email_emitter EAL plugin (our tooling/beacon), which the contract
# forbids as a CGO, and the email datasets carry no causality_actor_process_*
# fields to anchor. The connected graph is formed on the shared RECIPIENT
# MAILBOX plus the shared attachment sha256: the same recipient (ada.lovelace)
# receives the malware-attachment lure across both the Proofpoint TAP (step-02)
# and the Microsoft 365 (step-03) provider shapes, so they stitch via
# shared_entity into ONE malware-delivery signal rather than hanging off the
# beacon. step-01 is a local readiness probe (the root).

external_tools:
  - name: cortexsim-eal-cli
    source: "https://github.com/hankthebldr/cortex-pov-engine"
    type: script
    install_inline: false

steps:
  - id: step-01
    name: "Pre-flight: confirm email_emitter plugin is registered"
    command: |
      python3 -m scripts.eal_simulator.cli describe email_emitter \
        | jq -e '.eal_targets | length > 0'
    identity: container-runtime
    mitre_technique: "T1566.001"
    platforms: ["linux", "container"]
    expected_detections:
      - plane: EMAIL
        type: BIOC
        description: "Pre-flight: email_emitter metadata visible to operator"
        ttp_ref: "TTP-2026-0091"
        detection_id: bioc-email-002-pre-flight-email-emitter-metadata-visible

  - id: step-02
    name: "Emit a malicious-attachment message burst (Proofpoint TAP shape)"
    command: |
      : "${COLLECTOR_URL:=https://collector.cortexsim-canary.invalid/email/events}"
      : "${COLLECTOR_HOST:=collector.cortexsim-canary.invalid}"
      cat > /tmp/email-002.yml <<YML
      campaign_id: CMP-EMAIL-002
      name: "EMAIL — Proofpoint TAP malicious attachment"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - "$COLLECTOR_HOST"
      dry_run: false
      tags: [email, proofpoint, malicious-attachment]
      steps:
        - step_id: step-01
          plugin: email_emitter
          params:
            collector_url: "$COLLECTOR_URL"
            provider: proofpoint
            event_pattern: malicious_attachment
            target_user: "ada.lovelace@cortexsim-canary.invalid"
            iterations: 1
            burst_count: 4
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/email-002.yml --live
    identity: container-runtime
    mitre_technique: "T1566.001"
    platforms: ["linux", "container"]
    causality:
      parent_step: step-01
      pivot: shared_entity
    expected_detections:
      - plane: EMAIL
        type: XQL
        description: "EMAIL — malware-classified attachment blocked by Proofpoint TAP for one recipient"
        ttp_ref: "TTP-2026-0091"
        detection_id: xql-email-002-malicious-attachment-blocked-by-tap

  - id: step-03
    name: "Repeat the pattern with Microsoft 365 event shape — confirm parser works for both"
    command: |
      : "${COLLECTOR_URL:=https://collector.cortexsim-canary.invalid/email/events}"
      : "${COLLECTOR_HOST:=collector.cortexsim-canary.invalid}"
      cat > /tmp/email-002-m365.yml <<YML
      campaign_id: CMP-EMAIL-002
      name: "EMAIL — Microsoft 365 malicious attachment"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - "$COLLECTOR_HOST"
      dry_run: false
      steps:
        - step_id: step-01
          plugin: email_emitter
          params:
            collector_url: "$COLLECTOR_URL"
            provider: microsoft365
            event_pattern: malicious_attachment
            target_user: "ada.lovelace@cortexsim-canary.invalid"
            iterations: 1
            burst_count: 4
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/email-002-m365.yml --live
    identity: container-runtime
    mitre_technique: "T1566.001"
    platforms: ["linux", "container"]
    causality:
      parent_step: step-02
      pivot: shared_entity
    expected_detections:
      - plane: EMAIL
        type: XQL
        description: "EMAIL — malware-attachment alert fires identically for Microsoft 365 EmailEvents shape"
        ttp_ref: "TTP-2026-0091"
        detection_id: xql-email-002-malicious-attachment-microsoft-365-emailevents-shape

cleanup:
  commands:
    - "rm -f /tmp/email-002.yml /tmp/email-002-m365.yml"

author: "Henry Reed"
created: "2026-06-17"
last_updated: "2026-06-17"
tags:
  - email
  - proofpoint
  - microsoft365
  - malicious-attachment
  - eal-plugin
