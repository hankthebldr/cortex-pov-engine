scenario_id: SIM-AIACC-005
name: "AI Access — Cross-Provider Rotation (OpenAI → Gemini → Anthropic)"
version: "1.1"
status: active

plane: AI_ACCESS
detection_types:
  - XQL

uc_ref: UCS-DLP-06
tc_ref: TC-DLP-11
pov_scenario_id: POV-SC-001
uc_name: "Data Loss Prevention (DLP)"
tc_name: "Validate DLP monitors and controls sensitive data movement across sanctioned and unsanctioned SaaS applications"

mitre_tactic: "TA0005"
mitre_tactic_name: "Defense Evasion"
mitre_technique: "T1090"
mitre_technique_name: "Proxy"
additional_techniques:
  - technique: "T1567"
    name: "Exfiltration Over Web Service"

threat_report: "Unit42 - AI Provider Hopping for Policy Evasion"
threat_report_url: "https://unit42.paloaltonetworks.com/"

execution_identity:
  default: container-runtime
  options:
    - container-runtime
    - root

push_supported: true
pull_supported: true

infra_modules_needed:
  - base

# ── Causality Group Owner anchor + cross-provider stitch contract ────────────
# The rotation runs from one containerized workload (identity container-runtime);
# the real CGO is the container runtime that owns the app process tree, NOT the
# synthetic cortexsim-agent beacon. The whole scenario IS an identity stitch —
# one user rotating three providers in <5 min — so the per-step `causality`
# blocks wire a connected containerd-shim -> OpenAI -> Gemini -> Anthropic spine
# whose edges are the shared source identity, and stitching_key/window below let
# the causality graph key the cross-provider evidence edges on that user within
# the 5-minute rotation window (matching correlation CR-AIACC-0005).
cgo_anchor:
  image_name: "containerd-shim"
  primary_username: "root"

stitching_key: user_principal
correlation_window_seconds: 300

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
# Rolled out per the S-07 per-plane convention
# (docs/uc_tc_mapping/scenario-methodology-defaults.md). Defaults are not
# fabricated KPIs — they map this plane to the methodology family its
# detection shape already belongs to in the v2.0 master methodology.
validation_methodology: "LLM-Egress DLP Signal Injection & Detection Accuracy"
methodology_family: "F1"
primary_kpi: "Detection Accuracy"
threshold:
  kpi: "Detection Accuracy"
  op: "≥"
  value: 90
  unit: "%"
success_criteria: |
  The outbound LLM-provider egress with planted DLP markers produces the
  expected Cortex AI Access Security detection. Detection Accuracy is the
  share of injected egress events that raise the expected DLP alert (target
  ≥ 90%).
moat_tier: "LEAD"

# ── Lab-contained / mock provider target (PLANE-AIACCESS-ISOLATED) ───────────
# By default this scenario egresses to the real public AI provider
# (api.openai.com / api.anthropic.com / generativelanguage.googleapis.com) so
# the customer NGFW + Cortex AI Access Security see authentic generative-AI
# App-ID traffic. For air-gapped / lab POVs where outbound to a real provider
# is undesirable, run a contained mock target instead — mirroring the in-tree
# `cortex-vulnerable-llm` pattern (sources/cortex-vulnerable-llm/, served on
# :8089 with no real LLM calls and no API keys):
#
#   cortex-vulnerable-llm serve --port 8089 --vuln all
#
# Then point the EAL campaign at the contained host by overriding the campaign
# `target_allowlist` (and, once the llm_provider_egress plugin grows a
# `mock_target`/`base_url` param — tracked for the EAL lane —, set it to
# http://127.0.0.1:8089). The DLP canary markers (CORTEXSIM-CANARY, AKIA…CANARY)
# travel in the request body either way, so the AI_ACCESS / NGFW detections
# fire identically against the mock target. This keeps the scenario runnable
# with a lab-contained fallback rather than only hitting real providers.

external_tools:
  - name: cortexsim-eal-cli
    source: "https://github.com/hankthebldr/cortex-pov-engine"
    type: script
    install_inline: false

steps:
  - id: step-01
    name: "Provider 1 — OpenAI"
    command: |
      cat > /tmp/aiacc-005-openai.yml <<'YML'
      campaign_id: CMP-AIACC-005
      name: "AI Access — rotation step 1 OpenAI"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - api.openai.com
      dry_run: false
      tags: [ai-access, cross-provider, rotation]
      steps:
        - step_id: step-01
          plugin: llm_provider_egress
          params:
            provider: openai
            payload_type: source
            iterations: 1
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/aiacc-005-openai.yml --live
    identity: container-runtime
    mitre_technique: "T1567"
    platforms: ["linux", "container", "windows", "macos"]
    # Provider hopping is a client-OS-agnostic egress pattern — the same user
    # can start the rotation from a Windows laptop or macOS; AI Access Security
    # keys on the identity, not the client OS.
    platform_variants:
      windows: "Invoke-RestMethod -Method Post -Uri 'https://api.openai.com/v1/chat/completions' -Headers @{ Authorization = \"Bearer $env:OPENAI_API_KEY\" } -ContentType 'application/json' -Body '{\"model\":\"gpt-4o\",\"messages\":[{\"role\":\"user\",\"content\":\"review this source\"}]}'"
      macos: "curl -s https://api.openai.com/v1/chat/completions -H \"Authorization: Bearer $OPENAI_API_KEY\" -H 'Content-Type: application/json' -d '{\"model\":\"gpt-4o\",\"messages\":[{\"role\":\"user\",\"content\":\"review this source\"}]}'"
    expected_detections:
      - plane: AI_ACCESS
        type: XQL
        description: "AI Access — first egress to api.openai.com, user marked active in provider matrix"
        ttp_ref: "TTP-2026-0011"
        detection_id: xql-aiacc-005-first-egress-to-openai-user-active-in-provider-matrix

  - id: step-02
    name: "Provider 2 — Gemini (overlapping content within 60s)"
    command: |
      sleep 30
      cat > /tmp/aiacc-005-gemini.yml <<'YML'
      campaign_id: CMP-AIACC-005
      name: "AI Access — rotation step 2 Gemini"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - generativelanguage.googleapis.com
      dry_run: false
      steps:
        - step_id: step-01
          plugin: llm_provider_egress
          params:
            provider: gemini
            payload_type: source
            iterations: 1
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/aiacc-005-gemini.yml --live
    identity: container-runtime
    mitre_technique: "T1090"
    # Same user rotates to the second provider ~30s later — one identity, no
    # process fork; shared_entity is the rotation edge the stitch keys on.
    causality:
      parent_step: "step-01"
      pivot: shared_entity
    platforms: ["linux", "container"]
    expected_detections:
      - plane: AI_ACCESS
        type: XQL
        description: "AI Access — same user observed at second provider (Gemini) within rotation window"
        ttp_ref: "TTP-2026-0011"
        detection_id: xql-aiacc-005-same-user-second-provider-gemini-within-rotation-window

  - id: step-03
    name: "Provider 3 — Anthropic completes the rotation triangle"
    command: |
      sleep 30
      cat > /tmp/aiacc-005-anthropic.yml <<'YML'
      campaign_id: CMP-AIACC-005
      name: "AI Access — rotation step 3 Anthropic"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - api.anthropic.com
      dry_run: false
      steps:
        - step_id: step-01
          plugin: llm_provider_egress
          params:
            provider: anthropic
            payload_type: source
            iterations: 1
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/aiacc-005-anthropic.yml --live
    identity: container-runtime
    mitre_technique: "T1090"
    # Same user completes the rotation triangle at the third provider, closing
    # the <5-min window — shared_entity on the single identity is exactly the
    # join the XSIAM stitch + provider-hopping alert correlate on.
    causality:
      parent_step: "step-02"
      pivot: shared_entity
    platforms: ["linux", "container"]
    expected_detections:
      - plane: AI_ACCESS
        type: XQL
        description: "AI Access — three providers within 5 min from same user — provider-hopping policy evasion alert"
        ttp_ref: "TTP-2026-0011"
        detection_id: xql-aiacc-005-three-providers-within-five-minutes-provider-hopping
      - plane: ANALYTICS
        type: XQL
        description: "XSIAM stitching — single user identity correlates the three provider sessions into one incident"
        ttp_ref: "TTP-2026-0011"
        detection_id: xql-aiacc-005-xsiam-stitch-single-user-three-provider-sessions
      - plane: NDR
        type: XQL
        description: "NGFW EAL — generative-AI App-ID across three FQDNs sharing X-Simulation-Run-ID prefix"
        ttp_ref: "TTP-2026-0011"
        detection_id: xql-aiacc-005-ngfw-generative-ai-app-id-across-three-fqdns-shared-run-id

cleanup:
  commands:
    - "rm -f /tmp/aiacc-005-*.yml"

