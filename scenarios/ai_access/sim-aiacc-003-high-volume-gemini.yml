scenario_id: SIM-AIACC-003
name: "AI Access — High-Volume Gemini Prompt Burst from Single User"
version: "1.1"
status: active

plane: AI_ACCESS
detection_types:
  - XQL

uc_ref: UCS-AIACC-03
tc_ref: TC-AIACC-03
uc_name: "Anomalous AI Provider Usage Volume"
tc_name: "Burst of Outbound Prompts to Google Gemini API"

mitre_tactic: "TA0010"
mitre_tactic_name: "Exfiltration"
mitre_technique: "T1567"
mitre_technique_name: "Exfiltration Over Web Service"

threat_report: "Unit42 - Generative AI Misuse Patterns"
threat_report_url: "https://unit42.paloaltonetworks.com/"

execution_identity:
  default: container-runtime
  options:
    - container-runtime
    - root

push_supported: true
pull_supported: true

infra_modules_needed:
  - base

# ── Causality Group Owner anchor ─────────────────────────────────────────────
# The burst egress runs from a containerized workload (identity
# container-runtime); the real CGO is the container runtime that owns the app
# process tree, NOT the synthetic cortexsim-agent beacon. The per-step
# `causality` blocks below collapse the star into a connected
# containerd-shim → step-01 → step-02 → step-03 spine keyed on the shared source
# identity (same user / src_ip / container) that every detection here pivots on.
cgo_anchor:
  image_name: "containerd-shim"
  primary_username: "root"

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
# Rolled out per the S-07 per-plane convention
# (docs/uc_tc_mapping/scenario-methodology-defaults.md). Defaults are not
# fabricated KPIs — they map this plane to the methodology family its
# detection shape already belongs to in the v2.0 master methodology.
validation_methodology: "LLM-Egress DLP Signal Injection & Detection Accuracy"
methodology_family: "F1"
primary_kpi: "Detection Accuracy"
threshold:
  kpi: "Detection Accuracy"
  op: "≥"
  value: 90
  unit: "%"
success_criteria: |
  The outbound LLM-provider egress with planted DLP markers produces the
  expected Cortex AI Access Security detection. Detection Accuracy is the
  share of injected egress events that raise the expected DLP alert (target
  ≥ 90%).
moat_tier: "LEAD"

# ── Lab-contained / mock provider target (PLANE-AIACCESS-ISOLATED) ───────────
# By default this scenario egresses to the real public AI provider
# (api.openai.com / api.anthropic.com / generativelanguage.googleapis.com) so
# the customer NGFW + Cortex AI Access Security see authentic generative-AI
# App-ID traffic. For air-gapped / lab POVs where outbound to a real provider
# is undesirable, run a contained mock target instead — mirroring the in-tree
# `cortex-vulnerable-llm` pattern (sources/cortex-vulnerable-llm/, served on
# :8089 with no real LLM calls and no API keys):
#
#   cortex-vulnerable-llm serve --port 8089 --vuln all
#
# Then point the EAL campaign at the contained host by overriding the campaign
# `target_allowlist` (and, once the llm_provider_egress plugin grows a
# `mock_target`/`base_url` param — tracked for the EAL lane —, set it to
# http://127.0.0.1:8089). The DLP canary markers (CORTEXSIM-CANARY, AKIA…CANARY)
# travel in the request body either way, so the AI_ACCESS / NGFW detections
# fire identically against the mock target. This keeps the scenario runnable
# with a lab-contained fallback rather than only hitting real providers.

external_tools:
  - name: cortexsim-eal-cli
    source: "https://github.com/hankthebldr/cortex-pov-engine"
    type: script
    install_inline: false

steps:
  - id: step-01
    name: "Pre-flight DNS resolution for generativelanguage.googleapis.com"
    command: |
      getent hosts generativelanguage.googleapis.com || true
      echo "[CortexSim] burst target reachable"
    identity: container-runtime
    mitre_technique: "T1567"
    platforms: ["linux", "container"]
    expected_detections:
      - plane: AI_ACCESS
        type: XQL
        description: "Pre-flight: provider host resolvable from worker"
        ttp_ref: "TTP-2026-0009"
        detection_id: xql-aiacc-003-pre-flight-gemini-provider-host-resolvable

  - id: step-02
    name: "Fire 30 sequential prompts to trigger volume baseline"
    command: |
      cat > /tmp/aiacc-003.yml <<'YML'
      campaign_id: CMP-AIACC-003
      name: "AI Access — Gemini burst"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - generativelanguage.googleapis.com
      dry_run: false
      tags: [ai-access, gemini, volume-anomaly]
      steps:
        - step_id: step-01
          plugin: llm_provider_egress
          params:
            provider: gemini
            payload_type: benign
            iterations: 30
            sleep_seconds: 2
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/aiacc-003.yml --live
    identity: container-runtime
    mitre_technique: "T1567"
    # Same containerized workload / source identity as the pre-flight — no
    # process fork between the DNS check and the burst, so the honest pivot is
    # the shared source entity (user / src_ip / container) the volume detections
    # key on, not process_lineage.
    causality:
      parent_step: "step-01"
      pivot: shared_entity
    platforms: ["linux", "container", "windows", "macos"]
    # The volume anomaly is a client-OS-agnostic egress pattern: AI Access
    # Security / the NGFW see the same sustained generative-AI session count
    # whether the employee bursts from Linux, a Windows laptop, or macOS.
    platform_variants:
      windows: "1..30 | ForEach-Object { Invoke-RestMethod -Method Post -Uri 'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent' -ContentType 'application/json' -Body '{\"contents\":[{\"parts\":[{\"text\":\"benign\"}]}]}'; Start-Sleep -Seconds 2 }"
      macos: "for i in $(seq 30); do curl -s -X POST 'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent' -H 'Content-Type: application/json' -d '{\"contents\":[{\"parts\":[{\"text\":\"benign\"}]}]}' >/dev/null; sleep 2; done"
    expected_detections:
      - plane: AI_ACCESS
        type: XQL
        description: "AI Access — request rate per user exceeds rolling baseline (30 in <90s)"
        ttp_ref: "TTP-2026-0009"
        detection_id: xql-aiacc-003-gemini-request-rate-exceeds-per-user-baseline
      - plane: NDR
        type: XQL
        description: "NGFW EAL — sustained generative-AI session count from single src IP"
        ttp_ref: "TTP-2026-0009"
        detection_id: xql-aiacc-003-ngfw-sustained-generative-ai-session-count-single-source
      - plane: AI_ACCESS
        type: XQL
        description: "AI Access — sanctioned-vs-unsanctioned-AI policy: Gemini classified as unsanctioned for this user"
        ttp_ref: "TTP-2026-0009"
        detection_id: xql-aiacc-003-unsanctioned-ai-provider-gemini-for-user

  - id: step-03
    name: "Cool-off window then a single probe to confirm baseline restoration"
    command: |
      echo "[CortexSim] sleeping 120s to allow baseline restoration"
      sleep 120
      cat > /tmp/aiacc-003-cool.yml <<'YML'
      campaign_id: CMP-AIACC-003
      name: "AI Access — Gemini cool-off probe"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - generativelanguage.googleapis.com
      dry_run: false
      steps:
        - step_id: step-01
          plugin: llm_provider_egress
          params:
            provider: gemini
            payload_type: benign
            iterations: 1
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/aiacc-003-cool.yml --live
    identity: container-runtime
    mitre_technique: "T1567"
    # Negative-control probe from the same workload/identity as the burst,
    # 120s later — same source entity, no fork; below baseline so it must NOT
    # fire. shared_entity keeps it on the same spine without claiming lineage.
    causality:
      parent_step: "step-02"
      pivot: shared_entity
    platforms: ["linux", "container"]
    expected_detections:
      - plane: AI_ACCESS
        type: XQL
        description: "AI Access — single post-cooloff request below baseline, no detection"
        ttp_ref: "TTP-2026-0009"
        detection_id: xql-aiacc-003-post-cooloff-single-gemini-request-below-baseline

cleanup:
  commands:
    - "rm -f /tmp/aiacc-003.yml /tmp/aiacc-003-cool.yml"

author: "Henry Reed"
created: "2026-05-05"
last_updated: "2026-05-07"
