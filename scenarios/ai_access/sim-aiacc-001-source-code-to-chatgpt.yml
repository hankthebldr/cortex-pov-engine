scenario_id: SIM-AIACC-001
name: "AI Access — Source Code Paste to Public ChatGPT"
version: "1.1"
status: active

plane: AI_ACCESS
detection_types:
  - BIOC
  - XQL

uc_ref: UCS-AIACC-01
tc_ref: TC-AIACC-01
uc_name: "Shadow-AI Source Code Disclosure"
tc_name: "Multi-File Source Code Paste to OpenAI ChatGPT API"

mitre_tactic: "TA0010"
mitre_tactic_name: "Exfiltration"
mitre_technique: "T1567"
mitre_technique_name: "Exfiltration Over Web Service"
additional_techniques:
  - technique: "T1041"
    name: "Exfiltration Over C2 Channel"

threat_report: "Unit42 - Shadow AI in the Enterprise"
threat_report_url: "https://unit42.paloaltonetworks.com/"

execution_identity:
  default: container-runtime
  options:
    - container-runtime
    - root

push_supported: true
pull_supported: true

infra_modules_needed:
  - base

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
# Rolled out per the S-07 per-plane convention
# (docs/uc_tc_mapping/scenario-methodology-defaults.md). Defaults are not
# fabricated KPIs — they map this plane to the methodology family its
# detection shape already belongs to in the v2.0 master methodology.
validation_methodology: "LLM-Egress DLP Signal Injection & Detection Accuracy"
methodology_family: "F1"
primary_kpi: "Detection Accuracy"
threshold:
  kpi: "Detection Accuracy"
  op: "≥"
  value: 90
  unit: "%"
success_criteria: |
  The outbound LLM-provider egress with planted DLP markers produces the
  expected Cortex AI Access Security detection. Detection Accuracy is the
  share of injected egress events that raise the expected DLP alert (target
  ≥ 90%).
moat_tier: "LEAD"

# ── Lab-contained / mock provider target (PLANE-AIACCESS-ISOLATED) ───────────
# By default this scenario egresses to the real public AI provider
# (api.openai.com / api.anthropic.com / generativelanguage.googleapis.com) so
# the customer NGFW + Cortex AI Access Security see authentic generative-AI
# App-ID traffic. For air-gapped / lab POVs where outbound to a real provider
# is undesirable, run a contained mock target instead — mirroring the in-tree
# `cortex-vulnerable-llm` pattern (sources/cortex-vulnerable-llm/, served on
# :8089 with no real LLM calls and no API keys):
#
#   cortex-vulnerable-llm serve --port 8089 --vuln all
#
# Then point the EAL campaign at the contained host by overriding the campaign
# `target_allowlist` (and, once the llm_provider_egress plugin grows a
# `mock_target`/`base_url` param — tracked for the EAL lane —, set it to
# http://127.0.0.1:8089). The DLP canary markers (CORTEXSIM-CANARY, AKIA…CANARY)
# travel in the request body either way, so the AI_ACCESS / NGFW detections
# fire identically against the mock target. This keeps the scenario runnable
# with a lab-contained fallback rather than only hitting real providers.

external_tools:
  - name: cortexsim-eal-cli
    source: "https://github.com/hankthebldr/cortex-pov-engine"
    type: script
    install_inline: false

steps:
  - id: step-01
    name: "Pre-flight: confirm llm_provider_egress plugin is registered"
    command: |
      python3 -m scripts.eal_simulator.cli describe llm_provider_egress \
        | jq -e '.eal_targets | length > 0'
    identity: container-runtime
    mitre_technique: "T1567"
    expected_detections:
      - plane: AI_ACCESS
        type: BIOC
        description: "Pre-flight: plugin metadata visible to operator"
        ttp_ref: "TTP-2026-0007"
        detection_id: bioc-aiacc-001-pre-flight-llm-provider-egress-plugin-registered

  - id: step-02
    name: "Single source-code POST to api.openai.com via EAL plugin"
    command: |
      cat > /tmp/aiacc-001.yml <<'YML'
      campaign_id: CMP-AIACC-001
      name: "AI Access — source paste to OpenAI"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - api.openai.com
      dry_run: false
      tags: [ai-access, openai, source-paste]
      steps:
        - step_id: step-01
          plugin: llm_provider_egress
          params:
            provider: openai
            payload_type: source
            iterations: 1
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/aiacc-001.yml --live
    identity: container-runtime
    mitre_technique: "T1567"
    expected_detections:
      - plane: AI_ACCESS
        type: XQL
        description: "AI Access — outbound POST to api.openai.com containing source-code shape (CORTEXSIM-CANARY marker)"
        ttp_ref: "TTP-2026-0007"
        detection_id: xql-aiacc-001-source-code-shape-post-to-openai-with-canary-marker
      - plane: AI_ACCESS
        type: XQL
        description: "AI Access — DLP regex match on source-code structure in prompt body"
        ttp_ref: "TTP-2026-0007"
        detection_id: xql-aiacc-001-dlp-source-code-structure-regex-match-in-llm-prompt
      - plane: NDR
        type: XQL
        description: "NGFW EAL — generative-AI App-ID match on outbound HTTPS to api.openai.com"
        ttp_ref: "TTP-2026-0007"
        detection_id: xql-aiacc-001-ngfw-generative-ai-app-id-outbound-https-to-openai

  - id: step-03
    name: "Repeated POSTs (x3) to confirm stable per-session detection"
    command: |
      cat > /tmp/aiacc-001-burst.yml <<'YML'
      campaign_id: CMP-AIACC-001
      name: "AI Access — source paste burst"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - api.openai.com
      dry_run: false
      steps:
        - step_id: step-01
          plugin: llm_provider_egress
          params:
            provider: openai
            payload_type: source
            iterations: 3
            sleep_seconds: 5
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/aiacc-001-burst.yml --live
    identity: container-runtime
    mitre_technique: "T1567"
    expected_detections:
      - plane: AI_ACCESS
        type: XQL
        description: "AI Access — repeated POST pattern (3 in <60s) flagged as policy violation"
        ttp_ref: "TTP-2026-0007"
        detection_id: xql-aiacc-001-repeated-source-paste-burst-to-openai-single-user

cleanup:
  commands:
    - "rm -f /tmp/aiacc-001.yml /tmp/aiacc-001-burst.yml"

author: "Henry Reed"
created: "2026-05-05"
last_updated: "2026-05-07"
