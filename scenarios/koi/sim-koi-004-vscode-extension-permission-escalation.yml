scenario_id: SIM-KOI-004
name: "KOI — Malicious VS Code Extension Permission Escalation"
version: "1.1"
status: active

plane: KOI
detection_types:
  - BIOC
  - XQL

uc_ref: UCS-SCA-01
tc_ref: TC-SCA-01
pov_scenario_id: POV-SC-012
uc_name: "Software Composition Analysis"
tc_name: "Validate Dependency Vulnerability Detection — Known CVEs detected in direct and transitive dependencies across npm, pip, Maven, Go, NuGet"

# S-16 — remapped off T1176 ("Browser Extensions"). A malicious VS Code
# extension distributed via the marketplace is a software-supply-chain
# vector (T1195), not a browser extension. Primary technique is now T1195
# (Initial Access); the credential-stealing payload that executes in
# activate() is captured by T1059 (Command & Scripting Interpreter) and
# T1552.001 (Unsecured Credentials: In Files) — both backed by TTP-2026-0045.
mitre_tactic: "TA0001"
mitre_tactic_name: "Initial Access"
mitre_technique: "T1195"
mitre_technique_name: "Supply Chain Compromise"
additional_techniques:
  - technique: "T1059"
    name: "Command and Scripting Interpreter"
  - technique: "T1552.001"
    name: "Unsecured Credentials: Credentials In Files"

threat_report: "Unit42 - VS Code Marketplace Risk 2026"
threat_report_url: "https://unit42.paloaltonetworks.com/"

execution_identity:
  default: container-runtime
  options:
    - container-runtime

push_supported: true
pull_supported: true

required_content:
  - repo: "hankthebldr/cortex-malicious-agentic-pack"

infra_modules_needed:
  - base

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
# Rolled out per the S-07 per-plane convention
# (docs/uc_tc_mapping/scenario-methodology-defaults.md). Defaults are not
# fabricated KPIs — they map this plane to the methodology family its
# detection shape already belongs to in the v2.0 master methodology.
validation_methodology: "Agentic / Supply-Chain Signal Injection & Detection Accuracy"
methodology_family: "F1"
primary_kpi: "Detection Accuracy"
threshold:
  kpi: "Detection Accuracy"
  op: "≥"
  value: 90
  unit: "%"
success_criteria: |
  The agentic / supply-chain artifact (MCP server, skill, extension, PyPI
  package) produces the expected Cortex detection on scan + egress.
  Detection Accuracy is the share of injected agentic signals that raise the
  expected alert (target ≥ 90%). Agentic endpoint coverage has no point-
  product equivalent.
moat_tier: "MOAT"

# ── Causality contract ──────────────────────────────────────────────────────
# VS Code (the IDE host, image code/node) is the Causality Group Owner — the
# process that loads the extension and, on activation, reads ~/.aws + ~/.ssh and
# beacons out — NOT the synthetic beacon. The manifest-scan (step-01) roots at
# the CGO; the .vsix fetch (step-02) stitches the endpoint finding to its NGFW
# session; activation (step-03) is the fetched artifact escalating to
# credential-theft impact, so the graph is one connected spine.
cgo_anchor:
  image_name: "code"
  primary_username: "developer"

external_tools:
  - name: Cortex Malicious Agentic Pack
    source: "https://github.com/hankthebldr/cortex-pov-engine"
    type: script
    install_inline: false
    adapter_ref: TOOL-CORTEX-AGENTIC-PACK
  - name: cortexsim-eal-cli
    source: "https://github.com/hankthebldr/cortex-pov-engine"
    type: script
    install_inline: false

steps:
  - id: step-01
    name: "Read the malicious extension's package.json from the in-tree source"
    command: |
      # The artifact pack ships the .vsix payload as an unpacked source
      # tree under vscode/helpful-ai-assistant/ — Cortex Cloud Code
      # scans the source directly, no unzip required. tools/build-
      # artifacts.sh packs it into a real .vsix when needed.
      EXT_ROOT=sources/cortex-malicious-agentic-pack/vscode/helpful-ai-assistant
      ls -la "$EXT_ROOT"/extension/
      jq '.contributes, .activationEvents, .extensionDependencies' \
        "$EXT_ROOT"/extension/package.json
    identity: container-runtime
    mitre_technique: "T1195"
    platforms: ["linux", "macos", "windows", "container"]
    platform_variants:
      windows: "Get-Content \"$env:USERPROFILE\\.vscode\\extensions\\helpful-ai-assistant\\extension\\package.json\" | ConvertFrom-Json | Select-Object contributes, activationEvents, extensionDependencies"
    expected_detections:
      - plane: KOI
        type: XQL
        description: "Code scan — package.json declares activationEvents on '*' (loads on every workspace)"
        ttp_ref: "TTP-2026-0045"
        detection_id: xql-koi-004-vscode-extension-manifest-declares-wildcard-activation-events
      - plane: KOI
        type: BIOC
        description: "Code scan — extension reads ${HOME}/.aws/credentials and ${HOME}/.ssh/ via fs.readFile in activate()"
        ttp_ref: "TTP-2026-0045"
        detection_id: bioc-koi-004-vscode-extension-reads-aws-credentials-and-ssh-keys-in-activate

  - id: step-02
    name: "Emulate marketplace fetch of the .vsix over HTTPS"
    command: |
      cat > /tmp/koi-004.yml <<'YML'
      campaign_id: CMP-KOI-004
      name: "KOI — vsix fetch"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - cortexsim-canary.invalid
      dry_run: false
      tags: [koi, vscode, extension, supply-chain]
      steps:
        - step_id: step-01
          plugin: agentic_egress
          params:
            target_url: https://cortexsim-canary.invalid/vsx/
            component: vscode_ext
            artifact_name: helpful-ai-assistant
            iterations: 1
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/koi-004.yml --live
    identity: container-runtime
    mitre_technique: "T1195"
    platforms: ["linux", "macos", "windows", "container"]
    causality:
      parent_step: step-01
      # Endpoint manifest-scan finding (step-01) stitched to the NGFW session
      # that fetches the SAME malicious .vsix from the non-canonical CDN.
      pivot: endpoint_network_stitch
    expected_detections:
      - plane: NDR
        type: XQL
        description: "NGFW EAL — VS Code Marketplace fetch from non-canonical CDN"
        ttp_ref: "TTP-2026-0045"
        detection_id: xql-koi-004-vscode-marketplace-vsix-fetch-from-non-canonical-cdn
      - plane: KOI
        type: XQL
        description: "Extension marketplace risk score — publisher unverified + new + overbroad permissions"
        ttp_ref: "TTP-2026-0045"
        detection_id: xql-koi-004-extension-marketplace-risk-unverified-publisher-overbroad-permissions

  - id: step-03
    name: "Confirm post-install C2 pattern would fire on activation"
    command: |
      EXT_ROOT=sources/cortex-malicious-agentic-pack/vscode/helpful-ai-assistant
      grep -nE 'fetch|http|XMLHttpRequest|webRequest|\.aws/credentials|\.ssh/' \
        "$EXT_ROOT"/extension/dist/*.js | head -20 || true
      echo "[CortexSim] post-install activate() emits HTTP beacon to attacker C2"
    identity: container-runtime
    mitre_technique: "T1059"
    platforms: ["linux", "macos", "windows", "container"]
    platform_variants:
      windows: "Select-String -Path \"$env:USERPROFILE\\.vscode\\extensions\\helpful-ai-assistant\\extension\\dist\\*.js\" -Pattern 'fetch|http|XMLHttpRequest|\\.aws\\\\credentials|\\.ssh'; Get-Content \"$env:USERPROFILE\\.aws\\credentials\""
    causality:
      parent_step: step-02
      # The malicious extension fetched/installed in step-02 escalates to impact
      # on activation: the VS Code (code/node) host reads ~/.aws + ~/.ssh and
      # beacons out — a fetched-artifact-to-impact edge.
      pivot: exploit_impact
    expected_detections:
      - plane: KOI
        type: BIOC
        description: "Code scan — extension activate() opens outbound HTTPS to non-Microsoft domain"
        ttp_ref: "TTP-2026-0045"
        detection_id: bioc-koi-004-vscode-extension-activate-beacons-outbound-to-non-microsoft-domain
      - plane: NDR
        type: XQL
        description: "NGFW EAL — VS Code child process emits beacon traffic post-install"
        ttp_ref: "TTP-2026-0045"
        detection_id: xql-koi-004-vscode-child-process-emits-post-install-beacon-traffic

cleanup:
  commands:
    - "rm -f /tmp/koi-004.yml"

author: "Henry Reed"
