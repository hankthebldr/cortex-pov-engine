scenario_id: SIM-KOI-003
name: "KOI — Backdoored PyPI Package Consumed by Agent"
version: "1.1"
status: active

plane: KOI
detection_types:
  - BIOC
  - XQL

uc_ref: UCS-SCA-01
tc_ref: TC-SCA-01
pov_scenario_id: POV-SC-012
uc_name: "Software Composition Analysis"
tc_name: "Validate Dependency Vulnerability Detection — Known CVEs detected in direct and transitive dependencies across npm, pip, Maven, Go, NuGet"

mitre_tactic: "TA0001"
mitre_tactic_name: "Initial Access"
mitre_technique: "T1195.002"
mitre_technique_name: "Compromise Software Supply Chain"
additional_techniques:
  - technique: "T1059.006"
    name: "Python"

threat_report: "Unit42 - PyPI Typosquatting in AI Agent Tooling 2026"
threat_report_url: "https://unit42.paloaltonetworks.com/"

execution_identity:
  default: container-runtime
  options:
    - container-runtime

push_supported: true
pull_supported: true

required_content:
  - repo: "hankthebldr/cortex-malicious-agentic-pack"

infra_modules_needed:
  - base

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
# Rolled out per the S-07 per-plane convention
# (docs/uc_tc_mapping/scenario-methodology-defaults.md). Defaults are not
# fabricated KPIs — they map this plane to the methodology family its
# detection shape already belongs to in the v2.0 master methodology.
validation_methodology: "Agentic / Supply-Chain Signal Injection & Detection Accuracy"
methodology_family: "F1"
primary_kpi: "Detection Accuracy"
threshold:
  kpi: "Detection Accuracy"
  op: "≥"
  value: 90
  unit: "%"
success_criteria: |
  The agentic / supply-chain artifact (MCP server, skill, extension, PyPI
  package) produces the expected Cortex detection on scan + egress.
  Detection Accuracy is the share of injected agentic signals that raise the
  expected alert (target ≥ 90%). Agentic endpoint coverage has no point-
  product equivalent.
moat_tier: "MOAT"

# ── Causality contract ──────────────────────────────────────────────────────
# The agentic host (the AI coding agent / node) that auto-installs the Python
# helper is the Causality Group Owner — NOT the synthetic beacon. The
# package-scan (step-01) roots at the CGO; the pip fetch (step-02) stitches the
# endpoint finding to its NGFW session; the SCA/SBOM stage (step-03) re-touches
# the SAME package, so the graph is one connected spine. The import-time
# subprocess BIOC additionally keys on its OWN within-step causality
# (python/pip causality_actor → child subprocess).
cgo_anchor:
  image_name: "node"
  primary_username: "developer"

external_tools:
  - name: Cortex Malicious Agentic Pack
    source: "https://github.com/hankthebldr/cortex-pov-engine"
    type: script
    install_inline: false
    adapter_ref: TOOL-CORTEX-AGENTIC-PACK
  - name: cortexsim-eal-cli
    source: "https://github.com/hankthebldr/cortex-pov-engine"
    type: script
    install_inline: false

steps:
  - id: step-01
    name: "Inspect the backdoored package source"
    command: |
      ls -la sources/cortex-malicious-agentic-pack/pypi/mcp-server-helpers-typo/
      cat sources/cortex-malicious-agentic-pack/pypi/mcp-server-helpers-typo/pyproject.toml | head -20
      grep -n 'subprocess\|exec\|eval\|requests' \
        sources/cortex-malicious-agentic-pack/pypi/mcp-server-helpers-typo/src/*.py || true
    identity: container-runtime
    mitre_technique: "T1195.002"
    platforms: ["linux", "macos", "container"]
    expected_detections:
      - plane: KOI
        type: BIOC
        description: "Code scan — package __init__.py contains subprocess.run on import (post-install hook pattern)"
        ttp_ref: "TTP-2026-0044"
        detection_id: bioc-koi-003-pypi-package-import-time-subprocess-spawn-post-install-hook
      - plane: KOI
        type: XQL
        description: "Code scan — package name 'mcp-server-helpers' typosquats canonical 'mcp-server-helper'"
        ttp_ref: "TTP-2026-0044"
        detection_id: xql-koi-003-backdoored-pypi-package-name-typosquats-canonical-helper

  - id: step-02
    name: "Emulate pip install fetching the package over HTTPS"
    command: |
      cat > /tmp/koi-003.yml <<'YML'
      campaign_id: CMP-KOI-003
      name: "KOI — typosquat PyPI fetch"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - cortexsim-canary.invalid
      dry_run: false
      tags: [koi, pypi, typosquat, supply-chain]
      steps:
        - step_id: step-01
          plugin: agentic_egress
          params:
            target_url: https://cortexsim-canary.invalid/simple
            component: pypi_mirror
            artifact_name: mcp-server-helpers-typo
            iterations: 1
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/koi-003.yml --live
    identity: container-runtime
    mitre_technique: "T1195.002"
    platforms: ["linux", "macos", "container"]
    causality:
      parent_step: step-01
      # Endpoint package-scan finding (step-01) stitched to the NGFW session
      # that fetches the SAME typosquat package from the non-canonical mirror.
      pivot: endpoint_network_stitch
    expected_detections:
      - plane: NDR
        type: XQL
        description: "NGFW EAL — outbound HTTPS to non-canonical PyPI mirror with python-requests/pip User-Agent"
        ttp_ref: "TTP-2026-0044"
        detection_id: xql-koi-003-outbound-https-to-non-canonical-pypi-mirror-with-pip-user-agent
      - plane: KOI
        type: XQL
        description: "URL filter — pypi-mirror domain matches typosquat-of-pypi.org rule"
        ttp_ref: "TTP-2026-0044"
        detection_id: xql-koi-003-pypi-mirror-domain-matches-typosquat-of-pypi-org

  - id: step-03
    name: "Confirm Cortex Cloud SCA / SBOM scan flags the package"
    command: |
      echo "[CortexSim] SCA scan should flag mcp-server-helpers as typosquat,"
      echo "[CortexSim] suspicious __init__ side-effect, and unverified publisher."
    identity: container-runtime
    mitre_technique: "T1195.002"
    platforms: ["linux", "macos", "container"]
    causality:
      parent_step: step-02
      # SCA/SBOM scan re-touches the same package (by name + digest) that was
      # fetched in step-02 — same-artifact reuse, no direct fork.
      pivot: shared_entity
    expected_detections:
      - plane: KOI
        type: XQL
        description: "Cortex Cloud SCA — package fails publisher allowlist + post-install hook policy"
        ttp_ref: "TTP-2026-0044"
        detection_id: xql-koi-003-cortex-cloud-sca-package-fails-publisher-and-post-install-policy
      - plane: KOI
        type: BIOC
        description: "Cortex Cloud SCA — SBOM correlates package digest with known-bad fingerprint"
        ttp_ref: "TTP-2026-0044"
        detection_id: bioc-koi-003-cortex-cloud-sca-sbom-digest-matches-known-bad-fingerprint

cleanup:
  commands:
    - "echo '[CortexSim] SIM-KOI-003 cleanup complete'"

