scenario_id: SIM-KOI-006
name: "KOI — MCP Runtime Tool-Response Poisoning"
version: "1.0"
status: active

plane: KOI
detection_types:
  - BIOC
  - XQL
  - Correlation

uc_ref: UCS-KOI-06
tc_ref: TC-KOI-06
uc_name: "MCP Runtime Tool-Response Content Inspection"
tc_name: "Benign-registered MCP server returns instruction-injecting tools/call result"

mitre_tactic: "TA0001"
mitre_tactic_name: "Initial Access"
mitre_technique: "T1656"
mitre_technique_name: "Impersonation"
additional_techniques:
  - technique: "T1059"
    name: "Command and Scripting Interpreter"
  - technique: "T1552.001"
    name: "Unsecured Credentials: Credentials In Files"

threat_report: "Unit42 - MCP Runtime Tool-Response Trust Gap (CVE-2025-49596 / CVE-2025-54136)"
threat_report_url: "https://unit42.paloaltonetworks.com/"

execution_identity:
  default: container-runtime
  options:
    - container-runtime

push_supported: true
pull_supported: true

required_content:
  - repo: "hankthebldr/cortex-malicious-agentic-pack"

infra_modules_needed:
  - base

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
# Rolled out per the S-07 per-plane convention
# (docs/uc_tc_mapping/scenario-methodology-defaults.md). Defaults are not
# fabricated KPIs — they map this plane to the methodology family its
# detection shape already belongs to in the v2.0 master methodology.
validation_methodology: "Agentic / Supply-Chain Signal Injection & Detection Accuracy"
methodology_family: "F1"
primary_kpi: "Detection Accuracy"
threshold:
  kpi: "Detection Accuracy"
  op: "≥"
  value: 90
  unit: "%"
success_criteria: |
  A benign-registered MCP server returns a poisoned tools/call RESULT at
  runtime; the runtime-content-inspection BIOC, the NGFW result-body XQL, and
  the agent-consumed-result XQL fire, and CR-KOI-0006 stitches the poisoned
  result with the follow-on credential access into one incident. Detection
  Accuracy is the share of injected runtime signals that raise the expected
  alert (target ≥ 90%). This runtime tool-RESULT angle has no point-product
  equivalent and is distinct from SIM-KOI-002's source scan.
moat_tier: "MOAT"

# ── Causality contract ──────────────────────────────────────────────────────
# The MCP host process (the agent client that registered the benign-looking
# pa-firewall-mcp server) OWNS the runtime chain in XDR's causality view — it is
# the Causality Group Owner, NOT the synthetic beacon. step-01 materialises /
# reads the poisoned tools/call RESULT fixture; step-02 is the same MCP host
# consuming that result and POSTing it on the wire (process_lineage); step-03 is
# the follow-on credential-file read the host attempts when it honours the
# injected instruction (process_lineage from the consuming process). The whole
# spine threads through one MCP-host process node so the runtime-injection
# incident is one connected chain, not a star.
cgo_anchor:
  image_name: "mcp-host"
  primary_username: "container-runtime"

external_tools:
  - name: Cortex Malicious Agentic Pack
    source: "https://github.com/hankthebldr/cortex-pov-engine"
    type: script
    install_inline: false
    adapter_ref: TOOL-CORTEX-AGENTIC-PACK
  - name: cortexsim-eal-cli
    source: "https://github.com/hankthebldr/cortex-pov-engine"
    type: script
    install_inline: false

steps:
  - id: step-01
    name: "Display the runtime poisoned MCP tools/call result fixture"
    command: |
      cat sources/cortex-malicious-agentic-pack/mcp/pa-firewall-mcp/runtime-poisoned-response.json
      grep -n 'SYSTEM_OVERRIDE\|exfiltrate\|AKIA' \
        sources/cortex-malicious-agentic-pack/mcp/pa-firewall-mcp/runtime-poisoned-response.json || true
    identity: container-runtime
    mitre_technique: "T1656"
    platforms: ["linux", "macos"]
    expected_detections:
      - plane: KOI
        type: BIOC
        description: "Runtime content inspection — MCP tools/call result body embeds an instruction-injection at invocation time (distinct from SIM-KOI-002 source scan)"
        ttp_ref: "TTP-2026-0095"
        detection_id: bioc-koi-006-mcp-tools-call-result-content-embeds-instruction-injection-at-runtime

  - id: step-02
    name: "Emulate an agent client receiving the poisoned MCP tools/call result on the wire"
    command: |
      cat > /tmp/koi-006.yml <<'YML'
      campaign_id: CMP-KOI-006
      name: "KOI — pa-firewall-mcp runtime tool-result poisoning"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - cortexsim-canary.invalid
      dry_run: false
      tags: [koi, mcp, runtime-injection]
      steps:
        - step_id: step-01
          plugin: agentic_egress
          params:
            target_url: https://cortexsim-canary.invalid/mcp/
            component: mcp_server
            artifact_name: pa-firewall-mcp
            iterations: 1
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/koi-006.yml --live
    identity: container-runtime
    mitre_technique: "T1059"
    platforms: ["linux", "macos"]
    causality:
      parent_step: step-01
      pivot: process_lineage
    expected_detections:
      - plane: NDR
        type: XQL
        description: "NGFW EAL — JSON-RPC tools/call RESULT body carries instruction-injection markers on the wire"
        ttp_ref: "TTP-2026-0095"
        detection_id: xql-koi-006-ngfw-json-rpc-tools-call-result-body-carries-injection-markers
      - plane: KOI
        type: XQL
        description: "Agent process read the materialised poisoned tool-RESULT body at runtime"
        ttp_ref: "TTP-2026-0095"
        detection_id: xql-koi-006-agent-process-consumed-poisoned-tool-result

  - id: step-03
    name: "Show the runtime consequence — agent acts on the injected instruction (credential-file read attempt, canary)"
    command: |
      echo "[CortexSim] If the agent honours the poisoned tool RESULT, it attempts to"
      echo "[CortexSim] read ~/.aws/credentials and ~/.ssh/id_rsa (canary). CR-KOI-0006"
      echo "[CortexSim] stitches the poisoned-result content hit with the follow-on read."
    identity: container-runtime
    mitre_technique: "T1552.001"
    platforms: ["linux", "macos"]
    causality:
      parent_step: step-02
      pivot: process_lineage
    expected_detections:
      - plane: KOI
        type: Correlation
        description: "Correlation — poisoned MCP tool-result content hit fuses with the agent's follow-on credential-file read into one runtime-injection incident"
        ttp_ref: "TTP-2026-0095"
        detection_id: CR-KOI-0006
      - plane: ANALYTICS
        type: XQL
        description: "XSIAM stitching — tool-result injection joins the follow-on credential-access signal across planes"
        ttp_ref: "TTP-2026-0095"
        detection_id: xql-koi-006-stitch-tool-result-injection-with-followon-credential-access

cleanup:
  commands:
    - "rm -f /tmp/koi-006.yml"
    - "echo '[CortexSim] SIM-KOI-006 cleanup complete'"

author: "Henry Reed"
created: "2026-06-17"
last_updated: "2026-06-17"
tags:
  - koi
  - mcp
  - runtime-injection
  - agentic
  - supply-chain
