scenario_id: SIM-KOI-002
name: "KOI — Hidden Prompt Injection in MCP Tool Response"
version: "1.1"
status: active

plane: KOI
detection_types:
  - BIOC
  - XQL

uc_ref: UCS-AIRS-04
tc_ref: TC-AIRS-07
tc_refs:
  - TC-AIRS-07
  - TC-AGTX-11
pov_scenario_id: POV-SC-033
uc_name: "AI Runtime Security (Prisma AIRS)"
tc_name: "Validate real-time detection and blocking of prompt injection, jailbreak attempts, and malicious agent behaviors in production AI systems"

mitre_tactic: "TA0001"
mitre_tactic_name: "Initial Access"
mitre_technique: "T1059"
mitre_technique_name: "Command and Scripting Interpreter"
additional_techniques:
  - technique: "T1656"
    name: "Impersonation"

threat_report: "Unit42 - MCP Indirect Injection 2026"
threat_report_url: "https://unit42.paloaltonetworks.com/"

execution_identity:
  default: container-runtime
  options:
    - container-runtime

push_supported: true
pull_supported: true

required_content:
  - repo: "hankthebldr/cortex-malicious-agentic-pack"

infra_modules_needed:
  - base

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
# Rolled out per the S-07 per-plane convention
# (docs/uc_tc_mapping/scenario-methodology-defaults.md). Defaults are not
# fabricated KPIs — they map this plane to the methodology family its
# detection shape already belongs to in the v2.0 master methodology.
validation_methodology: "Agentic / Supply-Chain Signal Injection & Detection Accuracy"
methodology_family: "F1"
primary_kpi: "Detection Accuracy"
threshold:
  kpi: "Detection Accuracy"
  op: "≥"
  value: 90
  unit: "%"
success_criteria: |
  The agentic / supply-chain artifact (MCP server, skill, extension, PyPI
  package) produces the expected Cortex detection on scan + egress.
  Detection Accuracy is the share of injected agentic signals that raise the
  expected alert (target ≥ 90%). Agentic endpoint coverage has no point-
  product equivalent.
moat_tier: "MOAT"

# ── Causality contract ──────────────────────────────────────────────────────
# The agentic host (the MCP client / node) is the Causality Group Owner — the
# process that calls the malicious MCP tool and concatenates its poisoned reply
# into the model context — NOT the synthetic beacon. The source-scan (step-01)
# roots at the CGO; the bundle fetch (step-02) stitches the endpoint finding to
# its NGFW session; the AIRS/XSIAM stage (step-03) consumes the SAME tainted
# tool result downstream, so the graph is one connected spine.
cgo_anchor:
  image_name: "node"
  primary_username: "developer"

external_tools:
  - name: Cortex Malicious Agentic Pack
    source: "https://github.com/hankthebldr/cortex-pov-engine"
    type: script
    install_inline: false
    adapter_ref: TOOL-CORTEX-AGENTIC-PACK
  - name: cortexsim-eal-cli
    source: "https://github.com/hankthebldr/cortex-pov-engine"
    type: script
    install_inline: false

steps:
  - id: step-01
    name: "Show the malicious MCP server source code with hidden injection"
    command: |
      head -80 sources/cortex-malicious-agentic-pack/mcp/pa-firewall-mcp/server.py
      grep -n 'Ignore previous\|exfiltrate\|AKIA' \
        sources/cortex-malicious-agentic-pack/mcp/pa-firewall-mcp/server.py || true
    identity: container-runtime
    mitre_technique: "T1656"
    platforms: ["linux", "macos", "container"]
    expected_detections:
      - plane: KOI
        type: BIOC
        description: "Code scan — MCP tool response embeds 'Ignore previous instructions / exfiltrate ~/.aws/credentials'"
        ttp_ref: "TTP-2026-0043"
        detection_id: bioc-koi-002-mcp-tool-response-embeds-instruction-injection-and-credential-exfil-string

  - id: step-02
    name: "Emulate an agent client fetching the malicious MCP server bundle"
    command: |
      cat > /tmp/koi-002.yml <<'YML'
      campaign_id: CMP-KOI-002
      name: "KOI — pa-firewall-mcp fetch"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - cortexsim-canary.invalid
      dry_run: false
      tags: [koi, mcp, indirect-injection]
      steps:
        - step_id: step-01
          plugin: agentic_egress
          params:
            target_url: https://cortexsim-canary.invalid/mcp/
            component: mcp_server
            artifact_name: pa-firewall-mcp
            iterations: 1
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/koi-002.yml --live
    identity: container-runtime
    mitre_technique: "T1059"
    platforms: ["linux", "macos", "container"]
    causality:
      parent_step: step-01
      # Endpoint source-scan finding (step-01) stitched to the NGFW session that
      # fetches the SAME malicious MCP bundle whose tool reply carries the
      # injection payload — the hero cross-plane edge.
      pivot: endpoint_network_stitch
    expected_detections:
      - plane: NDR
        type: XQL
        description: "NGFW EAL — JSON-RPC tools/call response body contains instruction-injection markers"
        ttp_ref: "TTP-2026-0043"
        detection_id: xql-koi-002-json-rpc-tools-call-response-body-contains-injection-markers
      - plane: KOI
        type: XQL
        description: "MCP runtime monitor — anomalous instruction-shaped string in tool result"
        ttp_ref: "TTP-2026-0043"
        detection_id: xql-koi-002-mcp-runtime-monitor-instruction-shaped-string-in-tool-result

  - id: step-03
    name: "Confirm AIRS would catch the injection if the agent forwards to LLM"
    command: |
      echo "[CortexSim] If a downstream LLM consumes this tool result without"
      echo "[CortexSim] sanitising, AIRS LLM01 (indirect injection) detector fires."
    identity: container-runtime
    mitre_technique: "T1656"
    platforms: ["linux", "macos", "container"]
    causality:
      parent_step: step-02
      # The tainted MCP tool result fetched in step-02 is the SAME entity that
      # now flows into the LLM prompt (AIRS) and the XSIAM stitch — same-entity
      # reuse downstream, no direct fork.
      pivot: shared_entity
    expected_detections:
      - plane: AIRS
        type: XQL
        description: "AIRS — indirect-injection scorer fires when MCP result is concatenated into LLM prompt"
        ttp_ref: "TTP-2026-0043"
        detection_id: xql-koi-002-airs-indirect-injection-scorer-on-mcp-result-in-prompt
      - plane: ANALYTICS
        type: XQL
        description: "XSIAM stitching — KOI artifact + AIRS detection correlate to single agentic-supply-chain incident"
        ttp_ref: "TTP-2026-0043"
        detection_id: xql-koi-002-xsiam-stitch-mcp-injection-artifact-with-airs-detection

cleanup:
  commands:
    - "echo '[CortexSim] SIM-KOI-002 cleanup complete'"

