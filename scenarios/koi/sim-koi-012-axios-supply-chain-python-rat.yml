# Push works: every step is POSIX shell plus stock python3 and curl, and the
# bundle's exit trap runs the cleanup below after step-07 has ended the RAT.
push_supported: true
pull_supported: true

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
validation_methodology: "Supply-Chain Signal Injection & Detection Accuracy"
methodology_family: "F1"
primary_kpi: "Detection Accuracy"
threshold:
  kpi: "Detection Accuracy"
  op: "≥"
  value: 12.5
  unit: "%"
success_criteria: |
  Eight step-detections are declared, of two kinds.
  Alert-backed (2 of 8):
  (1) "Local Analysis Malware" on the peinject payload in step-06. Built-in,
  HIGH. Observed in this lab on 2026-11-11 when the same WildFire test ELF was
  executed from a shell. Not yet observed for an ELF that python3 spawns from
  a dot-file name, which is how this chain runs it.
  (2) Correlation CR-KOI-0012 in step-07. It fires ONLY if the operator
  installs it before the run, from TTP-2026-0203: alert name exactly the rule
  name, severity Medium, scheduled every 10 minutes, query time frame 1 hour,
  agent_hostname mapped to Host Name and agent_id mapped to Agent ID, MITRE
  tag T1219 only. CortexSim never writes it to the tenant, and its logic has
  not been run in any tenant.
  Tier-2-verify-only (6 of 8): the XQL rows on step-01 to step-06. They are
  scored by POST /api/runs/{id}/verify, which looks back one hour from when it
  runs, so verify within the hour. They never raise Detection Accuracy.
  PASS: Detection Accuracy of at least 12.5%, which is the built-in verdict
  alone (1 of 8). Detection Accuracy counts only alert-backed observations,
  so the ceiling is 25% (2 of 8) and is reached only when the operator has
  installed CR-KOI-0012. The bar is set at the built-in verdict on purpose:
  on 2026-11-11 the lab tenant listed no custom correlation rule, and a bar
  of 25% would read a tenant that detects the payload exactly as observed as
  a failed run. A missing CR-KOI-0012 therefore shows as one missed row, not
  as a failed run. The bound index row carries a qualitative threshold, so a
  machine PASS is recorded as not_applicable (evidence, not a scored pass);
  a FAIL stands.
  Expected but not scored: all six XQL rows pass Tier-2 verify, and the two
  Medium-or-higher issues share one case. Only Medium-or-higher issues create
  or join a case.
  Dedup: Local Analysis issues are deduplicated for one hour per file. Do not
  run this within an hour of any other execution of the WildFire test ELF on
  the host. SIM-EDR-023 keeps re-running it for 45 minutes after its launch.
  The same spacing keeps an earlier run's events out of CR-KOI-0012's one-hour
  time frame, where they would raise the issue again and be credited here.
  The policy is assumed to be report mode. In block mode step-06 exits
  non-zero when the agent stops the payload and step-07 is not reached; that
  run is outside this contract.
  Not declared, on the card only: the four Unit 42 hunting queries (one needs
  the real C2 string on a command line, one needs a firewall in path, one keys
  on directory sub-types this lab has not recorded, and the File Indicators
  query is covered in host-specific form by the step-02 row), the published
  IOCs, three operator-installable BIOCs, and the built-in Low Analytics
  BIOCs, which are rarity-based and never join a case.
  tenant-verified: 0 — no run of this scenario has executed against a live
  Cortex tenant; authored is not proven.
moat_tier: "LEAD"

# ── Causality contract ──────────────────────────────────────────────────────
# In the real chain the Causality Group Owner is node: npm runs the postinstall
# hook, and the node dropper spawns the shell that fetches and launches the
# RAT. cgo_anchor labels SimCore's own causality graph and sets the anchor
# shell's argv[0]. It does NOT change the tenant's CGO: in the 2026-11-11 lab
# every beacon-run step carried causality_actor_process_image_name =
# cortexsim-agent, so no query here keys on the anchor name. primary_username
# is a label only; every step runs as root. step-01 is the single root.
cgo_anchor:
  image_name: "node"
  primary_username: "developer"

infra_modules_needed:
  - base
  - edr

