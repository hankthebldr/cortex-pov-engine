# Axios npm supply chain attack (Unit 42 threat brief, published 2026-04-01).
# Scope: the Linux second stage that follows the npm postinstall hop. A hijacked
# maintainer account published axios 1.14.1 and 0.30.4 with plain-crypto-js@4.2.1
# injected as a runtime dependency; its postinstall hook ran an obfuscated
# setup.js, which fetched a Python RAT to /tmp/ld.py and launched it with nohup.
#
# What is real here and what is staged:
#   REAL    file and directory creation of the poisoned node_modules tree, the
#           dropper string decode (python3), the curl POST (to a .invalid
#           canary), the RAT script write, the nohup python3 launch, the
#           manifest swap, and the RAT verbs rundir / runscript / peinject / kill.
#   STAGED  npm install and `node setup.js`. The lab endpoint has no node, so the
#           dropper is a string table on disk and nothing is declared on that hop.
#
# Sources. Unit 42 is the scenario's source. Details marked "linked source" come
# from the Elastic Security Labs analyses that the Unit 42 post links to; they
# are Elastic's findings, not Unit 42's.
#
# Sandbox. Every artifact lives under /var/tmp/.cortexsim-axios. Published paths
# are mirrored inside it (/tmp/ld.py becomes <root>/tmp/ld.py). The only real
# download is Palo Alto Networks' official WildFire test ELF in step-06, fetched
# the way SIM-EDR-023 step-01 fetches it. Every other network call targets a
# .invalid name with a 3 s bound. The real C2 (sfrclak[.]com, 142.11.206[.]73,
# port 8000) is never contacted: it is carried on the card as IOCs and hunts and
# below as indicators with in_band: false.
#
# Timing. The published install-to-compromise time is about 15 seconds and the
# delivery is one shell line. Neither is reproduced: steps are split and spaced
# 40 s apart because back-to-back steps lost telemetry in this lab (2026-11-11).
# Do not read this run's timeline as the attacker's.
scenario_id: SIM-KOI-012
name: "KOI — Axios npm Supply Chain: plain-crypto-js Postinstall Dropper to a Python RAT on a Linux Dev Endpoint (string decode → /tmp/ld.py → rundir / runscript → peinject WildFire test ELF → kill)"
version: "1.0"
status: active

plane: KOI
detection_types:
  - Prevention
  - XQL
  - Correlation

# ── UC/TC Alignment ─────────────────────────────────────────────────────────
# Same binding as the other KOI npm scenarios (SIM-KOI-008/010/011), without
# TC-SSCAN-01: this chain harvests no secrets. TC-EDR-03 and TC-EDR-05 are what
# the malware verdict on the peinject payload and the python3-to-payload process
# chain evidence. All three rows are already evidenced: depth, not new breadth.
uc_ref: UCS-SCA-01
tc_ref: TC-SCA-01
tc_refs:
  - TC-SCA-01
  - TC-EDR-03
  - TC-EDR-05
pov_scenario_id: POV-SC-012
uc_name: "Software Composition Analysis"
tc_name: "Validate Dependency Vulnerability Detection — Known CVEs detected in direct and transitive dependencies across npm, pip, Maven, Go, NuGet"

mitre_tactic: "TA0001"
mitre_tactic_name: "Initial Access"
mitre_technique: "T1195.001"
mitre_technique_name: "Supply Chain Compromise: Compromise Software Dependencies and Development Tools"
# Only techniques the chain performs on the endpoint. The network techniques of
# the real RAT (HTTP POST C2 on port 8000) are on the card: the lab beacon never
# connects, so they are not claimed here.
additional_techniques:
  - technique: "T1204.005"
    name: "User Execution: Malicious Library"
  - technique: "T1140"
    name: "Deobfuscate/Decode Files or Information"
  - technique: "T1105"
    name: "Ingress Tool Transfer"
  - technique: "T1059.006"
    name: "Command and Scripting Interpreter: Python"
  - technique: "T1219"
    name: "Remote Access Tools"
  - technique: "T1070.004"
    name: "Indicator Removal: File Deletion"
  - technique: "T1059.004"
    name: "Command and Scripting Interpreter: Unix Shell"
  - technique: "T1083"
    name: "File and Directory Discovery"
  - technique: "T1057"
    name: "Process Discovery"
  - technique: "T1082"
    name: "System Information Discovery"
