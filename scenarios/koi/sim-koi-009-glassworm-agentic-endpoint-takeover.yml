scenario_id: SIM-KOI-009
name: "KOI — GlassWorm Poisoned IDE Extension on a macOS Developer Endpoint (install → activation → Keychain → LaunchAgent → credential staging → send)"
version: "1.0"
status: active

plane: KOI
detection_types:
  - ABIOC
  - BIOC
  - XQL
  - Correlation

uc_ref: UCS-SCA-01
tc_ref: TC-SCA-01
tc_refs:
  - TC-SCA-01
  - TC-SSCAN-01
pov_scenario_id: POV-SC-012
uc_name: "Software Composition Analysis"
tc_name: "Validate Dependency Vulnerability Detection — Known CVEs detected in direct and transitive dependencies across npm, pip, Maven, Go, NuGet"

mitre_tactic: "TA0001"
mitre_tactic_name: "Initial Access"
mitre_technique: "T1195"
mitre_technique_name: "Supply Chain Compromise"
additional_techniques:
  - technique: "T1059.002"
    name: "Command and Scripting Interpreter: AppleScript"
  - technique: "T1543.001"
    name: "Create or Modify System Process: Launch Agent"
  - technique: "T1555.001"
    name: "Credentials from Password Stores: Keychain"
  - technique: "T1552.001"
    name: "Unsecured Credentials: Credentials In Files"
  - technique: "T1074.001"
    name: "Data Staged: Local Data Staging"
  - technique: "T1560"
    name: "Archive Collected Data"
  - technique: "T1041"
    name: "Exfiltration Over C2 Channel"

threat_report: "GlassWorm Goes Mac: Fresh Infrastructure, New Tricks"
threat_report_url: "https://www.paloaltonetworks.com/blog/security-operations/glassworm-goes-mac-fresh-infrastructure-new-tricks/"

execution_identity:
  default: direct
  options:
    - direct

push_supported: true
pull_supported: true

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
validation_methodology: "Agentic / Supply-Chain Signal Injection & Detection Accuracy"
methodology_family: "F1"
primary_kpi: "Detection Accuracy"
threshold:
  kpi: "Detection Accuracy"
  op: "≥"
  value: 90
  unit: "%"
success_criteria: |
  Two legs, reported separately.
  Leg A (Agentic Endpoint Security): the DC observes the poisoned extension and
  its risk score in the AES inventory after step-01. This leg is OBSERVED, not
  machine-scored; without an enrolled AES sensor it is simply not observed and
  leg B still scores.
  Leg B (XDR / XSIAM): the install, the extension-host scripting child, the
  Keychain access, the LaunchAgent write+load, the multi-credential read and
  staging, and the archive send each raise the expected Cortex detection, and
  CR-KOI-0009 stitches them into ONE incident on the shared IDE causality_id.
  Detection Accuracy is the share of injected signals that raise the expected
  alert (target ≥ 90%). The two network detections on step-06 are exercised
  only when the operator configures an authorised canary sink
  (CORTEXSIM_C2_URL); without one step-06 resolves not_reached.
  tenant-verified: 0 — no run of this scenario has executed against a live
  Cortex tenant; authored is not proven.
moat_tier: "MOAT"

# ── Causality contract ──────────────────────────────────────────────────────
# The VS Code main-process image (an Electron binary inside the app bundle,
# which the `code` CLI also runs) is the Causality Group Owner — it owns the
# extension host and every child the extension spawns. NOT the synthetic
# cortexsim-agent. Step-01 is the single root; step-02 shares the installed
# extension directory with it; steps 03-05 are literal extension-host children
# (the URI-handler trigger makes that true); step-06's archive leaves the host.
# primary_username is a label only: every step runs identity `direct`.
cgo_anchor:
  image_name: "Electron"
  primary_username: "developer"

required_content:
  - repo: "hankthebldr/cortex-malicious-agentic-pack"

infra_modules_needed:
  - base

external_tools:
  - name: Cortex Malicious Agentic Pack
    source: "https://github.com/hankthebldr/cortex-pov-engine"
    type: script
    install_inline: false
    adapter_ref: TOOL-CORTEX-AGENTIC-PACK

# Shared by every step (each step is its own shell, so each exports it again):
#   decoy tree   /tmp/CORTEXSIM-KOI009-DECOY   (CORTEXSIM_KOI009_DECOY_ROOT)
#   .vsix        /tmp/CORTEXSIM-KOI009-VSIX/prettier-pro-canary.vsix
# Lab precondition: macOS, logged-in developer session, VS Code with the `code`
# CLI on PATH, VS Code NOT already running at step-02 (the decoy-root variable
# must reach the IDE's main process). Run from the repository checkout root.
steps:
  - id: step-01
    name: "Install the Prettier Pro extension through the IDE's own CLI"
    # What the sensor records: a new extension directory under ~/.vscode/extensions
    # created by the IDE main-process image running the `code` CLI (first
    # appearance of the CGO image). Observe in AES: inventory + risk score for
    # cortexsim-canary.prettier-pro-canary; that leg is observed, not
    # machine-scored.
    command: |
      # SAFE-MODE — package the benign in-tree canary extension and install it
      # via `code --install-extension`. Decoy-only; the publisher is a canary name.
      set -eu
      SRC="sources/cortex-malicious-agentic-pack/vscode/prettier-pro-canary"
      OUT="/tmp/CORTEXSIM-KOI009-VSIX"
      STAGE="$OUT/pkg"
      rm -rf "$OUT"
      mkdir -p "$STAGE"
      cp -R "$SRC/extension" "$STAGE/extension"
      printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' \
        '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="json" ContentType="application/json"/><Default Extension="js" ContentType="application/javascript"/><Default Extension="vsixmanifest" ContentType="text/xml"/></Types>' \
        > "$STAGE/[Content_Types].xml"
      printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' \
        '<PackageManifest Version="2.0.0" xmlns="http://schemas.microsoft.com/developer/vsx-schema/2011"><Metadata><Identity Language="en-US" Id="prettier-pro-canary" Version="0.0.1" Publisher="cortexsim-canary"/><DisplayName>Prettier Pro</DisplayName><Description xml:space="preserve">CORTEXSIM-CANARY artifact for SIM-KOI-009</Description></Metadata><Installation><InstallationTarget Id="Microsoft.VisualStudio.Code"/></Installation><Dependencies/><Assets><Asset Type="Microsoft.VisualStudio.Code.Manifest" Path="extension/package.json" Addressable="true"/></Assets></PackageManifest>' \
        > "$STAGE/extension.vsixmanifest"
      (cd "$STAGE" && zip -q -X -r "$OUT/prettier-pro-canary.vsix" '[Content_Types].xml' extension.vsixmanifest extension)
      code --install-extension "$OUT/prettier-pro-canary.vsix" --force
      test -d "$HOME/.vscode/extensions/cortexsim-canary.prettier-pro-canary-0.0.1"
      echo "[CortexSim][SAFE-MODE] installed cortexsim-canary.prettier-pro-canary via code CLI"
    identity: direct
    mitre_technique: "T1195"
    platforms: ["macos"]
    expected_detections:
      - plane: KOI
        type: XQL
        description: "Validation — VS Code CLI install creates an unknown-publisher extension directory (leg B); the AES inventory and risk score for the extension are observed by the DC, not machine-scored (leg A)"
        ttp_ref: "TTP-2026-0197"
        detection_id: xql-koi-009-vs-code-extension-install-creates-unknown-publisher-extension-directory

  - id: step-02
    name: "Launch the IDE; extension activation spawns a scripting-host child"
    # What the sensor records: the IDE extension host spawning one osascript
    # child at activation (first-seen publisher, unsigned extension), parent→child
    # lineage under the IDE. The child exits at once.
    # The already-running guard uses the bracket idiom [V]isual deliberately: the step
    # script is passed to `sh -c`, so a plain pattern would match the shell's own argv.
    command: |
      # SAFE-MODE — launch VS Code with the decoy-root variable in its
      # environment so the extension activates and registers its URI handler.
      set -eu
      export CORTEXSIM_KOI009_DECOY_ROOT="/tmp/CORTEXSIM-KOI009-DECOY"
      rm -rf "$CORTEXSIM_KOI009_DECOY_ROOT"
      mkdir -p "$CORTEXSIM_KOI009_DECOY_ROOT"
      if pgrep -f "[V]isual Studio Code.app/Contents/MacOS" >/dev/null; then
        echo "[CortexSim] VS Code is already running; quit it so the decoy-root variable reaches the IDE" >&2
        exit 1
      fi
      /usr/bin/open --env CORTEXSIM_KOI009_DECOY_ROOT="$CORTEXSIM_KOI009_DECOY_ROOT" -a "Visual Studio Code"
      for i in $(seq 1 60); do
        if [ -f "$CORTEXSIM_KOI009_DECOY_ROOT/activated.marker" ]; then break; fi
        sleep 1
      done
      test -f "$CORTEXSIM_KOI009_DECOY_ROOT/activated.marker"
      echo "[CortexSim][SAFE-MODE] extension activated under the IDE"
    identity: direct
    mitre_technique: "T1059.002"
    platforms: ["macos"]
    causality:
      parent_step: step-01
      # The installed extension directory is what install and activation share;
      # step-02's process is not step-01's child.
      pivot: shared_entity
    expected_detections:
      - plane: KOI
        type: ABIOC
        description: "IDE extension host spawns a macOS scripting host (osascript) for a first-seen, unsigned-publisher extension"
        ttp_ref: "TTP-2026-0197"
        detection_id: abioc-koi-009-ide-extension-host-spawns-scripting-host-for-first-seen-publisher

  - id: step-03
    name: "Keychain access from the extension host (decoy keychain only)"
    # What the sensor records: a `security` invocation reading a *.keychain-db
    # path, as a child of the IDE extension host. The login keychain is never
    # opened or copied.
    command: |
      # SAFE-MODE — create a throwaway keychain with one decoy item inside the
      # decoy tree, then trigger the extension's /step-03 handler against it.
      set -eu
      export CORTEXSIM_KOI009_DECOY_ROOT="/tmp/CORTEXSIM-KOI009-DECOY"
      KC="$CORTEXSIM_KOI009_DECOY_ROOT/decoy.keychain-db"
      security create-keychain -p CORTEXSIM-DECOY "$KC"
      security add-generic-password -a decoy -s cortexsim-decoy -w CORTEXSIM-DECOY "$KC"
      /usr/bin/open "vscode://cortexsim-canary.prettier-pro-canary/step-03"
      for i in $(seq 1 30); do
        if [ -f "$CORTEXSIM_KOI009_DECOY_ROOT/trigger-step-03.marker" ]; then break; fi
        sleep 1
      done
      test -f "$CORTEXSIM_KOI009_DECOY_ROOT/trigger-step-03.marker"
      echo "[CortexSim][SAFE-MODE] /step-03 handled against the decoy keychain"
    identity: direct
    mitre_technique: "T1555.001"
    platforms: ["macos"]
    causality:
      parent_step: step-02
      pivot: process_lineage
    expected_detections:
      - plane: KOI
        type: BIOC
        description: "Keychain access (security find-generic-password on a *.keychain-db path) by an IDE descendant"
        ttp_ref: "TTP-2026-0197"
        detection_id: bioc-koi-009-keychain-access-by-ide-descendant

  - id: step-04
    name: "LaunchAgent written and loaded from the extension host"
    # What the sensor records: a plist written under ~/Library/LaunchAgents/ by an
    # extension-host child, then `launchctl bootstrap gui/<uid>`. The agent's
    # program is /usr/bin/true; cleanup boots it out and deletes it.
    command: |
      # SAFE-MODE — trigger the extension's /step-04 handler. Nothing to plant:
      # it writes the no-op CORTEXSIM-CANARY plist and bootstraps it.
      set -eu
      export CORTEXSIM_KOI009_DECOY_ROOT="/tmp/CORTEXSIM-KOI009-DECOY"
      PLIST="$HOME/Library/LaunchAgents/com.cortexsim.CORTEXSIM-CANARY.koi009.plist"
      /usr/bin/open "vscode://cortexsim-canary.prettier-pro-canary/step-04"
      for i in $(seq 1 30); do
        if [ -f "$PLIST" ]; then break; fi
        sleep 1
      done
      test -f "$PLIST"
      launchctl print "gui/$(id -u)/com.cortexsim.CORTEXSIM-CANARY.koi009" >/dev/null
      echo "[CortexSim][SAFE-MODE] canary LaunchAgent written and loaded"
    identity: direct
    mitre_technique: "T1543.001"
    platforms: ["macos"]
    causality:
      parent_step: step-02
      pivot: process_lineage
    expected_detections:
      - plane: KOI
        type: BIOC
        description: "LaunchAgent plist written and loaded (launchctl bootstrap) from IDE lineage"
        ttp_ref: "TTP-2026-0197"
        detection_id: bioc-koi-009-launchagent-written-and-loaded-from-ide-lineage

  - id: step-05
    name: "Multi-credential read and local staging by the extension host"
    # What the sensor records: >=3 credential-named files read in one window by an
    # extension-host child, then a staging directory created and populated. The
    # files hold only the literal CORTEXSIM-DECOY.
    command: |
      # SAFE-MODE — plant decoy credential-named files (names mirror the report,
      # every value is the literal CORTEXSIM-DECOY), then trigger /step-05.
      set -eu
      export CORTEXSIM_KOI009_DECOY_ROOT="/tmp/CORTEXSIM-KOI009-DECOY"
      CREDS="$CORTEXSIM_KOI009_DECOY_ROOT/creds"
      mkdir -p "$CREDS"
      for f in .npmrc .git-credentials id_rsa storage.json; do
        printf 'CORTEXSIM-DECOY\n' > "$CREDS/$f"
      done
      /usr/bin/open "vscode://cortexsim-canary.prettier-pro-canary/step-05"
      for i in $(seq 1 30); do
        if [ -f "$CORTEXSIM_KOI009_DECOY_ROOT/staging/staged.marker" ]; then break; fi
        sleep 1
      done
      test -f "$CORTEXSIM_KOI009_DECOY_ROOT/staging/staged.marker"
      test -f "$CORTEXSIM_KOI009_DECOY_ROOT/staging/id_rsa"
      echo "[CortexSim][SAFE-MODE] decoy credentials staged under the decoy tree"
    identity: direct
    mitre_technique: "T1552.001"
    platforms: ["macos"]
    causality:
      parent_step: step-02
      pivot: process_lineage
    expected_detections:
      - plane: KOI
        type: BIOC
        description: "Multi-credential file read (>=3 credential-named files in one window) under the IDE CGO"
        ttp_ref: "TTP-2026-0197"
        detection_id: bioc-koi-009-multi-credential-file-read-under-ide-cgo
      - plane: KOI
        type: XQL
        description: "Validation — staging directory created and populated under IDE lineage"
        ttp_ref: "TTP-2026-0197"
        detection_id: xql-koi-009-staging-directory-created-under-ide-lineage

  - id: step-06
    name: "Archive the staging directory and send to the canary destination"
    # What the sensor records: the staging directory archived (tar) and sent to a
    # canary destination by an extension-host child. The two network detections
    # (NGFW session, archive-sent XQL) are exercised ONLY when the operator
    # configures an authorised sink via CORTEXSIM_C2_URL; this scenario never
    # sets it. Without a sink the step archives locally, makes no network call
    # and those network legs resolve not_reached.
    command: |
      # SAFE-MODE — trigger /step-06. CORTEXSIM_C2_URL is deliberately NOT set
      # here: the extension archives and records cortexsim-canary.invalid only.
      set -eu
      export CORTEXSIM_KOI009_DECOY_ROOT="/tmp/CORTEXSIM-KOI009-DECOY"
      /usr/bin/open "vscode://cortexsim-canary.prettier-pro-canary/step-06"
      for i in $(seq 1 30); do
        if [ -f "$CORTEXSIM_KOI009_DECOY_ROOT/staging.tgz" ]; then break; fi
        sleep 1
      done
      test -f "$CORTEXSIM_KOI009_DECOY_ROOT/staging.tgz"
      tar -tzf "$CORTEXSIM_KOI009_DECOY_ROOT/staging.tgz" >/dev/null
      echo "[CortexSim][SAFE-MODE] decoy archive built; sent only if an authorised CORTEXSIM_C2_URL sink is configured"
    identity: direct
    mitre_technique: "T1560"
    platforms: ["macos"]
    causality:
      parent_step: step-05
      # The staged data leaves the host.
      pivot: network_session
    expected_detections:
      - plane: NDR
        type: XQL
        description: "Validation — NGFW session from the IDE host to a non-marketplace destination (exercised only when the operator configures a sink; otherwise not_reached)"
        ttp_ref: "TTP-2026-0197"
        detection_id: xql-koi-009-ngfw-session-from-ide-host-to-non-marketplace-destination
      - plane: KOI
        type: XQL
        description: "Validation — archive sent from IDE lineage to a non-marketplace host (exercised only when the operator configures a sink; otherwise not_reached)"
        ttp_ref: "TTP-2026-0197"
        detection_id: xql-koi-009-archive-sent-from-ide-lineage-to-non-marketplace-host
      - plane: KOI
        type: Correlation
        description: "Stitches install, activation, Keychain, LaunchAgent, credential staging and send into ONE GlassWorm incident on agent_hostname + causality_id"
        ttp_ref: "TTP-2026-0197"
        detection_id: CR-KOI-0009

cleanup:
  commands:
    - "launchctl bootout \"gui/$(id -u)/com.cortexsim.CORTEXSIM-CANARY.koi009\" || true"
    - "rm -f \"$HOME/Library/LaunchAgents/com.cortexsim.CORTEXSIM-CANARY.koi009.plist\""
    - "security delete-keychain \"/tmp/CORTEXSIM-KOI009-DECOY/decoy.keychain-db\" || true"
    - "code --uninstall-extension cortexsim-canary.prettier-pro-canary || true"
    - "rm -rf /tmp/CORTEXSIM-KOI009-DECOY"
    - "rm -rf /tmp/CORTEXSIM-KOI009-VSIX"
    - "echo 'cortexsim-koi-009-cleanup-complete'"

