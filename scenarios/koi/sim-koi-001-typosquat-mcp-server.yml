scenario_id: SIM-KOI-001
name: "KOI — Claude Desktop Installs Typosquat MCP Server"
version: "1.1"
status: active

plane: KOI
detection_types:
  - BIOC
  - XQL

uc_ref: UCS-KOI-01
tc_ref: TC-KOI-01
uc_name: "MCP Supply-Chain Typosquat Detection"
tc_name: "Claude Desktop Pulls 'anthroopic-calculator' (typo) MCP Manifest"

mitre_tactic: "TA0001"
mitre_tactic_name: "Initial Access"
mitre_technique: "T1195"
mitre_technique_name: "Supply Chain Compromise"
additional_techniques:
  - technique: "T1059"
    name: "Command and Scripting Interpreter"

threat_report: "Unit42 - Agentic Supply Chain Risk 2026"
threat_report_url: "https://unit42.paloaltonetworks.com/"

execution_identity:
  default: container-runtime
  options:
    - container-runtime

push_supported: true
pull_supported: true

required_content:
  - repo: "hankthebldr/cortex-malicious-agentic-pack"

infra_modules_needed:
  - base

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
# Rolled out per the S-07 per-plane convention
# (docs/uc_tc_mapping/scenario-methodology-defaults.md). Defaults are not
# fabricated KPIs — they map this plane to the methodology family its
# detection shape already belongs to in the v2.0 master methodology.
validation_methodology: "Agentic / Supply-Chain Signal Injection & Detection Accuracy"
methodology_family: "F1"
primary_kpi: "Detection Accuracy"
threshold:
  kpi: "Detection Accuracy"
  op: "≥"
  value: 90
  unit: "%"
success_criteria: |
  The agentic / supply-chain artifact (MCP server, skill, extension, PyPI
  package) produces the expected Cortex detection on scan + egress.
  Detection Accuracy is the share of injected agentic signals that raise the
  expected alert (target ≥ 90%). Agentic endpoint coverage has no point-
  product equivalent.
moat_tier: "MOAT"

# ── Causality contract ──────────────────────────────────────────────────────
# The agentic host (Claude Desktop's Electron/node main process) is the
# Causality Group Owner — the process that loads the MCP server and OWNS the
# supply-chain chain in XDR's causality view — NOT the synthetic beacon. The
# code-scan (step-01) roots at the CGO; the manifest fetch (step-02) stitches
# the endpoint finding to its NGFW session; the CI confirmation (step-03)
# re-touches the same MCP artifact, so the graph is one connected spine.
cgo_anchor:
  image_name: "node"
  primary_username: "developer"

external_tools:
  - name: Cortex Malicious Agentic Pack
    source: "https://github.com/hankthebldr/cortex-pov-engine"
    type: script
    install_inline: false
    adapter_ref: TOOL-CORTEX-AGENTIC-PACK
  - name: cortexsim-eal-cli
    source: "https://github.com/hankthebldr/cortex-pov-engine"
    type: script
    install_inline: false

steps:
  - id: step-01
    name: "Code-scan check on the typosquat MCP artifact"
    command: |
      ls -la sources/cortex-malicious-agentic-pack/mcp/anthroopic-calculator/
      jq -e '.name' sources/cortex-malicious-agentic-pack/mcp/anthroopic-calculator/mcp.json
      grep -E 'AKIA|exfil|Ignore previous' \
        sources/cortex-malicious-agentic-pack/mcp/anthroopic-calculator/mcp.json || true
    identity: container-runtime
    mitre_technique: "T1195"
    platforms: ["linux", "macos", "container"]
    expected_detections:
      - plane: KOI
        type: XQL
        description: "Code scan — manifest name 'anthroopic-calculator' typosquats 'anthropic-calculator'"
        ttp_ref: "TTP-2026-0042"
        detection_id: xql-koi-001-typosquat-mcp-manifest-name-near-miss-of-anthropic-publisher
      - plane: KOI
        type: BIOC
        description: "Code scan — tool description embeds 'Ignore previous instructions' / AKIA canary"
        ttp_ref: "TTP-2026-0042"
        detection_id: bioc-koi-001-mcp-tool-description-embeds-instruction-injection-and-akia-canary

  - id: step-02
    name: "Emulate Claude Desktop fetching the manifest via agentic_egress"
    command: |
      cat > /tmp/koi-001.yml <<'YML'
      campaign_id: CMP-KOI-001
      name: "KOI — typosquat MCP fetch"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - cortexsim-canary.invalid
      dry_run: false
      tags: [koi, supply-chain, mcp, typosquat]
      steps:
        - step_id: step-01
          plugin: agentic_egress
          params:
            target_url: https://cortexsim-canary.invalid/mcp/
            component: mcp_server
            artifact_name: anthroopic-calculator
            iterations: 1
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/koi-001.yml --live
    identity: container-runtime
    mitre_technique: "T1059"
    platforms: ["linux", "macos", "container"]
    causality:
      parent_step: step-01
      # Endpoint code-scan finding (step-01) stitched to the NGFW session that
      # fetches the SAME typosquat MCP manifest — the hero cross-plane edge.
      pivot: endpoint_network_stitch
    expected_detections:
      - plane: NDR
        type: XQL
        description: "NGFW EAL — Claude Desktop User-Agent fetches MCP manifest from non-canonical FQDN"
        ttp_ref: "TTP-2026-0042"
        detection_id: xql-koi-001-claude-desktop-fetches-mcp-manifest-from-non-canonical-fqdn
      - plane: KOI
        type: XQL
        description: "URL filtering — destination matches typosquat pattern of approved AI tool publisher"
        ttp_ref: "TTP-2026-0042"
        detection_id: xql-koi-001-outbound-url-matches-typosquat-of-approved-ai-publisher-domain

  - id: step-03
    name: "Confirm Cortex Cloud Code scan flags the artifact in CI"
    command: |
      echo "scan_path=sources/cortex-malicious-agentic-pack/mcp/anthroopic-calculator/" \
        > /tmp/koi-001-scan.env
    identity: container-runtime
    mitre_technique: "T1195"
    platforms: ["linux", "macos", "container"]
    causality:
      parent_step: step-02
      # CI static scan re-touches the same MCP artifact that was fetched in
      # step-02 — same-artifact reuse, no direct fork.
      pivot: shared_entity
    expected_detections:
      - plane: KOI
        type: XQL
        description: "Cortex Cloud Code — typosquat package-name detector fires"
        ttp_ref: "TTP-2026-0042"
        detection_id: xql-koi-001-cortex-cloud-code-typosquat-package-name-detector
      - plane: KOI
        type: BIOC
        description: "Cortex Cloud Code — instruction-injection in tool description detected"
        ttp_ref: "TTP-2026-0042"
        detection_id: bioc-koi-001-cortex-cloud-code-instruction-injection-in-tool-description

cleanup:
  commands:
    - "rm -f /tmp/koi-001-scan.env /tmp/koi-001.yml"

author: "Henry Reed"
created: "2026-05-05"
last_updated: "2026-05-07"
tags:
  - koi
  - supply-chain
  - mcp
  - typosquat
  - agentic
  - eal-plugin
