# BUGSTER (Unit 42, 2026-10-21): Hermes Agent + DeepSeek V4 generate the tooling: WordPress author
# enumeration via REST API + author sitemap (WAF bypass), a 117x28 wp-login brute force, a MongoDB
# dump with a manifest, exfil/C2 (Python listener, VBScript -> Base64 PowerShell shell) on one server.
# ANALOGUE (ruling R4): the run host plays the foothold the AI-generated tools run from; the lab
# STAGE_HOST stands in for the victim WordPress/MongoDB and the :4444 listener. Three legs: EDR (01,
# 02, 04, 05, 07) the python3 lineage; NDR (03, 06, 08) NGFW EAL records from src_host to the two
# published IPs (proxy routing, port 8080/4444/3128, UA and app are inferred: the report gives none);
# AI_ACCESS (09) real egress with fake keys, jailbreak override to DeepSeek and OpenRouter (DeepSeek
# ran under a system-prompt override; the override went to GLM 5.2; other models were tested
# through OpenRouter). R1: the report
# publishes exactly two indicators, both IPv4; both are carried, no more (the >=3 rule does not
# apply). No cloud, VoIP, Wi-Fi or Go-scanner leg is emitted. CR-MP-0035 fuses the legs on src_host.
