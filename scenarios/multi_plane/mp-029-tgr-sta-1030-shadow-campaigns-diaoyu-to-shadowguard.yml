            dst_ip: "138.197.44.208"
            src_ip: "$SRC_IP"
            src_host: "$SRC_HOST"
            src_user: "$SRC_USER"
        - step_id: step-03
          plugin: ngfw_eal_emitter
          params:
            collector_url: "$COLLECTOR_URL"
            event_pattern: rare_ssh_session
            iterations: 1
            dst_domain: "zamstats.me"
            dst_ip: "157.245.194.54"
            src_ip: "$SRC_IP"
            src_host: "$SRC_HOST"
            src_user: "$SRC_USER"
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/mp-029-c2.yml --live
      echo cortexsim-mp-029-c2-and-relay-emitted
    identity: direct
    mitre_technique: "T1090"
    causality:
      parent_step: step-04
      pivot: endpoint_network_stitch
    platforms: ["linux"]
    expected_detections:
      - plane: NDR
        type: IOC
        description: "IOC rule on the Unit 42 Cobalt Strike sha256 matches the filedigest of the NGFW WildFire threat log on the run host."
