# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
validation_methodology: "Multi-Plane Correlation & Behavioral Detection Accuracy"
methodology_family: "F1"
primary_kpi: "MTTD"
threshold:
  kpi: "MTTD"
  op: "≤"
  value: 600
  unit: "seconds"
success_criteria: |
  The endpoint BIOCs fire on the lure lineage (archive-extracted executable beside a zero-byte
  pic1.png), the Diaoyu EDR-name discovery and the image-named stage written into the lure
  directory; IOC rules match the report C2 domains in the endpoint DNS telemetry; the NGFW
  threat logs carry the report lure and Cobalt Strike sha256 on the same src_host; the NGFW EAL
  ABIOCs fire on the recurring beacon and the rare SSH relay session to report infrastructure;
  on Linux the ShadowGuard kill -900/-901 and swsecret BIOCs fire. CR-MP-0029 stitches the
  endpoint and network legs on src_host into ONE TGR-STA-1030 incident within the window, and
  the Unit 42 indicators in that incident enrich to the actor. Mean time from the first step
  to the stitched incident is within the MTTD budget.
moat_tier: "LEAD"

# ── F2-Specific Fields ──────────────────────────────────────────────────────
correlation_window_seconds: 3600
required_planes_in_incident:
  - EDR
  - NDR
stitching_key: src_host

external_tools:
  - name: cortexsim-eal-cli
    source: "https://github.com/hankthebldr/cortex-pov-engine"
    type: script
    install_inline: false

# ── Causality contract ──────────────────────────────────────────────────────
# The victim double-clicks the exe extracted from the reorganisation-themed ZIP, so the CGO is the
# interactive shell that launched it (explorer.exe). step-01 is the root; step-02 descends from the
# lure by process lineage; the stage fetch (03) and C2 lookups (04) are network sessions off it; the
# threat logs (05) and C2 sessions (07) stitch to the endpoint on src_host; ShadowGuard (06) shares
# the src_host entity when the Linux variant runs the whole chain on one host.
cgo_anchor:
  image_name: "explorer.exe"
  primary_username: "user"

