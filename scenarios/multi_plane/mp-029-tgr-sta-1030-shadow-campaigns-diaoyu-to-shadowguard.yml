        description: "IOC rule on the Unit 42 IP 157.245.194.54 matches the destination of the NGFW SSH relay record from the run host."
        ttp_ref: "TTP-2026-0188"
        detection_id: "ioc-ipv4-157-245-194-54"
      - plane: NDR
        type: XQL
        description: "Validation query confirms the beacon and SSH relay records landed in panw_ngfw_traffic_raw with the run host's src_host and the report destinations within the window."
        ttp_ref: "TTP-2026-0188"
        detection_id: "xql-mp-029-c2-and-relay-sessions-landed-in-panw-ngfw-traffic-raw"
      - plane: ANALYTICS
