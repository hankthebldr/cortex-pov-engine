        detection_id: "ioc-file-sha256-5175b1720fe3bc568f7857b72b960260ad3982f41366ce3372c04424396df6fe"
      - plane: NDR
        type: ABIOC
        description: "The run host produces a tight recurring burst of small HTTPS sessions to servgate.me — rare across the fleet — the auto-tuned NGFW EAL ABIOC fires on recurring cadence plus destination rarity, anchored to src_host."
        ttp_ref: "TTP-2026-0188"
        detection_id: "abioc-mp-029-recurring-beacon-to-a-rare-tgr-sta-1030-c2-domain"
      - plane: NDR
        type: ABIOC
        description: "A process that rarely opens SSH creates a port-22 session from the run host to an uncommon external VPS — the leased relay hop the report describes — and the NGFW EAL ABIOC fires anchored to src_host."
        ttp_ref: "TTP-2026-0188"
        detection_id: "abioc-mp-029-rare-process-ssh-session-to-a-leased-relay-vps"
      - plane: NDR
        type: IOC
        description: "IOC rule on the Unit 42 IP 138.197.44.208 matches the destination of the NGFW traffic records from the run host."
        ttp_ref: "TTP-2026-0188"
        detection_id: "ioc-ipv4-138-197-44-208"
      - plane: NDR
