# Jingle Thief / CL-CRI-1032 (Unit 42, 2025-10-22): a financially motivated group phishes M365 credentials, signs
# in from Moroccan (and US proxy) infrastructure, sweeps SharePoint/OneDrive for gift-card workflows, bulk-downloads,
# then plants an Exchange forwarding rule to keep watching the mailbox. Identity + cloud-app only: the report
# describes no endpoint or malware leg, so none is invented. Every leg names ONE user principal (stitching_key
# user_principal) as target_user, set by step-01 and read back by every later step. DC points at: Entra sign-in
# analytics in msft_azure_ad_signin (step-01/02, ITDR); SharePoint/OneDrive/Exchange analytics in msft_o365_audit
# (step-03..06, CLOUD_APP); CR-MP-0034 for the stitched incident. The report's IPs are indicators for the tenant
# search but are NOT yet carried in-band: neither identity emitter has a client-address param (records carry RFC
# 5737 addresses) — backlog. Not emitted (no emitter preset, backlog): Sent->Deleted Items hiding, rogue
# Authenticator / SSPR / Entra device registration, gift-card app abuse. The report's phishing URLs are wildcard
# patterns, not domains, so there is no DNS lookup and no real IdP or mail platform is ever called.
scenario_id: SIM-MP-034
name: "Jingle Thief (CL-CRI-1032) — M365/Entra Account Takeover to SharePoint Recon and Mailbox Forwarding (Unit 42)"
version: "1.0"
status: active

plane: ANALYTICS
detection_types:
  - Analytics
  - XQL
  - Correlation

uc_ref: UCS-ITDR-02
tc_ref: TC-ITDR-03
tc_refs:
  - TC-ITDR-03
  - TC-ITDR-02
  - TC-AES-07
  - TC-IR-13
pov_scenario_id: POV-SC-001
uc_name: "Identity Threat Detection & Response"
tc_name: "Validate CIE syncs and correlates AD, Azure AD, and cloud IdPs"

mitre_tactic: "TA0001"
mitre_tactic_name: "Initial Access"
mitre_technique: "T1078.004"
mitre_technique_name: "Valid Accounts: Cloud Accounts"
additional_techniques:
  - technique: "T1213.002"
    name: "Data from Information Repositories: Sharepoint"
  - technique: "T1530"
    name: "Data from Cloud Storage"
  - technique: "T1114.003"
    name: "Email Collection: Email Forwarding Rule"
  - technique: "T1564.008"
    name: "Hide Artifacts: Email Hiding Rules"

threat_report: "Unit 42 — Jingle Thief: Inside a Cloud-Based Gift Card Fraud Campaign"
threat_report_url: "https://unit42.paloaltonetworks.com/cloud-based-gift-card-fraud-campaign/"

execution_identity:
  default: direct
  options:
    - direct

push_supported: false
pull_supported: true

infra_modules_needed:
  - base

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
validation_methodology: "Multi-Plane Correlation & Behavioral Detection Accuracy"
methodology_family: "F1"
primary_kpi: "MTTD"
threshold:
  kpi: "MTTD"
  op: "≤"
  value: 900
  unit: "seconds"
success_criteria: |
  For one canary user principal, the Entra risky-login and impossible-traveler analytics
  fire in msft_azure_ad_signin, and the SharePoint enumeration, OneDrive enumeration,
  mass-download and Exchange forwarding-rule analytics fire in msft_o365_audit, every
  record naming the same principal. CR-MP-0034 stitches ITDR + CLOUD_APP into one
  incident on that principal within the window. The report's IPs are searched for in the
  tenant by the DC; this run does not put them on the wire.
moat_tier: "LEAD"

correlation_window_seconds: 3600
required_planes_in_incident:
  - ITDR
  - CLOUD_APP
stitching_key: user_principal

