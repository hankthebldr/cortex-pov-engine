external_tools:
  - name: cortexsim-eal-cli
    source: "https://github.com/hankthebldr/cortex-pov-engine"
    type: script
    install_inline: false

# ── Causality contract ──────────────────────────────────────────────────────
# No endpoint process belongs to this story: the actor works through a browser session
# against M365. The CGO is the runner's python3 emitter process; step-01 is the root and
# every later step is the same principal's next action in the same tenant (shared_entity),
# which is the entity CR-MP-0034 fuses on.
cgo_anchor:
  image_name: "python3"
  primary_username: "direct"

steps:
  - id: step-01
    name: "Phished credentials replayed — Entra sign-in flagged at-risk from an anonymised address"
    command: |
      : "${COLLECTOR_URL:=https://collector.cortexsim-canary.invalid/entra/signin/events}"
      : "${COLLECTOR_HOST:=collector.cortexsim-canary.invalid}"
      CORTEXSIM_USER="${CORTEXSIM_USER:-cortexsim.canary@${LAB_TENANT:-cortexsim-canary.invalid}}"
      printf '%s\n' "$CORTEXSIM_USER" > /tmp/mp-034-principal
      cat > /tmp/mp-034-risky.yml <<YML
      campaign_id: CMP-MP-034-RISKY
      name: "MP-034 — Jingle Thief azure_risky_login"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - "$COLLECTOR_HOST"
      dry_run: false
      tags: [mp-034, unit42, jingle-thief]
      steps:
        - step_id: step-01
          plugin: idp_signin_emulator
          params:
            collector_url: "$COLLECTOR_URL"
            provider: microsoft
            event_pattern: azure_risky_login
            target_user: "$CORTEXSIM_USER"
            iterations: 1
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/mp-034-risky.yml --live
    identity: direct
    mitre_technique: "T1078.004"
    platforms: ["linux"]
    expected_detections:
      - plane: ITDR
        type: Analytics
        description: "Entra sign-in for the shared principal flagged atRisk from an anonymised address — the report's Table 1 alert 'A possible risky login to Azure' after the credential-phishing initial access."
        ttp_ref: "TTP-2026-0193"
        detection_id: "xql-mp-034-a-possible-risky-login-to-azure"
      - plane: ITDR
        type: XQL
        description: "Validation: the risky sign-in landed in msft_azure_ad_signin with userPrincipalName = the shared principal."
        ttp_ref: "TTP-2026-0193"
        detection_id: "xql-mp-034-risky-entra-sign-in-for-the-shared-principal-landed-in-msft-azure-ad-signin"
  - id: step-02
    name: "Same principal signs in from two distant countries — impossible traveler"
    command: |
      : "${COLLECTOR_URL:=https://collector.cortexsim-canary.invalid/entra/signin/events}"
      : "${COLLECTOR_HOST:=collector.cortexsim-canary.invalid}"
      test -s /tmp/mp-034-principal || { printf 'run step-01 first: no shared principal\n' >&2; exit 3; }
      CORTEXSIM_USER=$(cat /tmp/mp-034-principal)
      cat > /tmp/mp-034-travel.yml <<YML
      campaign_id: CMP-MP-034-TRAVEL
      name: "MP-034 — Jingle Thief impossible_travel"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - "$COLLECTOR_HOST"
      dry_run: false
      tags: [mp-034, unit42, jingle-thief]
      steps:
        - step_id: step-01
          plugin: idp_signin_emulator
          params:
            collector_url: "$COLLECTOR_URL"
            provider: microsoft
            event_pattern: impossible_travel
            target_user: "$CORTEXSIM_USER"
            iterations: 1
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/mp-034-travel.yml --live
    identity: direct
    mitre_technique: "T1078.004"
    platforms: ["linux"]
    causality:
      parent_step: step-01
      pivot: shared_entity
    expected_detections:
      - plane: ITDR
        type: Analytics
        description: "Two successful Entra sign-ins for the same principal from geographically distant addresses inside an impossible interval — the report's Table 1 'Impossible Traveler - SSO' / 'A user connected from a new country' family."
        ttp_ref: "TTP-2026-0193"
        detection_id: "xql-mp-034-impossible-traveler-sso-for-the-shared-principal"
  - id: step-03
    name: "Cloud reconnaissance — SharePoint search/page sweep for gift-card workflows"
    command: |
      : "${COLLECTOR_URL:=https://collector.cortexsim-canary.invalid/o365/audit/events}"
      : "${COLLECTOR_HOST:=collector.cortexsim-canary.invalid}"
      test -s /tmp/mp-034-principal || { printf 'run step-01 first: no shared principal\n' >&2; exit 3; }
      CORTEXSIM_USER=$(cat /tmp/mp-034-principal)
      cat > /tmp/mp-034-sharepoint.yml <<YML
      campaign_id: CMP-MP-034-SHAREPOINT
      name: "MP-034 — Jingle Thief sharepoint_enumeration"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - "$COLLECTOR_HOST"
      dry_run: false
      tags: [mp-034, unit42, jingle-thief]
      steps:
        - step_id: step-01
          plugin: m365_activity_emitter
          params:
            collector_url: "$COLLECTOR_URL"
            event_pattern: sharepoint_enumeration
            target_user: "$CORTEXSIM_USER"
            iterations: 1
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/mp-034-sharepoint.yml --live
    identity: direct
    mitre_technique: "T1213.002"
    platforms: ["linux"]
    causality:
      parent_step: step-02
      pivot: shared_entity
    expected_detections:
      - plane: CLOUD_APP
        type: Analytics
        description: "SearchQueryPerformed / PageViewed sweep across SharePoint sites by the same principal — the report's search for gift-card workflows, ticketing exports and VPN guides."
        ttp_ref: "TTP-2026-0193"
        detection_id: "xql-mp-034-sharepoint-enumeration-by-the-compromised-principal"
  - id: step-04
    name: "Cloud reconnaissance — OneDrive file enumeration by the same principal"
    command: |
      : "${COLLECTOR_URL:=https://collector.cortexsim-canary.invalid/o365/audit/events}"
      : "${COLLECTOR_HOST:=collector.cortexsim-canary.invalid}"
      test -s /tmp/mp-034-principal || { printf 'run step-01 first: no shared principal\n' >&2; exit 3; }
      CORTEXSIM_USER=$(cat /tmp/mp-034-principal)
      cat > /tmp/mp-034-onedrive.yml <<YML
      campaign_id: CMP-MP-034-ONEDRIVE
      name: "MP-034 — Jingle Thief onedrive_enumeration"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - "$COLLECTOR_HOST"
      dry_run: false
      tags: [mp-034, unit42, jingle-thief]
      steps:
        - step_id: step-01
          plugin: m365_activity_emitter
          params:
            collector_url: "$COLLECTOR_URL"
            event_pattern: onedrive_enumeration
            target_user: "$CORTEXSIM_USER"
            iterations: 1
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/mp-034-onedrive.yml --live
    identity: direct
    mitre_technique: "T1213.002"
    platforms: ["linux"]
    causality:
      parent_step: step-03
      pivot: shared_entity
    expected_detections:
      - plane: CLOUD_APP
        type: Analytics
        description: "FileAccessed enumeration across a OneDrive by the same principal — the OneDrive half of the report's reconnaissance phase."
        ttp_ref: "TTP-2026-0193"
        detection_id: "xql-mp-034-onedrive-enumeration-by-the-compromised-principal"
  - id: step-05
    name: "Collection — burst of SharePoint/OneDrive file downloads"
    command: |
      : "${COLLECTOR_URL:=https://collector.cortexsim-canary.invalid/o365/audit/events}"
      : "${COLLECTOR_HOST:=collector.cortexsim-canary.invalid}"
      test -s /tmp/mp-034-principal || { printf 'run step-01 first: no shared principal\n' >&2; exit 3; }
      CORTEXSIM_USER=$(cat /tmp/mp-034-principal)
      cat > /tmp/mp-034-download.yml <<YML
      campaign_id: CMP-MP-034-DOWNLOAD
      name: "MP-034 — Jingle Thief storage_exfiltration"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - "$COLLECTOR_HOST"
      dry_run: false
      tags: [mp-034, unit42, jingle-thief]
      steps:
        - step_id: step-01
          plugin: m365_activity_emitter
          params:
            collector_url: "$COLLECTOR_URL"
            event_pattern: storage_exfiltration
            target_user: "$CORTEXSIM_USER"
            iterations: 1
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/mp-034-download.yml --live
    identity: direct
    mitre_technique: "T1530"
    platforms: ["linux"]
    causality:
      parent_step: step-04
      pivot: shared_entity
    expected_detections:
      - plane: CLOUD_APP
        type: Analytics
        description: "Burst of FileDownloaded / FileSyncDownloadedFull by the same principal — the report's Table 1 'Massive file downloads from SaaS service'."
        ttp_ref: "TTP-2026-0193"
        detection_id: "xql-mp-034-massive-file-downloads-from-saas-service"
      - plane: CLOUD_APP
        type: XQL
        description: "Validation: enumeration and download records for the shared principal landed in msft_o365_audit (UserId = the principal)."
        ttp_ref: "TTP-2026-0193"
        detection_id: "xql-mp-034-sharepoint-onedrive-activity-for-the-shared-principal-landed-in-msft-o365-audit"
  - id: step-06
    name: "Mailbox persistence — Exchange inbox forwarding rule, and the stitched incident"
    command: |
      : "${COLLECTOR_URL:=https://collector.cortexsim-canary.invalid/o365/audit/events}"
      : "${COLLECTOR_HOST:=collector.cortexsim-canary.invalid}"
      test -s /tmp/mp-034-principal || { printf 'run step-01 first: no shared principal\n' >&2; exit 3; }
      CORTEXSIM_USER=$(cat /tmp/mp-034-principal)
      cat > /tmp/mp-034-rule.yml <<YML
      campaign_id: CMP-MP-034-RULE
      name: "MP-034 — Jingle Thief mailbox_rule_creation"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - "$COLLECTOR_HOST"
      dry_run: false
      tags: [mp-034, unit42, jingle-thief]
      steps:
        - step_id: step-01
          plugin: m365_activity_emitter
          params:
            collector_url: "$COLLECTOR_URL"
            event_pattern: mailbox_rule_creation
            target_user: "$CORTEXSIM_USER"
            iterations: 1
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/mp-034-rule.yml --live
    identity: direct
    mitre_technique: "T1114.003"
    platforms: ["linux"]
    causality:
      parent_step: step-05
      pivot: shared_entity
    expected_detections:
      - plane: CLOUD_APP
        type: Analytics
        description: "New-InboxRule forwarding/hiding rule on the shared principal's mailbox — the report's Table 1 'Exchange inbox forwarding rule configured'."
        ttp_ref: "TTP-2026-0193"
        detection_id: "xql-mp-034-exchange-inbox-forwarding-rule-configured"
      - plane: ANALYTICS
        type: Correlation
        description: "CR-MP-0034 fuses the risky Entra sign-in, impossible travel, SharePoint/OneDrive enumeration, mass download and the forwarding rule into one incident on the same user principal within the window."
        ttp_ref: "TTP-2026-0193"
        detection_id: "CR-MP-0034"

cleanup:
  commands:
    - "rm -f /tmp/mp-034-principal /tmp/mp-034-risky.yml /tmp/mp-034-travel.yml /tmp/mp-034-sharepoint.yml /tmp/mp-034-onedrive.yml /tmp/mp-034-download.yml /tmp/mp-034-rule.yml"

