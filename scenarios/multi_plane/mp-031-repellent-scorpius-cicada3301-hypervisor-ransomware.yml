# Repellent Scorpius / Cicada3301 (Unit 42, 2024-09-10): stolen-credential RDP access, share enumeration to
# ProgramData\found_shares.txt, a Rust encryptor pushed over C$ by embedded PsExec (--no_impl --key), Rclone
# exfil to 91.238.181.238, then VM stop, shadow-copy and event-log wipe, and ChaCha20 encryption (.kcr5umw,
# RECOVER-<ext>-DATA.txt). Transposed onto a Linux host with ESXi-shaped paths under /tmp/cortexsim-mp031.
# ENDPOINT (01, 02, 04, 06, 07; root under an interactive bash CGO): point at the causality view - the
#   found_shares.txt write, the share-path locker run with --no_impl --key, the renamed rclone + rclone.conf,
#   the mass vmx-process kill / snapshot + log wipe, and the .kcr5umw rename with the ransom note.
# NETWORK (03, 05; synthetic NGFW records carrying this host's src_ip/src_host/src_user): WildFire threat
#   logs name three report SHA-256s on the SMB transfer; the EAL upload names the report exfil IP.
# Two legs, not three: no emitter can put this host's identity on the report's RDP logon (103.42.240.37),
# so no identity leg is authored. Report IP/hashes appear only in EAL params; nothing is ever contacted.
# Lab-only: every write, encryption and delete is guarded to /tmp/cortexsim-mp031; uploads reach $STAGE_HOST.
scenario_id: SIM-MP-031
name: "Repellent Scorpius Cicada3301 - Share Enum, PsExec Spread, Rclone Exfil, Hypervisor-Shaped Encryption (Unit 42)"
