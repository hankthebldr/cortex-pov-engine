success_criteria: |
  The endpoint leg raises the SSH fan-out, firefart account, pam_unix.so write,
  kernel-thread masquerade, covert ICMP/DNS trigger, reverse-tunnel and wtmp-scrub
  BIOCs plus the GTP-C listener ABIOC on one Linux host. The network leg lands five
  WildFire threat records in panw_ngfw_threat_raw whose filedigest is a published
  CL-STA-0969 toolkit sha256 (the IOC rule fires on the GTPDoor hash) and a rare
  SSH-session record, all carrying the endpoint's src_host. CR-MP-0033 joins endpoint
  and network signal on src_host into ONE incident inside correlation_window_seconds.
  Mean time from the first step to the stitched incident is within the MTTD budget.
moat_tier: "LEAD"

