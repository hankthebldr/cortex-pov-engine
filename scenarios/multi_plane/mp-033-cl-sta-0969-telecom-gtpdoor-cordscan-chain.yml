        ttp_ref: "TTP-2026-0192"
        detection_id: "ioc-file-sha256-827f41fc1a6f8a4c8a8575b3e2349aeaba0dfc2c9390ef1cceeef1bb85c34161"
      - plane: NDR
        type: XQL
        description: "Validation query: all five CL-STA-0969 toolkit sha256s landed in panw_ngfw_threat_raw for one src_host inside the run window, with action alert (never a block)."
        ttp_ref: "TTP-2026-0192"
        detection_id: "xql-mp-033-cl-sta-0969-toolkit-sha256s-landed-in-panw-ngfw-threat-raw"
      - plane: NDR
        type: Correlation
        description: "CR-MP-NET-0033 fuses the network leg on its own: the panw_ngfw_threat_raw CL-STA-0969 toolkit sha256 WildFire verdicts and the panw_ngfw_traffic_raw rare SSH session share endpoint_device_name / src for the run host within 3600 s, so the NGFW threat verdict and its session are one network-plane finding before the endpoint stitch."
        ttp_ref: "TTP-2026-0192"
        detection_id: "CR-MP-NET-0033"

  - id: step-09
    name: "NGFW leg — rare SSH session record for the run host (preset destination, un-enrichable)"
    command: |
      : "${COLLECTOR_URL:=https://collector.cortexsim-canary.invalid/ngfw/eal/events}"
      : "${COLLECTOR_HOST:=collector.cortexsim-canary.invalid}"
      SRC_IP=$(hostname -I | awk '{print $1}')
      SRC_HOST=$(hostname -s)
      SRC_USER=$(id -un)
      cat > /tmp/mp-033-ssh.yml <<YML
      campaign_id: CMP-MP-SSH-033
      name: "CL-STA-0969 telecom — rare outbound SSH tunnel session (NGFW EAL)"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      c2_authorized: true
      target_allowlist:
        - "$COLLECTOR_HOST"
      dry_run: false
      tags: [mp-033, unit42, cl-sta-0969, ngfw-eal]
      steps:
        - step_id: step-01
          plugin: ngfw_eal_emitter
          params:
            collector_url: "$COLLECTOR_URL"
            event_pattern: rare_ssh_session
            iterations: 1
            src_ip: "$SRC_IP"
            src_host: "$SRC_HOST"
            src_user: "$SRC_USER"
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/mp-033-ssh.yml --live
    identity: root
    mitre_technique: "T1021.004"
    causality:
      parent_step: step-07
      pivot: endpoint_network_stitch
    platforms: ["linux"]
    expected_detections:
      - plane: NDR
        type: ABIOC
        description: "NGFW EAL behavioural alert — the run host (src) opens an SSH session to an uncommon external host from a process that rarely uses SSH, the network face of the report's reverse tunnels. Preset destination: the report publishes no domain or IP, so this record is enrichable by src_host only, never by a report indicator."
        ttp_ref: "TTP-2026-0192"
        detection_id: "abioc-mp-033-ngfw-rare-ssh-session-from-the-telecom-host"

  - id: step-10
    name: "Cover tracks — scrub a wtmp copy with utmpdump, null HISTFILE, timestomp the dropped tools"
    command: |
      LAB=/var/tmp/.cortexsim-mp033
      export HISTFILE=/dev/null
      if [ -r /var/log/wtmp ] && command -v utmpdump >/dev/null 2>&1; then
        cp /var/log/wtmp "$LAB/wtmp"
        utmpdump "$LAB/wtmp" 2>/dev/null | sed "/${STAGE_HOST:-127.0.0.1}/d" > "$LAB/wtmp.txt"
        utmpdump -r < "$LAB/wtmp.txt" > "$LAB/wtmp.clean" 2>/dev/null
        wc -l "$LAB/wtmp.txt"
      else
        printf 'no readable wtmp or no utmpdump on this host\n'
      fi
      REF=/usr/bin/time; [ -e "$REF" ] || REF=/bin/ls
      for f in "$LAB"/bin/*; do touch -r "$REF" "$f"; done
      ls -l --time-style=full-iso "$LAB/bin"
    identity: root
    mitre_technique: "T1070.002"
    causality:
      parent_step: step-04
      pivot: process_lineage
    platforms: ["linux"]
    expected_detections:
      - plane: EDR
        type: BIOC
        description: "utmpdump dumps a wtmp file, sed deletes lines matching an address and utmpdump -r writes the result back, while the same causality sets HISTFILE=/dev/null and runs touch -r against the dropped tools — the report's login-record scrub, history suppression and timestomping, keyed on utmpdump -r in a causality that also runs touch -r."
        ttp_ref: "TTP-2026-0192"
        detection_id: "bioc-mp-033-wtmp-rewritten-via-utmpdump-with-history-disabled-and-timestomp"
      - plane: ANALYTICS
        type: Correlation
        description: "CR-MP-0033 joins the endpoint escalation / PAM backdoor / masquerade / covert-channel / reverse-tunnel / log-scrub alerts and the NGFW WildFire toolkit-hash and rare-SSH records on src_host inside correlation_window_seconds into ONE CL-STA-0969 incident."
        ttp_ref: "TTP-2026-0192"
        detection_id: "CR-MP-0033"

