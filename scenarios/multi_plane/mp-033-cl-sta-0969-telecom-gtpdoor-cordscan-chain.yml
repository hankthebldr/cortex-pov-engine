# CL-STA-0969 (Unit 42, 2025-07-29): telecom intrusion via SSH dictionary attempts, DirtyCoW/PwnKit escalation (temp user
# firefart), an AuthDoor pam_unix.so backdoor, masqueraded tooling ([kpqd], dbus-*) kept alive by a watchdog, covert C2 over
# GTP-C (GTPDoor, UDP 2123), ICMP (EchoBackdoor) and DNS (NoDepDNS), reverse SSH tunnels to remote port 53, then wtmp scrubbed
# with utmpdump, HISTFILE nulled and files timestomped; the report's SELinux disable is deliberately NOT reproduced.
# ENDPOINT (EDR, Linux): each stage runs for real against lab targets only (${STAGE_HOST:-127.0.0.1}, a loopback GTP-C
# listener, copies of wtmp/pam_unix.so; the DNS trigger is sent only via dig to @${LAB_RESOLVER:-127.0.0.53}, skipped if dig
# is absent, and is the report's non-resolvable .node trigger name, not an IOC). NETWORK (NDR): WildFire
# threat logs carrying five published toolkit sha256s (enrichable) plus an EAL rare-SSH-session record whose destination keeps
# the preset — the report publishes no domain or IP, so that record is UN-ENRICHABLE and stitches on src_host only. No cloud
# leg: the report describes none. No real adversary host is contacted; report hashes appear only as log fields or echo lines.
# DC points at: the firefart / pam_unix.so / masquerade / reverse-tunnel BIOCs and the GTP-C listener ABIOC on the endpoint,
# the toolkit hash hits in panw_ngfw_threat_raw, and CR-MP-0033 joining both on src_host.
