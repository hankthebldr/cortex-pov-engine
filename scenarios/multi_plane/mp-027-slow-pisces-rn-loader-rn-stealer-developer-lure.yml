# Slow Pisces (DPRK; aka Jade Sleet, TraderTraitor), Unit 42 2025-04-14: a LinkedIn "recruiter"
# hands a crypto developer a coding challenge (Stocks Pattern Analyzer) that fetches
# en.stockslab.org/symbols/sp500; a validated target gets application/yaml, yaml.load() runs it,
# ~/Public/__init__.py (RN Loader) beacons host info and self-deletes, then RN Stealer collects
# keychain, SSH keys and AWS/kube/gcloud configs (R0/R64/R128/R256). DC points at: EDR leg
# (01-05) the project python3 lineage, ~/Public write, self-deleting script, masqueraded dockerd,
# credential-file opens and DNS lookups of three published domains (only via
# @${LAB_RESOLVER:-127.0.0.53}); NDR leg (06) NGFW EAL records to the report's domain/IP pairs
# carrying src_host. CR-MP-0027 fuses both. No cloud leg (configs stolen, never used in the report);
# published SHA-256s not carried (no file crossed a sensor). Needs a `developer` account and `dig`
# (dnsutils/bind-utils). All C2 is plain HTTP to $STAGE_HOST (report: HTTPS), poll 2 s (report: 20 s); the
# fetched body is never executed; home and applications directory-name listings go to $STAGE_HOST; absent
# credential paths get 0600 marker stand-ins.
scenario_id: SIM-MP-027
name: "Slow Pisces Coding-Challenge Lure to RN Loader / RN Stealer — Developer Workstation EDR + NGFW Stitch"
version: "1.0"
status: active

