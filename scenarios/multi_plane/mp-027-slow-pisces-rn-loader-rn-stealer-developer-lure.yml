# ── Causality contract ──────────────────────────────────────────────────────
# The developer's own python3 running the cloned coding-challenge project owns the chain.
# step-01 is the root; the YAML-deserialised stage, RN Loader, its dockerd child and the
# RN Stealer exec all descend from it by process lineage. The NGFW leg is stitched onto
# the same workstation by entity (src_host / src_ip / src_user), not by process fork.
cgo_anchor:
  image_name: "python3"
  primary_username: "developer"

execution_identity:
  default: developer
  options:
    - developer
    - container-runtime
    - root

push_supported: true
pull_supported: true

infra_modules_needed:
  - base
  - edr
  - ndr

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
validation_methodology: "Multi-Plane Correlation & Behavioral Detection Accuracy"
methodology_family: "F2"
primary_kpi: "MTTD"
threshold:
  kpi: "MTTD"
  op: "≤"
  value: 600
  unit: "seconds"
success_criteria: |
  On the developer workstation, Cortex XDR raises the endpoint signals the report's tradecraft
  produces: the coding-challenge python3 resolving a published Slow Pisces domain and fetching
  /symbols/sp500, the YAML-deserialised stage writing ~/Public/__init__.py, that script running
  and deleting itself, a binary named dockerd launched from a temp path by python3, and python3
  opening the login keychain, SSH private keys and AWS/Kubernetes/gcloud credential files. Unit 42
  IOC enrichment names the actor on the DNS lookups. The NGFW EAL records to the report's
  domain/IP pairs land in panw_ngfw_traffic_raw carrying the same src_host, src_ip and src_user,
  CR-MP-0027 fuses the endpoint and network alerts on src_host into one incident within the
  window, and mean time from the lure's first fetch to the first alert is within the MTTD budget.
moat_tier: "LEAD"

correlation_window_seconds: 1800
required_planes_in_incident:
  - EDR
  - NDR
stitching_key: src_host

