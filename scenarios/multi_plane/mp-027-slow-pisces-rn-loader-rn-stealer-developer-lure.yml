        detection_id: "ioc-ipv4-91-103-140-191"
      - plane: NDR
        type: XQL
        description: "Validation query: panw_ngfw_traffic_raw holds sessions from the run host (endpoint_device_name = src_host) to the published Slow Pisces domain/IP pairs within the run window."
        ttp_ref: "TTP-2026-0186"
        detection_id: "xql-mp-027-ngfw-traffic-to-published-slow-pisces-infrastructure-from-the-run-host"
      - plane: ANALYTICS
        type: Correlation
        description: "CR-MP-0027 fuses the endpoint lure/loader/stealer alerts and the NGFW C2 alerts on the shared src_host within 1800 s into one Slow Pisces developer-compromise incident."
