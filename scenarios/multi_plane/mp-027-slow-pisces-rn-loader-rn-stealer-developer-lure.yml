            src_host: "$SRC_HOST"
            src_user: "$SRC_USER"
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/mp-027-ngfw-eal.yml --live
      echo cortexsim-mp-027-step06-ngfw-eal-rn-loader-egress-emitted
    identity: container-runtime
    mitre_technique: "T1071.001"
    # Same workstation (src_host / src_ip / src_user) as the endpoint leg: the NGFW
    # records are stitched onto the RN Loader host by entity, not by process fork.
    causality:
      parent_step: step-03
      pivot: shared_entity
    platforms: ["linux", "macos"]
    expected_detections:
      - plane: NDR
        type: ABIOC
        description: "NGFW EAL recurring small HTTPS sessions from the developer workstation to en.stockslab.org, a domain rare across the fleet: the auto-tuned recurring-communications ABIOC fires on cadence plus destination rarity, anchored to src_host."
        ttp_ref: "TTP-2026-0186"
        detection_id: "abioc-mp-027-ngfw-recurring-rare-domain-communications-from-a-developer-workstation"
      - plane: NDR
