# Slow Pisces (DPRK; aka Jade Sleet, TraderTraitor), Unit 42 2025-04-14: a LinkedIn "recruiter"
# hands a crypto developer a coding challenge (Stocks Pattern Analyzer). Run, the project fetches
# en.stockslab.org/symbols/sp500; a validated target gets application/yaml, yaml.load() runs it,
# ~/Public/__init__.py (RN Loader) beacons host info and self-deletes, then RN Stealer collects
# the keychain, SSH keys and AWS/kube/gcloud configs (R0/R64/R128/R256). DC points at: EDR leg
# (01-05) python3 child of the project, the ~/Public write, the self-deleting script, the
# masqueraded dockerd, the credential-file opens, and DNS lookups of three published domains
# (sent only via @${LAB_RESOLVER:-127.0.0.53}; no session opened, all HTTP goes to $STAGE_HOST);
# NDR leg (06) NGFW EAL C2 records to the report's domain/IP pairs carrying the run host
# (src_host). CR-MP-0027 fuses both legs. No cloud leg: the report shows the cloud configs
# stolen, never used. The published SHA-256s are not carried: no file crossed a sensor.
scenario_id: SIM-MP-027
name: "Slow Pisces Coding-Challenge Lure to RN Loader / RN Stealer — Developer Workstation EDR + NGFW Stitch"
version: "1.0"
status: active

plane: ANALYTICS
detection_types:
  - BIOC
  - XQL
  - IOC
  - ABIOC
  - Correlation

uc_ref: UCS-NDR-01
tc_ref: TC-NDR-01
