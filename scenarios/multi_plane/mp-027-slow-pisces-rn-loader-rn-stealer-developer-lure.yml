    - "for d in /home/*/Public /Users/*/Public /root/Public; do [ -f \"$d/.cortexsim-mp-027-created\" ] && rm -f \"$d/.cortexsim-mp-027-created\" && rmdir \"$d\" 2>/dev/null; done; true"
    - "rm -rf /tmp/cortexsim-mp-027 /tmp/mp-027-ngfw-eal.yml"
