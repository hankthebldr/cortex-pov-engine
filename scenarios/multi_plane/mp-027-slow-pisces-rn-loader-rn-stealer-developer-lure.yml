        detection_id: "CR-MP-0027"

cleanup:
  commands:
    - "for h in /home/* /Users/* /root; do for f in Public/__init__.py Library/Keychains/login.keychain-db .local/share/keyrings/login.keyring .aws/credentials .kube/config .ssh/id_ed25519; do grep -qs cortexsim-mp-027 \"$h/$f\" && rm -f \"$h/$f\"; done; done; true"
    - "find /home /Users /root -maxdepth 6 -name .cortexsim-mp-027-created 2>/dev/null | sort -r | while read -r m; do rm -f \"$m\"; rmdir \"$(dirname \"$m\")\" 2>/dev/null; done; true"
    - "rm -rf /tmp/cortexsim-mp-027 /tmp/mp-027-ngfw-eal.yml"
    - "echo cortexsim-mp-027-cleanup-complete"

