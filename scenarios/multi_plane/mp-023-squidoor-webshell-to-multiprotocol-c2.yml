  - id: step-08
    name: "NGFW threat leg: WildFire malicious verdict for config.ini's published SHA-256 — correlation"
    command: |
      : "${COLLECTOR_URL:=https://collector.cortexsim-canary.invalid/ngfw/threat/events}"
      : "${COLLECTOR_HOST:=collector.cortexsim-canary.invalid}"
      SRC_IP=$(hostname -I | awk '{print $1}')
      SRC_HOST=$(hostname -s)
      SRC_USER=$(id -un www-data 2>/dev/null || id -un)
      cat > /tmp/mp-023-ngfw-threat.yml <<YML
      campaign_id: CMP-MP-023
      name: "Squidoor config.ini WildFire verdict on the run host"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      c2_authorized: true
      target_allowlist:
        - "$COLLECTOR_HOST"
      dry_run: false
      tags: [mp-023, squidoor, cl-sta-0049, ngfw-threat]
      steps:
        - step_id: step-01
          plugin: ngfw_threat_emitter
          params:
            collector_url: "$COLLECTOR_URL"
            event_pattern: wildfire_malicious_file
            file_sha256: "f663149d618be90e5596b28103d38e963c44a69a5de4a1be62547259ca9ffd2d"
            file_name: "config.ini"
            file_type: "unknown"
            verdict: malicious
            action: alert
            src_ip: "$SRC_IP"
            src_host: "$SRC_HOST"
            src_user: "$SRC_USER"
            iterations: 1
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/mp-023-ngfw-threat.yml --live
      echo cortexsim-mp023-step08-ngfw-threat-log-emitted
    identity: container-runtime
    mitre_technique: "T1105"
    causality:
      parent_step: step-07
      pivot: shared_entity
    platforms: ["linux"]
    expected_detections:
      - plane: NDR
        type: IOC
        description: "WildFire threat log names filedigest f663149d…ffd2d (Squidoor Windows config.ini per the report) for the run host; the hash matches the published indicator and enriches as CL-STA-0049. Delivery host is not published, so the record keeps the emitter's preset destination."
        ttp_ref: "TTP-2026-0182"
        detection_id: "ioc-file-sha256-f663149d618be90e5596b28103d38e963c44a69a5de4a1be62547259ca9ffd2d"
      - plane: NDR
        type: XQL
        description: "Validation query: the WildFire malicious verdict for config.ini landed in panw_ngfw_threat_raw with the run host's src / endpoint hostname within the run window."
        ttp_ref: "TTP-2026-0182"
        detection_id: "xql-mp-023-squidoor-config-ini-wildfire-verdict-landed-for-run-host"
      - plane: ANALYTICS
        type: Correlation
        description: "CR-MP-0023 fuses the endpoint web-shell/loader/persistence/C2-shape alerts and the NGFW beacon + WildFire alerts on the shared src_host within 1800 s into one CL-STA-0049 incident."
        ttp_ref: "TTP-2026-0182"
        detection_id: "CR-MP-0023"

