# ── Causality contract ──────────────────────────────────────────────────────
# The exposed web-server worker owns the chain (IIS w3wp.exe in the report; the Linux
# primary path models it as the www-data web worker). Steps 02-06 descend from the web
# shell by process lineage; the NGFW legs pivot onto the same run host (src_host).
cgo_anchor:
  image_name: "apache2"
  primary_username: "www-data"

execution_identity:
  default: www-data
  options:
    - www-data
    - container-runtime
    - root

push_supported: true
pull_supported: true

infra_modules_needed:
  - base
  - edr
  - ndr

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
validation_methodology: "Multi-Plane Correlation & Behavioral Detection Accuracy"
methodology_family: "F1"
primary_kpi: "MTTD"
threshold:
  kpi: "MTTD"
  op: "≤"
  value: 600
  unit: "seconds"
success_criteria: |
  On the run host, Cortex XDR raises the endpoint signals the report's tradecraft produces:
  .aspx web shells decoded into a webroot by the web-service account, a web shell copied out
  as a certificate and pushed to a peer, a renamed system binary executing a config.ini
  script from a ProgramData-style path, a persistence entry named EPolicyManager, DNS
  lookups of the five published CL-STA-0049 domains (Unit 42 enrichment names the actor),
  and padded ICMP plus long-label DNS from a service account. The NGFW EAL beacon to the
  published domains/IPs and the WildFire malicious verdict for config.ini's published
  SHA-256 land in panw_ngfw_traffic_raw / panw_ngfw_threat_raw carrying the same src_host,
  src_ip and src_user. CR-MP-0023 fuses the endpoint and network alerts on src_host into one
  incident within the correlation window, and mean time from the web-shell write to the first
  alert is within the MTTD budget.
moat_tier: "LEAD"

correlation_window_seconds: 1800
required_planes_in_incident:
  - EDR
  - NDR
stitching_key: src_host

