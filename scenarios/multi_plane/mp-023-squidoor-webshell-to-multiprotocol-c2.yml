# CL-STA-0049 (Unit 42, 2025-02-27): web shells (OutlookDC.aspx / Error.aspx / TimeoutAPI.aspx)
# are certutil-decoded onto an exposed web server, one is disguised as a certificate and pushed
# to a peer with curl; a renamed debugger (cdb.exe -> C:\ProgramData\fontdrvhost.exe) loads
# Squidoor from config.ini, a scheduled task (Microsoft\Windows\AppID\EPolicyManager) persists it,
# and the backdoor talks over Outlook-drafts (p_/r_ subjects), DNS and ICMP. DC points at: EDR leg
# (01-06; Linux 03/04 = cp /bin/sh + cron @reboot ANALOGUES, Windows variants report-exact) the
# .aspx writes, renamed loader, persistence, report-domain DNS lookups, padded ICMP; NDR leg (07-08)
# the NGFW EAL beacon to published domains/IPs and the WildFire log for config.ini's SHA-256. Both legs carry
# the run host (src_host) and CR-MP-0023 fuses them. DNS lookups of the 5 report domains go only
# through @${LAB_RESOLVER:-127.0.0.53} (no session opened). The Outlook/Graph leg is NOT emitted as
# M365 audit: the report suggests an actor-held mailbox and no M365 emitter can carry src_host.
# The report lists domains and IPs unpaired; the NGFW records pair them only to satisfy the emitter.
scenario_id: SIM-MP-023
name: "Squidoor (CL-STA-0049) Web Shell to Renamed-Debugger Backdoor with Multi-Protocol C2 — EDR + NGFW Stitch"
