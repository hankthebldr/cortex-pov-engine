      YML
      python3 -m scripts.eal_simulator.cli run /tmp/mp-023-ngfw-eal.yml --live
      echo cortexsim-mp023-step07-ngfw-eal-beacon-emitted
    identity: container-runtime
    mitre_technique: "T1071.001"
    # Same run host (src_host / src_ip) as the endpoint leg — the NGFW record is
    # stitched onto the backdoor's endpoint by entity, not by process fork.
    causality:
      parent_step: step-05
      pivot: endpoint_network_stitch
    platforms: ["linux"]
    expected_detections:
      - plane: NDR
        type: ABIOC
        description: "Abnormal recurring communications to a rare domain from the run host — the NGFW EAL ABIOC fires on the recurring ssl/443 burst to destinations the fleet never talks to, anchored to src_host / src_ip."
