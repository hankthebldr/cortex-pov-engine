# CL-UNK-1211 (Unit 42, 2026-10-15) used AI-written PHP/shell payloads against government Linux web
# servers: auto_prepend_file web-shell persistence, a sudo-alias .bashrc credential trap, the Go RAT
# SysGoRAT, in-memory reverse shells, GSocket relays, qmail Maildir theft, then log wiping.
# Two legs, not three: the report describes no cloud-API activity. Shells reach only $STAGE_HOST.
# ENDPOINT (steps 01-05, 08, 10, 11; www-data under a php-fpm CGO): point at the causality view -
#   php.ini rewrites, .bashrc sudo alias, sys-update.service, /dev/tcp + mkfifo + python shells, [kcached].
# NETWORK (steps 06, 07, 09; synthetic NGFW records carrying this host's src_ip/src_host/src_user):
#   the WildFire threat log names the gs-netcat SHA-256; the EAL beacon names the SysGoRAT C2 IP.
#   Step 09's mailbox upload keeps the preset destination (the report names only legitimate file
#   hosts) and is un-enrichable; it stitches on the host alone. Report domains are looked up once
#   via the operator's resolver, `dig ... @${LAB_RESOLVER:-127.0.0.53}`; no session is ever opened.
# Lab-only: writes stay under /tmp/cortexsim-mp-024, /dev/shm and the three /tmp/mp-024-*.yml campaign
#   files.
