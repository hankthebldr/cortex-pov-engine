threat_report: "Unit 42 — ChainDrop: Inside a Self-Propagating npm Worm (2026-08-06)"
threat_report_url: "https://unit42.paloaltonetworks.com/chaindrop-npm-worm-analysis/"

# ChainDrop (Shai-Hulud lineage): an npm preinstall runs setup.mjs, which launches a detached runtime on math_init.js; the payload scrapes Runner.Worker memory, queries metadata/token endpoints, takes k8s tokens/kubeconfig/Terraform state, persists via .vscode/tasks.json + .claude/settings.json, and ships an encrypted bundle to /router.
# Endpoint (EDR, src_host): a LOCAL inert package under /tmp/cortexsim-* (no report package is installed, Bun is never downloaded); the Runner.Worker read targets a lab-owned decoy process.
# The metadata read goes to ${STAGE_HOST:-127.0.0.1}; it reaches a real metadata service ONLY if the operator sets IMDS_HOST. Credential files are staged synthetics; real SA/kubeconfig paths are byte-counted, never copied.
# DNS: the rotated C2 domain is resolved once through @${LAB_RESOLVER:-127.0.0.53}; no session is opened (tag real-ioc-dns-lookup). Exfil POSTs to ${STAGE_HOST:-127.0.0.1}/router; AES-256-CBC stands in for the report's GCM (openssl enc has no GCM).
# Network (NDR, src_host): ngfw_threat_emitter verdicts on the four report sha256s; ngfw_eal_emitter sessions to awqhnjewqjkl.icu on its two report IPs, plus one npm-cache.com session on a documentation IP (no report IP); all on this host's src_*.
# Cloud (CDR, source_ip): cloud_audit_emitter STS AssumeRole from ${EGRESS_IP:-$SRC_IP}; the report says "token endpoints" without naming an API, so the leg carries the host IP only — no report indicator (un-enrichable).
# k8s_audit_emitter is NOT used: the report describes token/kubeconfig theft, not API-server use, and that emitter cannot carry the run host identity.
# The DC points XDR at the npm->node lineage on the runner, NGFW threat/traffic at the same src_host, and CloudTrail at the runner's IP; CR-MP-0028 fuses them.

execution_identity:
  default: runner
  options:
    - runner
    - root

push_supported: true
pull_supported: true

infra_modules_needed:
  - base
  - ndr
  - cdr

validation_methodology: "Multi-Plane Correlation & Indicator-Enriched Detection Accuracy"
methodology_family: "F2"
primary_kpi: "MTTD"
threshold:
  kpi: "MTTD"
  op: "≤"
  value: 900
  unit: "seconds"
success_criteria: |
  On the CI runner the XDR agent records the npm -> sh -> node setup.mjs -> detached runtime
  (math_init.js, _NODE_RUNTIME_INIT=1) lineage, the /proc/<pid>/mem read of a Runner.Worker
  process, the metadata token-endpoint request and credential-file reads from that lineage,
  the .vscode/tasks.json + .claude/settings.json persistence writes, the DNS resolution of
  the published ChainDrop C2 domains and the encrypted POST to /router. The NGFW threat log
  carries WildFire verdicts on the four published ChainDrop sha256s and the traffic log
  carries sessions to the published C2 domain and IPs, both on the runner's src_host;
  CloudTrail records an STS AssumeRole from the runner's IP. Unit 42 enrichment tags the
  hashes, domains and IPs as ChainDrop, and CR-MP-0028 fuses the endpoint, network and cloud
  alerts into ONE incident keyed on src_host within the correlation window.
moat_tier: "LEAD"

correlation_window_seconds: 1800
required_planes_in_incident:
  - EDR
  - NDR
  - CDR
stitching_key: src_host

