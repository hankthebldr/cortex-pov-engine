# CL-STA-1178 "Blinder Tunnel" (Unit 42, 2026-10-06): a fake Dubai Airports recruiter hands an IT
# candidate a C# coding test; opening it in Visual Studio runs a GetFrameworkPaths MSBuild target,
# a renamed vshost (RuntimeBroker.exe) with an AppDomainManager .exe.config (ETW off), a
# MicrosoftRuntime Run key, GitHub contents-API C2, then Blackwood/Chisel reverse SOCKS.
# Endpoint leg (EDR): point at the design-time build -> RuntimeBrokers copy -> renamed-host -> Run key
#   lineage and the GitHub URI shape (sent to ${STAGE_HOST}, never api.github.com).
# Cloud-app leg (CLOUD_APP): synthetic 63-s recurring api.github.com sessions from the same host;
#   un-enrichable by design (GitHub is legitimate, the report's repos are not an IOC the leg carries).
# Network leg (NDR): Chisel tunnel to 91.107.156.29 + WildFire verdicts on the Blackwood hashes, and
#   DNS lookups of the report's Drive/Meet look-alikes via @${LAB_RESOLVER} (one query, no session).
# Every leg carries the run host (src_host); CR-MP-0025 stitches them. EAL legs are POSIX-only.
