# ── Causality contract ──────────────────────────────────────────────────────
# step-01 is the root and runs on the beacon. No process or host binds the lure lookup to
# the sign-in (the lab has no host-to-user binding), so step-02 joins it on time only
# (temporal), which is why CR-3 stays a hunt. Steps 03 and 04 are the same principal's next
# actions in the same tenant (shared_entity), the entity CR-MP-0038 and CR-MP-0038-EXTORT
# join on. No cgo_anchor: the only process here is dig under the beacon.
steps:
  - id: step-01
    name: "The victim's host resolves the Pink lure domains, plus the PANW DNS Security phishing test domain as the NGFW positive control"
    command: |
      : "${LAB_RESOLVER:?set LAB_RESOLVER to a public resolver reached through the lab firewall}"
      dig @${LAB_RESOLVER} passkeyadd.com A +short
      dig @${LAB_RESOLVER} passkeydeploy.com A +short
      dig @${LAB_RESOLVER} deploypasskey.com A +short
      dig @${LAB_RESOLVER} test-phishing.testpanw.com A +short
    identity: direct
    mitre_technique: "T1566.004"
    platforms: ["linux"]
    expected_detections:
      - plane: NDR
        type: XQL
        description: "Positive control: DNS Security on the lab firewall categorised and logged test-phishing.testpanw.com in panw_ngfw_threat_raw, so the NGFW-to-tenant path works. It proves nothing about Pink; if it is empty, the NGFW leg is broken, not missed. Tier-2 verify only"
        ttp_ref: "TTP-2026-0551"
        detection_id: "xql-mp-038-dns-security-logged-the-panw-phishing-test-domain"
        verification_xql: |
          dataset = panw_ngfw_threat_raw
          | filter threat_name contains "test-phishing.testpanw.com" or to_string(threat_id) contains "test-phishing.testpanw.com"
          | fields _time, source_ip, dest_ip, dest_port, sub_type, threat_id, threat_name, action, severity
      - plane: EDR
        type: XQL
        description: "The XDR agent recorded the host resolving a Pink lure domain (dig PROCESS_START with the domain on its command line) in xdr_data. It does not prove that a browser opened the kit. Tier-2 verify only"
        ttp_ref: "TTP-2026-0551"
        detection_id: "xql-mp-038-endpoint-resolved-a-pink-lure-domain"
        verification_xql: |
          dataset = xdr_data
          | filter event_type = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START
          | filter action_process_image_name = "dig"
          | filter action_process_image_command_line contains "passkeyadd.com" or action_process_image_command_line contains "passkeydeploy.com" or action_process_image_command_line contains "deploypasskey.com"
          | comp count() as lookups, values(action_process_image_command_line) as command_lines by agent_hostname, actor_causality_id

  - id: step-02
    name: "Interactive Entra sign-in for the canary from the Pink access IP with a number-matched push approved, then the actor registers its own passkey"
    command: |
      : 'channel eal: SimCore POSTs the Entra sign-in and passkey-registration records (idp_signin_emulator) to the collector; no host runs this command'
    channel: eal
    eal:
      plugin: idp_signin_emulator
      params:
        provider: microsoft
        event_pattern: vishing_passkey_enrollment
        source_ip: "172.93.100.252"
        event_time_offset_seconds: -1500
        target_user: "cortexsim.pink.canary@cortexsim-canary.invalid"
        canary_token: "cortexsim-mp-038-pink"
    identity: direct
    mitre_technique: "T1078.004"
    causality:
      parent_step: step-01
      pivot: temporal
    expected_detections:
      - plane: ITDR
        type: XQL
        description: "An MFA-required Entra sign-in for the canary principal from 172.93.100.252 landed in cortexsim_saas_raw and the query finds it. It does not prove Cortex ITDR raised anything. Tier-2 verify only"
        ttp_ref: "TTP-2026-0551"
        detection_id: "xql-mp-038-entra-sign-in-for-the-canary-from-the-pink-access-ip"
        verification_xql: |
          dataset = cortexsim_saas_raw
          | filter cortexsim_canary = "cortexsim-mp-038-pink"
          | filter userPrincipalName = "cortexsim-mp-038-pink@cortexsim-canary.invalid" and ipAddress = "172.93.100.252"
          | filter createdDateTime != null and authenticationRequirement = "multiFactorAuthentication"
          | fields _time, createdDateTime, userPrincipalName, ipAddress, appDisplayName, clientAppUsed, isInteractive, authenticationRequirement
      - plane: ITDR
        type: XQL
        description: "A passkey registered for the canary from the sign-in's IP within ten minutes of that sign-in, by the records' body times. It does not prove Cortex ITDR raised anything. Tier-2 verify only"
        ttp_ref: "TTP-2026-0551"
        detection_id: "xql-mp-038-passkey-registered-from-the-sign-in-ip-within-ten-minutes"
        verification_xql: |
          dataset = cortexsim_saas_raw
          | filter cortexsim_canary = "cortexsim-mp-038-pink"
          | alter audit_principal = json_extract_scalar(initiatedBy, "$.user.userPrincipalName"), audit_ip = json_extract_scalar(initiatedBy, "$.user.ipAddress")
          | alter principal = coalesce(userPrincipalName, audit_principal), source_ip = coalesce(ipAddress, audit_ip)
          | filter principal = "cortexsim-mp-038-pink@cortexsim-canary.invalid"
          | alter signin_at = if(createdDateTime != null and authenticationRequirement = "multiFactorAuthentication", parse_timestamp("%Y-%m-%dT%H:%M:%E*S%Ez", createdDateTime), null), passkey_at = if(activityDisplayName = "User registered security info" and resultReason contains "passkey", parse_timestamp("%Y-%m-%dT%H:%M:%E*S%Ez", activityDateTime), null)
          | comp min(signin_at) as first_signin_at, min(passkey_at) as passkey_registered_at by principal, source_ip
          | filter first_signin_at != null and passkey_registered_at != null
          | alter passkey_after_signin_seconds = timestamp_diff(passkey_registered_at, first_signin_at, "SECOND")
          | filter passkey_after_signin_seconds >= 0 and passkey_after_signin_seconds <= 600

  - id: step-03
    name: "SharePoint and OneDrive download burst by the canary from the Pink access IP, through Microsoft Graph and python-requests"
    command: |
      : 'channel eal: SimCore POSTs the SharePoint and OneDrive download records (m365_activity_emitter storage_exfiltration) to the collector; no host runs this command'
    channel: eal
    eal:
      plugin: m365_activity_emitter
      params:
        event_pattern: storage_exfiltration
        source_ip: "172.93.100.252"
        user_agents:
          - "Microsoft.Graph.Client/5.62.0"
          - "python-requests/2.28.1"
          - "python-requests/2.33.1"
        storage_targets:
          - sharepoint
          - onedrive
        event_time_offset_seconds: -1200
        target_user: "cortexsim.pink.canary@cortexsim-canary.invalid"
        canary_token: "cortexsim-mp-038-pink"
    identity: direct
    mitre_technique: "T1530"
    causality:
      parent_step: step-02
      pivot: shared_entity
    expected_detections:
      - plane: CLOUD_APP
        type: XQL
        description: "A download burst by the canary from 172.93.100.252 across both SharePoint and OneDrive (at least five FileDownloaded / FileSyncDownloadedFull records) landed in cortexsim_saas_raw. It does not prove a Cortex SaaS detector fired. Tier-2 verify only"
        ttp_ref: "TTP-2026-0551"
        detection_id: "xql-mp-038-sharepoint-and-onedrive-download-burst-from-the-pink-ip"
        verification_xql: |
          dataset = cortexsim_saas_raw
          | filter cortexsim_canary = "cortexsim-mp-038-pink"
          | filter UserId = "cortexsim-mp-038-pink@cortexsim-canary.invalid" and ClientIP = "172.93.100.252"
          | filter Workload in ("SharePoint", "OneDrive") and Operation in ("FileDownloaded", "FileSyncDownloadedFull")
          | comp count() as downloads, count_distinct(Workload) as workloads, count_distinct(ObjectId) as objects by UserId, ClientIP
          | filter downloads >= 5 and workloads = 2
      - plane: CLOUD_APP
        type: XQL
        description: "Interactive-user file access by the canary through both the Graph SDK and python-requests user agents, the published exfiltration clients. It does not prove a Cortex SaaS detector fired. Tier-2 verify only"
        ttp_ref: "TTP-2026-0551"
        detection_id: "xql-mp-038-file-access-through-graph-sdk-and-python-requests-user-agents"
        verification_xql: |
          dataset = cortexsim_saas_raw
          | filter cortexsim_canary = "cortexsim-mp-038-pink"
          | filter UserId = "cortexsim-mp-038-pink@cortexsim-canary.invalid" and to_string(UserType) = "0"
          | filter Workload in ("SharePoint", "OneDrive") and Operation in ("FileDownloaded", "FileSyncDownloadedFull")
          | filter UserAgent in ("Microsoft.Graph.Client/5.62.0", "python-requests/2.28.1", "python-requests/2.33.1")
          | alter client_family = if(UserAgent contains "Microsoft.Graph.Client", "graph_sdk", "python_requests")
          | comp count() as file_ops, count_distinct(client_family) as client_families, count_distinct(UserAgent) as user_agents by UserId, ClientIP
          | filter client_families = 2
      - plane: ANALYTICS
        type: Correlation
        description: "Correlation CR-MP-0038 (operator-installed, Medium, scheduled every 10 min over 1 h, principal mapped to User Name, untested): on one principal and one source IP, an MFA sign-in, then a passkey registration, then a SharePoint and OneDrive download burst, inside 3600 s by body times. Verified here by the rule's own XQL; it does not prove XSIAM grouped anything into a case"
        ttp_ref: "TTP-2026-0551"
        detection_id: "CR-MP-0038"
        verification_xql: |
          dataset = cortexsim_saas_raw
          | filter cortexsim_canary = "cortexsim-mp-038-pink"
          | alter audit_principal = json_extract_scalar(initiatedBy, "$.user.userPrincipalName"), audit_ip = json_extract_scalar(initiatedBy, "$.user.ipAddress")
          | alter principal = coalesce(userPrincipalName, audit_principal, UserId), source_ip = coalesce(ipAddress, audit_ip, ClientIP)
          | filter principal = "cortexsim-mp-038-pink@cortexsim-canary.invalid"
          | alter stage = if(createdDateTime != null and authenticationRequirement = "multiFactorAuthentication", "signin", if(activityDisplayName = "User registered security info", "passkey", if(Workload in ("SharePoint", "OneDrive") and Operation in ("FileDownloaded", "FileSyncDownloadedFull"), "download", "other")))
          | filter stage != "other"
          | alter stage_at = parse_timestamp("%Y-%m-%dT%H:%M:%E*S%Ez", coalesce(createdDateTime, activityDateTime, CreationTime))
          | alter signin_at = if(stage = "signin", stage_at, null), passkey_at = if(stage = "passkey", stage_at, null), download_at = if(stage = "download", stage_at, null)
          | comp min(signin_at) as first_signin_at, min(passkey_at) as first_passkey_at, min(download_at) as first_download_at, count_distinct(stage) as stages, count() as records by principal, source_ip
          | filter stages = 3
          | alter passkey_after_signin_seconds = timestamp_diff(first_passkey_at, first_signin_at, "SECOND"), download_after_passkey_seconds = timestamp_diff(first_download_at, first_passkey_at, "SECOND"), chain_seconds = timestamp_diff(first_download_at, first_signin_at, "SECOND")
          | filter passkey_after_signin_seconds >= 0 and download_after_passkey_seconds >= 0 and chain_seconds <= 3600

  - id: step-04
    name: "The compromised account sends the extortion notice to internal recipients and posts in Teams, from the residential proxy"
    command: |
      : 'channel eal: SimCore POSTs the Exchange Send and Teams MessageSent records (m365_activity_emitter internal_extortion_notice) to the collector; no host runs this command'
    channel: eal
    eal:
      plugin: m365_activity_emitter
      params:
        event_pattern: internal_extortion_notice
        source_ip: "96.232.20.66"
        event_time_offset_seconds: -300
        target_user: "cortexsim.pink.canary@cortexsim-canary.invalid"
        canary_token: "cortexsim-mp-038-pink"
    identity: direct
    mitre_technique: "T1657"
    causality:
      parent_step: step-03
      pivot: shared_entity
    expected_detections:
      - plane: CLOUD_APP
        type: XQL
        description: "An Exchange Send from the canary's mailbox to at least five internal recipients from 96.232.20.66 landed in cortexsim_saas_raw. It does not prove a Cortex SaaS detector fired. Tier-2 verify only"
        ttp_ref: "TTP-2026-0551"
        detection_id: "xql-mp-038-internal-fan-out-send-from-the-extortion-ip"
        verification_xql: |
          dataset = cortexsim_saas_raw
          | filter cortexsim_canary = "cortexsim-mp-038-pink"
          | filter UserId = "cortexsim-mp-038-pink@cortexsim-canary.invalid" and ClientIP = "96.232.20.66"
          | filter Workload = "Exchange" and Operation = "Send"
          | alter recipients = to_integer(to_string(recipientCount))
          | filter recipients >= 5
          | fields _time, CreationTime, UserId, ClientIP, Operation, recipients, ObjectId
      - plane: CLOUD_APP
        type: XQL
        description: "At least two Teams MessageSent records by the canary from 96.232.20.66 landed in cortexsim_saas_raw. It does not prove a Cortex SaaS detector fired. Tier-2 verify only"
        ttp_ref: "TTP-2026-0551"
        detection_id: "xql-mp-038-teams-messages-by-the-canary-from-the-extortion-ip"
        verification_xql: |
          dataset = cortexsim_saas_raw
          | filter cortexsim_canary = "cortexsim-mp-038-pink"
          | filter UserId = "cortexsim-mp-038-pink@cortexsim-canary.invalid" and ClientIP = "96.232.20.66"
          | filter Workload = "MicrosoftTeams" and Operation = "MessageSent"
          | comp count() as messages, count_distinct(MessageId) as distinct_messages by UserId, ClientIP
          | filter messages >= 2
      - plane: ANALYTICS
        type: Correlation
        description: "Correlation CR-MP-0038-EXTORT (operator-installed, Medium, scheduled every 10 min over 1 h, UserId mapped to User Name, untested): on one principal, the last SharePoint or OneDrive download, then the first internal Exchange Send or Teams message, inside 3600 s by body time. Verified here by the rule's own XQL; it does not prove XSIAM grouped anything into a case"
        ttp_ref: "TTP-2026-0551"
        detection_id: "CR-MP-0038-EXTORT"
        verification_xql: |
          dataset = cortexsim_saas_raw
          | filter cortexsim_canary = "cortexsim-mp-038-pink"
          | filter UserId = "cortexsim-mp-038-pink@cortexsim-canary.invalid"
          | alter stage = if(Workload in ("SharePoint", "OneDrive") and Operation in ("FileDownloaded", "FileSyncDownloadedFull"), "download", if(Workload = "Exchange" and Operation = "Send", "extortion_mail", if(Workload = "MicrosoftTeams" and Operation = "MessageSent", "extortion_teams", "other")))
          | filter stage != "other"
          | alter stage_at = parse_timestamp("%Y-%m-%dT%H:%M:%E*S%Ez", CreationTime)
          | alter download_at = if(stage = "download", stage_at, null), extortion_at = if(stage in ("extortion_mail", "extortion_teams"), stage_at, null)
          | comp max(download_at) as last_download_at, min(extortion_at) as first_extortion_at, count_distinct(stage) as stages, count_distinct(ClientIP) as source_ips by UserId
          | filter last_download_at != null and first_extortion_at != null
          | alter extortion_after_download_seconds = timestamp_diff(first_extortion_at, last_download_at, "SECOND")
          | filter extortion_after_download_seconds >= 0 and extortion_after_download_seconds <= 3600

cleanup:
  commands:
    - "echo '[CortexSim] SIM-MP-038 cleanup: nothing to remove; step-01 only ran DNS lookups and steps 02-04 wrote nothing on this host'"

