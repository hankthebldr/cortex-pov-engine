# Pink / CL-CRI-1147 (Unit 42 timely threat intelligence, 2026-06-03): a new extortion brand
# phones a user as internal IT, takes the password and an approved push on a fake Microsoft
# passkey page, registers its own passkey on the real Entra account, pulls SharePoint and
# OneDrive through Microsoft Graph and python-requests, then extorts the company from the
# victim's own mailbox and Teams. No malware. The source is the TTI file in
# PaloAltoNetworks/Unit42-Threat-Intelligence-Article-Information (there is no blog post).
# Okta Threat Intelligence (2026-07-05) describes the kit; it shapes step-02 only and is
# never an indicator source.
#
# ONE SimCore run on today's lab doors (spec 2026-11-11-pink-cl-cri-1147-chain-design.md):
#   step-01 (agent, identity direct) runs on the enrolled beacon host. In the lab that is
#     pov-target-01 (Ubuntu), standing in for "a host that resolved the lure"; no Windows or
#     macOS victim is claimed. It resolves the three Pink lure domains and PANW's DNS
#     Security phishing test domain (the positive control) with bare
#     `dig @${LAB_RESOLVER} <domain> A +short` lines: no fetch, no session to actor
#     infrastructure. LAB_RESOLVER is a public resolver reached THROUGH the PA-440 (not
#     Pi-hole, which would hide the source and may block these names), so the query crosses
#     the firewall from a known host. It has no default: the step stops if it is unset.
#   step-02..04 (channel eal) run inside SimCore at launch, never on the beacon. They POST
#     shape-true Entra sign-in and passkey-registration, M365 download, Exchange Send and
#     Teams records to the operator's HTTP log collector (Vendor cortexsim, Product saas,
#     dataset cortexsim_saas_raw), resolved from the instance's collector targets; no
#     collector_url is written here. Delivery goes live only with
#     consent.simulation_authorized, a non-blank authorized_by and a keyed target for every
#     eal step; otherwise the steps run dry and their rows leave the denominator. The records
#     are back-dated (event_time_offset_seconds) so the body times tell the minutes-long
#     story: sign-in at -25 min, passkey 90 s later, downloads from -20 min, extortion send
#     and Teams at -5 min. Offsets and volumes are inferred; neither source publishes them.
#     The command on an eal step is a descriptive no-op that no host runs.
#
# What a green run proves. Every declared row is a repo-authored XQL read back by Tier-2
# verify (POST /api/runs/{id}/verify). A collector row proves the record landed and the
# query finds it, NOT that a Cortex detector fired: no built-in BIOC, ABIOC or Analytics
# detector reads a custom collector dataset. If D1 (the NGFW positive control) is empty,
# the NGFW path is broken and nothing on that leg is evidence about Pink. There is no
# primary_kpi and no threshold: a missing row is fail, and all rows found clamps to
# not_applicable ("evidence, not a scored pass") because TC-ITDR-03/02 carry no measurable
# threshold. tenant-verified stays 0.
#
# Hunts, not expectations (card purpose: hunt): D2 (DNS Security logged a Pink lure domain;
# the domains may be re-categorised or gone), D4 (the Linux agent records DNS query names;
# unverified capability) and CR-3 (lure resolution within 30 min of the sign-in; the lab
# has no host-to-user binding).
#
# Indicators. 185.178.208.153 (the phishing host) is out of band: the lookup may no longer
# return it, so nothing guarantees it on the wire. 96.232.20.66 is a residential proxy
# that may belong to an unwitting user: it appears only inside record bodies, nothing is
# sent to it, and it must never go into an EDL or block rule from this scenario. The three
# published user agents appear only in step-03's record bodies, never on SimCore's own
# requests.
#
# Known limits. Queries scope on the fixed canary (cortexsim_canary =
# cortexsim-mp-038-pink, principal cortexsim-mp-038-pink@cortexsim-canary.invalid), so two
# runs of this scenario with overlapping windows can satisfy each other's rows. Collector
# field names come from the emitters' records on dev, not from a stored collector row (lab
# prerequisite L-1 is not done).
scenario_id: SIM-MP-038
