# Push off: steps 02-04 need SimCore at run time to POST the collector records, which a
# self-contained push bundle forbids.
push_supported: false
pull_supported: true

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
# No primary_kpi and no threshold (spec §7). An MTTD threshold would hold the run at
# pending forever: Tier-2 verify never sets observed_at, so MTTD is never measured here.
validation_methodology: "Collector Signal Injection with Tier-2 Verification, plus Endpoint and NGFW DNS Telemetry"
methodology_family: "F1"
success_criteria: |
  Run as one pull-mode SimCore run with consent.simulation_authorized and a non-blank
  authorized_by, against an instance whose collector target (kind xsiam_http_collector,
  Vendor cortexsim, Product saas) has a key, is bound to idp_signin_emulator and
  m365_activity_emitter, and preflights to accepted. The run's channel_dispatch ledger
  shows steps 02-04 delivered (2xx only); step-01 completes rc 0 on the beacon host.
  Then POST /api/runs/{id}/verify against the tenant's xsiam_tenant credential (XQL
  granted). Ten declared rows each return at least one row: D1 (DNS Security logged the
  PANW phishing test domain: the NGFW path works), D3 (the XDR agent recorded dig
  resolving a Pink lure domain), D5 and D6 (Entra sign-in for the canary from the Pink
  access IP, and a passkey registered from that IP within ten minutes), D7 and D8 (a
  SharePoint and OneDrive download burst from that IP, through the Graph SDK and
  python-requests user agents), D9 and D10 (an internal fan-out Send and Teams messages
  from the extortion IP), and the two chain queries CR-MP-0038 and CR-MP-0038-EXTORT.
  A hit on a collector row proves the record landed and the query finds it; it does not
  prove a Cortex detector fired. Any missing row scores fail; all rows found reads
  not_applicable (evidence, not a scored pass). The hunts D2, D4 and CR-3 are run by hand
  and recorded in the lab evidence doc, never scored.
moat_tier: "LEAD"

correlation_window_seconds: 3600
required_planes_in_incident:
  - ITDR
  - CLOUD_APP
stitching_key: user_principal

