# CL-STA-1020 (Unit 42, 2025-07-14): HazyBeacon is mscorsvc.dll side-loaded by mscorsvw.exe from C:\Windows\assembly\,
# kept alive by service msdnetsvc, beaconing to an AWS Lambda function URL; it pulls igfx.exe (collector), 7z.exe and
# Google Drive / Dropbox uploaders into C:\ProgramData\, zips tariff-themed documents per host, splits them, tries to
# upload, then deletes the archives and payloads. ENDPOINT (EDR, Windows primary, linux variants): inert DLL stand-in
# beside a copied signed mscorsvw.exe, a demand-start msdnetsvc service, the beacon / upload HTTP shapes against
# ${STAGE_HOST:-127.0.0.1}, a real per-host zip + split of lab decoys and the real deletion. NETWORK (NDR): a WildFire
# threat log per downloaded tool carrying the report sha256 (enrichable) plus an EAL recurring-comms beacon on the preset
# destination: the report redacts the Lambda URL, so that record is UN-ENRICHABLE and stitches on src_host only.
# EAL legs run from a Linux jumpbox: set TARGET_IP / TARGET_USER and TARGET_HOST = the endpoint's exact agent_hostname
# (case included) so the src_host join holds (defaults read the run host). No cloud leg: the Lambda URL and Drive/Dropbox
# accounts are actor-side, outside the victim's cloud audit. DC points at: side-load/msdnetsvc BIOCs + beacon ABIOC on the
# endpoint, WildFire hash hits in panw_ngfw_threat_raw, CR-MP-0026 joining both on src_host. No adversary host contacted.
