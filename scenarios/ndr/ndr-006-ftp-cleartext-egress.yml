scenario_id: SIM-NDR-006
name: "NDR — FTP Cleartext Egress + Credentials EAL Validation"
version: "1.0"
status: active

plane: NDR
detection_types:
  - BIOC
  - XQL
  - IOC

uc_ref: UCS-NDR-06
tc_ref: TC-NDR-06
uc_name: "FTP App-ID + Cleartext Credential Detection"
tc_name: "Outbound FTP USER/PASS + Data Egress via STOR"

mitre_tactic: "TA0011"
mitre_tactic_name: "Command and Control"
mitre_technique: "T1071"
mitre_technique_name: "Application Layer Protocol"
additional_techniques:
  - "T1048.003"  # Exfiltration Over Unencrypted Non-C2 Protocol

threat_report: "Unit42 - Cleartext Protocol Abuse for Exfiltration"
threat_report_url: "https://unit42.paloaltonetworks.com/"

execution_identity:
  default: container-runtime
  options:
    - container-runtime
    - root

push_supported: true
pull_supported: true

infra_modules_needed:
  - base
  - ndr

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
# Rolled out per the S-07 per-plane convention
# (docs/uc_tc_mapping/scenario-methodology-defaults.md). Defaults are not
# fabricated KPIs — they map this plane to the methodology family its
# detection shape already belongs to in the v2.0 master methodology.
validation_methodology: "Network Signal Injection & Detection Accuracy"
methodology_family: "F1"
primary_kpi: "MTTD"
threshold:
  kpi: "MTTD"
  op: "≤"
  value: 300
  unit: "seconds"
success_criteria: |
  The per-protocol egress signal injected by this scenario produces the
  expected NGFW App-ID / XSIAM detection within the MTTD budget. Verifier
  counts matching sessions in dataset=pan_ngfw_traffic and measures
  emit→alert latency.
moat_tier: "LEAD"

external_tools:
  - name: cortexsim-eal-cli
    source: "https://github.com/hankthebldr/cortex-pov-engine"
    type: script
    install_inline: false

# ── Causality Group Owner ───────────────────────────────────────────────────
# The outbound FTP session is OWNED by the exfil client process, not the
# beacon. The EAL runner (python3) opens the control channel and issues the
# cleartext USER/PASS + STOR commands, so it is the process that owns the
# egress causality. The reachability pre-flight and the live session are two
# observations of the SAME network flow to the sinkhole (see step-02 pivot).
cgo_anchor:
  image_name: "python3"
  primary_username: "root"

steps:
  - id: step-01
    name: "Stand up sinkhole FTP listener inside lab CIDR"
    command: |
      # Operator must pre-deploy an FTP sinkhole on 10.50.0.42:21 inside the
      # lab CIDR (any FTP server in passive mode works — pyftpdlib is the
      # canonical reference). Confirm the control port is reachable:
      nc -zv 10.50.0.42 21 || echo "[CortexSim] sinkhole reachable check (best-effort)"
    identity: container-runtime
    mitre_technique: "T1071"
    platforms: ["linux"]
    expected_detections:
      - plane: NDR
        type: XQL
        description: "Pre-flight: FTP sinkhole reachable on port 21"
        ttp_ref: "TTP-2026-0061"
        detection_id: xql-pre-flight-ftp-sinkhole-reachable-on-port-21

  - id: step-02
    name: "Drive a cleartext FTP session with USER/PASS + STOR data egress"
    command: |
      cat > /tmp/ftp-egress-live.yml <<'YML'
      campaign_id: CMP-NDR-006
      name: "NDR validation — FTP cleartext credential + STOR egress"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - 10.50.0.0/24
      dry_run: false
      tags: [ndr, ftp, eal, cleartext, exfiltration]
      steps:
        - step_id: step-01
          plugin: ftp_egress
          params:
            target_host: "10.50.0.42"
            target_port: 21
            username: "cortexsim"
            password: "cortexsim-lab"
            iterations: 3
            sleep_seconds: 8
            send_stor: true
            stor_bytes: 4096
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/ftp-egress-live.yml --live
    identity: container-runtime
    mitre_technique: "T1071"
    platforms: ["linux"]
    causality:
      # step-01 (reachability probe) and this live FTP session are the two ends
      # of ONE outbound flow to the sinkhole 10.50.0.42:21 — same 5-tuple
      # destination. The edge is a network_session join, not a process fork:
      # the detections are pure NGFW/App-ID network telemetry (no process actor
      # fields), so the graph stitches them by the shared FTP session.
      parent_step: step-01
      pivot: network_session
    expected_detections:
      - plane: NDR
        type: XQL
        description: "NGFW App-ID — FTP identified on outbound session from non-admin endpoint"
        ttp_ref: "TTP-2026-0061"
        detection_id: xql-ngfw-app-id-ftp-outbound-session-from-non-admin-endpoint
      - plane: NDR
        type: IOC
        description: "NGFW EAL — cleartext FTP credentials observed (USER + PASS commands in session)"
        ttp_ref: "TTP-2026-0061"
        detection_id: ioc-user-agent-ftp-cleartext-credentials-user-pass
      - plane: NDR
        type: BIOC
        description: "NGFW EAL — outbound file transfer via FTP STOR command + 4 KB data payload"
        ttp_ref: "TTP-2026-0061"
        detection_id: bioc-ngfw-eal-outbound-ftp-stor-file-transfer-with-data-payload

cleanup:
  commands:
    - "rm -f /tmp/ftp-egress-live.yml"

