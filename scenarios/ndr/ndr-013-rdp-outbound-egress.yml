- base
- ndr
validation_methodology: Network Signal Injection & Detection Accuracy
methodology_family: F1
primary_kpi: MTTD
threshold:
  kpi: MTTD
  op: ≤
  value: 300
  unit: seconds
success_criteria: 'The per-protocol egress signal injected by this scenario produces the

  expected NGFW App-ID / XSIAM detection within the MTTD budget. Verifier

  counts matching sessions in dataset=pan_ngfw_traffic and measures

  emit→alert latency.

  '
moat_tier: LEAD
external_tools:
- name: cortexsim-eal-cli
  source: https://github.com/hankthebldr/cortex-pov-engine
  type: script
  install_inline: false
steps:
- id: step-01
  name: Open outbound ms-rdp sessions (real X.224 Connection Requests) to the sinkhole
  command: python3 -m core.eal_simulator.run_campaign --campaign /tmp/rdp-egress-live.yml
  identity: www-data
  mitre_technique: T1021.001
  eal_plugins:
  - plugin: rdp_egress
    params:
      target_host: 10.50.0.42
      target_port: 3389
      mstshash_cookie: svc-rdp
      requested_protocols: 2
      iterations: 5
  expected_detections:
  - plane: NDR
    type: Analytics
    description: NGFW/NDR analytics flag the anomalous outbound/lateral ms-rdp egress
    ttp_ref: TTP-2026-0189
    detection_id: xql-outbound-ms-rdp-egress-on-the-ngfw-traffic-feed
  - plane: NDR
    type: BIOC
    description: Outbound RDP from a non-server endpoint on dataset=panw_ngfw_traffic_raw
    ttp_ref: TTP-2026-0189
    detection_id: bioc-ndr-013-outbound-rdp-from-a-non-server-endpoint
cleanup:
  commands:
  - rm -f /tmp/ssh-egress-live.yml
