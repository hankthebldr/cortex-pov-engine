scenario_id: SIM-NDR-002
name: "NDR — DNS Tunneling EAL Validation"
version: "1.0"
status: active

plane: NDR
detection_types:
  - BIOC
  - XQL

uc_ref: UCS-NDR-02
tc_ref: TC-NDR-03
tc_refs:
  - TC-NDR-03
  - TC-NDR-04
pov_scenario_id: POV-SC-008
uc_name: "Network Detection & Response"
tc_name: "Validate network analytics engine filters traffic noise via EAL"

mitre_tactic: "TA0010"
mitre_tactic_name: "Exfiltration"
mitre_technique: "T1048.003"
mitre_technique_name: "Exfiltration Over Unencrypted Non-C2 Protocol"
additional_techniques:
  - technique: "T1572"
    name: "Protocol Tunneling"

threat_report: "Unit42 - DNS Tunneling Tradecraft Survey"
threat_report_url: "https://unit42.paloaltonetworks.com/dns-tunneling/"

execution_identity:
  default: container-runtime
  options:
    - container-runtime
    - root

push_supported: true
pull_supported: true

infra_modules_needed:
  - base
  - ndr
  - tim

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
# Rolled out per the S-07 per-plane convention
# (docs/uc_tc_mapping/scenario-methodology-defaults.md). Defaults are not
# fabricated KPIs — they map this plane to the methodology family its
# detection shape already belongs to in the v2.0 master methodology.
validation_methodology: "Network Signal Injection & Detection Accuracy"
methodology_family: "F1"
primary_kpi: "MTTD"
threshold:
  kpi: "MTTD"
  op: "≤"
  value: 300
  unit: "seconds"
success_criteria: |
  The per-protocol egress signal injected by this scenario produces the
  expected NGFW App-ID / XSIAM detection within the MTTD budget. Verifier
  counts matching sessions in dataset=pan_ngfw_traffic and measures
  emit→alert latency.
moat_tier: "LEAD"

# ── Stitch contract (endpoint↔network) ──────────────────────────────────────
# The TXT-burst step raises the ANALYTICS stitch that ties the DNS-exfil network
# signal back to the originating endpoint's implant process lineage. Declare the
# stitch key (the source host that owns both ends) and the window so XSIAM folds
# the NDR DNS-exfil detections and the ANALYTICS lineage correlation into ONE
# incident rather than separate alerts.
correlation_window_seconds: 300
required_planes_in_incident:
  - NDR
  - ANALYTICS
stitching_key: src_host

# ── Causality contract ──────────────────────────────────────────────────────
# The compromised host's foothold is modeled as the EAL-simulator container: the
# containerd-shim runtime OWNS the python3 tunnel-generator process tree and is
# the Causality Group Owner — NOT the synthetic beacon. The describe → A-burst →
# TXT-burst steps are discrete python3 execs in the same container/campaign (no
# direct fork), so they thread on the shared simulator/source-host entity.
cgo_anchor:
  image_name: "containerd-shim"
  primary_username: "container-runtime"

external_tools:
  - name: cortexsim-eal-cli
    source: "https://github.com/hankthebldr/cortex-pov-engine"
    type: script
    install_inline: false

steps:
  - id: step-01
    name: "Inspect DNS tunnel plugin params schema"
    command: |
      python3 -m scripts.eal_simulator.cli describe dns_tunnel_exfil
    identity: container-runtime
    mitre_technique: "T1572"
    platforms: ["linux", "container"]
    expected_detections:
      - plane: NDR
        type: XQL
        description: "Pre-flight: dns_tunnel_exfil plugin exposes expected params schema"
        ttp_ref: "TTP-2026-0051"
        detection_id: xql-pre-flight-dns-tunnel-exfil-plugin-exposes-expected-params-schema

  - id: step-02
    name: "Launch live DNS tunneling campaign — A queries with high-entropy labels"
    command: |
      cat > /tmp/dns-tunnel-live.yml <<'YML'
      campaign_id: CMP-NDR-002
      name: "NDR validation — DNS tunnel live"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - testmynids.org
      dry_run: false
      tags: [ndr, dns-tunnel, eal]
      steps:
        - step_id: step-01
          plugin: dns_tunnel_exfil
          params:
            base_domain: testmynids.org
            chunks: 30
            chunk_size_bytes: 24
            sleep_seconds: 1.0
            encoding: base32
            query_type: A
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/dns-tunnel-live.yml --live
    identity: container-runtime
    mitre_technique: "T1048.003"
    platforms: ["linux", "container"]
    causality:
      parent_step: step-01
      pivot: process_lineage
    expected_detections:
      - plane: NDR
        type: XQL
        description: "NGFW EAL — anomalous DNS query volume from single source"
        ttp_ref: "TTP-2026-0051"
        detection_id: xql-ngfw-eal-anomalous-dns-query-volume-from-single-source
      - plane: NDR
        type: XQL
        description: "NGFW EAL — high-entropy DNS labels (base32 character profile)"
        ttp_ref: "TTP-2026-0051"
        detection_id: xql-ngfw-eal-high-entropy-dns-labels-base32-character-profile
      - plane: NDR
        type: BIOC
        description: "NGFW EAL — long FQDN exceeding host baseline"
        ttp_ref: "TTP-2026-0051"
        detection_id: bioc-ngfw-eal-long-fqdn-exceeding-host-baseline

  - id: step-03
    name: "Repeat with TXT query type to exercise TXT-burst analytics"
    command: |
      cat > /tmp/dns-tunnel-txt.yml <<'YML'
      campaign_id: CMP-NDR-002
      name: "NDR validation — DNS tunnel TXT"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - testmynids.org
      dry_run: false
      tags: [ndr, dns-tunnel, eal]
      steps:
        - step_id: step-01
          plugin: dns_tunnel_exfil
          params:
            base_domain: testmynids.org
            chunks: 25
            chunk_size_bytes: 32
            sleep_seconds: 0.5
            encoding: base64
            query_type: TXT
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/dns-tunnel-txt.yml --live
    identity: container-runtime
    mitre_technique: "T1572"
    platforms: ["linux", "container"]
    causality:
      parent_step: step-02
      pivot: process_lineage
    expected_detections:
      - plane: NDR
        type: XQL
        description: "NGFW EAL — TXT query burst from single host"
        ttp_ref: "TTP-2026-0051"
        detection_id: xql-ngfw-eal-txt-query-burst-from-single-host
      - plane: ANALYTICS
        type: XQL
        description: "XSIAM stitching — DNS exfil + endpoint process lineage correlated"
        ttp_ref: "TTP-2026-0051"
        detection_id: xql-xsiam-stitching-dns-exfil-endpoint-process-lineage-correlated

cleanup:
  commands:
    - "rm -f /tmp/dns-tunnel-live.yml /tmp/dns-tunnel-txt.yml"

author: "Henry Reed"
created: "2026-05-05"
last_updated: "2026-05-05"
tags:
  - ndr
  - eal
  - dns-tunnel
  - exfiltration
