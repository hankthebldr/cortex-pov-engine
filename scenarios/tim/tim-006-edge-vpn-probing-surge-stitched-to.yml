scenario_id: SIM-TIM-006
name: "Edge-VPN Probing Surge Attributed to a TIM Scanning-Infra Feed — CVE-2026-0257 Exploit Precursor"
version: "1.0"
status: active

plane: TIM
detection_types:
  - IOC
  - BIOC
  - XQL
  - Correlation

uc_ref: UCS-XTI-04
tc_ref: TC-XTI-07
tc_refs:
  - TC-XTI-07
  - TC-XTI-03
pov_scenario_id: POV-SC-079
uc_name: "Extended Threat Intelligence (XTI)"
tc_name: "Validate automatic attribution and campaign context attaches to a live case"

mitre_tactic: "TA0043"
mitre_tactic_name: "Reconnaissance"
mitre_technique: "T1595.002"
mitre_technique_name: "Active Scanning: Vulnerability Scanning"
additional_techniques:
  - technique: "T1595.001"
    name: "Active Scanning: Scanning IP Blocks"
  - technique: "T1590"
    name: "Gather Victim Network Information"
  - technique: "T1133"
    name: "External Remote Services"

threat_report: "Unit 42 — Active Exploitation of PAN-OS CVE-2026-0257 (GlobalProtect Authentication Bypass)"
threat_report_url: "https://unit42.paloaltonetworks.com/active-exploitation-of-pan-os-cve-2026-0257/"

execution_identity:
  default: root
  options:
    - root
    - nobody
    - www-data

push_supported: true
pull_supported: true

# ── v2.0 KPI / Methodology Metadata ─────────────────────────────────────────
# F3 Asset Discovery & Inventory Coverage: the correlation attributes an inbound
# scanner to a DISCOVERED edge asset (the org's exposed GlobalProtect portal in
# the Cortex ASM inventory). The emphasis is the correlation TERMINAL — a
# low-signal probe is elevated to an attributed CVE-2026-0257 exploit precursor
# only when the TIM feed match, the NGFW portal-probing surge, and the ASM
# edge-asset finding fuse on source IP into ONE incident.
validation_methodology: "TIM-Attributed Recon-to-Exploit Correlation"
methodology_family: "F3"
primary_kpi: "Cross-Source Correlation Rate"
threshold:
  kpi: "Cross-Source Correlation Rate"
  op: "≥"
  value: 80
  unit: "%"
success_criteria: |
  The TIM feed lists the inbound source IP/ASN as CVE-2026-0257 GlobalProtect
  scanning infrastructure, the NGFW records a probing surge from that same source
  against the org's exposed GlobalProtect prelogin endpoints (wide sweep, few
  gateway-connected sessions), and Cortex ASM has the exposed portal in its
  edge-asset inventory. The terminal correlation (CR-TIM-0006) joins the feed
  match and the probing surge on source IP, asserts the reconnaissance preceded
  any auth-bypass on the matched edge asset, and raises ONE attributed
  exploit-precursor incident spanning TIM + ASM + NDR — a low-signal probe
  turned into an actionable, pre-exploit alert.
moat_tier: "MOAT"
correlation_window_seconds: 3600
required_planes_in_incident:
  - TIM
  - ASM
  - NDR
stitching_key: src_ip

# ── Causality contract ──────────────────────────────────────────────────────
# This scenario models INBOUND adversary scanning; CortexSim drives the probing
# from an authorised operator host. The CGO is the operator's recon shell (bash)
# that forks the portal-probe curl loop — NOT the cortexsim-agent beacon. The
# chain is stitched on the SHARED ATTACKER ORIGIN (one source IP → the exposed
# GlobalProtect portal), which is exactly the join key CR-TIM-0006 keys on. The
# TIM feed lookup (step-01) is the root; the probing surge (step-02) continues
# from the same origin (shared_entity); the correlation terminal (step-03) fuses
# the feed match, the NGFW surge, and the ASM finding on that source IP
# (shared_entity, no direct process fork).
cgo_anchor:
  image_name: "bash"
  primary_username: "root"

required_content:
  - repo: "PaloAltoNetworks/mocktaxii"

infra_modules_needed:
  - base
  - tim
  - ndr
  - asm

external_tools: []

steps:
  - id: step-01
    name: "Confirm the TIM feed lists the CVE-2026-0257 GlobalProtect scanning infrastructure"
    command: |
      # Read-only feed lookup: confirm the TIM feed (mocktaxii → threat_intel)
      # carries the CVE-2026-0257 GlobalProtect scanning-infrastructure source
      # IPs/ASN tagged as adversary scanning infrastructure BEFORE we generate
      # the matching inbound probe.
      FEED="${TIM_FEED_URL:-http://localhost:9000/taxii2/}"
      curl -sf "${FEED}" -H 'Accept: application/taxii+json;version=2.1' | jq -e '.api_roots | length >= 1' \
        || echo '[*] TIM feed reachability check (mocktaxii)'
      echo '[*] Expect threat_intel to carry 23.128.228.6, 185.195.232.139 et al. tagged scanning-infrastructure / cve-2026-0257'
    identity: root
    mitre_technique: "T1595.002"
    platforms: ["linux"]
    expected_detections:
      - plane: TIM
        type: XQL
        description: "TIM feed attribution — the inbound source IP/ASN is listed as CVE-2026-0257 GlobalProtect scanning infrastructure in threat_intel"
        ttp_ref: "TTP-2026-0150"
        detection_id: xql-tim-feed-attribution-globalprotect-scanning-infrastructure-match
      - plane: TIM
        type: IOC
        description: "TIM IOC — inbound source IP matches a planted CVE-2026-0257 GlobalProtect scanning-infrastructure indicator"
        ttp_ref: "TTP-2026-0150"
        detection_id: ioc-ipv4-23-128-228-6

  - id: step-02
    name: "GlobalProtect portal probing surge against the exposed edge asset"
    command: |
      # SAFE-MODE recon: probe the AUTHORISED lab GlobalProtect portal's
      # unauthenticated prelogin endpoints to reproduce the CVE-2026-0257
      # pre-exploit scanning surge (wide sweep, few sessions). NO auth-bypass
      # exploit is attempted — recon signal only, so the NGFW records the
      # probing surge and the low probe-to-session ratio.
      PORTAL="${PORTAL_HOST:-gp-portal.lab.local}"
      for i in $(seq 1 60); do
        curl -sk --max-time 5 "https://${PORTAL}/global-protect/prelogin.esp" -o /dev/null 2>/dev/null || true
        curl -sk --max-time 5 "https://${PORTAL}/ssl-vpn/prelogin.esp" -o /dev/null 2>/dev/null || true
      done
      echo '[CortexSim] SIM-TIM-006 GlobalProtect prelogin probing surge complete (recon only, no exploit)'
    identity: root
    mitre_technique: "T1595.002"
    platforms: ["linux"]
    # Same operator source origin continues against the exposed GlobalProtect
    # portal — shared_entity (source IP → exposed edge asset) threads the
    # probing surge onto the chain; detection is NGFW/ASM-side, no endpoint fork
    # on the target.
    causality:
      parent_step: step-01
      pivot: shared_entity
    expected_detections:
      - plane: NDR
        type: BIOC
        description: "NGFW — a single source mass-probes the GlobalProtect prelogin/login endpoints on the exposed portal (wide-sweep recon shape)"
        ttp_ref: "TTP-2026-0150"
        detection_id: bioc-globalprotect-portal-probing-surge-from-a-single-source
      - plane: NDR
        type: XQL
        description: "NGFW — anomalous probe-to-session ratio (many prelogin probes from one source, few gateway-connected sessions)"
        ttp_ref: "TTP-2026-0150"
        detection_id: xql-globalprotect-probe-to-session-ratio-anomaly
      - plane: ASM
        type: XQL
        description: "Cortex ASM — the org's internet-exposed GlobalProtect portal edge asset the probing surge targets is in the attack-surface inventory"
        ttp_ref: "TTP-2026-0150"
        detection_id: xql-cortex-asm-exposed-globalprotect-portal-edge-asset

  - id: step-03
    name: "Correlation terminal — attribute the recon to the discovered edge asset as an exploit precursor"
    command: |
      echo '[CortexSim] SIM-TIM-006 correlation terminal — CR-TIM-0006 asserts the TIM-flagged scanner probed the exposed GlobalProtect portal (recon) BEFORE any gateway-connected auth-bypass on the matched edge asset; the low-signal probe is elevated to one attributed CVE-2026-0257 exploit-precursor incident spanning TIM + ASM + NDR'
    identity: root
    mitre_technique: "T1133"
    platforms: ["linux"]
    # No process fork — the correlation fuses the feed match, the NGFW probing
    # surge, and the ASM edge-asset finding on the shared source IP.
    causality:
      parent_step: step-02
      pivot: shared_entity
    expected_detections:
      - plane: ANALYTICS
        type: Correlation
        description: "Terminal stitch — TIM feed match + NGFW GlobalProtect probing surge + ASM exposed-portal finding joined on source IP into ONE attributed exploit-precursor incident, asserting recon preceded the auth-bypass"
        ttp_ref: "TTP-2026-0150"
        detection_id: CR-TIM-0006
      - plane: ANALYTICS
        type: XQL
        description: "Stitch validation — GlobalProtect portal sessions enriched with the scanning-infrastructure TI category confirm the feed↔NGFW join fired on source IP"
        ttp_ref: "TTP-2026-0150"
        detection_id: xql-recon-to-exploit-precursor-stitch-validation

cleanup:
  commands:
    - "echo '[CortexSim] SIM-TIM-006 cleanup complete — no persistent artifacts (read-only recon probing)'"

