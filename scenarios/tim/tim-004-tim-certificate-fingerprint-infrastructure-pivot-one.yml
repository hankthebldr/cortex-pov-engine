validation_methodology: "Certificate-Fingerprint Pivot + Causality Graph Stitching"
methodology_family: "F2"
primary_kpi: "Cross-Source Correlation Rate"
threshold:
  kpi: "Cross-Source Correlation Rate"
  op: "≥"
  value: 80
  unit: "%"
success_criteria: |
  mocktaxii arms the source-documented self-signed TLS certificate fingerprint
  (07eee6e893766e8bcc4a711abfdf201ee2920799 — a Trident Ursa cert reused across
  multiple IPs, the pivot key) into threat_intel. An estate host handshake to a
  host presenting that certificate raises a TIM certificate-fingerprint IOC match
  and the NGFW self-signed-cert BIOC; the fingerprint fan-out then groups >= 2
  distinct IPs under the one certificate, and the correlation rule stitches the
  self-signed-cert BIOC to the fan-out on the shared tls_cert_fingerprint_sha1
  (gated on the feed-presence of the indicator) into a single Resource-Development
  infrastructure incident within 300s — one indicator rolls up the reused-cert
  hosts.
moat_tier: "LEAD"
correlation_window_seconds: 300
required_planes_in_incident:
  - TIM
  - NDR
stitching_key: tls_cert_fingerprint_sha1
