      emitters guess at volume and spread. This is the "N occurrences of the same
      src/dst" class.
    lever: Emitter volume and spread parameters per alert; the detector readiness gate.
    decides:
      - if: thresholds are known per alert
        then: Encode them as emitter defaults with provenance; add a below-threshold negative control.
      - if: thresholds are adaptive per tenant
        then: Emit a sweep (graduated volumes) and record which volume fired.
    experiment: >-
      Graduated sweep: emit 3, 5, 10, 25, 50 distinct ports from one source to one
      host, one hour apart, on an armed tenant; record which tier fires Port Scan.
    affects: ["core/eal_simulator/analytics_alerts.py", "third_party_firewall_emitter", "globalprotect_emitter", "third_party_vpn_emitter", "duo_auth_emitter"]

