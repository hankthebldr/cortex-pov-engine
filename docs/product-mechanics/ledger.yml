    context: The POV runbook order (import rules, then run) depends on it.
    lever: Operator runbook sequencing; a rule-enabled preflight.
    affects: ["docs/operator-runbook.md"]

  - id: PM-BIO-07
    mechanism: BIO
    priority: P0
    status: open
    question: >-
      Since BIOC issues exist only on stitched data, which datasets and event types
      can a custom BIOC predicate address? Can a BIOC be written against firewall
      fields at all (a raw `panw_ngfw_traffic_raw` field, or the NGFW half of a
      stitched network story), or only against agent event types (process, file,
      network, registry and so on)?
    context: >-
      Nine NDR card BIOCs put their predicate on a raw firewall dataset (BIO
      assumes). If a BIOC cannot address raw data, those nine are manufactured
      misses, and the right artifact is a correlation rule on the raw dataset or a
      BIOC on the agent's own network event.
    lever: >-
      Rewrite the nine NDR card BIOCs as correlation rules, or retarget them to
      stitched network-event fields; a lint rule that refuses a BIOC whose logic
      names a `*_raw` dataset.
    decides:
      - if: BIOCs address agent event types only
        then: Move the nine to `correlation_rules[]` and add the lint rule.
      - if: stitched NGFW fields are BIOC-addressable
        then: Retarget the nine to those fields and document which.
    affects: ["detection_scanner/ttps/TTP-2026-0050-sim-ndr-001.json", "detection_scanner/ttps/TTP-2026-0106-sim-ndr-010.json", "detection_scanner/scripts/validate.py"]

