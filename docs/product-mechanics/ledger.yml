# Product-mechanics ledger — the source of truth for HOW Cortex turns signal into a
# detection, and for the questions we still owe about it.
#
# Read docs/product-mechanics/README.md first. Short version:
#   * `known`     — facts with a crossable source (public doc, public KB, our own lab
#                   observation, an operator report). NEVER internal-only material:
#                   this repo is public and the vault forbids it (vault SOP, Hosts table).
#   * `assumes`   — what CortexSim does TODAY, with a code/doc ref. An assumption is
#                   not a fact; most questions below exist to confirm or kill one.
#   * `contrasts` — "how this works vs how that works", stated as our working model.
#   * `questions` — each one names the generator lever its answer moves.
#
# Edit this file, then:  .venv/bin/python scripts/product_mechanics.py render --apply
# Answers never live here — they are immutable records under answers/ and the
# effective status of a question is derived from them at render time.

schema_version: 1
updated: "2026-11-11"

mechanisms:

  - id: ING
    name: Ingestion, parsing and XDM modeling
    summary: >-
      Everything between "the emitter POSTed a record" and "a detector can read it":
      the HTTP log collector (cloud /logs/v1/event or the Broker VM HTTP applet),
      dataset routing, the parsing rule, the `_time` the record is filed under, and
      the XDM modeling rule that maps raw fields onto the common schema. A record
      that is accepted but never lands, or lands under the wrong time or dataset, is
      a silent false negative at every layer above it.
    known:
      - fact: >-
          An HTTP log collector names its dataset `<Vendor>_<Product>_raw` from the
          Vendor and Product set on the collector instance. The request carries the
          raw key as `Authorization: {api_key}` (no scheme). Documented responses:
          200 success; 401 wrong token or collector deleted/disabled; 404 wrong URL;
          413 body over 10 MB; 429 over 400 requests/s per customer per endpoint;
          500 body does not match the collector's log format. Records may be up to
          5 MB each, and the collector ingests up to 80,000 events/s.
        source:
          kind: public_doc
          ref: https://cortex-docs.paloaltonetworks.com/cortex-xsiam/configure-cortex-xsiam/cortex-xsiam-data-sources/vendor-specific-data-sources-and-connectors/http-log-collector/set-up-an-http-log-collector-to-receive-logs.md
          date: "2026-11-10"
      - fact: >-
          "Analytics, IOC, and BIOC issues are only generated on normalized logs."
          Raw firewall data is queryable as `panw_ngfw_*_raw`; stitched data through
          `xdr_data` or a stitched preset such as `network_story`.
        source:
          kind: public_doc
          ref: https://cortex-docs.paloaltonetworks.com/cortex-xsiam/configure-cortex-xsiam/cortex-xsiam-data-sources/palo-alto-networks-integrations/next-generation-firewall/ingest-data-from-next-generation-firewall
          date: "2026-11-10"
    assumes:
      - assumption: >-
          A 2xx from the collector means the record was delivered; delivery is
          accounted per record and nothing above 2xx counts.
        ref: core/eal_simulator/delivery.py:45
      - assumption: >-
          Analytics-family emitters put a top-level `dataset` hint in the body, as if
          the body can steer dataset routing.
        ref: core/eal_simulator/analytics_emitter.py:354
      - assumption: >-
          The analytics emitter's `auth_scheme` defaults to empty, so a campaign sends
          the raw key as `Authorization: <key>`, the documented form. Until PR 178
          (2026-11-10) the default was "Bearer", which that form does not allow.
        ref: core/eal_simulator/analytics_emitter.py:119
      - assumption: >-
          XDM modeling rules are a normalization substrate, surfaced and exported but
          counted informationally, not as a detection type.
        ref: detection_scanner/ttps (detections.modeling_rules[], 5 cards)
    contrasts:
      - vs: STI
        point: >-
          Ingestion decides whether a record exists and what it is called; stitching
          decides whether two existing records are about the same activity. A
          stitching failure can be an ingestion failure in disguise (wrong field
          name, wrong `_time`).

  - id: STI
    name: Stitching (data fusion across sources)
    summary: >-
      The engine that links records from different sensors (agent network events,
      NGFW sessions, identity logs, cloud audit) into one story. Our working model:
      a join on shared entities, chiefly the network 5-tuple for network-endpoint,
      inside a time tolerance. Henry confirmed in practice that the source half has
      to match what the agent recorded and the destination half has to match the
      firewall transaction. Which fields, which side of NAT and what tolerance are
      still unconfirmed.
    known:
      - fact: >-
          Network-endpoint stitching did not occur until src IP, src port, dst IP,
          dst port and protocol were made consistent: source as the endpoint (agent)
          records it, destination as the firewall transaction records it.
        source:
          kind: operator_report
          ref: Henry, design conversation 2026-11-05 (lab evidence not attached)
          date: "2026-11-05"
      - fact: >-
          Once the native NGFW integration is set up, "the console begins stitching
          logs with other Palo Alto Networks-generated logs to form stories". Stitched
          data is read from `xdr_data` or a preset designated for stitched data, such
          as `network_story`, and "IOC and BIOC issues are applicable to stitched
          data only, and are not available on raw data."
        source:
          kind: public_doc
          ref: https://cortex-docs.paloaltonetworks.com/cortex-xsiam/configure-cortex-xsiam/cortex-xsiam-data-sources/palo-alto-networks-integrations/next-generation-firewall/ingest-data-from-next-generation-firewall
          date: "2026-11-10"
      - fact: >-
          The `network_story` and `authentication_story` presets over `xdr_data`
          "contain information stitched together from Cortex XSIAM agent events and log
          files to form a common schema". Stitched rows carry story fields (`story_id`,
          `story_version`, `story_publish_timestamp`, `is_disintegrated`) and firewall
          fields (`fw_time_generated`, "equivalent to the event_timestamp"). The agent
          network event carries `action_local_ip` / `action_local_port` ("Source IP
          address", "Source port"), `action_remote_ip` / `action_remote_port`,
          `action_network_protocol`, `action_network_connection_id`,
          `action_network_creation_time` ("The start time of the network session") and
          the NAT fields `action_local_nat_ip` / `action_local_nat_port`,
          `action_remote_nat_ip` / `action_remote_nat_port` and `action_nat`. No public
          page names the fields stitching matches on, a time tolerance or a NAT rule.
        source:
          kind: public_doc
          ref: https://cortex-docs.paloaltonetworks.com/cortex-xsiam/reference-and-developer-docs/cortex-agentix-xql/get-started-with-xql/datasets-and-presets ; https://cortex-docs.paloaltonetworks.com/xql-schema-reference/xdr-data-fields ; https://cortex-docs.paloaltonetworks.com/xql-schema-reference/xdr-data-fields-by-actor/action-actor
          date: "2026-11-10"
      - fact: >-
          Third-party firewalls are stitched too. "Cortex XSIAM can stitch data from
          Check Point firewalls with other logs to make up network stories"; Check Point
          logs with `sessionid = 0` are dropped, and the destination port is available
          only in the raw logs. Cisco ASA connection logs are stitched into network
          stories for message IDs 302013, 302014, 302015 and 302016 only. Both arrive
          through the Broker VM syslog applet.
        source:
          kind: public_doc
          ref: https://cortex-docs.paloaltonetworks.com/cortex-xsiam/configure-cortex-xsiam/cortex-xsiam-data-sources/generic-on-premise-data-collectors/broker-vm-data-collector-applets/syslog-collector-applet/check-point-fw1-vpn1/ingest-logs-from-check-point-firewalls ; https://cortex-docs.paloaltonetworks.com/cortex-xsiam/configure-cortex-xsiam/cortex-xsiam-data-sources/generic-on-premise-data-collectors/broker-vm-data-collector-applets/syslog-collector-applet/cisco-asa-firewalls-and-anyconnect/ingest-logs-from-cisco-asa-firewalls-and-anyconnect
          date: "2026-11-10"
      - fact: >-
          A causality view in the lab tenant showed an agent's curl process on a
          libvirt NAT guest connecting through a firewall node to 35.222.124.72, so
          the agent network event and the NGFW session were joined although the
          agent recorded the guest's source IP (192.168.122.0/24) and the firewall
          logged the hypervisor's LAN IP as source. Which fields made the join
          (source port, destination, protocol, time) is not yet confirmed.
        source:
          kind: operator_report
          ref: Henry, tenant deathstar causality view for the lab VM after SIM-CDR-012 (02:58Z), screenshot 2026-11-10 21:30 CST
          date: "2026-11-10"
    assumes:
      - assumption: >-
          A cross-source join on the shared 5-tuple (or container_id, or src_host)
          within a tight temporal window is how Cortex stitches network and endpoint.
        ref: docs/reference/causality-graph-methodology.md#12-network--cross-plane-log-stitching-and-the-5-tuple
      - assumption: >-
          One deterministic 5-tuple per run is resolved and projected into every
          channel's vocabulary (nine entity keys).
        ref: core/engine/stitch_context.py:75
      - assumption: >-
          An in-process EAL emitter cannot share a 5-tuple with the agent because it
          POSTs from SimCore; only the identity principal (canary_token) is injected.
          NOTE: ngfw_eal_emitter has since gained src_ip/src_host/dst_ip/dst_port
          overrides that the stitch adapter does not yet use.
        ref: core/eal_simulator/stitch_params.py:7 ; core/eal_simulator/plugins/ngfw_eal_emitter.py:282
      - assumption: >-
          SIM-MP-006 stitches NGFW and container endpoint on 5-tuple + container_id
          inside 10 s, but its endpoint query groups by action_local_ip,
          action_remote_ip, action_remote_port and omits the local port.
        ref: scenarios/multi_plane/mp-006-ngfw-container-causality-stitch.yml:131
      - assumption: >-
          `stitching_key` is one of src_host | session_id | user_principal |
          container_id; in the corpus it is src_host 28x, user_principal 13x and a
          long tail, and `correlation_window_seconds` ranges 10 s to 86400 s against
          "XSIAM's default correlation window".
        ref: scenarios/_schema.yml:380
      - assumption: >-
          62 of the 87 EAL `plugin:` references in the multi-plane and NDR scenarios
          (15 files) name `ngfw_eal_emitter` (32) or `ngfw_threat_emitter` (30). Both
          POST firewall-shaped records to a custom HTTP collector, not through the
          native NGFW integration, yet those scenarios declare stitched expectations.
        ref: core/eal_simulator/plugins/ngfw_eal_emitter.py ; scenarios/multi_plane/ ; scenarios/ndr/
    contrasts:
      - vs: INC
        point: >-
          Stitching links RECORDS (raw telemetry) into one activity; incident
          grouping links ALERTS into one incident. Our scenarios blend the two:
          `stitching_key` and `required_planes_in_incident` sit side by side. They
          may key on different things.
      - vs: COR
        point: >-
          Stitching happens without anyone writing a rule; a correlation rule is an
          authored scheduled query that can join datasets itself. A correlation rule
          can reproduce a join the fusion engine never made.

  - id: CAU
    name: Causality and the Causality Group Owner (CGO)
    summary: >-
      The agent-side engine that assembles a process tree per chain, names one CGO
      as the owner, and gives every event in the chain one causality_id. Alerts
      inherit the causality_id of the node they fire on. Which process becomes the
      CGO decides what the chain is "about" and what rare-parent logic sees.
    known:
      - fact: >-
          With the agent fully up, SIM-EDR-003 steps 1–2 were recorded in xdr_data and
          steps 3–5 never appeared, even 8+ minutes later. Each step was a fresh `sh`
          (argv[0] `apache2`) spawned by the beacon; the 3rd to 5th identical shells
          started within about 100 ms, and neither they nor their children were
          recorded. The same commands (useradd, chpasswd, ssh-keygen, userdel) run in
          one shell 2 s apart were all recorded within seconds. The cause is not
          established.
        source:
          kind: lab_observation
          ref: Lab tenant, XDR agent 9.4.0.470 on Ubuntu 24.04 (kernel 6.8), SIM-EDR-003 run 2 and a spaced diagnostic draft run, 2026-11-10
          date: "2026-11-10"
      - fact: >-
          On a systemd 255 host every chain that starts in a systemd service has a
          degenerate CGO: causality_actor_process_image_name `9`, image path
          `/proc/self/fd/9`, the SHA-256 of empty input (e3b0c442…) and command line
          `systemd-executor --deserialize N --log-target journal-or-kmsg`, with a null
          causality_actor_effective_username. This held for the beacon's own steps,
          for a renamed binary run directly as a transient unit's ExecStart (`systemd-run
          /opt/cxprobe/apache2 -c …`), for `systemd-run /bin/sh -c …`, and for a unit
          run with `--uid=www-data`. Each transient unit was its own chain (its own
          causality_actor_causality_id); all the beacon's steps shared one.
        source:
          kind: lab_observation
          ref: Lab tenant, XDR agent 9.4.0.470, Ubuntu 24.04 (kernel 6.8, systemd 255), probe run 19c7a04d (token pmqfba025), xdr_data PROCESS_START, 2026-11-11
          date: "2026-11-11"
      - fact: >-
          An argv[0] rewrite (`bash -c "exec -a apache2 /bin/sh -c …"`) left
          action_process_image_name `sh`; only action_process_image_command_line began
          with `apache2`. A renamed copy of the binary (`cp /usr/bin/dash
          /opt/cxprobe/apache2`) was recorded as action_process_image_name `apache2`, and
          its children as actor_process_image_name `apache2`. Neither changed the CGO.
        source:
          kind: lab_observation
          ref: Lab tenant, probe run 19c7a04d (token pmqfba025), cases c2a, c2b, c2c, 2026-11-11
          date: "2026-11-11"
      - fact: >-
          A chain launched by cron (`* * * * * root bash -c /opt/cxprobe/c1c.sh`) had
          CGO `cron` (`/usr/sbin/cron -f -P`), not the scheduled payload. The shebang
          script's own process was recorded with the script's file name, `c1c.sh`, as
          its image name.
        source:
          kind: lab_observation
          ref: Lab tenant, probe run 19c7a04d (token pmqfba025), case c1c, 2026-11-11
          date: "2026-11-11"
      - fact: >-
          `causality_id` is not an xdr_data field: a query that names it in `fields`
          fails, and the same query with `actor_causality_id` and
          `causality_actor_causality_id` succeeds.
        source:
          kind: lab_observation
          ref: Lab tenant XQL via SimCore /api/xsiam/tenants/deathstar/xql, 2026-11-11 (also observed by the persistence-grouping session the same day)
          date: "2026-11-11"
    assumes:
      - assumption: >-
          `causality_id` on xdr_data is the join key for a chain; three actor scopes
          (causality_actor_*, actor_process_*, action_process_*) map to CGO, parent,
          child.
        ref: docs/reference/causality-graph-methodology.md#11-endpoint-the-causality-instance-ci-graph-and-the-cgo
      - assumption: >-
          An argv[0] rewrite does NOT change comm or /proc/pid/exe, so
          causality_actor_process_image_name stays `sh` even when cgo_anchor names
          apache2.
        ref: docs/reference/mechanics-review-2026-07.md (H3)
      - assumption: >-
          Every Linux step runs through an identity wrapper (runuser / sudo / su),
          which is itself an unnatural parent for service-account activity.
        ref: agent/identity/harness.go:53 ; docs/reference/mechanics-review-2026-07.md (M5)
      - assumption: >-
          The beacon honours cgo_anchor by setting the anchor shell's argv[0] to
          cgo_anchor.image_name and records the anchor as honoured when that rename
          succeeds; `ANCHOR NOT HONOURED` is written only when no renamable shell exists.
        ref: agent/executor/platform_unix.go:37
      - assumption: >-
          cgo_anchor.primary_username labels the CGO node in the causality graph
          (default `root`); nothing on the host makes the CGO run as that user.
        ref: core/engine/causality_graph.py:421
    contrasts:
      - vs: STI
        point: >-
          Causality is built on the endpoint from OS process lineage; stitching is
          built in the cloud across sensors. A chain can be perfectly causal and
          still never stitch to its firewall session.

  - id: BIO
    name: BIOC matching
    summary: >-
      Behavioral IOC rules: a predicate over agent event fields (process image,
      command line, file path, registry key, network fields, actor scopes). Our
      working model is deterministic matching on the event, no baseline. 365 BIOCs
      across the card corpus, 40 of which carry a suppression window.
    known:
      - fact: >-
          BIOC (and IOC) issues are generated on stitched, normalized data only: "IOC
          and BIOC issues are applicable to stitched data only, and are not available
          on raw data."
        source:
          kind: public_doc
          ref: https://cortex-docs.paloaltonetworks.com/cortex-xsiam/configure-cortex-xsiam/cortex-xsiam-data-sources/palo-alto-networks-integrations/next-generation-firewall/ingest-data-from-next-generation-firewall
          date: "2026-11-10"
      - fact: >-
          A BIOC rule is XQL on `xdr_data` or `cloud_audit_log` only, using the `filter`
          and `alter` stages and functions without aggregation, and it filters on
          `event_type`: FILE, INJECTION, LOAD_IMAGE, NETWORK, PROCESS, REGISTRY,
          EVENT_LOG or STORY ("Events relating to a combination of firewall and endpoint
          logs over the network"). Field values are evaluated case-insensitively. A rule
          with 5000 or more hits in 24 hours is disabled, and one that hits more than
          100 endpoints over 72 hours gets an automatic exception on PROCESS SHA256.
        source:
          kind: public_doc
          ref: https://cortex-docs.paloaltonetworks.com/cortex-xsiam/detect-investigate-and-respond-to-threats/threat-management/detection-rules/what-are-detection-rules/whats-a-bioc/create-a-bioc-rule
          date: "2026-11-10"
      - fact: >-
          "As soon as you create or enable a BIOC rule, the tenant begins to monitor
          input feeds for matches." It "also analyzes historical data collected in the
          tenant"; how far back is not stated.
        source:
          kind: public_doc
          ref: https://cortex-docs.paloaltonetworks.com/cortex-xsiam/detect-investigate-and-respond-to-threats/threat-management/detection-rules/what-are-detection-rules/whats-a-bioc
          date: "2026-11-10"
      - fact: >-
          Default issue deduplication applies only to issues whose name contains
          WildFire or Local Analysis, over a 1-hour window; "All other issue types are
          processed individually and will not be deduped." A BIOC that matches 20 times
          raises 20 issues.
        source:
          kind: public_doc
          ref: https://cortex-docs.paloaltonetworks.com/cortex-xsiam/detect-investigate-and-respond-to-threats/investigation-and-response/investigate-issues/issue-deduplication
          date: "2026-11-10"
    assumes:
      - assumption: >-
          Windows steps run as `powershell.exe -EncodedCommand <base64>` wrapped in
          an exit-code shim, so the visible command line is the base64 blob.
        ref: agent/executor/platform_windows.go:40 ; agent/executor/script.go:134
      - assumption: >-
          Linux command lines carry the identity wrapper prefix, e.g.
          `runuser -l www-data -c '<ttp>'`.
        ref: agent/identity/harness.go:53
      - assumption: >-
          A BIOC card entry is `{name, description, logic, severity,
          mitre_technique_ids, suppression_window_seconds?}`.
        ref: detection_scanner/ttps/*.json (detections.biocs[])
      - assumption: >-
          Nine NDR card BIOCs (eight cards) put their predicate on a raw firewall
          dataset: `panw_ngfw_traffic_raw` eight times, `cisco_asa_raw` once.
        ref: detection_scanner/ttps/TTP-2026-0050-sim-ndr-001.json ; detection_scanner/ttps/TTP-2026-0106-sim-ndr-010.json
    contrasts:
      - vs: ABI
        point: >-
          A BIOC is a rule someone wrote; it fires the first time its predicate
          matches. An ABIOC is PANW-authored behavioral logic that judges rarity in
          context, so the same event can fire one and not the other.
      - vs: IOC
        point: >-
          An IOC matches a value (hash, IP, domain); a BIOC matches a behavior. A
          renamed tool defeats a filename-keyed BIOC and does not defeat a hash IOC;
          a recompiled tool does the reverse.

  - id: ABI
    name: ABIOC (analytics BIOC)
    summary: >-
      PANW-authored, auto-tuned behavioral detections evaluated over causality
      chains. Our working model: they weigh rarity of a behavior in its causal
      context, which makes lab size, tenant history and repetition matter in ways a
      BIOC does not. 164 ABIOCs across the card corpus.
    known:
      - fact: >-
          The first built-in alerts CortexSim activity raised in the lab were "XDR
          Analytics BIOC" alerts at Low severity: "Uncommon Linux shell command
          execution" on the beacon spawning `sh` (raised by beacon activity itself,
          so any run can raise it), and "Suspicious access to shadow file", mapped to
          T1003, on `useradd` and `chpasswd`. The scenario declared T1136.001 for that
          step. All three came from diagnostic runs, so none is tenant verification of
          a scenario.
        source:
          kind: lab_observation
          ref: Lab tenant, XDR agent 9.4.0.470 on Ubuntu 24.04, diagnostic draft runs, 2026-11-10
          date: "2026-11-10"
      - fact: >-
          An ABIOC indicates "a single event of suspicious behavior with an identified
          chain of causality", judged against user, endpoint and network profiles; an
          analytics issue is multi-event activity that deviates from a baseline built
          over time. "Cortex XSIAM tailors each ABIOC to your specific environment after
          analyzing your logs and data sources." No ABIOC learning period is published.
          Detectors with 5000 or more matches in 24 hours are disabled.
        source:
          kind: public_doc
          ref: https://cortex-docs.paloaltonetworks.com/cortex-xsiam/detect-investigate-and-respond-to-threats/threat-management/analytics/analytics-issues-and-analytics-biocs
          date: "2026-11-10"
    assumes:
      - assumption: >-
          An ABIOC card entry adds `behavioral_profile` and `causality_anchor` to the
          BIOC shape.
        ref: detection_scanner/ttps/*.json (detections.abiocs[])
      - assumption: >-
          The matcher's single 3600 s default window is too tight for
          Analytics/ABIOC.
        ref: core/connectors/matcher.py:32 ; docs/reference/mechanics-review-2026-07.md (M12)
    contrasts:
      - vs: ANA
        point: >-
          Analytics alerts publish activation/training periods and judge an entity
          against its own profile over time; whether ABIOCs need a training period
          at all is unknown (PM-ABI-01).

  - id: ANA
    name: Analytics engine (profiles, baselines, thresholds)
    summary: >-
      Detectors that judge activity against a learned profile: port scans, failed
      connections, impossible travel, new country, brute force. The vendor alert
      pages publish severity, activation, training, test and dedup periods and the
      data sources that feed each alert, and they publish no threshold and no
      predicate. "Five occurrences of the same src/dst" is exactly the class of
      fact we do not have.
    known:
      - fact: >-
          Each bound analytics alert publishes Activation Period, Training Period,
          Test Period, Deduplication Period and a Required Data OR-set of data
          sources. All eight transcribed alerts state activation 14 days and training
          30 days.
        source:
          kind: public_doc
          ref: https://cortex-docs.paloaltonetworks.com/analytics-alerts/alerts-by-name/ (per-alert pages, transcribed in core/eal_simulator/analytics_alerts.py)
          date: "2026-09-20"
      - fact: >-
          No analytics alert page publishes a numeric threshold, a dataset field
          name or the detection predicate itself.
        source:
          kind: public_doc
          ref: core/eal_simulator/analytics_alerts.py (module docstring)
          date: "2026-09-20"
      - fact: >-
          The four periods are defined: Activation is "the shortest amount of log
          file time before the app can generate an issue"; Training is the logging
          time a detector needs "to establish a baseline"; Test is the logging time
          it uses to decide whether activity is unusual; Deduplication is the time in
          which further issues "for the same activity or behavior are suppressed".
          "Most but not all detectors start running after the activation period
          ends." The page does not say whether an issue can fire before training
          completes.
        source:
          kind: public_doc
          ref: https://cortex-docs.paloaltonetworks.com/cortex-xsiam/detect-investigate-and-respond-to-threats/threat-management/analytics/analytics-detection-time-intervals.md
          date: "2026-11-10"
      - fact: >-
          The analytics engine "accesses your logs as they are streamed to the Cortex
          XSIAM tenant" and runs "on all mapped network and authentication data": a
          source that is not mapped is not analysed.
        source:
          kind: public_doc
          ref: https://cortex-docs.paloaltonetworks.com/cortex-xsiam/detect-investigate-and-respond-to-threats/threat-management/analytics/analytics-engine.md
          date: "2026-11-10"
    assumes:
      - assumption: >-
          The arming gate is max(activation, training) — OUR inference, labelled
          `inferred:` in every verdict.
        ref: core/eal_simulator/analytics_alerts.py:78
      - assumption: >-
          Readiness depends on an operator-typed onboarding date per data source;
          unknown is never armed.
        ref: core/eal_simulator/analytics_alerts.py:325
    contrasts:
      - vs: BIO
        point: >-
          A BIOC can fire on a fresh tenant on the first event; an analytics alert
          can be "not armed" for weeks and read as a miss.
      - vs: COR
        point: >-
          A correlation rule's threshold is in its XQL and we can read it; an
          analytics threshold is not published, so volume and spread are guesses
          until answered.

  - id: COR
    name: Correlation rules
    summary: >-
      Authored, scheduled XQL that produces alerts, can join datasets, and is the
      mechanism behind most of our cross-plane `Correlation` detections (209 across
      the card corpus; the coverage gate holds the corpus at a 10 % Correlation
      share). Schedule, lookback and time basis decide whether a run is ever inside
      an evaluated window.
    known:
      - fact: >-
          A correlation rule runs Real Time ("scan the data as it's ingested"; limited
          XQL stages, must include a `filter`) or Scheduled: every 10, 20 or 30
          minutes, hourly, daily or custom, "minimum query frequency is every 10
          minutes", over a query time frame "up to 7 days". Docs recommend
          `time_frame_end()` over `current_time()`. Suppression is off by default; when
          enabled its default duration is 1 hour and the maximum is 1 day. Rules with
          5000 or more hits in 24 hours are disabled automatically, and at most 1200
          user-created scheduled correlations can be active.
        source:
          kind: public_doc
          ref: https://cortex-docs.paloaltonetworks.com/cortex-xsiam/detect-investigate-and-respond-to-threats/threat-management/detection-rules/what-are-detection-rules/whats-a-correlation-rule/create-a-correlation-rule.md
          date: "2026-11-10"
    assumes:
      - assumption: >-
          `correlation_window_seconds` is "the ±N second window inside which signals
          must fire to qualify as stitched", enforced "against XSIAM's default
          correlation window" — values from 10 s to 86400 s in the corpus.
        ref: scenarios/_schema.yml:380
      - assumption: >-
          A correlation card entry is `{name, rule_id, logic}` with no schedule,
          time frame or suppression fields.
        ref: detection_scanner/ttps/*.json (detections.correlation_rules[])
    contrasts:
      - vs: STI
        point: >-
          See STI. A correlation rule can fire on a join the fusion engine never
          made, so a green correlation does not prove stitching.

  - id: IOC
    name: IOC matching and threat intel
    summary: >-
      Indicator-value matching (hash, IP, domain, URL) against agent and network
      data, fed by manually added indicators or TIM feeds. 410 IOCs across the card
      corpus, 353 of which declare `reputation_required`.
    known:
      - fact: >-
          IOC issues, like BIOC issues, are generated only on stitched, normalized
          data, not on raw datasets.
        source:
          kind: public_doc
          ref: https://cortex-docs.paloaltonetworks.com/cortex-xsiam/configure-cortex-xsiam/cortex-xsiam-data-sources/palo-alto-networks-integrations/next-generation-firewall/ingest-data-from-next-generation-firewall
          date: "2026-11-10"
      - fact: >-
          IOC types are full path, file name, domain, destination IP address, MD5 hash
          and SHA256 hash. "Cortex XSIAM looks for IOC matches in all data collected in
          the past" and keeps evaluating new data. Which event fields each type matches
          is not stated.
        source:
          kind: public_doc
          ref: https://cortex-docs.paloaltonetworks.com/cortex-xsiam/detect-investigate-and-respond-to-threats/threat-management/detection-rules/what-are-detection-rules/whats-an-ioc
          date: "2026-11-10"
    assumes:
      - assumption: >-
          IOC matches attach at the file/image (sha256) level of the causality graph.
        ref: docs/reference/causality-graph-methodology.md#11-endpoint-the-causality-instance-ci-graph-and-the-cgo
      - assumption: >-
          A TAXII feed (mocktaxii) plus matching outbound traffic produces a stitched
          IOC + NDR + EDR detection.
        ref: infra/modules/aws/tim ; scenarios/tim/
    contrasts:
      - vs: BIO
        point: See BIO.

  - id: PRV
    name: Prevention (agent modules, report vs block)
    summary: >-
      Agent-side modules that block in block mode and alert in report mode. Our
      outcome axis credits `prevented` only with two witnesses: a tenant alert
      saying Prevented AND a host-recorded kill of the step.
    known:
      - fact: >-
          On a Linux agent, the four public WildFire test samples (PE, APK, macOS,
          ELF) downloaded to /var/tmp and marked executable, but never run, raised
          no agent issue. The tenant showed nothing for that host after the run.
        source:
          kind: operator_report
          ref: Henry, tenant deathstar after SIM-CDR-012 pull run on the lab VM (02:58Z), 2026-11-10 21:27 CST
          date: "2026-11-10"
    assumes:
      - assumption: >-
          `prevented` requires a tenant alert whose action reads prevented AND a
          host-recorded kill; a lost beacon can only read `pending`.
        ref: core/engine/outcome.py:28
      - assumption: >-
          A POV runs report mode then block mode on the same endpoint as a paired
          run, with an optional canary proving the block profile is real.
        ref: docs/reference/api-and-agent-surface.md (§1.3.1)
    contrasts:
      - vs: BIO
        point: >-
          Prevention acts inline on the endpoint before the event completes;
          detection evaluates the event after the fact. A prevented step may never
          produce the downstream events later steps expect.

  - id: INC
    name: Alert-to-incident grouping
    summary: >-
      The logic that groups alerts into incidents. Our correlation-rate KPI asserts
      ">= N distinct planes under one incident_id", so the grouping key, not the
      stitch, decides whether a multi-plane scenario scores. The XSIAM docs now say
      "issue" for alert and "case" for incident.
    known:
      - fact: >-
          Case creation for correlation-rule issues: "Medium or High severity issues:
          Automatically creates a new case." "Low severity: Do not create cases and
          are not grouped into existing cases." Issues with shared artifacts and
          attributes group into one case only when their domain is Security or
          Posture AND their severity is Medium or higher.
        source:
          kind: public_doc
          ref: https://cortex-docs.paloaltonetworks.com/cortex-xsiam/detect-investigate-and-respond-to-threats/threat-management/detection-rules/what-are-detection-rules/whats-a-correlation-rule/create-a-correlation-rule.md
          date: "2026-11-10"
      - fact: >-
          Grouping starts at Medium severity, in the operator's words: "things like
          stitching/grouping started with medium severity". Which sources this
          covers and whether "stitching" here means data stitching or alert grouping
          is open (PM-INC-05, PM-STI-13).
        source:
          kind: operator_report
          ref: Henry, design conversation 2026-11-10 (lab evidence not attached)
          date: "2026-11-10"
      - fact: >-
          Case grouping methods are artifact association (shared core artifacts such as
          SHA256, HostName and UserName), exact match detection, and related entities
          "within a close timeframe". An issue is eligible when it is in the Security or
          Posture domain "with Medium severity or higher". "Grouping by Username may be
          subject to temporal constraints", with no window stated, and the logic is
          proprietary and "continuously tuned". Issues on the same causality chain ID
          (CID) are also grouped.
        source:
          kind: public_doc
          ref: https://cortex-docs.paloaltonetworks.com/cortex-xsiam/detect-investigate-and-respond-to-threats/investigation-and-response/case-concepts/case-grouping ; https://cortex-docs.paloaltonetworks.com/cortex-xsiam/detect-investigate-and-respond-to-threats/investigation-and-response/case-concepts/what-is-causality
          date: "2026-11-10"
      - fact: >-
          A case stops accepting issues 30 days after creation, 14 days after its last
          issue, or at 1,000 issues. An auto-resolved case reopens if a matching issue
          arrives within six hours of its last issue.
        source:
          kind: public_doc
          ref: https://cortex-docs.paloaltonetworks.com/cortex-xsiam/detect-investigate-and-respond-to-threats/investigation-and-response/overview-of-cases/case-thresholds
          date: "2026-11-10"
      - fact: >-
          Correlation issues group only through mapped artifact fields: Initiator
          SHA256, CGO SHA256, Target process SHA256, File SHA256, Remote IP and IPv6,
          DNS Query Name, the Initiator CMD / Initiator Path / Initiated By triplet (a
          command line of at least 5 characters, not counting spaces and the image
          name), Host Name, Agent ID, User name, Url, and an external artifact name and
          id. An all-zero hash is invalid, and User name excludes common system accounts
          and known service accounts. "Field mapping does not guarantee grouping."
        source:
          kind: public_doc
          ref: https://cortex-docs.paloaltonetworks.com/cortex-xsiam/configure-cortex-xsiam/customize-cases-and-issues/optimize-case-grouping-in-correlations
          date: "2026-11-10"
      - fact: >-
          A May 2024 PANW blog contradicts the current docs for some areas: "in some
          cases like in identity/cloud/SaaS areas, we allow grouping of low severity
          alerts." The current case-grouping page states the Medium floor with no such
          exception.
        source:
          kind: public_blog
          ref: https://www.paloaltonetworks.com/blog/security-operations/smartgrouping-precision-ai-driven-investigation/
          date: "2026-11-10"
      - fact: >-
          "INFO issues are not included" in the XQL `issues` dataset.
        source:
          kind: public_doc
          ref: https://cortex-docs.paloaltonetworks.com/cortex-xsiam/reference-and-developer-docs/cortex-agentix-xql/get-started-with-xql/datasets-and-presets
          date: "2026-11-10"
    assumes:
      - assumption: >-
          `required_planes_in_incident` planes must all be represented under one
          incident_id; the verifier asserts each in dataset=xdr_data. 55 scenarios
          declare it.
        ref: scenarios/_schema.yml:385
      - assumption: >-
          Card severities are authored without a grouping floor: 15 BIOCs are
          Informational and 1 ABIOC is Low (16 cards, including SIM-MP-013, which
          declares required_planes_in_incident), and the 209 card correlation rules
          carry no severity at all, so the severity a DC picks at import decides
          whether the issue can ever join a case.
        ref: detection_scanner/ttps/TTP-2026-0123-sim-mp-013.json ; scenarios/multi_plane/mp-013-muddled-libra-rogue-vm-alert-storm.yml
    contrasts:
      - vs: STI
        point: See STI.

  - id: TEN
    name: Tenant readiness (content, entitlements, data collection)
    summary: >-
      The state of the tenant that decides whether a detector can fire at all:
      which content is enabled, which licence or add-on gates an engine, what the
      agent profile collects. A detector that is off reads exactly like a miss.
    known:
      - fact: >-
          A run that started 15 s after the endpoint first showed CONNECTED left no
          events at all: the agent's collectors were still stopped, and the first
          process events arrived about a minute after connect. A second run 16
          minutes later was recorded (see the CAU observation for what it lost).
        source:
          kind: lab_observation
          ref: Lab tenant, XDR agent 9.4.0.470 on Ubuntu 24.04, SIM-EDR-003 runs 1 and 2, 2026-11-10
          date: "2026-11-10"
      - fact: >-
          A Linux agent runs in Kernel mode (a supported kernel module) or User Space
          mode (agent 7.7 or later and kernel 5.0 or later); both collect EDR data. When
          neither requirement is met it runs in asynchronous mode, where "there is no
          event collection, no BTP, no EDR, and no anti-lpe": an unsupported kernel in
          Kernel mode, an install with `--no-km`, or User Space on a kernel older than
          5.0.0.
        source:
          kind: public_doc
          ref: https://cortex-docs.paloaltonetworks.com/cortex-xsiam/insights-and-tips-cortex-xsiam/endpoint-and-agent-management/cortex-xdr-agent-linux-operation-modes ; https://cortex-docs.paloaltonetworks.com/cortex-xsiam/protect-your-endpoints/endpoint-security/install-and-manage-endpoints/set-up-endpoint-protection/set-up-endpoint-profiles-and-exception-rules/set-up-agent-settings-profiles
          date: "2026-11-10"
    assumes:
      - assumption: >-
          /api/health makes zero outbound calls and lists reachability-shaped claims
          it does not make in `not_checked[]`.
        ref: core/api/health.py
      - assumption: >-
          POV scoping maps tenant entitlements to the corpus and emits upsell lists
          with PAN-* part numbers.
        ref: core/api/pov.py
    contrasts: []

  - id: ALR
    name: Alert records and read-back
    summary: >-
      What an alert ("issue") looks like when SimCore pulls it back: which field
      names the rule that fired, which timestamp is the detection time, which MITRE
      technique and source string it carries, and which case it joined. The matcher
      credits a seeded Result from these fields alone, so a misread field turns a
      real detection into a miss, or a noise alert into a pass.
    known:
      - fact: >-
          Alerts pulled from the lab tenant carried none of the four rule-identifier
          keys the connector reads (`matching_service_rule_id`, `detector_id`,
          `bioc_id`, `rule_id`); the connector preflight reported
          PF_ALERT_SHAPE_PARTIAL and matching fell back to technique plus name.
        source:
          kind: lab_observation
          ref: Lab tenant, xsiam connector preflight and reconcile, 2026-11-04
          date: "2026-11-04"
      - fact: >-
          The Issues API issue object carries `detection.method` ("Detection source or
          method that created the issue"; filter values such as XDR Agent, XDR
          Analytics, XDR BIOC, XDR IOC, XDR Analytics BIOC, Correlation, PAN NGFW;
          response codes such as TRAPS, MAGNIFIER, ANALYTICS_BIOC, BIOC, IOC,
          CORRELATION, FW), `detection.rule_id` (a string, undescribed),
          `mitre_techniques`, `_insert_time` ("Issue creation timestamp in epoch
          milliseconds"), `observation_time` (undescribed) and `case_ids`, a list,
          rather than `case_id` or `incident_id`. The connector reads all three as
          fallbacks since PR 179.
        source:
          kind: public_doc
          ref: https://cortex-docs.paloaltonetworks.com/xsiam-api/issues-apis/issues
          date: "2026-11-10"
    assumes:
      - assumption: >-
          The alert's time is the first present of `detection_timestamp`,
          `creation_time`, `local_insert_ts`, `_insert_time`, and MTTD is that time
          minus the step's `executed_at`.
        ref: core/connectors/xsiam.py:383
      - assumption: >-
          The rule identifier is the first present of `matching_service_rule_id`,
          `detector_id`, `bioc_id`, `rule_id`, then the Issues API's
          `detection.rule_id`; the source is `source`, `alert_source`, then
          `detection.method`; the case is `incident_id`, `case_id`, then `case_ids`
          (PR 179, 2026-11-10).
        ref: core/connectors/xsiam.py:409 ; core/connectors/xsiam.py:415
      - assumption: >-
          The alert's `source` string ("XDR BIOC", "XDR Analytics BIOC",
          "Correlation", ...) maps onto one signal family, and a pair whose families
          differ never matches; the default match window is 3600 s.
        ref: core/connectors/matcher.py:32
      - assumption: >-
          `signal_family` maps both human-readable source strings and the Issues
          API's `detection.method` codes: ANALYTICS_BIOC to `abioc`, TRAPS to
          `prevention`, MAGNIFIER to `analytics`; FW maps to no family. Before PR 179
          ANALYTICS_BIOC read as `analytics` and TRAPS as nothing. TRAPS = XDR Agent
          and MAGNIFIER = XDR Analytics rest on the order of two lists on the docs
          page, which is an inference.
        ref: core/connectors/matcher.py:70
    contrasts:
      - vs: INC
        point: >-
          ALR is the shape of one alert as the API returns it; INC decides which
          alerts share a case. A correct case can still be scored wrong if the alert
          fields it carries are misread.

  - id: IDN
    name: Identity resolution (CGO ownership, Cloud Identity Engine, Active Directory)
    summary: >-
      How Cortex decides who an event, a chain or an alert belongs to: the user
      fields on each process scope of a causality chain, the directory identity the
      Cloud Identity Engine (CIE) syncs into `pan_dss_raw`, and the Kerberos and
      logon events a domain controller produces. CortexSim plants identity three
      ways: the identity harness runs Linux steps as service accounts, the AD and
      IdP emitters POST shape-true logon records, and the identity-lab design builds
      a real domain joined to CIE. Whether any of these reaches an identity
      detector is unproven.
    known:
      - fact: >-
          `pan_dss_raw` is the dataset for Active Directory via the Cloud Identity
          Engine, and a tenant without CIE set up has no such dataset.
        source:
          kind: public_doc
          ref: https://cortex-docs.paloaltonetworks.com/cortex-xsiam/reference-and-developer-docs/cortex-agentix-xql/get-started-with-xql/datasets-and-presets.md
          date: "2026-11-11"
      - fact: >-
          CIE supports on-premises Microsoft Active Directory and OpenLDAP; its agent
          runs on Windows Server 2016–2025 and needs SSL decryption off for its
          traffic. Linking CIE to the tenant is required to activate the Identity
          Analytics detection rules.
        source:
          kind: public_doc
          ref: https://docs.paloaltonetworks.com/identity/release-notes/cloud-identity-engine/cloud-identity-engine-release-notes-welcome/cloud-identity-engine-release-notes-system-requirements ; https://cortex-docs.paloaltonetworks.com/cortex-xsiam/onboard-cortex-xsiam/deployment-steps/set-up-cloud-identity-engine
          date: "2026-11-11"
      - fact: >-
          "Possible Kerberoasting attack" requires both the XDR agent and the XDR
          agent with eXtended Threat Hunting (XTH), with a 14-day activation and a
          30-day training period.
        source:
          kind: public_doc
          ref: https://cortex-docs.paloaltonetworks.com/analytics-alerts/alerts-by-name/possible-kerberoasting-attack
          date: "2026-11-11"
      - fact: >-
          A Linux local user appears in xdr_data as `<hostname>\<user>`
          (`pov-target-01\www-data`). Both `runuser -u www-data -- …` and `systemd-run
          --uid=www-data …` made the child's action_process_username
          `pov-target-01\www-data` while runuser itself stayed root; the CGO's
          causality_actor_effective_username was null in every case.
        source:
          kind: lab_observation
          ref: Lab tenant, XDR agent 9.4.0.470, Ubuntu 24.04, probe run 19c7a04d (token pmqfba025), cases id1–id3, 2026-11-11
          date: "2026-11-11"
    assumes:
      - assumption: >-
          Linux identity steps run through `runuser -l <user> -c`, `sudo -u` or `su -s
          /bin/bash`; `runuser -l` needs the account to have a login shell, which
          www-data on a stock Ubuntu does not.
        ref: agent/identity/harness.go:7
      - assumption: >-
          On Windows every non-direct identity collapses to `direct` and is recorded
          as IDENTITY NOT HONOURED, so a pulled Windows step runs as the beacon's
          service account.
        ref: agent/identity/platform.go:212
      - assumption: >-
          The AD emitter POSTs Windows Security events (4769, 4624, …) to a collector
          under the dataset name `msft_windows_security`; nine cards read that
          name, and none reads `pan_dss_raw`.
        ref: core/eal_simulator/plugins/ad_windows_emitter.py:66
      - assumption: >-
          The IdP emitter names its dataset in the record body (`okta_sso`) and plants
          the shared principal as the canary token.
        ref: core/eal_simulator/plugins/idp_signin_emulator.py:146 ; core/eal_simulator/stitch_params.py
      - assumption: >-
          The only domain CortexSim can build is the AWS `itdr` module; 14 scenarios
          need a domain.
        ref: infra/modules/aws/itdr
    contrasts:
      - vs: STI
        point: >-
          Stitching links records from different sensors into one story; identity
          resolution decides which directory identity a user string on any record
          is. A record can stitch on its 5-tuple with no identity resolved, and two
          records about one person can resolve without ever stitching.
      - vs: INC
        point: >-
          Case grouping uses UserName as one artifact among several; identity
          resolution decides whether `CORP\alice`, `alice@corp.local` and an Okta
          login are one UserName. A miss here splits a case that should be one.
      - vs: CAU
        point: >-
          Causality names the CGO process; identity says who owns each process in the
          chain. On the lab host the CGO had no user at all while its descendants did.

  - id: NGF
    name: NGFW sensor configuration (what the firewall must be set to emit)
    summary: >-
      Everything on the firewall that decides whether an NGFW record exists in the
      tenant at all: which security rule a session matches (first match wins), the
      profile group that rule carries and whether each profile alerts or blocks,
      the log forwarding profile and the log types it sends, Enhanced Application
      Logging, the logging-service connection, decryption, NAT and User-ID / Cloud
      Identity Engine. A scenario that expects "the firewall will see it" is making
      a claim about this config, and CortexSim checks none of it today.
    known:
      - fact: >-
          With logging-service forwarding enabled and the rule's log forwarding
          profile sending threat logs, a DNS Security threat log written by a PA-440
          reached panw_ngfw_threat_raw about 12 s later (_time 02:17:50Z, log_time
          02:18:02Z), carrying is_nat=true and dest_port 53.
        source:
          kind: lab_observation
          ref: Henry's PA-440 lab, tenant deathstar, XQL on panw_ngfw_threat_raw for the lab K3s control-plane node's source IP
          date: "2026-11-10"
      - fact: >-
          Security rules match first-hit. An outbound any-application any-service
          allow rule placed above an "alert-all" profile rule made that rule
          unreachable for outbound traffic: it only ever matched inbound and
          intrazone sessions, so lab egress ran under a block-and-log profile group.
        source:
          kind: lab_observation
          ref: PA-440 rulebase and 24 h traffic logs for the two lab K3s nodes
          date: "2026-11-10"
      - fact: >-
          An anti-spyware profile whose signature rules were all `alert` still
          dropped the DNS Security test domains test-c2.testpanw.com and
          test-malware.testpanw.com, because its DNS Security category actions were
          left at `default`. Category actions are set separately from signature
          rules. The drop was still logged as a threat (thr_category dns-c2 and
          dns-malware); a profile using `sinkhole` logged the same domains with
          action sinkhole.
        source:
          kind: lab_observation
          ref: PA-440 threat logs 21:15:20 and 21:17:50 EST, profiles hr-spyware-alertall and user-url
          date: "2026-11-10"
      - fact: >-
          With no SSL decryption, the firewall cannot see file content inside HTTPS,
          so file-based AV or WildFire tests must use plain HTTP. The official EICAR
          download is served over HTTPS only, so fetching it produces no NGFW AV log
          on a firewall that does not decrypt.
        source:
          kind: public_doc
          ref: https://www.eicar.org/download-anti-malware-testfile/ (download area offered over HTTPS)
          date: "2026-11-10"
      - fact: >-
          Downloading the four public WildFire test samples
          (wildfire.paloaltonetworks.com/publicapi/test/{pe,apk,macos,elf}) over HTTPS
          through a firewall that does not decrypt produced only traffic logs:
          four sessions to one destination on 443, App-ID paloalto-wildfire-cloud,
          s_encrypted=1, 19 KB to 1.5 MB received each, and no threat or WildFire log.
        source:
          kind: lab_observation
          ref: SIM-CDR-012 pull run from a lab beacon through the PA-440, 2026-11-11 02:58:52Z
          date: "2026-11-10"
      - fact: >-
          Subdomains of testmynids.org resolved through a DNS Security-enabled
          anti-spyware profile raise threat id `new:testmynids.org`
          (thr_category dns-new-domain, severity low to informational). Under a
          profile whose newly-registered-domain action is alert, each distinct
          query name produced one threat log carrying the full 5-tuple; under a
          sinkhole profile the query was answered with sinkhole.paloaltonetworks.com.
        source:
          kind: lab_observation
          ref: SIM-NDR-009 pull run from a lab beacon, 15 distinct *.exfil.testmynids.org names, 2026-11-11 02:59Z
          date: "2026-11-10"
      - fact: >-
          Traffic from a libvirt NAT guest is logged with the hypervisor's LAN IP as
          its source; the guest's own address (192.168.122.0/24) never appears in
          firewall logs. The guest's XDR agent reports the guest address, so its
          NGFW and agent records carry different source IPs.
        source:
          kind: lab_observation
          ref: PA-440 traffic logs, 0 sessions from libvirt's default 192.168.122.0/24; lab target VM behind the hypervisor's virbr0 NAT
          date: "2026-11-10"
      - fact: >-
          A Cortex XDR agent running as a Kubernetes DaemonSet with host networking
          reports the node's LAN IP, which is the same pre-NAT source IP the
          firewall logs for that node.
        source:
          kind: lab_observation
          ref: K3s DaemonSet pods cortex-xdr/cortex-agent-* on both lab K3s nodes, agent IP = node IP
          date: "2026-11-10"
      - fact: >-
          An NGFW DNS Security threat log for a host produced an NGFW-only issue in
          the tenant ("generic C2 / generic DNS"). It was not grouped with an agent
          issue because the agent raised none: an EICAR file written to /tmp on a
          Linux DaemonSet-agent host was still present and un-alerted 20 s later.
          One-sided evidence cannot test stitching.
        source:
          kind: operator_report
          ref: Henry, tenant deathstar case view after the K3s-node test, 2026-11-10 20:23 CST
          date: "2026-11-10"
    assumes:
      - assumption: >-
          Synthetic NGFW threat records may only carry action alert or allow;
          block-class actions are refused. A real lab firewall running block
          profiles writes drop, reset or sinkhole, which the synthetic contract
          never produces, so the two shapes differ in the action field.
        ref: core/eal_simulator/plugins/ngfw_threat_emitter.py:162
      - assumption: >-
          Synthetic NGFW records default the source user to corp\cortexsim-canary
          and the source address to 10.0.12.34. A firewall with no User-ID or Cloud
          Identity Engine mapping logs no user at all.
        ref: core/eal_simulator/plugins/ngfw_eal_emitter.py:83 ; core/eal_simulator/plugins/ngfw_threat_emitter.py:45
      - assumption: >-
          The NDR IaC module's VM-Series path documents HTTP log forwarding to a lab
          collector. Nothing in the repo describes the logging-service path a
          customer firewall actually uses for XSIAM (CSP registration, device
          certificate, logging-service region, log forwarding profile, profile
          actions, rule order, decryption, User-ID).
        ref: infra/modules/aws/ndr/README.md:27
    contrasts:
      - vs: ING
        point: >-
          NGF decides whether the firewall writes and forwards a record; ING
          decides what the tenant does with it once received. A missing NGFW record
          is usually an NGF problem (wrong rule, block profile, no decryption) that
          looks like an ING problem.
      - vs: STI
        point: >-
          NGF decides which identity fields an NGFW record carries (pre-NAT source,
          NAT fields, user). Stitching can only join on fields that are there, so a
          NAT guest or a missing User-ID mapping breaks the join before the engine
          ever runs.

questions:

  # ── ING — ingestion, parsing, XDM ────────────────────────────────────────────
  - id: PM-ING-01
    mechanism: ING
    priority: P0
    status: open
    question: >-
      When the HTTP log collector (cloud /logs/v1/event or Broker VM HTTP applet)
      returns 2xx, is the record guaranteed to be parsed into its dataset, or can it
      be accepted and then dropped by the parsing rule (bad JSON, missing or
      unparseable timestamp, oversize field)? Where does a dropped record become
      visible (an error dataset, a collector health metric, nowhere)?
    context: >-
      delivery.py counts 2xx as delivered. If accepted is not the same as parsed,
      every "delivered" campaign verdict can hide an empty dataset.
    lever: >-
      Add a post-delivery canary row-count probe before a step may claim
      `delivered`; add a parse-failure code to the delivery taxonomy.
    decides:
      - if: 2xx guarantees parse
        then: Keep the delivery verdict; document it as proven.
      - if: accepted can still be dropped
        then: Split `accepted` from `landed` in the verdict; landed requires an XQL hit on the canary.
    experiment: >-
      POST one well-formed and one malformed record carrying distinct canaries to a
      lab collector; query both canaries after 10 minutes.
    affects: ["core/eal_simulator/delivery.py", "all collector-POST emitters"]

