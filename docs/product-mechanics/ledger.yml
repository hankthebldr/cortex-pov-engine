  # ── ANA — analytics engine ───────────────────────────────────────────────────
  - id: PM-ANA-01
    mechanism: ANA
    priority: P0
    status: open
    question: >-
      For each analytics alert we bind (Port Scan, Port Sweep, Failed Connections,
      Impossible traveler - VPN, VPN login Brute-Force attempt, A user connected to
      a VPN from a new country, A user connected from a new country, Abnormal
      increase in network-related alerts on the same host): what is the trigger in
      generatable terms: minimum event count, minimum distinct values (distinct dst
      ports, hosts, countries), inside what window?
    context: >-
