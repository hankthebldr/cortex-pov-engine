  - id: PM-INC-05
    mechanism: INC
    priority: P0
    status: open
    question: >-
      Does the Medium-severity floor for case creation and grouping apply to issues
      from every source (custom BIOC, Analytics BIOC, Analytics, IOC, XDR agent
      prevention, third-party ingested alerts), or only to correlation-rule issues,
      where the docs state it? Is Informational treated like Low?
    context: >-
      The docs state the floor on the correlation-rule page; Henry reports it more
      broadly (INC known). 55 scenarios declare required_planes_in_incident, and
      the built-in alerts the lab raised were Low (ABI known). If the floor is
      universal, any plane whose alert is below Medium can never be under the
      case, and the correlation-rate KPI scores that as a miss.
    lever: >-
      A severity floor on every detection a scenario counts toward
      required_planes_in_incident (a loader lint); a `not_groupable` reading in the
      correlation-rate KPI for below-floor alerts instead of a miss; card severities
      raised to Medium where a scenario needs grouping.
    decides:
      - if: the floor applies to every source
        then: Add the lint and the not_groupable reading; raise the 16 below-Medium card detections or drop them from required planes.
      - if: it applies to correlation issues only
        then: Record the per-source rule and enforce it only for Correlation detections.
    experiment: >-
      On one host, raise a custom BIOC at Low, the same BIOC cloned at Medium, and
      a Medium correlation issue sharing the host; see which issues the case holds.
    affects: ["core/connectors/measures.py", "core/engine/scenario_loader.py", "scenarios/multi_plane/", "detection_scanner/ttps (biocs[].severity)"]

  - id: PM-INC-06
    mechanism: INC
    priority: P1
    status: open
    question: >-
      Which severity does case creation read: the rule's configured severity, or
      the issue's severity after scoring or automation changes it? If an issue is
      raised from Low to Medium after it fired, does it then create or join a case?
    context: >-
      The 209 card correlation rules carry no severity (INC assumes), so the DC
      chooses one at import. If severity can be fixed after the fact, a wrong
      import choice is recoverable; if not, it silently decides the KPI.
    lever: Import runbook (set severity before enabling); whether card correlation rules must carry a severity.
    affects: ["detection_scanner/ttps (correlation_rules[])", "docs/operator-runbook.md"]

  - id: PM-INC-07
    mechanism: INC
    priority: P1
    status: open
    question: >-
      Grouping also needs the issue's domain to be Security or Posture. Which
      domain do custom BIOCs, imported correlation rules and third-party ingested
      alerts get by default, and can the domain be set when a rule is created or
      imported?
    context: >-
      An issue outside those domains never groups, whatever its severity, and our
      cards record no domain.
    lever: Card correlation_rules[] and biocs[] gain `domain` (with `severity`); import runbook.
    affects: ["detection_scanner/ttps (correlation_rules[])", "docs/operator-runbook.md"]

  - id: PM-INC-08
    mechanism: INC
    priority: P1
    status: open
    question: >-
      The User name grouping artifact excludes "common system accounts" and "known
