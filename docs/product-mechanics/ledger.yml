  # ── CAU — causality / CGO ────────────────────────────────────────────────────
  - id: PM-CAU-01
    mechanism: CAU
    priority: P0
    status: open
    question: >-
      How does the causality engine choose the CGO? Which processes count as
      causality boundaries (services, shells spawned by services, remote sessions,
      the agent's own children)? When our beacon, running as a systemd service,
      spawns `sh -c`, which process becomes the CGO of the chain?
    context: >-
      cgo_anchor names a realistic owner (apache2, winword.exe), but the on-wire CGO
      is decided by the engine, and mechanics-review H3 says it reads `sh`.
    lever: Whether cgo_anchor needs a real exec-as-service path or an honest relabel.
    affects: ["core/engine/causality_graph.py", "agent/beacon", "scenarios (cgo_anchor)"]

  - id: PM-CAU-02
    mechanism: CAU
    priority: P0
    status: open
    question: >-
      Does the agent record process image name from the executable (/proc/pid/exe,
      comm) or from argv[0]? Confirm whether an argv[0] rewrite changes
      causality_actor_process_image_name or action_process_image_name.
    context: H3 asserts it does not; that claim is unverified against the product.
    lever: "H3's fix: real exec vs relabel."
    experiment: >-
      Run `exec -a apache2 sh -c 'id'` under the beacon; read actor and causality
      image fields for the event.
    affects: ["docs/reference/mechanics-review-2026-07.md (H3)"]

  - id: PM-CAU-03
    mechanism: CAU
    priority: P1
    status: open
    question: >-
      Do privilege-transition wrappers (runuser, sudo, su, setpriv) continue a
      causality chain or start a new one? Do they appear as nodes, and does the
      user change alter the causality actor's primary username?
    context: Every Linux identity-harness step is wrapped (harness.go:53).
    lever: Identity harness wrapper choice (M5's clean-descent alternative).
    affects: ["agent/identity/harness.go"]

  - id: PM-CAU-04
    mechanism: CAU
    priority: P0
    status: open
    question: >-
      Does the agent drop, sample, throttle or collapse process-start events: very
      short-lived processes, known system binaries, or several identical starts
      (same parent, image and command line) inside a short window? If so, what are
      the window and the count, and are the children of a dropped process dropped
      with it?
    context: >-
      Raised from P1 on lab evidence (CAU known, 2026-11-10): three identical `sh`
      starts from the beacon within about 100 ms vanished with all their children,
      taking steps 3–5 of SIM-EDR-003 with them, while the same commands spaced 2 s
      apart in one shell were all recorded. Each step is a fresh `sh` with the same
      argv[0] (`apache2`, the CGO masquerade), so every multi-step scenario looks
      like a burst of identical starts.
    lever: >-
      Inter-step pacing in the beacon (a minimum gap between step launches), or
      giving each step a distinct parent or command line; whether a missing step is
      scored `missed` or `not_recorded`.
    decides:
      - if: identical rapid starts are throttled or deduplicated
        then: Add a minimum inter-step gap above the window to the beacon, and stop scoring steps the agent never recorded as missed.
      - if: nothing is dropped by design
        then: Treat the lab loss as a collection fault; check agent mode and resource limits before relaunching.
    experiment: >-
      Launch 5 identical `sh -c 'id'` from one parent at 0, 50, 200, 500 and 1000
      ms spacing; count the process events per spacing in xdr_data.
    affects: ["agent/beacon", "agent/executor/script.go", "scenarios (step commands)", "core/engine/outcome.py"]

  - id: PM-CAU-05
    mechanism: CAU
    priority: P1
    status: open
    question: >-
      For a process launched by cron, a systemd timer or a scheduled task, what
      becomes the CGO: the scheduler, or the launched process?
    context: Persistence scenarios (SIM-CDR-006, SIM-EDR-003) expect the persisted payload to own its chain.
    lever: Persistence scenario detection expectations.
    affects: ["scenarios/cdr/", "scenarios/edr/"]

  - id: PM-CAU-06
    mechanism: CAU
    priority: P2
    status: open
    question: >-
      In containers, is the runtime (containerd-shim, runc) a causality boundary,
      and is container identity populated on every event type (process, file,
      network)?
    context: CDR scenarios key on container_id.
    lever: CDR detection keys.
    affects: ["scenarios/cdr/"]

  - id: PM-CAU-07
    mechanism: CAU
    priority: P0
    status: open
    question: >-
      On Linux hosts running systemd 255 or later, where services start through
      `systemd-executor` executed from a file descriptor, the agent records the CGO
      of every service-started chain as image name `9`, path `/proc/self/fd/9`, the
      SHA-256 of empty input and a null user (CAU known, 2026-11-11). Is that the
      intended CGO for these hosts? Do ABIOCs, the causality view and the Causality
      grouping artifact then treat every service-started chain on the host as owned
      by the same unnamed process, and does an agent version or setting resolve the
      executor to the service binary it becomes?
    context: >-
      Every pulled step, every beacon-started transient unit, and 124 of 150
      `causality_actor_process_image_name` predicates in the cards assume a named
      CGO (cortexsim-agent, apache2, nginx, …). On Ubuntu 24.04 none of those
      names can appear, so each such predicate is unsatisfiable however the step is
      launched. Ubuntu 24.04 is the default lab image.
    lever: >-
      A Linux target preflight that reads the host's systemd version; whether cards
      may key on causality_actor_process_image_name for systemd-started chains;
      whether CGO-anchored scenarios must launch from a non-systemd spawner such as
      cron (whose chains had CGO `cron`).
    decides:
      - if: Expected behaviour, no setting changes it
        then: Cards key on actor_process_* and action_process_* only for Linux service chains; preflight warns on systemd >= 255; cgo_anchor reads as a label, never a claim.
      - if: An agent version or setting names the real binary
        then: Preflight gates CGO-dependent scenarios on that version or setting and records it per run.
    experiment: >-
      Repeat probe pmqfba025 (beacon step, systemd-run with a renamed ExecStart,
      cron) on Ubuntu 22.04 (systemd 249) and Ubuntu 24.04 (systemd 255) with the
      same agent version; compare causality_actor_process_image_name, path and
      sha256 per case.
    affects: ["agent/executor/platform_unix.go", "detection_scanner/ttps", "core/engine/causality_graph.py", "scenarios (cgo_anchor)"]

  - id: PM-CAU-08
    mechanism: CAU
    priority: P1
    status: open
    question: >-
      Is a CGO's identity frozen at the process start the agent observed (so a
      process that later execs into another binary keeps its first image name), and
      is a process that was already running when the agent started recorded under
      its current image instead? Concretely: a beacon started before the XDR agent
      was installed was recorded as CGO `cortexsim-agent`; the same beacon
      re-enrolled after the agent was running was recorded as CGO `9`.
    context: >-
      The two readings come from two lab sessions on pov-target-01 (2026-11-10, beacon
      installed before the agent; 2026-11-11, re-enrolled after). If start order
      decides the CGO, the same scenario scores differently depending on when the
      DC installed the beacon relative to the XDR agent.
    lever: >-
      The install order the onboarding runbook prescribes (beacon before or after
      the XDR agent, or a beacon restart after agent install), and a run-record
      field naming the CGO actually observed.
    experiment: >-
      With the agent running, start the beacon from systemd, then restart the XDR
      agent and run one step; then restart the beacon and run one step. Compare
      causality_actor_process_image_name across the three steps.
    affects: ["agent/beacon", "core/api/agents.py", "docs/reference/api-and-agent-surface.md"]

  # ── BIO — BIOC matching ──────────────────────────────────────────────────────
  - id: PM-BIO-01
    mechanism: BIO
    priority: P0
    status: open
    question: >-
      When a BIOC matches on a command line, which process's command line is
      evaluated (actor, action/child, causality actor), and does it see the full
      argv including our identity wrapper (`runuser -l www-data -c '<ttp>'`)?
    context: >-
      A starts-with or exact-match predicate on the TTP command fails if the
      evaluated string is the wrapper's command line.
    lever: Identity wrapper form; how card BIOC logic is written (contains vs starts-with).
    affects: ["agent/identity/harness.go", "detection_scanner/ttps (biocs[])"]

  - id: PM-BIO-02
    mechanism: BIO
    priority: P0
    status: open
    question: >-
      For Windows steps executed as `powershell.exe -EncodedCommand <base64>`, do
      BIOC/ABIOC command-line conditions see the decoded script anywhere (script
      block logging, AMSI events, a decoded field), or only the base64 argument?
    context: >-
      Every Windows pull step uses -EncodedCommand (platform_windows.go:40). If
      detectors see only base64, every command-line-keyed Windows detection is a
      manufactured miss.
    lever: >-
      Windows execution form: keep -EncodedCommand, switch to -File with a staged
      .ps1, or -Command.
    decides:
      - if: decoded script is visible to detectors
        then: Keep the wrapper; document which event carries the decoded text.
      - if: only base64 is visible
        then: Change the executor to stage a .ps1 and run -File; re-verify Windows cards.
    experiment: >-
      Run one Windows step both ways (-EncodedCommand vs -File) with a BIOC keyed on
      a distinctive string.
    affects: ["agent/executor/platform_windows.go", "agent/executor/script.go", "71 Windows-declaring scenarios"]

  - id: PM-BIO-03
    mechanism: BIO
    priority: P1
    status: open
    question: >-
      Are BIOC string comparisons case-sensitive? Which operators are supported
      (contains, wildcard, regex)? How are quoting, escaping and whitespace
      normalized in action_process_image_command_line?
    context: Bash quoting in our steps produces several equivalent command-line forms.
    lever: Command forms emitted by steps; card BIOC logic.
    affects: ["detection_scanner/ttps (biocs[])"]

  - id: PM-BIO-04
    mechanism: BIO
    priority: P1
    status: open
