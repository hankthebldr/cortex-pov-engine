# Product-mechanics ledger — the source of truth for HOW Cortex turns signal into a
# detection, and for the questions we still owe about it.
#
# Read docs/product-mechanics/README.md first. Short version:
#   * `known`     — facts with a crossable source (public doc, public KB, our own lab
#                   observation, an operator report). NEVER internal-only material:
#                   this repo is public and the vault forbids it (vault SOP, Hosts table).
#   * `assumes`   — what CortexSim does TODAY, with a code/doc ref. An assumption is
#                   not a fact; most questions below exist to confirm or kill one.
#   * `contrasts` — "how this works vs how that works", stated as our working model.
#   * `questions` — each one names the generator lever its answer moves.
#
# Edit this file, then:  .venv/bin/python scripts/product_mechanics.py render --apply
# Answers never live here — they are immutable records under answers/ and the
# effective status of a question is derived from them at render time.

schema_version: 1
updated: "2026-11-05"

mechanisms:

  - id: ING
    name: Ingestion, parsing and XDM modeling
    summary: >-
      Everything between "the emitter POSTed a record" and "a detector can read it":
      the HTTP log collector (cloud /logs/v1/event or the Broker VM HTTP applet),
      dataset routing, the parsing rule, the `_time` the record is filed under, and
      the XDM modeling rule that maps raw fields onto the common schema. A record
      that is accepted but never lands, or lands under the wrong time or dataset, is
      a silent false negative at every layer above it.
    known: []
    assumes:
      - assumption: >-
          A 2xx from the collector means the record was delivered; delivery is
          accounted per record and nothing above 2xx counts.
        ref: core/eal_simulator/delivery.py:45
      - assumption: >-
          Analytics-family emitters put a top-level `dataset` hint in the body, as if
          the body can steer dataset routing.
        ref: core/eal_simulator/analytics_emitter.py:354
      - assumption: >-
          XDM modeling rules are a normalization substrate, surfaced and exported but
          counted informationally, not as a detection type.
        ref: detection_scanner/ttps (detections.modeling_rules[], 5 cards)
    contrasts:
      - vs: STI
        point: >-
          Ingestion decides whether a record exists and what it is called; stitching
          decides whether two existing records are about the same activity. A
          stitching failure can be an ingestion failure in disguise (wrong field
          name, wrong `_time`).

  - id: STI
    name: Stitching (data fusion across sources)
    summary: >-
      The engine that links records from different sensors (agent network events,
      NGFW sessions, identity logs, cloud audit) into one story. Our working model:
      a join on shared entities, chiefly the network 5-tuple for network-endpoint,
      inside a time tolerance. Henry confirmed in practice that the source half has
      to match what the agent recorded and the destination half has to match the
      firewall transaction. Which fields, which side of NAT and what tolerance are
      still unconfirmed.
    known:
      - fact: >-
          Network-endpoint stitching did not occur until src IP, src port, dst IP,
          dst port and protocol were made consistent: source as the endpoint (agent)
          records it, destination as the firewall transaction records it.
        source:
          kind: operator_report
          ref: Henry, design conversation 2026-11-05 (lab evidence not attached)
          date: "2026-11-05"
    assumes:
      - assumption: >-
          A cross-source join on the shared 5-tuple (or container_id, or src_host)
          within a tight temporal window is how Cortex stitches network and endpoint.
        ref: docs/reference/causality-graph-methodology.md#12-network--cross-plane-log-stitching-and-the-5-tuple
      - assumption: >-
          One deterministic 5-tuple per run is resolved and projected into every
          channel's vocabulary (nine entity keys).
        ref: core/engine/stitch_context.py:75
      - assumption: >-
          An in-process EAL emitter cannot share a 5-tuple with the agent because it
          POSTs from SimCore; only the identity principal (canary_token) is injected.
          NOTE: ngfw_eal_emitter has since gained src_ip/src_host/dst_ip/dst_port
          overrides that the stitch adapter does not yet use.
        ref: core/eal_simulator/stitch_params.py:7 ; core/eal_simulator/plugins/ngfw_eal_emitter.py:282
      - assumption: >-
          SIM-MP-006 stitches NGFW and container endpoint on 5-tuple + container_id
          inside 10 s, but its endpoint query groups by action_local_ip,
          action_remote_ip, action_remote_port and omits the local port.
        ref: scenarios/multi_plane/mp-006-ngfw-container-causality-stitch.yml:131
      - assumption: >-
          `stitching_key` is one of src_host | session_id | user_principal |
          container_id; in the corpus it is src_host 28x, user_principal 13x and a
          long tail, and `correlation_window_seconds` ranges 10 s to 86400 s against
          "XSIAM's default correlation window".
        ref: scenarios/_schema.yml:380
    contrasts:
      - vs: INC
        point: >-
          Stitching links RECORDS (raw telemetry) into one activity; incident
          grouping links ALERTS into one incident. Our scenarios blend the two:
          `stitching_key` and `required_planes_in_incident` sit side by side. They
          may key on different things.
      - vs: COR
        point: >-
          Stitching happens without anyone writing a rule; a correlation rule is an
          authored scheduled query that can join datasets itself. A correlation rule
          can reproduce a join the fusion engine never made.

  - id: CAU
    name: Causality and the Causality Group Owner (CGO)
    summary: >-
      The agent-side engine that assembles a process tree per chain, names one CGO
      as the owner, and gives every event in the chain one causality_id. Alerts
      inherit the causality_id of the node they fire on. Which process becomes the
      CGO decides what the chain is "about" and what rare-parent logic sees.
    known: []
    assumes:
      - assumption: >-
          `causality_id` on xdr_data is the join key for a chain; three actor scopes
          (causality_actor_*, actor_process_*, action_process_*) map to CGO, parent,
          child.
        ref: docs/reference/causality-graph-methodology.md#11-endpoint-the-causality-instance-ci-graph-and-the-cgo
      - assumption: >-
          An argv[0] rewrite does NOT change comm or /proc/pid/exe, so
          causality_actor_process_image_name stays `sh` even when cgo_anchor names
          apache2.
        ref: docs/reference/mechanics-review-2026-07.md (H3)
      - assumption: >-
          Every Linux step runs through an identity wrapper (runuser / sudo / su),
          which is itself an unnatural parent for service-account activity.
        ref: agent/identity/harness.go:53 ; docs/reference/mechanics-review-2026-07.md (M5)
    contrasts:
      - vs: STI
        point: >-
          Causality is built on the endpoint from OS process lineage; stitching is
          built in the cloud across sensors. A chain can be perfectly causal and
          still never stitch to its firewall session.

  - id: BIO
    name: BIOC matching
    summary: >-
      Behavioral IOC rules: a predicate over agent event fields (process image,
      command line, file path, registry key, network fields, actor scopes). Our
      working model is deterministic matching on the event, no baseline. 365 BIOCs
      across the card corpus, 40 of which carry a suppression window.
    known: []
    assumes:
      - assumption: >-
          Windows steps run as `powershell.exe -EncodedCommand <base64>` wrapped in
          an exit-code shim, so the visible command line is the base64 blob.
        ref: agent/executor/platform_windows.go:40 ; agent/executor/script.go:134
      - assumption: >-
          Linux command lines carry the identity wrapper prefix, e.g.
          `runuser -l www-data -c '<ttp>'`.
        ref: agent/identity/harness.go:53
      - assumption: >-
          A BIOC card entry is `{name, description, logic, severity,
          mitre_technique_ids, suppression_window_seconds?}`.
        ref: detection_scanner/ttps/*.json (detections.biocs[])
    contrasts:
      - vs: ABI
        point: >-
          A BIOC is a rule someone wrote; it fires the first time its predicate
          matches. An ABIOC is PANW-authored behavioral logic that judges rarity in
          context, so the same event can fire one and not the other.
      - vs: IOC
        point: >-
          An IOC matches a value (hash, IP, domain); a BIOC matches a behavior. A
          renamed tool defeats a filename-keyed BIOC and does not defeat a hash IOC;
          a recompiled tool does the reverse.

  - id: ABI
    name: ABIOC (analytics BIOC)
    summary: >-
      PANW-authored, auto-tuned behavioral detections evaluated over causality
      chains. Our working model: they weigh rarity of a behavior in its causal
      context, which makes lab size, tenant history and repetition matter in ways a
      BIOC does not. 164 ABIOCs across the card corpus.
    known: []
    assumes:
      - assumption: >-
          An ABIOC card entry adds `behavioral_profile` and `causality_anchor` to the
          BIOC shape.
        ref: detection_scanner/ttps/*.json (detections.abiocs[])
      - assumption: >-
          The matcher's single 3600 s default window is too tight for
          Analytics/ABIOC.
        ref: core/connectors/matcher.py:32 ; docs/reference/mechanics-review-2026-07.md (M12)
    contrasts:
      - vs: ANA
        point: >-
          Analytics alerts publish activation/training periods and judge an entity
          against its own profile over time; whether ABIOCs need a training period
          at all is unknown (PM-ABI-01).

  - id: ANA
    name: Analytics engine (profiles, baselines, thresholds)
    summary: >-
      Detectors that judge activity against a learned profile: port scans, failed
      connections, impossible travel, new country, brute force. The vendor alert
      pages publish severity, activation, training, test and dedup periods and the
      data sources that feed each alert, and they publish no threshold and no
      predicate. "Five occurrences of the same src/dst" is exactly the class of
      fact we do not have.
    known:
      - fact: >-
          Each bound analytics alert publishes Activation Period, Training Period,
          Test Period, Deduplication Period and a Required Data OR-set of data
          sources. All eight transcribed alerts state activation 14 days and training
          30 days.
        source:
          kind: public_doc
          ref: https://cortex-docs.paloaltonetworks.com/analytics-alerts/alerts-by-name/ (per-alert pages, transcribed in core/eal_simulator/analytics_alerts.py)
          date: "2026-09-20"
      - fact: >-
          No analytics alert page publishes a numeric threshold, a dataset field
          name or the detection predicate itself.
        source:
          kind: public_doc
          ref: core/eal_simulator/analytics_alerts.py (module docstring)
          date: "2026-09-20"
    assumes:
      - assumption: >-
          The arming gate is max(activation, training) — OUR inference, labelled
          `inferred:` in every verdict.
        ref: core/eal_simulator/analytics_alerts.py:78
      - assumption: >-
          Readiness depends on an operator-typed onboarding date per data source;
          unknown is never armed.
        ref: core/eal_simulator/analytics_alerts.py:325
    contrasts:
      - vs: BIO
        point: >-
          A BIOC can fire on a fresh tenant on the first event; an analytics alert
          can be "not armed" for weeks and read as a miss.
      - vs: COR
        point: >-
          A correlation rule's threshold is in its XQL and we can read it; an
          analytics threshold is not published, so volume and spread are guesses
          until answered.

  - id: COR
    name: Correlation rules
    summary: >-
      Authored, scheduled XQL that produces alerts, can join datasets, and is the
      mechanism behind most of our cross-plane `Correlation` detections (209 across
      the card corpus; the coverage gate holds the corpus at a 10 % Correlation
      share). Schedule, lookback and time basis decide whether a run is ever inside
      an evaluated window.
    known: []
    assumes:
      - assumption: >-
          `correlation_window_seconds` is "the ±N second window inside which signals
          must fire to qualify as stitched", enforced "against XSIAM's default
          correlation window" — values from 10 s to 86400 s in the corpus.
        ref: scenarios/_schema.yml:380
      - assumption: >-
          A correlation card entry is `{name, rule_id, logic}` with no schedule,
          time frame or suppression fields.
        ref: detection_scanner/ttps/*.json (detections.correlation_rules[])
    contrasts:
      - vs: STI
        point: >-
          See STI. A correlation rule can fire on a join the fusion engine never
          made, so a green correlation does not prove stitching.

  - id: IOC
    name: IOC matching and threat intel
    summary: >-
      Indicator-value matching (hash, IP, domain, URL) against agent and network
      data, fed by manually added indicators or TIM feeds. 410 IOCs across the card
      corpus, 353 of which declare `reputation_required`.
    known: []
    assumes:
      - assumption: >-
          IOC matches attach at the file/image (sha256) level of the causality graph.
        ref: docs/reference/causality-graph-methodology.md#11-endpoint-the-causality-instance-ci-graph-and-the-cgo
      - assumption: >-
          A TAXII feed (mocktaxii) plus matching outbound traffic produces a stitched
          IOC + NDR + EDR detection.
        ref: infra/modules/aws/tim ; scenarios/tim/
    contrasts:
      - vs: BIO
        point: See BIO.

  - id: PRV
    name: Prevention (agent modules, report vs block)
    summary: >-
      Agent-side modules that block in block mode and alert in report mode. Our
      outcome axis credits `prevented` only with two witnesses: a tenant alert
      saying Prevented AND a host-recorded kill of the step.
    known: []
    assumes:
      - assumption: >-
          `prevented` requires a tenant alert whose action reads prevented AND a
          host-recorded kill; a lost beacon can only read `pending`.
        ref: core/engine/outcome.py:28
      - assumption: >-
          A POV runs report mode then block mode on the same endpoint as a paired
          run, with an optional canary proving the block profile is real.
        ref: docs/reference/api-and-agent-surface.md (§1.3.1)
    contrasts:
      - vs: BIO
        point: >-
          Prevention acts inline on the endpoint before the event completes;
          detection evaluates the event after the fact. A prevented step may never
          produce the downstream events later steps expect.

  - id: INC
    name: Alert-to-incident grouping
    summary: >-
      The logic that groups alerts into incidents. Our correlation-rate KPI asserts
      ">= N distinct planes under one incident_id", so the grouping key, not the
      stitch, decides whether a multi-plane scenario scores.
    known: []
    assumes:
      - assumption: >-
          `required_planes_in_incident` planes must all be represented under one
          incident_id; the verifier asserts each in dataset=xdr_data.
        ref: scenarios/_schema.yml:385
    contrasts:
      - vs: STI
        point: See STI.

  - id: TEN
    name: Tenant readiness (content, entitlements, data collection)
    summary: >-
      The state of the tenant that decides whether a detector can fire at all:
      which content is enabled, which licence or add-on gates an engine, what the
      agent profile collects. A detector that is off reads exactly like a miss.
    known: []
    assumes:
      - assumption: >-
          /api/health makes zero outbound calls and lists reachability-shaped claims
          it does not make in `not_checked[]`.
        ref: core/api/health.py
      - assumption: >-
          POV scoping maps tenant entitlements to the corpus and emits upsell lists
          with PAN-* part numbers.
        ref: core/api/pov.py
    contrasts: []

questions:

  # ── ING — ingestion, parsing, XDM ────────────────────────────────────────────
  - id: PM-ING-01
    mechanism: ING
    priority: P0
    status: open
    question: >-
      When the HTTP log collector (cloud /logs/v1/event or Broker VM HTTP applet)
      returns 2xx, is the record guaranteed to be parsed into its dataset, or can it
      be accepted and then dropped by the parsing rule (bad JSON, missing or
      unparseable timestamp, oversize field)? Where does a dropped record become
      visible (an error dataset, a collector health metric, nowhere)?
    context: >-
      delivery.py counts 2xx as delivered. If accepted is not the same as parsed,
      every "delivered" campaign verdict can hide an empty dataset.
    lever: >-
      Add a post-delivery canary row-count probe before a step may claim
      `delivered`; add a parse-failure code to the delivery taxonomy.
    decides:
      - if: 2xx guarantees parse
        then: Keep the delivery verdict; document it as proven.
      - if: accepted can still be dropped
        then: Split `accepted` from `landed` in the verdict; landed requires an XQL hit on the canary.
    experiment: >-
      POST one well-formed and one malformed record carrying distinct canaries to a
      lab collector; query both canaries after 10 minutes.
    affects: ["core/eal_simulator/delivery.py", "all collector-POST emitters"]

  - id: PM-ING-02
    mechanism: ING
    priority: P0
    status: open
    question: >-
      How is the destination dataset chosen for an HTTP-collector record: by the
      collector instance's configured vendor/product, by a field in the body, or by
      the parsing rule? Does a top-level `dataset` field in the body have any effect?
    context: >-
      Analytics-family emitters send a top-level `dataset` hint
      (analytics_emitter.py:354). If routing is decided by the collector's
      vendor/product, the hint does nothing and a misconfigured collector sends every
      record to the wrong dataset while still returning 2xx.
    lever: >-
      Collector preflight checks vendor/product pairing per data source; drop or keep
      the body hint.
    experiment: >-
      Send identical records with different `dataset` hints through one collector;
      see which dataset each lands in.
    affects: ["core/eal_simulator/analytics_emitter.py", "GET /api/eal/campaigns/{id}/collectors"]

  - id: PM-ING-03
    mechanism: ING
    priority: P0
    status: open
    question: >-
      Which field becomes `_time` for each data source we emit, which formats are
      accepted, and what happens to a record whose timestamp is in the future or days
      in the past: rejected, clamped, or filed at ingestion time?
    context: >-
      Detectors window on time. A record filed under the wrong `_time` falls outside
      every correlation window and every analytics test period while looking
      perfectly ingested.
    lever: >-
      Emitter timestamp generation per data source; telemetry-replay of historical
      datasets; MTTD baselines.
    experiment: >-
      Emit three canary records stamped now, now-3d, now+1h; compare `_time` and
      `_insert_time` for each.
    affects: ["all collector-POST emitters", "infra/modules/aws/telemetry-replay"]

  - id: PM-ING-04
    mechanism: ING
    priority: P1
    status: open
    question: >-
      What is the typical and worst-case latency from collector acceptance to (a)
      queryable in XQL, (b) visible to BIOC evaluation, (c) visible to correlation
      rules, (d) visible to analytics engines?
    context: >-
      The matcher uses one 3600 s default window with per-type overrides
      (matcher.py:32). MTTD and "missed" both depend on these latencies.
    lever: Per-detection-type matcher windows; MTTD interpretation in the report.
    affects: ["core/connectors/matcher.py", "core/connectors/service.py"]

  - id: PM-ING-05
    mechanism: ING
    priority: P1
    status: open
    question: >-
      For third-party data sources, do analytics engines and correlation rules read
      the raw dataset or the XDM-modeled view? If XDM, which XDM fields must be
      populated for a record to be counted (e.g. xdm.source.ipv4, xdm.event.type,
      xdm.source.user.username)?
    context: >-
      Our emitters are shape-true to the raw vendor format. If the engine reads XDM,
      a raw field the modeling rule does not map is invisible.
    lever: Which fields each emitter must populate; SIM-CDR-015 modeling-rule substrate proof.
    affects: ["core/eal_simulator/plugins/*", "scenarios/cdr/ (SIM-CDR-015)"]

  - id: PM-ING-06
    mechanism: ING
    priority: P1
    status: open
    question: >-
      When a modeling rule exists for a vendor/product and the record's field names
      drift (case, nesting, missing optional fields), does the rule silently produce
      nulls? Is there any tenant-visible signal for low XDM field coverage?
    context: "Tolerance hides bugs: a null-filled XDM row reads as ingested."
    lever: Emitter shape tests against the published modeling rule; an XDM-coverage probe.
    affects: ["detection_scanner/ttps (modeling_rules[])"]

  - id: PM-ING-07
    mechanism: ING
    priority: P2
    status: open
    question: >-
      What rate and size limits apply to the HTTP collector (records per request,
      bytes per request, requests per second, per-tenant daily volume), and which
      status code signals throttling?
    context: High-volume analytics shapes (sweeps, brute force) can exceed a limit mid-campaign.
    lever: Emitter batching; a throttling code in the 12-code delivery taxonomy.
    affects: ["core/eal_simulator/delivery.py"]

  - id: PM-ING-08
    mechanism: ING
    priority: P2
    status: open
    question: >-
      Does the Broker VM HTTP applet behave identically to the cloud HTTP collector
      (same parsing, dataset routing, latency, limits)?
    context: The offline bundle and collector preflight treat the two doors as equivalent.
    lever: Per-door preflight expectations.
    affects: ["core/eal_simulator/bundle.py"]

  # ── STI — stitching / data fusion ────────────────────────────────────────────
  - id: PM-STI-01
    mechanism: STI
    priority: P0
    status: open
    question: >-
      Which exact fields does the data fusion engine match to link an NGFW
      traffic/threat log to an XDR agent network event: the full 5-tuple (src IP,
      src port, dst IP, dst port, protocol), a subset, or the 5-tuple plus host
      identity? Is matching done on raw fields or XDM fields?
    context: >-
      Henry's finding says the full tuple must agree. SIM-MP-006's endpoint query
      omits the local port (mp-006:131), so either the query is wrong or the port
      is not part of the key.
    lever: Which fields every network-shaped emitter and agent step must carry and agree on.
    decides:
      - if: full 5-tuple
        then: Make src_port deterministic and shared; fix the SIM-MP-006 query to include action_local_port.
      - if: subset (no src port)
        then: Drop src_port from the stitch contract; stop pinning ephemeral ports.
    experiment: >-
      Run the same agent connection twice: once with the NGFW record's src port
      matching, once off by one; see which stitches.
    affects: ["core/engine/stitch_context.py", "scenarios/multi_plane/mp-006-ngfw-container-causality-stitch.yml", "ngfw_eal_emitter"]

  - id: PM-STI-02
    mechanism: STI
    priority: P0
    status: open
    question: >-
      What time tolerance does stitching allow between the agent network event and
      the firewall record, and which firewall record does it use: session start,
      session end, or threat log? Are long-lived sessions only stitched once they
      end?
    context: >-
      Scenarios declare windows from 10 s (mp-006) to 86400 s. PAN-OS traffic logs
      are often written at session end, which can be minutes after the agent saw
      the connect.
    lever: Timing between the agent step and its firewall leg; scenario window values.
    affects: ["scenarios (correlation_window_seconds)", "ngfw_eal_emitter"]

  - id: PM-STI-03
    mechanism: STI
    priority: P0
    status: open
    question: >-
      When NAT is in play, which side of the translation does stitching use: the
      firewall's pre-NAT source (matching the endpoint's local IP) or the post-NAT
      source? Does the engine read the NGFW's NAT fields (nat source IP/port) to
      bridge the two?
    context: >-
      Henry's correction put the source in the endpoint's view. If the engine
      bridges with NAT fields, emitters must populate both pre- and post-NAT fields
      consistently, or the bridge breaks.
    lever: Which NGFW fields carry the endpoint's address; whether emitters must also fill NAT fields.
    affects: ["ngfw_eal_emitter", "third_party_firewall_emitter", "core/engine/stitch_context.py"]

  - id: PM-STI-04
    mechanism: STI
    priority: P0
    status: open
    question: >-
      For a container or Kubernetes pod egressing through node SNAT, can stitching
      link the pod's process network event (pod IP) to the firewall session (node IP
      after SNAT)? If so, by what: container_id, conntrack, an agent-reported
      translation?
    context: >-
      SIM-MP-006 asserts NGFW and container endpoint stitch on 5-tuple +
      container_id within 10 s. The firewall cannot see container_id, so the bridge
      has to come from somewhere else.
    lever: Whether SIM-MP-006 is satisfiable as authored; CDR egress scenario design.
    affects: ["scenarios/multi_plane/mp-006-ngfw-container-causality-stitch.yml", "scenarios/cdr/"]

  - id: PM-STI-05
    mechanism: STI
    priority: P0
    status: open
    question: >-
      Does network-endpoint stitching require a PAN-OS NGFW logging through Strata
      Logging Service, or are third-party firewall logs (HTTP collector or syslog)
      stitched to agent data too? If third-party works, which vendors and which
      fields?
    context: >-
      third_party_firewall_emitter and the NDR plane's `moat_tier: MOAT` claims both
      lean on the answer.
    lever: Which stitch claims third-party firewall scenarios may make; MOAT labelling.
    affects: ["third_party_firewall_emitter", "scenarios/ndr/", "scenarios/multi_plane/"]

  - id: PM-STI-06
    mechanism: STI
    priority: P1
    status: open
    question: >-
      Does stitching require the agent to have recorded its own network event for
      the connection, or can a firewall record be linked to a process from other
      evidence (a DNS query event, the host's IP at that time, an RPC/ETW event)?
    context: >-
      stitch_params.py concludes an in-process EAL emitter can never share a tuple
      with the agent. If other evidence suffices, there are more honest stitch
      paths than we model.
    lever: Whether EAL-only network legs can ever stitch; the canary_token-only adapter.
    affects: ["core/eal_simulator/stitch_params.py"]

  - id: PM-STI-07
    mechanism: STI
    priority: P1
    status: open
    question: >-
      What is the observable output of a successful stitch: fields added to the
      firewall row (e.g. actor process or causality fields), a link in the network
      story, a joined row in a specific dataset? What XQL proves "this firewall
      session was stitched to process X"?
    context: >-
