    context: 40 card BIOCs declare a `suppression_window_seconds`; we do not know what the product does by default.
    lever: Loop counts in steps; how many Result rows to expect.
    affects: ["detection_scanner/ttps (biocs[].suppression_window_seconds)"]

  - id: PM-BIO-06
    mechanism: BIO
    priority: P1
    status: open
    question: >-
      Do custom BIOCs apply retroactively to already-ingested data, or only to
