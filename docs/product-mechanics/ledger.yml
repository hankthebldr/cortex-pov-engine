  # ── IDN — identity resolution: CGO ownership, CIE, AD ────────────────────────
  - id: PM-IDN-01
    mechanism: IDN
    priority: P0
    status: open
    question: >-
      Which user does an issue report for a Linux process chain, and which user
      does the UserName grouping artifact use: the CGO's
      (causality_actor_effective_username), the parent's (actor_effective_username)
      or the process the rule matched (action_process_username)? In the lab the
      CGO had a null user while the matched process ran as `pov-target-01\www-data`
      (IDN known). Does an issue whose CGO has no user carry a user at all?
    context: >-
      The identity harness runs Linux steps as service accounts so a chain looks
      owned by www-data or postgres (harness.go:7), and 13 scenarios key on
      `stitching_key: user_principal`. If the issue takes its user from the CGO,
      every systemd-started chain on a modern host reports no user and cannot group
      by user, whatever account ran the step.
    lever: >-
      Whether identity steps must make the service account own the chain (for
      example a CGO started as that user outside systemd) or only the matched
      process; whether `user_principal` is a satisfiable stitching key for Linux
      endpoint steps.
    decides:
      - if: The issue's user is the CGO's user
        then: Identity-dependent Linux scenarios need a CGO that runs as the account; until then they declare no user-keyed grouping.
      - if: The issue's user is the matched process's user
        then: runuser -u is enough; switch the harness from `runuser -l` (needs a login shell) to `runuser -u … --`.
    experiment: >-
      Fire one Medium custom BIOC on a child of `runuser -u www-data -- /bin/sh -c
      '<canary>'` launched by the beacon, and one on the same child launched by
      `systemd-run --uid=www-data`; read the issue's user fields and the case it
      joins.
    affects: ["agent/identity/harness.go", "core/connectors/matcher.py", "scenarios/_schema.yml"]

  - id: PM-IDN-02
    mechanism: IDN
    priority: P0
    status: open
    question: >-
      Do Identity Analytics and ITDR detectors evaluate activity whose acting user
      is NT AUTHORITY\SYSTEM or the machine account (`WS01$`), for example a
      Kerberos service-ticket burst requested from a SYSTEM-context PowerShell? Or
      are machine and system principals excluded, so the attack must run as a
      domain user to be seen?
    context: >-
      A pulled Windows step runs as the beacon's service account because Windows
      identities collapse to `direct` (platform.go:212). The identity-lab design
      plans Kerberoast and AS-REP steps from native PowerShell on a workstation
      through the beacon. If the detectors skip machine and SYSTEM principals, every
      such step is a silent miss.
    lever: >-
      How a Windows identity step is launched: through the beacon as SYSTEM, or as a
      domain user (a scheduled task or a process started with that user's stored
      credential), and whether the beacon needs a run-as path for Windows.
    decides:
      - if: Machine and SYSTEM principals are excluded
        then: Windows identity scenarios need a domain-user execution path before any identity expectation is declared.
      - if: They are evaluated
        then: Pulled steps as SYSTEM are valid; record the requesting principal per run.
    experiment: >-
      On the identity lab, request service tickets for 10 SPNs from a SYSTEM-context
      process and, separately, from a domain user's logon session; compare 4769
      events and any Identity Analytics issue after the training clock.
    affects: ["agent/identity/platform.go", "agent/executor/platform_windows.go", "scenarios/itdr/"]

  - id: PM-IDN-03
    mechanism: IDN
    priority: P0
    status: open
    question: >-
      What does one `pan_dss_raw` row hold: one object per sync (a snapshot), or one
      row per change? Which field names carry the object type (user, group,
      computer), sAMAccountName, userPrincipalName, objectSid, memberOf, adminCount,
      userAccountControl, servicePrincipalName, description and the sync time?
    context: >-
      The identity-lab design proves the CIE sync with a canary user whose
      description carries a nonce, and its day-one detections join DC events to
      `pan_dss_raw` on these attributes. No card reads `pan_dss_raw` today, and the
      field names are unverified.
    lever: >-
      The sync-canary query, the join keys of every CIE-context card, and whether a
      join must take the latest row per object.
    experiment: >-
      With CIE linked, create a canary user, change its description twice 10 minutes
      apart, add it to a group; query `pan_dss_raw` for it after each change and
      record row count and field names.
    affects: ["detection_scanner/ttps", "core/connectors/preflight.py"]

  - id: PM-IDN-04
    mechanism: IDN
    priority: P0
    status: open
    question: >-
      Do the Identity Analytics detectors read CIE attributes as inputs, so that a
      Kerberoast against an account fires only when CIE already shows that account
      with a servicePrincipalName (or adminCount = 1), and an AS-REP request only when
      CIE shows DONT_REQ_PREAUTH? Or do they read the DC's events alone and use CIE
      only to enrich the issue?
    context: >-
      CIE must be linked to activate the Identity Analytics rules (IDN known), but
      the docs do not say what the detectors read from it. The lab seeds bait
      accounts (an SPN-backed `svc-sql`, a no-preauth `helpdesk-admin`) and runs the
      attack minutes later.
    lever: >-
      Scenario pacing: whether each bait account must be visible in `pan_dss_raw`
      before the attack step runs, and whether the bait's privilege must be set in
      AD itself or is irrelevant to the detector.
    decides:
      - if: Detectors read CIE attributes
        then: Each identity scenario gains a sync-wait gate between seeding and attack, proven by the canary.
      - if: Detectors read events only
        then: Seeding can happen at build time; CIE only matters for enrichment and custom joins.
    affects: ["scenarios/itdr/", "core/eal_simulator/analytics_alerts.py"]

  - id: PM-IDN-05
    mechanism: IDN
    priority: P1
    status: open
    question: >-
      How long after a change in Active Directory (a new user, a group membership, a
      description edit) does it appear in `pan_dss_raw`, and does an issue raised in
      between carry the old or the new attributes? Docs say incremental sync runs
      every 5 minutes: is that from the agent's last run, and are deletions synced
      as tombstones or by absence?
    context: >-
      Identity scenarios often seed a change and abuse it minutes later ("add user to
      a privileged group, then use it"). If the issue reads CIE context at alert
      time, a change that has not synced yet makes the detection describe the user
      wrongly or not fire.
    lever: The minimum wait between a seeding step and the attack step; the staleness threshold of the sync canary (the design waits 10 minutes).
    experiment: >-
      Rewrite the canary's description at T0 and poll `pan_dss_raw` every 30 s for
      20 minutes; repeat 5 times and record the delay distribution. Delete a test
      user and see whether a row says so.
    affects: ["scenarios/itdr/", "core/connectors/preflight.py"]

  - id: PM-IDN-06
    mechanism: IDN
    priority: P0
    status: open
    question: >-
      Where does a domain controller's Kerberos and logon telemetry land when it is
      collected by the XDR agent with XTH: xdr_data `event_type = EVENT_LOG` with the
      event id and data fields, or a separate dataset? Which fields carry the 4769
      ticket encryption type, service name and client address, and the 4768
      pre-authentication type? When the same events come through the Broker VM
      Windows Event Collector, are they in `microsoft_windows_raw` under different
      names?
    context: >-
      Nine cards read `msft_windows_security`, a dataset name a tenant does not
      create, and the AD emitter writes records under that name
      (ad_windows_emitter.py:66). Card queries and emitter fields are both built on
      an unverified shape.
    lever: The AD emitter's field names and dataset; the dataset and fields every AD card queries.
    decides:
      - if: Agent events land in xdr_data EVENT_LOG and WEC in microsoft_windows_raw
        then: Cards carry two query variants and the emitter targets the WEC shape only.
      - if: Both land in one dataset with one schema
        then: One card variant; the emitter targets that schema.
    experiment: >-
      On a lab DC with the agent (XTH) and WEC both collecting, request one service
      ticket with RC4 and one AS-REP for a no-preauth account; query xdr_data,
      `microsoft_windows_raw` and the dataset list for both events.
    affects: ["core/eal_simulator/plugins/ad_windows_emitter.py", "detection_scanner/ttps"]

  - id: PM-IDN-07
    mechanism: IDN
    priority: P0
    status: open
    question: >-
      Can Windows Security events that arrive through an HTTP log collector (what the
      AD emitter sends) feed any Identity Analytics or ITDR detector, even with an XDM
      modeling rule mapping them? Or do those detectors read only events collected by
      the XDR agent with XTH or by the Broker VM Windows Event Collector, as their
      Required Data lists suggest?
    context: >-
      The AD emitter backs ABIOC and Analytics expectations for Kerberoasting,
      pass-the-hash and DC logons (ad_windows_emitter.py:27). If those detectors
      never read collector data, each such expectation is unsatisfiable by
      construction and would read `missed` on a healthy tenant.
    lever: Whether AD-emitter steps may declare Analytics or ABIOC expectations, or only XQL and correlation ones; the ingestion route marked for the AD source.
    decides:
      - if: Agent or WEC only
        then: Mark the AD emitter's analytics route not_armable and move its expectations to custom XQL or correlation rows.
      - if: XDM-modeled collector data works
        then: Document the modeling rule as a tenant prerequisite and preflight it.
    experiment: >-
      With a modeling rule mapping the emitter's records, POST a 4769 burst for 10
      SPNs from one account through the collector on a tenant past the training
      clock; compare with the same burst produced on a real DC.
    affects: ["core/eal_simulator/plugins/ad_windows_emitter.py", "core/eal_simulator/ingestion_routes.py"]

  - id: PM-IDN-08
    mechanism: IDN
    priority: P1
    status: open
    question: >-
      When one CIE instance syncs more than one directory (on-prem AD, Entra ID,
      Okta), does it merge accounts that belong to one person into one identity, on
      which attribute, and which field on an issue names the merged identity?
    context: >-
      Cross-source identity scenarios plant one principal in AD, Entra and Okta
      records and expect one person to resolve across them (analytics_emitter.py
      canary bindings); nothing says the product merges them.
    lever: Which attribute the emitters must keep identical across sources (UPN, email, objectSid, an immutable id).
    affects: ["core/eal_simulator/analytics_emitter.py", "core/eal_simulator/plugins/idp_signin_emulator.py"]

  - id: PM-IDN-09
    mechanism: IDN
    priority: P1
    status: open
    question: >-
      Does Cortex have a native decoy or honey-identity feature (an account flagged
      by a CIE attribute, a group or a tenant setting) that raises an issue on any
      authentication, or is "honey account touched" only ever a custom rule?
    context: >-
      The identity-lab design seeds a honey account and plans a custom join for it.
      If a native feature exists, the scenario should exercise that instead and the
      custom rule is redundant.
    lever: How the lab marks its honey account and which expectation type the scenario declares.
    affects: ["scenarios/itdr/", "detection_scanner/ttps"]

