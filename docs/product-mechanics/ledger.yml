  # ── ALR — alert records and read-back ────────────────────────────────────────
  - id: PM-ALR-01
    mechanism: ALR
    priority: P0
    status: open
    question: >-
      Which field on an alert or issue record carries the identifier of the rule
      that raised it, for each source: custom BIOC, Analytics BIOC, Analytics,
      correlation rule, IOC, XDR agent prevention? Is it stable across content
      updates and tenants?
    context: >-
      Lab alerts carried none of the four keys the connector reads (ALR known), so
      matching fell back to technique plus name, the weakest key the matcher has.
    lever: >-
      The connector's rule-id field list (PR 179 added the Issues API's
      `detection.rule_id` as a fallback); card detections record that identifier
      so the matcher can key on it; preflight stops reporting PARTIAL.
    affects: ["core/connectors/xsiam.py", "core/connectors/matcher.py", "core/connectors/preflight.py"]

  - id: PM-ALR-02
    mechanism: ALR
    priority: P0
    status: open
    question: >-
      Which timestamp on an alert is the time of the event that triggered it, and
      which is the time the platform raised the alert: `detection_timestamp`,
      `creation_time`, `local_insert_ts`, or another field? Does the answer differ
      by alert source?
    context: >-
      MTTD is the alert time minus the step's executed_at, and the connector takes
      detection_timestamp first (ALR assumes). If detection_timestamp is the
      triggering event's own time, every MTTD we report measures nearly zero
      instead of detection latency, and it would pass any threshold.
    lever: The connector's timestamp order; the MTTD definition in the report.
    decides:
      - if: detection_timestamp is event time
        then: Use the creation or insert time for MTTD and keep the event time as evidence of which step fired it.
      - if: detection_timestamp is raise time
        then: Keep the order and document it as proven.
    experiment: >-
      Fire a scheduled correlation rule (10-minute grid) on a canary event; compare
      each timestamp field with the canary's `_time` and the rule's run time.
    affects: ["core/connectors/xsiam.py", "core/connectors/service.py"]

  - id: PM-ALR-03
    mechanism: ALR
    priority: P1
    status: open
    question: >-
      Is the MITRE technique on a built-in alert fixed by the detector's content,
      whatever the activity was, and is that detector-to-technique mapping
      published anywhere we can read (content metadata, an API, the alert page)?
    context: >-
      The lab's built-in alert on useradd and chpasswd carried T1003 while the
      scenario declared T1136.001 (ABI known); a technique-keyed match can then
      credit or miss the wrong Result.
    lever: Cards list the technique each built-in detector they expect actually carries; matcher technique aliases.
    affects: ["core/connectors/matcher.py", "detection_scanner/ttps (analytics_modules[])"]

  - id: PM-ALR-04
    mechanism: ALR
    priority: P1
    status: open
    question: >-
