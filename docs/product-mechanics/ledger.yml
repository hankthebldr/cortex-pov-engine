    context: Drives MTTD expectations and matcher windows.
    lever: Matcher window for BIOC; MTTD interpretation.
    affects: ["core/connectors/matcher.py"]

  - id: PM-BIO-05
    mechanism: BIO
    priority: P1
    status: open
    question: >-
      Do BIOCs deduplicate or suppress repeats (same rule, same host or causality,
