      needs an endpoint trigger that is known to fire. Operator observation, not
      an answer (2026-11-11): in run fac6e8d5 (SIM-EDR-023, which executes the
      WildFire test ELF it stages), the lab Linux agent raised Local Analysis
      Malware (HIGH) on the execution. That says exec fires; it does not say
      whether a write or chmod alone would.
    lever: >-
      Whether endpoint-trigger steps must execute their artifact, and which
      benign artifact CortexSim uses as the canonical agent trigger for stitch
      pairing.
    decides:
      - if: scan on write
        then: Keep staging-only steps; investigate why the lab profile did not alert (module off, exception).
      - if: exec only
        then: Endpoint-trigger steps execute the WildFire test ELF under report mode; record the exec in step_outcomes.
    experiment: >-
      On the lab VM in report mode, execute /var/tmp/.hidden_wildfire_samples/test_elf
      once and query the tenant for an agent issue on that host for 15 minutes.
    affects: ["scenarios/cdr/cdr-012-wildfire-in-container-misconfig.yml"]

  # ── INC — incident grouping ──────────────────────────────────────────────────
  - id: PM-INC-01
    mechanism: INC
    priority: P0
    status: open
